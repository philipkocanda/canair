# Local git pre-commit hooks that mirror the CI gates, so "green locally"
# implies "green in CI". Enable once per clone with:
#
#     uv run pre-commit install --install-hooks
#     uv run pre-commit install --hook-type pre-push
#
# All hooks run the project's own tooling via `uv run`, so they use exactly the
# ruff/ty pinned in pyproject.toml (no drift from a separately-pinned mirror).
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # ── commit stage: fast gates on the files being committed ──────────────
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ty
        name: ty check (canlib/)
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      # ── push stage: the generated-artifact currency checks CI enforces ─────
      # Slower and repo-wide, so they run on push rather than every commit.
      - id: cli-reference-current
        name: CLI reference is current
        entry: uv run python scripts/gen_cli_reference.py --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: profiles-index-current
        name: bundled-profiles index is current
        entry: uv run python scripts/gen_profiles_index.py --check
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Normalize line endings on committed JSON. canair's capture writer always
  # emits LF, but a capture file created/edited on Windows (or pasted through a
  # CRLF editor) can sneak in \r bytes — noise in the append-only session logs
  # and in diffs. Strip them to LF at commit time.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        name: normalize JSON line endings to LF
        args: [--fix=lf]
        types_or: [json]
