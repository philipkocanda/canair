# Local git pre-commit hooks that mirror the CI gates, so "green locally"
# implies "green in CI". Enable once per clone with:
#
#     uv run pre-commit install --install-hooks
#
# One command is enough: `default_install_hook_types` below is what `install`
# uses when no `--hook-type` is given, so all three stages get installed.
#
# Most hooks run the project's own tooling via `uv run`, so they use exactly the
# ruff/ty pinned in pyproject.toml (no drift from a separately-pinned mirror).
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: local
    hooks:
      # ── commit stage: fast gates on the files being committed ──────────────
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ty
        name: ty check (canlib/)
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: validate-skills
        name: skill frontmatter is Claude Code / OpenCode compatible
        entry: uv run python scripts/validate_skills.py
        language: system
        files: ^\.claude/skills/.*/SKILL\.md$
        pass_filenames: false

      # ── push stage: the generated-artifact currency checks CI enforces ─────
      # Slower and repo-wide, so they run on push rather than every commit.
      - id: cli-reference-current
        name: CLI reference is current
        entry: uv run python scripts/gen_cli_reference.py --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: profiles-index-current
        name: bundled-profiles index is current
        entry: uv run python scripts/gen_profiles_index.py --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: screenshots-current
        name: doc screenshots are current
        entry: uv run python scripts/gen_screenshots.py --check
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Normalize line endings on committed JSON. canair's capture writer always
  # emits LF, but a capture file created/edited on Windows (or pasted through a
  # CRLF editor) can sneak in \r bytes — noise in the append-only session logs
  # and in diffs. Strip them to LF at commit time.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        name: normalize JSON line endings to LF
        args: [--fix=lf]
        types_or: [json]

  # ── commit-msg stage: enforce Conventional Commits ─────────────────────────
  # release-please derives the version bump and the changelog section from the
  # commit subject, and it does so *silently*: a subject with an unrecognized
  # type is dropped from the release notes without complaint, and one with no
  # `type:` at all parses as nothing. That failure is invisible until a release
  # is cut with a hole in it, so it is caught here instead.
  #
  # The type list is a shared vocabulary — it must stay in step with
  # `release-please-config.json`'s `changelog-sections` and the commit-message
  # rules in `.claude/skills/contributing-code/SKILL.md`. It is spelled out
  # rather than left to the hook's defaults so a `rev` bump cannot move it.
  #
  # Deliberately NOT `--strict` (that rejects merge commits, which this repo
  # uses) and NOT `--force-scope` (repo-wide changes have no meaningful scope).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [build, chore, ci, deps, docs, feat, fix, perf, refactor, revert, style, test]
