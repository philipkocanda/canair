# Variants Schema (human-readable companion)
# Validates the optional profiles/<name>/variants.yaml.
#
# A profile describes one model generation with one drivetrain. A variant is a version
# of that car the owner can name — a battery size, a facelift, a market with different
# diagnostics. This file gives each variant a stable ID and typed metadata, says which
# ECU revisions that car can carry, and which profile.yaml settings differ for it.
# List or edit with `canair variants`.
#
# Top-level structure:
#   variants:                     # mapping keyed by variant ID
#     <id>:                       # lower-case words joined by '-', at least one letter;
#                                 # local to the profile, naming only what differs
#                                 # (e.g. 28kwh, 38kwh-us), never a year
#       name: str                 # required — human-readable name
#       model_code: str           # optional — the maker's model code (e.g. AEEV, F30)
#       designation: str          # optional — the maker's name for it (e.g. IONIQ EV PE)
#       generation: str           # optional — generation code (e.g. AE, OS, ZE1)
#       production: [str, str]    # optional — build window, "YYYY" or "YYYY-MM", quoted
#       model_years: [int, int]   # optional — informational; markets disagree on it
#       markets: [str, ...]       # optional — where it was sold (e.g. EU, US, KR)
#       battery:                  # optional — mapping:
#         usable_kwh: number      #   usable capacity
#         gross_kwh: number       #   gross capacity
#         nominal_voltage: number #   pack nominal voltage, in volts
#         series_cells: int       #   cells (or parallel cell groups) in series
#         parallel_cells: int     #   cells in parallel per series group (2 for 192s2p)
#         modules: int            #   modules in the pack
#         chemistry: str          #   e.g. Li-polymer, NMC, LFP
#         cell_format: str        #   e.g. pouch, prismatic, cylindrical
#         cell_supplier: str      #   who makes the cells, e.g. SK On
#         cooling: str            #   e.g. air, liquid
#       trims: [str, ...]         # optional — informational only, never a variant
#       revisions:                # optional — ECU name -> the revisions of that ECU (its
#         BMS: [kwp]              #   ecus/ file's revisions: keys) this car can carry; an
#                                 #   unlisted ECU may be any of its revisions
#       profile_overrides:        # optional — profile.yaml settings that differ for this
#         <setting>: value        #   car, replaced whole: car_model, physical_bands,
#                                 #   response_timeout_ms, init, multi_did_max, quirks
#       status: str               # optional — verified | community | seed
#       sources: [str, ...]       # optional — where each fact came from
#       notes: str                # optional
#
# A battery-named ID (28kwh) must agree with the battery it states: usable_kwh when
# given, else gross_kwh, compared by whole kWh. Every ECU and revision a variant's
# `revisions:` names must exist in ecus/ (`canair validate variants`).
# Validated by `canair validate variants` (canlib/variants/__init__.py::check_variants_doc,
# whose VARIANT_FIELDS, BATTERY_FIELDS and PROFILE_OVERRIDE_FIELDS are the authoritative
# field lists;
# tests/test_variants.py pins this file to them).

variant_id_pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

required_variant_fields:
  - name

optional_variant_fields:
  - model_code
  - designation
  - generation
  - production
  - model_years
  - markets
  - battery
  - trims
  - revisions
  - profile_overrides
  - status
  - sources
  - notes

battery_fields:
  - usable_kwh
  - gross_kwh
  - nominal_voltage
  - series_cells
  - parallel_cells
  - modules
  - chemistry
  - cell_format
  - cell_supplier
  - cooling

valid_statuses:
  - verified
  - community
  - seed

profile_override_fields:
  - car_model
  - physical_bands
  - response_timeout_ms
  - init
  - multi_did_max
  - quirks
