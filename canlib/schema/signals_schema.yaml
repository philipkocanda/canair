# Broadcast Signal Definition Schema (human-readable companion)
# Validates profiles/<name>/signals/<bus>.yaml — the domain-B analogue of a PID's
# `parameters:` for periodic broadcast CAN frames.
#
# Where domain-A diagnostic PIDs use a freeform WiCAN `expression` over Bnn byte
# indices, a broadcast signal uses a **DBC-compatible linear model**
# (physical = raw * scale + offset) over a contiguous bit range — deliberately, so
# it round-trips to/from DBC (`canair import dbc` / `export dbc`). One file per CAN
# bus (e.g. signals/powertrain.yaml), keyed by arbitration ID — NOT under a per-ECU
# section, because a broadcast ID is not a diagnostic request/response pair.
#
# Top-level structure:
#   bus: str                # optional — logical bus name (powertrain/body/chassis)
#   bitrate: int            # optional — bus bitrate in bit/s (e.g. 500000)
#   messages:               # mapping keyed by arbitration ID (hex string, e.g. "0x220")
#     "0x220":
#       name: str           # optional — message name (DBC BO_ name)
#       tx_ecu: str         # optional — transmitting ECU (annotation; not a request TX)
#       length: int         # optional — data length in bytes (DBC BO_ DLC): 0-8, or a
#                           # CAN FD size 12/16/20/24/32/48/64; must hold every signal.
#                           # `export dbc` falls back to the smallest one that does
#       extended: bool      # optional — 29-bit frame; default: true above 0x7FF. Stored
#                           # only when it differs (an extended frame numbered <= 0x7FF)
#       fd: bool            # optional — CAN FD frame; default: true above 8 bytes. Stored
#                           # only when it differs (an FD frame of 8 bytes or fewer)
#       signals:            # mapping keyed by signal name
#         GEAR:
#           start_bit: int  # required — bit offset (0 = first bit of byte 0)
#           length: int     # required — bit length (>= 1)
#           byte_order: str # optional — little | big (DBC @1 / @0); default little.
#                           # start_bit follows DBC: for big it is the field's MSB
#                           # (bit 7 of byte 0 is 7; a 16-bit field in bytes 0-1 is 7|16@0)
#           signed: bool    # optional — two's-complement raw value (DBC @0- / @1-);
#                           # default false (unsigned, DBC @0+ / @1+), stored as absence
#           float: bool     # optional — IEEE 754 raw value (DBC SIG_VALTYPE_); length
#                           # must then be 32 or 64; default false (integer)
#           scale: number   # optional — physical = raw*scale + offset; default 1; not 0
#           offset: number  # optional — default 0
#           min: number     # optional
#           max: number     # optional
#           unit: str       # optional
#           type: str       # optional — typed decoding, see below
#           values: map     # optional — enum labels, see below
#           bits: map       # optional — bitmask labels, see below
#           verified: bool  # optional — confirmed on THIS car (default false)
#           source: str     # optional — provenance (DBC, log file, RE evidence)
#           notes: str      # optional
#
# Arbitration IDs match ^0x[0-9A-Fa-f]+$ and are at most 0x1FFFFFFF (29 bits). One
# file keys messages by number alone, so a standard and an extended frame with the
# same number cannot share a bus file (`import dbc` refuses such a DBC).
# Validated structurally by `canair validate signals`
# (canlib/validation/signals.py::check_signals_doc, whose SIGNAL_FIELDS and MESSAGE_FIELDS
# are the authoritative field lists; tests/test_signals_schema.py pins this file to them).

message_id_pattern: "^0x[0-9A-Fa-f]+$"

optional_toplevel_fields:
  - bus
  - bitrate
  - messages

optional_message_fields:
  - name
  - tx_ecu
  - length
  - extended
  - fd
  - signals

valid_message_lengths: [0, 1, 2, 3, 4, 5, 6, 7, 8, 12, 16, 20, 24, 32, 48, 64]

required_signal_fields:
  - start_bit
  - length

optional_signal_fields:
  - byte_order
  - signed
  - float
  - scale
  - offset
  - min
  - max
  - unit
  # --- typed (multi-modal) decoding — parity with domain-A PID params ------
  # A broadcast signal is a linear scalar by default. Declaring `type:` attaches
  # the same parallel typed decoding as a diagnostic PID param (see
  # canlib/decode_value.py + pids_schema.yaml). The linear scale/offset still
  # yields the raw value the typed layer interprets. Labels must be strings (quote
  # on/off/yes/no, which YAML would otherwise read as booleans).
  - type            # numeric (default) | enum | bitmask | ascii | date | bcd
  - values          # enum only: {raw_int: "label", ...}
  - bits            # bitmask only: {bit_index: "label", ...}  (0 = LSB, 0-63)
  - verified
  - source
  - notes

float_signal_lengths: [32, 64]

valid_signal_types:
  - numeric
  - enum
  - bitmask
  - ascii
  - date
  - bcd

byte_order_values:
  - little
  - big
