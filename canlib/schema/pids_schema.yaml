# ECU Definition Schema
# Validates the per-ECU YAML files in the profile's `ecus/` directory.
# Each file is the SINGLE source of truth for one ECU: address, identity,
# probe history, DTC meanings, and all readable/actuatable data.
# Run: canair validate pids   (alias: canair validate ecus)
#
# Each ECU file (e.g. bcm.yaml) must have this top-level structure:
#   ECU_NAME:              # the canonical short name IS the top-level key
#     tx_id: 0xNNN         # required — hex OBD-II request arbitration ID. 11-bit
#                          #   (0x000-0x7FF) for normal addressing; a full 29-bit
#                          #   id (e.g. 0x18DA10F1) when the profile/ECU addressing
#                          #   mode is a 29-bit mode.
#     rx_id: 0xNNN         # optional — hex CAN response address. Defaults to
#                          #   tx_id + the profile's addressing.rx_offset (itself
#                          #   defaulting to +0x08) for 11-bit modes, or the
#                          #   byte-swapped id for normal_fixed_29bit. Set this only
#                          #   for an ECU whose response address doesn't follow the
#                          #   profile's rule (an irregular per-ECU mapping).
#     identity:            # optional — who this module is (see identity_fields)
#       description: str   # human-readable module name
#       part_number: str   # from F187/F188 (UDS) or 1A 8x (KWP2000)
#       id_protocol: UDS   # how identity DIDs are read (see valid_id_protocols)
#       ...                # see identity_fields below
#     can_bus: [...]       # optional — physical CAN bus segment(s) the ECU sits on.
#                          #   A list of codes drawn from the profile's own
#                          #   can_buses.yaml vocabulary (vendor-specific: Hyundai
#                          #   B-CAN/P-CAN/C-CAN/MM-CAN/H-CAN, Ford HS/MS, …). Some
#                          #   ECUs span more than one segment (e.g. [H-CAN, P-CAN]);
#                          #   the gateway is [ALL].
#     vehicle_states: [...]  # optional — ECU-level power states in which this
#                          #   ECU responds to session control (1001).
#                          #   Tokens: sleep, plugged, acc, acc2, ready, charging
#     session: bool        # optional — requires extended diagnostic session (10 03)
#     sessions:            # optional — supported diagnostic session types, keyed by the
#                          #   DiagnosticSessionControl (service 0x10) sub-function.
#                          #   Populated by `canair scan sessions`. See sessions_fields.
#       "81":              # sub-function hex (UDS: 01/02/03…; KWP2000: 81/82/83…)
#         name: standardDiagnosticSession
#         supported: true  # 50 xx positive response
#       "83":
#         supported: false # NRC-based
#         nrc: 0x12
#         nrc_desc: subFunctionNotSupported
#     scan_log:            # optional — probe-history audit (see scan_log_entry_fields)
#       - service: 0x22
#         range: "0101-010F"
#         date: 2026-07-22
#         hits: 0
#     dtcs:                # optional — manufacturer DTC meanings (see dtcs_fields)
#       B2915:
#         description: str
#     pids:                # optional — readable PIDs (identity-only modules omit this)
#       PID_CODE:          # e.g. 22C00B, 2101
#         period: N        # polling interval in ms (optional, default 5000)
#         status: STR      # REQUIRED — PID lifecycle, explicit on every PID. One of:
#                          #   active  — real & live: indexed, swept, queryable, shipped
#                          #             to the WiCAN device profile. (the default)
#                          #   draft   — discovered/undecoded placeholder or speculative
#                          #             work: indexed, swept, queryable, but NOT shipped.
#                          #   static  — unchanging identity/calibration block: queryable
#                          #             and analysed, but skipped in a bare-ECU sweep
#                          #             (needs --include-static) and NOT shipped.
#                          #   ignored — dead/useless DID (NRC, no decodable data): a
#                          #             documented tombstone excluded from ALL tooling.
#                          # Confidence (`verified:`) is a SEPARATE, per-parameter axis.
#         vehicle_states: [...]  # optional — power states in which this PID responds
#         variable_length: bool  # optional — PID returns variable-length responses
#                                #   (legit; a short payload is not truncation)
#         notes: str       # optional — PID-level notes
#         parameters:
#           PARAM_NAME:
#             expression: str     # required — WiCAN formula
#             unit: str           # optional — display unit
#             ...                 # see optional_param_fields below
#
# Profile-wide settings live one level up in `<profile>/profile.yaml`:
#   car_model: str
#   init: str              # AT command init string (ELM327/wican-ws transport only)
#   response_timeout_ms: int   # ELM ATST response timeout in ms (--elm-timeout overrides)
#   can_bitrate: int       # optional — vehicle bus speed in bit/s (default 500000).
#                          #   Config transport.bitrate > this > device config > 500000.
#   addressing: {...}      # optional — CAN diagnostic addressing rule:
#                          #   mode: normal_11bit (default) | normal_29bit |
#                          #     normal_fixed_29bit | normal_extended_11bit |
#                          #     extended_29bit. Selects how the CAN arbitration ids
#                          #     are formed. normal_fixed_29bit is the ISO
#                          #     0x18DA{target}{tester} diagnostic convention
#                          #     (Ford/VAG/etc.); its response id is derived by swapping
#                          #     the address bytes (no rx_offset). normal_extended_11bit
#                          #     is the ISO-TP extended (mixed) 11-bit scheme (BMW 0x6F1,
#                          #     PSA/Stellantis): an 11-bit header plus a per-ECU target
#                          #     -address extension byte in the payload. A per-ECU
#                          #     addressing.mode overrides this profile default.
#                          #   rx_offset: int  # response = tx_id + this (default 0x08;
#                          #     11-bit modes only). May be negative (PSA -0x20). Set once
#                          #     here for a make with a non-standard fixed offset (e.g.
#                          #     XPeng 0x80); per-ECU rx_id overrides it.
#                          #   target_address: int  # profile-default ISO-TP target
#                          #     extension byte (extended modes; usually per-ECU).
#                          #   source_address: int  # tester address (default 0xF1;
#                          #     extended-11-bit modes).
#   multi_did_batching: bool   # profile default for per-ECU service-22 multi-DID batching
#   failure_types: {0xNN: str} # optional — DTC failure-type byte meanings (profile-wide)
#   quirks: [str]          # optional — make-specific behavior toggles the profile opts
#                          #   into (make-neutral profiles omit). Known: hk_f1xx_minus_one
#                          #   (Hyundai/Kia identity DIDs answer one less than requested,
#                          #   22F188 -> 62F187; echo validation tolerates it for F1xx).
#   isotp: {...}           # optional — client-side ISO-TP tuning (slcan-tcp transport):
#                          #   tx_padding/blocksize/stmin/rx_flowcontrol_timeout/
#                          #   rx_consecutive_frame_timeout/can_fd/tx_data_length.
#                          #   Defaults suit 11-bit/classic-CAN; see
#                          #   canlib/transport/isotp_params.py for every field.

required_ecu_fields:
  - tx_id

optional_ecu_fields:
  - identity        # ECU identity (name/part-number/protocol) — see identity_fields
  - rx_id           # CAN response address override (default tx_id + profile rx_offset)
  - addressing      # Per-ECU addressing override — a mapping with `mode:` (see the
                    #   profile addressing block); overrides the profile-wide mode.
                    #   May also carry `target_address` (ISO-TP extension byte, per
                    #   module for extended-11-bit BMW/PSA schemes), `source_address`
                    #   (tester address, default 0xF1), and `fc_id` (flow-control
                    #   arbitration override for functional-TX / physical-RX ECUs,
                    #   e.g. Renault/Mitsubishi).
  - can_bus         # Physical CAN bus segment(s) the ECU sits on — see valid_can_bus_codes
  - vehicle_states  # ECU-level: power states in which the ECU responds (10 01)
  - session
  - sessions        # Supported diagnostic session types (service 0x10) — see sessions_fields
  - multi_did       # bool: attempt UDS service-22 multi-DID batching on this ECU
  - response_timeout_ms  # int: per-ECU UDS response budget in ms (slow ECUs get more;
                         #   overridden by the global --timeout flag). See canlib.timeouts.
  - scan_log        # Probe-history audit log — see scan_log_entry_fields below
  - dtcs            # Manufacturer-specific DTC meanings — see dtcs_fields below
  - pids            # Readable PIDs (omit for identity-only modules like AMP/SRS)
  - iocontrol       # IOControl (service 2F) commands — see iocontrol_fields below
  - iocontrol_discoveries  # Raw 0x2F SF 00 scanner output — see iocontrol_discoveries_fields
  - research        # Untested/undecoded PIDs and scan TODOs — see research_fields below
  - routines        # RoutineControl (service 0x31) discoveries — see routines_fields below

# Identity section (under ECU_NAME.identity) — who this module is. The canonical
# short name is the top-level ECU key, not a field here. All fields optional.
identity_fields:
  optional:
    - alias          # secondary name the ECU self-identifies as (e.g. SMK for SKM)
    - description    # human-readable module name
    - part_number    # from F187/F188 (UDS) or 1A 8x (KWP2000)
    - mfg_date       # manufacturing / calibration date
    - hw_version
    - sw_version
    - hw_sw          # combined hardware/software id (some ECUs)
    - boot_sw        # bootloader software version
    - app_sw         # application software version
    - fw_version
    - firmware
    - software        # legacy alias for firmware/sw_id (some ECU identity blocks)
    - serial         # from F18C/F18B
    - ecu_id         # from F110 / KWP2000 1A8C
    - sw_id
    - calibration
    - supplier
    - diag_address   # from F1A0
    - vin            # from F190
    - id_protocol    # how identity DIDs are read (see valid_id_protocols)
    - identity_confidence  # how sure we are of this ECU's identity (see valid_identity_confidence)
    - notes

# Accepted values for the top-level `can_bus:` list are NOT fixed here — bus
# naming is vendor-specific, so each profile declares its own vocabulary in
# `<profile>/can_buses.yaml` (schema: can_buses_schema.yaml). `validate pids`
# checks each ECU's `can_bus` values against that per-profile list.

# Accepted values for identity.id_protocol.
valid_id_protocols:
  - UDS            # ISO 14229 — identity via 22 F1xx
  - KWP2000        # ISO 14230 — identity via 1A 8x/9x
  - none           # responds to session control but exposes no identity DIDs
  - unknown        # not yet determined

# Accepted values for identity.identity_confidence — how well-established the
# ECU's identity is. Omit to let the tool derive it from evidence.
#   confirmed    — identity read from the ECU (part number) and/or physically
#                  or behaviorally verified for this car.
#   probable     — self-reported identity fields present, OR multiple converging
#                  circumstantial evidences.
#   tentative    — single weak basis (cross-vehicle address match or behavioral
#                  guess) with no self-reported identity.
#   speculative  — address-proximity or naming guess with little/no support.
valid_identity_confidence:
  - confirmed
  - probable
  - tentative
  - speculative

# scan_log section (under ECU_NAME.scan_log) — a list of probe outcomes tracking
# which UDS/KWP service+range combos were tried on this ECU.
scan_log_entry_fields:
  optional:
    - service
    - range
    - date
    - hits
    - probes
    - vehicle_states
    - notes

# dtcs section (under ECU_NAME.dtcs) — manufacturer-specific meanings for this
# ECU's Diagnostic Trouble Codes. Keys are the base SAE code WITHOUT the -FTB
# suffix (e.g. B2915, not B2915-00). The tool derives structural interpretation
# (category / generic-vs-manufacturer / failure-type byte) on its own; this
# supplies the meanings it cannot infer. Profile-wide failure-type byte meanings
# live in <profile>/profile.yaml under `failure_types:`.
dtcs_fields:
  optional:
    - description
    - causes
    - source
    - source_links
    - verified
    - notes

# sessions section (under ECU_NAME.sessions) — the diagnostic session types
# (DiagnosticSessionControl, service 0x10) this ECU supports, as probed by
# `canair scan sessions`. Keys are the 0x10 sub-function hex WITHOUT the 0x10
# prefix, quoted so all-digit values keep their hex meaning:
#   UDS      : 01 (default), 02 (programming — NOT probed), 03 (extended), …
#   KWP2000  : 81 (standard), 82, 83 (extended), 85 (programming — NOT probed), …
# Each entry records whether the mode is supported (a 50 xx positive response)
# and, for unsupported modes, the negative response code that was returned.
# Example:
#   sessions:
#     "81":
#       name: standardDiagnosticSession   # optional human label
#       supported: true                   # 50 81 positive
#     "83":
#       supported: false
#       nrc: 0x12                         # subFunctionNotSupported
#       nrc_desc: subFunctionNotSupported
#       notes: "extended session not implemented on this ECU"
# Exactly the safe read-only session modes are probed; programming sessions
# (UDS 0x02, KWP2000 0x85) are never sent.
sessions_fields:
  optional:
    - name
    - supported
    - nrc
    - nrc_desc
    - response
    - vehicle_states
    - date
    - verified
    - notes

required_pid_fields:
  - status           # PID lifecycle: active | draft | static | ignored.
                     #   Required + explicit on every PID (no implicit default in
                     #   the data). Semantics:
                     #   active  — indexed, swept, queryable, shipped to the device.
                     #   draft   — indexed/swept/queryable but NOT shipped (placeholder
                     #             or speculative work not yet ready for the device).
                     #   static  — unchanging identity/calibration block: queryable &
                     #             analysed, skipped in a bare-ECU sweep (unless
                     #             --include-static) and NOT shipped.
                     #   ignored — dead/useless DID: documented tombstone, excluded
                     #             from ALL tooling (index/query/coverage/profile).

optional_pid_fields:
  - period
  - variable_length   # bool: this PID legitimately returns variable-length
                      #   responses (the ECU populates a different number of
                      #   trailing bytes/records depending on state or content),
                      #   so a shorter-than-usual payload is NOT evidence of a
                      #   truncated ISO-TP read. Omit (or false) for a
                      #   fixed-length PID, where a short payload is suspect.
                      #   Truncation is guarded at capture time regardless (the
                      #   ISO-TP declared-length check in parse_uds_response);
                      #   this flag documents intent for analysis/lint tooling.
  - vehicle_states   # Power states in which this PID responds. Array of tokens:
                     #   sleep    — deep sleep, 12V standby only (unplugged)
                     #   plugged  — charge cable connected (AC or DC)
                     #   acc      — ACC1, one start button press, accessory power
                     #   acc2     — ACC2/IGN, two presses without brake, full ignition, no HV
                     #   ready    — brake + start, HV active, driveable
                     #   charging — actively charging (implies plugged)
                     # These are independent properties — e.g. [sleep, plugged] means
                     # the ECU responds both during unplugged sleep AND when plugged in.
                     # A profile's vehicle_states.yaml may add composite tokens (parked/driving).
                     # Empty array [] means untested/unknown. Omitting is also valid.
  - notes
  - parameters

# Accepted values for a PID's `status:` lifecycle field.
valid_pid_status:
  - active
  - draft
  - static
  - ignored

required_param_fields:
  - expression

optional_param_fields:
  - unit
  - ha_class
  - mqtt_topic
  - min
  - max
  - source
  - source_links
  - verified
  - notes
  - enabled
  - display
  # --- typed (multi-modal) decoding ---------------------------------------
  # A param is a numeric scalar by default. Declaring `type:` (and its
  # companion map) attaches a PARALLEL typed decoding: the WiCAN `expression`
  # still yields the raw integer the device ships/analyses, and the typed layer
  # (canlib/decode_value.py) interprets that raw value for display/analysis.
  # This never changes the device output or the numeric analysis path.
  #   type: numeric   — (default) the expression's float value, as today.
  #   type: enum      — a discrete mode; `values:` maps raw int -> label.
  #   type: bitmask   — a set of flags; `bits:` maps bit index (0=LSB) -> label.
  #   type: ascii     — the payload bytes rendered as text.
  #   type: date      — a manufacture/schedule date (BCD or binary; YYYY-MM-DD).
  #   type: bcd       — a binary-coded-decimal integer.
  #   type: struct    — an ordered set of typed sub-`fields:` (e.g. a schedule
  #                     record: day-of-week bitmask + hour + minute).
  - type
  - values          # enum: {raw_int: "label", ...}
  - bits            # bitmask: {bit_index: "label", ...}  (0 = LSB)
  - fields          # struct: [{name, type, expression, values/bits/...}, ...]

# Accepted values for a param's optional `type:` field (typed decoding).
valid_param_types:
  - numeric
  - enum
  - bitmask
  - ascii
  - date
  - bcd
  - struct

required_meta_fields:
  - car_model
  - init

# IOControl section (service 0x2F) — per-ECU actuator commands.
# Lives under ECU_NAME.iocontrol alongside ECU_NAME.pids.
# Format:
#   iocontrol:
#     DID_HEX:                         # e.g. BC01, B05B
#       label: str                     # Human-readable name (required)
#       verified: bool                 # Tested on this car? (same as PID parameters)
#       on: str                        # Full hex command for ON (e.g. "2FBC0103")
#       off: str                       # Full hex command for OFF (e.g. "2FBC0100")
#       notes: str                     # Additional context (use > for multiline)
#       session: bool                  # Requires extended session (default: true)
#       hold: bool                     # Needs --hold to keep active (default: true)
#
# Control type suffixes (appended to 2F<DID>):
#   03 = shortTermAdjustment (ON)
#   00 = returnControl (OFF / release)
#
# Usage with canair:
#   canair io <ECU> --did <DID>
#   e.g.: canair io IGPM --did BC01
iocontrol_fields:
  - label
  - verified
  - "on"
  - "off"
  - notes
  - session
  - hold
  - status_param   # optional: param name from pids section to query as status indicator

# Research section — untested PIDs, undecoded captures, pending scans, and
# IOControl discovery. Lives under ECU_NAME.research alongside pids/iocontrol.
# Items graduate to pids/iocontrol once decoded/verified; mark research entry "done".
#
# Format:
#   research:
#     - type: scan | decode | verify | iocontrol_scan
#       target: "22 E001-E010"     # PID, DID range, or scan description
#       status: pending | captured | nrc | done
#       priority: P1 | P2 | P3    # P1=high value, P2=medium, P3=speculative
#       vehicle_states: [acc]      # Car power states needed (same vocabulary as
#                                  #   the PID/ECU vehicle_states field)
#       created: "2026-04-15"      # Auto-set to today when the entry is added
#       updated: "2026-04-20"      # Auto-set to today on add and on set-status
#       date: "2026-04-15"         # When last tested (optional)
#       result: "..."              # Short result summary (optional)
#       notes: "..."               # Details, what to look for
#       sources: [...]             # Cross-references (URLs, file references)
#       what_to_test: [...]        # Specific things to check (optional)
#       capture_protocol: "..."    # How to capture the data needed to decode (optional)
#
# type values:
#   scan           — broad PID/DID range scan not yet performed
#   decode         — response captured but payload not decoded
#   verify         — parameter exists but value unverified on this car
#   iocontrol_scan — IOControl (2F) discovery scan
research_fields:
  required: [type, target, status]
  optional: [priority, vehicle_states, created, updated, date, result, notes, sources, what_to_test, capture_protocol]

# Routines section — RoutineControl discovery results.
# Populated by `canair scan routines` (UDS 0x31 SF03 requestRoutineResults with
# 4-digit RID keys, or KWP2000 0x33 RequestRoutineResultsByLocalIdentifier with
# 2-digit LID keys). Lives under ECU_NAME.routines.
#
# Format:
#   routines:
#     RID_HEX:                       # 4-digit hex Routine Identifier (e.g. F010)
#       response: str                # hex payload of positive 71-response (optional)
#       nrc: 0xNN                    # negative response code (if NRC-based hit)
#       nrc_desc: str                # NRC description text
#       label: str                   # optional human label (filled in as research proceeds)
#       verified: bool               # optional — tested/decoded on this car
#       notes: str                   # optional — findings, cross-refs
#
# Exactly one of {response, nrc} is set per hit. Routines enter here from
# the scanner as leads; promotion to iocontrol (if start-routine is ever
# attempted and verified safe) is a manual step and requires explicit consent.
routines_fields:
  optional: [response, nrc, nrc_desc, label, verified, notes]

# IOControl discoveries section — IOControl discovery scan output (UDS 0x2F SF 00
# returnControlToECU, or KWP2000 0x30 IOCP 00). Populated by `canair scan iocontrol`.
# Lives under
# ECU_NAME.iocontrol_discoveries. Distinct from ECU_NAME.iocontrol (the
# curated, human-authored actuator list) so the scanner can rerun without
# clobbering on/off/notes.
#
# Format: same shape as routines_fields — each entry is a DID_HEX (4-digit
# hex) mapping to {response, nrc, nrc_desc, label, verified, notes}.
# Exactly one of {response, nrc} is set per hit.
#
# Promotion workflow: a discovery becomes a real iocontrol entry manually
# once on/off commands have been determined and verified on the car.
iocontrol_discoveries_fields:
  optional: [response, nrc, nrc_desc, label, verified, notes]
