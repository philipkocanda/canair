# Groups Definition Schema (human-readable companion)
# Validates the optional profiles/<name>/groups.yaml.
#
# groups.yaml declares a profile's named capture/monitor selector groups — the
# saved-query analogue of vehicle_states.yaml / can_buses.yaml. A group is a
# named list of ECU / ECU:PID selectors in the shared query mini-language,
# recalled on the command line with the `@` sigil (e.g. `canair monitor
# @charging`). Inspect/edit with `canair groups`.
#
# Top-level structure:
#   groups:                       # mapping keyed by lower-cased group name
#     <name>:
#       description: str          # optional — human-readable explanation
#       members: [SEL, ...]       # required — ECU / ECU:PID selectors
#
# The bare-list shorthand (`<name>: [SEL, ...]`) is also accepted — the group
# then carries no description.
#
# Group names are lower-case tokens (letters/digits with optional internal
# '-'/'_'); members are plain selectors (ECU or ECU:PID), never `@group` refs
# (groups cannot nest) and never full mini-language steps. `canair validate
# groups` additionally checks that each member's ECU exists in the registry.

required_group_fields:
  - members

optional_group_fields:
  - description
