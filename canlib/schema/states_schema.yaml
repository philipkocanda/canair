# States Definition Schema (human-readable companion)
# Validates the optional profiles/<name>/vehicle_states.yaml.
#
# vehicle_states.yaml declares a profile's canonical, ordered vehicle operating states.
# The `vehicle_states` field on a capture session should draw from these names
# (soft — free text is still accepted, but `canair validate captures` warns on
# values outside this vocabulary). Each state may carry a `when:` predicate used
# to auto-suggest the state from decoded PID values (see canlib/states.py).
#
# Top-level structure:
#   states:                 # ordered list; first matching `when` wins on suggest
#     - name: str           # required — the state name (e.g. "READY", "CHARGING")
#       description: str    # optional — human-readable explanation
#       when: str           # optional — boolean predicate over ECU.PARAM values
#
# State names are an UPPERCASE controlled vocabulary (like the CAN-bus segment
# codes in can_buses.yaml). Input is normalized to uppercase, so any casing
# works on the CLI. Inspect/edit with `canair states`.
#
# Predicate grammar (whitelisted AST; no function calls / attribute access beyond
# dotted ECU.PARAM names):
#   ECU.PARAM               decoded parameter value (e.g. BMS.BATTERY_CURRENT)
#   and / or / not          boolean composition
#   == != < <= > >=         comparisons
#   numbers / 'strings'     literals
#   __no_response__         true when no ECU responded (deep sleep / off)
#   __responded__           true when at least one ECU responded
#
# Base vocabulary (shared across vehicles; profiles may add composite states):
#   SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING
# Plus the meta-token ALL — "applicable/readable in every state" (documentary,
# the state analogue of the ALL CAN-bus code).

required_state_fields:
  - name

optional_state_fields:
  - description
  - when
