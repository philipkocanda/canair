# canair configuration
#
# canair looks for this file at $XDG_CONFIG_HOME/canair/config.yaml
# (default: ~/.config/canair/config.yaml). A legacy ./config.yaml in the repo
# root is still read (and overridden by the user config) for backwards compat.
#
# Copy to your config location and adjust to taste. All keys are optional.
#
# This file is the authoritative, fully-commented reference for every key —
# print it anytime with `canair config example`. Rendered docs (may lag this
# file): https://philipkocanda.github.io/canair/reference/config/
#
# View and edit these settings from the CLI with `canair config`
# (e.g. `canair config show`, `canair config set default_wican home`).

# Which vehicle profile to use when none is given on the command line.
# Overridden by --profile or the CANAIR_PROFILE environment variable.
# If exactly one profile is discovered, it is auto-selected and this is optional.
default_profile: ioniq-2017

# Extra directory to search for vehicle profiles (in addition to
# ~/.config/canair/profiles and the repo-bundled profiles/). Local profiles
# placed here are never committed to the repo.
# profiles_dir: ~/vehicles

# Display preferences.
#   byte_notation — default byte-index notation for analysis output labels
#   (correlate / hunt / investigate / coverage / decode), and for the byte ruler
#   plus the per-signal byte-reference column in monitor / captures --diff|--step.
#   One of:
#     wican  — WiCAN Bnn frame index (default; the promotable/firmware form)
#     isotp  — ISO-TP payload index (iN)
#     torque — Torque/OBDb letter notation
#     bix    — Torque bit index (a ruler falls back to wican: it needs >2 columns)
#   Overridden per-command by --notation. See docs/concepts/byte-indexing.md.
# display:
#   byte_notation: wican

# WiCAN/gateway devices for the --wican flag. Each alias maps to a device with a
# `host` (IP or hostname) and, optionally, its own transport/port/bitrate — so a
# user with several devices can bind e.g. a home LAN device to slcan-tcp and a
# cellular/VPN device to wican-ws. --wican accepts any alias defined here, or an
# arbitrary URL/IP.
devices:
  ap:
    host: "192.168.80.1"    # Direct connection to WiCAN AP (factory default)
  home:
    host: "192.168.1.100"   # device on your home LAN
    transport: slcan-tcp    # optional per-device transport (slcan-tcp | wican-ws | elm327-tcp)
    port: 3333              # optional per-device slcan-tcp port
  vpn:
    host: "10.0.0.100"      # device reachable via VPN/tunnel
    transport: wican-ws
  clone:
    host: "192.168.0.10"    # a generic WiFi ELM327 dongle (Kiwi, vLinker, OBDLink)
    transport: elm327-tcp   # direct ELM327 over a plain TCP socket (no WiCAN)
    port: 35000             # ELM socket port (most WiFi clones use 35000)

default_wican: home

# The legacy flat form is still read when no `devices:` block is present, and is
# auto-migrated into `devices:` on first run:
# wican_addresses:
#   ap: "192.168.80.1"
#   home: "192.168.1.100"

# Automatic update check. canair checks GitHub once a day (in a background
# thread, never blocking a command) for a newer released version and prints a
# one-line notice with a changelog link and how to update (`canair update`).
# The check is offline-safe (any failure is silently ignored) and only runs in
# interactive terminals. Set to false to disable it entirely; the
# CANAIR_NO_UPDATE_CHECK environment variable does the same.
# check_for_updates: true

# Charging-grid region for the reference-free physical-value scan
# (`canair hunt --physical` / `canair investigate`). Sets the mains-voltage and
# line-frequency bands the scan looks for — a property of *where* you charge,
# not the car, so it lives here (once per location) and applies to every profile.
# One of: EU | UK | US | JP | CN | AU (case-insensitive). Unset assumes EU
# (230 V / 50 Hz); canair offers to set it the first time a physical scan runs.
# The vehicle-axis bands (HV pack, 12 V rail) live in a profile's physical_bands.
# grid_region: EU

# WiCAN hardware model: "pro" (default) or "classic" (the regular, non-Pro WiCAN).
# The classic WiCAN has no AutoPID profile support and no ELM327
# WebSocket terminal, so with wican_model: classic canair refuses:
#   - `canair wican autopid upload/download/diff` and `canair wican mode set`
#     (AutoPID sync / mode switch), and
#   - the `wican-ws` transport (ELM327 WebSocket terminal).
# Everything else — reading/scanning/decoding over the default slcan-tcp
# transport, and generating AutoPID JSON with `canair wican autopid write` —
# works on both models. Leave unset (or "pro") if you have a WiCAN Pro.
# wican_model: pro

# CAN transport selection (advanced). Chosen explicitly; never auto-detected.
# The type/host are overridden per-command by --transport/--wican; port and
# bitrate are config-only (no CLI flags). When the type is omitted, canair
# defaults to slcan-tcp (the canonical default — works on both the WiCAN Pro and
# the classic WiCAN), using the devices/default_wican host above. A per-device
# `transport:` (see devices above) overrides transport.type for that device.
# The wican-ws transport requires a WiCAN Pro (see wican_model above). The
# elm327-tcp transport talks to a generic ELM327 adapter (WiFi clones, or the
# ELM327-Emulator's `-n` mode) over a plain TCP socket — no WiCAN required.
# transport:
#   type: slcan-tcp      # slcan-tcp (raw SLCAN over TCP, default) | wican-ws (WebSocket ELM327, Pro-only) | elm327-tcp (direct ELM327 over TCP)
#   host: 192.168.3.2    # device host/IP (all transports)
#   port: 35000          # slcan-tcp (Pro 35000, classic 3333) / elm327-tcp (usually 35000); auto-detected for slcan-tcp if omitted
#   bitrate: 500000      # slcan-tcp only; overrides all else. Precedence:
#                        #   this > profile can_bitrate > device can_datarate > 500000
#
#   # Auto-fallback: when the selected device is unreachable, try the others.
#   fallback: true             # default true; --no-fallback overrides per-command
#   connect_timeout: 5.0       # seconds — per-device liveness probe. Paid once per
#                              # candidate, so it must outlast a cellular radio's
#                              # idle-to-connected transition (1-2s before the SYN
#                              # even leaves) without stalling on a dead device.
#   fallback_order: [home, vpn, ap]  # optional; default = selected device, then the rest
#   reconnect_max_wait: 60.0   # seconds — bounded window to re-home a dropped
#                              # `canair monitor` session (--wait retries forever).
#                              # Sized for a mobile link: a cell handover or a VPN
#                              # re-key is routinely out for tens of seconds.
#
#   # Link-health watchdogs. Both exist because a session can stop being usable
#   # without anything raising: a half-open socket keeps accepting writes, and a
#   # desynchronised ELM327 pipe keeps returning well-formed replies — for the
#   # *previous* request. Without these the monitor shows every signal as "stale"
#   # indefinitely and only a manual restart recovers.
#   ws_ping_interval: 20.0     # seconds — WebSocket keepalive ping for wican-ws
#                              # (0 disables). Makes a dead link raise instead of
#                              # going quiet. Lower it on a flaky mobile link.
#   stale_cycles_before_reconnect: 3  # consecutive monitor poll cycles in which
#                              # nothing answered coherently, before reconnecting
#                              # (0 disables). A cycle count, not a duration, so
#                              # it scales with the poll rate.
