name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.15

      - name: Install libyaml
        # PyYAML has no wheels for Python 3.15 yet, so uv builds it from source, and without
        # libyaml's headers that build has no C loader: YAML then loads about 4x slower.
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libyaml-dev

      - name: Lockfile is current
        # `uv.lock` pins canair's own version, and release-please bumps it via a
        # targeted TOML splice rather than by re-locking. That updater only warns
        # (it does not fail) when its jsonpath matches nothing, so without this
        # gate a silent miss would ship a tag whose `uv sync` immediately
        # re-locks. Also catches a hand bump that forgot `uv lock`.
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --all-extras --dev --group docs

      - name: PyYAML has its C loader
        run: |
          uv run python -c "import yaml; assert hasattr(yaml, 'CSafeLoader'), 'no libyaml'"

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Import contracts (layers and boundaries)
        run: uv run lint-imports

      - name: Skill frontmatter is Claude Code / OpenCode compatible
        run: uv run python scripts/check/validate_skills.py

      - name: Agent documents name code that exists
        run: uv run python scripts/check/doc_paths.py

      - name: Validate bundled profile data
        # The repo bundles more than one profile, so `validate all` can't
        # auto-resolve a single one — validate each bundled profile explicitly.
        #
        # --max-untimed is the untimed-payload ratchet: writes are enforced to
        # carry a timestamp, so a profile's untimed count only ever falls. New
        # profiles are gated at 0; a profile carrying grandfathered legacy rows
        # (only hyundai-ioniq-ae-ev today, at 275) declares its baseline here so the gate
        # forbids GROWTH without a history rewrite. Lower a baseline as its count
        # drops; a real regression (untimed rows creeping back in) fails CI.
        #
        # --max-untagged is the same ratchet for capture sessions that name no car on
        # a profile with several variants: every recording names its car now, so the
        # count only falls as history is tagged. The Ioniq 5 history is untagged
        # until someone knows which battery that car had.
        run: |
          declare -A UNTIMED_BASELINE=( [hyundai-ioniq-ae-ev]=275 )
          declare -A UNTAGGED_BASELINE=( [hyundai-ioniq-5-ne-ev]=1 )
          for p in profiles/*/; do
            name="$(basename "$p")"
            max_untimed="${UNTIMED_BASELINE[$name]:-0}"
            max_untagged="${UNTAGGED_BASELINE[$name]:-0}"
            echo "::group::validate $name (max-untimed $max_untimed, max-untagged $max_untagged)"
            uv run canair --profile "$name" validate all \
              --max-untimed "$max_untimed" --max-untagged "$max_untagged"
            echo "::endgroup::"
          done

      - name: Git LFS objects are on the server
        # The default checkout fetches pointer files only, so a commit pushed without
        # its LFS objects (the upload hook skipped) would otherwise pass here and
        # fail on the next `git pull` elsewhere. This asks the server, downloading
        # nothing. A PR from a fork has no token and a read-only one; the public
        # endpoint still answers for a public repository.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check/check_lfs_objects.py

      - name: CLI reference is current
        run: uv run python scripts/gen/gen_cli_reference.py --check

      - name: Architecture page is current
        run: uv run python scripts/gen/gen_architecture.py --check

      - name: Doc screenshots are current
        # Verifies every manifest asset is present and every screenshotted
        # command still runs device-free (no re-render — freeze/vhs are not
        # needed in CI, and the images aren't byte-reproducible).
        run: uv run python scripts/gen/gen_screenshots.py --check

      - name: Docs build (mkdocs --strict)
        # NO_MKDOCS_2_WARNING silences Material's red MkDocs-2.0 advocacy notice,
        # which prints on every build and is not actionable for us (no
        # third-party plugins, no theme overrides, mkdocs pinned <2). Keeping it
        # out of the log makes a real docs failure easy to spot. Rationale:
        # plans/2026-07-24-documentation-strategy.md.
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict --site-dir /tmp/site

      - name: Tests
        # --durations surfaces the slowest tests in the log, so a creeping
        # runaway (e.g. an analysis test re-reading a growing capture corpus) is
        # visible in CI instead of only felt locally. Parallelism comes from the
        # -n auto default in pyproject.toml's addopts.
        run: uv run pytest -q --durations=15

      - name: Explorer JavaScript kernels
        # The explorer's analysis maths (docs/assets/explorer/analysis.js) is pure and
        # dependency-free, so Node's built-in runner covers it; Node ships on the runner.
        run: node --test tests/js/analysis.test.js

  wheel:
    # CI otherwise tests the checkout only, so a file missing from the wheel would be found by
    # a user. Build the wheel, install it into a clean environment away from the checkout and
    # run the commands a new user runs first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: The wheel holds the package, bundled data and CI build stamp, and nothing at the top level
        run: |
          python3 - <<'PY'
          import glob, json, os, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = wheel.namelist()
          top = {n.split("/")[0] for n in names if not n.split("/")[0].endswith(".dist-info")}
          assert top == {"canair"}, f"unexpected top-level entries: {sorted(top)}"
          for needed in (
              "canair/_bundled/config.example.yaml",
              "canair/_bundled/templates/profile.yaml.tmpl",
              "canair/_bundled/profiles/hyundai-ioniq-ae-ev/profile.yaml",
              "canair/schema/pids_schema.yaml",
          ):
              assert needed in names, f"{needed} is missing from the wheel"
          stamp = json.loads(wheel.read("canair/_build_info.json"))
          assert stamp["builder"] == "ci", stamp
          assert stamp["commit"] == os.environ["GITHUB_SHA"], stamp
          PY

      - name: Install it in a clean environment and run it
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config" CANAIR_NO_UPDATE_CHECK=1
          canair="$RUNNER_TEMP/wheel-venv/bin/canair"
          "$canair" --version | grep -F "(CI build "
          "$canair" --help
          "$canair" profile list
          "$canair" --profile hyundai-ioniq-ae-ev validate pids
          "$canair" config example > /dev/null
          "$canair" profile create wheel-smoke-test --car-model "Wheel smoke test"
