name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lockfile is current
        # `uv.lock` pins canair's own version, and release-please bumps it via a
        # targeted TOML splice rather than by re-locking. That updater only warns
        # (it does not fail) when its jsonpath matches nothing, so without this
        # gate a silent miss would ship a tag whose `uv sync` immediately
        # re-locks. Also catches a hand bump that forgot `uv lock`.
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --all-extras --dev --group docs

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Validate bundled profile data
        # The repo bundles more than one profile, so `validate all` can't
        # auto-resolve a single one — validate each bundled profile explicitly.
        run: |
          for p in profiles/*/; do
            name="$(basename "$p")"
            echo "::group::validate $name"
            uv run canair --profile "$name" validate all
            echo "::endgroup::"
          done

      - name: CLI reference is current
        run: uv run python scripts/gen_cli_reference.py --check

      - name: Bundled-profiles index is current
        run: uv run python scripts/gen_profiles_index.py --check

      - name: Doc screenshots are current
        # Verifies every manifest asset is present and every screenshotted
        # command still runs device-free (no re-render — freeze/vhs are not
        # needed in CI, and the images aren't byte-reproducible).
        run: uv run python scripts/gen_screenshots.py --check

      - name: Docs build (mkdocs --strict)
        # NO_MKDOCS_2_WARNING silences Material's red MkDocs-2.0 advocacy notice,
        # which prints on every build and is not actionable for us (no
        # third-party plugins, no theme overrides, mkdocs pinned <2). Keeping it
        # out of the log makes a real docs failure easy to spot. Rationale:
        # plans/2026-07-24-documentation-strategy.md.
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict --site-dir /tmp/site

      - name: Tests
        # --durations surfaces the slowest tests in the log, so a creeping
        # runaway (e.g. an analysis test re-reading a growing capture corpus) is
        # visible in CI instead of only felt locally. Parallelism comes from the
        # -n auto default in pyproject.toml's addopts.
        run: uv run pytest -q --durations=15
