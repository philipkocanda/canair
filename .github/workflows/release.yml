name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # PR labelling goes through the issues API

# Never run two release-please passes at once: both would try to reconcile the
# same release branch/PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Fail loudly and legibly if the PAT is missing, rather than letting the
      # action die on an opaque auth error. Not optional: see the note below.
      - name: Require the release token
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=Missing RELEASE_PLEASE_TOKEN::Create a fine-grained PAT scoped to this repo with Contents: write, Pull requests: write, Issues: write, and store it as the RELEASE_PLEASE_TOKEN secret. See RELEASING.md."
            exit 1
          fi

      # Opens/updates a release PR that bumps pyproject.toml + uv.lock and writes
      # the CHANGELOG section; merging it tags vX.Y.Z and publishes the GitHub
      # Release that `canair update` reads. See RELEASING.md for the human loop
      # and plans/2026-08-06-release-please.md for the design.
      #
      # The token is a PAT, not GITHUB_TOKEN, and that is load-bearing: resources
      # created with GITHUB_TOKEN do not trigger workflows, so CI would never run
      # on a release PR — and the default branch requires the `test` check, which
      # would leave every release PR unmergeable except by admin bypass.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Keep the committed WiCAN AutoPID JSON (profiles/*/out/) in step with the
  # definitions being released, by regenerating it on the open release PR's branch.
  # Runs on every pass rather than only when release-please touched the PR: a
  # hidden-type commit (chore, test…) can change ecus/ without updating the PR.
  # release-please force-pushes its branch whenever the notes change, which drops
  # this commit, but the same pass then regenerates it on the new head.
  autopid:
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      - name: Find the open release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "autorelease: pending" --json headRefName --jq '.[0].headRefName // ""')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          [ -n "$branch" ] || echo "No open release PR; nothing to regenerate."

      # The PAT again, so the regenerated commit triggers CI on the release PR.
      - uses: actions/checkout@v7
        if: steps.pr.outputs.branch != ''
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install uv
        if: steps.pr.outputs.branch != ''
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Regenerate the AutoPID profiles
        if: steps.pr.outputs.branch != ''
        run: |
          uv python install 3.12
          uv sync
          uv run python scripts/gen_autopid.py

      - name: Commit to the release PR
        if: steps.pr.outputs.branch != ''
        run: |
          git add -A -- 'profiles/*/out/*'
          if git diff --cached --quiet; then
            echo "AutoPID profiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): regenerate the WiCAN AutoPID profiles"
          git push origin "HEAD:${{ steps.pr.outputs.branch }}"
