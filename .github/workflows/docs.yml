name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      # The bundled-profile pages render their counts from the profile data at
      # build time (scripts/mkdocs_hooks/), so a profile change must redeploy.
      - "scripts/mkdocs_hooks/**"
      - "src/canair/interop/explorer/**"
      # The published editor schemas (scripts/mkdocs_hooks/schemas.py).
      - "src/canair/schema/**"
      - "profiles/*/ecus/**"
      - "profiles/*/profile.yaml"
      - "profiles/*/variants.yaml"
      - "src/canair/profile/names.py"
      - "profiles/*/can_buses.yaml"
      - "profiles/*/signals/**"
      - "profiles/*/captures/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.15

      - name: Sync docs dependencies
        run: uv sync --group docs

      - name: Build site
        # Silences Material's MkDocs-2.0 advocacy notice — see the same step in
        # ci.yml and plans/2026-07-24-documentation-strategy.md.
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
