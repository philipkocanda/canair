site_name: canair
site_description: CLI for reverse-engineering CAN/OBD diagnostics over the air with a WiCAN dongle
site_url: https://philipkocanda.github.io/canair/
repo_url: https://github.com/philipkocanda/canair
repo_name: philipkocanda/canair
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

# The screenshot pipeline's inputs live beside the generated images under
# docs/screenshots/ but aren't part of the site — keep them out of the build.
exclude_docs: |
  screenshots/shots.yaml
  screenshots/freeze.json
  screenshots/tapes/
  _snippets/

theme:
  name: material
  variant: classic
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - abbr
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: docs/_snippets
      auto_append:
        - abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        # Diagrams are written as Mermaid and drawn by Pele (assets/pele/). The class is not
        # "mermaid" on purpose: the theme loads Mermaid.js for every .mermaid element.
        - name: mermaid
          class: pele-diagram
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # Generated page content (the bundled-profiles index, each profile tour's counts and its
  # meta description) comes from scripts/docs_site/. A failing macro stops the build.
  - macros:
      module_name: scripts/docs_site/macros
      on_error_fail: true
      on_undefined: strict

# Files that scripts/docs_site/data.py writes into docs/ (the explorer data and the editor
# schemas) are generated before the build (`make docs`). A change to their sources rebuilds the
# site but does not regenerate them: restart `make docs-serve` for that.
watch:
  - profiles
  - src/canair/interop/explorer
  - scripts/docs_site

extra_css:
  - assets/layout.css
  - assets/pele/pele.css
  - assets/explorer/vendor/uPlot.min.css
  - assets/explorer/explorer.css
extra_javascript:
  - assets/pele/pele-init.js
  - assets/explorer/vendor/uPlot.iife.min.js
  - assets/explorer/analysis.js
  - assets/explorer/explorer.js
  - assets/explorer/plot.js
  - assets/explorer/discover.js

