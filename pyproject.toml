[project]
name = "canair"
version = "1.20.0"
description = "General-purpose CAN/UDS/KWP2000 diagnostic reverse-engineering CLI (WiCAN over-the-air)"
requires-python = ">=3.12"
dependencies = [
    "argcomplete>=3.0",
    "can-isotp>=2.0.7",
    "cantools>=39.0",
    "jsonschema>=4.0",
    "python-can>=4.6.1",
    "pyyaml>=6.0",
    "requests>=2.0",
    "rich>=13.0",
    "ruamel.yaml>=0.18",
    "textual>=1.0",
    "websockets>=12.0",
]

[project.scripts]
canair = "canlib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canlib"]
# Ship the bundled example profile(s) so a fresh install has a working default
# (resolves to site-packages/profiles, matching BUNDLED_PROFILES_DIR).
exclude = ["profiles/*/logs", "**/__pycache__"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "profiles"
"templates" = "templates"
"config.example.yaml" = "config.example.yaml"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "ty>=0.0.1a1",
]
docs = [
    # Capped below 10 deliberately. The MkDocs ecosystem is splitting: MkDocs 2.0
    # removes the plugin system and rewrites theming (which Material 9.x is built
    # on), and Material's authors have moved to their own engine, Zensical.
    # Material 9.x already pins mkdocs<2, so builds are safe today — this cap
    # makes the *next* engine change an explicit decision rather than something a
    # routine `uv lock --upgrade` makes for us. See
    # plans/2026-07-24-documentation-strategy.md.
    "mkdocs-material>=9.5,<10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Run in parallel by default: the full suite is ~3700 device-free tests that
# spent most of their wall time idle in one process (58% CPU) — 67s serial vs
# ~14s here. `loadscope` groups tests by module/class so a module-scoped fixture
# is built once per module rather than once per worker that happens to draw one
# of its tests (tests/test_blind_rediscovery.py strips a whole profile in one).
#
# Spinning up workers costs ~0.7s, so a FOCUSED run is faster serially — use
# `-n0` when iterating on one file or debugging a single failure (it also keeps
# output ordered and un-interleaved):
#     uv run pytest -n0 tests/test_foo.py
addopts = "-n auto --dist loadscope"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    # We use en-dashes deliberately in user-facing range displays ("00–FF",
    # "viewing 1–20") and docstrings; don't force them down to ASCII hyphens.
    "RUF001", # ambiguous unicode char in string
    "RUF002", # ambiguous unicode char in docstring
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
# Type-check the library package only. Tests lean heavily on fakes/fixtures
# where strict typing is high-noise, low-value; the CI gate targets canlib/.
include = ["canlib"]

[tool.ty.environment]
python-version = "3.12"
