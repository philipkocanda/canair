[[tool.importlinter.contracts]]
name = "The ELM327 and raw transports are independent"
type = "independence"
modules = [
    "canair.transport.elm327",
    "canair.transport.raw",
]

# Top to bottom. `a | b` is one layer: its packages import none of each other.
[[tool.importlinter.contracts]]
name = "The layers hold"
type = "layers"
layers = [
    "canair.cli",
    "canair.tui",
    "canair.contribute",
    "canair.live",
    "canair.yaml_edit",
    "canair.validation",
    "canair.interop | canair.migrations | canair.analysis | canair.dtc | canair.memory",
    "canair.transport | canair.captures | canair.actions",
    "canair.states | canair.query | canair.render",
    "canair.privacy",
    "canair.ecus",
    "canair.variants",
    "canair.broadcast | canair.install",
    "canair.profile",
    "canair.device",
    "canair.safety",
    "canair.expression",
    "canair.uds",
    "canair.config",
    "canair.core",
]
ignore_imports = []
