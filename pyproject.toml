[project]
name = "canair"
version = "5.5.1"
description = "General-purpose CAN/UDS/KWP2000 diagnostic reverse-engineering CLI (WiCAN over-the-air)"
requires-python = ">=3.12"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "profiles/LICENSE"]
dependencies = [
    "argcomplete>=3.0",
    "can-isotp>=2.0.7",
    "cantools>=44.0",
    "jsonschema>=4.18",  # the `referencing` registry (core/json_schema.py)
    "python-can>=4.6.1",
    "pyyaml>=6.0",
    "requests>=2.0",
    "rich>=14.2",
    "ruamel.yaml>=0.18",
    "textual>=4.0",
    "websockets>=13.0",
]

[project.scripts]
canair = "canair.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canair"]
# Ship the bundled profile(s), the scaffold templates and the example config inside the
# package (core/paths.py finds them under canair/_bundled/ in a wheel and at the repo root in a
# checkout), so a fresh install has a working default and no stray top-level directories.
exclude = ["profiles/*/logs", "**/__pycache__"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "canair/_bundled/profiles"
"templates" = "canair/_bundled/templates"
"config.example.yaml" = "canair/_bundled/config.example.yaml"

# Stamps each wheel with its commit, build time and builder (hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pre-commit>=4.0",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.6",
    "ruff>=0.17",
    "ty>=0.0.99",
]
docs = [
    # Zensical builds the docs site (plans/2026-11-11-zensical-docs-engine.md). It is 0.x
    # software, so the cap makes the next minor an explicit decision rather than something a
    # routine `uv lock --upgrade` makes for us.
    "zensical>=0.1.1,<0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Without this, pytest-asyncio warns on every run that the default will change.
asyncio_default_fixture_loop_scope = "function"
# Run in parallel by default: the full suite is ~3700 device-free tests that
# spent most of their wall time idle in one process (58% CPU) — 67s serial vs
# ~14s here. `loadscope` groups tests by module/class so a module-scoped fixture
# is built once per module rather than once per worker that happens to draw one
# of its tests (tests/integration/test_blind_rediscovery.py strips a whole profile in one).
#
# Spinning up workers costs ~0.7s, so a FOCUSED run is faster serially — use
# `-n0` when iterating on one file or debugging a single failure (it also keeps
# output ordered and un-interleaved):
#     uv run pytest -n0 tests/test_foo.py
addopts = "-n auto --dist loadscope --import-mode=importlib"
# `tests.support` (shared helpers) must import from the repo root; importlib mode does not put
# the rootdir on sys.path by itself. Importlib mode is also what lets two test directories
# hold a file with the same name.
pythonpath = ["."]
# Only our suite: a bare `pytest` otherwise also collects the test suites of fetched
# third-party checkouts under the gitignored references/ (e.g. opendbc's).
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    # We use en-dashes deliberately in user-facing range displays ("00–FF",
    # "viewing 1–20") and docstrings; don't force them down to ASCII hyphens.
    "RUF001", # ambiguous unicode char in string
    "RUF002", # ambiguous unicode char in docstring
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Ruff 0.16 formats the Python code blocks in Markdown. Plans and docs show code as
# illustration, with comment alignment that is deliberate, so leave Markdown alone.
exclude = ["*.md"]

[tool.ty.src]
# Type-check the library package only. Tests lean heavily on fakes/fixtures
# where strict typing is high-noise, low-value; the CI gate targets src/canair/.
include = ["src/canair"]

[tool.ty.environment]
python-version = "3.12"

# Architecture contracts. Dependencies point down; see
# plans/2026-11-04-package-layout-and-layering.md for the target layers and
# docs/development/architecture.md for what each package is for.
#
# These are written against the packages that exist today. Each package move adds its new
# name to the contract it belongs to, and the codemod that moves a package rewrites the names
# in this section. `ignore_imports` is the debt list: an entry may be removed, never added
# (tests/contracts/test_structure.py pins the count). An entry whose import no longer exists
# fails the check, so a fixed import has to leave the list.
[tool.importlinter]
root_package = "canair"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Nothing below the interface imports the CLI"
type = "forbidden"
source_modules = [
    "canair.actions",
    "canair.analysis",
    "canair.broadcast",
    "canair.captures",
    "canair.config",
    "canair.contribute",
    "canair.core",
    "canair.device",
    "canair.dtc",
    "canair.memory",
    "canair.ecus",
    "canair.expression",
    "canair.install",
    "canair.interop",
    "canair.live",
    "canair.migrations",
    "canair.privacy",
    "canair.profile",
    "canair.query",
    "canair.render",
    "canair.safety",
    "canair.states",
    "canair.transport",
    "canair.tui",
    "canair.uds",
    "canair.validation",
    "canair.variants",
    "canair.yaml_edit",
]
forbidden_modules = [
    "canair.cli",
]
allow_indirect_imports = true
ignore_imports = []

