[project]
name = "canair"
version = "4.3.0"
description = "General-purpose CAN/UDS/KWP2000 diagnostic reverse-engineering CLI (WiCAN over-the-air)"
requires-python = ">=3.12"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "profiles/LICENSE"]
dependencies = [
    "argcomplete>=3.0",
    "can-isotp>=2.0.7",
    "cantools>=39.0",
    "jsonschema>=4.0",
    "python-can>=4.6.1",
    "pyyaml>=6.0",
    "requests>=2.0",
    "rich>=13.0",
    "ruamel.yaml>=0.18",
    "textual>=1.0",
    "websockets>=12.0",
]

[project.scripts]
canair = "canlib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canlib"]
# Ship the bundled example profile(s) so a fresh install has a working default
# (resolves to site-packages/profiles, matching BUNDLED_PROFILES_DIR).
exclude = ["profiles/*/logs", "**/__pycache__"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "profiles"
"templates" = "templates"
"config.example.yaml" = "config.example.yaml"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "ty>=0.0.1a1",
]
docs = [
    # Capped below 10 deliberately. The MkDocs ecosystem is splitting: MkDocs 2.0
    # removes the plugin system and rewrites theming (which Material 9.x is built
    # on), and Material's authors have moved to their own engine, Zensical.
    # Material 9.x already pins mkdocs<2, so builds are safe today — this cap
    # makes the *next* engine change an explicit decision rather than something a
    # routine `uv lock --upgrade` makes for us. See
    # plans/2026-07-24-documentation-strategy.md.
    "mkdocs-material>=9.5,<10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Run in parallel by default: the full suite is ~3700 device-free tests that
# spent most of their wall time idle in one process (58% CPU) — 67s serial vs
# ~14s here. `loadscope` groups tests by module/class so a module-scoped fixture
# is built once per module rather than once per worker that happens to draw one
# of its tests (tests/integration/test_blind_rediscovery.py strips a whole profile in one).
#
# Spinning up workers costs ~0.7s, so a FOCUSED run is faster serially — use
# `-n0` when iterating on one file or debugging a single failure (it also keeps
# output ordered and un-interleaved):
#     uv run pytest -n0 tests/test_foo.py
addopts = "-n auto --dist loadscope --import-mode=importlib"
# `tests.support` (shared helpers) must import from the repo root; importlib mode does not put
# the rootdir on sys.path by itself. Importlib mode is also what lets two test directories
# hold a file with the same name.
pythonpath = ["."]
# Only our suite: a bare `pytest` otherwise also collects the test suites of fetched
# third-party checkouts under the gitignored references/ (e.g. opendbc's).
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    # We use en-dashes deliberately in user-facing range displays ("00–FF",
    # "viewing 1–20") and docstrings; don't force them down to ASCII hyphens.
    "RUF001", # ambiguous unicode char in string
    "RUF002", # ambiguous unicode char in docstring
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
# Type-check the library package only. Tests lean heavily on fakes/fixtures
# where strict typing is high-noise, low-value; the CI gate targets canlib/.
include = ["canlib"]

[tool.ty.environment]
python-version = "3.12"

# Architecture contracts. Dependencies point down; see
# plans/2026-11-04-package-layout-and-layering.md for the target layers and
# docs/development/architecture.md for what each package is for.
#
# These are written against the packages that exist today. Each package move adds its new
# name to the contract it belongs to, and the codemod that moves a package rewrites the names
# in this section. `ignore_imports` is the debt list: an entry may be removed, never added
# (tests/contracts/test_structure.py pins the count). An entry whose import no longer exists
# fails the check, so a fixed import has to leave the list.
[tool.importlinter]
root_package = "canlib"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Nothing below the interface imports the CLI"
type = "forbidden"
source_modules = [
    "canlib.actions",
    "canlib.analysis",
    "canlib.ansi",
    "canlib.broadcast",
    "canlib.build_info",
    "canlib.can_logs",
    "canlib.captures",
    "canlib.config",
    "canlib.contribute",
    "canlib.contribute_logs",
    "canlib.contribute_source",
    "canlib.contribute_summary",
    "canlib.core",
    "canlib.dbc_repair",
    "canlib.dtc",
    "canlib.ecus",
    "canlib.explorer",
    "canlib.expression",
    "canlib.first_run",
    "canlib.formatting",
    "canlib.grid_prompt",
    "canlib.grid_regions",
    "canlib.install_context",
    "canlib.keepmode",
    "canlib.lock",
    "canlib.lock_watchdog",
    "canlib.migrations",
    "canlib.modes",
    "canlib.physical_bands",
    "canlib.poll_backoff",
    "canlib.poll_schedule",
    "canlib.privacy",
    "canlib.profile",
    "canlib.query",
    "canlib.response_frames",
    "canlib.safety",
    "canlib.scan_presets",
    "canlib.scan_state",
    "canlib.session_manager",
    "canlib.states",
    "canlib.timing",
    "canlib.transport",
    "canlib.tui",
    "canlib.uds",
    "canlib.unit_guess",
    "canlib.update_check",
    "canlib.validation",
    "canlib.variants",
    "canlib.wake",
    "canlib.wican",
    "canlib.yaml_edit",
]
forbidden_modules = [
    "canlib.cli",
    "canlib.commands",
]
allow_indirect_imports = true
ignore_imports = []

