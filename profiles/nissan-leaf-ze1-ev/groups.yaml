# Nissan Leaf ZE1 (2018-2024, 40 kWh and 62 kWh e+) — capture/monitor selector groups
#
# A group is a named, reusable query: a list of ECU / ECU:PID selectors in the
# shared mini-language. Reference one on the command line with the `@` sigil, and
# compose it with ad-hoc selectors:
#
#   canair monitor @charging                 # expands to the group's members
#   canair monitor @driving CLU:220B         # a group plus an extra selector
#   canair read @powertrain --save --label "…"
#
# Members are plain selectors (ECU or ECU:PID) — not full mini-language steps.
# Inspect/edit with `canair groups` (never hand-edit — it re-validates on write).
# See canlib/schema/groups_schema.yaml and `canair validate groups`.

groups:
  battery:
    description: 'Battery health snapshot: SOC, SOH, Hx, capacity, pack voltage/current, cell min/max, temperatures'
    members: [LBC:2101, LBC:2103, LBC:2104, LBC:2161]
  cells:
    description: All 96 cell-pair voltages plus min/max (cell balance check)
    members: [LBC:2102, LBC:2103]
  driving:
    description: Gear, speed, motor rpm/torque/power, pedal, steering and pack current while driving
    members: [VCM:221156, VCM:22121A, VCM:221255, VCM:221254, VCM:221146, VCM:221248, ABS:221115, ABS:221208, LBC:2101]
  charging:
    description: Plug state, charge mode, charger output power, pack voltage/current and temperatures
    members: [VCM:22114E, VCM:221234, VCM:221236, LBC:2101, LBC:2104]
  climate:
    description: A/C and PTC heater power, cabin/ambient/evaporator temperatures, battery temperature
    members: [VCM:221151, VCM:221261, VCM:221262, VCM:221106, VCM:22115D, HVAC:2110, LBC:2104]
  power:
    description: 'Where the energy goes: pack, motor, A/C, PTC, auxiliary and 12 V'
    members: [VCM:221248, VCM:221146, VCM:221151, VCM:221152, VCM:221261, VCM:221262, VCM:221103, VCM:221183, LBC:2101]
  tyres:
    description: Four tyre pressures
    members: [METER:220E25, METER:220E26, METER:220E27, METER:220E28]
  lifetime:
    description: 'Slow-changing counters: quick/AC charge counts, odometer, SOH, distance counter'
    members: [VCM:221203, VCM:221205, METER:220E01, LBC:2161, LBC:210C]
