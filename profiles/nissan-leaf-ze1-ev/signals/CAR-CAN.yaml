messages:
  '0x5C5':
    tx_ecu: METER
    signals:
      ODOMETER:
        start_bit: 15
        length: 24
        byte_order: big
        unit: km
        verified: false
        source: WiCAN leaf-ze1-2018-.json filter (https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/nissan/leaf-ze1-2018-.json); OVMS vehicle_nissanleaf.cpp
        notes: "Odometer, 24-bit big-endian at data bytes 1-3 (dalathegreat AZE0 CAR-CAN DBC: Odometer 15|24@0+). The unit follows the car's market, not the dash setting: miles on a US car, flagged by bit 5 of byte 6 of frame 0x355 (OVMS). Bit 2 of byte 0 is the parking brake. Not seen on this car yet (OBD-port gateway, see EV-CAN 0x284). Redundant with METER:220E01 ODOMETER."
