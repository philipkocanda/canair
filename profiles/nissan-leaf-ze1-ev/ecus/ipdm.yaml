      manual's editions before and after VIN 1N4BZ1CP8KC303774 are merged. Titles only: no
      detection logic.
    verified: false
    B2098:
      description: Ignition relay on stuck
    B2099:
      description: Ignition relay off stuck
    U1000:
      description: CAN comm circuit
