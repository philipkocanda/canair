# yaml-language-server: $schema=https://philipkocanda.github.io/canair/schema/ecus.json
ABS:
  tx_id: 0x740
  can_bus: [CHASSIS-CAN]
  identity:
    description: ABS / vehicle dynamics control (also reports pedal and steering inputs)
    notes: >-
      Address from the dalathegreat/leaf_can_bus_messages ECU table (generation-wide, not
      ZE1-specific). Signals from OBDb Nissan-Leaf and dalathegreat.
    identity_confidence: tentative
  pids:
    221115:
      parameters:
        ACCEL_PEDAL:
          expression: B4/2
          unit: "%"
          min: "0"
          max: "100"
          source: OBDb, dalathegreat
          source_links:
            - https://github.com/OBDb/Nissan-Leaf
            - https://github.com/dalathegreat/leaf_can_bus_messages
          verified: false
          notes: Accelerator pedal position, 0.5 % per bit (0-200 raw).
      status: active
      period: 2000
      vehicle_states: [READY]
      notes: Accelerator pedal position.
    221208:
      parameters:
        STEERING_ANGLE:
          expression: "[S4:S5]/10"
          unit: °
          min: "-720"
          max: "720"
          source: dalathegreat
          source_links:
            - https://github.com/dalathegreat/leaf_can_bus_messages
          verified: false
          notes: >-
            Steering wheel angle, signed 16-bit /10 degrees (dalathegreat: -720..+720, negative =
            left). No OBDb vector.
      status: active
      period: 2000
      vehicle_states: [READY]
      notes: Steering wheel angle.
    221209:
      parameters:
        BRAKE_MC_PRESSURE_RAW:
          expression: "[B4:B5]"
          min: "0"
          max: "65535"
          source: OBDb, dalathegreat
          source_links:
            - https://github.com/OBDb/Nissan-Leaf
            - https://github.com/dalathegreat/leaf_can_bus_messages
          verified: false
          notes: >-
            Brake master-cylinder pressure, raw unsigned 16-bit (0-369 per dalathegreat). OBDb
            divides by 1.536 with unit unknown, so the raw value is kept.
      status: active
      period: 2000
      vehicle_states: [READY]
      notes: Brake master-cylinder pressure.
  dtcs:
    source: >-
      Nissan 2019 Leaf service manual, DTC index: brake control system (ABS actuator and electric
      unit section). The manual's editions before and after VIN 1N4BZ1CP8KC303774 are merged.
      Titles only: no detection logic.
    verified: false
    C1101:
      description: Rear right wheel sensor 1
    C1102:
      description: Rear left wheel sensor 1
    C1103:
      description: Front right wheel sensor 1
    C1104:
      description: Front left wheel sensor 1
    C1105:
      description: Rear right wheel sensor 2
    C1106:
      description: Rear left wheel sensor 2
      notes: >-
        Some lists show the -01 and -61 forms as front left. Rear left fits the numbering.
    C1107:
      description: Front right wheel sensor 2
    C1108:
      description: Front left wheel sensor 2
    C1109:
      description: Power and ground system
    C1110:
      description: ABS actuator and electric unit (control unit)
    C1111:
      description: ABS motor, motor relay system
    C1113:
      description: Yaw rate/side/decel G sensor
    C1115:
      description: Wheel sensor
      notes: The manual title names no wheel.
    C1116:
      description: Stop lamp switch
    C111D:
      description: ABS motor, motor relay system
    C111E:
      description: Yaw rate sensor
    C111F:
      description: G sensor
    C1120:
      description: Front left ABS in valve system
    C1121:
      description: Front left ABS out valve system
    C1122:
      description: Front right ABS in valve system
    C1123:
      description: Front right ABS out valve system
    C1124:
      description: Rear left ABS in valve system
    C1125:
      description: Rear left ABS out valve system
    C1126:
      description: Rear right ABS in valve system
    C1127:
      description: Rear right ABS out valve system
    C1128:
      description: G sensor
    C1129:
      description: G sensor/yaw rate sensor
    C112C:
      description: Steering angle sensor
    C112D:
      description: ABS motor, motor relay system
    C112E:
      description: Valve coil system
    C112F:
      description: Wheel sensor
      notes: The manual title names no wheel.
    C1140:
      description: Actuator relay system
    C1142:
      description: Press sensor
    C1143:
      description: Steering angle sensor
    C1144:
      description: Incomplete steering angle sensor adjustment
    C1145:
      description: Yaw rate/side/decel G sensor
    C1146:
      description: Yaw rate/side/decel G sensor
    C1155:
      description: Brake fluid level switch
    C1164:
