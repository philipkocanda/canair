    220E2D:
      parameters:
        SOC_DASH:
          expression: B21
          unit: "%"
          min: "0"
          max: "100"
          source: OBDb
          source_links:
            - https://github.com/OBDb/Nissan-Leaf
          verified: false
          notes: >-
            State of charge as shown on the dashboard, one byte at data byte 14 of the 22-byte
            reply. Reproduces 16 OBDb vectors. The exact value behind LBC SOC_D's linear estimate.
            Read 87 in READY and 86 while charging, but 100 with the car off (2026-10-21), a
            placeholder the 0-100 filter does not drop.
      status: active
      period: 30000
      vehicle_states: [SLEEP, READY, CHARGING]
      notes: Dashboard state of charge (22-byte reply, 4 frames).
