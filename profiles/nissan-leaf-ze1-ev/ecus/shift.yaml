SHIFT:
  tx_id: 0x79D
  identity:
    description: Electronic shifter
    notes: >-
      Address from the dalathegreat/leaf_can_bus_messages ECU table (generation-wide, not
      ZE1-specific). The same README says only the ZE0 has a Shift module, but 0x79D answered 10 01
      with NRC 0x12 at 0x7BD in the 2026-10-21 READY discovery sweep. No DIDs known.
    identity_confidence: tentative
  dtcs:
    source: >-
      Nissan 2019 Leaf service manual, DTC index: transmission. The manual's editions before and
      after VIN 1N4BZ1CP8KC303774 are merged. Titles only: no detection logic.
    verified: false
