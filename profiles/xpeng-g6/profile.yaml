# Xpeng G6 (87.5 kWh) — vehicle profile settings (created by `canair profile create`)
# Per-ECU definitions live in ecus/. Populate with `canair discover --register`
# (add --identify to read identity DIDs), then `canair pids ...`. Validate with
# `canair validate`.
#
car_model: "Xpeng G6 (87.5 kWh)"
# The upstream ELM327 init is
# ATH1;ATSP6;ATS0;ATM0;ATAT1;ATSH704;ATCRA784;ATFCSH704;ATFCSM1 — the header /
# receive-address / flow-control parts are per-request and set by canair itself,
# so only the neutral protocol/format bits are kept here (wican-ws transport
# only; the slcan-tcp raw path ignores init).
init: "ATSP6;ATS0;ATAL;"

# XPeng is ISO 15765-4 11-bit / 500 kbit (ATSP6).
can_bitrate: 500000

# CAN diagnostic addressing. XPeng answers at tx_id + 0x80 (request 0x704 ->
# response 0x784, from the upstream ATSH704/ATCRA784), NOT the +0x08 default.
addressing:
  rx_offset: 0x80

# ELM327 response timeout in ms, applied as ATSTxx (--elm-timeout overrides).
# Raise it for slow-responding ECUs; lower it to speed up cycles / NO-DATA
# detection. Left unset, the ELM327 default applies.
# response_timeout_ms: 500

# Client-side ISO-TP tuning for the slcan-tcp transport. Defaults suit most
# 11-bit/classic-CAN vehicles; override per this car's needs. See
# canlib/transport/isotp_params.py for every field + default.
# isotp:
#   tx_padding: 0xAA   # ISO-TP fill byte (0x00/0xCC on some makes)
#   can_fd: false      # true for CAN-FD ECUs
