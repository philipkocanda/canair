        the OBC_12V_SUPPLY_V word sags (about 26 mOhm source resistance); no byte tracks a current.
        Derived current VCU_AUX_POWER / OBC_12V_SUPPLY_V gives 9-48 A in that window; it inherits
        VCU_AUX_POWER's unverified status. The OBC firmware (2026-11-08) confirms it: the OBC has no
        DC-DC converter, and OBC_12V_SUPPLY_V is its own 12 V supply.
      notes: >-
        Also absent from VCU 2101/2102, MCU 2102 (motor phase currents) and EWP 21F2. No hidden
        service-21 page on OBC or VCU. VCU 21F2 has no charging capture yet. The Soul's standalone
        LDC (0x7C5) DC_Current_Out has no counterpart here.
      what_to_test:
