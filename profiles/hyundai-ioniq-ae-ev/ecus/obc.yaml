  research:
    - type: scan
      target: 21 00-FF
      status: done
      priority: P3
      vehicle_states: [READY]
      date: "2026-07-22"
      result: >-
        Only 2101 and 2102 respond (OBC idle, ignition on); all other LIDs NRC. No 21F2, unlike
        BMS/MCU/VCU.
    - type: decode
      target: 2101 charge state machine B17/B22/B35/B36
      status: done
      priority: P2
      vehicle_states: [CHARGING]
      created: "2026-08-02"
      updated: "2026-11-08"
      result: >-
        Done from the firmware (research/OBC_FIRMWARE_FINDINGS.md section 5.1, 2026-11-08): B27 and
        B37 are status bits copied from P-CAN 0x57F, B28-B31 the BMS 0x597 charge voltage and
        current limits (412.8 V, 20.0 A), B38:B39, B41:B42 and B50:B51 current-sensor zero offsets,
        B47/B49 one AC voltage sample word split by a PCI byte.
      notes: >-
        B17, B22 and B35/B36 were decoded first (high byte of OBC_DC_A, the proximity word B22:B23,
        the OBC_PILOT_DUTY word). In the 2026-08-08 DC fast charges B21 reads 72-75 and B36 49;
        OBC_DC_A, OBC_DC_POWER and OBC_EFFICIENCY read 0.
    - type: decode
      target: broadcast 0x562 (OBC AC charge current / charge-limit command)
      status: done
      priority: P2
      vehicle_states: [CHARGING, PLUGGED]
      created: "2026-10-29"
      updated: "2026-11-08"
      result: >-
        Not used on this car: the OBC firmware (sw EAEEH5L-OS3-D000) does not receive 0x562. It
        takes the AC charge-current setting from P-CAN 0x414 byte 0
        (research/OBC_FIRMWARE_FINDINGS.md section 7), as the 2019 Kona does.
      notes: >-
        On the Kona the bench commands the OBC on broadcast 0x562: byte 1 is the AC charge-current
        level (0x08 max, 0x0C reduced, 0x04 min), byte 4 the AC charge target as percent x 2; a
        burst of 3 frames applies it. Not visible over OBD here (gateway-isolated), so it needs a
        P-CAN tap and import can. ID and layout on the Ioniq AE are unconfirmed.
      sources:
        - projectgus car_hacking, bench_kona/bench_kona.py (Kona OS EV)
      what_to_test:
        - Tapped P-CAN sniff while changing the AC charge-current setting and the target SoC in the car menu; look for 0x562 (or a neighbour) with byte1/byte4 changing in step.
    - type: verify
      target: "AC charge-current setting (station and portable): encoding and amps"
      status: pending
      priority: P2
      vehicle_states: [PLUGGED, CHARGING]
      created: "2026-10-30"
      updated: "2026-10-30"
      result: >-
        From the OBC firmware (research/OBC_FIRMWARE_FINDINGS.md section 7, 2026-11-08), not yet
        seen on a bus: the setting arrives on P-CAN 0x414 byte 0, bits 2-3 station and bits 1-0
        portable (0 Maximum, 1 Reduced, 2 Minimum), is kept across resets and is reported back in
        0x58E byte 5 (bits 0-1 station, 2-3 portable). It scales the J1772 pilot current by
        1.00/0.90/0.60 at a station and 1.00/0.75/0.50 on the portable cable. The head unit sends it
        in HU_EV_PE_00 (MM-CAN 0x1AA) byte 3 (ioniq-avn-fw).
      notes: >-
        Every stored AC charge on the owner car (12 days, 7.9-23.9 A pilot) drew 92-97 % of the
        pilot current. The OBC tells a station from the portable cable by the pilot alone: a mean
        duty of 23 % (13.8 A) or more is a station, so this car's 10 A and 13 A wallbox sessions
        count as portable-cable charges and its 16 A sessions as station charges. No OBC 2101 byte
        carries the setting.
      sources:
        - "ioniq-avn-fw EU firmware: GreenCar ChargeElectricSettingActivity and layouts, IviServer GreenCarMessageSetting, com.lge.ivi HuEvPe00/GwEvP02, MICOM 0x1AA setters 0x85E6C/0x85EC2; canair OBC 2101 captures; 2026-10-30"
      what_to_test:
        - "Plugged in at the home wallbox, ignition on (the page needs the OBC awake): set the station current to Reduced, wait 2 minutes, then Minimum, then back to Maximum, pressing 's' at each change. AC_INPUT_A / OBC_PILOT_AMPS gives the real steps, and any OBC 2101/2102 byte that changes in step is the OBC's stored copy."
        - "Repeat on the portable cable with the portable setting, and once more changing only the setting for the cable that is not plugged in: the current should not move."
      capture_protocol: >-
        canair monitor OBC:2101,2102 BMS:2101 --save --keep-all --interval 2 --label 'AC
        charge-current setting steps' --state CHARGING; press s at each menu change and name the
        setting.
    - type: scan
      target: 01 01, 01 21, 01 30, 01 31
      status: captured
      priority: P3
      vehicle_states: [IG3]
      created: "2026-11-01"
      updated: "2026-11-01"
      result: >-
        2026-11-01, AC charging: the OBC (0x7ED) answers OBD-II Mode 01 although it advertises none
        of it (01 00, 01 20, 01 40 and 09 00 return NO DATA). 01 01 -> 00 04 00 00 (MIL off, no
        DTCs, only the comprehensive-components monitor flagged), 01 21 -> 00 00 (0 km driven with
        the MIL on), 01 30 -> FF (255 warm-ups since DTCs were cleared, saturated), 01 31 -> 2A 4E
        (10830 km since DTCs were cleared). The BMS and MCU advertise these PIDs but return NO DATA
        or one-byte replies, so the OBC is the only ECU on this car that serves them.
      notes: >-
        01 31 is a candidate signal (distance since the last DTC clear); the CLU odometer read 75669
        km on 2026-10-25, which puts that clear near 64800 km. The firmware (2026-11-08) serves
        exactly these four Mode 01 PIDs: 01 31 is the gateway odometer (P-CAN 0x5D0) minus the
        odometer stored at the last clear, and the supported-PID entries (01 00, 20, 40) are
        disabled, which is why they give no reply.
      sources:
        - on-car 2026-11-01 support probe (canair read and discover --functional --save, wican-ws, AC charging)
      what_to_test:
        - Does 01 31 grow with distance driven (co-poll with CLU 22B002 ODOMETER on a drive)?
      capture_protocol: >-
        canair monitor OBC:01/31 CLU:22B002 --save --label 'OBC 01 31 vs odometer' --state DRIVING
    - type: scan
      target: memory image (ReadMemoryByAddress 0x23)
      status: captured
      priority: P2
      vehicle_states: [CHARGING]
      created: "2026-11-08"
      updated: "2026-11-08"
      date: "2026-11-08"
      result: >-
        The whole programmed flash was read while AC charging (528 KiB in 30 min, 74 extents read
        twice and the same, no new fault code on 14 ECUs, the charge kept running). 4 MiB at
        0x000000-0x3FFFFF: boot 0x000000-0x0065FF and 0x00FFC0-0x010EFF, calibration
        0x143000-0x1451BF, program 0x180000-0x19A13F and 0x19C440-0x1C0AFF, the rest erased.
        Analysed statically in research/OBC_FIRMWARE_FINDINGS.md.
      notes: >-
        The first 4 KiB are byte for byte the VCU's, and the rest of the boot block nearly so: the
        same bootloader, with a flash-block table up to 0x380000 and a start-up loop that clears RAM
        up to 0x40040000. So the OBC is probably the same 4 MiB, 256 KiB-RAM PowerPC part as the VCU
        (MPC5674F class; not confirmed). Reads stayed below 0x400000: the MCU went silent at
        0x864000. Identity strings: ecu_id at 0xFFF6, calibration at 0x10014, sw_id at 0x1C045A,
        part number at 0x1C046A. The dump stays local.
      sources:
        - canair memory image OBC --range 000000-3FFFFF, 2026-11-08 (dump local only)
    - type: iocontrol_scan
      target: 30 00-FF (LED LIDs 01-04 first)
      status: done
      priority: P3
      vehicle_states: [PARKED, ACC]
      created: "2026-10-30"
      updated: "2026-11-08"
      result: >-
        Answered by the firmware (research/OBC_FIRMWARE_FINDINGS.md section 4.3, 2026-11-08): 0x30
        opens only in session 0x90, and only LIDs 06 and 07 are enabled. Both run the end-of-line
        sensor calibration, which overwrites the stored calibration (2102); LID 06 also runs the
        power stage. No LED LID exists: 30 01 00 gets NRC 0x80 in session 0x81 and NRC 0x79 in 0x90.
        Do not send 0x30 to this OBC.
      notes: >-
        OVMS (Open Vehicle Monitoring System) Kia Soul EV BlueChargeLed()
        (vehicle_kiasoulev.cpp:1101-1115) sends the Soul OBC (0x794) 10 81, 10 90, then KWP2000 30
        {led} {00 on | 11 off}, led 1 centre, 2 left, 3 right, 4 all; if real, 30 {LID} 00 actuates
        rather than releases. Weak evidence: the function has no callers, builds an invalid
        single-frame length (08 03 30 …) and never returns to 10 01. The Soul park-brake 30 commands
        go to 0x7A5 (the smart key address), and OVMS's own TODO says they do not work. No captured
        30 traffic exists for any HKMC car. The 2021 Kona OBC (7E5), VCU and MCU accept 10 90 and
        reject 10 03 (profiles/hyundai-kona-os-ev/captures/can/221210-*); 10 90 is untested on this
        OBC. Do not sweep 30 here until the meaning of 30 {LID} 00 is known.
      sources:
        - "OVMS vehicle_kiasoulev: vehicle_kiasoulev.cpp BlueChargeLed(), ks_commands.cpp CommandParkBreakService, ks_can_send.cpp Send_EBP_Command (openvehicles/Open-Vehicle-Monitoring-System-3, read 2026-10-30)"
    - type: verify
      target: which module hosts the LDC (OBC 0x7E5 vs the EPCU)
      status: done
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-29"
      updated: "2026-11-08"
      result: >-
        Not in the OBC. Its firmware (research/OBC_FIRMWARE_FINDINGS.md section 5.1, 2026-11-08) has
        no DC-DC control, and the three 2101 signals named LDC_* come from the OBC's own ADC
        channels; they are now OBC_TEMP, OBC_12V_SUPPLY_V and OBC_BATTERY_SIDE_V. The LDC is the
        EPCU's, as uhi22's teardown shows.
      notes: >-
        uhi22's teardown shows the 12 V DC-DC converter (LDC) inside the EPCU housing with the
        inverter, and the VCU's ecu_id is VLDC. This profile reads the LDC_* values from OBC 2101 at
        0x7E5, so either the OBC relays the LDC's values or those signals are named after the wrong
        module. The EPCU broadcasts its DC-DC temperature on 0x523 bytes 2-3 (sensor R147 on the
        DC-DC board).
      sources:
        - uhi22 EPCU readme (teardown photos of the DC-DC boards inside the EPCU), 2026-10-29
    - type: verify
      target: 2101 [B20:B21] 16-bit value
      status: done
      priority: P2
      vehicle_states: [PLUGGED, CHARGING]
      created: "2026-10-23"
      updated: "2026-11-08"
      result: >-
        One word: the control-pilot voltage x100, now OBC_PILOT_V (research/OBC_FIRMWARE_FINDINGS.md
        section 5.1, 2026-11-08). B20 alone is the voltage / 2.56: 0 below 2.56 V, 2 at J1772 state
        C (5.8-5.9 V), 3 at state B (8.9-9.0 V); the US logs' 1 and 4 are 2.56-5.11 V and
        10.24-12.79 V.
      notes: >-
        B20 (then defined alone as OBC_CHARGE_STATE) and B21 may be one big-endian 16-bit value. As
        (B20<<8)|B21 it reads 50-53 with B20 = 0, 582-591 with 2 and 890-900 with 3. In the US logs
        it ramps smoothly across B20 boundaries (B20 = 1 and 4 also appear), and after a charge
        stops B21 decays 0xE3 to 0x34 with B20 = 0. Scale and meaning unknown.
      sources:
        - JejuSoul US Ioniq logs, canair 2026-10-23
    - type: decode
