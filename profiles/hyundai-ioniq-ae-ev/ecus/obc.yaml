# yaml-language-server: $schema=https://philipkocanda.github.io/canair/schema/ecus.json
# ─── OBC (On-Board Charger) ─────
#
# Self-identifies (KWP2000 1A8C) as "AEEOBC51". Part 36400-0E150. Its firmware (sw
# EAEEH5L-OS3-D000) is mapped in research/OBC_FIRMWARE_FINDINGS.md: every 2101/2102 byte, the
# session matrix, the P-CAN frames. The 12 V DC-DC converter (LDC) is in the EPCU (VCU, ecu_id
# "VLDC"), not here; the 2101 signals once named LDC_* are the OBC's own measurements.
#
# KWP2000 sessions (2026-07-22, READY): only 0x81 is accepted; 2101/2102 answer in the default
# session too. Never send SID 0x99 or, in session 0x90, 0x30 06/07 or 0x31 00/01 (findings §9).

OBC:
  tx_id: 0x7E5
  can_bus: [P-CAN]
  identity:
    alias: LDC  # kept so LDC:2101 still resolves; the LDC itself is in the EPCU
    description: On-Board Charger
    part_number: "36400-0E150"
    ecu_id: AEEOBC51  # KWP2000 1A8C
    sw_id: "EAEEH5L-OS3-D000"
    calibration: "00000001"
    id_protocol: KWP2000  # 1Axx
    notes: >-
      Reports the OBC's own measurements (AC input, DC output, pilot and proximity voltages, its
      temperature and 12 V supply) and copies of its P-CAN frames 0x57F and BMS 0x597. The 12 V
      DC-DC converter (LDC) and its enable/inhibit bits are in the EPCU (VCU 0x7E2, ecu_id VLDC).
      Max AC charge 29 A / 6.6 kW (2017 model; the 2019 facelift does 32 A).

  vehicle_states: [IG3]
  pids:
    2101:
      response_frames: 7
      status: active
      period: 5000
      vehicle_states: [IG3]
      source: canair cross-tab vs BMS 2101 B14 and VCU 2101, 2026-10-23; JejuSoul US Ioniq logs
      verified: true
      notes: >-
        42 data bytes, built from the OBC's measurements and its P-CAN frames (OBC firmware,
        2026-11-08). Constant in the firmware and in all 13346 captures: the header B4-B7 (FF FF F8
        00), B27 bit 0 (1), B27 bits 4-7 (bits 5-6 a calibration-set value of 2), and B37 bits 5 and
        6 (1 while the stored sensor calibration sets 1 and 2 are present) and 7 (0).
      parameters:
        OBC_BATTERY_SIDE_V:
          expression: "[B45:B46]/100"
          unit: V
          min: "0"
          max: "500"
          source: Live READY vs charging + BMS cross-check (2026-07-20); OBC firmware 2101 builder (ADC channel), 2026-11-08
          notes: >-
            HV voltage at the OBC's output terminals, on the battery side of its output relay: one
            of the OBC's own ADC channels, not an LDC value. Reads the pack voltage at READY while
            OBC_OUTPUT_V reads about 4 V. r=0.998 vs VCU:2102:VCU_INVERTER_INPUT_VOLTAGE (n=5689).
            At the end of the 2026-11-03 top-up it read 353.2 V 0.3 s after the BMS first reported
            the relay open and 11.1 V 2.9 s later, while BMS BATTERY_VOLTAGE stayed at 361.8 V; 19 V
            1.3 s after the relay was last seen closed at the 2026-10-21 top-up end.

        OBC_12V_SUPPLY_V:
          expression: "[B25:B26]/100"
          unit: V
          min: "0"
          max: "20"
          source: Decoded from live captures (2026-04-14); OBC firmware 2101 builder (ADC channel), 2026-11-08
          notes: >-
            The OBC's own 12 V supply, measured on one of its ADC channels. 14.52 V charging, 14.31
            V at READY, 14.59-14.62 V through the parked 12 V top-ups. Sagged 14.5 to 13.6 V and
            recovered as a rear defroster load switched on and off (2026-07-22). Down to 13.38 V 2.1
            s after the last 14.59 V reading at the 2026-11-03 top-up end, once the LDC had stopped.

        OBC_TEMP:
          expression: "B19-100"
          unit: "°C"
          min: "-40"
          max: "120"
          source: Kia Soul EV LDC CSV (LDC Temp = i-100) + charging session trend (2026-07-19); OBC firmware 2101 builder, 2026-11-08
          notes: >-
            An OBC temperature sensor: one of its own ADC channels through an 18-point thermistor
            table; the same value goes out on P-CAN 0x57F byte 2. Rose smoothly 28 to 65 °C over a 3
            h AC charge; 21 °C at READY with about 18 °C ambient.

        OBC_PFC_V:
          expression: "[B10:B11]/100"
          unit: V
          min: "0"
          max: "500"
          source: Decoded from live captures (2026-04-14); OBC firmware fault detectors P1E01-P1E03 and P1E14 read this channel (OBC_FIRMWARE_FINDINGS.md section 8), 2026-11-08
          notes: >-
            The PFC stage's DC-bus voltage: the firmware's PFC-voltage faults (P1E02/P1E03 sensor
            low/high, P1E14 above 435 V, P1E01 below 80 % of the AC input) read this channel. About
            370-400 V during AC charging, about 6 V when the OBC is idle.

        OBC_OUTPUT_V:
          expression: "[B12:B13]/100"
          unit: V
          min: "0"
          max: "500"
          source: Decoded from live captures (2026-04-14, 2026-07-20)
          notes: 353-384 V during AC charging, about 3.8 V when the OBC is idle.

        OBC_DC_A:
          expression: "[B17:B18]/100"
          unit: A
          min: "0"
          max: "50"
          source: "Decoded from live captures (2026-04-14)"
          notes: OBC DC output current while charging; 0 when idle.

        OBC_PILOT_DUTY:
          expression: "[B35:B36]/10"
          unit: "%"
          min: "0"
          max: "100"
          source: Live EVSE current step 10/13/16A (2026-07-27)
          source_links:
            - https://docs.google.com/spreadsheets/d/1R2dW_4-ANg04TQdkHH52-8wdYItBkWDfppcsqOc-m1M
          notes: >-
            J1772 control-pilot duty. Read 16.5, 21.5 and 26.5 % at 10, 13 and 16 A pilot
            (2026-07-27). 100 % when plugged in with no current offered.
        OBC_PILOT_AMPS:
          expression: "[B35:B36]*0.06"
          unit: A
          min: "0"
          max: "80"
          source: Live EVSE current step 10/13/16A (2026-07-27); J1772 duty x 0.6
          notes: >-
            Pilot duty x 0.6. Read 9.9, 12.9 and 15.9 A at 10, 13 and 16 A pilot (2026-07-27); reads
            60 at 100 % duty, when no current is offered.
        # 2101 has no OBC heatsink/inside/water temperature (Soul OBC S/T/U) other than OBC_TEMP:
        # the rest of the record is voltages, currents, flags and the BMS limits (firmware).
        OBC_DC_POWER:
          expression: "[B12:B13]*[B17:B18]/10000000"
          unit: kW
          min: "0"
          max: "10"
          source: Derived OBC_OUTPUT_V*OBC_DC_A; wattmeter check 2026-07-26; output voltage instead of the PFC voltage from 2026-11-08 (OBC firmware)
          notes: >-
            OBC_OUTPUT_V x OBC_DC_A. Until 2026-11-08 it used the PFC voltage (B10:B11), about 2.5 %
            higher; the 2026-07-26 wattmeter check (3.30-3.36 kW at 16 A) did not separate the two.
            0 when idle.
        AC_INPUT_V:
          expression: "[B14:B15]/100"
          unit: V
          min: "0"
          max: "300"
          source: Live 16A AC charge 2026-07-26; checked and confirmed accurate
          notes: 218-228 V while charging, about 8.5 V with no EVSE connected.
        AC_INPUT_A:
          expression: "[B33:B34]/100"
          unit: A
          min: "0"
          max: "40"
          source: Live EVSE current step 10/13/16A (2026-07-27) + AC power balance
          notes: >-
            Measured AC input current. Read 9.3, 12.4 and 15.4 A at 10, 13 and 16 A pilot
            (2026-07-27), about 0.6 A below OBC_PILOT_AMPS.
        OBC_EFFICIENCY:
          expression: 100*[B12:B13]*[B17:B18]/([B14:B15]*[B33:B34])
          unit: "%"
          min: "0"
          max: "105"
          source: "Derived: 100 * OBC_DC_POWER*1000 / (AC_INPUT_V*AC_INPUT_A), reduced to raw bytes; output voltage from 2026-11-08 (OBC firmware)"
          verified: false
          notes: >-
            OBC DC output power over AC apparent power (AC_INPUT_V x AC_INPUT_A); no value when
            AC_INPUT_A is 0. Median 95.8 %, at most 97.6 % over 9507 charging rows; the wattmeter
            check gave 95 % at about 3.5 kW (2026-07-26). With the PFC voltage it read up to 106 %.
        OBC_CABLE_SESSION:
          expression: B37:4
          min: "0"
          max: "1"
          verified: false
          notes: >-
            Copy of P-CAN 0x57F byte 4 bit 1. 1 whenever a charge cable is connected, AC or DC, and
            0 unplugged, in every row aligned with BMS 2101. In the US logs it read 0 for one sample
            just after an AC plug-in (B37 0x62). 0x581 is all zero while it is 0.
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
        OBC_PILOT_V:
          expression: "[B20:B21]/100"
          unit: V
          min: "0"
          max: "13"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08; matches the J1772 state voltages in this car's captures
          verified: true
          notes: >-
            Control-pilot voltage. 0.50-0.53 V with no charger, 8.9-9.0 V connected (J1772 state B),
            5.8-5.9 V charging (state C). B20 alone is the voltage / 2.56 (0, 2 or 3 in this car's
            captures; the US logs add 1 and 4).
        OBC_PROXIMITY_V:
          expression: "[B22:B23]/100"
          unit: V
          min: "0"
          max: "5"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08; cross-tab vs BMS 2101 AC_CHARGER_CONNECTED and the 2026-08-08 DC charges
          verified: false
          notes: >-
            An OBC ADC channel with three levels: 4.44-4.45 V unplugged, 1.86-1.89 V with an AC
            plug, 3.71 V during both recorded DC fast charges (2026-08-08).
        OBC_PLUG_STATE:
          expression: B37:1*2+B37:0
          min: "0"
          max: "3"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Copy of P-CAN 0x57F byte 0 bits 1-2 (OBC1 OBC_PLUG_STATE). 0 unplugged, 2 with a cable
            connected (AC or DC) in this car's captures (n=13346).
        OBC_EVSE_READY:
          expression: B37:2
          min: "0"
          max: "1"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Copy of P-CAN 0x57F byte 0 bit 4 (OBC1 OBC_EVSE_READY). Set in 9797 of 9849 rows at 5-95
            % pilot duty and in none of 99 at 100 %. 1 -> 0 with the cable still in: the charger
            ended the session (B37 0x76 -> 0x72).
        OBC_STATUS_B0_3:
          expression: B37:3
          min: "0"
          max: "1"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Copy of P-CAN 0x57F byte 0 bit 3 (OBC1 OBC_STATUS_B0_3). 1 in 12 of 13346 rows, briefly
            after a charge ends (B37 0x7A/0x7E).
        OBC_STATUS_B0_0:
          expression: B27:1
          min: "0"
          max: "1"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Copy of P-CAN 0x57F byte 0 bit 0, a flag of the charge state machine. 1 in 9708 of 13346
            rows.
          ship: false
        OBC_FAULT:
          expression: B27:2
          min: "0"
          max: "1"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Copy of P-CAN 0x57F byte 0 bit 6 (OBC1 OBC_FAULT): set while any of the OBC's four fault
            groups is active. 0 in all 13346 rows.
        OBC_STATUS_B5_2:
          expression: B27:3
          min: "0"
          max: "1"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Copy of P-CAN 0x57F byte 5 bit 2. 1 in 49 of 13346 rows.
          ship: false
        OBC_AC_ABOVE_22A_LATCH:
          expression: B9
          min: "0"
          max: "1"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Set after the AC input current stays above 22 A for 70 cycles in charger state 12
            (charging); kept across resets; cleared once when 0x57F byte 1 bit 0 sets.
          ship: false
        OBC_BMS_VOLTAGE_LIMIT:
          expression: "[B28:B29]/10"
          unit: V
          min: "0"
          max: "500"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Copy of BMS frame 0x597 bytes 3-4 (LE, x0.1 V), which the OBC receives on P-CAN. 412.8 V
            while plugged in, 0 otherwise.
        OBC_BMS_CURRENT_LIMIT:
          expression: "[B30:B31]/10"
          unit: A
          min: "0"
          max: "50"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Copy of BMS frame 0x597 bytes 5-6 (LE, x0.1 A), which the OBC receives on P-CAN. 20.0 A
            while charging, 0 when not plugged in.
        OBC_INPUT_CURRENT_A_OFFSET:
          expression: "[B38:B39]/100"
          unit: A
          min: "0"
          max: "2"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Zero offset of input current sensor A: the mean of 1000 samples taken before the input
            relay closes (AC input below 65 V), checked against +-1.5 A (P0D39). A negative offset
            reads 0. 0 until the first charge after power-up.
          ship: false
        OBC_INPUT_CURRENT_B_OFFSET:
          expression: "[B50:B51]/100"
          unit: A
          min: "0"
          max: "2"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Zero offset of input current sensor B, measured like OBC_INPUT_CURRENT_A_OFFSET.
          ship: false
        OBC_DC_CURRENT_OFFSET:
          expression: "[B41:B42]/100"
          unit: A
          min: "0"
          max: "2"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Zero offset of the output (OBC_DC_A) current sensor, measured like
            OBC_INPUT_CURRENT_A_OFFSET and checked against +-1.5 A (P0D52).
          ship: false
        OBC_5V_RAIL_V:
          expression: "[B43:B44]/100"
          unit: V
          min: "0"
          max: "6"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: An OBC ADC channel that reads 4.99-5.00 V in every state.
          ship: false
        AC_INPUT_V_SAMPLE:
          expression: (B47*256+B49)/100
          unit: V
          min: "0"
          max: "400"
          source: OBC firmware 2101 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            A 16-bit value split by the PCI byte B48: an instantaneous, filtered AC input voltage
            sample. 0-317 V while charging at about 224 V RMS (317 V is the peak); 5-7 V with no AC.
          ship: false
    2102:
      status: static
      period: 5000
      vehicle_states: [IG3]
      notes: >-
        34 bytes, byte-identical across 2316 captures in every state: the OBC's stored end-of-line
        sensor calibration. A constant header B4-B7 (FF FC 00 00), then seven offset and gain pairs,
        each stored as (value + 30) x 1000, so a gain near 1.0 reads 0x79xx. Answers while charging
        and in ON; NRC with the car fully off.
      parameters:
        OBC_CAL_AC_SAMPLE_GAIN:
          expression: "[B11:B12]/1000-30"
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration gain of the AC_INPUT_V_SAMPLE channel.
        OBC_CAL_AC_INPUT_V_GAIN:
          expression: (B15*256+B17)/1000-30
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration gain of the AC_INPUT_V channel; the word straddles the PCI byte B16.
        OBC_CAL_PFC_V_GAIN:
          expression: "[B20:B21]/1000-30"
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration gain of the OBC_PFC_V channel.
        OBC_CAL_OUTPUT_V_GAIN:
          expression: "[B25:B26]/1000-30"
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration gain of the OBC_OUTPUT_V channel.
        OBC_CAL_AC_INPUT_A_GAIN:
          expression: "[B29:B30]/1000-30"
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration gain of the one-sensor AC input current path (AC_INPUT_A).
        OBC_CAL_AC_INPUT_A_SUM_GAIN:
          expression: "[B34:B35]/1000-30"
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration gain of the two-sensor AC input current path.
        OBC_CAL_DC_A_GAIN:
          expression: "[B38:B39]/1000-30"
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration gain of the OBC_DC_A channel.
        OBC_CAL_AC_SAMPLE_OFFSET:
          expression: "[B9:B10]/1000-30"
          unit: V
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration offset of the AC_INPUT_V_SAMPLE channel.
        OBC_CAL_AC_INPUT_V_OFFSET:
          expression: "[B13:B14]/1000-30"
          unit: V
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration offset of the AC_INPUT_V channel.
        OBC_CAL_PFC_V_OFFSET:
          expression: "[B18:B19]/1000-30"
          unit: V
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration offset of the OBC_PFC_V channel.
        OBC_CAL_OUTPUT_V_OFFSET:
          expression: "[B22:B23]/1000-30"
          unit: V
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration offset of the OBC_OUTPUT_V channel.
        OBC_CAL_AC_INPUT_A_OFFSET:
          expression: "[B27:B28]/1000-30"
          unit: A
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration offset of the one-sensor AC input current path (AC_INPUT_A).
        OBC_CAL_AC_INPUT_A_SUM_OFFSET:
          expression: (B31*256+B33)/1000-30
          unit: A
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: >-
            Calibration offset of the two-sensor AC input current path; the word straddles the PCI
            byte B32.
        OBC_CAL_DC_A_OFFSET:
          expression: "[B36:B37]/1000-30"
          unit: A
          source: OBC firmware 2102 builder (OBC_FIRMWARE_FINDINGS.md), 2026-11-08
          verified: false
          notes: Calibration offset of the OBC_DC_A channel.

  # Meanings, causes, thresholds and fail-safes are from the Ioniq Electric 2017 service manual,
  # On Board Charger chapter. Unless an entry says "Enabled when", the manual checks the code only
  # while the charger connector is attached, the OBC charging mode is started (EVSE ready) and the
  # auxiliary battery is at 9-16 V. "Also needs" adds to that. The manual lists the DC/DC
  # converter (LDC) codes in its DC/DC Converter chapter (see the VCU entries), not here.
  dtcs:
    source: Ioniq Electric 2017 service manual, On Board Charger diagnosis (EV)
    source_links:
      - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Hybrid%2FElectric%20Powertrain/Testing%20and%20Diagnosis/On%20Board%20Charger%20Diagnosis%20%28EV%29/
      - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Quick%20Lookups/DTC%20Index/DTC%20Index%20%28EV%29/On%20Board%20Charger%20DTCS/
    verified: false
    P0D08:
      source: OBC firmware DTC table (research/OBC_FIRMWARE_FINDINGS.md section 8), 2026-11-08
      notes: >-
        In the DTC table of OBC firmware EAEEH5L-OS3-D000; not in the service manual. Set when the
        battery-side voltage (2101 OBC_BATTERY_SIDE_V) and the BMS pack voltage (P-CAN 0x595) differ
        by 30 V or more; two failure types.
    P0D09:
      description: Battery charging system positive connector stuck open
      causes: faulty OBC fuse, faulty high voltage cable, BMS, OBC
      notes: >-
        Threshold: the voltage difference between the two is 30 V or more. Detection time: 5 sec.
        Also needs: turn the OBC relay 'ON'; voltage of the high voltage battery is over 220 V.
        Service lamp on.
    P0D18:
      description: OBC 5 V sensor supply low (from the firmware's detector)
      source: OBC firmware DTC table (research/OBC_FIRMWARE_FINDINGS.md section 8), 2026-11-08
      notes: >-
        In the DTC table of OBC firmware EAEEH5L-OS3-D000; not in the service manual. Set when the
        5 V rail (2101 OBC_5V_RAIL_V) reads below 4.75 V.
    P0D21:
      description: Battery charger output voltage too low
      causes: faulty high voltage cable, high voltage battery, OBC
      notes: >-
        Threshold: output voltage is below 220 V. Detection time: either for 10 times or 60 sec.
        Also needs: turn the main relay 'ON'; turn the OBC relay 'ON'. Service lamp on.
    P0D24:
      description: Battery charger temperature too high
      causes: failure in the cooling system, lack of coolant, faulty EWP (electronic water pump)
      notes: >-
        Threshold: OBC temperature is higher than 110°C. Detection time: 2 sec. Service lamp on.
        This firmware (EAEEH5L-OS3-D000) sets it above 120 °C.
    P0D27:
      description: Battery charger input voltage too low
      causes: >-
        external EV supply equipment (EVSE), AC input high voltage cable between inlet and OBC, OBC
      notes: >-
        Threshold: AC input voltage (RMS) is less than a predetermined value. Not in the DTC table
        of OBC firmware EAEEH5L-OS3-D000.
    P0D28:
      description: Battery charger input voltage too high
      causes: external AC power supply, OBC
      notes: >-
        Threshold: AC input voltage (RMS) is greater than a predetermined value. A second check
        applies the same test with the input relay off. Not in the DTC table of OBC firmware
        EAEEH5L-OS3-D000.
    P0D2A:
      description: Battery charger input current too high
      causes: failure of the external AC power, OBC
      notes: >-
        Threshold: input current is over 46 A. Detection time: either for 10 times or 30 sec. Also
        needs: turn the S2 switch 'ON'. Service lamp on.
    P0D39:
      description: Battery charger input current sensor circuit range/performance
      causes: OBC
      notes: >-
        Threshold: current sensor offset value is greater than 1.5 A; current sensor offset value is
        below -1.5 A. Detection time: at instant. Also needs: calibrate the current sensor offset.
        Service lamp on.
    P0D3A:
