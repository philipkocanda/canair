# ─── OBC / LDC (On-Board Charger + Low-Voltage DC-DC Converter) ─────
#
# Self-identifies (KWP2000 1A8C) as "AEEOBC51". Part 36400-0E150. Reports two functions:
# - OBC_* / AC_INPUT_*: AC charging of the traction battery; read ~0 outside AC charging.
# - LDC_*: the HV → 12 V DC-DC converter; live in READY and while driving with the OBC idle.
# The LDC enable/inhibit bits are on the VCU (0x7E2, ecu_id "VLDC"), not here.
#
# KWP2000 sessions (2026-07-22, READY): only 0x81 is accepted; 2101/2102 answer in the default
# session too.

OBC:
  tx_id: 0x7E5
  can_bus: [P-CAN]
  identity:
    alias: LDC  # also reports the LDC (DC-DC converter) values
    description: On-Board Charger (integrated LDC / DC-DC converter)
    part_number: "36400-0E150"
    ecu_id: AEEOBC51  # KWP2000 1A8C
    sw_id: "EAEEH5L-OS3-D000"
    calibration: "00000001"
    id_protocol: KWP2000  # 1Axx
    notes: >-
      Reports the OBC values and the LDC (DC-DC converter) values; whether the LDC sits in this
      module or the EPCU is an open research item. OBC signals are active only while AC charging;
      the LDC 12 V output reads live while driving with the OBC idle. The LDC enable/inhibit bits
      are on the VCU (0x7E2, ecu_id VLDC). Max AC charge 29 A / 6.6 kW (2017 model; the 2019
      facelift does 32 A).

  vehicle_states: [IG3]
  pids:
    2101:
      response_frames: 7
      status: active
      period: 5000
      vehicle_states: [IG3]
      source: canair cross-tab vs BMS 2101 B14 and VCU 2101, 2026-10-23; JejuSoul US Ioniq logs
      verified: true
      parameters:
        LDC_HV_INPUT_V:
          expression: "[B45:B46]/100"
          unit: V
          min: "0"
          max: "500"
          source: "Live READY vs charging + BMS cross-check (2026-07-20)"
          notes: >-
            HV pack voltage at the LDC, present at READY and while charging. r=0.998 vs
            VCU:2102:VCU_INVERTER_INPUT_VOLTAGE (n=5689).

        LDC_OUTPUT_V:
          expression: "[B25:B26]/100"
          unit: V
          min: "0"
          max: "20"
          source: "Decoded from live captures (2026-04-14)"
          notes: >-
            12 V rail: 14.52 V charging, 14.31 V at READY. Sagged 14.5 to 13.6 V and recovered as a
            rear defroster load switched on and off (2026-07-22).

        LDC_TEMP:
          expression: "B19-100"
          unit: "°C"
          min: "-40"
          max: "120"
          source: "Kia Soul EV LDC CSV (LDC Temp = i-100) + charging session trend (2026-07-19)"
          notes: >-
            Rose smoothly 28 to 65 °C over a 3 h AC charge; 21 °C at READY with about 18 °C ambient.

        OBC_CHARGE_V:
          expression: "[B10:B11]/100"
          unit: V
          min: "0"
          max: "500"
          source: "Decoded from live captures (2026-04-14)"
          notes: About 370 V during AC charging, about 6 V when the OBC is idle.

        OBC_OUTPUT_V:
          expression: "[B12:B13]/100"
          unit: V
          min: "0"
          max: "500"
          source: Decoded from live captures (2026-04-14, 2026-07-20)
          notes: 353-384 V during AC charging, about 3.8 V when the OBC is idle.

        OBC_DC_A:
          expression: "[B17:B18]/100"
          unit: A
          min: "0"
          max: "50"
          source: "Decoded from live captures (2026-04-14)"
          notes: OBC DC output current while charging; 0 when idle.

        OBC_PILOT_DUTY:
          expression: "[B35:B36]/10"
          unit: "%"
          min: "0"
          max: "100"
          source: Live EVSE current step 10/13/16A (2026-07-27)
          source_links:
            - https://docs.google.com/spreadsheets/d/1R2dW_4-ANg04TQdkHH52-8wdYItBkWDfppcsqOc-m1M
          notes: >-
            J1772 control-pilot duty. Read 16.5, 21.5 and 26.5 % at 10, 13 and 16 A pilot
            (2026-07-27). 100 % when plugged in with no current offered.
        OBC_PILOT_AMPS:
          expression: "[B35:B36]*0.06"
          unit: A
          min: "0"
          max: "80"
          source: Live EVSE current step 10/13/16A (2026-07-27); J1772 duty x 0.6
          notes: >-
            Pilot duty x 0.6. Read 9.9, 12.9 and 15.9 A at 10, 13 and 16 A pilot (2026-07-27); reads
            60 at 100 % duty, when no current is offered.
        # 2101 has no OBC heatsink/inside/water temperature (Soul OBC S/T/U): B28/B29 are constant
        # through a 3 h charge and B21 does not track temperature. LDC_TEMP is the only one.
        OBC_DC_POWER:
          expression: "[B10:B11]*[B17:B18]/10000000"
          unit: kW
          min: "0"
          max: "10"
          source: Derived OBC_CHARGE_V*OBC_DC_A; validated vs wattmeter 2026-07-26
          notes: >-
            OBC_CHARGE_V x OBC_DC_A. Steady 3.30-3.36 kW over the 2026-07-26 16 A AC charge, 0 when
            idle; matched an external wattmeter.
        AC_INPUT_V:
          expression: "[B14:B15]/100"
          unit: V
          min: "0"
          max: "300"
          source: Live 16A AC charge 2026-07-26; checked and confirmed accurate
          notes: 218-228 V while charging, about 8.5 V with no EVSE connected.
        AC_INPUT_A:
          expression: "[B33:B34]/100"
          unit: A
          min: "0"
          max: "40"
          source: Live EVSE current step 10/13/16A (2026-07-27) + AC power balance
          notes: >-
            Measured AC input current. Read 9.3, 12.4 and 15.4 A at 10, 13 and 16 A pilot
            (2026-07-27), about 0.6 A below OBC_PILOT_AMPS.
        OBC_CHARGE_STATE:
          expression: B20
          type: enum
          values:
            0: not connected / EVSE idle (no pilot PWM)
            2: active charge session (current flowing)
            3: connected/standby (pilot PWM present, not charging)
          source: RE 2026-08-02 AC charge transitions, live ON confirmed; DCFC transitions confirmed 2026-08-08
          notes: >-
            0 also while driving. Goes 0, 3, 2 at the start of both AC and CCS DC charges, even
            though OBC_DC_A stays 0 during DC charging. Only 0, 2 and 3 in this car's captures
            (n=11441); the US logs also show 1 and 4.
        OBC_EFFICIENCY:
          expression: 100*[B10:B11]*[B17:B18]/([B14:B15]*[B33:B34])
          unit: "%"
          min: "0"
          max: "105"
          source: "Derived: 100 * OBC_DC_POWER*1000 / (AC_INPUT_V*AC_INPUT_A), reduced to raw bytes (2026-08-06)"
          verified: false
          notes: >-
            OBC DC output power over AC apparent power (AC_INPUT_V x AC_INPUT_A); no value when
            AC_INPUT_A is 0. Mean 98.1 % at about 4.4 kW AC input (2026-08-05, n=1317); the
            wattmeter check gave 95 % at about 3.5 kW (2026-07-26).
        OBC_AC_NOT_CONNECTED:
          expression: B22:0
          min: "0"
          max: "1"
          verified: false
          notes: >-
            0 while an AC charge cable is connected, 1 otherwise, including DC fast charging. The
            complement of BMS 2101 AC_CHARGER_CONNECTED in all 10304 aligned rows, charging or not,
            ignition on or off.
        OBC_MODE:
          expression: B23
          type: enum
          values:
            115: dc_charging
            186: ac_charging
            187: ac_charging
            188: idle
            189: idle
          verified: false
          notes: >-
            0xBC/0xBD idle (READY, 12 V top-up, plugged but not charging), 0xBA/0xBB AC charging,
            0x73 throughout both recorded DC fast charges (2026-08-08). Bit 0 alternates between
            reads in the idle and AC states. The US logs add 0xB8 at power-up and 0x70, 0x74, 0x75
            and 0x80 around AC plug-in and charge end.
        OBC_DC_CHARGE_MODE:
          expression: B23:6
          min: "0"
          max: "1"
          verified: false
          notes: >-
            1 only during DC fast charging: all 54 OBC rows aligned with BMS 2101 B14 = 0x40/0xC3 on
            2026-08-08, and the CCS log in the US data; 0 in every other state.
        OBC_SESSION_FLAGS:
          expression: B37
          type: enum
          values:
            96: unplugged
            114: plugged_not_charging
            118: charging
            122: post_charge_122
            126: post_charge_126
          verified: false
          notes: >-
            0x60 unplugged (all 2248 rows aligned with BMS B14 = 0x03); 0x72, 0x76, 0x7A or 0x7E
            with a cable connected, AC or DC: 0x76 while charging (7942 of 7971 rows), 0x72
            connected without charging, 0x7A/0x7E briefly after a charge ends. The US logs add 0x62
            and 0x68. Bit 2 follows the charger's pilot PWM (set in 9797 of 9849 rows at 5-95 %
            duty, none of 99 at 100 %): 0x76 -> 0x72 is the charger ending the session, 0x76 -> 0x7E
            a stop by the car (2026-08-05, 95 % SOC).
        OBC_CABLE_SESSION:
          expression: B37:4
          min: "0"
          max: "1"
          verified: false
          notes: >-
            1 whenever a charge cable is connected, AC or DC, and 0 unplugged, in every row aligned
            with BMS 2101. In the US logs it read 0 for one sample just after an AC plug-in (0x62).
    2102:
      status: static
      period: 5000
      vehicle_states: [IG3]
      notes: >-
        34 bytes. Byte-identical across 2316 captures in every state: a calibration table (6-byte
        header and 7 groups of 4 bytes whose third byte is always 0x79). Answers while charging and
        in ON; NRC with the car fully off.
      parameters: {}

  research:
    - type: decode
      target: "2101"
      status: captured
      priority: P1
      vehicle_states: [READY, CHARGING]
      notes: >-
        Main 2101 signals are decoded (see parameters). Open: what OBC_OUTPUT_V and OBC_CHARGE_V
        each measure.
      what_to_test:
        - "Compare OBC_OUTPUT_V ([B12:B13]) and OBC_CHARGE_V ([B10:B11]) against a DC meter while charging"
      sources:
        - "Kia Soul EV LDC CSV (0x7C5 2101) + OBC CSV (0x794 2102)"
        - "Kia Niro PR#660"
    - type: scan
      target: 21 00-FF
      status: done
      priority: P3
      vehicle_states: [READY]
      date: "2026-07-22"
      result: >-
        Only 2101 and 2102 respond (OBC idle, ignition on); all other LIDs NRC. No 21F2, unlike
        BMS/MCU/VCU.
    - type: decode
      target: 2101 12V output current
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-28"
      updated: "2026-07-30"
      result: >-
        Not on OBC 2101. Under a 137-651 W 12 V load swing at READY (VCU_AUX_POWER, 2026-07-30) only
        the LDC_OUTPUT_V word sags (about 26 mOhm source resistance); no byte tracks a current.
        Derived current VCU_AUX_POWER / LDC_OUTPUT_V gives 9-48 A in that window; it inherits
        VCU_AUX_POWER's unverified status.
      notes: >-
        Also absent from VCU 2101/2102, MCU 2102 (motor phase currents) and Unknown-746 21F2. No
        hidden service-21 page on OBC or VCU. VCU 21F2 has no charging capture yet. The Soul's standalone LDC (0x7C5) DC_Current_Out has no counterpart here.
      what_to_test:
        - "12 V-only load step at READY (rear defroster, high beams, blower; A/C off) co-polling OBC:2101, VCU:2102, VCU:21F2 and BMS:2101 with --keep-all: pack BATTERY_CURRENT is then the LDC input alone, a cross-check on VCU_AUX_POWER / LDC_OUTPUT_V. The 2026-07-30 step also ran the A/C compressor."
        - "Capture VCU 21F2 with --keep-all while charging, to contrast its analog bytes against READY."
    - type: decode
      target: 2101 charge state machine B17/B22/B35/B36
      status: captured
      priority: P2
      vehicle_states: [CHARGING]
      created: "2026-08-02"
      updated: "2026-08-02"
      notes: >-
        B17, B22 and B35/B36 are decoded (high byte of OBC_DC_A, OBC_AC_NOT_CONNECTED, the
        OBC_PILOT_DUTY word). Still undecoded: B27 (65/67), B28 = 16, B29 = 32 and B31 = 200 (fixed
        while charging), B38, and B47/B49 (checksum-like). In the 2026-08-08 DC fast charges B21
        reads 72-75 and B36 49; OBC_DC_A, OBC_DC_POWER and OBC_EFFICIENCY read 0.
    - type: verify
      target: 2101 [B20:B21] 16-bit value vs OBC_CHARGE_STATE enum
      status: pending
      priority: P2
      vehicle_states: [PLUGGED, CHARGING]
      created: "2026-10-23"
      updated: "2026-10-23"
      notes: >-
        B20 (OBC_CHARGE_STATE) and B21 may be one big-endian 16-bit value. As (B20<<8)|B21 it reads
        50-53 with B20 = 0, 582-591 with 2 and 890-900 with 3. In the US logs it ramps smoothly
        across B20 boundaries (B20 = 1 and 4 also appear), and after a charge stops B21 decays 0xE3
        to 0x34 with B20 = 0. Scale and meaning unknown.
      sources:
        - JejuSoul US Ioniq logs, canair 2026-10-23
      what_to_test:
        - Plot (B20<<8)|B21 at 1 s across plug-in, charge start, charge stop and unplug; check whether it moves within a B20 value and whether B20 = 1 or 4 ever appears
      capture_protocol: >-
        canair monitor OBC:2101 BMS:2101 --save --keep-all --interval 1 --label 'OBC B20:B21 pilot'
        --state PLUGGED; plug in, let it charge 2 min, stop from the EVSE, unplug. Press s at each
        step.
    - type: decode
      target: broadcast 0x562 (OBC AC charge current / charge-limit command)
      status: pending
      priority: P2
      vehicle_states: [CHARGING, PLUGGED]
      created: "2026-10-29"
      updated: "2026-10-29"
      notes: >-
        On the Kona the bench commands the OBC on broadcast 0x562: byte 1 is the AC charge-current
        level (0x08 max, 0x0C reduced, 0x04 min), byte 4 the AC charge target as percent x 2; a
        burst of 3 frames applies it. Not visible over OBD here (gateway-isolated), so it needs a
        P-CAN tap and import can. ID and layout on the Ioniq AE are unconfirmed.
      sources:
        - projectgus car_hacking, bench_kona/bench_kona.py (Kona OS EV)
      what_to_test:
        - Tapped P-CAN sniff while changing the AC charge-current setting and the target SoC in the car menu; look for 0x562 (or a neighbour) with byte1/byte4 changing in step.
    - type: verify
      target: which module hosts the LDC (OBC 0x7E5 vs the EPCU)
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-29"
      updated: "2026-10-29"
      notes: >-
        uhi22's teardown shows the 12 V DC-DC converter (LDC) inside the EPCU housing with the
        inverter, and the VCU's ecu_id is VLDC. This profile reads the LDC_* values from OBC 2101 at
        0x7E5, so either the OBC relays the LDC's values or those signals are named after the wrong
        module. The EPCU broadcasts its DC-DC temperature on 0x523 bytes 2-3 (sensor R147 on the
        DC-DC board).
      sources:
        - uhi22 EPCU readme (teardown photos of the DC-DC boards inside the EPCU), 2026-10-29
      what_to_test:
        - With a P-CAN tap, compare OBC 2101 LDC_TEMP against 0x523 byte 2 during a long READY idle with a heavy 12 V load (rear heater, blower, lights).
    - type: verify
      target: "AC charge-current setting (station and portable): encoding and amps"
      status: pending
      priority: P2
      vehicle_states: [PLUGGED, CHARGING]
      created: "2026-10-30"
      updated: "2026-10-30"
      result: >-
        Encoding found in the head-unit firmware, not yet seen on a bus. The EV menu 'Charge
        Current' has a charging-station page and a portable-cable page, each with Maximum, Reduced
        and Minimum, sent as 0, 1, 2 in HU_EV_PE_00 (MM-CAN 0x1AA) byte 3: bits 3-2 station, bits
        1-0 portable, 3 = keep (a charge-current change sends bytes 0-2 as 0xFF, a drive-mode change
        sends byte 3 as 0x0F). The menu then shows the mode the OBC reports back, so the OBC stores
        the setting; the report frame is most likely GW_EV_P_02 (MM-CAN 0x55C byte 5 bits 3-2 / 1-0,
        3 = invalid). P-CAN copy not identified: 0x5DF or 0x5B3 (see the AVN research entry); both
        read 0 (Maximum) in byte 3 on uhi22's car. Details: ioniq-avn-fw micom-can-findings.md §6.1.
      notes: >-
        Every stored AC charge on the owner car (12 days, 7.9-23.9 A pilot) drew 92-97 % of the
        pilot current, so all were at Maximum. No OBC 2101 byte differs between the 8 A sessions and
        the others, so how the OBC tells the portable cable from a station is not visible there.
        Other Hyundai/Kia models are reported at about 100/90/60 %; the Ioniq AE's steps are
        unmeasured.
      sources:
        - "ioniq-avn-fw EU firmware: GreenCar ChargeElectricSettingActivity and layouts, IviServer GreenCarMessageSetting, com.lge.ivi HuEvPe00/GwEvP02, MICOM 0x1AA setters 0x85E6C/0x85EC2; canair OBC 2101 captures; 2026-10-30"
      what_to_test:
        - "Plugged in at the home wallbox, ignition on (the page needs the OBC awake): set the station current to Reduced, wait 2 minutes, then Minimum, then back to Maximum, pressing 's' at each change. AC_INPUT_A / OBC_PILOT_AMPS gives the real steps, and any OBC 2101/2102 byte that changes in step is the OBC's stored copy."
        - "Repeat on the portable cable with the portable setting, and once more changing only the setting for the cable that is not plugged in: the current should not move."
      capture_protocol: >-
        canair monitor OBC:2101,2102 BMS:2101 --save --keep-all --interval 2 --label 'AC
        charge-current setting steps' --state CHARGING; press s at each menu change and name the
        setting.
    - type: iocontrol_scan
      target: 30 00-FF (LED LIDs 01-04 first)
      status: pending
      priority: P3
      vehicle_states: [PARKED, ACC]
      created: "2026-10-30"
      updated: "2026-10-30"
      notes: >-
        OVMS (Open Vehicle Monitoring System) Kia Soul EV BlueChargeLed()
        (vehicle_kiasoulev.cpp:1101-1115) sends the Soul OBC (0x794) 10 81, 10 90, then KWP2000 30
        {led} {00 on | 11 off}, led 1 centre, 2 left, 3 right, 4 all; if real, 30 {LID} 00 actuates
        rather than releases. Weak evidence: the function has no callers, builds an invalid
        single-frame length (08 03 30 …) and never returns to 10 01. The Soul park-brake 30 commands
        go to 0x7A5 (the smart key address), and OVMS's own TODO says they do not work. No captured
        30 traffic exists for any HKMC car. The 2021 Kona OBC (7E5), VCU and MCU accept 10 90 and
        reject 10 03 (profiles/hyundai-kona-os-ev/captures/can/221210-*); 10 90 is untested on this
        OBC. Do not sweep 30 here until the meaning of 30 {LID} 00 is known.
      sources:
        - "OVMS vehicle_kiasoulev: vehicle_kiasoulev.cpp BlueChargeLed(), ks_commands.cpp CommandParkBreakService, ks_can_send.cpp Send_EBP_Command (openvehicles/Open-Vehicle-Monitoring-System-3, read 2026-10-30)"
      what_to_test:
        - "Car parked, ACC, charge port unplugged: use canair raw to open 10 81 then 10 90 on OBC (0x7E5) and check 10 90 is accepted (the hk_90_session quirk permits it); the earlier probe only accepted 0x81. Do not define an iocontrol: entry yet: canair io refuses a 0x30 ON until its release is known."
        - "If 10 90 is accepted: send one 30 01 00 and watch the charge-port LED (second person), then 30 01 11. Stop on any unexpected NRC."
      capture_protocol: >-
        canair raw with --save --label 'OBC KWP 30 LED probe' --state ACC; record every request and
        reply. Only LIDs 01-04, never a blind sweep.

  sessions:
    "81":
      name: "standardDiagnosticSession"
      supported: true
    "82":
      name: "periodicDiagnosticSession"
      supported: false
      nrc: 0x12
      nrc_desc: "subFunctionNotSupported"
    "83":
      name: "extendedDiagnosticSession"
      supported: false
      nrc: 0x12
      nrc_desc: "subFunctionNotSupported"
