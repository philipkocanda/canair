# ─── OBC / LDC (On-Board Charger + Low-Voltage DC-DC Converter) ─────
#
# Self-identifies (KWP2000 1A8C) as "AEEOBC51". Part 36400-0E150. Reports two functions:
# - OBC_* / AC_INPUT_*: AC charging of the traction battery; read ~0 outside AC charging.
# - LDC_*: the HV → 12 V DC-DC converter; live in READY and while driving with the OBC idle.
# The LDC enable/inhibit bits are on the VCU (0x7E2, ecu_id "VLDC"), not here.
#
# KWP2000 sessions (2026-07-22, READY): only 0x81 is accepted; 2101/2102 answer in the default
# session too.

OBC:
  tx_id: 0x7E5
  can_bus: [P-CAN]
  identity:
    alias: LDC  # also reports the LDC (DC-DC converter) values
    description: On-Board Charger (integrated LDC / DC-DC converter)
    part_number: "36400-0E150"
    ecu_id: AEEOBC51  # KWP2000 1A8C
    sw_id: "EAEEH5L-OS3-D000"
    calibration: "00000001"
    id_protocol: KWP2000  # 1Axx
    notes: >-
      Reports the OBC values and the LDC (DC-DC converter) values; whether the LDC sits in this
      module or the EPCU is an open research item. OBC signals are active only while AC charging;
      the LDC 12 V output reads live while driving with the OBC idle. The LDC enable/inhibit bits
      are on the VCU (0x7E2, ecu_id VLDC). Max AC charge 29 A / 6.6 kW (2017 model; the 2019
      facelift does 32 A).

  vehicle_states: [IG3]
  pids:
    2101:
      response_frames: 7
      status: active
      period: 5000
      vehicle_states: [IG3]
      source: canair cross-tab vs BMS 2101 B14 and VCU 2101, 2026-10-23; JejuSoul US Ioniq logs
      verified: true
      parameters:
        LDC_HV_INPUT_V:
          expression: "[B45:B46]/100"
          unit: V
          min: "0"
          max: "500"
          source: "Live READY vs charging + BMS cross-check (2026-07-20)"
          notes: >-
            HV DC-link voltage at the LDC input, downstream of the main relay: present at READY,
            while charging and during the 12 V top-up. r=0.998 vs
            VCU:2102:VCU_INVERTER_INPUT_VOLTAGE (n=5689). At the end of the 2026-11-03 top-up it
            read 353.2 V 0.3 s after the BMS first reported the relay open and 11.1 V 2.9 s later,
            while BMS BATTERY_VOLTAGE stayed at 361.8 V; 19 V 1.3 s after the relay was last seen
            closed at the 2026-10-21 top-up end.

        LDC_OUTPUT_V:
          expression: "[B25:B26]/100"
          unit: V
          min: "0"
          max: "20"
          source: "Decoded from live captures (2026-04-14)"
          notes: >-
            12 V rail: 14.52 V charging, 14.31 V at READY, 14.59-14.62 V through the parked 12 V
            top-ups. Sagged 14.5 to 13.6 V and recovered as a rear defroster load switched on and
            off (2026-07-22). Down to 13.38 V 2.1 s after the last 14.59 V reading at the 2026-11-03
            top-up end, once the LDC had stopped.

        LDC_TEMP:
          expression: "B19-100"
          unit: "°C"
          min: "-40"
          max: "120"
          source: "Kia Soul EV LDC CSV (LDC Temp = i-100) + charging session trend (2026-07-19)"
          notes: >-
            Rose smoothly 28 to 65 °C over a 3 h AC charge; 21 °C at READY with about 18 °C ambient.

        OBC_CHARGE_V:
          expression: "[B10:B11]/100"
          unit: V
          min: "0"
          max: "500"
          source: "Decoded from live captures (2026-04-14)"
          notes: About 370 V during AC charging, about 6 V when the OBC is idle.

        OBC_OUTPUT_V:
          expression: "[B12:B13]/100"
          unit: V
          min: "0"
          max: "500"
          source: Decoded from live captures (2026-04-14, 2026-07-20)
          notes: 353-384 V during AC charging, about 3.8 V when the OBC is idle.

        OBC_DC_A:
          expression: "[B17:B18]/100"
          unit: A
          min: "0"
          max: "50"
          source: "Decoded from live captures (2026-04-14)"
          notes: OBC DC output current while charging; 0 when idle.

        OBC_PILOT_DUTY:
          expression: "[B35:B36]/10"
          unit: "%"
          min: "0"
          max: "100"
          source: Live EVSE current step 10/13/16A (2026-07-27)
          source_links:
            - https://docs.google.com/spreadsheets/d/1R2dW_4-ANg04TQdkHH52-8wdYItBkWDfppcsqOc-m1M
          notes: >-
            J1772 control-pilot duty. Read 16.5, 21.5 and 26.5 % at 10, 13 and 16 A pilot
            (2026-07-27). 100 % when plugged in with no current offered.
        OBC_PILOT_AMPS:
          expression: "[B35:B36]*0.06"
          unit: A
          min: "0"
          max: "80"
          source: Live EVSE current step 10/13/16A (2026-07-27); J1772 duty x 0.6
          notes: >-
            Pilot duty x 0.6. Read 9.9, 12.9 and 15.9 A at 10, 13 and 16 A pilot (2026-07-27); reads
            60 at 100 % duty, when no current is offered.
        # 2101 has no OBC heatsink/inside/water temperature (Soul OBC S/T/U): B28/B29 are constant
        # through a 3 h charge and B21 does not track temperature. LDC_TEMP is the only one.
        OBC_DC_POWER:
          expression: "[B10:B11]*[B17:B18]/10000000"
          unit: kW
          min: "0"
          max: "10"
          source: Derived OBC_CHARGE_V*OBC_DC_A; validated vs wattmeter 2026-07-26
          notes: >-
            OBC_CHARGE_V x OBC_DC_A. Steady 3.30-3.36 kW over the 2026-07-26 16 A AC charge, 0 when
            idle; matched an external wattmeter.
        AC_INPUT_V:
          expression: "[B14:B15]/100"
          unit: V
          min: "0"
          max: "300"
          source: Live 16A AC charge 2026-07-26; checked and confirmed accurate
          notes: 218-228 V while charging, about 8.5 V with no EVSE connected.
        AC_INPUT_A:
          expression: "[B33:B34]/100"
          unit: A
          min: "0"
          max: "40"
          source: Live EVSE current step 10/13/16A (2026-07-27) + AC power balance
          notes: >-
            Measured AC input current. Read 9.3, 12.4 and 15.4 A at 10, 13 and 16 A pilot
            (2026-07-27), about 0.6 A below OBC_PILOT_AMPS.
        OBC_CHARGE_STATE:
          expression: B20
          type: enum
          values:
            0: not connected / EVSE idle (no pilot PWM)
            2: active charge session (current flowing)
            3: connected/standby (pilot PWM present, not charging)
          source: RE 2026-08-02 AC charge transitions, live ON confirmed; DCFC transitions confirmed 2026-08-08
          notes: >-
            0 also while driving. Goes 0, 3, 2 at the start of both AC and CCS DC charges, even
            though OBC_DC_A stays 0 during DC charging. Only 0, 2 and 3 in this car's captures
            (n=11441); the US logs also show 1 and 4.
        OBC_EFFICIENCY:
          expression: 100*[B10:B11]*[B17:B18]/([B14:B15]*[B33:B34])
          unit: "%"
          min: "0"
          max: "105"
          source: "Derived: 100 * OBC_DC_POWER*1000 / (AC_INPUT_V*AC_INPUT_A), reduced to raw bytes (2026-08-06)"
          verified: false
          notes: >-
            OBC DC output power over AC apparent power (AC_INPUT_V x AC_INPUT_A); no value when
            AC_INPUT_A is 0. Mean 98.1 % at about 4.4 kW AC input (2026-08-05, n=1317); the
            wattmeter check gave 95 % at about 3.5 kW (2026-07-26).
        OBC_AC_NOT_CONNECTED:
          expression: B22:0
          min: "0"
          max: "1"
          verified: false
          notes: >-
            0 while an AC charge cable is connected, 1 otherwise, including DC fast charging. The
            complement of BMS 2101 AC_CHARGER_CONNECTED in all 10304 aligned rows, charging or not,
            ignition on or off.
        OBC_MODE:
          expression: B23
          type: enum
          values:
            115: dc_charging
            186: ac_charging
            187: ac_charging
            188: idle
            189: idle
          verified: false
          notes: >-
            0xBC/0xBD idle (READY, 12 V top-up, plugged but not charging), 0xBA/0xBB AC charging,
            0x73 throughout both recorded DC fast charges (2026-08-08). Bit 0 alternates between
            reads in the idle and AC states, except in the 12 V top-up: 0xBD in all 533 reads of the
            three recorded top-ups. The US logs add 0xB8 at power-up and 0x70, 0x74, 0x75 and 0x80
            around AC plug-in and charge end.
        OBC_DC_CHARGE_MODE:
          expression: B23:6
          min: "0"
          max: "1"
          verified: false
          notes: >-
            1 only during DC fast charging: all 54 OBC rows aligned with BMS 2101 B14 = 0x40/0xC3 on
            2026-08-08, and the CCS log in the US data; 0 in every other state.
        OBC_SESSION_FLAGS:
          expression: B37
          type: enum
          values:
            96: unplugged
            114: plugged_not_charging
            118: charging
            122: post_charge_122
            126: post_charge_126
          verified: false
          notes: >-
            0x60 unplugged (all 2248 rows aligned with BMS B14 = 0x03); 0x72, 0x76, 0x7A or 0x7E
            with a cable connected, AC or DC: 0x76 while charging (7942 of 7971 rows), 0x72
            connected without charging, 0x7A/0x7E briefly after a charge ends. The US logs add 0x62
            and 0x68. Bit 2 follows the charger's pilot PWM (set in 9797 of 9849 rows at 5-95 %
            duty, none of 99 at 100 %): 0x76 -> 0x72 is the charger ending the session, 0x76 -> 0x7E
            a stop by the car (2026-08-05, 95 % SOC).
        OBC_CABLE_SESSION:
          expression: B37:4
          min: "0"
          max: "1"
          verified: false
          notes: >-
            1 whenever a charge cable is connected, AC or DC, and 0 unplugged, in every row aligned
            with BMS 2101. In the US logs it read 0 for one sample just after an AC plug-in (0x62).
    2102:
      status: static
      period: 5000
      vehicle_states: [IG3]
      notes: >-
        34 bytes. Byte-identical across 2316 captures in every state: a calibration table (6-byte
        header and 7 groups of 4 bytes whose third byte is always 0x79). Answers while charging and
        in ON; NRC with the car fully off.
      parameters: {}

  # Meanings, causes, thresholds and fail-safes are from the Ioniq Electric 2017 service manual,
  # On Board Charger chapter. Unless an entry says "Enabled when", the manual checks the code only
  # while the charger connector is attached, the OBC charging mode is started (EVSE ready) and the
  # auxiliary battery is at 9-16 V. "Also needs" adds to that. The manual lists the DC/DC
  # converter (LDC) codes in its DC/DC Converter chapter (see the VCU entries), not here.
  dtcs:
    source: Ioniq Electric 2017 service manual, On Board Charger diagnosis (EV)
    source_links:
      - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Hybrid%2FElectric%20Powertrain/Testing%20and%20Diagnosis/On%20Board%20Charger%20Diagnosis%20%28EV%29/
      - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Quick%20Lookups/DTC%20Index/DTC%20Index%20%28EV%29/On%20Board%20Charger%20DTCS/
    verified: false
    P0D09:
      description: Battery charging system positive connector stuck open
      causes: faulty OBC fuse, faulty high voltage cable, BMS, OBC
      notes: >-
        Threshold: the voltage difference between the two is 30 V or more. Detection time: 5 sec.
        Also needs: turn the OBC relay 'ON'; voltage of the high voltage battery is over 220 V.
        Service lamp on.
    P0D21:
      description: Battery charger output voltage too low
      causes: faulty high voltage cable, high voltage battery, OBC
      notes: >-
        Threshold: output voltage is below 220 V. Detection time: either for 10 times or 60 sec.
        Also needs: turn the main relay 'ON'; turn the OBC relay 'ON'. Service lamp on.
    P0D24:
      description: Battery charger temperature too high
      causes: failure in the cooling system, lack of coolant, faulty EWP (electronic water pump)
      notes: >-
        Threshold: OBC temperature is higher than 110°C. Detection time: 2 sec. Service lamp on.
    P0D27:
      description: Battery charger input voltage too low
      causes: >-
        external EV supply equipment (EVSE), AC input high voltage cable between inlet and OBC, OBC
      notes: 'Threshold: AC input voltage (RMS) is less than a predetermined value.'
    P0D28:
      description: Battery charger input voltage too high
      causes: external AC power supply, OBC
      notes: >-
        Threshold: AC input voltage (RMS) is greater than a predetermined value. A second check
        applies the same test with the input relay off.
    P0D2A:
      description: Battery charger input current too high
      causes: failure of the external AC power, OBC
      notes: >-
        Threshold: input current is over 46 A. Detection time: either for 10 times or 30 sec. Also
        needs: turn the S2 switch 'ON'. Service lamp on.
    P0D39:
      description: Battery charger input current sensor circuit range/performance
      causes: OBC
      notes: >-
        Threshold: current sensor offset value is greater than 1.5 A; current sensor offset value is
        below -1.5 A. Detection time: at instant. Also needs: calibrate the current sensor offset.
        Service lamp on.
    P0D3A:
      description: Battery charger input current sensor circuit low
      causes: OBC
      notes: >-
        Threshold: output voltage of the input current sensor is below 0.3 V. Detection time: 10 ms.
        Service lamp on.
    P0D3B:
      description: Battery charger input current sensor circuit high
      causes: OBC
      notes: >-
        Threshold: output voltage of the input current sensor is over 4.8 V. Detection time: 10 ms.
        Service lamp on.
    P0D3E:
      description: Battery charger input voltage sensor circuit range/performance
      causes: OBC
      notes: >-
        Threshold: input voltage is over 30 V (output voltage of the input voltage sensor over 0.3
        V). Detection time: 2 sec. Also needs: turn the S2 switch 'ON'. Service lamp on.
    P0D3F:
      description: Battery charger input voltage sensor circuit low
      causes: OBC
      notes: >-
        Threshold: output voltage of the input voltage sensor is below 0.3 V. Detection time: 1 sec.
        Also needs: turn the input relay OFF; output voltage of PFC below 30 V (with the S2 switch
        OFF); output voltage of PFC over 80 V (with the S2 switch ON). Service lamp on.
    P0D40:
      description: Battery charger input voltage sensor circuit high
      causes: OBC
      notes: >-
        Threshold: output voltage of the input voltage sensor is over 4.8 V. Detection time: 1 sec.
        Service lamp on.
    P0D4D:
      description: Battery charger hybrid EV battery output voltage sensor circuit range/performance
      causes: OBC
      notes: >-
        Threshold: output voltage is over 30 V (output voltage of the output voltage sensor over 0.3
        V). Detection time: 10 sec. Also needs: turn the S2 switch 'OFF'. Service lamp on.
    P0D4E:
      description: Battery charger hybrid EV battery output voltage sensor circuit low
      causes: OBC
      notes: >-
        Threshold: output voltage of the output voltage sensor is below 0.3 V. Detection time: 1
        sec. Also needs: actuate the pre-charging sequence at the output terminal. Service lamp on.
    P0D4F:
      description: Battery charger hybrid EV battery output voltage sensor circuit high
      causes: OBC
      notes: >-
        Threshold: output voltage of the output voltage sensor is over 4.8 V. Detection time: 1 sec.
        Service lamp on.
    P0D52:
      description: Battery charger hybrid/EV battery output current sensor circuit range/performance
      causes: OBC
      notes: >-
        Threshold: current sensor offset value is greater than 1.5 A; current sensor offset value is
        below -1.5 A. Detection time: at instant. Also needs: calibrate the current sensor offset.
        Service lamp on.
    P0D53:
      description: Battery charger hybrid EV battery output current sensor circuit low
      causes: OBC
      notes: >-
        Threshold: output voltage of the output current sensor is below 0.3 V. Detection time: 10
        ms. Service lamp on.
    P0D54:
      description: Battery charger hybrid EV battery output current sensor circuit high
      causes: OBC
      notes: >-
        Threshold: output voltage of the output current sensor is over 4.8 V. Detection time: 10 ms.
        Service lamp on.
    P0D58:
      description: Proximity detection circuit low
      causes: faulty connectors or poor contact between charger terminal and OBC, OBC
      notes: >-
        Threshold: voltage of the circuit is below 1 V (Type 1 connector, 5 sockets) or below 0.5 V
        (Type 2 connector, 7 sockets). Detection time: 2 sec. Enabled when: auxiliary battery 9-16
        V. Service lamp on.
    P0D59:
      description: Proximity detection circuit high
      causes: faulty connectors or poor contact between charger terminal and OBC, OBC
      notes: >-
        Threshold: voltage of the circuit is over 4.9 V. Detection time: 2 sec. Enabled when:
        auxiliary battery 9-16 V. Service lamp on.
    P0D5C:
      description: Battery charger hybrid EV battery output power performance
      causes: OBC
      notes: >-
        Threshold: OBC output power is less than 50% of the output power command. Detection time: 10
        sec. Enabled when: charger connector attached; high voltage battery being charged; auxiliary
        battery 9-16 V; OBC output power commands 600 W or more. Service lamp on.
    P0D67:
      description: Battery charger control module performance
      causes: OBC
      notes: >-
        Threshold: malfunction of the control module installed in OBC (checksum). Detection time: at
        instant. Enabled when: charger connector attached; auxiliary battery 9-16 V. Service lamp
        on.
    P0D90:
      description: Battery charger input frequency incorrect
      causes: external AC power, OBC
      notes: >-
        Threshold: AC frequency is less than a predetermined value. Also needs: turn the input relay
        'ON'.
    P1CF6:
      description: EVSE check
      causes: external EVSE (electric vehicle supply equipment), OBC
      notes: >-
        Four checks of the control pilot (CP) signal. CP voltage below 4 V or above 12 V for 60 sec
        (needs the S2 switch on and CP voltage above 1 V). CP frequency below 850 Hz or above 1150
        Hz for 60 sec (needs CP frequency above 0 Hz). CP duty below 0.08 or above 0.98 for 60 sec
        (needs CP duty above 0 and below 1). AC approved while the CP signal is in state B (9 V) for
        15 sec (needs the S2 switch off).
    P1E01:
      description: PFC voltage sensor reliability & initial offset value check
      causes: OBC
      notes: >-
        Type 1: PFC voltage is below 80% of the AC input voltage after the AC input voltage is
        entered, for 1 sec (needs the input relay off and input voltage above 65 V). Type 2: PFC
        voltage is above 30 V (sensor output above 0.3 V), for 500 ms (needs the vehicle to have
        soaked for over 8 hours with no charging). Service lamp on.
    P1E02:
      description: PFC voltage sensor circuit low
      causes: OBC
      notes: >-
        Threshold: output voltage of the PFC voltage sensor is below 0.3 V. Detection time: 1 sec.
        Also needs: input voltage is greater than 65 V. Service lamp on.
    P1E03:
      description: PFC voltage sensor circuit high
      causes: OBC
      notes: >-
        Threshold: output voltage of the PFC voltage sensor is greater than 4.8 V. Detection time: 1
        sec. Service lamp on.
    P1E04:
      description: Battery charger temperature sensor 'A' circuit range/performance
      causes: OBC
      notes: >-
        Threshold: voltage change rate of the OBC temperature sensor is greater than 424 mV per 10
        ms. Detection time: 100 times. Service lamp on.
    P1E05:
      description: Battery charger temperature sensor 'A' circuit low
      causes: OBC
      notes: >-
        Threshold: voltage of the OBC temperature sensor is below 0.3 V. Detection time: 1 sec.
        Service lamp on.
    P1E06:
      description: Battery charger temperature sensor 'A' circuit high
      causes: OBC
      notes: >-
        Threshold: voltage of the OBC temperature sensor is greater than 4.8 V. Detection time: 1
        sec. Also needs: OBC output power remains above 3 kW for 180 sec; EWP is 0 rpm. Service lamp
        on.
    P1E0A:
      description: Battery charger output voltage too high
      causes: faulty high voltage cable, OBC relay, main relay, OBC fuse, high voltage battery, OBC
      notes: >-
        Threshold: output voltage is greater than 470 V. Detection time: for 10 times or 60 sec.
        Also needs: turn the S2 switch 'ON'. Service lamp on.
    P1E0B:
      description: Battery charging output current too high
      causes: faulty high voltage cable, OBC
      notes: >-
        Threshold: output current is greater than 31 A. Detection time: for 10 times within 30 sec.
        Also needs: turn the S2 switch 'ON'. Service lamp on.
    P1E0C:
      description: Input relay stuck closed check
      causes: OBC
      notes: >-
        Threshold: input current is greater than 46 A. Detection time: at instant. Also needs: turn
        the input relay 'OFF'. Service lamp on.
    P1E13:
      description: Battery charger power module system voltage
      causes: OBC
      notes: >-
        Threshold: fault signal from the power module's power circuit. Detection time: 1 sec.
        Service lamp on.
    P1E14:
      description: PFC output voltage too high
      causes: OBC
      notes: >-
        Threshold: PFC voltage is greater than 455 V. Detection time: for 10 times or 60 sec. Also
        needs: turn the S2 switch 'ON'. Service lamp on.
    P1E16:
      description: Battery charger output relay voltage sensor circuit high
      causes: OBC
      notes: >-
        Threshold: output voltage of the output relay voltage sensor is greater than 4.8 V.
        Detection time: 1 sec. Service lamp on.
    P1E17:
      description: Output relay stuck closed check
      causes: OBC
      notes: >-
        Threshold: the voltage difference between the two is 30 V or more. Detection time: 50 ms.
        Also needs: turn the output relay OFF'; turn the main relay 'ON'; voltage of the high
        voltage battery is over 220 V. Service lamp on.
    P1E18:
      description: Output relay stuck open check
      causes: OBC
      notes: >-
        Threshold: the voltage difference between the two is 30 V or more. Detection time: 5 ms.
        Also needs: turn the output relay 'ON'; turn the main relay 'ON'; voltage of the high
        voltage battery is over 220 V. Service lamp on.
    P1E19:
      description: Battery charger output relay voltage sensor circuit low
      causes: OBC
      notes: >-
        Threshold: output voltage of the output relay voltage sensor. is below 0.3 V. Detection
        time: 1 sec. Also needs: charging high voltage battery. Service lamp on.
    P1E1F:
      description: Battery charger ignition3 relay stuck open check
      causes: >-
        poor contact in connectors or IGC relay control signal circuit that runs between IG3 relay
        and OBC, IG3 relay, OBC
      notes: >-
        Threshold: check the voltage of IG3 relay when it is OFF. Detection time: 100 ms. Enabled
        when: charger connector attached; auxiliary battery 9-16 V; wait for 100 ms after turning on
        the IG3 relay control. Service lamp on.
    P1E20:
      description: Battery charger ignition3 relay control circuit
      causes: >-
        poor contact in connectors or IG3 relay control signal circuit that runs between IG3 relay
        and OBC, IG3 relay, OBC
      notes: >-
        Threshold: driver fault signal of IG3 relay. Detection time: 300 ms. Enabled when: charger
        connector attached; auxiliary battery 9-16 V; IG3 relay control signal is 'OFF'. Service
        lamp on.
    P1E21:
      description: Inlet lock mode switch LED control circuit
      causes: >-
        poor contact in connectors or control signal circuit of inlet lock mode switch LED, inlet
        lock mode switch LED, OBC
      notes: >-
        Threshold: driver fault signal of the inlet lock mode switch LED. Detection time: 300 ms.
        Enabled when: auxiliary battery 9-16 V.
    U0001:
      description: High speed CAN communication bus
      causes: >-
        short on battery power to P-CAN communication lines, ground short to P-CAN communication
        circuit, open to P-CAN communication circuit, short to P-CAN high and low lines, poor
        contact in ECU connectors
      notes: >-
        Threshold: P-CAN is not able to send or receive messages. Detection time: 1 sec. Enabled
        when: IG3 ON; auxiliary battery 9-16 V. Service lamp on after 2 driving cycles.
    U0110:
      description: Lost communication with drive motor control module
      causes: >-
        EPCU connectors are detached, error in power supply to EPCU, open or poor contact in EPCU
        P-CAN high line, open or poor contact in EPCU P-CAN low line, faulty EPCU
      notes: >-
        Threshold: messages do not come from MCU. Detection time: 2 sec. Enabled when: IG3 ON;
        auxiliary battery 9-16 V. Service lamp on after 2 driving cycles.
    U0111:
      description: Lost communication with battery energy control module 'A'
      causes: >-
        BMS connectors are detached, error in power supply to BMS, open or poor contact in BMS P-CAN
        high line, open or poor contact in BMS P-CAN low line, faulty BMS
      notes: >-
        Threshold: messages do not come from BMS. Detection time: 2 sec. Enabled when: IG3 ON;
        auxiliary battery 9-16 V. Service lamp on after 2 driving cycles.
    U0146:
      description: Lost communication with gateway 'A'
      causes: >-
        CGW connectors are detached, error in power supply to CGW, open or poor contact in CGW P-CAN
        high line, open or poor contact in CGW P-CAN low line, faulty CGW
      notes: >-
        Threshold: messages do not come from CGW. Detection time: 2 sec. Enabled when: IG3 ON;
        auxiliary battery 9-16 V. Service lamp on after 2 driving cycles.
    U0293:
      description: Lost communication with hybrid powertrain control module
      causes: >-
        EPCU connectors are detached, error in power supply to EPCU, open or poor contact in EPCU
        P-CAN high line, open or poor contact in EPCU P-CAN low line, faulty EPCU
      notes: >-
        Threshold: messages do not come from VCU. Detection time: 2 sec. Enabled when: IG3 ON;
        auxiliary battery 9-16 V. Service lamp on after 2 driving cycles.

