# ─── EPB (Electronic Parking Brake) ───────────────────────────────────
# 0x7D5, in the chassis block next to ESC (0x7D1) and EPS (0x7D4). Identified as EPB from the
# Ioniq AVN head-unit firmware diagnostic-address table (research/IONIQ_AVN_FW_FINDINGS.md §2).
# Silent during AC charging; needs ACC or ignition. UDS only (KWP2000 1A8C gets no reply).
# F18C serial: 17060100003900000000 (manufactured 2017-06-01).
EPB:
  tx_id: 0x7D5
  can_bus: [C-CAN]  # from US wiring; unconfirmed on the EU car
  identity:
    description: EPB (Electronic Parking Brake) — chassis/brake module adjacent to ESC/EPS
    app_sw: "G7"
    id_protocol: UDS  # F1xx (only 2 DIDs: F18C serial, F101 app SW)
    notes: >-
      Shares ESC 0x7D1's app_sw "G7" (the Ioniq Electric model code, not an ECU identifier) and its
      only live-data DID, 22C101. F18C serial and F101 app SW are the only identity DIDs; no part
      number.
  vehicle_states: [ACC, "ON", READY]
  scan_log: # EPB (0x7D5)
    - service: 0x22
      range: "0101-010F,B001-B010,C101-C10F,C001-C010,D001-D010"
      date: 2026-07-22
      hits: "C101"
      vehicle_states: [READY]
      notes: "Only C101 (27 B) answers; every other DID in these ranges, and service 21, NRC."
  pids:
    22C101:
      response_frames: 4
      status: draft
      period: 2500
      vehicle_states: [READY]
      notes: >-
        27 bytes at READY, standstill: 62C101FB180000BD0DFFF4FCFD020001FFFFFFFFFF000026180004. The
        only live-data DID found on 0x7D5.
  research:
    - type: decode
      target: "22C101"
      status: captured
      priority: P2
      vehicle_states: [ACC]
      notes: >-
        7D5's only live-data DID (27 B). Compare its structure with ESC 22C101; capture while
        braking, driving and applying the parking brake.
      what_to_test:
        - "Decode 27-byte C101 payload; find brake-pressure / pedal / accel signals"
        - "Diff against ESC 0x7D1 22C101 to see if 7D5 mirrors a subset"
      sources:
        - "captures/ — 2026-07-22 (READY)"
