# ─── SKM (Smart Key Module) ────────────────────────────────────────────
# Self-identifies as "SMK". Key fob detection, immobiliser and remote functions. Sleeps within
# seconds of its last request, so reads need the wake ritual below. Has a dedicated CAN line to
# the start/stop button (SSB).
SKM:
  tx_id: 0x7A5
  can_bus: [B-CAN, P-CAN]
  identity:
    alias: SMK  # ECU self-identifies as "SMK"
    description: Smart Key Module
    mfg_date: "2017-06-02"
    diag_address: "190"
    hw_version: "10000"
    sw_version: "10200"
    id_protocol: UDS  # F1xx
    part_number: ""
    notes: >-
      Smart Key Module (self-identifies as SMK, also known as SMARTRA): key-fob detection,
      immobiliser and remote functions. Sleeps about 2 s after its last request; see wake:.
  vehicle_states: [SLEEP, PLUGGED, ACC, "ON", READY, CHARGING]
  wake:
    method: rapid_read
    prime_pid: 22B003
    attempts: 8
    interval_ms: 80
    sleep_timer_ms: 2000
    notes: >-
      SKM keeps its CAN transceiver up only ~2 s and answers one request before sleeping again. A
      burst of cheap 22B003 reads holds it awake for a session and the B0xx reads; a single 1001
      wake races the sleep timer.
  session: true
  scan_log: # SKM
    - service: 0x22
      range: "0101-010F,B001-B010"
      date: 2026-07-22
      hits: "B002,B003,B005,B006,B008,B00A"
      vehicle_states: [READY]
      notes: Fob present. 01xx all NRC.
  pids:
    22B002:
      response_frames: 26
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        178 data bytes, constant in every capture except B162 (SKM_GEAR). The 136-byte 2026-04-18
        capture is a corrupt reassembly with reordered frames.
      parameters:
        SKM_GEAR:
          expression: B162
          type: enum
          values:
            0: P
            5: D
          min: "0"
          max: "15"
          source: Cross-tab vs VCU 2101 GEAR_* over all SKM captures, 2026-11-01
          verified: false
          notes: >-
            0 in all 753 captures with VCU in P, 5 in all 18 in D (2026-10-25 drive). The only byte
            of 22B002 that varies. Hyundai gear encoding puts N at 6 and R at 7; neither captured.

    22B003:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "25 bytes: 62B003000000003412900300000000C6A21261000000000F00."
    22B005:
      response_frames: 2
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        11 bytes. Support map FA 60 90 at B05-B07. The marked bits follow the GDS Current Data order
        (shop manual page 0417), LSB first: start button switches, ACC/IGN1/IGN2, start relay
        feedback, stop lamp switch and fuse, door handle buttons. B10 reads 0x00 OFF, 0x04 ACC, 0x1C
        ON and READY. B12 bit 6 is the ACC line and B12 bit 7 and B13 bit 0 the ignition, all
        outside the map. B11 is 0x04, 0x06 with the brake pressed, once 0x24 (parked).
      min: "0"
      max: "1"
      verified: false
      parameters:
        SSB_SWITCH_1:
          expression: B10:0
          source: GDS Current Data list order (shop manual 0417) vs the support map
          notes: >-
            GDS 'Start Stop Button Switch1'. 1 only at 2026-11-03 20:38:43.6, with SSB_SWITCH_2: the
            one of 13 button presses that a 5 s poll caught. 0 in every other capture.
        SSB_SWITCH_2:
          expression: B10:1
          source: GDS Current Data list order (shop manual 0417) vs the support map
          notes: >-
            GDS 'Start Stop Button Switch2'. 1 only at 2026-11-03 20:38:43.6, with SSB_SWITCH_1 (one
            captured press); 0 in every other capture.
        SKM_ACC_INPUT:
          expression: B10:2
          source: GDS Current Data list order (shop manual 0417) vs the support map; Narrated power-state cycles 2026-11-03
          verified: true
          notes: >-
            GDS 'ACC'. 1 in ACC, ON and READY; 0 in OFF. In ACC alone (3 episodes, 15 rows) B10
            reads 0x04.
        SKM_IGN1_INPUT:
          expression: B10:3
          source: GDS Current Data list order (shop manual 0417) vs the support map; Narrated power-state cycles 2026-11-03
          verified: true
          notes: GDS 'IGN1'. 1 in ON and READY, 0 in OFF and ACC.
        SKM_IGN2_INPUT:
          expression: B10:4
          source: GDS Current Data list order (shop manual 0417) vs the support map; Narrated power-state cycles 2026-11-03
          verified: true
          notes: >-
            GDS 'IGN2'. 1 in ON and READY, 0 in OFF and ACC. No SKM read landed inside a START, when
            IGN2 drops out.
        START_RELAY_FEEDBACK:
          expression: B10:6
          source: GDS Current Data list order (shop manual 0417) vs the support map
          notes: >-
            GDS lists 'Start Relay Feed Back Signal' then 'Gearshift P Position' after IGN2, with
            only B10:6 marked (B10:5 is not). 0 in every capture, including parked in P, so it is
            not an active-high P switch.
        STOP_LAMP_SWITCH:
          expression: B11:1
          source: GDS Current Data list order (shop manual 0417) vs the support map; brake cross-tab 2026-11-03
          verified: true
          notes: >-
            GDS 'Stop Lamp Switch'. 1 in 10 of 11 rows aligned with IGPM BRAKE_LIGHT on (3 brake
            presses on 2026-11-03), 0 in all 1238 with it off.
        STOP_LAMP_FUSE:
          expression: B11:2
          source: GDS Current Data list order (shop manual 0417) vs the support map
          notes: GDS 'Stop Lamp Fuse' (ON = fuse intact). 1 in every capture.
        DRIVER_DOOR_HANDLE_BUTTON:
          expression: B12:0
          source: GDS Current Data list order (shop manual 0417) vs the support map
          notes: GDS 'Driver Door Handle Toggle Button Switch'. 0 in every capture.
        ASSIST_DOOR_HANDLE_BUTTON:
          expression: B12:3
          source: GDS Current Data list order (shop manual 0417) vs the support map
          notes: GDS 'Assist Door Handle Toggle Button Switch'. 0 in every capture.
        SKM_ACC_B005_B12:
          expression: B12:6
          source: ""
          notes: >-
            Outside the support map. 1 in ACC, ON and READY, 0 in OFF: the ACC line, as
            SKM_ACC_INPUT. Disabled as a duplicate.
          enabled: false
        SKM_IGN_B005_B12:
          expression: B12:7
          source: ""
          notes: >-
            Outside the support map. 1 in ON and READY, 0 in OFF and ACC: the ignition, as
            SKM_IGN1_INPUT. Disabled as a duplicate.
          enabled: false
        SKM_IGN_B005_B13:
          expression: B13:0
          source: ""
          notes: >-
            Outside the support map. Equals SKM_IGN_B005_B12 in every capture. Disabled as a
            duplicate.
          enabled: false
    22B006:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      source: Cross-tab vs BCM, IGPM and VCU over all SKM captures, 2026-11-01
      verified: false
      unit: V
      min: "0"
      max: "20"
      notes: >-
        Analog inputs at 0.08 V per count, plus vehicle speed. Marked bytes follow the GDS Current
        Data order (shop manual page 0417): Battery Voltage (by CPU) B10, Engine Speed (unmarked
        B11), Vehicle Speed B12, then ACC, IGN1, IGN2 and Starter Relay Output, then Battery Voltage
        (by Load) B21. B17-B19 are the three relay outputs, 14.2-15.0 V when on and within a count
        of BCM 22B003 B26/B27/B28: B17 (ACC) on in ACC, ON and READY, B18 and B19 (IGN1, IGN2) in ON
        and READY only; all three 0 in charging and top-up captures with the ignition off. B20 is
        the starter output and B14, B15 have no GDS item; all three read 0 through OFF, ACC, ON and
        READY on 2026-11-03 (B14 160 once while driving).
      parameters:

        SKM_12V_BATTERY:
          expression: B10*0.08
          notes: >-
            GDS 'Battery Voltage Monitoring Input (by CPU)'. Reads 2-3 counts (about 0.2 V) above
            BCM_12V_BATTERY in 175 of 186 co-polled rows (r=0.96), the same 0.08 V/count scale:
            about 12.4 V parked, 14.8 V in READY and while charging.
        SKM_12V_BATTERY_BY_LOAD:
          expression: B21*0.08
          notes: >-
            GDS 'Battery Voltage Monitoring Input (by Load)', the last GDS item and the last marked
            byte. Equals SKM_12V_BATTERY or 1 count below in every capture.
        SKM_VEHICLE_SPEED:
          expression: B12
          notes: >-
            GDS 'Vehicle Speed Signal', after 'Engine Speed' (unmarked B11). 0 except while driving
            on 2026-10-25 (12:22-12:36, 19 captures): 41 at VCU_VEHICLE_SPEED 42.3, 84 at 87.4, 66
            at 66-70, 0 when stopped; within 1 of AAF_VEHICLE_SPEED_KMH. Read 255 once, parked, at
            the ACC to ON press on 2026-11-03 20:38:43.
          unit: km/h
          max: "255"
        SKM_ACC_RELAY_OUTPUT_V:
          expression: B17*0.08
          source: Narrated power-state cycles 2026-11-03
          verified: true
          notes: >-
            GDS 'ACC Relay Output'. On in ACC, ON and READY (12 ACC rows on 2026-11-03), 0 in OFF.
        SKM_IGN1_RELAY_OUTPUT_V:
          expression: B18*0.08
          source: Narrated power-state cycles 2026-11-03
          verified: true
          notes: GDS 'IGN1 Relay Output'. On in ON and READY, 0 in OFF and ACC.
        SKM_IGN2_RELAY_OUTPUT_V:
          expression: B19*0.08
          source: Narrated power-state cycles 2026-11-03
          verified: true
          notes: GDS 'IGN2 Relay Output'. On in ON and READY, 0 in OFF and ACC.
        SKM_STARTER_RELAY_OUTPUT_V:
          expression: B20*0.08
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: >-
            GDS 'Starter Relay Output', the item between IGN2 Relay Output and Battery Voltage (by
            Load). 0 in every capture.
    22B007:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        B11 is a status byte (SKM_B007_FLAG and its bit signals): unlock, tail lamps off, the
        start-button LED colour, ACC and ignition. B12 bits 2-3 read 1 with the ignition off. B10:3
        was set once, as the driver door closed in READY on 2026-11-03.
      source: Narrated power-state cycles 2026-11-03
      verified: false
      parameters:

        SKM_B007_FLAG:
          expression: B11
          source: state-contrast analysis 2026-07-29; Narrated power-state cycles 2026-11-03
          notes: >-
            Whole byte. 0x00 locked and off; 0x04 unlocked and off, 0x2C ACC, 0xF4 ON, 0xE4 READY;
            bit 1 (0x02) is added while the tail lamps are off. See the bit signals below.
        SSB_LED_ACC:
          expression: B11:3
          min: "0"
          max: "1"
          notes: >-
            1 in ACC only (3 episodes, 15 rows on 2026-11-03), 0 in OFF, ON and READY: matches the
            start button's amber LED as narrated in every state. The LED and the ACC state never
            diverged, so the bit may be the state rather than the lamp drive.
        SSB_LED_ON:
          expression: B11:4
          min: "0"
          max: "1"
          notes: >-
            1 in ON without READY only (3 episodes, 32 rows on 2026-11-03), 0 in OFF, ACC and READY:
            matches the start button's blue LED as narrated, which goes out in READY. The LED and
            the state never diverged, so the bit may be the state rather than the lamp drive.
        SKM_ACC_B007:
          expression: B11:5
          min: "0"
          max: "1"
          notes: >-
            1 in ACC, ON and READY, 0 in OFF: the ACC line. Disabled as a duplicate of
            SKM_ACC_INPUT.
          enabled: false
        SKM_IGN_B007:
          expression: B11:6
          min: "0"
          max: "1"
          notes: >-
            1 in ON and READY, 0 in OFF and ACC; B11:7 is identical in every capture. Disabled as a
            duplicate of SKM_IGN1_INPUT.
          enabled: false
        SKM_UNLOCKED:
          expression: B11:2
          type: enum
          values:
            0: locked
            1: unlocked
          category: lock
          min: "0"
          max: "1"
          source: Lock cross-tab vs IGPM DOOR_LOCK_FL 2026-11-03
          notes: 1 in all 338 rows aligned with the doors unlocked, 0 in all 955 with them locked.
        SKM_TAIL_LAMPS_OFF:
          expression: B11:1
          min: "0"
          max: "1"
          source: Cross-tab vs IGPM TAIL_LIGHTS 2026-11-03
          notes: >-
            1 when the tail lamps are off: 365 of 367 aligned rows with the car unlocked, both
            misses at stalk changes; 1 with the stalk at AUTO and the lamps off (2026-10-22). 0
            whenever the car is locked.
        SKM_IGN_OFF_B007:
          expression: B12:2
          min: "0"
          max: "1"
          notes: >-
            1 in OFF and ACC, 0 in ON and READY (957 rows); B12:3 is identical. Disabled as a
            duplicate of SKM_IGN1_INPUT, inverted.
          enabled: false
    22B008:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        17 bytes, mostly 0. B13 is the power mode (SKM_POWER_MODE). Sample in READY:
        62B0080000000000000009000000000000.
      parameters:
        SKM_POWER_MODE:
          expression: B13
          type: enum
          values:
            0: "off"
            2: acc
            7: "on"
            9: ready
          min: "0"
          max: "15"
          source: Narrated power-state cycles 2026-11-03; cross-tab vs VCU 2101 VEHICLE_STATE_EV_READY
          verified: true
          notes: >-
            0 OFF, 2 ACC, 7 ON without READY, 9 READY. Followed the narrated sequence of 2026-11-03
            through all 336 reads (4 OFF, 3 ACC, 3 ON, 4 READY episodes); 9 in all rows aligned with
            VCU READY (2026-10-22, 2026-10-25), 0 in all 180 with it off. Already 9 at the first
            read after each START. The only READY signal readable without the VCU.
    22B009:
      response_frames: 5
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        33 bytes, all 0 when locked and off. B11 bit 1 is set with the ignition off and a door open
        (2026-11-03); B10 read 5 and 4 for 10 s as the driver door was closed and reopened in READY.
    22B00A:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        19 bytes: 62B00A0100F038000501080600000040010000. B19 bit 0 reads 1 in ON and READY, 0 in
        OFF and ACC (312 of 312 ignition-on rows).
    22B00B:
      response_frames: 8
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        52 bytes, beginning 62B00B800000000200000000000000000000000400005319420000000002. B57 copies
        SKM_POWER_MODE. On 2026-11-03: B31 bit 1 and B41 bit 5 are set with the ignition off and a
        door open; B54 bit 2 and B39 bits 4 and 7 come on for about 30 s after each change to ACC or
        ON, and B54 bit 2 and B39 bit 4 stay on through READY; B33 and B37 bit 4 are set with the
        ignition on or in ACC until the driver door closed at 20:48:35.
      parameters:
        SKM_POWER_MODE_B00B:
          expression: B57
          type: enum
          values:
            0: "off"
            2: acc
            7: "on"
            9: ready
          min: "0"
          max: "15"
          source: Narrated power-state cycles 2026-11-03
          verified: false
          notes: >-
            Equals SKM_POWER_MODE (22B008 B13) in every co-polled read. Disabled as a duplicate.
          enabled: false
  iocontrol:
    B108:
      vehicle_states: []
      label: ACC relay
      verified: true
      true: "2FB108030A0A05"
      false: "2FB10800"
      hold: false
      notes: >-
        Needs the fob in range: without it the ECU answers positively but the relay does not close,
        so check the IGPM BC03 ignition byte. ACC on: dash lights, infotainment, doors unlock. NRC
        0x22 if ACC is already on. freezeCurrentState (02) returns status bytes 6255. Drives the
        Button Start #1 (ACC) relay E48 (SMK connector B pin 12), which feeds the 'hot in ACC or ON'
        group (IGPM MODULE2 fuse): audio, navigation, USB and wireless charger, BCM, SMK, SBW
        switch. Wiring from US-market diagrams.

    B109:
      vehicle_states: []
      label: IGN1 relay
      verified: false
      true: "2FB109030A0A05"
      false: "2FB10900"
      hold: false
      notes: >-
        Drives the Button Start #2 (IG1) relay E43 (SMK connector B pin 2), which feeds the 'hot in
        ON or START' group: cluster, SRS airbag module, MDPS, door modules, stop-lamp switch and the
        EPCU ON/START input (pin 46). It does not carry the start request to the EPCU (see B10B).
        Untested. Wiring from US-market diagrams.
    B10A:
      vehicle_states: []
      label: IGN2 relay
      verified: false
      true: "2FB10A030A0A05"
      false: "2FB10A00"
      hold: false
      notes: >-
        Drives the Button Start #3 (IG2) relay E46 (SMK connector B pin 1), which feeds the 'hot in
        ON' group: front wipers, washer, A/C control module, seat warmers and ventilation, heated
        steering, BCM and SMK MODULE6 supply. IGN2 drops out during START. Untested. Wiring from
        US-market diagrams.

    B10B:
      vehicle_states: []
      label: Start output
      verified: false
      true: "2FB10B030A0A05"
      false: "2FB10B00"
      hold: false
      notes: >-
        SMK Start Relay Output (connector C pin 10). On this EV it switches no starter: it feeds the
        IGPM START fuse ('hot in START'), which supplies the EPCU 'Start Switch' input (pin 42) and
        the front-wiper FRT2 fuse, and returns to the SMK as Start Relay Feedback (pin 16).
        Asserting it presents the EPCU start request. Untested. Wiring from US-market diagrams.

    B101:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely B+ relay or ESCL"
      verified: false
      true: "2FB10103"
      false: "2FB10100"
      notes: >-
        Do not test until identified by non-destructive means: may be the main power relay or the
        ESCL (steering column lock). Actuating an ESCL over raw UDS can corrupt its state machine so
        it refuses to unlock; a Renault Zoe ESCL bricked this way via DDT4All needed dealer
        replacement of ESCL, SKM and BCM (cryptographically paired).
    B102:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely ESCL or immobilizer"
      verified: false
      true: "2FB10203"
      false: "2FB10200"
      notes: >-
        Do not test (see B101): may be ESCL lock/unlock or immobiliser control. The ESCL's wear
        counter and error state cannot be reset without dealer tools.
    B103:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely immobilizer lamp or ESCL"
      verified: false
      true: "2FB10303"
      false: "2FB10300"
      notes: >-
        Do not test (see B101): may be the immobiliser lamp or ESCL-related. Skip until B101/B102
        are identified.
