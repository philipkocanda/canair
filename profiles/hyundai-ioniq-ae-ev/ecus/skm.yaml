# ─── SKM (Smart Key Module) ────────────────────────────────────────────
# Self-identifies as "SMK". Key fob detection, immobiliser and remote functions. Sleeps within
# seconds of its last request, so reads need the wake ritual below. Has a dedicated CAN line to
# the start/stop button (SSB).
SKM:
  tx_id: 0x7A5
  can_bus: [B-CAN, P-CAN]
  identity:
    alias: SMK  # ECU self-identifies as "SMK"
    description: Smart Key Module
    mfg_date: "2017-06-02"
    diag_address: "190"
    hw_version: "10000"
    sw_version: "10200"
    id_protocol: UDS  # F1xx
    part_number: ""
    notes: >-
      Smart Key Module (self-identifies as SMK, also known as SMARTRA): key-fob detection,
      immobiliser and remote functions. Sleeps about 2 s after its last request; see wake:.
  vehicle_states: [SLEEP, PLUGGED, ACC, "ON", READY, CHARGING]
  wake:
    method: rapid_read
    prime_pid: 22B003
    attempts: 8
    interval_ms: 80
    sleep_timer_ms: 2000
    notes: >-
      SKM keeps its CAN transceiver up only ~2 s and answers one request before sleeping again. A
      burst of cheap 22B003 reads holds it awake for a session and the B0xx reads; a single 1001
      wake races the sleep timer.
  session: true
  scan_log: # SKM
    - service: 0x22
      range: "0101-010F,B001-B010"
      date: 2026-07-22
      hits: "B002,B003,B005,B006,B008,B00A"
      vehicle_states: [READY]
      notes: Fob present. 01xx all NRC.
  pids:
    22B002:
      response_frames: 26
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        178 data bytes, constant in every capture except B162 (SKM_GEAR). The 136-byte 2026-04-18
        capture is a corrupt reassembly with reordered frames.
      parameters:
        SKM_GEAR:
          expression: B162
          type: enum
          values:
            0: P
            5: D
          min: "0"
          max: "15"
          source: Cross-tab vs VCU 2101 GEAR_* over all SKM captures, 2026-11-01
          verified: false
          notes: >-
            0 in all 753 captures with VCU in P, 5 in all 18 in D (2026-10-25 drive). The only byte
            of 22B002 that varies. Hyundai gear encoding puts N at 6 and R at 7; neither captured.

    22B003:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "25 bytes: 62B003000000003412900300000000C6A21261000000000F00."
    22B005:
      response_frames: 2
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        11 bytes. Support map FA 60 90 at B05-B07. The marked bits follow the GDS Current Data order
        (shop manual page 0417), LSB first: start button switches, ACC/IGN1/IGN2, start relay
        feedback, stop lamp switch and fuse, door handle buttons. ON/READY reads B10 = 0x1C, B12 =
        0xC0, B13 = 0x01; off 0x00, 0x00, 0x00. B11 is 0x04 except one 0x06 (driving) and one 0x24
        (parked). B12 bits 6-7 and B13 are outside the map.
      parameters:
        SSB_SWITCH_1:
          expression: B10:0
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: GDS 'Start Stop Button Switch1'. 0 in every capture.
        SSB_SWITCH_2:
          expression: B10:1
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: GDS 'Start Stop Button Switch2'. 0 in every capture.
        SKM_ACC_INPUT:
          expression: B10:2
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: GDS 'ACC'. 1 in every ON/READY capture, 0 off; ACC alone not captured.
        SKM_IGN1_INPUT:
          expression: B10:3
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: GDS 'IGN1'. 1 in every ON/READY capture, 0 off.
        SKM_IGN2_INPUT:
          expression: B10:4
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: GDS 'IGN2'. 1 in every ON/READY capture, 0 off.
        START_RELAY_FEEDBACK:
          expression: B10:6
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: >-
            GDS lists 'Start Relay Feed Back Signal' then 'Gearshift P Position' after IGN2, with
            only B10:6 marked (B10:5 is not). 0 in every capture, including parked in P, so it is
            not an active-high P switch.
        STOP_LAMP_SWITCH:
          expression: B11:1
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: >-
            GDS 'Stop Lamp Switch'. Set in 1 capture, while driving; not checked against the brake.
        STOP_LAMP_FUSE:
          expression: B11:2
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: GDS 'Stop Lamp Fuse' (ON = fuse intact). 1 in every capture.
        DRIVER_DOOR_HANDLE_BUTTON:
          expression: B12:0
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: GDS 'Driver Door Handle Toggle Button Switch'. 0 in every capture.
        ASSIST_DOOR_HANDLE_BUTTON:
          expression: B12:3
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: GDS 'Assist Door Handle Toggle Button Switch'. 0 in every capture.
    22B006:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      source: Cross-tab vs BCM, IGPM and VCU over all SKM captures, 2026-11-01
      verified: false
      unit: V
      min: "0"
      max: "20"
      notes: >-
        Analog inputs at 0.08 V per count, plus vehicle speed. Marked bytes follow the GDS Current
        Data order (shop manual page 0417): Battery Voltage (by CPU) B10, Engine Speed (unmarked
        B11), Vehicle Speed B12, then ACC, IGN1, IGN2 and Starter Relay Output, then Battery Voltage
        (by Load) B21. B17-B19 are the three relay outputs: non-zero in all 32 captures with IGPM
        IGN1_SWITCH = 1 and 0 in every other, including 282 charging and top-up captures; 14.2-15.0
        V when on, within a count of BCM 22B003 B26/B27/B28. B20 is the starter output (always 0);
        B14 and B15 have no GDS item (B15 always 0, B14 160 in one capture).
      parameters:

        SKM_12V_BATTERY:
          expression: B10*0.08
          notes: >-
            GDS 'Battery Voltage Monitoring Input (by CPU)'. Reads 2-3 counts (about 0.2 V) above
            BCM_12V_BATTERY in 175 of 186 co-polled rows (r=0.96), the same 0.08 V/count scale:
            about 12.4 V parked, 14.8 V in READY and while charging.
        SKM_12V_BATTERY_BY_LOAD:
          expression: B21*0.08
          notes: >-
            GDS 'Battery Voltage Monitoring Input (by Load)', the last GDS item and the last marked
            byte. Equals SKM_12V_BATTERY or 1 count below in every capture.
        SKM_VEHICLE_SPEED:
          expression: B12
          notes: >-
            GDS 'Vehicle Speed Signal', after 'Engine Speed' (unmarked B11). 0 except while driving
            on 2026-10-25 (12:22-12:36, 19 captures): 41 at VCU_VEHICLE_SPEED 42.3, 84 at 87.4, 66
            at 66-70, 0 when stopped; within 1 of AAF_VEHICLE_SPEED_KMH.
          unit: km/h
          max: "255"
        SKM_ACC_RELAY_OUTPUT_V:
          expression: B17*0.08
        SKM_IGN1_RELAY_OUTPUT_V:
          expression: B18*0.08
        SKM_IGN2_RELAY_OUTPUT_V:
          expression: B19*0.08
        SKM_STARTER_RELAY_OUTPUT_V:
          expression: B20*0.08
          source: GDS Current Data list order (shop manual 0417) vs the support map
          verified: false
          notes: >-
            GDS 'Starter Relay Output', the item between IGN2 Relay Output and Battery Voltage (by
            Load). 0 in every capture.
    22B007:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      parameters:

        SKM_B007_FLAG:
          expression: B11
          source: state-contrast analysis 2026-07-29
          verified: false
          notes: >-
            0x00, 0x04 or 0x06 with the ignition off; 0xE4 or 0xE6 in all 34 captures with IGPM
            IGN1_SWITCH = 1. Bit 1 is the part not explained by the ignition.
    22B008:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "17 bytes, mostly 0: 62B0080000000000000009000000000000."
    22B009:
      response_frames: 5
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: 33 bytes, all 0 in all 17 captures.
    22B00A:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "19 bytes: 62B00A0100F038000501080600000040010000."
    22B00B:
      response_frames: 8
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: 52 bytes, beginning 62B00B800000000200000000000000000000000400005319420000000002.
  iocontrol:
    B108:
      vehicle_states: []
      label: ACC relay
      verified: true
      true: "2FB108030A0A05"
      false: "2FB10800"
      hold: false
      notes: >-
        Needs the fob in range: without it the ECU answers positively but the relay does not close,
        so check the IGPM BC03 ignition byte. ACC on: dash lights, infotainment, doors unlock. NRC
        0x22 if ACC is already on. freezeCurrentState (02) returns status bytes 6255. Drives the
        Button Start #1 (ACC) relay E48 (SMK connector B pin 12), which feeds the 'hot in ACC or ON'
        group (IGPM MODULE2 fuse): audio, navigation, USB and wireless charger, BCM, SMK, SBW
        switch. Wiring from US-market diagrams.

    B109:
      vehicle_states: []
      label: IGN1 relay
      verified: false
      true: "2FB109030A0A05"
      false: "2FB10900"
      hold: false
      notes: >-
        Drives the Button Start #2 (IG1) relay E43 (SMK connector B pin 2), which feeds the 'hot in
        ON or START' group: cluster, SRS airbag module, MDPS, door modules, stop-lamp switch and the
        EPCU ON/START input (pin 46). It does not carry the start request to the EPCU (see B10B).
        Untested. Wiring from US-market diagrams.
    B10A:
      vehicle_states: []
      label: IGN2 relay
      verified: false
      true: "2FB10A030A0A05"
      false: "2FB10A00"
      hold: false
      notes: >-
        Drives the Button Start #3 (IG2) relay E46 (SMK connector B pin 1), which feeds the 'hot in
        ON' group: front wipers, washer, A/C control module, seat warmers and ventilation, heated
        steering, BCM and SMK MODULE6 supply. IGN2 drops out during START. Untested. Wiring from
        US-market diagrams.

    B10B:
      vehicle_states: []
      label: Start output
      verified: false
      true: "2FB10B030A0A05"
      false: "2FB10B00"
      hold: false
      notes: >-
        SMK Start Relay Output (connector C pin 10). On this EV it switches no starter: it feeds the
        IGPM START fuse ('hot in START'), which supplies the EPCU 'Start Switch' input (pin 42) and
        the front-wiper FRT2 fuse, and returns to the SMK as Start Relay Feedback (pin 16).
        Asserting it presents the EPCU start request. Untested. Wiring from US-market diagrams.

    B101:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely B+ relay or ESCL"
      verified: false
      true: "2FB10103"
      false: "2FB10100"
      notes: >-
        Do not test until identified by non-destructive means: may be the main power relay or the
        ESCL (steering column lock). Actuating an ESCL over raw UDS can corrupt its state machine so
        it refuses to unlock; a Renault Zoe ESCL bricked this way via DDT4All needed dealer
        replacement of ESCL, SKM and BCM (cryptographically paired).
    B102:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely ESCL or immobilizer"
      verified: false
      true: "2FB10203"
      false: "2FB10200"
      notes: >-
        Do not test (see B101): may be ESCL lock/unlock or immobiliser control. The ESCL's wear
        counter and error state cannot be reset without dealer tools.
    B103:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely immobilizer lamp or ESCL"
      verified: false
      true: "2FB10303"
      false: "2FB10300"
      notes: >-
        Do not test (see B101): may be the immobiliser lamp or ESCL-related. Skip until B101/B102
        are identified.
    B104:
