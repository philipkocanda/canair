  research:
    - type: decode
      target: "22B002"
      status: captured
      priority: P1
      vehicle_states: [SLEEP]
      date: "2026-07-29"
      notes: >-
        178-byte block, constant across READY with the fob present, SLEEP without it, charging and
        driving, except B162 (SKM_GEAR, 0 in P, 5 in D). Repeating 6-7 byte groups; probably
        configuration. Undecoded.
      what_to_test:
        - "Fob near vs removed/far in one session; diff B002"
        - "Add or remove a registered key; check whether a record count or a repeated group changes"

    - type: verify
      target: "2FB109"
      status: pending
      priority: P2
      notes: "IGN1 relay ON — accepted but untested."
    - type: verify
      target: "2FB10A"
      status: pending
      priority: P2
      notes: "IGN2 relay ON — accepted but untested."
    - type: verify
      target: "2FB10B"
      status: pending
      priority: P3
      notes: Start output ON. Untested; asserting it presents the EPCU start request.
      sources:
        - "Obsidian: SKM.md — KIA Soul commands"
    - type: verify
      target: 22B006 SKM_B006_VAL_A/B
      status: done
      priority: P2
      vehicle_states: [SLEEP]
      created: "2026-07-30"
      updated: "2026-11-03"
      result: >-
        B10/B21 are 12 V supply voltages at 0.08 V/count: B10 reads 2-3 counts above BCM_12V_BATTERY
        (SKM_12V_BATTERY, SKM_12V_BATTERY_BY_LOAD).
      notes: >-
        B007 B11 bit 1 (SKM_B007_FLAG) is decoded: 1 while the tail lamps are off
        (SKM_TAIL_LAMPS_OFF, 2026-11-03).
    - type: decode
      target: 22B002/22B003/22B005/22B006/22B008/22B00A terminal-feedback bits
      status: done
      priority: P2
      vehicle_states: [ACC, "ON"]
      created: "2026-10-23"
      updated: "2026-11-03"
      result: >-
        Captured on 2026-11-03 (OFF, ACC, ON and READY, 3-4 episodes each): 22B005 SKM_ACC_INPUT and
        22B006 B17 are on in ACC alone, the IGN1/IGN2 inputs and B18/B19 only in ON and READY.
        22B008 B13 (SKM_POWER_MODE) reads 0/2/7/9 for OFF/ACC/ON/READY, and 22B007 B11 bits 3 and 4
        match the amber and blue start-button LED. BCM 22B004 B10 = 2 gives an ACC state without the
        SKM.
      notes: >-
        The SKM reads back three terminal lines after its relays: ON (IGN2), ACC/ON (ACC) and
        ON/START (IGN1), on SMK connector C pins 8, 18 and 9 (US-market wiring), and drives separate
        ACC and IGN LEDs on the start button. Open: an SKM read inside a START, when IGN2 and ACC
        drop out.
      what_to_test:
        - "Press the start button without the brake: OFF to ACC to ON to OFF, holding each state about 10 s, recording the SKM B0xx pages with --keep-changes and pressing s at every press. Look for bits that change at each step."
      capture_protocol: >-
        canair monitor SKM --save --keep-changes --interval 1 --label 'SKM terminal steps
        OFF-ACC-ON-OFF' --state ACC; fob inside the car, brake not pressed, press s at every button
        press.
    - type: decode
      target: 22B006 byte map (B05-B07, B09)
      status: done
      priority: P3
      vehicle_states: [SLEEP, READY]
      created: "2026-10-29"
      updated: "2026-11-03"
      result: >-
        22B006's constant map AF E0 00 00 marks B10, B12, B14, B15 and B17-B21 as signals (one bit
        per data byte, MSB first); all varying bytes are inside. B10/B21 are 12 V supplies, B12
        vehicle speed, B17-B19 the ACC, IGN1 and IGN2 relay outputs. B14, B15 and B20 read 0 through
        OFF, ACC, ON and READY on 2026-11-03. 22B005 does not follow the map (4 of 9 set bits
        outside).
      notes: B14 (0, once 160 while driving), B15 and B20 (always 0) have not moved.
      sources:
        - byte sweep over all stored SKM captures, 2026-10-29
      what_to_test:
        - Record SKM 22B006 with --keep-all through ACC and ON without READY, to see whether B14, B15 or B20 move.
    - type: decode
      target: 22B007 B12:4 pulses; 22B00B B39/B54 30 s window
      status: pending
      priority: P3
      vehicle_states: [ACC, "ON", READY]
      created: "2026-11-03"
      updated: "2026-11-03"
      result: >-
        22B007 B12:4 is set in single 5 s polls, 7 times in 28 min on 2026-11-03, in every state; 3
        fell within 6 s before a button press or the driver door closing, 4 had no co-polled change.
        22B00B B54 bit 2 and B39 bits 4 and 7 come on at each change to ACC or ON and clear about 30
        s later; B54:2 and B39:4 then stay on through READY.
      notes: >-
        Both look like smart-key activity (an interior fob search, an authorisation window), but
        nothing decoded confirms it. The 5 s polling could not time them better.
      sources:
        - power-state cycles 2026-11-03
      what_to_test:
        - "Poll SKM 22B007 and 22B00B alone at the fastest rate in ON: press the brake, touch a door handle button, take the fob out of the car, and wait 2 min untouched, noting each step."
      capture_protocol: >-
        canair monitor SKM:22B007,22B00B IGPM:22BC03 --save --keep-all --interval 0.5 --label 'SKM
        fob search and 30 s window' --state ON; press s at every action.
