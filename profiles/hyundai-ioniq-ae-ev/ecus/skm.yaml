  research:
    - type: decode
      target: "22B002"
      status: captured
      priority: P1
      vehicle_states: [SLEEP]
      date: "2026-07-29"
      notes: >-
        178-byte block, byte-identical in READY with the fob present (2026-07-22) and in SLEEP
        without it (2026-07-29), so it does not encode power state or fob presence. Repeating 6-7
        byte groups. Undecoded.
      what_to_test:
        - "Fob near vs removed/far in one session; diff B002"
        - "Add or remove a registered key; check whether a record count or a repeated group changes"

    - type: verify
      target: "2FB109"
      status: pending
      priority: P2
      notes: "IGN1 relay ON — accepted but untested."
    - type: verify
      target: "2FB10A"
      status: pending
      priority: P2
      notes: "IGN2 relay ON — accepted but untested."
    - type: verify
      target: "2FB10B"
      status: pending
      priority: P3
      notes: Start output ON. Untested; asserting it presents the EPCU start request.
      sources:
        - "Obsidian: SKM.md — KIA Soul commands"
    - type: verify
      target: 22B006 SKM_B006_VAL_A/B
      status: captured
      priority: P2
      vehicle_states: [SLEEP]
      created: "2026-07-30"
      updated: "2026-07-30"
      notes: >-
        B10/B21 (SKM_B006_VAL_A/B): 0x9A-0xA2, drifting about 1 per reading and within 1 of each
        other. Identify the unit against a controlled reference (12 V rail or temperature). B007 B11
        (SKM_B007_FLAG, 0x00/0x06): correlate with a physical event.
    - type: decode
      target: 22B002/22B003/22B005/22B006/22B008/22B00A terminal-feedback bits
      status: pending
      priority: P2
      vehicle_states: [ACC, "ON"]
      created: "2026-10-23"
      updated: "2026-10-23"
      notes: >-
        No signal tells ACC apart from OFF yet. The SKM reads back three terminal lines after its
        relays: ON (IGN2), ACC/ON (ACC) and ON/START (IGN1), on SMK connector C pins 8, 18 and 9,
        and drives separate ACC and IGN LEDs on the start button. The ACC/ON input separates ACC
        from OFF. Whether any is exposed in a B0xx page is unknown. Wiring from US-market diagrams.
      what_to_test:
        - "Press the start button without the brake: OFF to ACC to ON to OFF, holding each state about 10 s, recording the SKM B0xx pages with --keep-changes and pressing s at every press. Look for bits that change at each step."
      capture_protocol: >-
        canair monitor SKM --save --keep-changes --interval 1 --label 'SKM terminal steps
        OFF-ACC-ON-OFF' --state ACC; fob inside the car, brake not pressed, press s at every button
        press.
    - type: decode
      target: 22B006 byte map (B05-B07, B09)
      status: pending
      priority: P3
      vehicle_states: [SLEEP, READY]
      created: "2026-10-29"
      updated: "2026-10-29"
      result: >-
        22B006's constant map AF E0 00 00 marks B10, B12, B14, B15 and B17-B21 as signals (one bit
        per data byte, MSB first); all 6 varying bytes are inside. 22B005 does not follow the map (4
        of 9 set bits outside).
      notes: >-
        B17, B18 and B19 read 183-187 when non-zero (2026-10-22 x8, 2026-10-25 x24) and 0 otherwise,
        the same range as VAL_A/VAL_B. B12 reads 0-92, non-zero only on 2026-10-25. B14 (0, once
        160), B15 and B20 (always 0) have not moved. B12 and B17-B19 are defined as disabled
        candidates.
      sources:
        - byte sweep over all stored SKM captures, 2026-10-29
      what_to_test:
        - Record SKM 22B006 with --keep-all while moving the fob around the car (inside, each door, the trunk), noting each position, to see whether B10/B17/B18/B19/B21 are per-antenna readings.
