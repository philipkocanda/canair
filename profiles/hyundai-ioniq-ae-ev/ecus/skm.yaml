      description: CAN error
      causes: >-
        CAN high or low shorted to battery or ground, open, or shorted together; smart key unit
      source: Ioniq Electric 2017 service manual, Smart Key Unit diagnosis (EV), DTC B1602-00
      source_links:
        - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Body%20%26%20Frame/Door%20Locks/Smart%20Key%20Unit%20Diagnosis%20%28EV%29/
      verified: false
      notes: Over 0.3 s. History clears after 30 ignition cycles.
