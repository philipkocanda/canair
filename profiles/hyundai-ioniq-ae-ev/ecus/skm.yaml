# ─── SKM (Smart Key Module) ────────────────────────────────────────────
# Self-identifies as "SMK". Key fob detection, immobiliser and remote functions. Sleeps within
# seconds of its last request, so reads need the wake ritual below. Has a dedicated CAN line to
# the start/stop button (SSB).
SKM:
  tx_id: 0x7A5
  can_bus: [B-CAN, P-CAN]
  identity:
    alias: SMK  # ECU self-identifies as "SMK"
    description: Smart Key Module
    mfg_date: "2017-06-02"
    diag_address: "190"
    hw_version: "10000"
    sw_version: "10200"
    id_protocol: UDS  # F1xx
    part_number: ""
    notes: >-
      Smart Key Module (self-identifies as SMK, also known as SMARTRA): key-fob detection,
      immobiliser and remote functions. Sleeps about 2 s after its last request; see wake:.
  vehicle_states: [SLEEP, PLUGGED, ACC, "ON", READY, CHARGING]
  wake:
    method: rapid_read
    prime_pid: 22B003
    attempts: 8
    interval_ms: 80
    sleep_timer_ms: 2000
    notes: >-
      SKM keeps its CAN transceiver up only ~2 s and answers one request before sleeping again. A
      burst of cheap 22B003 reads holds it awake for a session and the B0xx reads; a single 1001
      wake races the sleep timer.
  session: true
  scan_log: # SKM
    - service: 0x22
      range: "0101-010F,B001-B010"
      date: 2026-07-22
      hits: "B002,B003,B005,B006,B008,B00A"
      vehicle_states: [READY]
      notes: Fob present. 01xx all NRC.
  pids:
    22B002:
      response_frames: 26
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        178 data bytes, byte-identical across sessions and states (READY with fob 2026-07-22, SLEEP
        without fob 2026-07-29), with repeating 6-7 byte groups. The 136-byte 2026-04-18 capture is
        a corrupt reassembly with reordered frames.

    22B003:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "25 bytes: 62B003000000003412900300000000C6A21261000000000F00."
    22B005:
      response_frames: 2
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "11 bytes: 62B005FA60900000040000."
    22B006:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      source: support-bitmap sweep 2026-10-29
      verified: false
      parameters:

        SKM_B006_VAL_A:
          expression: B10
          source: state-contrast analysis 2026-07-29
          notes: 0x9A-0xA2 across sessions, drifting about 1 per reading.
        SKM_B006_VAL_B:
          expression: B21
          source: state-contrast analysis 2026-07-29
          notes: Within 1 of SKM_B006_VAL_A in every capture.
        SKM_B006_B12:
          expression: B12
          notes: Marked by the 22B006 support map. 0-92; non-zero only on 2026-10-25 (19 captures).
          enabled: false
        SKM_B006_B17:
          expression: B17
          notes: >-
            Marked by the 22B006 support map. 183-187 when non-zero (2026-10-22 x8, 2026-10-25 x24),
            else 0; the same range as SKM_B006_VAL_A/B.
          enabled: false
        SKM_B006_B18:
          expression: B18
          notes: >-
            Marked by the 22B006 support map. Non-zero in the same captures as SKM_B006_B17,
            183-186.
          enabled: false
        SKM_B006_B19:
          expression: B19
          notes: >-
            Marked by the 22B006 support map. Non-zero in the same captures as SKM_B006_B17,
            183-186.
          enabled: false
    22B007:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      parameters:

        SKM_B007_FLAG:
          expression: B11
          source: state-contrast analysis 2026-07-29
          verified: false
          notes: Only 0x00 and 0x06 observed; the only byte in B007 that varies.
    22B008:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "17 bytes, mostly 0: 62B0080000000000000009000000000000."
    22B009:
      response_frames: 5
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: 33 bytes, all 0 in all 17 captures.
    22B00A:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "19 bytes: 62B00A0100F038000501080600000040010000."
    22B00B:
      response_frames: 8
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: 52 bytes, beginning 62B00B800000000200000000000000000000000400005319420000000002.
  iocontrol:
    B108:
      vehicle_states: []
      label: ACC relay
      verified: true
      true: "2FB108030A0A05"
      false: "2FB10800"
      hold: false
      notes: >-
        Needs the fob in range: without it the ECU answers positively but the relay does not close,
        so check the IGPM BC03 ignition byte. ACC on: dash lights, infotainment, doors unlock. NRC
        0x22 if ACC is already on. freezeCurrentState (02) returns status bytes 6255. Drives the
        Button Start #1 (ACC) relay E48 (SMK connector B pin 12), which feeds the 'hot in ACC or ON'
        group (IGPM MODULE2 fuse): audio, navigation, USB and wireless charger, BCM, SMK, SBW
        switch. Wiring from US-market diagrams.

    B109:
      vehicle_states: []
      label: IGN1 relay
      verified: false
      true: "2FB109030A0A05"
      false: "2FB10900"
      hold: false
      notes: >-
        Drives the Button Start #2 (IG1) relay E43 (SMK connector B pin 2), which feeds the 'hot in
        ON or START' group: cluster, SRS airbag module, MDPS, door modules, stop-lamp switch and the
        EPCU ON/START input (pin 46). It does not carry the start request to the EPCU (see B10B).
        Untested. Wiring from US-market diagrams.
    B10A:
      vehicle_states: []
      label: IGN2 relay
      verified: false
      true: "2FB10A030A0A05"
      false: "2FB10A00"
      hold: false
      notes: >-
        Drives the Button Start #3 (IG2) relay E46 (SMK connector B pin 1), which feeds the 'hot in
        ON' group: front wipers, washer, A/C control module, seat warmers and ventilation, heated
        steering, BCM and SMK MODULE6 supply. IGN2 drops out during START. Untested. Wiring from
        US-market diagrams.

    B10B:
      vehicle_states: []
      label: Start output
      verified: false
      true: "2FB10B030A0A05"
      false: "2FB10B00"
      hold: false
      notes: >-
        SMK Start Relay Output (connector C pin 10). On this EV it switches no starter: it feeds the
        IGPM START fuse ('hot in START'), which supplies the EPCU 'Start Switch' input (pin 42) and
        the front-wiper FRT2 fuse, and returns to the SMK as Start Relay Feedback (pin 16).
        Asserting it presents the EPCU start request. Untested. Wiring from US-market diagrams.

    B101:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely B+ relay or ESCL"
      verified: false
      true: "2FB10103"
      false: "2FB10100"
      notes: >-
        Do not test until identified by non-destructive means: may be the main power relay or the
        ESCL (steering column lock). Actuating an ESCL over raw UDS can corrupt its state machine so
        it refuses to unlock; a Renault Zoe ESCL bricked this way via DDT4All needed dealer
        replacement of ESCL, SKM and BCM (cryptographically paired).
    B102:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely ESCL or immobilizer"
      verified: false
      true: "2FB10203"
      false: "2FB10200"
      notes: >-
        Do not test (see B101): may be ESCL lock/unlock or immobiliser control. The ESCL's wear
        counter and error state cannot be reset without dealer tools.
    B103:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely immobilizer lamp or ESCL"
      verified: false
      true: "2FB10303"
      false: "2FB10300"
      notes: >-
        Do not test (see B101): may be the immobiliser lamp or ESCL-related. Skip until B101/B102
        are identified.
