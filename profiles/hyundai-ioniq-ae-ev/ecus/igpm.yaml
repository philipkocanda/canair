# ─── IGPM (Integrated Gateway Power Module) ──────────────────────────
IGPM:
  tx_id: 0x770
  iocontrol_scan_ranges: [B000-BFFF, BD00-BDFF, C000-C0FF]
  can_bus: [ALL]
  identity:
    alias: "SJB" # Smart Junction Box (older HKMC naming)
    description: Integrated Gateway & Power Module
    part_number: "91950G7510"
    mfg_date: "2017-06-06"
    hw_version: "100"
    sw_version: "109"
    boot_sw: "20"
    app_sw: "160205"
    id_protocol: UDS  # F1xx
    notes: >-
      CAN gateway and power distribution module. The OBD port connects to it directly, so all
      diagnostic requests are routed through it.
  vehicle_states: [ALL]
  # The first request after the IGPM has been idle may time out or return NO DATA; retry.
  # Answers multi-DID service-22 reads (`22 BC03 BC06`).
  multi_did: true
  # Service-22 reads need no extended session; IOControl (0x2F) needs 10 03.
  scan_log:
    - service: 0x31
      range: "0000-FFFF"
      date: 2026-04-20
      hits: 0
      probes: 768  # stopped at 0x00FF
      vehicle_states: [SLEEP]
      notes: >-
        All NRC 0x12: sub-function 03 (requestRoutineResults) is not supported. Sub-function 01
        (startRoutine) untested.
  pids:
    22BC07:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      period: 5000
      status: active
      response_frames: 2
      vehicle_states: [ALL]
      notes: >-
        8 data bytes. B12 reads 0x11 off and not charging, 0x10 off and charging, 0x18 ON with the
        charge port locked, 0x19 ON with it unlocked. B05-B07 and B09 (08 41 FB CC, the support map)
        and B13 (0) are constant in all 411 captures.
      verified: false
      parameters:
        CHARGE_PORT_LOCK:
          expression: "B11:7"
          category: lock
          verified: true
          notes: 1 = locked.
          type: enum
          values:
            0: unlocked
            1: locked

        CHARGE_PORT_LOCK_INV:
          expression: "B12:0"
          category: lock
          verified: true
          notes: "Complement of CHARGE_PORT_LOCK: 1 = unlocked."
          type: enum
          values:
            0: locked
            1: unlocked

        IG3_RELAY_OUTPUT:
          expression: "B12:3"
          notes: >-
            ScanDoc 'Ignition 3 Relay' (actuator BC44): the IGPM's own IG3 relay output. 1 in READY
            (60 of 61 aligned VCU 2101 rows) and through the parked 12 V top-up (2026-10-21); 0
            while charging with the ignition off (239 of 242 BMS charging rows), from the first
            sample of both 2026-08-08 DC fast charges. Not the same signal as OBC_AC_NOT_CONNECTED,
            which reads 1 through those DC charges.
          source: align vs VCU 2101 and BMS 2101 over stored captures, 2026-10-23
        CHARGE_DOOR_LAMP_REAR:
          expression: B12:2
          source: event-timeline analysis 2026-08-05
          notes: >-
            ScanDoc 'Rear Charge Door Lamp - Output' (actuator BC43). 1 in 15 of 328 captures: set
            at every recorded plug-in with the ignition off, just before the port locks, and once
            for a minute with the port unlocked (2026-10-22); clears within 1-3 min. Also pulses
            about every 6 min during the 2026-08-08 evening charge, unexplained.
          enabled: true
        TRUNK_OPEN_BC07:
          expression: B10:4
          min: "0"
          max: "1"
          source: canair correlate --find-mirrors --bits 2026-10-21
          notes: >-
            Equals 22BC03 TRUNK_OPEN (all 349 aligned rows) and 22BC05 LUGGAGE_LAMP_OUTPUT. Disabled
            as a duplicate.
          enabled: false

    22BC03:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      status: active
      period: 2500
      vehicle_states: [ALL]
      notes: >-
        B05-B07 and B09 (FD EE 3C 73, the support map) are constant in all 384 captures. The marked
        bits follow the GDS Current Data order (shop manual page 0485), LSB first; GDS also lists
        Parking Brake Switch (B10:6) and Front Deicer Relay (B13:0), which are unmarked. B13:6 and
        B13:7 come after the screenshot's last item. B13 is 0 except B13:1.
      source: Kia Niro EV WiCAN PR#716
      verified: true
      parameters:
        # B10 doors and locks, B11 hood, seatbelts and ignition, B12 lamps
        DOOR_DRV_OPEN:
          expression: B10:5
          category: door
          source: Kia Niro EV WiCAN PR#716; confirmed by timed event capture 2026-07-24
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: 1 = open.
          type: enum
          values:
            0: closed
            1: open

        DOOR_PAS_OPEN:
          expression: "B10:4"
          category: door
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: 1 = open.
          type: enum
          values:
            0: closed
            1: open

        DOOR_RL_OPEN:
          expression: "B10:0"
          category: door
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: 1 = open.
          type: enum
          values:
            0: closed
            1: open

        DOOR_RR_OPEN:
          expression: B10:2
          category: door
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: 1 = open.
          type: enum
          values:
            0: closed
            1: open

        TRUNK_OPEN:
          expression: "B10:7"
          category: door
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: GDS 'Tailgate Door Switch'. 1 = open.
          type: enum
          values:
            0: closed
            1: open

        TAIL_LAMP_INTERIOR:
          expression: "B12:2"
          category: lamp
          source: Decoded from live captures (2026-04-15); GDS 'Tail Lamp Output (Interior)' name, align vs 22BC04 B12:5 2026-10-30
          notes: >-
            GDS 'Tail Lamp Output (Interior)' (ScanDoc 'AV tail'): the instrument illumination
            circuit; actuator BC05. Equals TAIL_LIGHTS in 1798 of 1799 aligned rows. Reads 0
            whenever 22BC04 DRL_DEDICATED_OUTPUT is on, so it is not a DRL signal.
          type: enum
          values:
            0: "off"
            1: "on"

        TAIL_LIGHTS:
          expression: "B12:3"
          category: lamp
          source: "Decoded from live captures (2026-04-15)"
          notes: >-
            GDS 'Tail Lamp Output (Exterior)', the tail lamp relay. 1 in every light mode (DRL, low
            and high beam).
          type: enum
          values:
            0: "off"
            1: "on"

        HIGH_BEAM:
          expression: "B12:4"
          category: lamp
          source: "Decoded from live captures (2026-04-15)"
          notes: 1 = on, only with high beams (B13:4 in the Niro EV source).
          type: enum
          values:
            0: "off"
            1: "on"

        LOW_BEAM:
          expression: "B12:5"
          category: lamp
          source: "Decoded from live captures (2026-04-15)"
          notes: 1 = on, also while the high beams are on.
          type: enum
          values:
            0: "off"
            1: "on"

        IGN1_SWITCH:
          expression: "B11:5"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: >-
            GDS 'IGN1 Switch'. 1 in ON and READY (not told apart), including ON while AC charging; 0
            when off and in ACC. Fob unlock does not set it. The ON state predicate reads it.

        SEATBELT_FL:
          expression: "B11:1"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: 1 = driver belt buckled.

        SEATBELT_FR:
          expression: "B11:2"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: false
          notes: >-
            GDS 'Assist Seat Belt Switch'. 1 in 22 of 384 captures. Not checked against a buckled
            passenger belt.

        DOOR_LOCK_RL:
          expression: "B10:1"
          category: lock
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: 1 = locked (the Niro EV source inverts it).
          type: enum
          values:
            0: unlocked
            1: locked

        DOOR_LOCK_RR:
          expression: "B10:3"
          category: lock
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: 1 = locked (the Niro EV source inverts it).
          type: enum
          values:
            0: unlocked
            1: locked
        IGN2_SWITCH:
          expression: B11:6
          min: "0"
          max: "1"
          source: RE 2026-07-23 bit analysis (40 captures)
          verified: false
          notes: >-
            GDS 'IGN2 Switch'. Equals IGN1_SWITCH in every capture; START held (when IGN2 drops and
            IGN1 stays) has not been recorded. Disabled as a duplicate.
          enabled: false
        HOOD_OPEN:
          expression: B11:0
          min: "0"
          max: "1"
          source: Timed event capture 2026-07-24
          notes: 1 = open.
        REAR_DEFOGGER_RELAY:
          expression: B13:1
          source: bitfield analysis 2026-08-06; VCU_AUX_POWER align 2026-10-21; GDS order
          verified: false
          notes: >-
            Set only in the 2026-07-30 10:17-10:25 window narrated 'defroster on'; each edge moves
            VCU_AUX_POWER by a 127-172 W step with the blower unchanged. The 10:20:41 off edge is
            not narrated. HVAC_DEFROST_FLAGS and 22BC07 B11 (OBDb 'defog light') stay 0 in that
            window. The gateway publishes a rear defogger relay state on 0x541 (opendbc
            CF_Gway_DefoggerRly).
        BRAKE_FLUID_SWITCH:
          expression: B11:4
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0485) vs the support map
          verified: false
          notes: >-
            GDS 'Brake Fluid Switch', the only GDS item between Assist Seat Belt Switch (B11:2) and
            IGN1 Switch (B11:5), and B11:4 the only marked bit there. 0 in every capture.
        BURGLAR_ALARM_HORN_RELAY:
          expression: B13:2
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0485) vs the support map
          verified: false
          notes: >-
            GDS 'Burglar Alarm Horn Relay', the item after Rear Defogger Relay (B13:1). 0 in every
            capture.
        START_INHIBITOR_RELAY:
          expression: B13:3
          min: "0"
          max: "1"
          source: GDS Current Data list order (shop manual 0485) vs the support map
          verified: false
          notes: >-
            GDS 'Start Inhibitor Relay (Smartkey Except)', the item after Burglar Alarm Horn Relay.
            0 in every capture.


    22BC04:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      status: active
      period: 5000
      vehicle_states: [ALL]
      notes: >-
        8 data bytes. B05-B07 and B09 (B5 3F F4 EA, the support map), B11 (0) and B13:1 (1) are
        constant in all 410 captures, across every power state.
      source: Kia Niro EV WiCAN PR#716
      verified: false
      parameters:
        DOOR_LOCK_FL:
          expression: "B10:3"
          category: lock
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: 1 = locked.
          type: enum
          values:
            0: unlocked
            1: locked

        DOOR_LOCK_FR:
          expression: "B10:2"
          category: lock
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: 1 = locked.
          type: enum
          values:
            0: unlocked
            1: locked
        POWER_WINDOW_ENABLE_RELAY:
          expression: B10:0
          min: "0"
          max: "1"
          source: RE 2026-07-23 bit analysis; ignition cross-tab 2026-10-22
          notes: >-
            GDS 'Power Window Enable Relay'. Equals 22BC03 IGN1_SWITCH in 431 of 432 aligned rows,
            rising in the same poll; at 2 of 5 recorded power-offs it fell up to ~40 s after
            IGN1_SWITCH with the doors shut. Disabled as a near-duplicate of IGN1_SWITCH.
          enabled: false
        INTERIOR_LAMP_AUTOCUT_RELAY:
          expression: B13:6
          min: "0"
          max: "1"
          source: Same-payload cross-tab + event timeline 2026-10-22
          notes: >-
            GDS 'Interior Lamp Autocut Relay' (actuator BC1B): the leak-current autocut (LCAD) relay
            feeding the interior lamp, memory and multimedia fuses. 1 = doors unlocked or ignition
            on: equals (NOT DOOR_LOCK_FL) OR B10:0 in 406 of 410 captures, falling in the same poll
            as the lock. The 4 exceptions read 1 while locked with the ignition off: 3 at the end of
            a recording, and an 18 s pulse on 2026-08-15 10:11:03. Mirrored by BCM 22B005 B10:3 and
            VCU VCU_INVERTER_ARMED (kappa 0.98, n=358).
        DRL_DEDICATED_OUTPUT:
          expression: B12:5
          min: "0"
          max: "1"
          source: byte-value sweep + align 2026-10-29
          notes: >-
            GDS 'Dedicated DRL Output (Option)' (actuator BC18). 1 only with the ignition on, low
            beam off and the car not in Park: set in all 8 captures in D with the lamps off
            (2026-07-21), 0 in the 43 aligned rows in P with the lamps off and in all 65 with low
            beam on.
          enabled: true
        SEATBELT_RR:
          expression: B12:1
          min: "0"
          max: "1"
          source: OBDb Hyundai-IONIQ-Electric 22BC04 bix 54; IGPM support bitmap; opendbc CGW4 rear belt indicators (2026-10-29)
          notes: >-
            OBDb labels this bit (bix 54) the rear-right belt latched; the support map marks it as a
            signal. 0 in all 1753 captures (rear belts never exercised).
          enabled: false
        SEATBELT_RL:
          expression: B12:2
          min: "0"
          max: "1"
          source: OBDb Hyundai-IONIQ-Electric 22BC04 bix 53; IGPM support bitmap; opendbc CGW4 rear belt indicators (2026-10-29)
          notes: >-
            OBDb labels this bit (bix 53) the rear-left belt latched; the support map marks it as a
            signal. 0 in all 1753 captures (rear belts never exercised).
          enabled: false
        SEATBELT_RM:
          expression: B12:3
          min: "0"
          max: "1"
          source: OBDb Hyundai-IONIQ-Electric 22BC04 bix 52; IGPM support bitmap; opendbc CGW4 rear belt indicators (2026-10-29)
          notes: >-
            OBDb labels this bit (bix 52) the rear-middle belt latched; the support map marks it as
            a signal. 0 in all 1753 captures (rear belts never exercised).
          enabled: false

    22BC06:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      status: active
      period: 2500
      vehicle_states: [ALL]
      notes: >-
        8 data bytes. B10 the brake lamps, B11 the turn signals. B05=0xB4, B06=0x80, B07, B09 and
        B12 = 0 constant in all 587 captures.
      verified: true
      parameters:
        BRAKE_LIGHT:
          expression: B10
          min: "0"
          max: "255"
          source: "Decoded from live captures (2026-04-15)"
          notes: >-
            Not a boolean: B10 reads 0x00 released and 0x2D pressed (73 of 504 captures), plus 0x2C
            (3), 0x01 (1) and 0x02 (1). 0x2D sets bits 0, 2, 3 and 5 together. The 0x02 capture
            (2026-04-15) sets a bit outside the support map.
        LEFT_TURN_SIGNAL:
          expression: B11:0
          source: User-confirmed 2026-08-09 (1 = left, 2 = right)
          notes: "B11 is one 2-bit field: 0 off, 1 left, 2 right, never 3."
          enabled: true
        RIGHT_TURN_SIGNAL:
          expression: B11:1
          source: User-confirmed 2026-08-09 (1 = left, 2 = right)
          notes: "B11 is one 2-bit field: 0 off, 1 left, 2 right, never 3."
          enabled: true
        STOP_LAMP_LEFT:
          expression: B10:2
          min: "0"
          max: "1"
          source: RE 2026-07-23 bit analysis
          verified: false
          notes: >-
            GDS 'Stop Lamp Left' output (actuator BC2B). The right lamp is bit 3 and the
            high-mounted lamp bit 5 (BC2C, BC2D); neither changes without this bit. The pedal switch
            is bit 0 (BRAKE_PEDAL_SWITCH).
          enabled: true
        BRAKE_PEDAL_SWITCH:
          expression: B10:0
          min: "0"
          max: "1"
          source: GDS 'Stop Switch' (ScanDoc 22BC06 byte 0 bit 0); canair align 2026-10-30
          verified: false
          notes: >-
            GDS 'Stop Switch'. B10 reads 0x01 once (switch closed, lamps not yet lit) and 0x2D when
            pressed. 3 captures on 2026-08-09 read 0x2C (all stop lamps lit, switch bit clear) while
            driving at 43-77 km/h.
          enabled: true

    22BC01:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        9 bytes: 40 00 00 00 00 02 in all 385 captures, across all power states (24 older ones carry
        0xAA frame padding).
    22BC02:
      status: draft
      vehicle_states: [ALL]
      notes: 4 data bytes, all 0 in every one of 297 captures.
    22BC05:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      status: draft
      vehicle_states: [ALL]
      notes: >-
        8 data bytes. B05=0x7F, B06=0x11 and B07=0x20 in all 421 captures. B10 holds the turn-lamp
        outputs (0x50 left, 0xA0 right, 0xF0 both at the fob-unlock flash), B11:3 the trunk
        indicator and B11:7 passenger seat occupancy.
      source: canair align cross-tab + investigate --events 2026-10-21
      min: "0"
      max: "1"
      verified: false
      parameters:
        LUGGAGE_LAMP_OUTPUT:
          expression: B11:3
          source: canair correlate --find-mirrors + investigate --events 2026-07-24
          notes: >-
            GDS/ScanDoc 'Luggage Compartment Lamp' (actuator BC1C). Set at trunk open; 1 in 3 of 421
            captures.
        TURN_LAMP_LF:
          expression: B10:4
          notes: >-
            GDS 'LF turn signal output'; flashes, so a poll can catch it off. Over 380 aligned rows
            with 22BC06: set in 18 of 23 left-signal rows, never with the right signal or neither.
            Both sides set (B10=0xF0) only at the fob-unlock flash.
        TURN_LAMP_RF:
          expression: B10:5
          notes: >-
            GDS 'RF turn signal output'; flashes, so a poll can catch it off. Over 380 aligned rows
            with 22BC06: set in 20 of 23 right-signal rows, never with the left signal or neither.
            Both sides set (B10=0xF0) only at the fob-unlock flash.
        TURN_LAMP_LR:
          expression: B10:6
          source: canair decode --dump-bytes 2026-10-21
          notes: >-
            GDS 'LR turn signal output', a separate output with its own fault detection. Equals
            TURN_LAMP_LF in every capture (B10 is only ever 0x00, 0x50, 0xA0 or 0xF0). Disabled as
            redundant.
          enabled: false
        TURN_LAMP_RR:
          expression: B10:7
          source: canair decode --dump-bytes 2026-10-21
          notes: >-
            GDS 'RR turn signal output', a separate output with its own fault detection. Equals
            TURN_LAMP_RF in every capture (B10 is only ever 0x00, 0x50, 0xA0 or 0xF0). Disabled as
            redundant.
          enabled: false
        PASSENGER_SEAT_OCCUPIED:
          expression: B11:7
          source: canair correlate --find-mirrors --bits + investigate --events 2026-10-21
          notes: >-
            Front passenger seat occupied. Superset of SEATBELT_FR over 314 aligned rows: set in all
            11 buckled rows plus 4 unbuckled, never clear while buckled. On 2026-08-08 it set when
            the passenger door closed and cleared 20 s after the belt was unbuckled.
        LOW_BEAM_SWITCH:
          expression: B12:2
          source: canair align cross-tab 2026-10-21; OBDb label added 2026-10-27
          notes: >-
            ScanDoc 'Right Low Beam Button'; OBDb reads this byte as HL_SW 'Headlight switch' (0 or
            4, equal to this bit in every capture). Set only with the tail and low-beam outputs on
            and IGN1_SWITCH = 1 (23 rows); 0 with the lamps still on after ignition off (6 rows) and
            with them off.
    22BC08:
      status: ignored
      vehicle_states: [ALL]
      notes: NRC 0x31 (requestOutOfRange).
      parameters: {}

    22BCFD:
      status: draft
      vehicle_states: [READY]
      notes: >-
        17 data bytes (20 B reassembled): FF FF FF FF at B05-B07/B09, then 0C 0E 16 2B 3F 26 36 at
        B10-B15/B17 and zeros to the end. Identical in all 1,407 reads from 2026-10-22 to
        2026-10-30, across READY, CHARGING, PARKED and SLEEP: stored data, not a live value. Meaning
        unknown (research/IGPM_FINDINGS.md section 6.4). BCFD and BCFF are the only DIDs in
        BC08-BCFF that answer.
    22BCFF:
      parameters:
        IGPM_BCFF_TAG:
          expression: "[B04:B07]"
          type: ascii
          source: canair scan 22 BC20-BCFF 2026-10-22
          verified: false
          notes: ASCII '1090' in every read; identity sw_version is 109.
          enabled: false
      status: draft
      vehicle_states: [READY]
      notes: 4 ASCII data bytes. Highest answering DID in the BC family.

  # ─── IOControl (service 2F) ──────────────────────────────────────────
  # All require the extended session (10 03). Actuators release when the session ends.
  iocontrol:
    BC01:
      vehicle_states: [ALL]
      label: Low beam
      verified: true
      true: "2FBC0103"
      false: "2FBC0100"
      status_param: LOW_BEAM

    BC02:
      vehicle_states: [ALL]
      label: High beam
      verified: true
      true: "2FBC0203"
      false: "2FBC0200"
      status_param: HIGH_BEAM

    BC03:
      vehicle_states: [ALL]
      label: Front fog light
      verified: true
      true: "2FBC0303"
      false: "2FBC0300"
      notes: "No visible effect: this trim has no front fog lamps."

    BC04:
      vehicle_states: [ALL]
      label: Tail / rear light
      verified: true
      true: "2FBC0403"
      false: "2FBC0400"
      status_param: TAIL_LIGHTS

    BC05:
      vehicle_states: [ALL]
      label: Tail lamp output (interior)
      verified: true
      true: "2FBC0503"
      false: "2FBC0500"
      notes: >-
        GDS 'Tail Lamp Output (Interior)': the instrument illumination circuit. Lights the blue
        instrument LEDs and the green dash indicator.
      status_param: TAIL_LAMP_INTERIOR

    BC07:
      vehicle_states: [ALL]
      label: Burglar alarm horn relay
      verified: true
      true: "2FBC0703"
      false: "2FBC0700"
      notes: "GDS 'Burglar Horn Relay': the alarm horn. Loud."

    BC08:
      vehicle_states: [ALL]
      label: Rear fog light
      verified: true
      true: "2FBC0803"
      false: "2FBC0800"

    BC09:
      vehicle_states: [ALL]
      label: Trunk unlock
      verified: true
      true: "2FBC0903"
      false: "2FBC0900"
      status_param: TRUNK_OPEN
      notes: Releases the latch only (no lift motor). Sounds the alarm if the car is locked.

    BC0A:
      vehicle_states: [ALL]
      label: Start inhibit relay (option)
      verified: false
      true: "2FBC0A03"
      false: "2FBC0A00"
      notes: GDS 'Start Inhibit Relay (Option)' by ScanDoc numbering. No visible effect in ACC.

    BC0C:
      vehicle_states: [ALL]
      label: Rear defogger relay
      verified: true
      true: "2FBC0C03"
      false: "2FBC0C00"
      notes: "Rear window heater. ACC: audible relay click; lights the button on the HVAC controls."

    BC10:
      vehicle_states: [ALL]
      label: Door LOCK all
      verified: true
      true: "2FBC1003"
      false: "2FBC1000"
      status_param: DOOR_LOCK_FL
      notes: Locks the doors only; does not arm the alarm.

    BC11:
      vehicle_states: [ALL]
      label: Door UNLOCK all
      verified: true
      true: "2FBC1103"
      false: "2FBC1100"
      status_param: DOOR_LOCK_FL
      notes: "Does not disarm the alarm: opening a door then sounds the horn."

    BC12:
      vehicle_states: [ALL]
      label: Driver door unlock relay (option)
      verified: false
