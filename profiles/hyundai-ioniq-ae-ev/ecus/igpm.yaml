  dtcs:
    source: Ioniq Electric 2017 service manual, Integrated Gateway Power Module diagnosis (EV)
    source_links:
      - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Accessories%20%26%20Equipment/Communication%20Devices/Integrated%20Gateway%20Power%20Module%20Diagnosis%20%28EV%29/
    verified: false
    B1101:
      description: Battery voltage high
      causes: charging system
      notes: Ignition supply above 19 V for 3 s, from 5 s after ignition on.
    B1102:
      description: Battery voltage low
      causes: charging system
      notes: Ignition supply below 6.5 V for 3 s, from 5 s after ignition on.
    B1581:
      description: Ignition switch signal error
      causes: BCM ON/START input open, shorted to battery or to ground
      notes: >-
        The gateway's ignition input disagrees for 5 s with the ignition state in the BCM's B-CAN
        data.
    B1602:
      description: CAN line error (B-CAN)
      causes: B-CAN high or low shorted to battery or ground, open, or shorted together
      notes: One B-CAN line failed while the bus still works; 9-16 V, 2 s.
    B1603:
      description: CAN bus off (B-CAN)
      causes: B-CAN high and low shorted together to battery or ground
      notes: B-CAN communication impossible; 9-16 V, 2 s.
    B1604:
      description: CAN time-out, BCM
      causes: BCM CAN lines open or poor connection, BCM power supply
      notes: No B-CAN message from the BCM for 10 s.
    B1605:
      description: CAN time-out, driver door module
      causes: driver door module CAN lines open or poor connection, driver door module power supply
      notes: No B-CAN message from the driver door module for 10 s.
    B1606:
      description: CAN time-out, assist door module
      causes: assist door module CAN lines open or poor connection, assist door module power supply
      notes: No B-CAN message from the assist door module for 10 s.
    B1607:
      description: CAN time-out, power seat module
      causes: power seat module CAN lines open or poor connection, power seat module power supply
      notes: No B-CAN message from the power seat module for 10 s.
    B1621:
      description: ECU failure
      causes: gateway
      notes: EEPROM read or write error inside the gateway.
    B1644:
      description: CAN time-out, airbag control unit (ACU)
      causes: >-
        airbag control unit (ACU) CAN lines open or poor connection, airbag control unit (ACU) power
        supply
      notes: No P-CAN message from the airbag control unit (ACU) for 10 s.
    B1648:
      description: CAN time-out, occupant detection (ODS)
      causes: >-
        occupant detection (ODS) CAN lines open or poor connection, occupant detection (ODS) power
        supply
      notes: >-
        No P-CAN message from the occupant detection (ODS) for 10 s. The manual's enable condition
        says B-CAN.
    B164D:
