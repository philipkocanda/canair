        relay; neither has been actuated with the car asleep or tied to a load. BC12-BC14 are not
        candidates (driver-door unlock, deadlock and power-window relays; BC13 deadlocks the doors).
        The VCU-wake side of the BC44 test is in 'who wakes the VCU for the parked 12 V top-up'.
      what_to_test:
        - With the car asleep, unplugged and stationary, fob inside, open an IGPM session and switch BC44 on with a second person at the engine-bay PCB block listening for the click. While it is on, read BMS 2101, VCU 2101 and HVAC 220100 and note whether any starts to answer without ACC. Release BC44 before anything else.
        - In ACC, switch BC1B on and off and note which loads lose power (it turned the dome light off on 2026-04-15).
      capture_protocol: >-
        canair read 'session IGPM --wake' 'iocontrol IGPM BC44' 'sleep 3' 'query BMS:2101' 'query
        VCU:2101' 'query HVAC:220100' 'iocontrol IGPM BC44 --off' --save --label 'IGPM BC44 IG3
        test' --state SLEEP; only after confirming the car is parked and safe.

