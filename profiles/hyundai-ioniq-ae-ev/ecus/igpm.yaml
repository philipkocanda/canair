    - type: decode
      target: gateway frame forwarding between MM-CAN, P-CAN and C-CAN
      status: captured
      priority: P2
      vehicle_states: [READY, CHARGING]
      created: "2026-10-30"
      updated: "2026-10-30"
      result: >-
        The IGPM routes signals, not frames. It builds each frame as the destination bus's message
        table defines it and sends it on its own schedule, so source and destination IDs are
        unrelated and one ID can name different frames on different buses (0x55C, 0x57A, 0x57B,
        0x5D0, 0x5D7). MM-CAN carries multi-byte signals high byte first (Motorola) and P-CAN and
        C-CAN low byte first (Intel), so every multi-byte signal is byte-swapped when it crosses.
        Fields that fit inside one byte keep their bits, which is why the head unit's schedule and
        clock frames cross unchanged.
      notes: >-
        Byte order: opendbc's Hyundai M-CAN DBC is all big-endian and its C-CAN DBC all
        little-endian; the EU head unit's MM-CAN parsers and the US telematics P-CAN parsers agree.
        P-CAN to MM-CAN, joined by Hyundai signal name: pack voltage 0x5D8 d6-d7 -> 0x55D B0-B1,
        swapped; quick-charge time left 0x491 d0-d1 -> 0x56A B3-B4, swapped; range 0x200 (10 bits
        from bit 15) -> 0x56A (9 bits); A/C compressor power 0x5F5 -> 0x56A B5-B6; SOC 0x5D8 d1 ->
        0x55E B2; BMS fault and standard-charge flags 0x5D8 d0 bits 1-3 -> 0x55E B1 bits 1-3;
        climate permission 0x57B d1.1 -> 0x55C B0.7. Copied unchanged: VCU 0x579 d0-d4 -> 0x56B, VCU
        0x57A -> 0x56C, climate unit 0x5CC -> 0x132. MM-CAN to P-CAN: 0x54F -> 0x567, 0x57B -> 0x55C
        and 0x57A -> 0x588 byte for byte; HU_DATC_PE_00 0x1C0 -> 0x5D3 keeps only byte 4 bits 0-5,
        moved to byte 0 (see the AVN research entry). C-CAN to P-CAN (EV_CP1/2/5 in
        signals/body.yaml): EV_CP1 0x5D0 is the cluster's odometer frame (CLU12); EV_CP2 0x450 the
        cluster's displayed speed (CLU11, 0.5 km/h, one byte earlier); EV_CP5 0x578 a chassis
        warning summary (SCC, LDWS, MDPS and TPMS lamps, low fuel, drive-mode switch). On MM-CAN,
        0x5D0 is the cluster's CLU_HU_P_00 (speed, SOC, motor torque), not the odometer. Senders: 19
        P-CAN IDs hold a fixed phase to CGW1 0x541 over the 2022 trace (0x414, 0x450, 0x462, 0x471,
        0x4FE, 0x541, 0x553, 0x55C, 0x55F, 0x561, 0x567, 0x578, 0x588, 0x5B3, 0x5D0, 0x5D3, 0x5D4,
        0x5DF, 0x5EC); 0x2B0 (SAS11) is not on the gateway's clock and has 4-5 times the period
        jitter of native frames. Diagnostic frames (0x7DF, 0x7Ex) cross with ID and bytes kept. CGW1
        0x541 and CGW2 0x553 reach P-CAN; CGW4 0x559, GW_DDM_PE 0x521 and GW_IPM_PE_1 0x522 are
        absent from all three uhi22 P-CAN logs. Unproven on the car: no simultaneous MM-CAN and
        P-CAN capture exists.
      sources:
        - "ioniq-avn-fw EU head-unit firmware: com.lge.ivi GwEvP02-08, GwEvPe00 and HuDatcPe00 parse layouts; MICOM 7AEe EV getters 0x846DE-0x84790 (2026-10-30)"
        - "US telematics firmware AEEV.USA.SOP.V108: com.infobank Can2ACCANCsmEV P-CAN parsers and the Can2AAEEVMessage ID table (2026-10-30)"
        - opendbc hyundai_2015_ccan.dbc and hyundai_2015_mcan.dbc (commaai, MIT)
        - "uhi22 Ioniq28Investigations P-CAN logs (2025) and IoniqMotorCAN ioniq2018_motorCAN_500k_HPC.asc (2022): clock-phase sender attribution and value checks (2026-10-30)"
      what_to_test:
        - "Tap MM-CAN and P-CAN at the same time in READY, then while AC charging: 0x55D B0-B1 should equal 0x5D8 d6-d7 with the bytes swapped, and 0x56A B3-B4 should equal 0x491 d0-d1 swapped."
        - "On the same capture: MM-CAN 0x56B bytes 0-4 should equal P-CAN 0x579, 0x56C should equal 0x57A, and 0x132 should equal 0x5CC."
        - "Tap C-CAN as well: 0x2B0 on P-CAN should repeat the C-CAN copy a fixed short time later; look for the sources of the gateway-clocked 0x414, 0x462, 0x471 and 0x4FE."
      capture_protocol: >-
        Two adapters logging at the same time, one per tapped bus. Import each log with canair
        import can and line the frames up by timestamp.
