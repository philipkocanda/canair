# ─── BMS (Battery Management System) ─────────────────────────────────
#
# 21xx live-data reads work in the default session; 10 81 unlocks no extra data.
BMS:
  tx_id: 0x7E4
  can_bus: [P-CAN]
  identity:
    description: Battery Management System
    part_number: "37501-G7250" # Battery Assembly Part no.
    ecu_id: "AEEV__ BMS"  # KWP2000 1A90
    fw_version: "VER.2.3"  # KWP2000 1A91
    sw_id: CGBMSE305AE1000A  # KWP2000 1A8C
    calibration: "4604" # matches "BMS ROM ID" printed on the pack (KWP2000 1A8D)
    # BMS ROM IDs by production year:
    # 4604 = verified 2017-01 until 2017-11
    # 4804 = verified 2018-04 until 2018-08
    # 4824 = verified 2018-11 until 2019-06
    id_protocol: KWP2000  # 1Axx
    notes: >-
      1A80 firmware build date reads 2008-07-09. Air-cooled pack: a BMS-controlled fan in the trunk
      draws cabin air in under the middle rear seat and out through the right rear wheel well.
  revisions:
    kwp:
      identity: {id_protocol: KWP2000}
      fingerprints:
        - {responds: "1A90"}
        - {identity: {calibration: "4604"}}
        - {identity: {calibration: "4804"}}
        - {identity: {calibration: "4824"}}
    uds:
      identity: {id_protocol: UDS}
      fingerprints:
        - {responds: "22F187"}
  vehicle_states: [IG3]
  pids:
    2101:
      response_frames: 9
      status: active
      period: 1000
      revisions: [kwp]
      vehicle_states: [IG3]
      verified: true
      parameters:
        SOC_BMS:
          expression: "B09/2"
          unit: "%"
          ha_class: battery
          min: "0"
          max: "100"
          notes: Raw BMS state of charge (not display-adjusted; see SOC_DISP).

        BATTERY_POWER:
          expression: "(([B18:B19]/10) * (((S15 << 8) | B17)/10)) / 1000"
          unit: kW
          ha_class: power
          notes: Negative = charging.
          send_to: wican/ioniq/stream/battery_power

        BATTERY_VOLTAGE:
          expression: "[B18:B19]/10"
          unit: V
          ha_class: voltage
          min: "200"
          max: "450"

        BATTERY_CURRENT:
          expression: "((S15 << 8) | B17)/10"
          unit: A
          ha_class: current
          min: "-300"
          max: "300"
          notes: >-
            Signed 16-bit: high byte B15 signed, low byte B17 unsigned (B16 is a PCI byte). Negative
            = charging. Captures reach -174 A (DC charging) and +276.7 A (hard acceleration).

        MAX_CELL_VOLTAGE:
          expression: "B30*0.02"
          unit: V
          ha_class: voltage
          min: "0"
          max: "10"

        MIN_CELL_VOLTAGE:
          expression: "B33*0.02"
          unit: V
          ha_class: voltage
          min: "0"
          max: "10"

        AUX_BATTERY_VOLTAGE:
          expression: "B37*0.1"
          unit: V
          ha_class: voltage
          min: "0"
          max: "128"
          notes: "12V auxiliary battery"

        BMS_MAIN_RELAY:
          expression: "B14:0"
          source: "ITStromer community sheet (j:0 = BMS Relay) + captures"
          notes: >-
            HV main relay closed. 0 only with B14 = 0x00, 0x20 or 0x40; 1 during a parked 12 V
            top-up.

        AC_CHARGER_CONNECTED:
          expression: B14:5
          ha_class: plug
          notes: >-
            Set while an AC cable is plugged in, whether or not the EVSE delivers energy; clear
            during a CCS fast charge. Backs the PLUGGED state predicate.
          source: canair analysis 2026-08-08 (CCS DCFC + scheduled home-EVSE wait)
        CHARGING_DC:
          expression: B14:6
          ha_class: plug
          notes: >-
            Set during DC fast charging (2026-08-08 CCS session, n=54); clear during AC charging.
            OBDb names this bit RAPID_CHG_PORT for the Ioniq Electric, Soul EV and Niro EV.
          source: canair analysis 2026-08-08 50 kW DCFC session (first real rapid charge on this car); OBDb cross-reference 2026-10-27
        CHARGING:
          expression: "B14:7"
          ha_class: battery_charging

        BATTERY_FAN_STATUS:
          expression: "B35"
          min: "0"
          max: "9"
          source: Ioniq shop manual cooling fan inspection (shop:0730); 28 kWh captures 2026
          notes: >-
            Fan level 0-9. The manual gives the duty and speed per level: 1 20 % 1200 rpm, 2 28 %
            1440, 3 38 % 1740, 4 44 % 1920, 5 52 % 2170, 6 60 % 2450, 7 70 % 2600, 8 80 % 2800, 9 90
            % 3000. Levels 0-4 seen.

        BATTERY_FAN_FEEDBACK:
          expression: "B36"
          unit: "Hz"
          source: Ioniq shop manual cooling fan inspection (shop:0730); 28 kWh captures 2026
          notes: >-
            Fan tachometer. Modal reading per level: 42 Hz at 1, 50 at 2, 60 at 3, 66 at 4, about
            the manual's speed per level divided by 29.

        BATTERY_INLET_TEMP:
          expression: "S29"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"

        BATTERY_MAX_TEMP:
          expression: "S20"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"

        BATTERY_MIN_TEMP:
          expression: "S21"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"

        MODULE_1_TEMP:
          expression: "S22"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"

        MODULE_2_TEMP:
          expression: "S23"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"

        MODULE_3_TEMP:
          expression: "S25"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"

        MODULE_4_TEMP:
          expression: "S26"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"

        MODULE_5_TEMP:
          expression: "S27"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"

        MAX_CELL_VOLTAGE_NO:
          expression: "B31"
          notes: "Cell number with max voltage"

        MIN_CELL_VOLTAGE_NO:
          expression: "B34"
          notes: "Cell number with min voltage"

        CUMULATIVE_ENERGY_CHARGED:
          expression: "((B47<<24)|(B49<<16)|(B50<<8)|B51)/10"
          unit: kWh
          ha_class: energy
          min: "0"
          notes: Lifetime total, 0.1 kWh per LSB.

        CUMULATIVE_ENERGY_DISCHARGED:
          expression: "((B52<<24)|(B53<<16)|(B54<<8)|B55)/10"
          unit: kWh
          ha_class: energy
          min: "0"
          notes: Lifetime total, 0.1 kWh per LSB.

        CUMULATIVE_CURRENT_CHARGED:
          expression: "((B38<<24)|(B39<<16)|(B41<<8)|B42)/10"
          unit: Ah
          min: "0"
          source: "ImHex pattern (u32 @ ISO-TP 0x20) — PCI-corrected"
          notes: Lifetime total, 0.1 Ah per LSB. B40 is a PCI byte.

        CUMULATIVE_CURRENT_DISCHARGED:
          expression: "((B43<<24)|(B44<<16)|(B45<<8)|B46)/10"
          unit: Ah
          min: "0"
          source: "ImHex pattern (u32 @ ISO-TP 0x24) — PCI-corrected"
          notes: Lifetime total, 0.1 Ah per LSB.

        OPERATING_TIME:
          expression: "[B57:B60]/3600"
          unit: "h"
          ha_class: duration
          min: "0"
          max: "1000000"
          source: "CSS Electronics DBC (OperatingTime m257 : 399|32@0+, scale 1/3600) + live verification"
          source_links:
            - "CSS Electronics/ev-data-pack-v10/electric_cars/dbc_files/can1-hyundai-kia-uds-v2.4.dbc"
          notes: 32-bit unsigned seconds, shown in hours.

        DRIVE_MOTOR_SPEED:
          expression: "[S65:S66]"
          unit: RPM
          min: "-500"
          max: "8000"
          notes: Signed 16-bit, RPM. r=0.997 vs MCU:2102:MCU_MOTOR_RPM (n=1149, slope 0.986).
          source: canair analysis 2026-08-08 long drive + DCFC (cross-ECU vs MCU 2102)

        ISOLATION_RESISTANCE:
          expression: (B69<<8)|B70
          unit: "kΩ"
          min: "300"
          max: "1000"
          notes: Reads 1000 kΩ (0x03E8) in every capture, in every state.
          source: canair decode --dump-bytes 2026-10-22

        DEBUG_BMS_STATE_FLAGS:
          expression: B14
          source: AutoPID config (on device); bits via ITStromer community sheet, ioniq-ev-bms xls and the 2026-08-08 DCFC session
          verified: false
          notes: >-
            Whole B14 byte. Values seen: 0x00 ignition off, unplugged; 0x03 READY or 12 V top-up;
            0x20 AC plugged, contactors open; 0x23 AC plugged, contactors closed, not charging; 0x40
            CCS plugged before the contactors close (~30 s); 0xA3 AC charging; 0xC3 DC charging.
            b2-b4 never set, including two DC fast charges.

        AVAIL_CHARGE_POWER_MIRROR:
          expression: "[B10:B11]/100"
          min: "0"
          max: "655"
          source: OBDb Hyundai-IONIQ-Electric (7E4 21 01 bix 40) + canair align 2026-10-27
          verified: false
          notes: "Mirror of 2105 AVAIL_CHARGE_POWER: 5448 of 5467 aligned rows equal, r=1.000."
          unit: kW
          ha_class: power
          enabled: false
        BMS_INVERTER_CAPACITOR_VOLTAGE:
          expression: "[B62:B63]"
          min: "0"
          max: "450"
          source: OBDb Hyundai-IONIQ-Electric (7E4 21 01 bix 408) + canair align 2026-10-27
          verified: false
          notes: >-
            Unsigned 16-bit, volts. r=0.986 vs VCU:2102:VCU_DCLINK_VOLTAGE, slope 1.00. Reads 0 to a
            few volts with the main relay open.
          unit: V
          ha_class: voltage
          enabled: true
        BMS_CONTROLLABLE_STATE:
          expression: B14:1
          source: GDS list order (shop manual 0657); 2026-08-08 DCFC analysis
          notes: >-
            GDS name BMS Controllable State. Equals BMS_MAIN_RELAY (B14:0) in every capture,
            including DC fast charges. Disabled as a duplicate.
          enabled: false
        AVAIL_DISCHARGE_POWER_MIRROR:
          expression: "[B12:B13]/100"
          unit: kW
          ha_class: power
          min: "0"
          max: "655"
          source: OBDb Hyundai-IONIQ-Electric (7E4 21 01 bix 56) + canair align 2026-10-27
          verified: false
          notes: >-
            Mirror of 2105 AVAIL_DISCHARGE_POWER: 5467 of 5467 aligned rows equal. Mostly 98 kW
            (range 91.66-98 kW).
          enabled: false
        DRIVE_MOTOR_SPEED_MIRROR:
          expression: "[S67:S68]"
          unit: RPM
          min: "-500"
          max: "8000"
          source: OBDb Hyundai-IONIQ-Electric (7E4 21 01 bix 440, DRIVE_MOTOR_SPD_2) + canair align 2026-10-27
          verified: false
          notes: Identical to DRIVE_MOTOR_SPEED [S65:S66] in all 12069 rows.
          enabled: false
        MCU_CONTROLLABLE:
          expression: B61:2
          source: GDS list order (shop manual 0647); B61 cross-tab 2026-10-27
          verified: false
          notes: >-
            GDS name MCU Controllable, the third of four B61 flags between OPERATING_TIME and
            BMS_INVERTER_CAPACITOR_VOLTAGE. 1 while READY and through an AC charge begun while
            READY; 0 in charges begun with the car off (AC and DC) and in a 12 V top-up. Falls when
            the HV contactors open at the end of a charge while IGPM:22BC03:IGN1_SWITCH stays 1.
            OBDb calls it BMS ignition (bix 405).
          enabled: true
          min: "0"
          max: "1"
        HCU_READY:
          expression: B61:3
          min: "0"
          max: "1"
          source: GDS list order (shop manual 0647); B61 cross-tab 2026-10-27
          notes: >-
            GDS name HCU Ready. Equals VCU:2101:VCU_IG3_ON in 10845 of 10846 aligned rows. 0 (B61 =
            0x01) only after a charge ends or the car is switched off. Disabled as a duplicate of
            VCU_IG3_ON.
          enabled: false
        MCU_READY:
          expression: B61:0
          min: "0"
          max: "1"
          source: GDS Current Data list order, Ioniq shop manual pages 0647 and 0657
          verified: false
          notes: GDS name MCU Ready. 1 in every capture, including after power-off.
        MCU_MAIN_RELAY_OFF_REQUEST:
          expression: B61:1
          min: "0"
          max: "1"
          source: GDS Current Data list order, Ioniq shop manual pages 0647 and 0657
          verified: false
          notes: GDS name MCU Main Relay Off Request. 0 in every capture.
        BMS_WARNING:
          expression: B14:2
          min: "0"
          max: "1"
          source: GDS Current Data list order, Ioniq shop manual pages 0647 and 0657
          verified: false
          notes: GDS name BMS Warning. 0 in every capture.
        BMS_FAULT:
          expression: B14:3
          min: "0"
          max: "1"
          source: GDS Current Data list order, Ioniq shop manual pages 0647 and 0657
          verified: false
          notes: GDS name BMS Fault. 0 in every capture.
        BMS_WELD_FLAG:
          expression: B14:4
          min: "0"
          max: "1"
          source: GDS Current Data list order, Ioniq shop manual pages 0647 and 0657
          verified: false
          notes: GDS name BMS Weld Flag. 0 in every capture.


    2105:
      response_frames: 7
      status: active
      period: 10000
      revisions: [kwp]
      vehicle_states: [IG3]
      verified: true
      parameters:
        AVAIL_CHARGE_POWER:
          expression: "[B22:B23]/100"
          unit: kW
          ha_class: power
          notes: >-
            98.0 kW throughout DC fast charging: the EVMaximumPowerLimit the car sends a charger
            (broadcast 0x59E bytes 6-7; uhi22 charger logs).

        AVAIL_DISCHARGE_POWER:
          expression: "[B25:B26]/100"
          unit: kW
          ha_class: power

        BATTERY_VOLTAGE_DEVIATION:
          expression: "B27*0.1"
          unit: V
          ha_class: voltage

        QUICK_CHARGING_NORMAL_STATUS:
