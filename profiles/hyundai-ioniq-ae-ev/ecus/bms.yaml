          min: "-128"
          max: "128"

        SOH:
          expression: "[B33:B34]/10"
          unit: "%"
          min: "0"
          max: "105"
          notes: State of health.

        MAX_DETERIORATION_CELL_NO:
          expression: "B35"

        MIN_DETERIORATION:
          expression: "[B36:B37]/10"
          unit: "%"

        MIN_DETERIORATION_CELL_NO:
          expression: "B38"

        SOC_DISP:
          expression: "B39/2"
          unit: "%"
          ha_class: battery
          min: "0"
          max: "100"
          notes: "Display SOC (what the dashboard shows)"

        BMS_DCFC_TICK_COUNTER:
          expression: B42
          source: 2026-08-08 DCFC session byte-diff
          verified: false
          notes: >-
            8-bit wrapping counter, ~0.52 per second, while CHARGING_DC is set. Otherwise holds at
            41 (occasionally 49), including during AC charging.
          enabled: true
        BMS_2105_B41:
          expression: B41
          source: 2026-08-08 DCFC session byte-diff
          verified: false
          notes: >-
            0 except during DC fast charging: 13 at onset, 14 after ~30 s, 15 after ~9 min
            (2026-08-08).
          enabled: true
        MAX_INTERNAL_RESISTANCE:
          expression: "[B9:B10]/100"
          unit: mOhm
          source: GDS Current Data list order, Ioniq shop manual pages 0661, 0663 and 0700
          verified: false
          notes: >-
            GDS shows 0.00 mOhm; 0 in every capture (5514), so scale and byte order are unconfirmed.
        MAX_INTERNAL_RESISTANCE_CELL_NO:
          expression: B11
          source: GDS Current Data list order, Ioniq shop manual pages 0661, 0663 and 0700
          verified: false
          notes: GDS shows 0; 0 in every capture.
        AVG_INTERNAL_RESISTANCE:
          expression: "[B12:B13]/100"
          unit: mOhm
          source: GDS Current Data list order, Ioniq shop manual pages 0661, 0663 and 0700
          verified: false
          notes: >-
            GDS shows 0.00 mOhm; 0 in every capture (5514), so scale and byte order are unconfirmed.
        AIRBAG_HWIRE_DUTY:
          expression: B29
          unit: "%"
          min: "0"
          max: "100"
          source: GDS list order (shop manual 0661, 0663, 0700); OBDb bix 176
          verified: false
          notes: >-
            GDS name Airbag H/wire Duty, listed between Quick Charging Normal Status and Heat 1
            Temperature; GDS shows 80 %. Follows the ignition: 100 in 1555 of 1557 rows with IGPM
            IGN1_SWITCH = 0, 75-85 in 119 of 120 with it on (the exceptions are transition rows).
            Within READY it steps between 75, 80 and 85 with no link to temperature, SOC, current or
            12 V.
