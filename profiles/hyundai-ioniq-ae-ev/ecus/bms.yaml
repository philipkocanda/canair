      sources:
        - OBDb Hyundai-IONIQ-Electric signalset (pelican.clutch.engineering ioniq-electric parameters), compared 2026-10-27
      what_to_test:
        - Do any 22 01xx DIDs answer? If yes, register with add-pid and compare against the 21xx pages
      capture_protocol: >-
        canair scan BMS --service 22 --range 0100-0114 --save, then E001-E002 and E00A, in READY
    - type: decode
      target: 2105 B29 airbag hard-wire duty
      status: done
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-27"
      updated: "2026-11-01"
      result: >-
        100 % with the ignition off, 75-85 % with it on (IGN1_SWITCH cross-tab, 1676 aligned rows).
        Consistent with the airbag unit's hard-wired crash-signal output, a PWM line it drives only
        on IGN1; the line reads 100 % when undriven.
      notes: >-
        Registered as AIRBAG_HWIRE_DUTY: the GDS list (shop manual pages 0661, 0663, 0700) places
        Airbag H/wire Duty between Quick Charging Normal Status and Heat 1 Temperature, at 80 %. B29
        takes only 75, 80, 85 and 100 across 5478 captures: 100 in some sessions, 75-85 in others.
        What it drives is unknown.
      sources:
        - OBDb Hyundai-IONIQ-Electric signalset (pelican.clutch.engineering ioniq-electric parameters), compared 2026-10-27
      what_to_test:
        - What separates the 100 sessions from the 75-85 sessions (date, state, temperature)?
    - type: verify
      target: 2105 BATTERY_VOLTAGE_DEVIATION scale
      status: captured
      priority: P3
      vehicle_states: [CHARGING]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: >-
        Ours is B27*0.1 V, OBDb uses 0.02 V per count, and GDS shows the value to two decimals (0.00
        V, shop manual pages 0661, 0663), which fits 0.02 V. Raw B27 is only ever 0 or 1, so the
        scale is undetermined; needs a capture with a larger cell imbalance.
      sources:
        - OBDb Hyundai-IONIQ-Electric signalset (pelican.clutch.engineering ioniq-electric parameters), compared 2026-10-27
      what_to_test:
        - Find a capture with raw B27 above 1 and compare against max minus min cell voltage from 2102-2104
    - type: scan
      target: 01 01, 01 21, 01 30, 01 31, 01 5B
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: >-
        OBDb lists standard Mode 01 PIDs answering from 0x7E4 on 2017-2018 cars (monitor status, MIL
        distance, warm-ups, distance since clear), and 01 5B (hybrid battery pack remaining life) on
        2018. No Mode 01 captures exist. 01 5B would be a third SOC source next to SOC_BMS and
        SOC_DISP.
      sources:
        - OBDb Hyundai-IONIQ-Electric signalset and its tests/test_cases (2017/2018 command_support), compared 2026-10-27
      capture_protocol: canair read BMS:015B BMS:0101 BMS:0121 BMS:0130 BMS:0131 --save in READY
    - type: verify
      target: 2101 B14 bits 1-4 — dealer-tool (GDS) names
      status: pending
      priority: P3
      vehicle_states: [READY, CHARGING]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: >-
        The Ioniq shop manual's GDS Current Data list (pages 0657, 0661) orders the B14 flags BMS
        Main Relay ON Status, BMS Controllable State, BMS Warning, BMS Fault, BMS Weld Flag,
        matching the Kia Soul EV GDS sheet's b0-b4; registered as BMS_CONTROLLABLE_STATE,
        BMS_WARNING, BMS_FAULT, BMS_WELD_FLAG. On this car b1 equals b0 and b2-b4 are never set in
        12079 captures (READY, 12 V top-up, AC and DC charging). In OBDb test responses b2-b4 are
        never set, and b1 is set without b0 (0x02) in two hybrids (Elantra 2023, Niro 2020), so b1
        is a separate flag.
      sources:
        - Kia Soul EV GDS sheet (kia-soul-ev-can-messages.xlsx, BMC rows 19-23)
        - ioniq-ev-bms-2101-2105.xls (same bit list, names marked '?')
        - canair B14 value enumeration 2026-10-27 (decode BMS 2101 --dump-bytes)
        - OBDb Hyundai/Kia/Genesis signalsets and tests/test_cases (data byte 9 of 2101/220101), checked 2026-10-27
      what_to_test:
        - "b1: does it lag or lead b0 during contactor close (switch-on, AC or DC charge start) or clear while b0 stays set (power derate, fault)?"
        - "b2/b3: do they set alongside a BMS DTC (canair dtc BMS) or a dashboard battery warning?"
        - "b4: only expected after a contactor-weld diagnosis; check whenever a BMS DTC is logged"
      capture_protocol: >-
        canair monitor 'BMS:2101 VCU:2101' --save --keep-all --label 'B14 b1 contactor transitions'
        across ignition off -> READY -> off, and across AC and CCS plug-in to charge start, so
        sub-second b0/b1 transitions are not run-length collapsed. For b2-b4, capture BMS:2101
        whenever canair dtc BMS reports a new code.
    - type: decode
      target: 2101 B61 bits 0 and 2 — BMS power/wake byte
      status: pending
      priority: P3
      vehicle_states: [ACC, READY]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: >-
        The Ioniq shop manual's GDS list (page 0647) places four flags between Accumulative
        Operating Time and Inverter Capacitor Voltage: MCU Ready, MCU Main Relay Off Request, MCU
        Controllable, HCU Ready (YES, NO, NO, YES = 0x09 in its screenshot), registered as b0-b3.
        B61 reads 0x0D (READY, or charging begun while READY), 0x09 (charging from off, 12 V top-up,
        plugged idle) and 0x01 (after a charge ends or at power-off). b0 is 1 and b1 is 0 in every
        capture.
      sources:
        - canair B61 cross-tab 2026-10-27 (align BMS:2101:B61:2 vs VCU/IGPM)
        - OBDb Hyundai/Kia signalsets and test cases (data byte 50 of 2101/220101)
      what_to_test:
        - "b2 with ignition ON but not READY from cold (press the button twice, no brake): 1 = ignition input, 0 = drive/HV request"
        - b2 at ACC only, and its timing against VCU VEHICLE_STATE_EV_READY at a READY -> OFF press
        - "b0: does it ever read 0 while the BMS answers (e.g. during the IG3 power-off tail)?"
      capture_protocol: >-
        canair monitor 'BMS:2101 VCU:2101 IGPM:22BC03' --save --keep-all --interval 1 --label 'B61
        ignition vs READY' --state ACC. From off press the button once (ACC), again (ON, no brake),
        wait 30 s, then brake + button to READY, wait, then button to OFF and keep recording 3 min.
        Press s at each press.
    - type: decode
      target: broadcast 0x5A3 (HV main-contactor status)
      status: pending
      priority: P3
      vehicle_states: [READY, CHARGING]
      created: "2026-10-29"
      updated: "2026-10-29"
      notes: >-
        The Kona bench code reads 0x5A3 byte 0 bit 6 as HV main contactor closed. On the uhi22 Ioniq
        P-CAN drive log 0x5A3 is 4F 00 00 00 00 00 00 00 throughout (bit 6 = 1, contactor closed);
        never seen open.
      sources:
        - projectgus car_hacking, bench_kona/bench_kona.py (Kona OS EV)
      what_to_test:
        - Tapped P-CAN sniff across contactor close/open (plug in / go READY / unplug); check 0x5A3 byte0 bit6.

