    21F2:
      status: slow
      period: 300000
      revisions: [kwp]
      response_frames: 18
      vehicle_states: [READY]
      notes: >-
        121 data bytes: a record of the previous drive or charge cycle (duration, SOC and
        temperature histograms, start/end SOC, cell and pack voltage extremes, energy in/out, peak
        powers, average temperature), updated when a cycle ends, plus the constant ASCII tag '4064'
        at B9-B12.
      source: canair 21F2 cross-check vs BMS:2101 live data 2026-10-21
      verified: false
      parameters:
        LAST_CYCLE_MIN_CELL_VOLTAGE:
          expression: B37/50
          unit: V
          ha_class: voltage
          min: "0"
          max: "5"
          source: canair align vs BMS:2101 2026-10-21
          notes: >-
            Lowest cell voltage of the previous drive or charge cycle, 1/50 V. Frozen while the car
            is on: 4.12 V through a drive whose live minimum fell to 3.68 V.
        LAST_CYCLE_MAX_CELL_VOLTAGE:
          expression: B38/50
          unit: V
          ha_class: voltage
          min: "0"
          max: "5"
          source: canair align vs BMS:2101 2026-10-21
          notes: >-
            Highest cell voltage of the previous drive or charge cycle, 1/50 V. 4.16 V after an AC
            charge to 95 %.
        LAST_CYCLE_MAX_PACK_VOLTAGE:
          expression: "[B43:B44]"
          unit: V
          ha_class: voltage
          min: "0"
          max: "450"
          source: canair align vs BMS:2101 2026-10-21
          notes: Highest pack voltage of the previous cycle, 1 V/bit.
        LAST_CYCLE_MIN_PACK_VOLTAGE:
          expression: "[B45:B46]"
          unit: V
          ha_class: voltage
          min: "0"
          max: "450"
          source: canair align vs BMS:2101 2026-10-21
          notes: >-
            Lowest pack voltage of the previous cycle, 1 V/bit, including load sag: 340 V after a
            drive that ended at a live 346 V.
        BMS_21F2_TAG:
          expression: "[B9:B12]"
          type: ascii
          source: canair search 2026-10-21
          notes: >-
            Constant ASCII '4064' in all 29 captures. Not the 1A8D calibration ('4604') or any other
            identity field.
          enabled: false
        LAST_CYCLE_DURATION:
          expression: B14
          unit: min
          min: "0"
          max: "255"
          notes: >-
            Length of the previous drive or charge cycle in minutes: the five temperature-band
            seconds summed and divided by 60, rounded down, in all 13 records. The ten SOC bands
            (B15-B26) sum to within 3 min of it.
        LAST_CYCLE_MINUTES_SOC_10_20:
          expression: B17
          unit: min
          min: "0"
          max: "255"
          notes: Minutes of the previous cycle spent at 10-20 % SOC.
        LAST_CYCLE_MINUTES_SOC_20_30:
          expression: B18
          unit: min
          min: "0"
          max: "255"
          notes: Minutes of the previous cycle spent at 20-30 % SOC.
        LAST_CYCLE_MINUTES_SOC_30_40:
          expression: B19
          unit: min
          min: "0"
          max: "255"
          notes: Minutes of the previous cycle spent at 30-40 % SOC.
        LAST_CYCLE_MINUTES_SOC_40_50:
          expression: B20
          unit: min
          min: "0"
          max: "255"
          notes: Minutes of the previous cycle spent at 40-50 % SOC.
        LAST_CYCLE_MINUTES_SOC_50_60:
          expression: B21
          unit: min
          min: "0"
          max: "255"
          notes: Minutes of the previous cycle spent at 50-60 % SOC.
        LAST_CYCLE_MINUTES_SOC_60_70:
          expression: B22
          unit: min
          min: "0"
          max: "255"
          notes: Minutes of the previous cycle spent at 60-70 % SOC.
        LAST_CYCLE_MINUTES_SOC_70_80:
          expression: B23
          unit: min
          min: "0"
          max: "255"
          notes: Minutes of the previous cycle spent at 70-80 % SOC.
        LAST_CYCLE_MINUTES_SOC_80_90:
          expression: B25
          unit: min
          min: "0"
          max: "255"
          notes: Minutes of the previous cycle spent at 80-90 % SOC.
        LAST_CYCLE_MINUTES_SOC_90_100:
          expression: B26
          unit: min
          min: "0"
          max: "255"
          notes: Minutes of the previous cycle spent at 90-100 % SOC.
        LAST_CYCLE_SOC_START:
          expression: "[B109:B110]/10"
          unit: "%"
          min: "0"
          max: "100"
          notes: >-
            SOC at the start of the previous cycle, 0.1 %/bit. 95.2 % for a drive that left at 95 %.
        LAST_CYCLE_SOC_END:
          expression: ((B111<<8)|B113)/10
          unit: "%"
          min: "0"
          max: "100"
          notes: >-
            SOC at the end of the previous cycle, 0.1 %/bit (B112 is a PCI byte). Matches live
            SOC_BMS after a drive, and VCU:21F2:VCU_21F2_SOC in every co-read record.
        LAST_CYCLE_ENERGY_DISCHARGED:
          expression: "[B134:B135]"
          unit: Wh
          min: "0"
          max: "65535"
          notes: >-
            Energy taken from the pack during the previous cycle. 17258 Wh for a drive over which
            CUMULATIVE_ENERGY_DISCHARGED rose 17.2 kWh.
        LAST_CYCLE_ENERGY_CHARGED:
          expression: "[B137:B138]"
          unit: Wh
          min: "0"
          max: "65535"
          notes: >-
            Energy put into the pack during the previous cycle (regen or charging). 8990 Wh for an
            AC charge from 66 to 95 %.
        LAST_CYCLE_ENERGY_START:
          expression: "[B123:B124]"
          unit: Wh
          min: "0"
          max: "65535"
          notes: >-
            Meaning unconfirmed. 26555 for a drive from 95.2 to 40.5 % SOC, where
            LAST_CYCLE_ENERGY_END read 10402; the 16153 difference is close to that drive's 16518 Wh
            net discharge. 0 in charging cycles.
        LAST_CYCLE_ENERGY_END:
          expression: "[B125:B126]"
          unit: Wh
          min: "0"
          max: "65535"
          notes: Meaning unconfirmed; see LAST_CYCLE_ENERGY_START. 0 in charging cycles.
        LAST_CYCLE_MAX_DISCHARGE_POWER:
          expression: B49
          unit: kW
          min: "0"
          max: "255"
          notes: >-
            Peak discharge power of the previous cycle. 57 kW for a drive whose live BATTERY_POWER
            peaked at 57.5 kW; 0 for charging cycles.
        LAST_CYCLE_MAX_CHARGE_POWER:
          expression: B51
          unit: kW
          min: "0"
          max: "255"
          notes: Peak charge or regen power of the previous cycle. 3 kW for a 3.3 kW AC charge.
        LAST_CYCLE_AVG_BATTERY_TEMP:
          expression: B100
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "100"
          notes: >-
            Average battery temperature of the previous cycle. 18 °C for a drive with live module
            temperatures of 17-21 °C (mean 18.7).
        LAST_CYCLE_SECONDS_TEMP_BAND_1:
          expression: ((B63<<8)|B65)
          unit: s
          min: "0"
          max: "65535"
          notes: >-
            Seconds of the previous cycle in battery-temperature band 1 of 5. Never non-zero in
            captures; thresholds unknown. The five bands sum to LAST_CYCLE_DURATION.
        LAST_CYCLE_SECONDS_TEMP_BAND_2:
          expression: "[B66:B67]"
          unit: s
          min: "0"
          max: "65535"
          notes: >-
            Seconds of the previous cycle in battery-temperature band 2 of 5. Never non-zero in
            captures.
        LAST_CYCLE_SECONDS_TEMP_BAND_3:
          expression: "[B68:B69]"
          unit: s
          min: "0"
          max: "65535"
          notes: >-
            Seconds of the previous cycle in battery-temperature band 3 of 5. In use at an average
            battery temperature of 16-20 °C.
        LAST_CYCLE_SECONDS_TEMP_BAND_4:
          expression: "[B70:B71]"
          unit: s
          min: "0"
          max: "65535"
          notes: >-
            Seconds of the previous cycle in battery-temperature band 4 of 5. In use at an average
            battery temperature of 22-24 °C.
        LAST_CYCLE_SECONDS_TEMP_BAND_5:
          expression: "[B73:B74]"
          unit: s
          min: "0"
          max: "65535"
          notes: >-
            Seconds of the previous cycle in battery-temperature band 5 of 5. In use at an average
            battery temperature of 26-29 °C.
        LAST_CYCLE_MINUTES_SOC_00_10:
          expression: B15
          unit: min
          min: "0"
          max: "255"
          notes: Minutes of the previous cycle spent at 0-10 % SOC.
    220101:
      status: active
      revisions: [uds]
      notes: >-
        38 kWh facelift (uds revision): Kona-family BMS, same DID layout as the Kona's. Every offset
        is the 2101 one shifted by the DID echo's extra byte. Unverified: no facelift capture yet.
      source: Kona BMS (hyundai-kona-os-ev, OBDb offsets); the Ioniq FL BMS is Kona-family (OVMS)
      source_links:
        - https://github.com/OBDb/Hyundai-Kona-Electric
        - https://docs.openvehicles.com/en/latest/components/vehicle_kianiroev/docs/index.html
      verified: false
      parameters:
        SOC_BMS:
          expression: B10/2
          unit: "%"
          ha_class: battery
          min: "0"
          max: "100"
        BATTERY_CURRENT:
          expression: "[S17:S18]/10"
          unit: A
          ha_class: current
          min: "-400"
          max: "400"
          notes: Signed 16-bit BE; negative = charging.
        BATTERY_VOLTAGE:
          expression: "[B19:B20]/10"
          unit: V
          ha_class: voltage
          min: "240"
          max: "450"
        BATTERY_POWER:
          expression: (([B19:B20]/10)*([S17:S18]/10))/1000
          unit: kW
          ha_class: power
          notes: Voltage x current; negative = charging.
        AVAIL_CHARGE_POWER_MIRROR:
          expression: "[B11:B12]/100"
          unit: kW
