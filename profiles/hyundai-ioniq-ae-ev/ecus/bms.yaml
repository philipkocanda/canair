  research:
    - type: iocontrol_scan
      target: "2F BC00-BCFF"
      status: pending
      priority: P2
      vehicle_states: [ACC]
      notes: "UDS 0x2F body/comfort-range DIDs. Cross-check only: the BMS speaks KWP2000."
    - type: scan
      target: 33 00-FF
      status: done
      priority: P2
      vehicle_states: [ACC]
      date: "2026-07-22"
      result: NRC 0x11 serviceNotSupported (default session)
      notes: >-
        In the default session 0x33 and 0x30 both return NRC 0x11, and UDS 10 03 returns NRC 0x12.
      sources:
        - on-car 2026-07-22 (raw 7E4:300000 --session; canair scan routines BMS)
      updated: "2026-07-23"
    - type: scan
      target: fan actuation (sniff needed)
      status: done
      priority: P2
      vehicle_states: [ACC]
      date: "2026-07-22"
      result: safe avenues exhausted
      notes: >-
        In session 10 81, 0x27, 0x30 and 0x33 all return NRC 0x11. 0x31
        StartRoutineByLocalIdentifier is not probed because it actuates. The shop manual's GDS
        Actuation Test lists FAN 1st-9th and FAN Stop (shop:0730, ignition on) and, ignition on with
        the motor off, the HV relays: Main Relay(-) ON, Precharge Relay ON, Main(-) with Precharge,
        Main(-) then Main(+) in sequence, all OFF, Quick Charger Relay(-)/(+) ON singly and
        together, both OFF, and High Voltage Battery Heater Relay ON/OFF (shop:0685, shop:0715).
        Each runs until Stop. Remaining lead: sniff a scan-tool (Kingbolen/GDS) actuation test to
        capture the session, service and LID.
      sources:
        - on-car 2026-07-22
      updated: "2026-07-23"
    - type: scan
      target: 21 00-FF
      status: done
      priority: P2
      vehicle_states: [READY]
      date: "2026-07-22"
      result: Only 01-05 and F2 answer; every other LID returns NRC.
    - type: verify
      target: 2105 BMS_DCFC_TICK_COUNTER/BMS_2105_B41
      status: captured
      priority: P2
      vehicle_states: [CHARGING]
      created: "2026-08-08"
      updated: "2026-08-08"
      notes: Both seen in one DC fast charge only (2026-08-08); both flat during AC charging.
      what_to_test:
        - "BMS_DCFC_TICK_COUNTER: confirm the tick rate on a second DC fast charge"
        - "BMS_2105_B41: capture a full 0-100 % DC fast charge and compare its steps against SOC"
    - type: decode
      target: 21F2 remaining last-cycle fields
      status: captured
      priority: P3
      created: "2026-10-21"
      updated: "2026-10-21"
      notes: >-
        Undecoded: B39 (0/1), B42 (137 and 92 after drives, 5 after an AC charge; not the sampled
        peak current), B53 (11-13), B108 (0/2), B117 (0x00 after drives, 0x11 after short or
        zero-length cycles, 0x40 after charges), B118:B119 (1-2 after drives, 3-22 after charges),
        B122 (4, 18, 46 after drives), B127, B129. LAST_CYCLE_ENERGY_START/END meaning unconfirmed.
        Temperature-band thresholds unknown.
      sources:
        - canair 21F2 cross-check vs live data 2026-10-21
      what_to_test:
        - "Temperature-band thresholds: capture a cycle whose battery temperature crosses 20 and 25 °C"
        - Read BMS 21F2 right after a short drive with a known distance and peak current to place B42 and B122
    - type: scan
      target: 22 0101-0114, E001, E002, E00A
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: >-
        Never probed on this car. OBDb defines 7E4 service-22 DIDs 0101-0106, 010A-010C, 0111 and
        0114 (cell voltages, temperatures, BMS state, fan duty) and lists most as unsupported for
        2017-2018, but the same list calls VCU 2101 unsupported, which answers on this car.
