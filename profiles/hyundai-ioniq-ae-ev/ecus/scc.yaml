# ─── SCC (Smart Cruise Control) ───────────────────────────────────────
SCC:
  tx_id: 0x7D0
  can_bus: [C-CAN]
  identity:
    description: Smart Cruise Control
    part_number: "96400-G7000"
    boot_sw: "AEev SCC F-CUP 1.00 1.00"
    id_protocol: UDS  # F1xx (3 DIDs)
    notes: >-
      Smart Cruise Control (front radar). Live-data DIDs 220100-0103 and 0105, all undecoded and not
      yet captured while driving.
  vehicle_states: [ACC, "ON", READY]
  multi_did: true
  scan_log: # SCC (smart cruise control)
    - service: 0x22
      range: "0101-010F,0106-0120,B001-B010"
      date: 2026-07-22
      hits: "0101,0102,0103,0105"
      vehicle_states: [READY]
      notes: "0106-0120 and B0xx all NRC."
  pids:
    220100:
      response_frames: 1
      status: draft
      period: 2500
      vehicle_states: [READY]
      notes: "6 bytes: 620100030200."
    220101:
      status: draft
      period: 2500
      vehicle_states: []
      notes: "6 bytes: 620101081401."
    220102:
      status: draft
      period: 2500
      vehicle_states: []
      notes: "6 bytes: 6201020D000C."
    220103:
      status: draft
      period: 2500
      vehicle_states: []
      notes: "7 bytes: 62010328543521."
    220105:
      status: draft
      period: 2500
      vehicle_states: []
      notes: "5 bytes: 6201050307."
  research:
    - type: scan
      target: 22 0104-0110
      status: done
      priority: P3
      vehicle_states: [READY]
      date: "2026-07-22"
      result: Only 0105 answers in 0104-0110; 0104 and 0106-0110 NRC.
      updated: "2026-07-23"
    - type: decode
      target: 220102 speed byte
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-27"
      updated: "2026-07-27"
      notes: >-
        e-Niro AEB 0x7D0 22 02 00 carries vehicle speed in byte 3 of its reply. Capture SCC
        220100-220105 while driving and hunt for a speed byte against ESC:22C101:REAL_SPEED_KMH; the
        e-Niro reply is single-frame, so its offset is only a hint.
      sources:
        - kia-e-niro-can-messages.xlsx (AEB sheet)
