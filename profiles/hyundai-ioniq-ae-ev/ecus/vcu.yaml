    - type: verify
      target: how the head unit starts and stops AC charging
      status: pending
      priority: P1
      vehicle_states: [PLUGGED, CHARGING]
      created: "2026-10-30"
      updated: "2026-10-30"
      result: >-
        The EU head unit has no start or stop command; its only charge control is the scheduling
        mode: Charge Now sends mode 0, Charge on Schedule resends the saved off-peak mode (1 no
        window, 2 off-peak enabled, 3 charge only in the window). It goes out as HU_EV_P_01 (MM-CAN
        0x57A byte 4 bits 1-0, with the off-peak windows in bytes 0-3), the gateway forwards it to
        P-CAN as 0x588, and the VCU stores it, re-broadcasts it on 0x579 and starts or stops the
        charge itself using the gateway clock 0x567. The dedicated start/stop frame HU_GW_P_00 is
        never built and is dropped by the MICOM.
      notes: >-
        OBC_SESSION_FLAGS bit 2 follows the charger pilot PWM. All seven recorded charger-ended
        sessions went 0x76 -> 0x72 with the pilot at 100 % duty; the one car-side stop (2026-08-05
        15:28, 95 % SOC) kept the PWM and went 0x76 -> 0x7E with VCU_POWER_STATE 7 -> 6. A stop by
        the scheduling mode should look like the car-side stop.
      sources:
        - ioniq-avn-fw EU firmware (GreenCar DepartureClimateActivity/EconomyReservationSettingActivity, IviServer GreenCarMessageSetting, MICOM tables); uhi22 IoniqMotorCAN P-CAN trace 2022-07-22 and Ioniq28Investigations logs; canair OBC 2101 captures; 2026-10-30
      what_to_test:
        - "Plugged in at home and charging: in 'Charging and Climate Settings' switch to 'Charge on Schedule' with an off-peak window that excludes now and 'Charge ONLY during the time shown below' ticked, then back to 'Charge Now'. Expect AC_INPUT_A to fall to 0 with the pilot still offered (OBC_SESSION_FLAGS 0x76 -> 0x7E, VCU_POWER_STATE 7 -> 6), then resume."
        - Repeat with off-peak enabled but the box unticked (mode 2) and with off-peak disabled (mode 1), to learn which modes stop an ongoing charge.
      capture_protocol: >-
        canair monitor OBC:2101 VCU:2101 BMS:2101 --save --keep-all --interval 2 --label 'head-unit
        charge mode start/stop' --state CHARGING; press s at each menu change and name the mode.
