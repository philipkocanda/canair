        10:19:25. The US logs show B11 = 0xD0 and VCU_POWER_STATE 2 at power-off, then 0x80.
      sources:
        - canair response-presence analysis 2026-10-23; JejuSoul US Ioniq logs
      what_to_test:
        - B11:4 falls in the same second the OBC and BMS stop answering at a power-off after a drive
        - VCU_POWER_STATE reads 2 and B11 0xD0 between READY and 0x80
        - B11:4 rises at a power button press before READY, before the OBC first answers
      capture_protocol: >-
        canair monitor VCU:2101 OBC:2101 BMS:2101 IGPM:22BC03 --save --keep-all --interval 1 --label
        'IG3 power-off timing' --state READY. From READY press the button to OFF and keep recording
        for 4 min; then press it once (no brake) and again with the brake to READY. Press s at each
        press.
