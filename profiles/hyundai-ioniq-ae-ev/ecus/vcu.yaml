# ─── VCU (Vehicle Control Unit) ──────────────────────────────────────
#
# Also called the VMCU.
#
# The VCU is the logical brain of the EV powertrain:
# - Torque requests (accelerator input, cruise control)
# - Drive mode logic
# - Regen braking strength (0-1-2-3) and brake blending
# - Coordination between motor, inverter, battery, and safety systems
# - Calculates remaining range
# - Controls allowed AC power
# - Decides and runs the parked 12V battery top-up once woken (the Aux. Battery Saver+ setting is
#   in the cluster's user settings). What wakes it: see the IGPM research entry.
# - Controls ECO setting and drive modes
# - Preconditioning (climate) timer, charge timer, charge power limit settings.
#
# The Vehicle Control Unit (VCU) and Motor Control Unit (MCU, the inverter)
# are both part of the Electronic Powertrain Control Unit (EPCU) physical housing.
#
# Only KWP2000 session 0x81 is accepted; no session unlocks extra data. 2103-2105 answer NRC 0x12.
#
VCU:
  tx_id: 0x7E2
  can_bus: [P-CAN]
  identity:
    alias: VLDC  # KWP2000 ecu_id module code (VCU with integrated LDC)
    description: Vehicle Control Unit (integrated LDC)
    part_number: "36601-0E250"
    ecu_id: AEVLDC53  # KWP2000 1A8C — "VLDC": VCU with the LDC integrated (standalone at 0x7CD on Kia Soul)
    sw_id: "EAEEO5L-NS7-D060"
    calibration: "C5210617"
    vin: KMHCXXXXXXXXXXXXX
    id_protocol: KWP2000  # 1Axx
    notes: Vehicle Control Unit (VMCU) with integrated LDC. Shares the EPCU housing with the MCU.
  vehicle_states: [IG3]
  pids:
    2101:
      response_frames: 4
      status: active
      period: 2500
      vehicle_states: [IG3]
      verified: true
      parameters:
        VCU_VEHICLE_SPEED:
          expression: ((S20*256)+B19)*1.609344/100
          unit: km/h
          min: "0"
          max: "250"
          notes: >-
            Speed in MPH (B20 signed high byte, B19 low byte) converted to km/h. r=0.999 vs
            ESC:22C101:REAL_SPEED_KMH (n=124, 0-105.7 km/h). Reads about 3.6 % above true speed:
            above 30 km/h MCU_MOTOR_RPM is 61.8 rpm per km/h of this signal (n=1372) against 64.07
            from the 7.412 reduction ratio and 1928 mm tyre circumference.
          source: VCU 2101 speed lead (MPH formula) + cross-ECU verification vs ESC, 2026-07-23
          enabled: true
        ACCEL_PEDAL_DEPTH:
          expression: "B18/2"
          unit: "%"
          min: "0"
          max: "100"
          source: "ITStromer community PID sheet (Accel Pedal Depth = m/2)"
          verified: false
          notes: >-
            B18 = 0 with the pedal released and 200 (100 %) floored (ITStromer sheet). Captures: up
            to 56 % driving, up to 86 % pressed in Park.

        ACCEL_PEDAL_DEPTH_FINE:
          expression: ((B18<<8)|B17)/512
          unit: "%"
          min: "0"
          max: "100"
          source: canair decode --corr 2026-10-21
          verified: false
          notes: >-
            Accelerator pedal position, 16-bit little-endian; B17 is the low byte of
            ACCEL_PEDAL_DEPTH (B18/2). r=+1.000 vs ACCEL_PEDAL_DEPTH over 1607 DRIVING captures.

        GEAR:
          expression: B10
          notes: >-
            Values: 0x21 Park, 0x28 Drive, 0x22 Reverse, 0x24 Neutral (7 captures), 0x01 Park with
            GEAR_SIGNAL_VALID clear (at power-mode transitions). Bits 0-3 are one-hot P/R/N/D, bit 5
            is GEAR_SIGNAL_VALID; bits 4, 6 and 7 are always 0.
          type: enum
          values:
            1: park_gear_signal_invalid
            33: park
            34: reverse
            36: neutral
            40: drive
          source: canair bitfield analysis 2026-08-06; same-payload enumeration n=6365
        GEAR_P:
          expression: B10:0
          notes: Bit 0 of GEAR. Equals GEAR_P_MIRROR_B26_5 in every capture.
        GEAR_R:
          expression: B10:1
          notes: Bit 1 of GEAR. Matches ESC GEAR_SELECTOR=2 over the 2026-07-26 reversing.
        GEAR_N:
          expression: B10:2
          notes: Bit 2 of GEAR. Set in only 7 captures, none with ESC GEAR_SELECTOR co-polled.
        GEAR_D:
          expression: B10:3
          notes: Bit 3 of GEAR.
        DEBUG_VEHICLE_STATE_FLAGS:
          expression: "B11"
          verified: false
          notes: Whole B11 byte; its bits are the VEHICLE_STATE_* signals.

        VEHICLE_STATE_BRAKE_LAMP:
          expression: "B11:0"

        VEHICLE_STATE_NOT_BRAKING:
          expression: B11:1
          notes: >-
            Not the complement of VEHICLE_STATE_BRAKE_LAMP: both read 0 in most captures with the
            drive path down (VCU_POWER_STATE 7). Meaningful only while VCU_POWER_STATE is 4.

        VEHICLE_STATE_EV_READY:
          expression: "B11:3"

        VCU_IG3_ON:
          expression: "B11:4"
          notes: >-
            IG3 rail powered. When it falls (B11 = 0x80) the OBC, BMS, MCU, AAF and HVAC stop
            answering and VCU 2102 stops updating, while the VCU, IGPM and BCM answer for another
            1.7-3 min (9 stored stretches). Equals VCU_IG3_ON_MIRROR (BMS 2101 B61:3) in 10845 of
            10846 aligned rows. 1 in READY, AC and DC charging, the 12 V top-up and ignition-on
            standby. Reads 1 in the uhi22 EPCU bench log (EPCU on its 12 V and wake-line pins only)
            while VCU_IGN_ON reads 0, so it follows the EPCU wake input, not the ignition.
          source: canair cross-ECU response-presence analysis 2026-10-23 (stored captures + JejuSoul US Ioniq logs)


        VEHICLE_STATE_EV_READY_MIRROR_B11_6:
          expression: B11:6
          notes: >-
            Equals VEHICLE_STATE_EV_READY (B11:3) in every capture on this car. In the JejuSoul US
            Ioniq logs it reads 1 with B11:3 at 0 at power-off (B11 = 0xD0 after a drive, 0xD2 after
            an AC charge), so it is a separate signal. Disabled so it does not ship a duplicate.
          source: canair bitfield analysis 2026-08-06; decode --find-mirrors --bits, n=6365 unanimous
          enabled: false
        VEHICLE_STATE_LDC_ENABLED:
          expression: "1-B11:7"
          verified: false
          notes: >-
            1 at READY (B11 = 0x5A), while charging and during the parked 12 V top-up (B11 = 0x10);
            0 in accessory or off (B11 = 0x92, 0x91, 0x80). With VCU_POWER_STATE == 1 it is the
            TOPUP state predicate (exact on all 35 top-up captures, no false positive). Does not
            tell ACC, ON and off apart.

        VCU_APS1_VOLTAGE:
          expression: ((B13<<8)|B12)/2048
          unit: V
          verified: false
          notes: >-
            Accelerator pedal sensor track 1, 16-bit little-endian. r=+0.996 vs ACCEL_PEDAL_DEPTH
            (n=1607, DRIVING). About 1.97x VCU_APS2_VOLTAGE. Reads 0.80 V released and 3.55 V at
            87.5 % pedal. Scale check: 3.93 V at full pedal in the uhi22 EPCU bench log, where his
            multimeter reads 3.97 V.
          source: canair decode/align 2026-10-21; uhi22 EPCU bench 2026-10-29
          min: "0"
          max: "5"
        DEBUG_GEAR_STATE_FLAGS:
          expression: B26
          source: canair bitfield analysis 2026-08-06; same-payload cross-tab vs GEAR (B10) n=6365
          notes: >-
            Reads 0x20 in Park and 0x08 in Reverse, Neutral or Drive; no information beyond GEAR on
            the car.
          type: enum
          values:
            8: not_park
            32: park
        GEAR_PARK_INV:
          expression: B26:3
          source: canair bitfield analysis 2026-08-06; same-payload cross-tab vs GEAR (B10) n=6365
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: >-
            Set in Reverse, Neutral and Drive; the exact complement of GEAR_P in every car capture.
            Reads 0 in the uhi22 EPCU bench log (no shifter connected) while GEAR_P reads 1.
            Disabled so it does not ship a duplicate.
          enabled: false
        GEAR_P_MIRROR_B26_5:
          expression: B26:5
          source: canair bitfield analysis 2026-08-06; decode --find-mirrors --bits, n=6365 unanimous
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: >-
            Equals GEAR_P (B10:0) in every car capture, but reads 0 in all 250 replies of the uhi22
            EPCU bench log (no shifter connected) while GEAR_P reads 1, so B26 is not a copy of B10.
            Disabled so it does not ship a duplicate.
          enabled: false

        VCU_INVERTER_ENABLED:
          expression: B23:2
          source: canair historical analysis 2026-07-23
          notes: >-
            B23 reads 0, 48 or 52; bit 2 is set only at 52. Agrees with VEHICLE_STATE_EV_READY
            (r=+0.997, n=776).
        VCU_POWER_STATE:
          expression: B25
          min: "0"
          max: "8"
          source: canair historical analysis 2026-07-23; values 1, 2 and 6 re-read 2026-10-23 against stored captures and the JejuSoul US Ioniq logs
          notes: >-
            VCU operating mode: 4 drive-ready, 7 charging (AC, DC and plugged-in preconditioning), 6
            at entry to and exit from a charge, 1 standby (ignition on but not READY, and the parked
            12 V top-up). 2 appears only in the JejuSoul US Ioniq logs, at power-off. Reads 8 in the
            uhi22 EPCU bench log, where the VCU stores no-communication DTCs for the BMS, gateway
            and HVAC.
          type: enum
          values:
            1: standby
            2: shutdown
            4: drive_ready
            6: charge_transition
            7: charging
        VCU_SUPPLY_VOLTAGE:
          expression: ((B22<<8)|B21)/2072
          min: "0"
          max: "16"
          source: canair align fit 2026-10-21
          verified: false
          notes: >-
            12 V supply voltage at the VCU, 16-bit little-endian. r=+0.995 vs
            VCU_AUX_BATTERY_VOLTAGE_FINE (n=10357). The /2072 scale is fitted and matches the MCU
            and ESC supply words; /2048 reads about 1.2 % high.
          unit: V
        VCU_INVERTER_ARMED:
          expression: B23:4
          source: canair bitfield analysis 2026-08-06; same-payload cross-tab n=6367
          verified: false
          notes: >-
            Set whenever VCU_INVERTER_ENABLED is, and alone in 40 captures (B23 = 48). Clear while
            charging, when BMS_MAIN_RELAY is set, so it follows the drive path rather than the
            contactors.
        VCU_INVERTER_ARMED_MIRROR_B23_5:
          expression: B23:5
          source: canair bitfield analysis 2026-08-06
          verified: false
          notes: >-
            Equals VCU_INVERTER_ARMED (B23:4) in every capture. Disabled so it does not ship a
            duplicate; defined so bit 5 is accounted for.
          enabled: false
        GEAR_SIGNAL_VALID:
          expression: B10:5
          source: canair bitfield analysis 2026-08-06; n=6365, 4 transitions in the 2026-07-30 power-cycle session
          verified: false
          notes: >-
            Set in P, R, N and D. Clear in 10 captures, all at power-mode transitions on 2026-07-30
            with the car in Park.
        VCU_POWER_STATE_B25_1:
          expression: B25:1
          source: canair correlate, 2026-08-08 DCFC-2
          verified: false
          notes: >-
            Bit 1 of VCU_POWER_STATE: set exactly when it reads 6 or 7. Not a DC-charging flag.
            Disabled so it does not ship a duplicate; defined so the bit is accounted for.
          enabled: false
        VCU_APS2_VOLTAGE:
          expression: ((B15<<8)|B14)/2048
          unit: V
          min: "0"
          max: "5"
          source: canair decode/align 2026-10-21; uhi22 EPCU bench 2026-10-29
          verified: false
          notes: >-
            Accelerator pedal sensor track 2, 16-bit little-endian. About half of VCU_APS1_VOLTAGE
            (ratio median 1.97). Reads 0.42 V released and 1.80 V at 87.5 % pedal. Scale check: 2.06
            V at full pedal in the uhi22 EPCU bench log, where his multimeter reads 2.00 V.
        VCU_IGN_ON:
          expression: B11:0|B11:1
          min: "0"
          max: "1"
          source: canair cross-tab vs IGPM 22BC03 IGN1_SWITCH 2026-10-23
          verified: false
          notes: >-
            Ignition on: one of the two brake-switch contacts (VEHICLE_STATE_BRAKE_LAMP,
            VEHICLE_STATE_NOT_BRAKING) reads 1 with the ignition on, both read 0 with it off. Equals
            IGPM IGN1_SWITCH in all 360 aligned rows, including charging with the ignition on. Does
            not tell ACC from off.
    2102:
      response_frames: 4
      status: active
      period: 10000
      vehicle_states: [IG3]
      notes: >-
        Stops updating while VCU_IG3_ON (2101 B11:4) is 0: every read after the fall repeats the
        first one byte for byte, so readings taken with the IG3 rail off are not live. Motor RPM,
        torque and temperatures are not on this page; they are on the MCU (0x7E3).
      min: "0"
      verified: false
      parameters:
        VCU_INVERTER_INPUT_VOLTAGE:
          expression: "B17*2"
          unit: V
          max: "450"
          source: "Kia Soul EV VMCU CSV (Inverter Input Voltage = f*2)"
          verified: true
          notes: >-
            HV DC-link voltage, which is the pack voltage. r=0.998 vs OBC:2101:LDC_HV_INPUT_V
            (n=5689, slope 0.5024 on the raw byte). 396 V vs BMS pack 396.4 V while charging on
            2026-07-20.

        VCU_AUX_BATTERY_VOLTAGE:
          expression: B14*0.0974
          unit: V
          max: "16"
          enabled: true
          source: RE 2026-08-02 absolute-value anchoring + live ON, vs OBC/BMS/BCM consensus
          verified: true
          notes: >-
            12 V bus at the VCU. Empirical scale: within 0.032 V on average of the OBC, BMS and BCM
            12 V readings over 12.4-15.0 V (n=696).


        VCU_DCLINK_VOLTAGE_COARSE:
          expression: "B25*2.56"
          unit: V
          max: "450"
          enabled: false
          source: "canair historical analysis 2026-07-23"
          notes: >-
            About 2.56 V per LSB; r=+0.950 vs VCU_INVERTER_INPUT_VOLTAGE (n=1672), median residual
            about 1 V. Disabled as a lower-resolution duplicate.
        VCU_AUX_POWER:
          expression: ((B22<<8)|B21)/10
          unit: W
          max: "6553"
          source: 2026-07-30 dash anchor (130->650 W); low byte B21 per decode/align 2026-10-21
          notes: >-
            LDC output power, 16-bit little-endian. 0 whenever VCU_HV_MAIN_RELAY_ON is 0. Matched
            the dash electronics bar from 130 to 650 W (2026-07-30) and rose 195 to 601 W with the
            rear and side defrosters. Excludes HV climate power.
        VCU_AUX_POWER_COARSE:
          expression: B15*10
          unit: W
          max: "2550"
          source: "2026-07-30: B15*10 vs [B22:B23]/10 r2=0.994"
          notes: 10 W per LSB; r²=0.994 vs VCU_AUX_POWER.
        VCU_LDC_OUTPUT_VOLTAGE:
          expression: ((B20<<8)|B19)/1000
          source: canair hunt vs OBC:2101:LDC_OUTPUT_V 2026-10-21
          notes: >-
            12 V bus voltage at the LDC, 16-bit little-endian. r=+0.997 vs OBC:2101:LDC_OUTPUT_V
            (n=11057, slope 1.019). Reads 0.02-0.22 V above VCU_AUX_BATTERY_VOLTAGE_FINE; the gap
            tracks VCU_AUX_POWER (r=+0.86).
          unit: V
          max: "16"

        VCU_AUX_BATTERY_VOLTAGE_FINE:
          expression: ((B27<<8)|B26)/1000
          source: canair hunt vs BMS:2101:AUX_BATTERY_VOLTAGE 2026-10-21; Kia e-Niro VMCU sheet
          notes: >-
            12 V battery voltage, 16-bit little-endian. r=+0.996 vs BMS:2101:AUX_BATTERY_VOLTAGE
            (n=10542, slope 0.998). Same offset as the Kia e-Niro VMCU sheet; the e-Niro 12 V
            current and SOC that follow it are not in the Ioniq reply.
          unit: V
          max: "16"
        VCU_COOLANT_TEMP:
          expression: B18-100
          source: RE 2026-08-05 cross-ECU offset-mirror + within-PID state-divergence disambiguation
          notes: >-
            Equals AAF:2181:MOTOR_COOLANT_TEMP exactly in 77 % of 1729 co-polled rows. Moves
            opposite to the 12 V bus in ON, so it is not a voltage. Rose 29 to 44 °C over a 3 h AC
            charge.
          unit: °C
          min: "-40"
          max: "150"
          enabled: true
        VCU_HV_MAIN_RELAY_ON:
          expression: B10
          max: "1"
          source: RE 2026-08-02, live ON confirmed
          verified: true
          notes: >-
            1 while the HV contactors are closed: went 1 to 0 as LDC_HV_INPUT fell 206 to 6.7 V, and
            reads 0 in ON. Agrees with BMS_MAIN_RELAY.
        VCU_DCLINK_VOLTAGE:
          expression: ((B25<<8)|B23)/100
          unit: V
          max: "450"
          source: canair decode/align 2026-10-21
          notes: >-
            HV DC-link voltage, 0.01 V/bit, 16-bit little-endian split across the PCI byte B24. B25
            alone is VCU_DCLINK_VOLTAGE_COARSE (r=1.000). Read within 0.1-0.6 V of
            BMS:2101:BATTERY_VOLTAGE while driving on 2026-08-08.
    21F2:
      status: slow
      period: 300000
      response_frames: 13
      source: canair 21F2 cross-check vs live data 2026-10-21
      verified: false
      parameters:
        VCU_21F2_EVENT_COUNT:
          expression: ((B76<<8)|B75)
          min: "0"
          max: "65535"
          source: canair 21F2 vs BMS:2101 charge flags 2026-10-21
          notes: >-
            Event counter, 16-bit little-endian (B76 reads 3 in every capture, so the high byte is
            unproven until B75 wraps). Only rises, flat within a cycle: 784 on 2026-07-22, 847 on
            10-19, 857 on 10-30. From 07-30 to 08-15 each rise follows an ended AC charge or a
            plugged-in preconditioning run; DC charges, drives and parked days added nothing. The
            2026-10-21 parked 12 V top-up did not move it.
        VCU_ODOMETER:
          expression: (B14 | (B15 << 8) | (B17 << 16) | (B18 << 24)) / 256
          unit: km
          min: "0"
          max: "1000000"
          source: monotonic-counter sweep of all captures 2026-07-22..08-05; cross-checked vs the verified CLU 22B002 ODOMETER
          notes: >-
            32-bit little-endian at WiCAN B14, B15, B17, B18 (B16 is a PCI byte), 1/256 km per LSB.
            Only rises. +4.36 to +4.66 km above CLU:22B002:ODOMETER at 5 co-polled points, all
            parked.
        VCU_21F2_TAG:
          expression: "[B95:B99]"
          type: ascii
          source: canair search 2026-10-21
          notes: >-
            Constant ASCII '6000' in all 158 captures. Not part of the 1A8C/1A8D identity strings.
          enabled: false
        VCU_21F2_SOC:
          expression: ((B13<<8)|B12)/256
          unit: "%"
          min: "0"
          max: "100"
          source: canair 21F2 cross-check 2026-10-21
          notes: >-
            SOC at the end of the previous cycle, 8.8 fixed point. Equals BMS:21F2
            LAST_CYCLE_SOC_END in all 6 co-read records.
        VCU_21F2_RANGE_START:
          expression: B19
          notes: >-
            Continues the previous record VCU_21F2_RANGE_END to within 2 km in all 9 cases with no
            unlogged drive in between, and resets upward after every charge (68 to 168 across the
            2026-08-09 AC charge). Rose 208 to 233 at the start of the 2026-08-08 drive, right after
            a preconditioning cycle.
          unit: km
          min: "0"
          max: "255"
        VCU_21F2_RANGE_END:
          expression: B20
          notes: >-
            Divided by VCU_21F2_SOC it gives 2.17-2.27 km per % in 19 of 22 distinct records (about
            220 km at 100 %); 1.92-2.05 after highway driving. A charge does not update it: the
            2026-07-30 charge to 95.2 % kept the 147 km of the READY cycle before it.
          unit: km
          min: "0"
          max: "255"


      vehicle_states: [CHARGING, READY]
      notes: >-
        About 86 bytes. A previous-cycle record like BMS 21F2: odometer, end SOC, range at start and
        end, an event count and fields that change after a drive or charge (B38-B44 after charging),
        plus the ASCII tag 6000 at B95-B99. See the 21F2 research entries.
    1A90:
      response_frames: 3
      parameters:
        VIN:
          expression: "[B04:B22]"
          type: ascii
          source: 2026-04-17 KWP2000 1A80-1A9F identity scan (decoded ASCII only; raw bytes not retained)
          verified: false
          notes: >-
            17 ASCII characters across WiCAN B04-B22, skipping the PCI bytes B08 and B16. The
            payload length is inferred from the VIN length; only the redacted string was kept.
            Personally identifying: redact before sharing.
      status: draft
      vehicle_states: [READY]
      notes: >-
        KWP2000 ReadEcuIdentification record 0x90: the VIN as ASCII. Only the redacted decoded
        string from the 2026-04-17 identity scan was kept, so the record length is unconfirmed;
        re-read VCU:1A90 to confirm. Draft: a VIN must never ship to the device AutoPID, and an
        ascii range is not a device float expression.

  # From a KWP2000 18 00 FF 00 read of an EPCU running alone on a bench (uhi22
  # CAN/EPCU_torquePro_reading_error_memory_18DTCs_found.csv), status 0x44 each. Descriptions are
  # the SAE J2012 generic meanings; the U1xxx codes are manufacturer-specific.
  dtcs:
    U0111:
      description: "Lost communication with battery energy control module A (BMS)"
      source: "SAE J2012; uhi22 EPCU bench DTC read (no BMS connected)"
      verified: false
    U0146:
      description: "Lost communication with gateway A"
      source: "SAE J2012; uhi22 EPCU bench DTC read (no gateway connected)"
      verified: false
    U0164:
      description: "Lost communication with HVAC control module"
      source: "SAE J2012; uhi22 EPCU bench DTC read (no HVAC unit connected)"
      verified: false
    U1310:
      description: "Manufacturer-specific network fault; meaning unknown"
      source: "uhi22 EPCU bench DTC read"
      verified: false
    U1112:
      description: "Manufacturer-specific network fault; meaning unknown"
      source: "uhi22 EPCU bench DTC read"
      verified: false
    U1017:
      description: "Manufacturer-specific network fault; meaning unknown"
      source: "uhi22 EPCU bench DTC read"
      verified: false

  research:
    - type: verify
      target: "2101"
      status: pending
      priority: P1
      vehicle_states: [ACC]
      notes: >-
        Drive mode (Eco/Normal/Sport) and regen level are not found. A 2026-07-21 stationary session
        in D cycling the modes showed no byte on VCU 2101/2102, MCU 2101-2103, BCM 22B0xx or IGPM
        22BCxx stepping with them, and service 21 has no further VCU page. Next: capture while
        driving, one mode per labelled session.
      what_to_test:
        - "Drive mode (Eco/Normal/Sport): a byte that steps with the mode while driving"
        - "Regen level (0-3): a byte that steps with the level while coasting or braking"
      sources:
        - "Kia Soul EV VMCU CSV — drive-mode/state bits"
    - type: scan
      target: "22 E001-E010"
      status: done
      priority: P1
      vehicle_states: [ACC]
      notes: >-
        The Ioniq 5 (OBDb) exposes drive mode, regen level and other drive data at 22 E001-E010.

      date: "2026-07-22"
      result: >-
        All 16 DIDs E001-E010 answer NRC 0x12 with the ignition on (2026-07-22): service 22 E0xx is
        not implemented on this KWP2000 VCU.
      sources:
        - "OBDb Ioniq 5"
      updated: "2026-07-23"
    - type: scan
      target: "0x7E1 22 0101-0105"
      status: nrc
      priority: P3
      vehicle_states: [ACC]
      notes: 0x7E1 answers 22 0101-0105 with a negative response.
    - type: scan
      target: 21 00-FF
      status: done
      priority: P2
      vehicle_states: [READY]
      date: "2026-07-22"
      result: >-
