    - type: verify
      target: how the head unit starts and stops AC charging
      status: pending
      priority: P1
      vehicle_states: [PLUGGED, CHARGING]
      created: "2026-10-30"
      updated: "2026-10-30"
      result: >-
        The EU head unit has no start or stop command; its only charge control is the scheduling
        mode: Charge Now sends mode 0, Charge on Schedule resends the saved off-peak mode (1 no
        window, 2 off-peak enabled, 3 charge only in the window). It goes out as HU_EV_P_01 (MM-CAN
        0x57A byte 4 bits 1-0, with the off-peak windows in bytes 0-3), the gateway forwards it to
        P-CAN as 0x588, and the VCU stores it, re-broadcasts it on 0x579 and starts or stops the
        charge itself using the gateway clock 0x567. The dedicated start/stop frame HU_GW_P_00 is
        never built and is dropped by the MICOM.
      notes: >-
        OBC_SESSION_FLAGS bit 2 follows the charger pilot PWM. All seven recorded charger-ended
        sessions went 0x76 -> 0x72 with the pilot at 100 % duty; the one car-side stop (2026-08-05
        15:28, 95 % SOC) kept the PWM and went 0x76 -> 0x7E with VCU_POWER_STATE 7 -> 6. A stop by
        the scheduling mode should look like the car-side stop.
      sources:
        - ioniq-avn-fw EU firmware (GreenCar DepartureClimateActivity/EconomyReservationSettingActivity, IviServer GreenCarMessageSetting, MICOM tables); uhi22 IoniqMotorCAN P-CAN trace 2022-07-22 and Ioniq28Investigations logs; canair OBC 2101 captures; 2026-10-30
      what_to_test:
        - "Plugged in at home and charging: in 'Charging and Climate Settings' switch to 'Charge on Schedule' with an off-peak window that excludes now and 'Charge ONLY during the time shown below' ticked, then back to 'Charge Now'. Expect AC_INPUT_A to fall to 0 with the pilot still offered (OBC_SESSION_FLAGS 0x76 -> 0x7E, VCU_POWER_STATE 7 -> 6), then resume."
        - Repeat with off-peak enabled but the box unticked (mode 2) and with off-peak disabled (mode 1), to learn which modes stop an ongoing charge.
      capture_protocol: >-
        canair monitor OBC:2101 VCU:2101 BMS:2101 --save --keep-all --interval 2 --label 'head-unit
        charge mode start/stop' --state CHARGING; press s at each menu change and name the mode.
    - type: scan
      target: KWP2000 service support (0x30, 0x31, 0x3B, 0x27) and session 10 90
      status: pending
      priority: P2
      vehicle_states: [IG3]
      created: "2026-11-07"
      updated: "2026-11-07"
      notes: >-
        Find out whether the VCU implements a write, routine or IOControl service before looking for
        a schedule or remote-start path in it. Only service-21 pages 01, 02 and F2 answer, and only
        session 81 is accepted (82 and 83 answer NRC 0x12). Read support from the NRC, never by
        running the service: 0x11 means absent, 0x12 or 0x13 means present. Hyundai/Kia KWP2000
        units do implement WriteDataByLocalIdentifier: the Kia Soul EV TPMS module accepts 3B writes
        after a 27 01 that needs no key. canair's blocklist refuses every 3B request, even a bare
        SID, so 3B waits for the planned 'scan services --include-risky'. 10 90 is the
        extended-session alias the Soul EV BMS uses; canair refuses it on a KWP2000 ECU until
        profile.yaml grants it. Never send 10 85 or 10 86. uhi22 runs an EPCU alone on a bench
        (CN1000 P3 and Q3 to 12 V), a safe place for anything beyond the NRC probe.
      sources:
        - plans/2026-10-29-service-id-enumeration.md
        - profiles/hyundai-ioniq-ae-ev/references/kia-soul-ev-can-messages.xlsx (OBD PIDs and BMC sheets)
        - https://github.com/uhi22/Ioniq28Investigations/blob/main/EPCU_ElectronicPowerControlUnit/readme.md
      what_to_test:
        - "Bare 30 and bare 31 (no local id): NRC 0x11 means absent, 0x12 or 0x13 present"
        - "27 01 (seed request only, never a key): a seed or an NRC other than 0x11 means SecurityAccess exists"
        - 3B presence, once scan services --include-risky exists
        - 10 90, after deciding to grant it in profile.yaml
      capture_protocol: >-
        With IG3 on (READY, charging, or IGPM 2F BC44 03): canair raw 7E2:30 --save --label 'VCU
        service probe' --state IG3, then the same for 7E2:31 and 7E2:2701. Record each NRC.
    - type: decode
      target: 2101 B10:6 charge-timer inhibit (Soul 'CH tmr Inh')
      status: pending
      priority: P3
      vehicle_states: [PLUGGED]
      created: "2026-11-07"
      updated: "2026-11-07"
      notes: >-
        On the Kia Soul EV, the VMCU 2101 byte with the P/R/N/D bits has b5 'ECO off sw', b6 'CH tmr
        Inh' and b7 'Immobilizer?'. Here B10:0-3 are the gear bits, so B10:6 is the candidate.
        B10:4, B10:6 and B10:7 read 0 in all 13,183 stored 2101 replies (2026-11-07), and no capture
        had a charge schedule pending. B10:5 is GEAR_SIGNAL_VALID here, not an ECO switch.
      sources:
        - profiles/hyundai-ioniq-ae-ev/references/kia-soul-ev-can-messages.xlsx (VMCU_Data sheet)
        - canair decode VCU:2101 --try --stats, 2026-11-07
      what_to_test:
        - "Plugged in with 'Charge on Schedule' and an off-peak window that excludes now: B10:6 reads 1 while the charge waits and 0 after switching to 'Charge Now'"
      capture_protocol: >-
        canair monitor VCU:2101 OBC:2101 --save --keep-all --interval 2 --label 'charge timer
        inhibit' --state PLUGGED; press s at each menu change.
    - type: verify
      target: "remote climate and charge start: the TMU path and what the OBD port reaches"
      status: pending
      priority: P2
      vehicle_states: [IG3]
      created: "2026-11-07"
      updated: "2026-11-07"
      notes: >-
        Hyundai's 2017 Ioniq Electric manual (VCU Main Features) lists 'Reserve/Remote Charge/A/C:
        remote control via Center/Smartphone through synchronization with TMU', so a remote start is
        a CAN request from the telematics unit, not a diagnostic service. The US head unit defines
        that request as TMU1 0x587 (CF_TMU_IG3RLY, AIRCONCTR, CHARGECTR;
        research/IONIQ_AVN_FW_FINDINGS.md section 6). The EU car has no TMU, and the EU head unit's
        UDS server has no charge or climate service (ioniq-avn-fw micom-can-findings.md section 7C).
        The same manual has the climate unit run its compressor and heater only within the power the
        VCU allows. On a Kona the gateway passes only listed diagnostic ids from the OBD port
        (research/IGPM_FINDINGS.md section 4); the Ioniq's table is not measured. IGPM 2F BC44 03
        wakes the IG3 controllers but starts nothing: in the 2026-11-06 test, plugged in,
        VCU_POWER_STATE read 6 and BMS_MAIN_RELAY stayed 0.
      sources:
        - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Hybrid%2FElectric%20Powertrain/Electric%20Converters%20and%20Controllers/Electric%20Power%20Control%20Unit%20%28EPCU%29%20%28EV%29/Vehicle%20Control%20Unit%20%28VCU%29/Description%20And%20Operation/Description/Main%20Features/
        - profiles/hyundai-ioniq-ae-ev/research/IONIQ_AVN_FW_FINDINGS.md
        - profiles/hyundai-ioniq-ae-ev/research/IGPM_FINDINGS.md
        - ioniq-avn-fw docs/micom/micom-can-findings.md sections 7B and 7C
        - https://github.com/tylerharvey/Ioniq5_CAN
        - canair align VCU:2101 BMS:2101 IGPM:22BC07 --label BC44, 2026-11-07
      what_to_test:
        - "With a P-CAN tap on IGPM I/P-G pins 1 and 2: does a 0x587, 0x55C or 0x588 frame sent at the OBD port appear on P-CAN?"
        - "On the P-CAN tap, with IG3 on: does a 0x587 frame with AIRCONCTR set start the climate? The gateway sends 0x55C and 0x588 itself, so an injected copy competes with its own."
    - type: verify
      target: who wakes the car for a scheduled start, and which clock it uses
      status: pending
      priority: P2
      vehicle_states: [PLUGGED]
      created: "2026-11-07"
      updated: "2026-11-07"
      notes: >-
        Only the head unit keeps a running clock; the IGPM forwards a frozen copy on 0x567 (IGPM
        research entry on 0x567), and the VCU cannot keep time while parked (the EPCU supply needs
        its wake line; the VCU never answers asleep). So something must wake the car at a scheduled
        start. Candidates: the head unit (its kernel has RTC alarm wake), the IGPM holding a
        countdown (it already closes its IG3 relay for the parked 12 V top-up), or the OBC holding a
        countdown (schedules need the cable plugged in). The claim that a schedule ran with the AVN
        fuse pulled is unconfirmed: the 2026-10-22 capture behind it shows only the timer icon, with
        the car in READY. BMS OPERATING_TIME ([B57:B60], seconds awake) times the wake without
        polling in the waiting window, so the test does not keep the bus awake.
      sources:
        - profiles/hyundai-ioniq-ae-ev/ecus/igpm.yaml
        - uhi22 IoniqMotorCAN Traces/Logging126 and Logging127
        - uhi22 Ioniq28Investigations EPCU readme (CN1000 P3 wake line)
        - ioniq-avn-fw docs/power-sleep-model.md (RTC alarm wake)
        - projectgus hyundai-kona-ev-can-logs 221228-5-2019-scheduled-charge-session.csv
      what_to_test:
        - "No start: the head unit is the waker"
        - "Start at about T + (S - P): the VCU used the frozen IGPM time and handed off a countdown"
        - "Start at T: something else keeps time; IG3_RELAY_OUTPUT (22BC07 B12:3) = 1 means the IGPM closed IG3, 0 with VCU_IG3_ON = 1 means the OBC's relay"
        - Repeat with a different S - P to separate the last two cases, and once with the AVN fuse in as a control
      capture_protocol: >-
        Plugged in. Set a departure time T about 30 min ahead with the head unit. Pull the AVN fuse
        at time P; keep the car awake until S, then: canair read BMS:2101 --save --label 'scheduled
        wake: before lock' --state PLUGGED, and lock. Send nothing until T + 10 min. Then: canair
        read BMS:2101 VCU:2101 IGPM:22BC07 HVAC:220100 OBC:2101 --save --label 'scheduled wake:
        after T' --state PLUGGED. Start time = read time minus the OPERATING_TIME gain since the
        first read (assumes no other wake in between).
  sessions:
    "81":
      name: "standardDiagnosticSession"
      supported: true
    "82":
      name: "periodicDiagnosticSession"
      supported: false
      nrc: 0x12
      nrc_desc: "subFunctionNotSupported"
    "83":
      name: "extendedDiagnosticSession"
      supported: false
      nrc: 0x12
      nrc_desc: "subFunctionNotSupported"
