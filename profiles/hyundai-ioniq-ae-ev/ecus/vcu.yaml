        published: the firmware turns it into power through lookup tables and never computes an
        output current (research/VCU_FIRMWARE_FINDINGS.md section 18.6). Not on OBC 2101 or VCU
        2101/2102. Estimate it as VCU_AUX_POWER / VCU_LDC_OUTPUT_VOLTAGE, which gives 9-48 A under a
        137-651 W 12 V load swing at READY (2026-07-30); it inherits VCU_AUX_POWER's unverified
        status. The HV input current is 0x590 byte 6 (HV input power, 10 W) / the DC-link voltage.
      notes: >-
        Also absent from MCU 2102 (motor phase currents) and EWP 21F2. No hidden service-21 page on
        OBC or VCU. VCU 21F2 has no charging capture yet. The Soul's standalone LDC (0x7C5)
        DC_Current_Out has no counterpart here.
      what_to_test:
        - "12 V-only load step at READY (rear defroster, high beams, blower; A/C off) co-polling OBC:2101, VCU:2102, VCU:21F2 and BMS:2101 with --keep-all: pack BATTERY_CURRENT is then the LDC input alone, a cross-check on VCU_AUX_POWER / VCU_LDC_OUTPUT_VOLTAGE. The 2026-07-30 step also ran the A/C compressor."
        - Capture VCU 21F2 with --keep-all while charging, to contrast its analog bytes against READY.
    - type: decode
      target: 12 00 00 freeze frame
      status: pending
      priority: P3
      vehicle_states: [IG3]
      created: "2026-11-08"
      updated: "2026-11-08"
      result: >-
        Layout known from the firmware, not read from the car. ReadFreezeFrameData 12 00 00
        (sessions 81 and 90, no key) returns the newest stored DTC's 27-byte freeze frame, then 00
        and the DTC code; NRC 0x12 when none is stored. Little-endian words: 0-1 BMS SoC, 2-3 12 V
        supply word, 4-5 vehicle speed, 6-9 odometer, 10 flags (EV-ready), 11-12 an operating-time
        counter, 13-18 APS1, APS2 and pedal, 19 the gear state as 2101 B10, 20 the brake switches,
        21-26 LDC detail bytes (byte 23 is the LDC event sub-code that tells the four P0A94 causes
        apart).
      notes: >-
        canair has no KWP2000 freeze-frame decoder. Needs a stored DTC. A clear (14 FF 00) removes
        the evidence, so read before clearing.
      sources:
        - profiles/hyundai-ioniq-ae-ev/research/VCU_FIRMWARE_FINDINGS.md section 21.4
      what_to_test:
        - "With a DTC stored: 12 00 00, then compare the speed, odometer, supply word and gear bytes with a 2101/21F2 read taken at the same time"
      capture_protocol: >-
        canair raw 7E2:120000 --save --label 'VCU freeze frame' --state IG3, only when 18 00 FF 00
        lists a stored DTC
    - type: verify
      target: 2102 LDC ramp at a READY start and a 12 V top-up
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-11-08"
      updated: "2026-11-08"
      notes: >-
        The firmware ramps the LDC output set-point at 0.2 V/s from the measured bus voltage at
        every start, caps the 12 V charge current in steps (41 A for 10 s down to 23-14 A after 2
        h), and runs the LDC states 3 to 7 before the run state (research/VCU_FIRMWARE_FINDINGS.md
        sections 18.3 and 18.4). Stored 2102 reads are 2.5-10 s apart, too slow to see the ramp or
        VCU_LDC_STATE_GE3 rising before VCU_LDC_RUNNING.
      what_to_test:
        - VCU_LDC_STATE_GE3 reads 1 before VCU_LDC_RUNNING at a start
        - VCU_LDC_OUTPUT_VOLTAGE rises about 0.2 V/s from the bus voltage to the set-point
      capture_protocol: >-
        canair monitor VCU:2102 VCU:2101 --save --keep-all --interval 1 --label 'LDC ramp' --state
        READY. Start READY from OFF with the brake, and keep recording for 2 min. Repeat across a
        parked 12 V top-up when one occurs.
    - type: verify
      target: 2101 B11:2 start input and B23:2 ignition input
      status: pending
      priority: P2
      vehicle_states: [ACC]
      created: "2026-11-08"
      updated: "2026-11-08"
      notes: >-
        Firmware: B23:2 is the hard-wired ignition ON/START input (DIO 4, confirmed against IGPM
        IGN1_SWITCH) and B11:2 is the start signal (DIO 5), whose rising edge in P starts READY
        (research/VCU_FIRMWARE_FINDINGS.md section 20.1). B11:2 was set in 1 stored row, 53 s before
        READY. The chart does not test the brake; the smart-key module probably does.
      what_to_test:
        - B11:2 pulses at the start press, with and without the brake
        - B23:2 reads 1 in ON and 0 in ACC
      capture_protocol: >-
        canair monitor VCU:2101 IGPM:22BC03 --save --keep-all --interval 0.5 --label 'start input'
        --state ACC. From OFF press the button once (ACC), again (ON), then OFF, then once with the
        brake (READY). Press s at each press.
    - type: verify
      target: after-run silence at power-off
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-11-08"
      updated: "2026-11-08"
      notes: >-
        Firmware: after key-off the ECU state manager enters after-run (state 2), stops the
        diagnostic task and freezes the model outputs; the VCU then stops answering while the 12 V
        rail is still up (research/VCU_FIRMWARE_FINDINGS.md section 15.2). Stored reads show the VCU
        answering for 1.7-3.1 min after the IG3 fall and then going silent, which fits an after-run
        period of about 3 min (180 s after the ignition input falls, inferred from the firmware). A
        poll at 1 s gives the period to within a second.
      what_to_test:
        - The last VCU answer comes a fixed time after the ignition input falls
      capture_protocol: >-
        canair monitor VCU:2101 --save --keep-all --interval 1 --label 'VCU after-run' --state
        READY. From READY press the button to OFF and keep recording for 5 min.
    - type: verify
      target: 2101 gear PRND enum + ESC cross-check
      status: pending
      priority: P1
      vehicle_states: [READY]
      created: "2026-08-06"
      updated: "2026-11-12"
      notes: >-
        VCU Neutral (GEAR 0x24) is seen in 8 captures, none with ESC:22C101 read during it, so ESC
        GEAR_SELECTOR = 3 for Neutral is still unobserved. On 2026-11-02 (one poll per 7.5 s) the
