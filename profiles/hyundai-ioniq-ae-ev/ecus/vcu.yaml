      vehicle_states: [CHARGING, READY]
      notes: >-
        About 86 bytes. A previous-cycle record like BMS 21F2: odometer, end SOC, range at start and
        end, an event count and fields that change after a drive or charge (B38-B44 after charging),
        plus the ASCII tag 6000 at B95-B99. See the 21F2 research entries.
    1A90:
      status: static
      response_frames: 3
      parameters:
        VIN:
          sensitive: true
          expression: "[B04:B22]"
          type: ascii
          source: canair read VCU:1A80 --reveal vs canair identity VCU, 2026-11-07
          verified: true
          notes: 17 ASCII characters across WiCAN B04-B22, skipping the PCI bytes B08 and B16.
      vehicle_states: [READY]
      notes: >-
        KWP2000 ReadEcuIdentification record 0x90, 19 bytes: the service and record bytes and the
        17-character VIN, nothing else (read 2026-11-07).
    1A80:
      status: static
      response_frames: 15
      vehicle_states: [READY]
      notes: >-
        KWP2000 ReadEcuIdentification record 0x80, 99 bytes: records 8A, 8B, 90, 91, 98, 99, 8C, 8D,
        8E and 92 joined in that order, with no field of its own (read 2026-11-07). It holds the VIN
        (record 90), so the VIN signal is sensitive and its bytes are masked. The only undecoded
        bytes are 1E 09 0D 14 at B15-B19 (record 8B) and B65-B68 (record 99), which canair identity
        labels the manufacturing and programming dates. They are not a BCD or binary date, and the
        OBC reads the same 4 bytes.
      source: canair read VCU:1A80 --reveal vs canair identity VCU, 2026-11-07
      verified: true
      parameters:
        VIN:
          sensitive: true
          expression: "[B20:B38]"
          type: ascii
          notes: Record 0x90.
        VCU_ID_SYSTEM_SUPPLIER:
          expression: "[B04:B14]"
          type: ascii
          notes: Record 0x8A. 10 spaces on this car.
        VCU_ID_HW_NUMBER:
          expression: "[B39:B52]"
          type: ascii
          notes: "Record 0x91: identity part_number and one space."
        VCU_ID_REPAIR_SHOP_CODE:
          expression: "[B53:B63]"
          type: ascii
          notes: Record 0x98. 10 spaces on this car.
        VCU_ID_MODULE_CODE:
          expression: "[B69:B77]"
          type: ascii
          notes: "Record 0x8C: identity ecu_id."
        VCU_ID_SW_ID:
          expression: "[B78:B95]"
          type: ascii
          notes: "Record 0x8D: identity sw_id."
        VCU_ID_CALIBRATION:
          expression: "[B97:B105]"
          type: ascii
          notes: "Record 0x8E: identity calibration."
        VCU_ID_SUPPLIER_HW_NUMBER:
          expression: "[B106:B114]"
          type: ascii
          notes: Record 0x92. 8 zero bytes on this car.
    1AFF:
      response_frames: 1
      status: static
      vehicle_states: [IG3]
      notes: >-
        KWP2000 ReadEcuIdentification record 0xFF, 1 byte: the VCU's test-mode byte. Read 0x00 on
        2026-11-08 (AC charging). Writable with 3B 1A FF in a secured session, which canair refuses.
        Firmware (research/VCU_FIRMWARE_FINDINGS.md sections 3.5, 4.4 and 28.4): a value of 1 makes
        the VCU relay CCP-CAN 0x050/0x051 into 0x590/0x58F, take the pedal, brake and analog inputs
        from CCP-CAN 0x300 and skip the whole LDC and 12 V application layer. It survives a warm
        reset. Its purpose (an end-of-line or bench mode) is inferred.
      parameters:
        VCU_TEST_MODE:
          expression: B03
          type: enum
          values:
            0: normal
            1: bench_test
          min: "0"
          max: "1"
          source: canair read VCU:1AFF 2026-11-08; VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 4.4)
          verified: false
          notes: 0 on this car. 1 is the bench or end-of-line mode (inferred); never seen.

  # Meanings, causes, thresholds and fail-safes are from the Ioniq Electric 2017 service manual.
  # The manual files these codes under its DC/DC Converter chapter and names the reporting module
  # "VCU (LDC)". An entry with a bench source also appeared in a KWP2000 18 00 FF 00 read of an
  # EPCU running alone on a bench (uhi22 CAN/EPCU_torquePro_reading_error_memory_18DTCs_found.csv),
  # status 0x44 each. All six bench codes are in the manual's list. Unless an entry says "Enabled
  # when", the manual checks the code only with the ignition on and the auxiliary battery at 9-16 V.
  # "Also needs" adds to that.
  dtcs:
    source: Ioniq Electric 2017 service manual, DC/DC Converter diagnosis (EV)
    source_links:
      - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Hybrid%2FElectric%20Powertrain/Testing%20and%20Diagnosis/Dc%2FDc%20Converter%20Diagnosis%20%28EV%29/
      - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Quick%20Lookups/DTC%20Index/DTC%20Index%20%28EV%29/Dc%2FDc%20Converter%20DTCS/
    verified: false
    P0504:
      description: Brake switch 'A/B' correlation
      causes: >-
        poor connection, open or short to battery in signal circuit, faulty brake switch, faulty
        brake lamp switch, faulty brake stroke sensor, faulty VCU
      notes: >-
        Threshold: the case that normal open signal of brake and normal close signal of brake are
        same has occurred more than 12 times. Enabled when: ignition on; auxiliary battery 10-16 V.
        DTC set after 2 driving cycles. Service lamp on. Firmware: compares the brake lamp switch
        with the brake test switch while EV-ready; confirms after 2 cycles and lights the service
        lamp.
    P0562:
      description: System voltage low
      causes: >-
        fuse, poor connection, IG power line disconnection, short circuit, charging system (LDC),
        VCU
      notes: >-
        Threshold: voltage is below 10 V. Detection time: 30 sec. Enabled when: ignition on. DTC set
        after 2 driving cycles. Firmware: tests the 2101 12 V supply word while EV-ready, below
        about 9.9 V for 30 s (3,000 counts of 10 ms); confirms after 2 cycles, no lamp.
    P0563:
      description: System voltage high
      causes: >-
        fuse, poor connection, IG power line disconnection, short circuit, charging system (LDC),
        VCU
      notes: >-
        Threshold: voltage is higher than 16 V. Detection time: 30 sec. Enabled when: ignition on.
        DTC set after 2 driving cycles. Firmware: tests the 2101 12 V supply word while EV-ready,
        above about 15.8 V for 30 s; confirms after 2 cycles, no lamp.
    P062F:
      description: Internal control module EEPROM error
      causes: poor connection, faulty VCU
      notes: >-
        Sets on an SPI communication error, an EEPROM write error or an EEPROM read error. DTC set
        immediately. Service lamp on. Firmware: set from the result of an EEPROM access.
    P0630:
      description: VIN not programmed or incompatible-ECM/PCM
      causes: VIN is not programmed
      notes: >-
        Threshold: VIN not programmed in ECU. Detection time: immediately. DTC set immediately. MIL
        on. Firmware: the VIN check is enabled by calibration cell 0x2D5F1, which is 1.
    P0642:
      description: Sensor reference voltage 'A' circuit low
      causes: poor connection, APS2 short circuit
      notes: >-
        Threshold: reference voltage (5 V) is below 4.5 V. Detection time: 0.1 sec. Enabled when:
        ignition on; auxiliary battery 10-16 V. DTC set immediately. MIL on. Firmware: one of the
        two 5 V pedal-sensor supplies read on eQADC B, below 4.5 V over 10 checks.
    P0643:
      description: Sensor reference voltage 'A' circuit high
      causes: poor connection, APS2 short circuit
      notes: >-
        Threshold: reference voltage (5 V) is higher than 5.5 V. Detection time: 0.1 sec. Enabled
        when: ignition on; auxiliary battery 10-16 V. DTC set immediately. MIL on. Firmware: one of
        the two 5 V pedal-sensor supplies read on eQADC B, above 5.5 V over 10 checks.
    P0698:
      description: Sensor reference voltage 'C' circuit low
      causes: poor connection, APS1 short circuit
      notes: >-
        Threshold: reference voltage (5 V) is below 4.5 V. Detection time: 0.1 sec. Enabled when:
        ignition on; auxiliary battery 10-16 V. DTC set immediately. MIL on. Firmware: one of the
        two 5 V pedal-sensor supplies read on eQADC B, below 4.5 V over 10 checks.
    P0699:
      description: Sensor reference voltage 'C' circuit high
      causes: poor connection, APS1 short circuit
      notes: >-
        Threshold: reference voltage (5 V) is higher than 5.5 V. Detection time: 0.1 sec. Enabled
        when: ignition on; auxiliary battery 10-16 V. DTC set immediately. MIL on. Firmware: one of
        the two 5 V pedal-sensor supplies read on eQADC B, above 5.5 V over 10 checks.
    P0A94:
      description: DC/DC converter performance
      causes: LDC input/output wire harnesses and connectors, low battery wire harness, faulty LDC
      notes: >-
        Threshold: Case 1: the difference between the DC-DC converter desired output voltage and
        actual output voltage is 1 V or more for at least 10 seconds; Case 2: the output voltage
        over 22 V. Detection time: 10 s; immediately. Enabled when: ignition on. DTC set after 1
        driving cycle. Service lamp on. Firmware: Case 1 is the target minus the output voltage at
        1.0 V or more for too long, or the output below 8.4 V (latched on the 5th trip); Case 2 is
        the output over-voltage hardware trip. Byte 23 of the freeze frame (the LDC event sub-code)
        tells the four causes apart.
    P0C3A:
      description: DC/DC converter temperature sensor 'A' low
      causes: open temp sensor, open in signal circuit
      notes: >-
        Threshold: sensor signal is above 4.8 V. Detection time: 10 s. Also needs: MCU CAN normal
        reception; MCU temperature sensor in the absence error data; no lack of engine coolant. DTC
        set after 1 driving cycle. Service lamp on. Firmware: raw sensor value at 4.8 V or more for
        10 s, checked only while the MCU's 0x523 temperatures are valid. The sensor is the LDC
        temperature (VCU 2102 VCU_LDC_TEMP, which reads 255 when the sensor is invalid).
    P0C3B:
      description: DC/DC converter temperature sensor 'A' high
      causes: shorted temp sensor, short to ground in signal circuit
      notes: >-
        Threshold: sensor signal is below 0.3 V. Detection time: 1 s. Enabled when: ignition on (SSB
        LED "BLUE"); auxiliary battery 9-16 V. DTC set after 1 driving cycle. Service lamp on.
        Firmware: raw sensor value below 0.3 V for 1 s. The sensor is the LDC temperature (VCU 2102
        VCU_LDC_TEMP).
    P1060:
      description: SBW system error
      causes: SBW system wire harnesses, SBW system component, faulty SBW actuator power relay
      notes: >-
        Threshold: Case 1: current carrying status of a phase among UVW while there is no operation
        of the actuator; Case 2: no current carrying status of a phase that is under the control of
        current carrying during the operation of the actuator; Case 3: no variance in the encoder
        sensor value during the operation of the actuator. Detection time: 500 ms; 64 ms. DTC set
        after 1 driving cycle. Firmware: set from the fault fields the shift-by-wire unit sends in
        CAN 0x10C (value 2 is a fault), and only while the 12 V word is between 9.9 and 15.8 V.
    P1061:
      description: SBW actuator power relay error
      causes: poor connection, UVW wire harnesses, SBW actuator power relay
      notes: >-
        Threshold: actuator power relay high failure - abnormal voltage of UVW phase on the motor
        when the actuator power relay is turned off. Detection time: 500 ms. DTC set after 1 driving
        cycle. Firmware: set from the fault fields the shift-by-wire unit sends in CAN 0x10C (value
        2 is a fault), and only while the 12 V word is between 9.9 and 15.8 V.
    P1062:
      description: SBW actuator error
      causes: poor connection, SBW ACT, abnormality in the parking equipment inside the reducer
      notes: >-
        Threshold: actuator operating conditions maintained over a period of time, or the actuator
        target position and the current position do not match. Detection time: 5 sec. DTC set after
        1 driving cycle. Firmware: set from the fault fields the shift-by-wire unit sends in CAN
        0x10C (value 2 is a fault), and only while the 12 V word is between 9.9 and 15.8 V.
    P1065:
      description: SBW parking learning uncomplete
      causes: SBW system, VCU, communication lines
      notes: >-
        Threshold: learning decision incomplete. Detection time: 100 ms. Also needs: EV ready OFF;
        1600 ms have passed after the initial parking request was received from the VCU. DTC set
        after 1 driving cycle. Firmware: set 1,600 ms after a park request while learning is
        incomplete, and only while the 12 V word is between 9.9 and 15.8 V.
    P1066:
      description: SBW control unit error
      causes: poor connection, SCU
      notes: >-
        Threshold: Case 1: faulty ROM/RAM/CPU; Case 2: overcurrent diagnosis. Detection time: 120
        ms; 24 ms. DTC set after 1 driving cycle. Firmware: set from the fault fields the shift-by-
        wire unit sends in CAN 0x10C (value 2 is a fault), and only while the 12 V word is between
        9.9 and 15.8 V.
    P1676:
      description: Key or immobilizer-type module fault (name not known)
      source: >-
        VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 18.7, 21.2 and
        21.3)
      notes: >-
        Not in the service manual set. Firmware only: reported by a module at 0x196xxx-0x198xxx that
        was not analysed. Hyundai uses P16xx for immobilizer faults, so the meaning is inferred.
        Confirms after 2 cycles, no service lamp.
    P1690:
      description: Key or immobilizer-type module fault (name not known)
      source: >-
        VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 18.7, 21.2 and
        21.3)
      notes: >-
        Not in the service manual set. Firmware only, same module as P1676. Confirms after 2 cycles,
        no service lamp.
    P1696:
      description: Key or immobilizer-type module fault (name not known)
      source: >-
        VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 18.7, 21.2 and
        21.3)
      notes: >-
        Not in the service manual set. Firmware only, same module as P1676. Confirms after 2 cycles,
        no service lamp.
    P1699:
      description: Key or immobilizer-type module fault (name not known)
      source: >-
        VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 18.7, 21.2 and
        21.3)
      notes: >-
        Not in the service manual set. Firmware only, same module as P1676. Confirms after 1 cycle
        (the second operation cycle), no service lamp.
    P1A78:
      description: Check IG3 relay or back up lamp circuit
      causes: fuse, poor connection, IG power line disconnection, short circuit, IG3 relay
      notes: >-
        Threshold: relay defective detectors. Detection time: 10 sec. Also needs: VCU ready ON; EV
        ready ON. DTC set immediately. Service lamp on. Firmware: checks the IG3 relay and back-up
        lamp circuit while EV-ready, and confirms after 2 driving cycles where the manual says
        immediately.
    P1A88:
      description: DC/DC converter cooling system fault
      causes: faulty cooling system, "water pump" water shortage, "water pump" fault
      notes: >-
        Threshold: LDC temperature greater than 221°F (105°C). Detection time: 2 sec. DTC set after
        1 driving cycle. Service lamp on. Firmware: the LDC shuts down above 105 °C for 2 s and
        recovers at 85 °C. The power limiter already derates it from 85 °C (20 % at 105 °C).
    P1A89:
      description: DC/DC converter current sensor fault
      causes: faulty LDC, current sensor circuit failure
      notes: >-
        Threshold: initial value of current sensor over 0.078 V or below -0.13 V. Detection time: 1
        time after calibration complete. DTC set after 1 driving cycle. Service lamp on. Firmware:
        the offset threshold is +0.070 V or below -0.129 V, against 0.078 V and -0.13 V in the
        manual.
    P1A8A:
      description: DC/DC converter temperature sensor fault (second code)
      source: >-
        VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 18.7, 21.2 and
        21.3)
      notes: >-
        Not in the service manual set. Firmware only: reported when the LDC temperature-sensor chart
        reaches its state 4, which was not traced. Confirms after 1 driving cycle and lights the
        service lamp.
    P1A8C:
      description: DC/DC converter input current over fail
      causes: >-
        LDC input/output wire harnesses and connectors, LOW battery wire harness, LOW battery
        deterioration, discharge vehicle jump attempt, LDC failure
      notes: >-
        Threshold: abnormal input current 23.8 A. Detection time: immediately. DTC set after 1
        driving cycle. Service lamp on. Firmware: the input over-current hardware trip disables the
        converter and re-enables it after 100 ticks; the code is set on the 10th trip.
    P1A8D:
      description: DC/DC converter voltage path fault
      causes: >-
        faulty connection between the signal line, junction box fuse or higher, the output voltage
        sensing circuit over, LDC failure
      notes: >-
        Threshold: the output voltage difference between the absolute value of the power control is
        more than 8 V. Detection time: 1 sec. DTC set after 1 driving cycle. Service lamp on.
        Firmware: output sense and 12 V sense differ by more than 8 V for 1 s while the LDC runs.
    P2122:
      description: Throttle/pedal position sensor/switch 'D' circuit low input
      causes: >-
        poor connection, open or short to ground in power circuit, open or short to ground in signal
        circuit, faulty APS
      notes: >-
        Threshold: APS1 voltage is below 0.2 V. Detection time: 0.3 sec. Enabled when: ignition on;
        auxiliary battery 10-16 V; in the absence ratio fault. DTC set immediately. Service lamp on.
    P2123:
      description: Throttle/pedal position sensor/switch 'D' circuit high input
      causes: >-
        poor connection, open or short to ground in power circuit, open or short to ground in signal
        circuit, faulty APS
      notes: >-
        Threshold: APS1 voltage is higher than 4.5 V. Detection time: 0.3 sec. Enabled when:
        ignition on; auxiliary battery 10-16 V. DTC set immediately. Service lamp on.
    P2127:
      description: Throttle/pedal position sensor/switch 'E' circuit low input
      causes: >-
        poor connection, open or short to ground in power circuit, open or short to ground in signal
        circuit, faulty APS
      notes: >-
        Threshold: APS2 voltage is below 0.1 V. Detection time: 0.3 sec. Enabled when: ignition on;
        auxiliary battery 10-16 V; in the absence ratio fault. DTC set immediately. Service lamp on.
    P2128:
      description: Throttle/pedal position sensor/switch 'E' circuit high input
      causes: >-
        poor connection, open or short to ground in power circuit, open or short to ground in signal
        circuit, faulty APS
      notes: >-
        Threshold: APS2 voltage is higher than 2.45 V. Detection time: 0.3 sec. Enabled when:
        ignition on; auxiliary battery 10-16 V. DTC set immediately. Service lamp on.
    P2138:
      description: Throttle/pedal position sensor/switch "D"/"E" volt. correlation
      causes: poor connection, faulty APS
      notes: >-
        Threshold: when the signal value of APS1-APS2 is greater than or equal to threshold.
        Detection time: 0.35 sec. Enabled when: ignition on; auxiliary battery 10-16 V; when the
        input signal APS1, 2. DTC set immediately. Service lamp on. Firmware: correlation of the
        APS1 and APS2 range flags.
    U0001:
      description: High speed CAN communication bus (C-CAN)
      causes: >-
        P-CAN communication line short-circuit the battery power, P-CAN communication line short to
        ground, P-CAN communication line disconnection, P-CAN high line and low line at the same
        time short to ground, poor contact connectors controller
      notes: >-
        Threshold: P-CAN can not send and receive messages. Detection time: 1 sec. Also needs: EPCU
        READY ON; diagnostic approach when kept for more than 0.5 seconds at the state meet
        conditions. DTC set after 2 driving cycles. Service lamp on. Firmware: the P-CAN controller
        is error-passive or bus-off.
    U0103:
      description: Lost communication with gear shift module (SAE meaning)
      source: >-
        VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 18.7, 21.2 and
        21.3)
      notes: >-
        Not in the service manual set. The firmware lists the code but never reports it, so this VCU
        cannot set it. Shift-by-wire communication loss is U1017.
    U0110:
      description: Lost communication with drive motor control module (C-CAN)
      causes: poor connection, CAN communication, open or short in MCU communication line
      notes: >-
        Threshold: if you do not receive data from the MCU. Detection time: 0.5 sec. Also needs: VCU
        (LDC) READY ON. DTC set after 2 driving cycles. Service lamp on. Firmware: timeout of CAN
        0x291, 0x523 and 0x524, the MCU's frames on P-CAN. Ignored while the car is plugged in.
    U0111:
      description: Lost communication with battery energy control module 'A' (C-CAN)
      causes: poor connection, CAN communication, open or short in BMS communication line
      source: >-
        Ioniq Electric 2017 service manual, DC/DC Converter diagnosis (EV); uhi22 EPCU bench DTC
        read (no BMS connected)
      notes: >-
        Threshold: if you do not receive data from the BMS. Detection time: 2 sec. Also needs: VCU
        (LDC) READY ON. DTC set after 2 driving cycles. Service lamp on. Firmware: timeout of CAN
        0x594-0x598 and 0x542, the BMS frames.
    U0129:
      description: Lost communication with brake system control module
      causes: poor connection, CAN communication, open or short in IBAU communication line
      notes: >-
        Threshold: if you do not receive data from the IBAU. Detection time: 2 sec. Also needs: VCU
        (LDC) READY ON. DTC set after 2 driving cycles. Service lamp on. Firmware: timeout of CAN
        0x2A2, 0x220, 0x153, 0x394, 0x507 and 0x386, the ESC and brake frames. Ignored while the car
        is plugged in.
    U0146:
      description: Lost communication with gateway 'A'
      causes: poor connection, CAN communication, open or short in IGPM communication line
      source: >-
        Ioniq Electric 2017 service manual, DC/DC Converter diagnosis (EV); uhi22 EPCU bench DTC
        read (no gateway connected)
      notes: >-
        Threshold: if you do not receive data from the IGPM. Detection time: 0.5 sec ~ 5 sec. Also
        needs: VCU (LDC) READY ON. DTC set after 2 driving cycles. Firmware: timeout of CAN 0x541,
        0x553, 0x490, 0x5D0, 0x450, 0x578, 0x462, 0x5B3, 0x4FE, 0x588, 0x55C, 0x55F, 0x561, 0x567
        and 0x5DF, the frames that pass through the gateway. Confirms after 2 cycles, no lamp.
    U0164:
      description: Lost communication with HVAC control module
      causes: poor connection, CAN communication, open or short in FATC communication line
      source: >-
        Ioniq Electric 2017 service manual, DC/DC Converter diagnosis (EV); uhi22 EPCU bench DTC
        read (no HVAC unit connected)
      notes: >-
        Threshold: if you do not receive data from the FATC. Detection time: 2 sec. Also needs: VCU
        (LDC) READY ON. DTC set after 2 driving cycles. Firmware: timeout of CAN 0x5F5-0x5F9, the
        climate unit frames.
    U04B1:
      description: Invalid data received from battery monitor module
      causes: poor connection, IBS
      notes: >-
        Threshold: IBS express fault message. Enabled when: ignition on; auxiliary battery voltage
        is normal; LDC READY ON. DTC set after 2 driving cycles. Firmware: set by the battery sensor
        (LIN) fault monitor (probable).
    U1001:
      description: High speed CAN communication bus (H-CAN)
      causes: >-
        H-CAN communication line short-circuit the battery power, H-CAN communication line short to
        ground, H-CAN communication line disconnection, H-CAN high line and low line at the same
        time short to ground, poor contact connectors controller
      notes: >-
        Threshold: H-CAN can not send and receive messages. Detection time: 1 sec. Also needs: EPCU
        READY ON. DTC set after 2 driving cycles. Service lamp on. Firmware: the CCP-CAN controller
        is error-passive or bus-off. Hyundai's text calls CCP-CAN, the EPCU's second external bus,
        H-CAN.
    U1005:
      description: Lost communication with drive motor control module (H-CAN)
      source: >-
        VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 18.7, 21.2 and
        21.3)
      notes: >-
        Not in the service manual set. Firmware only: timeout of CAN 0x2C1, the MCU's torque frame
        on CCP-CAN (H-CAN). Ignored while the car is plugged in. Confirms after 2 cycles and lights
        the service lamp after 2 cycles. U0110 is the same loss on P-CAN.
    U1017:
      description: SBW CAN communication error
      causes: poor connection, CAN communication, open or short in SCU communication line
      source: >-
        Ioniq Electric 2017 service manual, DC/DC Converter diagnosis (EV); uhi22 EPCU bench DTC
        read
      notes: >-
        Threshold: if you do not receive data from the SCU. Detection time: 0.5 sec. Also needs: VCU
        (LDC) READY ON. DTC set after 2 driving cycles. Service lamp on. Firmware: timeout of CAN
        0x10C, the shift-by-wire unit. Confirms after 2 cycles with no service lamp, where the
        manual says the lamp is on.
    U1112:
      description: LIN communication error
      causes: poor connection, open or short in LIN communication line, IBS
      source: >-
        Ioniq Electric 2017 service manual, DC/DC Converter diagnosis (EV); uhi22 EPCU bench DTC
        read; owner observation on the 28 kWh Ioniq
      notes: >-
        Stored on the VCU in the 2026-11-01 full DTC scan, taken with the AVN fuse pulled to avoid
        draining the 12 V battery. The 2026-07-22 full scans (the first after KWP2000 DTC reading
        landed) did not list it, but a full sweep omits an ECU with no codes and one whose read
        failed alike, so that cannot prove it was absent then. The uhi22 bench EPCU ran alone on a
        bench and stored this code together with five others. The manual ties it to the LIN line of
        the IBS (battery sensor), not to the AVN. To confirm: clear the VCU DTCs and rescan after a
        drive; if it returns, inspect the IBS connector and LIN wire. Threshold: framing error.
        Enabled when: ignition on; auxiliary battery voltage is normal; LDC READY ON. DTC set after
        2 driving cycles. Service lamp on. Firmware: set by a LIN frame error from the 12 V battery
        sensor, and cleared on the next good frame, so a DTC read can miss it. Confirms after 2
        cycles with no service lamp, where the manual says the lamp is on.
    U1310:
      description: Lost communication with on-board charger
      causes: poor connection, CAN communication, open or short in OBC communication line
      source: >-
        Ioniq Electric 2017 service manual, DC/DC Converter diagnosis (EV); uhi22 EPCU bench DTC
        read
      notes: >-
        Threshold: if you do not receive data from the OBC. Detection time: 2 sec. Also needs: VCU
        (LDC) READY ON. DTC set after 2 driving cycles. Firmware: timeout of CAN 0x57F, the OBC
        frame.
  research:
    - type: verify
      target: "2101"
      status: done
      priority: P1
      vehicle_states: [ACC]
      result: >-
        Neither is on a VCU diagnostic page (VCU firmware, research/VCU_FIRMWARE_FINDINGS.md section
        13). The VCU keeps the drive mode as an index 0-2 (FUN_001B7FE8, stepped by the cluster's
        drive-mode button on 0x578) and the regen level as 0-3 (FUN_001B744C, stepped by the
        paddles); the 2101, 2102 and 21F2 producers read neither. Both go out on P-CAN only: the
        regen level in 0x202 bits 20-23 and the drive mode in 0x579 bits 53-54
        (signals/powertrain.yaml VCU_REGEN_LEVEL, VCU_DRIVE_MODE). 2101 does carry the raw paddle
        switches, B23:0 (minus) and B23:1 (plus). This explains the 2026-07-21 negative result.
        Open: which mode index is Eco, Normal and Sport.
      notes: >-
        Drive mode (Eco/Normal/Sport) and regen level are not found. A 2026-07-21 stationary session
        in D cycling the modes showed no byte on VCU 2101/2102, MCU 2101-2103, BCM 22B0xx or IGPM
        22BCxx stepping with them, and service 21 has no further VCU page. Next: capture while
        driving, one mode per labelled session.
      what_to_test:
        - "Drive mode (Eco/Normal/Sport): a byte that steps with the mode while driving"
        - "Regen level (0-3): a byte that steps with the level while coasting or braking"
      sources:
        - "Kia Soul EV VMCU CSV — drive-mode/state bits"
      updated: "2026-11-08"
    - type: scan
      target: 21 00-FF
      status: done
      priority: P2
      vehicle_states: [READY]
      date: "2026-07-22"
      result: >-
        Service 21 LID sweep 00-FF (ignition on, 2026-07-22): only 01, 02 and F2 answer; all others
        NRC.
    - type: verify
      target: 2101 power-state LED
      status: pending
      priority: P2
      vehicle_states: [ACC]
      created: "2026-07-30"
      updated: "2026-11-02"
      notes: >-
        Map each B11 value (0x80, 0x90, 0x91, 0x92) to the start-button states OFF, ACC (amber) and
        ON (blue). 2026-11-02 (keep-all, co-polled with IGPM 22BC03): 0x92 with IGN1_SWITCH and
        IGN2_SWITCH both 1 (ON), 0x80 with both 0, 0x5A in READY, over 5 off-on cycles. 0x90 and
        0x91 were not seen, so ACC is still unmapped on the VCU; 0x80 can be OFF or ACC. The LED
        itself and the ACC state are decoded elsewhere: SKM 22B007 SSB_LED_ACC/SSB_LED_ON and
        BCM_IGN_STATE_B004 (2026-11-03). Capture: canair monitor VCU:2101 IGPM:22BC03 BCM:22B004
        --interval 1 --keep-all --save, dwelling about 10 s in each state.
    - type: decode
      target: 2102 aux power siblings
      status: pending
      priority: P2
      vehicle_states: [READY]
      created: "2026-07-30"
      updated: "2026-07-30"
      notes: >-
        Find the climate and driving power the dash shows next to electronics. VCU_AUX_POWER is the
        electronics term: flat 256-309 W while the HV climate load swung the pack power 1.29-2.27 kW
        (r=-0.09, 2026-07-22). No byte on VCU 2101/2102/21F2 tracks the climate power (|r|<0.26); on
        the HVAC, HVAC_COMPRESSOR_POWER and HVAC_PTC_LOAD (about 0.25 kW per count) carry it.
        Untested: a broadcast frame.
    - type: decode
      target: SOC mirror search (21F2 open)
      status: captured
      priority: P3
      vehicle_states: [CHARGING, READY]
      created: "2026-08-01"
      updated: "2026-08-01"
      notes: >-
        Live SOC is not on VCU 2101/2102, OBC, AAF, BCM or IGPM; only BMS carries it. VCU 21F2 holds
        the previous cycle end SOC (VCU_21F2_SOC).
    - type: verify
      target: 2101 B10:5 GEAR_SIGNAL_VALID + B25 value 1
      status: pending
      priority: P1
      vehicle_states: [ACC, READY]
      created: "2026-08-06"
      updated: "2026-11-03"
      notes: >-
        2026-11-02 (keep-all, one VCU poll per 7.5 s): B10:5 cleared at each of 5 ignition off-to-on
        edges (10:09-10:13) and both READY starts (09:37, 10:17), always in Park, and set again
        25-35 s later or at the next ignition off; it never cleared at an off edge (6 seen). B25
        read 1 from 30 s after the 10:08 power-off from parked READY until READY at 10:17, in ON and
        OFF alike; after the 11:20 power-off from a drive it stayed 4 for at least 3 min.
        2026-11-03: B10:5 stayed 1 and B25 1 through a parked 12 V top-up, its IG3-off edge (B11
        0x10 to 0x80, 10:16:21) and the 3 min until the VCU went quiet. Open: whether B10:5 drops
        outside Park.
