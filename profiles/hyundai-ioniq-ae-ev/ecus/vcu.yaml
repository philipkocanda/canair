# yaml-language-server: $schema=https://philipkocanda.github.io/canair/schema/ecus.json
# ─── VCU (Vehicle Control Unit) ──────────────────────────────────────
#
# Also called the VMCU.
#
# The VCU is the logical brain of the EV powertrain:
# - Torque requests (accelerator input, cruise control)
# - Drive mode logic
# - Regen braking strength (0-1-2-3) and brake blending
# - Coordination between motor, inverter, battery, and safety systems
# - Calculates remaining range
# - Controls allowed AC power
# - Schedules, decides and runs the parked 12V battery top-up: a check every 24 h kept in its own
#   real-time clock, then 10 or 20 min of LDC charging if the battery is low (the Aux. Battery
#   Saver+ setting is in the cluster's user settings). Firmware: research/VCU_FIRMWARE_FINDINGS.md
#   section 11; how the car powers up for it: see the IGPM research entry.
# - Controls ECO setting and drive modes
# - Preconditioning (climate) timer, charge timer, charge power limit settings.
#
# The Vehicle Control Unit (VCU) and Motor Control Unit (MCU, the inverter)
# are both part of the Electronic Powertrain Control Unit (EPCU) physical housing.
#
# The 12 V DC-DC converter (LDC) is integrated here, not a module of its own:
# - The KWP2000 1A8C ecu_id is "AEVLDC53": VLDC, the VCU with the LDC integrated.
# - uhi22's teardown shows the DC-DC boards inside the EPCU housing, next to the inverter.
# - The VCU firmware decides when the LDC runs (2101 B11:7), packs the LDC frame 0x590 and copies
#   it into 2102 (output power, 12 V rail). The manual files the DC/DC Converter DTCs under
#   "VCU (LDC)" (dtcs below).
# - The OBC has no DC-DC control: its LDC-looking 2101 bytes are its own measurements.
# - No separate LDC module is registered. 0x7C5, the Kia Soul EV's LDC address, has not been
#   probed on this car.
#
# Sessions 0x82 and 0x83 answer NRC 0x12, so only 0x81 is known to work on the car. The firmware
# also defines 0x85, 0x90 and 0xF1, and all three open without SecurityAccess; none was tried live.
# Session 0x90 opens InputOutputControl (0x30), routines (0x31), ECUReset and 0x28/0x29, and some
# of those requests hang the VCU or silence its torque command to the MCU, so canair refuses them
# (research/VCU_FIRMWARE_FINDINGS.md sections 2 and 23). 2103-2105 answer NRC 0x12.
#
VCU:
  tx_id: 0x7E2
  can_bus: [P-CAN]
  identity:
    alias: VLDC  # KWP2000 ecu_id module code (VCU with integrated LDC)
    description: Vehicle Control Unit (integrated LDC)
    part_number: "36601-0E250"
    ecu_id: AEVLDC53  # KWP2000 1A8C — "VLDC": VCU with the LDC integrated
    sw_id: "EAEEO5L-NS7-D060"
    calibration: "C5210617"
    vin: KMHCXXXXXXXXXXXXX
    id_protocol: KWP2000  # 1Axx
    notes: >-
      Vehicle Control Unit (VMCU) with the 12 V DC-DC converter (LDC) integrated: ecu_id AEVLDC53
      ("VLDC") names the combination, and this car has no separate LDC module. The LDC boards sit in
      the EPCU housing with the inverter and the MCU (uhi22 teardown). The VCU decides when the LDC
      runs (VEHICLE_STATE_LDC_ENABLED), reports its output (VCU_AUX_POWER, VCU_LDC_OUTPUT_VOLTAGE)
      and carries its DTCs. The EPCU broadcasts the DC-DC temperature on 0x523 bytes 2-3 (sensor
      R147 on the DC-DC board).
  vehicle_states: [IG3]
  pids:
    2101:
      support_map: {at: 0, length: 4, unit: field, order: msb}
      response_frames: 4
      status: active
      period: 2500
      vehicle_states: [IG3]
      verified: true
      notes: >-
        Stops updating while VCU_IG3_ON (B11:4) is 0. Firmware (producer FUN_001F46C0,
        r13=0x400063E4): B4-B8 are a header written at read time by FUN_00204480, so B9 is a
        constant 0x09 record-format byte, not a signal. B10:6-7, B11:5, B23:7 and B26:7 are never
        written by the producer or by FUN_00204480, so they are unused rather than undecoded. B10
        bit 4 is set when the gear state reads 7, the shifter fault from a latched shift-by-wire
        (SBW) fault; not yet observed on this car. The APS1 (B12/B13), APS2 (B14/B15), accelerator
        (B17/B18), speed (B19/B20) and 12 V supply (B21/B22) signals are each a 16-bit little-endian
        pair in the firmware, confirming the width and byte order of the expressions here. B23 packs
        the regen paddles (bits 0-1), the ignition input (bit 2) and the shift-lever code (bits 3-6,
        from the lever's PWM line). B25 is written as a whole byte (VCU_POWER_STATE) and is valid
        only while VCU_IG3_ON is 1: it keeps its last value for minutes after the fall. B26 copies
        the SBW link: the park request to the SBW unit (bits 0-2, from 0x109), the SBW actuator
        state (bits 3-5) and bit 7 of 0x10C byte 0 (bit 6).
      parameters:
        VCU_VEHICLE_SPEED:
          expression: ((S20*256)+B19)*1.609344/100
          unit: km/h
          min: "0"
          max: "250"
          notes: >-
            Speed in MPH (B20 signed high byte, B19 low byte) converted to km/h. r=0.999 vs
            ESC:22C101:REAL_SPEED_KMH (n=124, 0-105.7 km/h). Reads about 3.6 % above true speed: the
            VCU computes it from motor rpm (rpm / 7.412 reduction ratio) assuming a 2.0 m tyre
            circumference, against 1928 mm real. Above 30 km/h MCU_MOTOR_RPM is 61.8 rpm per km/h of
            this signal (n=1372), against 64.07 from the ratio and the real tyre and 61.8 from the
            firmware's 2.0 m.
          source: VCU 2101 speed lead (MPH formula) + cross-ECU verification vs ESC, 2026-07-23
        ACCEL_PEDAL_DEPTH:
          expression: "B18/2"
          unit: "%"
          min: "0"
          max: "100"
          source: "ITStromer community PID sheet (Accel Pedal Depth = m/2)"
          verified: false
          notes: >-
            B18 = 0 with the pedal released and 200 (100 %) floored (ITStromer sheet). Captures: up
            to 56 % driving, up to 86 % pressed in Park.

        ACCEL_PEDAL_DEPTH_FINE:
          expression: ((B18<<8)|B17)/512
          unit: "%"
          min: "0"
          max: "100"
          source: canair decode --corr 2026-10-21
          verified: false
          notes: >-
            Accelerator pedal position, 16-bit little-endian; B17 is the low byte of
            ACCEL_PEDAL_DEPTH (B18/2). r=+1.000 vs ACCEL_PEDAL_DEPTH over 1607 DRIVING captures.

        GEAR:
          expression: B10
          notes: >-
            Values: 0x21 Park, 0x28 Drive, 0x22 Reverse, 0x24 Neutral (8 captures), 0x01 Park with
            GEAR_SIGNAL_VALID clear (after ignition-on and READY edges). Bits 0-3 are one-hot
            P/R/N/D, bit 5 is GEAR_SIGNAL_VALID; bits 6 and 7 are always 0, and bit 4
            (VCU_GEAR_SHIFTER_FAULT) has never been seen set. The code comes from the SBW gear chart
            (FUN_001B0D04), not from the lever decode.
          type: enum
          values:
            1: park_gear_signal_invalid
            33: park
            34: reverse
            36: neutral
            40: drive
          source: canair bitfield analysis 2026-08-06; same-payload enumeration n=6365
        GEAR_P:
          expression: B10:0
          notes: >-
            Bit 0 of GEAR. Reads 1 exactly when VCU_SBW_ACTUATOR_STATE reads 4 (parked), except one
            power-up row where the actuator state reads 0.
        GEAR_R:
          expression: B10:1
          notes: Bit 1 of GEAR. Matches ESC GEAR_SELECTOR=2 over the 2026-07-26 reversing.
        GEAR_N:
          expression: B10:2
          notes: Bit 2 of GEAR. Set in 8 captures, none with ESC GEAR_SELECTOR read during it.
        GEAR_D:
          expression: B10:3
          notes: Bit 3 of GEAR.
        VEHICLE_STATE_BRAKE_LAMP:
          expression: "B11:0"

        VEHICLE_STATE_NOT_BRAKING:
          expression: B11:1
          notes: >-
            Not the complement of VEHICLE_STATE_BRAKE_LAMP: both read 0 in most captures with the
            drive path down (VCU_POWER_STATE 7). Meaningful only while VCU_POWER_STATE is 4.

        VEHICLE_STATE_EV_READY:
          expression: "B11:3"

        VCU_IG3_ON:
          expression: "B11:4"
          notes: >-
            IG3 rail powered. When it falls (B11 = 0x80) the OBC, BMS, MCU, AAF and HVAC stop
            answering within a few seconds and VCU 2102 stops updating, while the VCU, IGPM and BCM
            answer for another 1.7-3.1 min (the VCU 3 min 4 s after the 2026-11-03 top-up ended).
            Equals VCU_IG3_ON_MIRROR (BMS 2101 B61:3) in 10845 of 10846 aligned rows. 1 in READY, AC
            and DC charging, the 12 V top-up and ignition-on standby. Reads 1 in the uhi22 EPCU
            bench log (EPCU on its 12 V and wake-line pins only) while VCU_IGN_ON reads 0, so it
            follows the EPCU wake input, not the ignition.
          source: canair cross-ECU response-presence analysis 2026-10-23 (stored captures + JejuSoul US Ioniq logs)


        VEHICLE_STATE_EV_READY_MIRROR_B11_6:
          expression: B11:6
          notes: >-
            Set in every READY row and equal to VEHICLE_STATE_EV_READY (B11:3) in every capture on
            this car. In the JejuSoul US Ioniq logs it reads 1 with B11:3 at 0 at power-off (B11 =
            0xD0 after a drive, 0xD2 after an AC charge), so it is a separate signal: the firmware
            sets it in power state 2, HV up and start-ready, and VCU_POWER_STATE 2 appears there
            too. Disabled so it does not ship a duplicate.
          source: canair bitfield analysis 2026-08-06; decode --find-mirrors --bits, n=6365 unanimous
          ship: false
        VEHICLE_STATE_LDC_ENABLED:
          expression: "1-B11:7"
          verified: false
          notes: >-
            Inverse of the application's LDC-off request (B11:7, also 0x592 bit 56). 1 at READY (B11
            = 0x5A), while charging and during the parked 12 V top-up (B11 = 0x10); 0 in accessory
            or off (B11 = 0x92, 0x91, 0x80). With VCU_POWER_STATE == 1 it is the TOPUP state
            predicate: it matches the 640 VCU 2101 rows of the three recorded top-ups (2026-10-21,
            2026-10-30, 2026-11-03) and no other row. Does not tell ACC, ON and off apart. Not the
            LDC's own state: see VCU 2102 VCU_LDC_RUNNING.

        VCU_APS1_VOLTAGE:
          expression: ((B13<<8)|B12)/2048
          unit: V
          verified: false
          notes: >-
            Accelerator pedal sensor track 1, 16-bit little-endian. r=+0.996 vs ACCEL_PEDAL_DEPTH
            (n=1607, DRIVING). About 1.97x VCU_APS2_VOLTAGE. Reads 0.80 V released and 3.55 V at
            87.5 % pedal. Scale check: 3.93 V at full pedal in the uhi22 EPCU bench log, where his
            multimeter reads 3.97 V.
          source: canair decode/align 2026-10-21; uhi22 EPCU bench 2026-10-29
          min: "0"
          max: "5"
        VCU_IGNITION_INPUT:
          expression: B23:2
          source: canair historical analysis 2026-07-23; VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 20.1, DIO 4); canair align vs IGPM IGN1_SWITCH 2026-11-08
          notes: >-
            The hard-wired ignition ON/START input (DIO 4), not an inverter state. Equals IGPM
            IGN1_SWITCH: 1 in 494 of 497 aligned rows with it on, 0 in 2499 with it off. Also set in
            READY (r=+0.997 vs VEHICLE_STATE_EV_READY, n=776). The input blocks a remote climate
            start and the 12 V top-up.
          min: "0"
          max: "1"
        VCU_POWER_STATE:
          expression: B25
          min: "0"
          max: "11"
          source: canair historical analysis 2026-07-23; VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 20.1, FUN_001ABEBC); canair captures 2026-11-08
          notes: >-
            The VCU power-state machine, valid only while VCU_IG3_ON is 1: 305 rows keep the last
            value for up to 84 s after it falls. Seen on this car: 4 drive-ready (READY), 7 charging
            (AC, DC and plugged-in preconditioning), 6 at entry to and exit from a charge, 1 standby
            (ignition on but not READY, the parked 12 V top-up and the 3 min after a top-up ends). 2
            appears only in the JejuSoul US Ioniq logs at power-off, with B11 = 0xD0, and fits HV up
            with the start-ready flag B11:6 set. Values 0, 3, 5 and 8-11 never occur in this car's
            stored rows, and their names come from the firmware. 8 is a fault latched until
            power-off (crash, BMS or MCU fault flags); it reads 8 in the uhi22 EPCU bench log, where
            the VCU stores no-communication DTCs for the BMS, gateway and HVAC. Sent in 0x200 bits
            24-27.
          type: enum
          values:
            0: inactive
            1: standby
            2: hv_up_start_ready
            3: start_inhibited
            4: drive_ready
            5: drive_inhibited
            6: charge_connected
            7: charging
            8: fault
            9: low_soc_stop
            10: hv_lost_in_ready
            11: ready_off
        VCU_SUPPLY_VOLTAGE:
          expression: ((B22<<8)|B21)/2072
          min: "0"
          max: "16"
          source: canair align fit 2026-10-21
          verified: false
          notes: >-
            12 V supply voltage at the VCU, 16-bit little-endian. r=+0.995 vs
            VCU_AUX_BATTERY_VOLTAGE_FINE (n=10357). The /2072 scale is fitted and matches the MCU
            and ESC supply words; /2048 reads about 1.2 % high.
          unit: V
        VCU_SBW_SWITCH_PWM_CODE:
          expression: B23:3+B23:4*2+B23:5*4+B23:6*8
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 27.5, FUN_001A7AB4); canair bitfield analysis 2026-08-06
          verified: false
          notes: >-
            Code the VCU decodes from the PWM output of the shift-by-wire (SBW) switch module (EPCU
            pin 23, eMIOS 3), in 10 % duty steps: 7-13 % is 1, 17-23 % 2, 27-33 % 3, 37-43 % 4,
            47-53 % 6, 67-73 % 5, 87-93 % 7, other duty above 3 % 8, at or below 3 % 0. It is the
            gear logic's fallback when 0x354 is lost. The car has P, R, N and D push buttons, and
            which code means which button is not established. Stored replies: 0 in 9205 rows, 6 in
            4498, 2 in two rows with GEAR neutral (2026-11-02, 2026-11-12), 4 in one row with GEAR
            neutral and 1 in one row with GEAR drive (both 2026-11-12). Code 6 is probably no button
            pressed. It follows the ignition input within a poll or two (bits 4 and 5 are set
            together), so it also behaves like an ignition mirror. Bit 6 is never set.
          type: enum
          values:
            0: no_signal
            6: idle_probable
        GEAR_SIGNAL_VALID:
          expression: B10:5
          source: canair bitfield analysis 2026-08-06; n=6365, 4 transitions in the 2026-07-30 power-cycle session
          verified: false
          notes: >-
            Set in P, R, N and D. Clear in 10 captures, all at power-mode transitions on 2026-07-30
            with the car in Park.
        VCU_POWER_STATE_B25_1:
          expression: B25:1
          source: canair correlate, 2026-08-08 DCFC-2
          verified: false
          notes: >-
            Bit 1 of VCU_POWER_STATE: set exactly when it reads 6 or 7. Not a DC-charging flag.
            Disabled so it does not ship a duplicate; defined so the bit is accounted for.
          ship: false
        VCU_APS2_VOLTAGE:
          expression: ((B15<<8)|B14)/2048
          unit: V
          min: "0"
          max: "5"
          source: canair decode/align 2026-10-21; uhi22 EPCU bench 2026-10-29
          verified: false
          notes: >-
            Accelerator pedal sensor track 2, 16-bit little-endian. About half of VCU_APS1_VOLTAGE
            (ratio median 1.97). Reads 0.42 V released and 1.80 V at 87.5 % pedal. Scale check: 2.06
            V at full pedal in the uhi22 EPCU bench log, where his multimeter reads 2.00 V.
        VCU_IGN_ON:
          expression: B11:0|B11:1
          min: "0"
          max: "1"
          source: canair cross-tab vs IGPM 22BC03 IGN1_SWITCH 2026-10-23
          verified: false
          notes: >-
            Ignition on: one of the two brake-switch contacts (VEHICLE_STATE_BRAKE_LAMP,
            VEHICLE_STATE_NOT_BRAKING) reads 1 with the ignition on, both read 0 with it off. Equals
            IGPM IGN1_SWITCH in all 360 aligned rows, including charging with the ignition on. Does
            not tell ACC from off.
        VCU_REGEN_PADDLE_MINUS:
          expression: B23:0
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 13), producer FUN_001F46C0 and paddle logic FUN_001B744C
          verified: false
          notes: >-
            Steering-paddle switch that lowers the regen level (a rising edge steps it down by one,
            in D). uhi22 wires the right paddle, 'decrease recuperation', to EPCU pin 3H. Reads 0 in
            every capture so far.
        VCU_REGEN_PADDLE_PLUS:
          expression: B23:1
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 13), producer FUN_001F46C0 and paddle logic FUN_001B744C
          verified: false
          notes: >-
            Steering-paddle switch that raises the regen level (left paddle, EPCU pin 3J per uhi22).
            Reads 0 in every capture so far.
        VCU_GEAR_SHIFTER_FAULT:
          expression: B10:4
          min: "0"
          max: "1"
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 7.1 and 19.4, FUN_001F46C0)
          verified: false
          notes: >-
            Set when the shift-by-wire gear state reads 7, a latched SBW fault (DTCs P1060-P1066).
            Reads 0 in every stored reply.
        VCU_START_INPUT:
          expression: B11:2
          min: "0"
          max: "1"
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 20.1, FUN_001AE2C4); canair captures 2026-11-08
          verified: false
          notes: >-
            Hard-wired input DIO 5, probably the smart key (SMK) start signal: in the firmware, a
            rising edge in P starts READY. Set in 1 stored row, 53 s before READY.
        VCU_SBW_PARK_REQUEST:
          expression: B26:0+B26:1*2+B26:2*4
          min: "0"
          max: "7"
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 7.1 and 19.4, FUN_001F46C0); canair captures 2026-11-12
          verified: false
          notes: >-
            Copy of the park request that the VCU sends to the shift-by-wire (SBW) unit in 0x109
            byte 0 bits 0-2 (VCU_PARK_REQUEST in signals/powertrain.yaml). Reads 0 in all 13512
            stored replies.
        VCU_SBW_ACTUATOR_STATE:
          expression: B26:3+B26:4*2+B26:5*4
          type: enum
          values:
            1: released
            2: moving
            4: parked
          min: "0"
          max: "7"
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 7.1 and 19.4, FUN_001F46C0); canair captures 2026-11-12
          notes: >-
            Copy of the SBW actuator state, 0x10C byte 0 bits 0-2 (SBW_ACTUATOR_STATE in
            signals/powertrain.yaml). Stored replies: 4 in P (11704 rows), 1 in R, N and D (1807),
            and 0 in one row at a power-up with GEAR 0x01 (2026-10-25). Reads 0 in all 250 replies
            of the uhi22 EPCU bench log, which has no shifter and so no 0x10C frame. Value 2 comes
            from uhi22's 0x10C trace and never occurs in 2101.
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
        VCU_SBW_10C_BIT7:
          expression: B26:6
          min: "0"
          max: "1"
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 7.1 and 19.4, FUN_001F46C0); canair captures 2026-11-12
          verified: false
          notes: >-
            Copy of 0x10C byte 0 bit 7. Set in 1 of 13512 stored replies (2026-10-25 12:22:31,
            VCU_POWER_STATE 1, 53 s before READY), the same row where VCU_START_INPUT reads 1.
    2102:
      response_frames: 4
      status: active
      period: 10000
      vehicle_states: [IG3]
      notes: >-
        Stops updating while VCU_IG3_ON (2101 B11:4) is 0: every read after the fall repeats the
        first one byte for byte, so readings taken with the IG3 rail off are not live. Motor RPM,
        torque and temperatures are not on this page; they are on the MCU (0x7E3). Firmware
        (producer FUN_0021AD44, r13=0x400063E4): B4-B7 are a constant header (F8 F8 00 00), not
        signals. Most of the page is a diagnostic copy of the VCU's own LDC broadcast frame 0x590.
        The LDC runs inside the VCU, so B9, B10 and B13 are converter states, not relay states:
        0x590 byte 0 bits 1, 2 and 3 (LDC state 3 or above, LDC running, output limited). B11 and
        B12 are byte 1 bits 0 and 1: B11 is never set in this build, B12 is the LDC fault warning.
        B14, B15 and B18 are bytes 4, 2 and 7 (output voltage, output power, LDC temperature + 100),
        and B17 is CCP-CAN 0x58F byte 5. B12 and B13 read 0 in all 14657 captures, so they are
        inactive on this car rather than undecoded. The four 16-bit little-endian pairs are packed
        from internal floats with a fixed scale, which confirms the expressions here: B19/B20 and
        B26/B27 are x1000 (VCU_LDC_OUTPUT_VOLTAGE and VCU_AUX_BATTERY_VOLTAGE_FINE), B23/B25 is x100
        (VCU_DCLINK_VOLTAGE, whose high byte alone is the coarse variant since 256/100 = 2.56), and
        B21/B22 is x100 of a float carried in units of 10 W, which is why VCU_AUX_POWER's /10 reads
        correct watts. B14 is B19/B20 rounded to 0.1 V. The LDC measures its output current but
        never publishes it: derive it as VCU_AUX_POWER / VCU_LDC_OUTPUT_VOLTAGE.
      min: "0"
      verified: false
      parameters:
        VCU_INVERTER_INPUT_VOLTAGE:
          expression: "B17*2"
          unit: V
          max: "450"
          source: "Kia Soul EV VMCU CSV (Inverter Input Voltage = f*2)"
          verified: true
          notes: >-
            HV DC-link voltage, which is the pack voltage. r=0.998 vs OBC:2101:OBC_BATTERY_SIDE_V
            (n=5689, slope 0.5024 on the raw byte). 396 V vs BMS pack 396.4 V while charging on
            2026-07-20.

        VCU_LDC_OUTPUT_VOLTAGE_COARSE:
          expression: B14/10
          unit: V
          max: "16"
          source: VCU firmware EAEEO5L-NS7-D060 (FUN_00219F0C packs it, FUN_0021AD44 copies it into 2102); canair decode VCU 2102 --try --stats 2026-11-08
          verified: true
          notes: >-
            0.1 V copy of VCU_LDC_OUTPUT_VOLTAGE: the firmware rounds the same internal value x10
            into 0x590 byte 4 and copies that byte here. B14/10 minus [B19:B20]/1000 has median 0.00
            and stdev 0.03 V over 14657 captures. The earlier fitted x0.0974 tracked the battery,
            about 0.08 V lower.


        VCU_DCLINK_VOLTAGE_COARSE:
          expression: "B25*2.56"
          unit: V
          max: "450"
          ship: false
          source: "canair historical analysis 2026-07-23"
          notes: >-
            About 2.56 V per LSB; r=+0.950 vs VCU_INVERTER_INPUT_VOLTAGE (n=1672), median residual
            about 1 V. Disabled as a lower-resolution duplicate.
        VCU_AUX_POWER:
          expression: ((B22<<8)|B21)/10
          unit: W
          max: "6553"
          source: 2026-07-30 dash anchor (130->650 W); low byte B21 per decode/align 2026-10-21
          notes: >-
            LDC output power, 16-bit little-endian. 0 whenever VCU_LDC_RUNNING is 0. Matched the
            dash electronics bar from 130 to 650 W (2026-07-30) and rose 195 to 601 W with the rear
            and side defrosters. Excludes HV climate power. Firmware: the measured output power in
            units of 10 W, x100; B15 x 10 vs this is r=0.999.
        VCU_AUX_POWER_COARSE:
          expression: B15*10
          unit: W
          max: "2550"
          source: "2026-07-30: B15*10 vs [B22:B23]/10 r2=0.994"
          notes: 10 W per LSB; r²=0.994 vs VCU_AUX_POWER.
        VCU_LDC_OUTPUT_VOLTAGE:
          expression: ((B20<<8)|B19)/1000
          source: canair hunt vs OBC:2101:OBC_12V_SUPPLY_V 2026-10-21
          notes: >-
            12 V bus voltage at the LDC, 16-bit little-endian. r=+0.997 vs OBC:2101:OBC_12V_SUPPLY_V
            (n=11057, slope 1.019). Reads 0.02-0.22 V above VCU_AUX_BATTERY_VOLTAGE_FINE; the gap
            tracks VCU_AUX_POWER (r=+0.86). Firmware: the LDC output-voltage channel (AN2, 0.0061066
            V per count, 25 V full scale).
          unit: V
          max: "16"

        VCU_AUX_BATTERY_VOLTAGE_FINE:
          expression: ((B27<<8)|B26)/1000
          source: canair hunt vs BMS:2101:AUX_BATTERY_VOLTAGE 2026-10-21; Kia e-Niro VMCU sheet
          notes: >-
            12 V battery voltage, 16-bit little-endian. r=+0.996 vs BMS:2101:AUX_BATTERY_VOLTAGE
            (n=10542, slope 0.998). Same offset as the Kia e-Niro VMCU sheet; the e-Niro 12 V
            current and SOC that follow it are not in the Ioniq reply. Firmware: the 12 V supply
            behind the reverse-polarity diode (AN1, 0.006775 V per count plus 0.6 V).
          unit: V
          max: "16"
        VCU_LDC_TEMP:
          expression: B18-100
          source: RE 2026-08-05 cross-ECU offset-mirror + within-PID state-divergence disambiguation; VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 18.6, 0x590 byte 7)
          notes: >-
            The LDC's own temperature sensor (the DC/DC converter temperature sensor of DTCs P0C3A,
            P0C3B and P1A88), sent as temperature + 100. B18 = 255 means the sensor is invalid and
            decodes to 155. It tracks the motor coolant because the converter sits on the coolant
            plate: equals AAF:2181:MOTOR_COOLANT_TEMP exactly in 77 % of 1729 co-polled rows. Moves
            opposite to the 12 V bus in ON. Rose 29 to 44 °C over a 3 h AC charge. The limiter
            derates the LDC from 85 °C.
          unit: °C
          min: "-40"
          max: "150"
        VCU_LDC_RUNNING:
          expression: B10
          max: "1"
          source: RE 2026-08-02, live ON confirmed; VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 18.3, FUN_0021EFA4)
          verified: true
          notes: >-
            1 while the LDC state machine is in its run state (0x590 byte 0 bit 2), the converter
            enables on. Went 1 to 0 as OBC_BATTERY_SIDE_V fell 206 to 6.7 V, and agrees with
            BMS_MAIN_RELAY there. 0 means the LDC is off, inhibited, calibrating or in standby, not
            that HV is off: 37 rows have the DC link at 250-379 V. The 450 rows with
            VCU_LDC_STATE_GE3 = 1 and this 0 are the application's LDC-off request: 2101 B11:7 is 1
            in 456 of the 457 that join a 2101 read. Reads 0 in ON.
        VCU_DCLINK_VOLTAGE:
          expression: ((B25<<8)|B23)/100
          unit: V
          max: "450"
          source: canair decode/align 2026-10-21
          notes: >-
            HV DC-link voltage, 0.01 V/bit, 16-bit little-endian split across the PCI byte B24. B25
            alone is VCU_DCLINK_VOLTAGE_COARSE (r=1.000). Read within 0.1-0.6 V of
            BMS:2101:BATTERY_VOLTAGE while driving on 2026-08-08. Firmware: the LDC HV input channel
            (AN0, 0.15635 V per count).
        VCU_LDC_STATE_GE3:
          expression: B9
          min: "0"
          max: "1"
          source: VCU firmware EAEEO5L-NS7-D060 (FUN_0021F08C, research/VCU_FIRMWARE_FINDINGS.md section 18.3) + cross-tab vs VCU_LDC_RUNNING over 14657 captures, 2026-11-08
          notes: >-
            1 while the LDC state machine is in state 3 or above: recovering, inhibited, standby,
            calibrating or running (0x590 byte 0 bit 1). 0 in states 0-2: the 12 V outside 8-18 V,
            the wake supply lost, or a hard fault. A single status bit, not a byte. Never 0 while
            VCU_LDC_RUNNING is 1: 0 in 9 of 14657 captures, against 450 with VCU_LDC_RUNNING 0.
        VCU_LDC_FAULT_WARNING:
          expression: B12
          min: "0"
          max: "1"
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 18.6, 0x590 byte 1 bit 1)
          verified: false
          notes: LDC fault warning. A single status bit; 0 in all 14657 stored replies.
        VCU_LDC_OUTPUT_LIMITED:
          expression: B13
          min: "0"
          max: "1"
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md sections 18.5 and 18.6, 0x590 byte 0 bit 3)
          verified: false
          notes: >-
            1 while the power limiter lowers the LDC voltage command (output power over its ceiling
            of at most 1.4 kW, or LDC temperature above 85 °C). A single status bit; 0 in all 14657
            stored replies, where the LDC never passed 866 W or 50 °C.
        VCU_LDC_RESERVED_B11:
          expression: B11
          min: "0"
          max: "1"
          source: VCU firmware EAEEO5L-NS7-D060 (research/VCU_FIRMWARE_FINDINGS.md section 18.6, 0x590 byte 1 bit 0)
          verified: false
          notes: >-
            Never set in this build; 0 in all 14657 stored replies. Defined so the byte is accounted
            for.
          ship: false
    21F2:
      status: slow
      period: 300000
      response_frames: 13
      source: canair 21F2 cross-check vs live data 2026-10-21
      verified: false
      parameters:
        VCU_21F2_EVENT_COUNT:
          expression: ((B76<<8)|B75)
          min: "0"
          max: "65535"
          source: canair 21F2 vs BMS:2101 charge flags 2026-10-21
          notes: >-
            Event counter, 16-bit little-endian (B76 reads 3 in every capture, so the high byte is
            unproven until B75 wraps). Only rises, flat within a cycle: 784 on 2026-07-22, 847 on
            10-19, 857 on 10-30. From 07-30 to 08-15 each rise follows an ended AC charge or a
            plugged-in preconditioning run; DC charges, drives and parked days added nothing. The
            2026-10-21 parked 12 V top-up did not move it.
        VCU_ODOMETER:
          expression: (B14 | (B15 << 8) | (B17 << 16) | (B18 << 24)) / 256
          unit: km
          min: "0"
          max: "1000000"
          source: monotonic-counter sweep of all captures 2026-07-22..08-05; cross-checked vs the verified CLU 22B002 ODOMETER
          notes: >-
