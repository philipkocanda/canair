AMP:
  tx_id: 0x783
  can_bus: [MM-CAN]
  identity:
    description: Audio Amplifier (external - Infinity audio system)
    id_protocol: none  # NRC 0x11 on all UDS F1xx and KWP2000 1Axx
    identity_confidence: confirmed  # behaviorally: DTCs map 1:1 to speaker channels
    notes: >-
      External Infinity amplifier (address match 783/78B in the Kia e-Niro CAN sheet). No identity
      data: 22, 1A, 21, 27, 2F and KWP 17/18 return NRC 0x11, even in the extended session. Supports
      only services 10, 14, 19 and 3E; service 19 implements only sub-function 0x02
      (readDTCByStatusMask), so no snapshot or extended DTC data. Its DTCs are open-load faults on
      the premium-audio speaker channels, which confirms the identity.
  dtcs:
    source: owner-provided Infinity premium-audio channel map
    verified: false
    B2915:
      description: "Front Left Woofer — Open Load"
    B2916:
      description: "Front Right Woofer — Open Load"
    B2919:
      description: "Front Center — Open Load"
    B291A:
      description: "Rear Left Woofer — Open Load"
    B291B:
      description: "Rear Right Woofer — Open Load"
    B2920:
      description: "Subwoofer 1 — Open Load"
    B2921:
      description: "Amplifier channel — Open Load (channel unidentified; the car has one rear sub)"
      source: "owner-confirmed single rear sub"
