  research:
    - type: iocontrol_scan
      target: "2F F000-F0FF"
      status: done
      date: "2026-04-19"
      priority: P1
      vehicle_states: [ACC, CHARGING]
      result: >-
        F011, F013-F018 and F022-F027 answer ReturnControlToECU (00) with 6F {DID} 00 00; F012
        accepts only ShortTermAdjustment (03). 03 needs value bytes (NRC 0x13 without them). E0xx,
        B0xx, C0xx, 01xx, F1xx and 00xx: all NRC 0x31.
      notes: The value-byte format for ShortTermAdjustment (03) is unknown.
    - type: verify
      target: "220100"
      status: done
      priority: P1
      vehicle_states: [ACC]
      updated: "2026-10-22"
      notes: >-
        The Ioniq 5 220100 signals mostly do not port: (B15/2)-40 gives no sensible temperature (B15
        is HVAC_UNKNOWN_B15) and B34 (HVAC_UNKNOWN_B34) is not a temperature. Vehicle speed at bix
        232 does port (B38, HVAC_VEHICLE_SPEED).
      sources:
        - "OBDb Ioniq 5 — 220100 signals (did not port to the 2017)"
    - type: decode
      target: 2201A0 actuator doors
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-10-22"
      notes: >-
        B7 is the mode door (positions in HVAC_ACTUATOR_TARGET_2); B5, B9 and B11 move together at
        session-dependent offsets. Recirculation and driver-only set no flag on 2201A0 or 220100.
        Open: hold each direction about 30 s, noting each, to map B7 and B5.
    - type: decode
      target: 220100 B14/B34/B35 signals
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-10-22"
      notes: >-
        HVAC_UNKNOWN_B14, B34 and B35 vary but are undecoded; B34 does not follow the blower
        (r=-0.07, 2026-07-26). Open: change heat and fan one at a time and see which moves.
    - type: decode
      target: 2201A1/A2/A3 sensor pages
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-27"
      updated: "2026-10-22"
      notes: >-
        Beyond the decoded compressor and heating signals and the copies of known bytes, A1-A3 carry
        several 16-bit words that co-move with temperatures under heating; A1 B68 steps with the fan
        (5 at fan 1-2, 10 at fan 3-8). Open: vary one temperature or actuator at a time, hold, note,
        then hunt each remaining word against the isolated reference.
    - type: decode
      target: compressor vs PTC power split
      status: done
      priority: P2
      vehicle_states: [READY]
      created: "2026-10-21"
      updated: "2026-10-27"
      result: >-
        PTC share = HVAC_HEAT_POWER - HVAC_COMPRESSOR_POWER in heat-pump mode; under A/C cooling
        HVAC_HEAT_POWER is 0 and HVAC_COMPRESSOR_POWER is the whole draw (2026-10-27).
      notes: >-
        Not yet seen: a PTC-only session with the heat pump off, to confirm HVAC_HEAT_POWER minus
        the compressor equals the PTC share.
      sources:
        - BMS:2101 BATTERY_POWER - VCU:2102 VCU_AUX_POWER residual, 2026-10-21
      what_to_test:
        - >-
          Heater with A/C and heat pump off (PTC only): compressor signals stay at 0 while B42
          rises
      capture_protocol: >-
        canair monitor 'BMS:2101 VCU:2102 HVAC:220100,220102,2201A0,2201A1,2201A2,2201A3' --save
        --keep-all --label 'HVAC power split' --state READY. Parked, 3 min per mode: climate off,
        then heat at max with A/C off, noting each change with 's'.
    - type: decode
      target: "220100 HVAC_HEAT_PUMP_TEMP and duct temperatures: which sensors"
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-23"
      updated: "2026-10-23"
      notes: >-
        The DATC reads an in-car sensor, an ambient sensor, an evaporator sensor, two duct sensors
        (vent and floor) and, with the heat pump, two refrigerant sensors. Open: whether
        HVAC_HEAT_PUMP_TEMP (B13, falls to 6 °C on A/C start) is the evaporator sensor and
        HVAC_DUCT_TEMP_1/2 (B36/B37) are the duct sensors.
      what_to_test:
        - >-
          A/C on at a fixed blower speed for 10 minutes: check whether B13 cycles with the
          compressor. Then switch between face and floor modes and see which of B36/B37 follows
          the mode door.
      capture_protocol: >-
        canair monitor HVAC:220100 --save --keep-changes --interval 2 --label 'A/C cycling and mode
        change' --state READY; press s at A/C on and at each mode change.
    - type: decode
      target: 220100 byte map (B05-B07, B09)
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-29"
      updated: "2026-10-29"
      result: >-
        The constant map 7E 50 07 C8 marks 14 data bytes (one bit per byte, MSB first): B11-B15,
        B17, B20, B22, B34-B38 and B42. Every varying byte and every defined signal is inside it.
      notes: >-
        B20 and B42 are the marked bytes with no decoded meaning (disabled candidates). 2201A0-A3
        not tested.
      sources:
        - byte sweep over all stored HVAC captures, 2026-10-29
      what_to_test:
        - >-
          Capture HVAC 220100 with --keep-all across blower steps, modes and A/C on/off; time B20
          and B42 against each change.
    - type: verify
      target: 2FF00002
      status: pending
      priority: P3
      vehicle_states: ["ON"]
      created: "2026-10-30"
      updated: "2026-10-30"
      notes: >-
        Newer Hyundai/Kia ECUs answer 2F F000 02 with a 4-byte bitmap of the supported IOControl
        DIDs F001-F020 (F020 and F040 cover the next 32 each). The 2026-04-19 returnControlToECU
        sweep found no F000 here. F000 is not an actuator, so 02 there drives nothing.
      sources:
        - Hyundai/Kia WPC diagnostic spec (IOControl supported check)
      what_to_test:
        - canair raw 7B3:2FF00002 --session (expect NRC 0x31 if absent)
        - "if positive: canair raw 7B3:2FF02002 --session"
