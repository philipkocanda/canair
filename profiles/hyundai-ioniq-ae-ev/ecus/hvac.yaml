# ─── HVAC (Heating, Ventilation, Air Conditioning) ────────────────────
HVAC:
  tx_id: 0x7B3
  can_bus: [P-CAN, CLIMATE-CAN]  # CLIMATE-CAN from US wiring; unconfirmed on the EU car
  iocontrol_scan_ranges: [F000-FFFF]
  identity:
    alias: DATC  # Dual Automatic Temperature Control
    description: Climate Control
    part_number: "97250-G7060"
    mfg_date: "2017-05-30"
    firmware: "AE_EV DATC(-)1.0"
    fw_version: "1.03"
    id_protocol: UDS  # F1xx
    serial: "1705304705"
    notes: >-
      Climate control unit (DATC — Dual Automatic Temperature Control). Live data is only on service
      22 DIDs 0100, 0102 and 01A0-01A6; service 21 is not supported (NRC 0x11). Supplied by battery,
      the ON line (IGN2) and IG3; there is no ACC feed. The electric compressor and PTC heater sit
      on a small separate CAN bus with the DATC, not on the P-CAN. Taken from US-market wiring;
      unconfirmed on the EU car.
  vehicle_states: ["ON", IG3]
  scan_log: # HVAC
    - service: 0x31
      range: "E000-E0FF"
      date: 2026-04-20
      hits: 0
      probes: 256
      vehicle_states: [SLEEP]
      notes: "256 errors — no response without ignition"
    - service: 0x21
      range: "01-10"
      date: 2026-04-17
      hits: 0
      vehicle_states: [ACC]
    - service: 0x22
      range: "0100-01FF"
      date: 2026-04-17
      hits: 9
      vehicle_states: [ACC]
      notes: "0100, 0102 and 01A0-01A6 respond."
    - service: 0x22
      range: "E000-E020"
      date: 2026-04-17
      hits: 0
      vehicle_states: [ACC]
    - service: 0x21
      range: "01, F2"
      date: 2026-10-22
      hits: 0
      probes: 2
      vehicle_states: [READY]
      notes: "Both NRC 0x11 (serviceNotSupported)."
    - service: 0x10
      range: "01, 03"
      date: 2026-10-22
      hits: 2
      probes: 2
      vehicle_states: [READY]
      notes: "Default (01) and extended (03) diagnostic sessions supported."
    - service: 0x22
      range: "0100-01FF"
      date: 2026-10-22
      hits: 9
      probes: 256
      vehicle_states: [READY]
      notes: >-
        In the extended session (10 03): the same nine DIDs as in the default session. 01A5 and
        01A6 returned only 2 bytes in this sweep.
    - service: 0x22
      range: "0000-00FF, 0200-02FF, 1000-10FF, B000-B1FF, C000-C1FF, D000-D0FF, E000-E1FF,
        F000-F0FF, F200-F2FF"
      date: 2026-10-22
      hits: 0
      probes: 3072
      vehicle_states: [READY]
      notes: "Default session; every DID returned an NRC."
  pids:
    220100:
      support_map: {at: 0, length: 4, unit: byte, order: msb}
      response_frames: 6
      status: active
      period: 30000
      vehicle_states: ["ON", IG3]
      notes: >-
        38-byte response (35 data bytes after the DID) of sensor and actuator status; set
        temperature, fan level, mode and recirculation are not here. Constant in all 1758 captures:
        B5=0x7E, B6=0x50, B7=0x07, B9=0xC8, and 0xFF at B10, B18, B19, B21, B23, B25-B31, B33, B39,
        B41, B43 and B44. 2201A3 B33-B36 and B41 carry copies of B15, B22, B17, B20 and B34.
      source: Original WiCAN config
      verified: false
      parameters:
        HVAC_INTERIOR_TEMP:
          expression: (B11/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          verified: true
          notes: >-
            Cabin air temperature. 9.5-38.5 °C across 1758 captures. 2201A0 B14 is a copy.
        HVAC_AAT:
          expression: (B12/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          verified: true
          notes: >-
            Ambient air temperature at the HVAC sensor. 8-31.5 °C across 1758 captures. 2201A0 B17
            is a copy.
        HVAC_HEAT_PUMP_TEMP:
          expression: (B13/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          verified: true
          notes: >-
            Refrigerant-circuit temperature, 2.5-32.5 °C across 1758 captures. Fell from 27.5 to
            6 °C within a minute of the A/C starting (2026-07-21); 6-21.5 °C during heat-pump
            heating. Which sensor is unknown.
        HVAC_UNKNOWN_B15:
          expression: B15
          min: "0"
          max: "255"
          source: canair investigate/correlate 2026-08-02; HVAC audit 2026-10-22
          notes: >-
            16-239 across 1758 captures. 235-239 with the compressor off; during A/C cooling it
            falls and saturates at 16, recovering when the A/C stops (2026-10-25). r=+0.42 vs
            HVAC_HEAT_PUMP_ON, -0.74 vs HVAC_AAT (n=1420).
        HVAC_UNKNOWN_B17:
          expression: B17
          min: "0"
          max: "255"
          source: "Monitor session 2026-04-17"
          notes: 16-240 across 1758 captures, 21 distinct values. Not a mirror of B15.
        HVAC_UNKNOWN_B22:
          expression: "B22"
          min: "0"
          max: "255"
          source: "Monitor session 2026-04-17; HVAC audit 2026-10-22"
          notes: >-
            13-240 across 1758 captures, mostly 16 (873) and 239 (492). Stayed at 16-17 through
            A/C on and off on 2026-07-21.

        HVAC_DUCT_TEMP_1:
          expression: (B36/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          notes: >-
            Name is unconfirmed. 7.5-66 °C across 1758 captures; 63.5-66 °C during heat-pump
            heating at a 30 °C set point (2026-07-22), 13-27.5 °C under A/C (2026-07-21).
        HVAC_DUCT_TEMP_2:
          expression: (B37/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          notes: >-
            Name is unconfirmed. 8-61 °C across 1758 captures; 55-57.5 °C during heat-pump heating
            at a 30 °C set point (2026-07-22), 15.5-26.5 °C under A/C (2026-07-21).
        HVAC_UNKNOWN_B34:
          expression: B34
          min: "0"
          max: "100"
          source: coverage analysis 2026-07-23; HVAC audit 2026-10-22
          notes: >-
            0-78 across 1758 captures. r=-0.17 vs HVAC_AAT, -0.40 vs HVAC_INTERIOR_TEMP, +0.19 vs
            blower (n=1420).
          enabled: true
        HVAC_UNKNOWN_B14:
          expression: B14
          min: "0"
          max: "59"
          source: coverage analysis 2026-07-23
          notes: 0-59 across 1758 captures. r=-0.70 vs 2201A0 B5 (n=1420).
          enabled: true
        HVAC_UNKNOWN_B35:
          expression: B35
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          notes: 70-246 across 1758 captures. r=-0.54 vs blower fan feedback (n=1420).
          enabled: true
        HVAC_VEHICLE_SPEED:
          expression: B38
          unit: km/h
          ha_class: speed
          min: "0"
          max: "255"
          source: OBDb Hyundai-IONIQ-Electric (7B3 22 0100 bix 232, VSS_7B3) + canair align 2026-10-27
          notes: >-
            Whole km/h; non-zero only while driving (0-107). r=0.97 vs VCU:2101:VCU_VEHICLE_SPEED
            (1135 of 1213 rows equal), r=0.985 vs ESC wheel speeds.
          enabled: true
        HVAC_UNKNOWN_B20:
          expression: B20
          source: support-bitmap sweep 2026-10-29
          notes: >-
            Marked by the 220100 support map. 24 values, 16-241 (129, 16, 240 and 73 most common);
            r=+0.49 vs blower.
          enabled: false
        HVAC_UNKNOWN_B42:
          expression: B42
          source: support-bitmap sweep 2026-10-29
          notes: Marked by the 220100 support map. 0 or 1; 1 in 522 of 3051 captures.
          enabled: false
    220102:
      response_frames: 3
      status: active
      period: 10000
      vehicle_states: []
      notes: >-
        16-byte response (13 data bytes after the DID) of secondary temperatures and the heat-pump
        flag. Constant in all 950 captures: B5=0xFF, B6=0x80, and 0x00 at B7, B9, and B14.
      source: Monitor session 2026-04-17
      min: "0"
      verified: false
      parameters:
        HVAC_HEAT_EXCHANGER_TEMP:
          expression: (B10/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          notes: >-
            Name is unconfirmed. 8.5-79 °C across 950 captures. Rose from 24 to 57 °C during A/C
            cooling (2026-07-21).
        HVAC_HEAT_EXCHANGER_TEMP_2:
          expression: (B11/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          notes: Name is unconfirmed. 8-45.5 °C across 950 captures.
        HVAC_HEAT_PUMP_ON:
          expression: "B17"
          max: "1"
          source: >-
            Monitor session 2026-04-17; heat-pump vs PTC 2026-07-22; A/C cooling 2026-07-21
          verified: true
          notes: >-
            1 exactly when 2201A0 HVAC_HEAT_MODE is 2, heat pump (all 1420 time-joined rows); 1 in
            127 of 950 captures. 0 throughout A/C cooling with the compressor running
            (2026-07-21), so it does not indicate the compressor in cooling.

        HVAC_HEAT_PUMP_ON_MIRROR_B18:
          expression: "B18"
          max: "1"
          notes: >-
            0/1. Agrees with HVAC_HEAT_PUMP_ON in 915 of 950 captures; 1 in 152, against 127.

        HVAC_HOTSIDE_TEMP:
          expression: B19
          unit: °C
          ha_class: temperature
          max: "127"
          source: Monitor session 2026-04-17; reclassified 2026-07-20; OBDb label added 2026-10-27
          notes: >-
            Raw byte in °C, 16-82 across 950 captures. Tracks MCU_HEATSINK_TEMP at r=+0.87 (n=435,
            slope 0.82); r=+0.80 vs HVAC_HEAT_EXCHANGER_TEMP. OBDb labels this byte 'Inverter
            temperature' (bix 96) with raw/2-40, which reads -32 to 1 °C here.
        HVAC_HEAT_PUMP_ON_MIRROR_B12:
          expression: B12
          source: coverage analysis 2026-07-23
          notes: >-
            0/1, equal to B13 and B15 in every capture. Agrees with HVAC_HEAT_PUMP_ON in 945 of 950
            captures; 1 in 122, against 127.
          enabled: true
          max: "1"
    2201A0:
      response_frames: 9
      status: active
      period: 10000
      vehicle_states: ["ON", IG3]
      notes: >-
        59-byte response (56 data bytes after the DID): set temperature, heating source, blower
        feedback, air-door positions and temperature copies. Copies of other bytes: B10 = B9, B20 =
        B19, B45 = B44, B51 = B6 and B52 = B7 in every capture; B14 = 220100 B11 and B17 = 220100
        B12 in over 98 % of time-joined rows. Constant in all 2256 captures: B28=0x28, B39=0x0A,
        B42-B43=0xFF, and 0x00 at B22, B54, B57, B58, B61-B63, and B65. B21 reads 0, 90 or 96, and
        B23 is 0 exactly when B21 is non-zero (one exception).
      source: Monitor session 2026-04-17
      min: "0"
      verified: false
      parameters:
        HVAC_SET_TEMP_DRIVER:
          expression: "B44"
          unit: "°C"
          display: "f'{v} °C'"
          min: "15"
          max: "32"
          verified: true
          notes: "Set temperature in °C: 15, 20 and 30 matched the console exactly."

        HVAC_SET_TEMP_PASSENGER:
          expression: "B45"
          unit: "°C"
          display: "f'{v} °C'"
          min: "15"
          max: "32"
          verified: true
          notes: Equals HVAC_SET_TEMP_DRIVER in every capture (single-zone car).

        HVAC_A0_UNKNOWN_B23:
          expression: "B23"
          max: "1"
          source: "Monitor session 2026-04-17; HVAC audit 2026-10-22"
          notes: >-
            0/1. 0 exactly when B21 is non-zero (one exception in 2256 captures): all of 2026-04-17
            and the first part of the 2026-08-08 preconditioning. 1 in every other session.

        HVAC_A0_UNKNOWN_B25:
          expression: "B25"
          max: "1"
          source: "Monitor session 2026-04-17; HVAC audit 2026-10-22"
          notes: >-
            0/1. 1 in 372 of 375 resistive-heating rows and in every heat-pump row; with no heating
            it reads 0 in 1534 rows and 1 in 217 (time-joined against HVAC_HEAT_MODE).

        HVAC_HEAT_MODE:
          expression: B06
          max: "2"
          source: 2026-07-26 heater-high session (regime split vs HVAC_HEAT_PUMP_ON)
          notes: >-
            Heating source: 0 off, 1 resistive heater (PTC), 2 heat pump. 2 exactly when 220102
            HVAC_HEAT_PUMP_ON is 1. Reads 1 at 8-13.5 °C ambient (2026-08-08, 2026-10-22). Copied at
            B51, 2201A1 B21 and 2201A2 B19.
          type: enum
          values:
            0: "off"
            1: ptc_resistive
            2: heat_pump

        HVAC_DEFROST_FLAGS:
          expression: (B58 << 8) | B59
          display: "f'0x{v:04X}'"
          max: "65535"
          notes: >-
            Reads 0x0000, or 0x00FF in 40 of 2256 captures (the 2026-04-17 defogger test and
            2026-07-21). B58 is 0 in every capture. Bits not decoded.
        HVAC_ACTUATOR_TARGET_1:
          expression: B5
          max: "255"
          source: coverage analysis 2026-07-23; mode-cycle capture 2026-07-26
          notes: >-
            Air-door position, 2-209 across 2256 captures. Moves with B9 and B11 (r >= 0.995,
            n=1420) at an offset that differs between sessions. r=+0.51 vs B7.
          enabled: true
        HVAC_ACTUATOR_TARGET_2:
          expression: B7
          max: "255"
          source: coverage analysis 2026-07-23; mode-cycle capture 2026-07-26
          notes: >-
            Mode door position, by direction at 21 °C (2026-07-26): face about 122, face and legs
            137-157, floor about 230, floor and windshield about 237; repeats vary by about 20.
            Copied at B52; 2201A1 B22 and 2201A2 B20 follow it (r=+0.998 and +0.999).
          enabled: true
        HVAC_ACTUATOR_TARGET_3:
          expression: B9
          max: "255"
          source: coverage analysis 2026-07-23
          notes: 1-218 across 2256 captures. B10 equals B9 in every capture.
          enabled: true
        HVAC_ACTUATOR_TARGET_4:
          expression: B11
          max: "255"
          source: coverage analysis 2026-07-23
          notes: 6-221 across 2256 captures.
          enabled: true
        HVAC_AAT_MIRROR_B17:
          expression: (B17/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: HVAC audit 2026-10-22 (time-joined against 220100)
          notes: Equals 220100 HVAC_AAT in 1418 of 1420 time-joined rows.
          enabled: true
        HVAC_INTERIOR_TEMP_B13:
          expression: (B13/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: HVAC audit 2026-10-22 (time-joined against 220100)
          notes: >-
            Within 1.5 °C of 220100 HVAC_INTERIOR_TEMP in 1329 of 1420 time-joined rows; r=+0.98.
            B14 equals HVAC_INTERIOR_TEMP in 1405.
          enabled: true
        HVAC_AAT_B15:
          expression: (B15/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: HVAC audit 2026-10-22 (time-joined against 220100)
          notes: >-
            0-4 °C above 220100 HVAC_AAT in 1190 of 1420 time-joined rows (range -0.5 to +9 °C);
            r=+0.89 vs HVAC_AAT.
          enabled: true
        HVAC_A0_UNKNOWN_B47:
          expression: B47
          max: "255"
          source: coverage analysis 2026-07-23; HVAC audit 2026-10-22
          notes: >-
            227 distinct values (0-255) across 2256 captures; consecutive samples mostly differ by 0
            or a few counts. No correlation found.
          enabled: true
        HVAC_A0_UNKNOWN_B50:
          expression: B50
          max: "255"
          source: coverage analysis 2026-07-23; HVAC audit 2026-10-22
          notes: >-
            250 distinct values (0-255) across 2256 captures; consecutive samples mostly differ by 0
            or a few counts. No correlation found.
          enabled: true
        HVAC_BLOWER_FAN_SPEED:
          expression: B18
          max: "121"
          source: HVAC fan-only + fan 1->MAX->1 sweep captures 2026-07-26
          verified: true
          notes: >-
            Blower speed feedback; plateaus 40-121 for fan levels 1-8 (2026-07-26 sweep). Values
            between plateaus appear when vent or recirculation changes alter the airflow load.
          type: enum
          values:
            40: Fan 1
            52: Fan 2
            65: Fan 3
            77: Fan 4
            90: Fan 5
            102: Fan 6
            111: Fan 7
            121: Fan 8 (MAX)
        HVAC_PRECONDITIONING_ACTIVE:
          expression: B41
          max: "1"
          source: preconditioning session 2026-08-08 vs all other HVAC captures
          notes: >-
            0-2. 1 throughout the 2026-08-08 preconditioning session (368 captures); 2 during PTC
            heating while charging on 2026-10-25 07:11-08:22 (242 captures); 0 otherwise, including
            with the preconditioning timer armed but not running (2026-10-22).
    2201A1:
      response_frames: 9
      status: draft
      vehicle_states: ["ON", IG3]
      notes: >-
        59-byte response (56 data bytes after the DID). B6, B9 and B11 change fast. B21 equals
        2201A0 B6 (heat mode) in 1419 of 1420 time-joined rows and B22 follows 2201A0 B7
        (r=+0.998). B12 and B13 read 1 except in 26 (all 2026-04-17) and 71 of 1657 captures.
        B14 is 0 in every capture; B15 reads 120 in 1500 of 1657. B68 reads 5 at fan 1-2 and
        mostly 10 at fan 3-8.
      parameters:
        HVAC_COMPRESSOR_POWER:
          expression: "[B57:B58]/1000"
          unit: kW
          ha_class: power
          min: "0"
          max: "6"
          source: "RE 2026-10-27: parked pack residual vs 2201A1, 2026-07-30 and 2026-08-09"
          verified: true
          notes: >-
            Electric A/C compressor input power, 16-bit big-endian in W (shown as kW); 0-1.33 kW
            across 1692 captures. Parked in READY with the PTC off, BMS BATTERY_POWER minus
            VCU_AUX_POWER/0.9 = 1.09 x this + 0.08 kW (r=0.957, n=71). Equals
            HVAC_COMPRESSOR_CURRENT x about 358 V. In heat-pump mode it reads 0.53-0.63 kW and is
            included in HVAC_HEAT_POWER. Mirrored at [B30:B31] in 82 % of captures.
        HVAC_COMPRESSOR_CURRENT:
          expression: "[B33:B34]/10"
          unit: A
          ha_class: current
          min: "0"
          max: "20"
          source: "RE 2026-10-27: ratio to HVAC_COMPRESSOR_POWER"
          verified: false
          notes: >-
            16-bit big-endian, 0-3.7 A across 1692 captures (B33 always 0). HVAC_COMPRESSOR_POWER /
            this gives a median 358 V against a 365 V pack; no independent current reference.
            Mirrored at [B59:B60]. Can read 0 while the power word is non-zero at ramp edges (21
            captures).

    2201A2:
      response_frames: 8
      status: active
      period: 10000
      notes: >-
        51-byte response (48 data bytes after the DID), mostly 16-bit words. B19 equals 2201A0 B6
        (heat mode) in 1419 of 1420 time-joined rows and B20 follows 2201A0 B7 (r=+0.999). Constant
        in all 1499 captures: B45=0xFF, B46=0xD8, and 0x00 at B10, B30, B35, B37, B39, B43, B55, B58
        and B59.
      vehicle_states: ["ON", IG3]
      min: "0"
      max: "255"
      verified: false
      parameters:
        HVAC_HEAT_POWER:
          expression: B42/10
          unit: kW
          max: "12"
          source: >-
            2026-07-26 heater-high + 2026-07-22 heat-pump sessions vs BMS BATTERY_POWER; pack minus
            LDC residual 2026-10-21
          verified: true
          notes: >-
            High-voltage heating draw (resistive heater and heat pump), 0.1 kW per bit. Parked in
            READY it equals pack power minus the LDC input (median ratio 0.99, r=0.88, n=129,
            2026-10-21); r=0.956 vs BMS BATTERY_POWER (n=152, 0.25-4.39 kW, 2026-07-26). 0 with
            climate off and during A/C cooling.
        HVAC_COOL_LOAD_B41:
          expression: B41
          source: 2026-07-21 AC-cooling + 2026-07-26 heating (align time-series)
          notes: >-
            10-60 across 1499 captures; 20 at idle. Read 50-60 under A/C on 2026-07-21 but stayed 20
            throughout A/C cooling on 2026-10-25, so it does not track cooling power. 10 or 20
            during heating, independent of HVAC_HEAT_MODE.
        HVAC_HEAT_LOAD_B17:
          expression: B17
          unit: A
          source: 2026-07-26 heater-high vs 2026-07-21 cooling
          notes: >-
            0-11 across 1499 captures; r=+0.97 vs HVAC_HEAT_POWER (n=1420), reading 9-11 at
            4.0-4.5 kW. 0 during A/C cooling. The ampere unit is not confirmed.
        HVAC_A2_UNKNOWN_B44:
          expression: B44
          source: 2026-07-21 cooling + 2026-07-26 heating; HVAC audit 2026-10-22
          notes: >-
            8-49 across 1499 captures. r=+0.68 vs 220102 HVAC_HEAT_EXCHANGER_TEMP, -0.20 vs
            HVAC_HEAT_PUMP_TEMP (n=1420).
    2201A3:
      response_frames: 8
      status: draft
      vehicle_states: ["ON", IG3]
      notes: >-
        53-byte response (50 data bytes after the DID). B33, B34, B35, B36 and B41 carry 220100 B15,
        B22, B17, B20 and B34 (equal in 91-98 % of time-joined rows). B15 is non-zero (48-58) in
        heat-pump mode and 0 otherwise (two exceptions in 2011 time-joined rows). B50:B51 and
        B52:B53 are big-endian words 30 apart, constant within a session (700/730 in most, 640/670
        on 2026-10-22). Constant in all 2015 captures: 0xFF at B10-B13, 0x00 at B14, B26, B37, B38,
        B47, B54, B60 and B61.
      parameters:
        HVAC_COMPRESSOR_POWER_COARSE:
          expression: B28/10
          unit: kW
          ha_class: power
          min: "0"
          max: "6"
          source: "RE 2026-10-27: hunt vs parked pack residual"
          verified: false
          notes: >-
            0-1.2 kW at 0.1 kW/bit across 2050 captures. Parked pack residual = 1.15 x this
            (r=0.947, n=71); r=0.71 vs 2201A1 HVAC_COMPRESSOR_POWER. Reads 0.4 kW in heat-pump mode
            against 0.53-0.63 kW on HVAC_COMPRESSOR_POWER. B27 is not its high byte: B25 and B27 are
            1 only in heat-pump mode.
        HVAC_COMPRESSOR_SPEED:
          expression: "[B42:B43]"
          unit: RPM
          min: "0"
          max: "9000"
          source: "RE 2026-10-27: 2201A3 vs HVAC_COMPRESSOR_POWER"
          verified: false
          notes: >-
            16-bit big-endian. Takes only 0, 1350, 1500, 2490, 2500 and 3300 across 2050 captures; 0
            exactly when HVAC_COMPRESSOR_POWER is 0. 3300 at about 0.9 kW, 1500 at 0.59 kW, 1350 at
            0.43 kW. The OBDb Ioniq Electric (2020) signalset has compressor speed on BMS 220106
            instead.

