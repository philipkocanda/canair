# ─── PSM (Power Seat Module) ──────────────────────────────────────────
# Actuator DIDs come from the e-Niro and are confirmed on this car (power seats: Premium trim).
PSM:
  tx_id: 0x7A3
  iocontrol_scan_ranges: [B000-BFFF]
  can_bus: [B-CAN]
  identity:
    description: Power Seat Module
    part_number: "95450G7000"
    mfg_date: "2017-06-01"
    hw_version: "100"
    sw_version: "100"
    boot_sw: "190"
    id_protocol: UDS  # F1xx
    notes: >-
      No live-data DIDs (seat position is not readable). The seat motors are driven via IOControl
      (service 2F) and run until OFF is sent.
  vehicle_states: [PLUGGED, ACC, "ON", READY, CHARGING]
  scan_log: # PSM (power seat)
    - service: 0x22
      range: "0101-010F,B001-B010,C001-C010,D001-D010"
      date: 2026-07-22
      hits: 0
      vehicle_states: [READY]
  pids: {}

  # ─── IOControl (service 2F) ──────────────────────────────────────────
  # Each actuator is a motor that runs until OFF is sent.
  iocontrol:
    B401:
      vehicle_states: []
      label: Seat slide forward
      verified: true
      true: "2FB40103"
      false: "2FB40100"

    B402:
      vehicle_states: []
      label: Seat slide backward
      verified: true
      true: "2FB40203"
      false: "2FB40200"

    B403:
      vehicle_states: []
      label: Seat recline upright
      verified: true
      true: "2FB40303"
      false: "2FB40300"

    B404:
      vehicle_states: []
      label: Seat recline backward
      verified: true
      true: "2FB40403"
      false: "2FB40400"

    B405:
      vehicle_states: []
      label: Seat front height up
      verified: true
      true: "2FB40503"
      false: "2FB40500"

    B406:
      vehicle_states: []
      label: Seat front height down
      verified: true
      true: "2FB40603"
      false: "2FB40600"

    B407:
      vehicle_states: []
      label: Seat rear height up
      verified: true
      true: "2FB40703"
      false: "2FB40700"

    B408:
      vehicle_states: []
      label: Seat rear height down
      verified: true
      true: "2FB40803"
      false: "2FB40800"
