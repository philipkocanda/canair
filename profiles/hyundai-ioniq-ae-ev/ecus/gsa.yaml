# ─── GSA (Gear Shift Assembly — Kostal) ────────────────────────────────────────
GSA:
  tx_id: 0x7B6
  can_bus: [P-CAN]
  identity:
    description: Gear Shift Assembly (gear selector module)
    part_number: "46700-G7100"
    mfg_date: "2016-05-26"
    supplier: "KCI_KOSTAL"
    hw_version: "KOSTAL_HW_G07"
    sw_version: "KOSTAL_SW_G07"
    id_protocol: UDS  # F1xx
    notes: Gear Shift Assembly (Kostal shift-lever module). Gear state is read from VCU 2101 GEAR.
  vehicle_states: [ACC, "ON", READY]
  scan_log:
    - service: 0x22
      range: "0101-010F,B001-B010,C001-C010,D001-D010"
      date: 2026-07-22
      hits: 0
      vehicle_states: [READY]
      notes: "Service 21 01-0F also all NRC."
  pids:
    220100:
      response_frames: 4
      status: draft
      period: 5000
      vehicle_states: [ACC, "ON", READY]
      notes: >-
        21 bytes; the only DID GSA answers (service 21 and 22 0101-0130 all NRC). B19, B21 and B22
        read either 0x93/0x91/0x94 or 0x77/0x76/0x78, both seen in Park; B20 is constant 0x01.
