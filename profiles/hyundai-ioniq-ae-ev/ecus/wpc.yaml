# ─── WPC (Wireless Phone Charging unit) ────────────────────────────────────────
WPC:
  tx_id: 0x725
  can_bus: [B-CAN]
  identity:
    description: Wireless Phone Charging unit
    part_number: "95560G7000"
    hw_version: "100"
    sw_version: "102"
    boot_sw: "1.6"
    id_protocol: UDS  # F1xx
    notes: >-
      Wireless phone charging pad. 220100 carries two signed 16-bit fields (B03:B04, B05:B06) of
      unknown meaning.
  vehicle_states: [ACC, "ON", READY]
  scan_log: # WPC (wireless phone charging)
    - service: 0x22
      range: "0101-010F,B001-B010,C101-C10F"
      date: 2026-07-22
      hits: 0
      vehicle_states: [READY]
      notes: "No live-data DIDs found."
  pids:
    220100:
      status: draft
      period: 5000
      vehicle_states: [ACC, "ON", READY]
      source: DID scan 2026-04-17
      parameters:
        WPC_0100_B03_B04:
          expression: "[S03:S04]"
          verified: false
          notes: Meaning unknown.
        WPC_0100_B05_B06:
          expression: "[S05:S06]"
          verified: false
          notes: Meaning unknown.

  research:
    - type: scan
      target: 22BE01-22BE03
      status: pending
      priority: P3
      vehicle_states: ["ON"]
      created: "2026-10-30"
      updated: "2026-10-30"
      notes: >-
        A later-generation Hyundai/Kia WPC keeps its live data in three record DIDs, each led by a
        4-byte supported-PID map: BE01 user options, BE02 byte data (charging voltage/current/power,
        battery and IGN1 voltage, coil temperatures, fan speed) and BE03 bit data (LED states,
        smart-key LF search inhibit, charging status). This car's GDS list (shop manual page 0566)
        matches: Charging Voltage, Charging Current, Charging Power, Battery Voltage, ACC Input
        Voltage, then ACC, Amber LED On/Off, Amber Blinking, Green LED On/Off, SMK LF Searching
        Signal and Charging Status. The 2026-07-22 sweep covered only 0101-010F, B001-B010 and
        C101-C10F. Read BE00-BEFF with a phone on and off the pad.
      sources:
        - Hyundai/Kia WPC diagnostic spec (supplier ECU spec, 2018-2025)
      what_to_test:
        - canair read WPC:22BE01 WPC:22BE02 WPC:22BE03 --save
    - type: iocontrol_scan
      target: 2F F000-F0FF
      status: pending
      priority: P3
      vehicle_states: ["ON"]
      created: "2026-10-30"
      updated: "2026-10-30"
      notes: >-
        Hyundai/Kia reserve F010-F0FF for IOControl DIDs (HVAC and VESS use F011+). The later WPC
        spec puts the amber LED at F011, the green LED at F012 and fan steps at F013-F01E, released
        with 00 (returnControlToECU) and run with 03. Never scanned on this WPC. HVAC F012 rejects
        00 but accepts 03, so a 00-only sweep can miss a DID.
      sources:
        - ES95486-00 Annex C; Hyundai/Kia WPC diagnostic spec
      what_to_test:
        - canair scan iocontrol WPC
