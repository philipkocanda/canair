# ─── BSD-L (Blind Spot Detection — Left) ──────────────────────────────
# Left BSD radar at 0x7B7. Part: 95811G2000
BSD-L:
  tx_id: 0x7B7
  can_bus: [C-CAN]
  identity:
    description: Blind Spot Detection radar (left)
    part_number: "95811G2000"
    serial: "31114851713802876"
    id_protocol: UDS  # F1xx (many FF-padded fields)
    notes: >-
      Left blind-spot detection radar: part 95811-G2000 is the left-hand BSD unit. No readable
      live-data DIDs found. Named BSD-R until 2026-10-31, so the 2026-07-22 scan sessions labelled
      BSD-R are this radar (0x7B7).
  vehicle_states: [ACC, "ON", READY]
  scan_log:
    - service: 0x22
      range: "0101-010F,B001-B010,C101-C10F"
      date: 2026-07-22
      hits: 0
      vehicle_states: [READY]
      notes: "No live-data DIDs found."
  pids: {}
  dtcs:
    source: Ioniq 2017 US electrical troubleshooting manual, BSD service tips (etm:0052)
    verified: false
    C1101:
      description: Battery power high
      causes: battery, charger, cables, connectors
    C1102:
      description: Battery power low
      causes: battery, charger, cables, connectors
    C1616:
      description: CAN communication line malfunction
      causes: cables, connectors
    C160A:
      description: Private CAN communication line malfunction
      causes: cables, connectors
    C170A:
      description: Switch LED circuit malfunction
      causes: switch circuit shorted to ground
    C1501:
      description: Switch malfunction
      causes: switch stuck pressed
    C170C:
      description: Right sensor ECU hardware malfunction
      causes: right radar sensor
    C170D:
      description: Left sensor ECU hardware malfunction
      causes: left radar sensor
    C2702:
      description: Right (master) sensor calibration missing
      causes: right radar mounting angle
    C2703:
      description: Left (slave) sensor calibration missing
      causes: left radar mounting angle
