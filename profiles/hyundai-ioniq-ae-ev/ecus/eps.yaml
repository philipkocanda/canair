      source: Ioniq 2017 US shop manual, MDPS inspection items per DTC (shop:0069)
      verified: false
    C1705:
      description: ECU pre-charge circuit fail
      source: >-
        Ioniq Electric 2017 service manual, DTC index (EV), Motor Driven Power Steering System DTCs,
        C1705-16
      verified: false
      source_links:
        - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Quick%20Lookups/DTC%20Index/DTC%20Index%20%28EV%29/Motor%20Driven%20Power%20Steering%20System%20DTCS/
      notes: The shop manual's MDPS table (shop:0069) calls it 'ECU hardware error'.
    C1604:
      description: ECU hardware error
