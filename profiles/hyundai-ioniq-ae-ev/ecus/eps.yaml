# ─── EPS (Electric Power Steering) ───────────────────────────────────
EPS:
  tx_id: 0x7D4
  can_bus: [C-CAN]
  identity:
    alias: MDPS  # Motor-Driven Power Steering
    description: Electric Power Steering
    part_number: "56310G7300"
    mfg_date: "2017-06-01"
    firmware: "MDPS C 1.00/1.03"
    id_protocol: UDS  # F1xx
    notes: Mounted on the steering column.
  vehicle_states: [ACC, "ON", READY]
  pids:
    220101:
      response_frames: 3
      status: active
      period: 10000
      vehicle_states: [READY]
      notes: >-
        18 bytes. Unmapped: B05 and B06 (0x8A and 0x8E at rest) and B11. B18:B19 is constant 0x1010,
        B21 constant 0x01.
      source: RE 2026-07-23 analysis
      min: "0"
      verified: false
      parameters:
        EPS_VEHICLE_SPEED:
          expression: B14
          unit: km/h
          max: "250"
          source: RE 2026-07-22 driving capture
          verified: true
          notes: >-
            Within 1 km/h of ESC REAL_SPEED_KMH over 0-39 km/h; 0 at standstill. Unsigned: positive
            when reversing.
        EPS_STEERING_TORQUE:
          expression: (B12+S13*256)
          min: "-10000"
          max: "10000"
          source: RE 2026-07-23 analysis of 2026-07-22 MT->KW drive
          notes: >-
            Name is unconfirmed. Signed 16-bit little-endian (low B12, high B13). Range -9258 to
            +9752, about 0 at standstill. r=-0.64 vs EPS_STEERING_ANGLE, -0.43 vs its rate of
            change.
          enabled: true
        EPS_MDPS_ASSIST:
          expression: B17
          max: "255"
          notes: >-
            Name is unconfirmed. 0 in all 16 standstill samples; 0-253 while moving, r=+0.53 vs
            EPS_VEHICLE_SPEED.
          enabled: true
        EPS_STEERING_TORQUE_ALT:
          expression: S7
          min: "-40"
          max: "40"
          notes: >-
            Name is unconfirmed. Signed, -36 to +37, -10 to -1 at rest. r=+0.34 vs
            EPS_STEERING_ANGLE.
          enabled: true

        EPS_SPEED_BAND:
          expression: B15
          max: "3"
          source: canair correlate/decode analysis of 2026-07-22 MT->KW drive
          notes: >-
            Only 0-3, rising with speed: r=+0.953 vs EPS_VEHICLE_SPEED (n=360). Steps 0 to 1 at
            about 26-27 km/h and back below about 25 km/h.
        EPS_STEERING_ANGLE:
          expression: 0-(S9*256+B10)/10
          unit: deg
          min: "-600"
          max: "600"
          source: RE 2026-07-30 driving steer-sweep; ESC 22C101 SAS cross-check
          verified: true
          notes: >-
            Signed 16-bit big-endian (high S9, low B10), negated to match the ESC sign. r=+1.000 vs
            ESC:22C101:STEERING_ANGLE (n=29, residual 1.35 °) over a ±90 ° sweep on 2026-07-30.
        EPS_TEMP:
          expression: B20
          unit: °C
          ha_class: temperature
          max: "255"
          source: "RE 2026-10-22: B20 vs HVAC_INTERIOR_TEMP/AAF AMBIENT_TEMP, 2026-07-22..10-22"
          notes: >-
            °C with no offset. 10 at a 2026-10-22 cold-soak start (ambient 8, cabin 8-9 °C), rising
            to 20 over 35 min parked at READY; 31-46 in summer. Tracks the cabin plus self-heating:
            B20 ≈ 1.15 × cabin + 6.6, r=0.975 (n=153).
    220102:
      status: static
      period: 2500
      vehicle_states: [READY]
      notes: "13 bytes, B6=0x03, the rest 0: 62010200000003000000000000."
  research:
    - type: decode
      target: "220101"
      status: captured
      priority: P1
      vehicle_states: [READY]
      notes: >-
        Angle, vehicle speed and speed band are decoded. Open: torque and assist.
        EPS_STEERING_TORQUE (B12 + S13×256, signed LE, about ±9500, ~0 at rest, r=-0.62 vs angle),
        EPS_MDPS_ASSIST (B17, 0 at standstill, 0-253 moving) and EPS_STEERING_TORQUE_ALT (S7, about
        ±36) have unconfirmed meanings; B11 is undecoded.
      what_to_test:
        - "EPS_STEERING_TORQUE (B12:S13): hold the wheel against resistance at fixed positions to separate torque from displacement; find units"
        - "EPS_MDPS_ASSIST (B17): vary assist effort at a fixed speed"
        - "EPS_STEERING_TORQUE_ALT (S7) vs B12:S13: which one is driver torque"
        - "B11: correlate against d(EPS_STEERING_ANGLE)/dt on a real drive"
      sources:
        - "captures/2026-07-22.json — driving capture, lots of steering"
        - "captures/2026-07-26.json — driveway steer-and-hold"
        - "OBDb Ioniq 5"
      capture_protocol: >-
        Car stationary in READY. Hold the wheel steady about 5 s at centre, quarter-turn left and
        right, and full lock left and right, then sweep slowly lock to lock. Save each with
        --label/--state.
    - type: decode
      target: "220101"
      status: pending
      priority: P2
      vehicle_states: [READY]
      notes: >-
        LKAS signals. The car has active lane-keep assist, which commands MDPS torque; no LKAS
        active flag, commanded torque or hands-on torque is decoded yet. Capture an LKAS-active
        highway drive (let it nudge the wheel, then override it) and diff against manual steering.
      what_to_test:
        - "LKAS active/engaged flag"
        - "LKAS commanded/overlay steering torque"
        - "Driver override / hands-on-wheel torque"
      sources:
        - "OpenDBC Hyundai LKAS message set (MDPS / LKAS11/LKAS12)"
        - "OBDb Ioniq 5"
    - type: scan
      target: 22 0100-0110
      status: done
      priority: P2
      vehicle_states: [READY]
      date: "2026-07-22"
      result: >-
        Only 0101 and 0102 answer (ignition on); 0100 and 0103-0110 NRC. Any LKAS signal must be in
        220101/220102 or is not exposed on EPS.
      updated: "2026-07-23"
    - type: verify
      target: "220101"
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-07-23"
      notes: >-
        Verify EPS_SPEED_BAND (B15): discrete 0-3, steps 0 to 1 at about 26-27 km/h with hysteresis.
        Hold 15/25/35/50/70/90 km/h to find the thresholds and check whether steering effort changes
        at each edge.
    - type: scan
      target: 21 01
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: >-
        OBDb defines 7D4 21 01 with a steering wheel angle (bix 72, signed, /10 deg) and lists it
        unsupported for 2017 and 2018. Service 21 has never been probed on EPS.
      sources:
        - OBDb Hyundai-IONIQ-Electric signalset (pelican.clutch.engineering ioniq-electric parameters), compared 2026-10-27
      capture_protocol: canair read EPS:2101 --save while steering lock to lock, parked in READY
