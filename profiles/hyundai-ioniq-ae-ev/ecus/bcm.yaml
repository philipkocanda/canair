      parameters: {}

    22C010:
      status: ignored
      vehicle_states: [ALL]
      notes: "8 bytes, mostly 0; B03=0xFC. Sample: 62C010FC00000000."
      parameters: {}

    22C011:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        12 bytes. B10:0 the ignition (BCM_IGN_ON_C011), B11 the 12 V bus (BCM_12V_BUS_C011), B13:B14
        BCM_EVENT_COUNTER_C011. B12 takes all 256 values, with no relation between reads 3 s apart:
        random, not a counter or a signal.
      min: "0"
      parameters:
        BCM_12V_BUS_C011:
          expression: B11/12.8
          unit: V
          max: "20"
          source: RE 2026-08-05 cross-PID mirror vs the verified BCM 22B003 BCM_12V_BATTERY
          verified: true
          notes: >-
            B11 is exactly 12.8 x BCM_12V_BATTERY in 1781 of 1965 co-polled rows. 12.66 V at rest,
            14.53 V during AC charging. Disabled as a duplicate of the 22B003 signal.
          enabled: false
        BCM_EVENT_COUNTER_C011:
          expression: "[B13:B14]"
          max: "65535"
          source: monotonic-counter sweep of all captures 2026-04-16..2026-08-05
          verified: false
          notes: >-
            16-bit big-endian. Only rises (9835 to 10279), flat within every recording session. Not
            a timer.
        BCM_IGN_ON_C011:
          expression: B10:0
          max: "1"
          source: Ignition cross-tab 2026-10-22
          verified: false
          notes: >-
            1 in 703 of 3760 captures. Equals IGPM IGN1_SWITCH and BCM_IGN_SUPPLY_V in every aligned
            row (kappa 1.00), including ignition-on rows with the drive path down, so it follows the
            ignition, not READY. Disabled as a duplicate.
          enabled: false

    22C012:
      status: ignored
      vehicle_states: [ALL]
      notes: "11 bytes. ASCII 'DO01' at B07-B10 (the 22C003 tag). Sample: 62C01280000000444F3031."
      parameters: {}

    22C013:
      status: ignored
      vehicle_states: [ALL]
      notes: "13 bytes. ASCII '0x0620'. Sample: 62C01380000000307830363230."
      parameters: {}

    22C014:
      status: ignored
      vehicle_states: [ALL]
      notes: "8 bytes. B10=0x0C. Last DID answering in the C0xx range. Sample: 62C014F00000000C."
      parameters: {}

