  research:
    - type: decode
      target: "22B00C"
      status: captured
      priority: P2
      vehicle_states: [ACC]
      notes: >-
        B05 reads 0x3F in every capture. Capture after changing the charge-schedule days to see
        whether any byte moves.
      sources:
        - "Captured 2026-04-15"
    - type: decode
      target: "22B007"
      status: captured
      priority: P2
      vehicle_states: [ACC]
      notes: >-
        B07:B09 reads 0x01E0 (480) in every capture. Capture after changing the departure time to
        see whether any byte moves.
      sources:
        - "Captured 2026-04-15"
    - type: iocontrol_scan
      target: "2F B073-B0FF"
      status: done
      priority: P2
      vehicle_states: [ACC]
      notes: >-
        B000-B0FF: 24 DIDs, all in B000-B072. C000-C0FF: 6 (C001-C006). B100-B1FF and E000-E0FF:
        none. Scanned 2026-04-18.
      sources:
        - "IOControl scan 2026-04-15, 2026-04-18"
    - type: scan
      target: 27 SecurityAccess
      status: done
      priority: P2
      created: "2026-07-24"
      updated: "2026-07-23"
      date: "2026-07-22"
      result: present; non-trivial seed-key
      notes: >-
        In the extended session (10 03), 27 01 returns a fresh random 4-byte seed on each request;
        the key is not a simple transform of it. Lockout after about 2 wrong keys (NRC 0x37, 11 s
        delay).
      sources:
        - on-car 2026-07-22
    - type: verify
      target: 22C011
      status: captured
      priority: P2
      vehicle_states: [ACC, READY]
      created: "2026-08-07"
      updated: "2026-08-07"
      notes: >-
        BCM_EVENT_COUNTER_C011 only rises. Read 22C011, cycle the ignition once without moving the
        car, and re-read: +1 means a power-cycle count, unchanged a distance-gated count. Repeat
        with a short drive to separate the two.
    - type: verify
      target: 22B005 B10:5-7 / 22B003 B12,B14 light stalk + auto-light
      status: captured
      priority: P2
      vehicle_states: [READY]
      created: "2026-10-22"
      updated: "2026-10-22"
      notes: >-
        Stalk OFF, lamps-on and AUTO are decoded (BCM_LIGHT_SW_*, BCM_LIGHT_SW_ADC,
        BCM_LIGHT_SW_POSITION). Not captured: the parking-light position, and whether
        BCM_AMBIENT_LIGHT is the auto-headlight sensor (its AUTO on/off threshold).
      what_to_test:
        - Stalk OFF, AUTO, parking, low beam (~3 s each); parking = B10:5 alone?
        - "AUTO, cover dash sensor: BCM_AMBIENT_LIGHT at LOW_BEAM on and off"
      capture_protocol: >-
        canair monitor BCM:22B003,22B004,22B005 IGPM:22BC03 --save --keep-changes --state READY
        --label 'light stalk + auto-light sweep'; press 's' to note each step.
    - type: decode
      target: 22B003 B18 input (+ 22B004 B12:5)
      status: captured
      priority: P3
      created: "2026-10-22"
      updated: "2026-10-22"
      notes: >-
        Analog input with three bands that changes only between sessions: ~247 open, 109-136 (07-22,
        08-01 to 08-15 morning), 158-159 (08-15 from 10:03). 22B004 B12:5, 22B00A B11:3 and 22B00D
        B11:4 are its digital reading; 22B00D B11:3 pulses only while it is set. The owner does not
        recall what was set differently over those weeks.
      what_to_test:
        - "With 22B003 and 22B004 polled, step one control at a time and hold ~5 s each: wiper stalk (OFF/AUTO-INT, each ring position), rear wiper, headlamp levelling dial, dimmer, seat heaters, 12 V socket plug, mirror switch; watch for B18 leaving ~247."
      capture_protocol: >-
        canair monitor BCM:22B003,22B004,22B00D --save --keep-changes --state ON --label 'BCM B18
        input hunt'; press 's' to note each step.
    - type: verify
      target: 22B003 B23/B26/B27/B28 channel to BCM terminal
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-23"
      updated: "2026-10-23"
      notes: >-
        Four ignition-switched analog channels, identical in every capture. The BCM has IGN1 and
        IGN2 plus two IG2 heated-steering supplies; during START only IGN1 stays on (IGN2 and ACC
        drop out), so a fast recording across OFF to READY may separate the channels. Terminal list
        from US-market wiring.
      what_to_test:
        - Record BCM 22B003 with --keep-all at the fastest interval across a brake-pressed OFF to READY start and look for a channel that dips while the others stay up.
      capture_protocol: >-
        canair monitor BCM:22B003 --save --keep-all --interval 0.5 --label 'BCM ignition channels
        across start' --state ACC; start with the brake pressed and press s at button press.
    - type: verify
      target: 22C00B rear tyre order (RL/RR)
      status: pending
      priority: P2
      vehicle_states: [ALL]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: >-
        TYRE_PRESSURE_RL is B19 and TYRE_PRESSURE_RR B23 (original WiCAN config, never checked
        against a single tyre). OBDb is split: Hyundai-IONIQ-Electric and the older Kia-Niro layout
        read the pair as rear right then rear left; Kona-Electric, Niro-EV and Soul-EV as rear left
        then rear right. Both rear tyres sit at 35-41 psi, so no capture decides it.
      sources:
        - OBDb Hyundai-IONIQ-Electric signalset and its tests/test_cases (2017/2018 command_support), compared 2026-10-27
      what_to_test:
        - Let about 5 psi out of the rear left tyre only, read 22C00B, and see whether B19 or B23 drops
      capture_protocol: >-
        canair read BCM:22C00B --save --label 'rear-left tyre -5 psi' before and after, noting which
        tyre was changed.
    - type: decode
      target: 22B004-22B00E support bitmap (B05-B07, B09); 22B003 byte map
      status: pending
      priority: P2
      vehicle_states: [READY, CHARGING]
      created: "2026-10-29"
      updated: "2026-10-29"
      result: >-
        Same layout as IGPM 22BC03-07. In 22B004-22B00E the constant bytes B05, B06, B07, B09 map
        the data bits of B10, B11, B12, B13, MSB first: 34 of the 41 bits ever set lie inside the
        map, against 12-20 for a random pairing. 22B003 uses a per-byte map (BF 8B 80 00) marking
        B10, B12-B15, B17-B19, B23 and B26-B28; 11 of its 12 varying bytes are inside (not B20, an
        unconnected input).
      notes: >-
        Exceptions: in 22B005 (map 20 00 10 00) only B10:2 and B12:3 are marked, yet B10:3 and
        B10:5-7 move (unlock, light stalk), so the map is not authoritative on the BCM.
        BCM_B004_B12_5 is outside the 22B004 map (0x99 marks B12:0, 3, 4, 7). 22B007 B12:7 and
        B13:0-2 are set in one row only, in a session with many transport errors (2026-10-25
        12:23:32). Always 1: 22B005 B12:3, 22B008 B11:3 and B11:7, 22B00A B12:0 and B12:2. Never
        set: 22B004 B12:0, B12:4, B13:5; 22B008 B11:1, B12:5; 22B009 24 of its 26 marked bits;
        22B00A B10:0, B10:1, B10:6, B10:7, B11:0-2, B11:4, B12:1; 22B00C B10:3-7; 22B00D B11:0-2,
        B12:0-2; 22B00E B10:4.
      sources:
        - byte sweep over all stored BCM captures, 2026-10-29
      what_to_test:
        - "Same narrated body sweep as the IGPM entry, with BCM 22B004-22B00E co-polled: every new moving bit should be inside its map, and 22B005 shows whether the BCM uses multi-bit fields where the map marks only a start bit."
    - type: scan
      target: 31 03 0200-DFFF
      status: pending
      priority: P3
      vehicle_states: ["ON"]
      created: "2026-10-30"
      updated: "2026-10-30"
      notes: >-
        The 2026-04-20 0x31 sweep ran in SLEEP and stopped at C8D2. ES95486 allows RoutineControl
        only with the ignition on and the car not READY, so the NRC 0x22 answers (12A1) may differ
        in ON. Manufacturer routine IDs are 0200-DFFF; F000-FEFF is the supplier range.
      sources:
        - ES95486-00 sections 3.1 and 8.1
      what_to_test:
        - canair scan routines BCM --rid-range 0200-DFFF --session, in ON
    - type: decode
      target: GDS Current Data names for the bit pages
      status: pending
      priority: P3
      created: "2026-11-01"
      updated: "2026-11-01"
      notes: >-
        The GDS BCM lists (shop manual pages 0426, 0487, 0372) give, after the option settings and
        the 22B003 voltages: ACC, IGN1, IGN2, Defogger/Deicer Switch, Washer, INT, Mist, Wiper Stop
        Position Switch, Wiper Low/High Relay, Head Lamp Washer Relay, Room Lamp Output, Foot Lamp
        Output, Tail Lamp Switch, Auto Light Switch, Head Lamp Switch, Head Lamp High Switch,
        Front/Rear Fog Switch, Tail AV, Auto Light Power, Rear Fog Relay, Puddle Lamp Output,
        External Trunk Release Switch, Key Interlock Switch, ATM Solenoid Output, Safety Power
        Window Enable, Assist Seat Belt Indicator, Crash Input Signal, Rain Sensor Option Line, PAS
        Option Line, Brake Switch, Sunroof Open, Head Lamp Passing Switch, Wiper Low/High Switch,
        Front Wiper Backup Switch. 22B004 B10 bits 1-3 (0x0E in ON) fit ACC/IGN1/IGN2; the rest do
        not line up with the support-mapped bits of 22B004-22B00D in one consistent order. The
        22B003 order (battery, auto light sensor, light switch, head lamp high, fog, front wiper
        switch, wiper INT volume voltages) fits B10, B12, B14 and puts the front wiper switch at
        B18.
      sources:
        - Ioniq 2017 US shop manual, BCM Current Data screenshots
