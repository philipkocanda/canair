# ─── BCM (Body Control Module) / TPMS ──────────────────────────────────
# BCM and TPMS share TX ID 0x7A0 (same physical ECU, part 95400G7470).
BCM:
  tx_id: 0x7A0
  iocontrol_scan_ranges: [B000-B3FF, B400-B7FF, C000-C0FF, F000-F0FF]
  can_bus: [B-CAN, C-CAN]
  identity:
    description: Body Control Module
    part_number: "95400G7470"
    mfg_date: "2017-05-31"
    id_protocol: UDS  # F1xx
    notes: >
      Body Control Module. Shares TX ID 0x7A0 with TPMS (same physical ECU,
      part 95400G7470); TPMS data is read via DID 22C00B on the BCM.
  vehicle_states: [ALL]
  scan_log:
    - service: 0x31
      range: "0000-FFFF"
      date: 2026-04-20
      hits: "~71+ (seen on screen only; not logged)"
      probes: 49813  # cut off at 0xC8D2 — WiCAN sleep/disconnect
      vehicle_states: [SLEEP]
      notes: >-
        Sub-function 03 (requestRoutineResults). Positive replies came in two clusters with stride
        0x0D: 0x95CE-0x97C2 (~40) and 0xC726-0xC8B8 (~32). Each is a 2-byte ack with no result
        data. RID 0x12A1 returned NRC 0x22 (conditionsNotCorrect). 0xC8D3-0xFFFF not scanned.
  pids:
    22C00B:
      response_frames: 4
      status: active
      period: 60000
      vehicle_states: [ALL]
      source: Kia Niro EV WiCAN PR#716
      min: "0"
      verified: true
      parameters:
        TYRE_PRESSURE_FL:
          expression: "B10/72.52"
          unit: bar
          ha_class: pressure
          max: "5"
          source: "Original WiCAN config + Ioniq forum"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: Raw / 5 = psi.

        TYRE_PRESSURE_FR:
          expression: "B14/72.52"
          unit: bar
          ha_class: pressure
          max: "5"
          source: "Original WiCAN config"

        TYRE_PRESSURE_RL:
          expression: "B19/72.52"
          unit: bar
          ha_class: pressure
          max: "5"
          source: "Original WiCAN config"

        TYRE_PRESSURE_RR:
          expression: "B23/72.52"
          unit: bar
          ha_class: pressure
          max: "5"
          source: "Original WiCAN config"

        TYRE_TEMP_FL:
          expression: "B11-50"
          unit: "°C"
          ha_class: temperature
          min: "-50"
          max: "100"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          notes: Kia Niro EV formula. Reads 10-38 °C on this car, with one -48 °C outlier.

        TYRE_TEMP_FR:
          expression: "B15-50"
          unit: "°C"
          ha_class: temperature
          min: "-50"
          max: "100"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716

        TYRE_TEMP_RL:
          expression: "B20-50"
          unit: "°C"
          ha_class: temperature
          min: "-50"
          max: "100"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716

        TYRE_TEMP_RR:
          expression: "B25-50"
          unit: "°C"
          ha_class: temperature
          min: "-50"
          max: "100"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
        TYRE_SENSOR_STATE_FL:
          expression: B12
          type: enum
          values:
            1: stale
            2: fresh
          max: "2"
          source: TPMS timeline 2026-10-22
          verified: false
          notes: >-
            1 = held reading, 2 = reading received this power cycle. On 2026-08-02 (parked, ON) each
            wheel flipped 1->2 at the capture where its own pressure and temperature stepped from
            the previous evening's warm values to cold ones. 1 on every wheel in READY on 2026-10-22
            and in most key-off captures.
        TYRE_SENSOR_STATE_FR:
          expression: B17
          type: enum
          values:
            1: stale
            2: fresh
          max: "2"
          source: TPMS timeline 2026-10-22
          verified: false
          notes: As TYRE_SENSOR_STATE_FL, for the FR wheel.
        TYRE_SENSOR_STATE_RL:
          expression: B21
          type: enum
          values:
            1: stale
            2: fresh
          max: "2"
          source: TPMS timeline 2026-10-22
          verified: false
          notes: As TYRE_SENSOR_STATE_FL, for the RL wheel.
        TYRE_SENSOR_STATE_RR:
          expression: B26
          type: enum
          values:
            1: stale
            2: fresh
          max: "2"
          source: TPMS timeline 2026-10-22
          verified: false
          notes: As TYRE_SENSOR_STATE_FL, for the RR wheel.
    22B00D:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B10 is the light-stalk position (BCM_LIGHT_SW_POSITION); B11 bit 4 the 22B003 B18
        input, bits 3 and 5 pulses while it is set. B05-B07 = FC FC E0 constant.
      min: "0"
      max: "1"
      verified: false
      parameters:
        BCM_LIGHT_SW_POSITION:
          expression: B10
          type: enum
          values:
            0: "off"
            1: auto
            3: "on"
          max: "3"
          source: Cross-tab vs 22B005 B10 bits 5-7 and 22B003 B14, 2026-10-22
          notes: >-
            Light-stalk position. Agrees with BCM_LIGHT_SW_ADC in all 375 aligned rows and with
            BCM_LIGHT_SW_ON_B5/_AUTO in all 344. Parking position not captured.
        BCM_B00D_B11_4:
          expression: B11:4
          source: Cross-tab vs 22B003 B18 2026-10-22
          notes: >-
            Equals BCM_B004_B12_5 (the 22B003 B18 input) in 350 of 351 aligned rows. Disabled as a
            duplicate.
          enabled: false
        BCM_B00D_B11_3:
          expression: B11:3
          source: Event timeline 2026-10-22
          notes: >-
            Set only while BCM_B00D_B11_4 is 1 (21 of 49 such captures, never otherwise), in runs of
            20 s to 82 min, 13 of them while charging on 2026-08-05. No co-polled signal follows it.
        BCM_B00D_B11_5:
          expression: B11:5
          source: Same-payload cross-tab 2026-10-22
          notes: Equals BCM_B00D_B11_3 in 376 of 377 captures. Disabled as a duplicate.
          enabled: false

    22B00E:
      response_frames: 2
      status: active
      period: 5000
      vehicle_states: [ALL]
      parameters:
        CHARGE_PORT_OPEN:
          expression: "B10:5"
          ha_class: opening
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: >-
            1 = open. Bit 5 on this car (bit 4 in the Niro EV source). Works in the default session.

    22B00F:
      status: ignored
      vehicle_states: ["ON"]
      notes: >-
        13 bytes as stored, ending in 0xAAAA frame padding (only old, padded reads exist). Payload
        identical to 22B00D (FC FC E0 ...).
      parameters: {}

    22B004:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B10 ignition state (BCM_IGN_STATE_B004); B11:6 short pulses with the ignition off;
        B12:3 light stalk AUTO; B12:5 the digital reading of the 22B003 B18 input; B12:7 constant 1.
        B05=0x74, B06=0x02, B07=0x99 constant; B09=0x0C except 2 untimed captures.
      source: support-bitmap sweep 2026-10-29
      verified: false
      parameters:
        BCM_B004_B11_6:
          expression: "B11:6"
          mqtt_topic: ""
          min: "0"
          max: "1"
          source: Fob lock/unlock test 2026-04-18; ignition cross-tab 2026-10-22
          notes: >-
            Changed on fob lock and unlock (2026-04-18) but does not follow the IGPM door locks: it
            changed 12 times in 24 min on 2026-10-21 with all doors locked. Short pulses (median 5
            s), only with the ignition off. 1 in 367 of 994 captures.
        BCM_LIGHT_SW_AUTO_B004:
          expression: B12:3
          min: "0"
          max: "1"
          source: "RE 2026-10-22: 22B004/22B005 co-polled sessions 2026-04-17..2026-10-22"
          notes: >-
            Equals 22B005 BCM_LIGHT_SW_AUTO in every co-polled capture. Disabled as a duplicate.
          enabled: false
        BCM_IGN_STATE_B004:
          expression: B10
          type: enum
          values:
            0: "off"
            14: ign_on
            192: unknown_192
          min: "0"
          max: "255"
          source: Cross-tab vs IGPM IGN1_SWITCH and BCM_IGN_SUPPLY_V 2026-10-22
          notes: >-
            Bits 1-3 only ever set together (14). Equals IGPM IGN1_SWITCH in all 326 aligned rows,
            including CHARGING+ON with the drive path down. 192 (bits 6, 7) only in 2 untimed SLEEP
            captures on 2026-04-17. Disabled as a duplicate of IGN1_SWITCH.
          enabled: false
        BCM_B004_B12_5:
          expression: B12:5
          min: "0"
          max: "1"
          source: Cross-tab vs 22B003 B18 2026-10-22
          notes: >-
            1 exactly when BCM_B003_B18 is in its 109-136 band, 0 at 158-159 or open (959 of 959
            aligned rows). Mirrored by 22B00A B11:3 and 22B00D B11:4.
        BCM_B004_B12_7:
          expression: B12:7
          notes: >-
            Marked by the 22B004 map. 1 in 2342 of 2349 captures; 0 on 2026-04-17 (x2) and
            2026-10-25 (x5).
          enabled: false
        BCM_B004_B13_4:
          expression: B13:4
          notes: Marked by the 22B004 map. 1 in 6 of 2349 captures (2026-07-22 x1, 2026-10-25 x5).
          enabled: false

    22B005:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B10 bits 2,3 (0x0C) set on fob unlock, together with B004 and B006; bits 5-7 are
        the light-stalk position (BCM_LIGHT_SW_*). B05=0x20, B07=0x10, B12=0x08.
      source: "RE 2026-10-22: all 22B003/22B005 co-polled sessions 2026-04-17..2026-10-22"
      min: "0"
      max: "1"
      verified: false
      parameters:
        BCM_B005_UNLOCK_BITS:
          expression: B10
          max: "255"
          source: Fob lock/unlock tests 2026-04-18, 2026-07-24
          notes: >-
            Whole byte. Bits 2 and 3 set (0x0C) on fob unlock. Bits 5-7 are the light-stalk position
            (BCM_LIGHT_SW_*): 0xA0 with the stalk in a lamps-on position, 0x00/0x08/0x0C at OFF,
            0x48 at AUTO.
        BCM_LIGHT_SW_AUTO:
          expression: B10:6
          notes: >-
            1 only on 2026-10-22 (21 captures), with the light stalk at AUTO; 0 in every other
            session. Bits 5 and 7 clear while set. Duplicated by 22B004 B12:3.
        BCM_LIGHT_SW_ON_B5:
          expression: B10:5
          notes: >-
            Set together with B10:7 whenever 22B003 B14 reads ~211, including READY captures with
            IGPM LOW_BEAM and TAIL_LIGHTS on; clear at ~249. Cleared with B10:7 as LOW_BEAM went
            1->0 on 2026-07-30. Parking position never captured, so the parking-light and headlamp
            contacts are not separated.
        BCM_LIGHT_SW_ON_B7:
          expression: B10:7
          notes: >-
            Always equal to B10:5 (BCM_LIGHT_SW_ON_B5): set with the stalk in a lamps-on position,
            clear at OFF and AUTO.
        BCM_UNLOCKED_OR_IGN_ON:
          expression: B10:3
          source: Cross-tab vs IGPM 22BC04 B13:6 2026-10-22
          notes: >-
            Equals IGPM INTERIOR_LAMP_AUTOCUT_RELAY in all 323 aligned rows. Disabled as a
            duplicate.
          enabled: false
    22B006:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B10 reads 0x04 (bit 2) on fob unlock, together with B004 and B005. B05=0x20, the
        rest normally 0.
      parameters:
        BCM_B006_UNLOCK_BITS:
          expression: B10
          min: "0"
          max: "255"
          source: Fob lock/unlock tests 2026-04-18, 2026-07-24
          verified: false
          notes: 0x00, or 0x04 (bit 2) on fob unlock. 0x04 in 6 of 301 captures.
    22B007:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      parameters:
        BCM_IGN_ON_B007:
          expression: B11:2
          min: "0"
          max: "1"
          source: Ignition cross-tab 2026-10-22
          verified: false
          notes: >-
            1 in 51 of 345 captures. Equals IGPM IGN1_SWITCH and BCM_IGN_SUPPLY_V in every aligned
            row (kappa 1.00), including ignition-on rows with the drive path down, so it follows the
            ignition, not READY. Disabled as a duplicate.
          enabled: false
      response_frames: 2
      status: draft
      period: 60000
      vehicle_states: [ALL]
      notes: B07:B09 reads 0x01E0 (480) in all 284 captures, across sleep, ACC and charging.
    22B008:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B12:4 follows the brake (BCM_BRAKE_SWITCH), B13:2 the ignition (BCM_IGN_ON_B008).
        B13:1 set in 3 captures, 2 with the passenger door open. B05=0x00, B06=0x51, B07=0x0C,
        B09=0x20, B11=0x88 constant.
      parameters:
        BCM_IGN_ON_B008:
          expression: B13:2
          min: "0"
          max: "1"
          source: Ignition cross-tab 2026-10-22
          verified: false
          notes: >-
            1 in 50 of 348 captures. Equals IGPM IGN1_SWITCH and BCM_IGN_SUPPLY_V in every aligned
            row (kappa 1.00), including ignition-on rows with the drive path down, so it follows the
            ignition, not READY. Disabled as a duplicate.
          enabled: false
        BCM_BRAKE_SWITCH:
          expression: B12:4
          min: "0"
          max: "1"
          source: Cross-tab vs IGPM 22BC06 BRAKE_LIGHT 2026-10-22
          verified: false
          notes: >-
            1 only while IGPM BRAKE_LIGHT reads 0x2D: all 19 captures on 2026-07-21 (READY), and on
            2026-08-01 1-2 s after each BRAKE_LIGHT edge. 0 in all 315 aligned rows with the brake
            released.

    22B009:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B03-B06 read FE EE FE EE; the rest 0 except B10 and B12 bit 3, which follow the
        ignition. Sample: 62B009FEEEFEEE00000000.
      source: Ignition cross-tab 2026-10-22
      parameters:
        BCM_IGN_ON_B009:
          expression: B10:3
          min: "0"
          max: "1"
          verified: false
          notes: >-
            1 in 50 of 344 captures. B12:3 is identical in every capture. Equals IGPM IGN1_SWITCH
            and BCM_IGN_SUPPLY_V in every aligned row (kappa 1.00), including ignition-on rows with
            the drive path down, so it follows the ignition, not READY. Disabled as a duplicate.
          enabled: false
        BCM_IGN_ON_B009_B12:
          expression: B12:3
          min: "0"
          max: "1"
          verified: false
          notes: Equals BCM_IGN_ON_B009 (B10:3) in every capture. Disabled as a duplicate.
          enabled: false

    22B00A:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B11:3 the 22B003 B18 input, B12 bits 6-7 the ignition (BCM_IGN_ON_B00A). B05=0xE3,
        B06=0xFE, B07=0xE3 constant.
      source: support-bitmap sweep 2026-10-29
      verified: false
      parameters:
        BCM_IGN_ON_B00A:
          expression: B12:6
          min: "0"
          max: "1"
          source: Ignition cross-tab 2026-10-22
          notes: >-
            B12 is 0x05 off, 0xC5 on (bit 7 moves with it). 1 in 50 of 344 captures. Equals IGPM
            IGN1_SWITCH and BCM_IGN_SUPPLY_V in every aligned row (kappa 1.00), including
            ignition-on rows with the drive path down, so it follows the ignition, not READY.
            Disabled as a duplicate.
          enabled: false
        BCM_B00A_B11_3:
          expression: B11:3
          min: "0"
          max: "1"
          source: Cross-tab vs 22B003 B18 2026-10-22
          notes: >-
            Equals BCM_B004_B12_5 (the 22B003 B18 input) in all 342 aligned rows. Disabled as a
            duplicate.
          enabled: false
        BCM_B00A_B10_2:
          expression: B10:2
          notes: >-
            Marked by the 22B00A map. 1 in 250 of 1694 captures, 238 of them during the 2026-07-27
            AC charge; 0 in the other charging sessions.
          enabled: false
        BCM_B00A_B11_5:
          expression: B11:5
          notes: Marked by the 22B00A map. 1 in 3 of 1694 captures (2026-08-15 x1, 2026-10-25 x2).
          enabled: false
        BCM_B00A_B11_6:
          expression: B11:6
          notes: >-
            Marked by the 22B00A map. 1 in 1689 of 1694 captures; 0 only in 5 rows on 2026-10-25.
          enabled: false
        BCM_B00A_B12_7:
          expression: B12:7
          notes: Marked by the 22B00A map. 1 in 82 of 1694 captures, spread over 8 dates.
          enabled: false

    22B00B:
      status: ignored
      vehicle_states: [ACC, "ON", READY, CHARGING]
      notes: >-
        NRC 0x31 (requestOutOfRange) in deep sleep and in READY; some attempts return only 7E00. No
        positive (62B00B) reply recorded in any state.
      parameters: {}

    22B00C:
      parameters:
        BCM_B00C_B10_2:
          expression: B10:2
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B00C map, whose other marked bits (B10:3-7) are never set. 1 in 2 of
            1693 captures, both 2026-10-25.
          enabled: false
      response_frames: 2
      status: draft
      period: 60000
      vehicle_states: [ALL]
      notes: B05 reads 0x3F in all 282 captures, across every state.
    22B001:
      response_frames: 3
      status: draft
      vehicle_states: [ALL]
      notes: >-
        20 bytes, mostly 0. Gives NO DATA on the first read after wake, then answers. B20 read 0x02
        in ACC (2026-04-14) and 0x01 in ON while charging (2026-04-19).
      parameters: {}

    22B002:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: "9 bytes, sparse. B10:0 changes between days. Sample: 62B002C00000000300."
      parameters: {}

    22B003:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [ALL]
      notes: >-
        24 bytes. Analog inputs at about 0.08 V per count: B10 the 12 V battery, B23/B26/B27/B28
        ignition-switched supplies, B12/B13/B14/B18 sensor and switch inputs. B11 and B19 read 61-62
        (about 4.9 V) in 3685 of 3688 captures. B15, B17 and B20 sit at 246-249 (open circuit) in
        every capture. B05-B07, B09, B21, B22 and B25 are constant.
      source: Same-payload cross-tab 2026-10-22
      min: "0"
      max: "20"
      verified: false
      parameters:
        BCM_12V_BATTERY:
          expression: "B10*0.08"
          unit: "V"
          display: ""
          ha_class: voltage
          source: "Reverse engineered from monitor drift analysis"
          verified: true
          notes: >-
            Scale estimated from one reading: raw 149 = 11.92 V against the WiCAN's own 12.1 V.
        BCM_AMBIENT_LIGHT:
          expression: B12
          display: ""
          max: "255"
          source: "RE 2026-10-22: B12 by hour of day across 2026-04-15..2026-10-22"
          notes: >-
            Raw count, higher = brighter: 9-55 after dark, 245-246 (ceiling) in daylight, 51-246
            while parked charging on an afternoon. No HVAC byte tracks it (|r| <= 0.32).
            Auto-headlight threshold not captured.
          enabled: false
        BCM_IGN_SUPPLY_V:
          expression: B28*0.08
          unit: V
          source: RE 2026-08-02 state discrimination; ignition cross-tab 2026-10-22
          notes: >-
            Ignition-switched supply at the BCM; 1-3 counts above BCM_12V_BATTERY when on. Equals
            IGPM IGN1_SWITCH in all 356 aligned rows and is on in all 612 CHARGING+ON rows with the
            drive path down, so it follows the ignition, not READY. B23, B26 and B27 read the same
            within 1-3 counts; none of the four is on in ACC. US-market wiring gives the BCM IGN1
            (pin D2), IGN2 (D23), ACC (D24) and two IG2 heated-steering supplies (D3, D4); which
            channel is which is unknown.
        BCM_LIGHT_SW_ADC:
          expression: B14
          max: "255"
          source: "RE 2026-10-22: B14 levels vs 22B005 B10 bits 5-7 and IGPM 22BC03 lamp outputs"
          notes: >-
            Discrete levels with +-1 LSB flicker: ~249 OFF, ~211 lamps on, 101 AUTO. Same partition
            as BCM_LIGHT_SW_* on 22B005 in every co-polled session. Parking-light level not
            captured.
        BCM_TEMP_RAW_B13:
          expression: B13
          max: "255"
          source: "RE 2026-10-22: B13 vs HVAC_INTERIOR_TEMP, 2026-04-15..2026-10-22"
          notes: >-
            Raw count, falls as temperature rises. Against HVAC_INTERIOR_TEMP: B13 ~ 224.2 - 2.26 x
            cabin degC, r=-0.955, n=830, cabin 9-38.5 degC; lags the cabin air. Isolated
            single-sample drops to 62 (22 of 3676). Sensor location unknown.
        BCM_IGN_SUPPLY_V_B23:
          expression: B23*0.08
          unit: V
          notes: >-
            0 in the same captures as BCM_IGN_SUPPLY_V (B28), within 1-3 counts of it otherwise.
            Disabled as a duplicate.
          enabled: false
        BCM_IGN_SUPPLY_V_B26:
          expression: B26*0.08
          unit: V
          notes: >-
            0 in the same captures as BCM_IGN_SUPPLY_V (B28), within 1-3 counts of it otherwise.
            Disabled as a duplicate.
          enabled: false
        BCM_IGN_SUPPLY_V_B27:
          expression: B27*0.08
          unit: V
          notes: >-
            0 in the same captures as BCM_IGN_SUPPLY_V (B28), within 1-3 counts of it otherwise.
            Disabled as a duplicate.
          enabled: false
        BCM_B003_B18:
          expression: B18
          max: "255"
          source: "RE 2026-10-22: B18 by session, 2026-04-15..2026-10-22"
          notes: >-
            Analog input holding one of three bands for days, never changing band within a session:
            246-248 (open circuit, like B15/B17/B20), 109-136 with +-10 noise (07-22, 08-01 to 08-15
            09:10), 158-159 (from 08-15 10:03). 22B004 BCM_B004_B12_5 is 1 exactly in the 109-136
            band. No correlation with temperature, light or 12 V.
    # ─── TPMS configuration DIDs (22C001-C014) ───────────────────────────
    # Static TPMS sensor registration, IDs, and configuration data.
    # C00B (above) has live tyre pressure/temp readings.
    22C001:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        34 bytes. Four C0F8-prefixed sensor IDs, one per wheel. Static. Sample:
        62C001FFFF000001C0F80410C0F80BD2C0F81174C0F81188AAAA.
      parameters: {}

    22C002:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        27 bytes as stored, ending in 0xAA frame padding (only old, padded reads exist). The C001
        sensor IDs in a different order. Sample:
        62C002FFFF0000C0F81174C0F80410C0F80BD2C0F81188AAAAAAAA.
      parameters: {}

    22C003:
