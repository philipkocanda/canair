# ─── ESC (Electronic Stability Control) ──────────────────────────────
ESC:
  tx_id: 0x7D1
  can_bus: [C-CAN, P-CAN]  # P-CAN from US wiring; unconfirmed on the EU car
  identity:
    alias: AHB
    description: Electronic Stability Control
    serial: "GWLK7F01A986826"
    app_sw: "G7"
    id_protocol: UDS  # F1xx (limited — no part number DID)
    notes: >-
      Electronic Stability Control (ABS/AHB). 22C101 carries vehicle speed, the four wheel speeds,
      gear, brake pressure and steering angle.
  vehicle_states: [ACC, "ON", READY]
  # Multi-DID batching verified 2026-07-29: `22 C101 C102` returns both DIDs in one reply.
  multi_did: true
  pids:
    22C101:
      response_frames: 7
      status: active
      period: 2500
      vehicle_states: []
      source: RE 2026-07-22 driving capture; r=+1.000 vs REAL_SPEED_KMH
      min: "0"
      verified: true
      parameters:
        REAL_SPEED_KMH:
          expression: B12
          unit: km/h
          max: "250"
          source: Kia Niro EV WiCAN PR#660; verified RE 2026-07-22
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/660
          notes: >-
            1 km/h per LSB. r=+1.000 vs the four wheel speeds; 0 at standstill. Unsigned: positive
            when reversing; direction comes from GEAR_SELECTOR. B10, B11 and B13 are constant 0xFF.
            True road speed: MCU_MOTOR_RPM is 63.96 rpm per km/h above 30 km/h (n=1223), against
            64.07 expected from the 7.412 reduction ratio and 1928 mm tyre circumference (uhi22).
            VCU_VEHICLE_SPEED reads about 3.6 % higher.
        WHEEL_SPEED_FL:
          expression: B18
          unit: km/h
          max: "250"
          notes: >-
            1 km/h per LSB. B18 and B20 track together and diverge from B19 and B21 in turns, so
            they are the left pair; front versus rear follows the Ioniq 5 OBDb order and is not
            checked.
        WHEEL_SPEED_FR:
          expression: B19
          unit: km/h
          max: "250"
          notes: 1 km/h per LSB. Right pair with B21; front versus rear not checked.
        WHEEL_SPEED_RL:
          expression: B20
          unit: km/h
          max: "250"
          notes: 1 km/h per LSB. Left pair with B18; front versus rear not checked.
        WHEEL_SPEED_RR:
          expression: B21
          unit: km/h
          max: "250"
          notes: 1 km/h per LSB. Right pair with B19; front versus rear not checked.
        GEAR_SELECTOR:
          expression: B14
          max: "8"
          source: canair investigate/hunt vs VCU:2101:GEAR_P, 2026-07-22 drive; Reverse confirmed 2026-07-26
          notes: >-
            1 Park, 2 Reverse, 4 Drive (Reverse confirmed 2026-07-26, n=52). Neutral not captured
            yet.
        LONG_ACCEL_RAW:
          expression: B23-128
          min: "-128"
          max: "127"
          source: canair hunt/investigate 2026-07-22 drive
          verified: false
          notes: >-
            Name is unconfirmed. Raw 113-139 while driving (n=381). r=+0.70 vs VCU ACCEL_PEDAL_DEPTH
            and -0.90 vs VCU NOT_BRAKING, but only +0.43 vs d(speed)/dt; the sign of its correlation
            with acceleration flips between 2.5 s and 1.2 s joins. Sign and scale unknown.
        BRAKE_PRESSURE:
          expression: B44
          max: "255"
          source: canair correlate/decode 2026-07-22 drive
          verified: false
          notes: >-
            Continuous 0-53, median 0. r=+0.973 vs VCU:2101:VEHICLE_STATE_BRAKE_LAMP (n=124). B45
            reads almost the same. Raw units.
        STEERING_ANGLE:
          expression: ([B35:B36]-32768)/10
          unit: deg
          min: "-600"
          max: "600"
          source: RE 2026-07-26 held-wheel + 2026-07-30 DRIVING steer-sweep; EPS 220101 cross-check
          notes: >-
            Big-endian offset binary, zero at 0x8000, 0.1 ° per LSB. r=+1.000 vs EPS_STEERING_ANGLE
            over a ±90 ° sweep (2026-07-30). Holds its value while stationary. Rare frames read
            about 3276 ° (raw near 0xFFFF) and are invalid.
        YAW_RATE_RAW:
          expression: ((B39<<8)|B41)-2048
          min: "-2048"
          max: "2047"
          source: canair align --csv + kinematic fit, 2026-10-21 (DRIVING captures)
          verified: false
          notes: >-
            Yaw rate, 12-bit offset binary centred on 2048, split around the PCI byte B40. r=+0.992
            vs speed × STEERING_ANGLE (n=1544 moving samples); same sign as STEERING_ANGLE. Reads -5
            at rest; 0xFFFF when not ready. Scale unproven: two full-lock samples (5.0-5.3 m turning
            radius) give about 0.06 deg/s per count.
        LAT_ACCEL_RAW:
          expression: "[B37:B38]-2048"
          min: "-2048"
          max: "2047"
          source: canair align --csv + kinematic fit, 2026-10-21 (DRIVING captures)
          verified: false
          notes: >-
            Lateral acceleration, 12-bit offset binary centred on 2048. r=+0.930 vs speed ×
            YAW_RATE_RAW and +0.910 vs speed² × STEERING_ANGLE (n=1544), but only +0.05 vs speed and
            +0.07 vs LONG_ACCEL_RAW. Reads about +8 at rest. Scale unproven: with yaw at 1/16 deg/s
            per count the fit gives about 0.017 m/s² per count.
        ESC_SUPPLY_VOLTAGE:
          expression: B15/16
          unit: V
          max: "16"
          source: canair investigate/hunt 2026-10-21
          verified: false
          notes: >-
            12 V supply voltage at the ESC, 0.0625 V/bit. r=+0.997 vs OBC:2101:LDC_OUTPUT_V (n=1194)
            and +0.995 vs BMS:2101:AUX_BATTERY_VOLTAGE (n=1608); read 13.81 V against
            VCU_AUX_BATTERY_VOLTAGE_FINE 13.79 V on 2026-08-08.
        BRAKE_PRESSURE_2:
          expression: B45
          max: "255"
          source: canair decode --corr 2026-10-21
          verified: false
          notes: >-
            r=+1.000 vs BRAKE_PRESSURE (B44) over 1693 DRIVING captures, 0-59, at times one count
            apart. Disabled as a near-duplicate.
          enabled: false
    22C102:
      status: draft
      period: 2500
      vehicle_states: []
      notes: >-
        26 bytes. 2026-04-17: 62C1023FE00000FFFFFFFFFFFF01010000A9AA000000C0C0D4D4. 2026-07-22
        (READY, parked): the word after 01010000 read 9C9C instead of A9AA; the rest was unchanged.
  research:
    - type: decode
      target: "22C101"
      status: captured
      priority: P2
      vehicle_states: [ACC]
      notes: >-
        Decoded: speed, wheel speeds, gear, steering angle, brake pressure, yaw rate, lateral accel,
        supply voltage. Open: wheel front/rear within a side follows convention only; B22 and B27
        are low-rate status or counter bytes. Speed is an unsigned magnitude, so a signed speed has
        to combine REAL_SPEED_KMH with GEAR_SELECTOR outside a single expression.
      what_to_test:
        - "Confirm wheel front/rear assignment (needs known-corner reference)"
        - "GEAR_SELECTOR Neutral value: capture a shift through N"
      sources:
        - "captures/2026-07-22.json — driving capture, lots of steering"
        - "captures/2026-07-26.json — driveway steer-and-hold capture"
        - "OBDb Ioniq 5"
    - type: scan
      target: "22 C101-C10F"
      status: done
      priority: P2
      vehicle_states: [ACC]
      notes: "ESC C1xx range scan."
    - type: scan
      target: "22 0101-010F"
      status: nrc
      priority: P2
      vehicle_states: [ACC]
      notes: All NRC on this car. OBDb Ioniq 5 puts individual wheel speeds at 0104.
      sources:
        - "OBDb Ioniq 5"
    - type: scan
      target: "22 F010 (on 0x730)"
      status: nrc
      priority: P2
      vehicle_states: [READY]
      notes: >-
        NRC here. The Ioniq 5 ESC (0x730) answers 22F010 with 4 wheel speeds (16-bit, /32), steering
        angle (/10), lateral and longitudinal accel and yaw rate.
      sources:
        - "OBDb Ioniq 5"
    - type: decode
      target: 22C101 lateral accel + yaw rate (ESP12 lead)
      status: captured
      priority: P2
      vehicle_states: [DRIVING]
      created: "2026-10-21"
      updated: "2026-10-21"
      result: >-
        YAW_RATE_RAW = (B39<<8)|B41 - 2048 (r=+0.992 vs speed × steering angle) and LAT_ACCEL_RAW =
        [B37:B38] - 2048 (r=+0.930 vs speed × yaw). Scales unproven (about 0.06 deg/s and 0.017 m/s²
        per count from turning-radius geometry). LONG_ACCEL_RAW (B23) only reaches r=+0.43 vs
        d(speed)/dt at 1 km/h speed resolution.
      notes: >-
        opendbc ESP12 (0x220, sender ESC) carries LAT_ACCEL, LONG_ACCEL, YAW_RATE and CYL_PRES
        (brake pressure). On the uhi22 Ioniq 28 logs: longitudinal accel -1.8 to +1.8 m/s², brake
        pressure 0-65 bar. Broadcast scalings: accel 11-bit, 0.01 m/s²/bit, offset -10.23; yaw
        13-bit, 0.01/bit, offset -40.95 (unit not given). The DID encoding may differ.
      sources:
        - opendbc hyundai_2015_ccan.dbc (commaai, MIT), cross-checked against uhi22 Ioniq28Investigations P-CAN logs (scripts/fetch_can_corpus.py)
      what_to_test:
        - "Yaw and lateral-accel scales: drive circles of known radius at steady speed"
        - "Brake pressure scale: compare BRAKE_PRESSURE (B44) range in normal stops against ESP12's 0-65 bar"
      capture_protocol: >-
        canair monitor ESC:22C101 --save --keep-all --label 'ESC turns' --state DRIVING. In an empty
        car park, drive slow left and right circles and a few firm stops, pressing 's' to note each.
    - type: scan
      target: 22 4000
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: >-
        OBDb defines 7D1 22 0104 and 22 4000 (four signals each). 22 0101-010F are NRC; 22 4000 was
        never tried. OBDb 2017/2018 command_support lists both as unsupported, but that list also
        marks VCU 2101 unsupported, which answers on this car.
      sources:
        - OBDb Hyundai-IONIQ-Electric signalset (pelican.clutch.engineering ioniq-electric parameters), compared 2026-10-27
      capture_protocol: >-
        canair read ESC:224000 --save in READY, then widen to 22 4000-400F if it answers
  dtcs:
    source: Ioniq Electric 2017 service manual, ESP/AHB diagnosis (EV)
    source_links:
      - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Brakes/Traction%20Control/Esp%2FAHB%20Diagnosis%20%28EV%29/
    verified: false
    C1101:
      description: Battery voltage high
      causes: power supply circuit (IGN+), alternator, LDC, IBAU
      notes: >-
        Listed as C1101-01. VBAT above 17 +/-0.5 V for 2 s, or above 19 +/-0.5 V for 0.5 s. Clears
        after 2 s back in range.
    C1102:
      description: Battery voltage low
      causes: power supply circuit, discharged battery, LDC, IBAU
      notes: >-
        Listed as C1102-01. VBAT below 9.5 +/-0.5 V for 0.5 s above 7 km/h, or below 8.0 +/-0.5 V
        below 7 km/h or during ABS/TCS/ESP control.
    C1103:
      description: Ignition voltage
      causes: ignition circuit, power supply circuit, IBAU
      notes: >-
        Listed as C1103-01. Hardware ignition input off for over 30 s above 15 km/h. No warning
        lamp.
    C1113:
      description: 5 V sensor power voltage
      causes: sensor supply circuit, IBAU
      notes: Listed as C1113-01. Sensor supply outside 5 +/-0.25 V for over 1 s.
    C1200:
      description: Wheel speed sensor front-LH open/short
      causes: sensor circuit open or short, wheel speed sensor, connector
      notes: >-
        Listed as C1200-01. Sensor current outside 4-60 mA (+/-10 %) for over 140 ms, or leakage
        current above limit.
    C1201:
      description: Wheel speed sensor front-LH range/performance/intermittent
      causes: >-
        sensor installation, rotor or wheel bearing, tone wheel, sensor, external noise, wrong
        sensor type
      notes: >-
        Listed as C1201-02. Repeated speed jumps (wheel acceleration of +/-100 g or 70 g), the wheel
        out of step with the others for 20 s to 2 min, or a sensor of the wrong type. Jump counters
        clear every 30 min.
    C1202:
      description: Wheel speed sensor front-LH invalid/no signal
      causes: sensor installation, large air gap, rotor or wheel bearing, wrong sensor type, sensor
      notes: >-
        Listed as C1202-02. Air gap: the slowest wheel below 0.25 km/h while the others exceed 10
        km/h for 160 ms, or two wheels below 2 km/h for 20 s. Also ABS control longer than 36 s, or
        a wheel above 512 km/h.
    C1203:
      description: Wheel speed sensor front-RH open/short
      causes: sensor circuit open or short, wheel speed sensor, connector
      notes: >-
        Listed as C1203-01. Sensor current outside 4-60 mA (+/-10 %) for over 140 ms, or leakage
        current above limit.
    C1204:
      description: Wheel speed sensor front-RH range/performance/intermittent
      causes: >-
        sensor installation, rotor or wheel bearing, tone wheel, sensor, external noise, wrong
        sensor type
      notes: >-
        Listed as C1204-02. Repeated speed jumps (wheel acceleration of +/-100 g or 70 g), the wheel
        out of step with the others for 20 s to 2 min, or a sensor of the wrong type. Jump counters
        clear every 30 min.
    C1205:
      description: Wheel speed sensor front-RH invalid/no signal
      causes: sensor installation, large air gap, rotor or wheel bearing, wrong sensor type, sensor
      notes: >-
        Listed as C1205-02. Air gap: the slowest wheel below 0.25 km/h while the others exceed 10
        km/h for 160 ms, or two wheels below 2 km/h for 20 s. Also ABS control longer than 36 s, or
        a wheel above 512 km/h.
    C1206:
      description: Wheel speed sensor rear-LH open/short
      causes: sensor circuit open or short, wheel speed sensor, connector
      notes: >-
        Listed as C1206-01. Sensor current outside 4-60 mA (+/-10 %) for over 140 ms, or leakage
        current above limit.
    C1207:
      description: Wheel speed sensor rear-LH range/performance/intermittent
      causes: >-
        sensor installation, rotor or wheel bearing, tone wheel, sensor, external noise, wrong
        sensor type
      notes: >-
        Listed as C1207-02. Repeated speed jumps (wheel acceleration of +/-100 g or 70 g), the wheel
        out of step with the others for 20 s to 2 min, or a sensor of the wrong type. Jump counters
        clear every 30 min.
    C1208:
      description: Wheel speed sensor rear-LH invalid/no signal
      causes: sensor installation, large air gap, rotor or wheel bearing, wrong sensor type, sensor
      notes: >-
        Listed as C1208-02. Air gap: the slowest wheel below 0.25 km/h while the others exceed 10
        km/h for 160 ms, or two wheels below 2 km/h for 20 s. Also ABS control longer than 36 s, or
        a wheel above 512 km/h.
    C1209:
      description: Wheel speed sensor rear-RH open/short
      causes: sensor circuit open or short, wheel speed sensor, connector
      notes: >-
        Listed as C1209-01. Sensor current outside 4-60 mA (+/-10 %) for over 140 ms, or leakage
        current above limit.
    C1210:
      description: Wheel speed sensor rear-RH range/performance/intermittent
      causes: >-
        sensor installation, rotor or wheel bearing, tone wheel, sensor, external noise, wrong
        sensor type
      notes: >-
        Listed as C1210-02. Repeated speed jumps (wheel acceleration of +/-100 g or 70 g), the wheel
        out of step with the others for 20 s to 2 min, or a sensor of the wrong type. Jump counters
        clear every 30 min.
    C1211:
      description: Wheel speed sensor rear-RH invalid/no signal
      causes: sensor installation, large air gap, rotor or wheel bearing, wrong sensor type, sensor
      notes: >-
        Listed as C1211-02. Air gap: the slowest wheel below 0.25 km/h while the others exceed 10
        km/h for 160 ms, or two wheels below 2 km/h for 20 s. Also ABS control longer than 36 s, or
        a wheel above 512 km/h.
    C1233:
      description: Front pressure sensor
      causes: bleeding, hydraulic line leak, pressure sensor, PSU
      notes: >-
        Listed as C1233-02. Accumulator (HPA) pressure unchanged for over 5 s while charging. Lamps
        and buzzer.
    C1235:
      description: Pressure sensor (primary), electrical
      causes: bleeding, hydraulic line leak, pressure sensor, PSU
      notes: >-
        Listed as C1235-01. Either sensor signal above 4.8 V or below 0.2 V for over 1 s, or their
        average outside 2.5 +/-0.1 V.
    C1236:
      description: Pressure sensor (secondary), electrical
      causes: bleeding, hydraulic line leak, pressure sensor, excessive braking
      notes: >-
        Listed as C1236-02. Accumulator pressure under 100 bar for over 1.2 s; repeated hard braking
        can set it.
    C1260:
      description: Steering angle sensor circuit, signal
      causes: installation, calibration, steering angle sensor
      notes: >-
        Listed as C1260-02. Angle over 55 deg while driving straight, out of sensor range, rate off
        the estimate by over 50 deg/s for 1.5 s, or under 3 deg in a curve.
    C1261:
      description: Steering angle sensor not calibrated
      causes: not calibrated after sensor or IBAU replacement
      notes: Listed as C1261-04. Clears after zero-point calibration with the diagnostic tool.
    C1283:
      description: Lateral G, longitudinal G or yaw rate sensor, signal error
      causes: IMU in the airbag control unit (SRSCM), installation, wiring, IBAU
      notes: >-
        Listed as C1283-02. IMU values off the estimates, its rolling counter stuck for 100 ms, or
        its fail flag set; for example yaw rate over 6 deg/s for 2 s at standstill.
    C1285:
      description: Longitudinal G (Ax) signal not calibrated
      causes: uncalibrated longitudinal G sensor
      notes: Listed as C1285-04. Zero point not set, or a sensor replacement detected.
    C1286:
      description: Yaw rate and G sensor failure, check SRSCM
      causes: IMU in the SRSCM, installation
      notes: Listed as C1286-01. IMU rolling counter stuck for 0.1 s, or its fail flag repeated.
    C1287:
      description: Brake fluid low
      causes: brake fluid leak, brake fluid pressure line sensor
      notes: Listed as C1287-02. Fluid level signal low for over 1 s. RBS lamp only.
    C1604:
      description: ECU hardware error
      causes: IBAU
      notes: >-
        Listed as C1604-04. Internal fault: EEPROM write or erase, RAM, ROM, timer, A/D converter,
        internal communication or internal power supply.
    C160E:
      description: P-CAN bus off
      causes: short in the CAN line, IBAU
      notes: Listed as C160E-08. Bus off more than 10 times in a row (70 ms recovery each).
    C1616:
      description: C-CAN bus off
      causes: short in the CAN line, IBAU
      notes: Listed as C1616-08. Bus off more than 10 times in a row (70 ms recovery each).
    C1623:
      description: CAN time-out, steering angle sensor
      causes: steering angle sensor, open CAN line, connection, another ECU occupying the bus
      notes: Listed as C1623-08. No message for over 500 ms; monitored from 1.5 s after power-up.
    C1638:
      description: ACC (SCC) communication error
      causes: SCC, open CAN line, connection, another ECU occupying the bus
      notes: >-
        Listed as C1638-08. No SCC message for 500 ms during control or 1500 ms otherwise, or its
        alive counter stuck. No warning lamp.
    C1651:
      description: CAN time-out, EPB
      causes: EPB, IBAU
      notes: >-
        Listed as C1651-08. No message for 500 ms during control or 1500 ms otherwise. No warning
        lamp.
    C1687:
      description: CAN time-out, VSM2 (MDPS)
      causes: MDPS, IBAU
      notes: >-
        Listed as C1687-08. No VSM message from the MDPS for 500 ms during control or 1500 ms
        otherwise. No warning lamp.
    C16B4:
      description: CAN time-out, VCU
      causes: VCU, CAN line, connection, IBAU
      notes: Listed as C16B4-08. No message for 0.5 s during control or 1.5 s otherwise.
    C1702:
      description: Variant coding error
      causes: PCM replacement (as printed), IBAU
      notes: >-
        Listed as C1702-04. No or wrong variant code, or a 4WD, Ax or EPB message on a car coded
        without it. Clears once coded.
    C1806:
      description: CAN time-out, MCU
      causes: IBAU, MCU, CAN connection
      notes: Listed as C1806-08. No message for 500 ms during control or 1500 ms otherwise.
    C2112:
      description: Valve relay error
      causes: power supply circuit (IGN+), IBAU
      notes: >-
        Listed as C2112-01. Relay voltage under 6 V for 0.2 s with the relay on, or over 1 +/-0.15 V
        across the relay for 0.2 s.
    C2227:
      description: Excessive temperature of brake disc
      causes: overheated disc, pad-to-disc air gap, wheel cylinder
      notes: >-
        Listed as C2227-07. Calculated disc temperature above 500 C, or above 650 C with DBC on. No
        warning lamp; clears below 400 C.
    C2380:
      description: ABS/TCS/ESP valve error
      causes: connector, IBAU
      notes: >-
        Listed as C2380-01. Solenoid coil open or short, for example an ABS valve under 2.0 V or
        over 8.5 +/-2.5 A for 0.06 s. An AHB valve fault disables AHB and sounds the buzzer.
    C2402:
      description: Motor electrical
      causes: power supply circuit (ABS1), IBAU
      notes: >-
        Listed as C2402-01. Pump motor fuse open, motor circuit open or short, or motor ground loss.
