# yaml-language-server: $schema=https://philipkocanda.github.io/canair/schema/ecus.json
# ─── AAF (Active Air Flap controller) ────────────────────────────────
AAF:
  tx_id: 0x7E6
  can_bus: [P-CAN]
  identity:
    description: Active Air Flap controller
    part_number: M3062000307  # KWP2000 1A91
    sw_id: EAE16AAFB30001  # KWP2000 1A8D
    firmware: EAEAAFP201  # KWP2000 1A98
    id_protocol: KWP2000  # 1Axx
    notes: >-
      Active Air Flap controller ("AAF" module code in sw_id and firmware), in the front bumper
      behind the grille, at the radiator that cools the powertrain (inverter, motor, OBC, LDC).
  vehicle_states: [IG3]
  pids:
    2180:
      response_frames: 4
      status: active
      period: 60000
      vehicle_states: [IG3]
      unit: °C
      min: "-40"
      verified: false
      parameters:
        AMBIENT_TEMP:
          expression: "(B18-80)/2"
          max: "87"
          source: "Original WiCAN config"
          verified: true
          notes: >-
            Matches the ITStromer community sheet rows at known temperatures (10 °C read 9, 0 °C
            read 0.5, 14 °C read 14).

        HEATER_ELEMENT_TEMP:
          expression: "S17/2"
          max: "120"
          source: "ITStromer community PID sheet (heating element = signed(l)/2)"
          notes: >-
            Community sheet: 8 °C with heat set to 15.5 °C, 27 °C with heat set to 30 °C, about
            ambient with heat off. Range 14.5-51 °C.

        HEATSINK_TEMP:
          expression: "B20-40"
          max: "150"
          source: "ITStromer community PID sheet (VMCU heat sink = o-40)"
          notes: Range 9-70 °C.

        COMPRESSOR_TEMP:
          expression: "B21-40"
          max: "120"
          source: "ITStromer community PID sheet (compressor = p-40)"
          notes: About ambient with the A/C off; range 12-66 °C.

        AAF_COOLANT_TEMP_B25:
          expression: B25-100
          max: "150"
          source: canair correlate --find-mirrors --allow-offset 2026-10-21
          notes: >-
            Same raw byte as VCU:2102 B18, so it reads VCU_COOLANT_TEMP (equal in 4321 of 4469
            aligned rows, r=+0.999). Not a 12 V voltage: r=-0.04 vs VCU_AUX_BATTERY_VOLTAGE_FINE.
    2181:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [CHARGING]
      notes: >-
        25 bytes, same layout as 2180 with extra populated bytes (B19, B22, B23, B24); answers in
        ON.
      source: cross-ECU correlation vs ESC REAL_SPEED_KMH, 2026-07-22 drive
      verified: false
      parameters:

        AAF_VEHICLE_SPEED_KMH:
          expression: B13
          unit: km/h
          min: "0"
          max: "250"
          notes: r=0.997 vs ESC:22C101:REAL_SPEED_KMH (n=66, 2026-07-22). Range 0-121 km/h.
        AAF_VEHICLE_SPEED_MPH:
          expression: B12
          unit: mph
          min: "0"
          max: "160"
          notes: Slope 0.6244 vs ESC:22C101:REAL_SPEED_KMH (0.6214 expected for mph), r=0.997.
        AAF_COOLANT_TEMP_B25:
          expression: B25-100
          unit: °C
          min: "-40"
          max: "150"
          source: canair correlate --find-mirrors --allow-offset 2026-10-21
          notes: >-
            Same byte as AAF:2180:AAF_COOLANT_TEMP_B25 and VCU:2102 B18 (VCU_COOLANT_TEMP). Disabled
            as a duplicate.
        HEATSINK_TEMP:
          expression: B20-40
          unit: °C
          min: "-40"
          max: "150"
          source: canair correlate 2026-07-22 drive
          notes: Same byte and scale as AAF:2180:HEATSINK_TEMP.
        MOTOR_COOLANT_TEMP:
          expression: B22-40
          unit: °C
          min: "-40"
          max: "150"
          source: RE 2026-08-05 cross-ECU agreement with VCU:2102 VCU_COOLANT_TEMP
          notes: >-
            Equals VCU:2102:VCU_COOLANT_TEMP in 77 % of 1729 co-polled rows; read up to 11 °C above
            it on the 2026-08-08 DC charge day. Rose 29 to 44 °C over a 3 h AC charge; 34-37 °C
            while driving. The loop also serves the EPCU, OBC and LDC; which branch the sensor sits
            on is unknown.
        AAF_LDC_TEMP:
          expression: B19-100
          unit: °C
          min: "-40"
          max: "150"
          source: RE 2026-08-05 cross-ECU offset-mirror vs verified OBC LDC_TEMP
          verified: true
          notes: >-
            Same raw value as OBC:2101:LDC_TEMP (equal in 94.9 % of 1729 co-polled rows, otherwise
            off by 1). Disabled as a duplicate.
        AMBIENT_TEMP:
          expression: (B18-80)/2
          unit: °C
          min: "-40"
          max: "60"
          source: RE 2026-08-05 cross-ECU offset-mirror vs verified AAF 2180 AMBIENT_TEMP
          verified: true
          notes: >-
            Equals AAF:2180 B18 in 98.1 % of 839 co-polled rows. Disabled as a duplicate of
            AAF:2180:AMBIENT_TEMP.
        AAF_2181_B27:
          expression: B27
          type: enum
          values:
            2: heat_pump
            7: charging
          source: 2026-08-08 DCFC byte-diff + full-corpus state check
          notes: >-
            7 in every charging capture, AC and DC. 2 in all 218 rows with HVAC_HEAT_PUMP_ON = 1
            (2026-07-26, 2026-11-02) and in no row with it 0; on 2026-11-02 it went 2 -> 6 in the
            same poll as the heat pump stopped. 6 only with the compressor off; 0 mostly with the
            A/C running; 5 unknown. Fits a 3-bit mode (opendbc AAF11 CF_Aaf_ModeStatus).
        AAF_2181_B15:
          expression: B15
          type: numeric
          source: 2026-08-08 DCFC byte-diff; compressor and speed analysis 2026-11-02
          notes: >-
            Reads 0, 52, 67 or 82. Nonzero in 344 of 477 rows with HVAC_COMPRESSOR_POWER above 0 and
            8 of 409 without. With the A/C on while driving it reads 52 above about 50 km/h and 67
            below about 40 km/h; 67 during heat-pump heating parked at 9 °C (2026-07-26,
            2026-11-02); 82 only parked at 30 °C ambient; 0 while charging and with the compressor
            off. Fits a front-flap opening (opendbc AAF11 CF_Aaf_PStatus, 0-100 %), not checked
            against the flaps.
          max: "100"
        AAF_COOLANT_TEMP_2:
          expression: B23-40
          unit: °C
          source: 2026-08-08 DCFC session byte-diff
          notes: >-
            r=+0.976 vs VCU:2102:VCU_COOLANT_TEMP; reads a few °C off MOTOR_COOLANT_TEMP. Rose 36 to
            43 °C during the 2026-08-08 DC charge.

  research:
    - type: scan
      target: 21 00-FF
      status: done
      priority: P3
      vehicle_states: [READY]
      date: "2026-07-22"
      result: Only LIDs 80 and 81 answer (ignition on); all others NRC.
    - type: decode
      target: 2180 B28/B29 mirror
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-07-23"
      notes: >-
        B28 and B29 are an exact mirror pair (raw 141-152, near-constant) that does not track
        ambient. Undecoded; needs a capture over a wide temperature range.
    - type: verify
      target: 2181 AAF_2181_B27/AAF_2181_B15/AAF_COOLANT_TEMP_2
      status: captured
      priority: P2
      vehicle_states: [CHARGING, DRIVING]
      created: "2026-08-08"
      updated: "2026-11-02"
      notes: >-
        B27 and B15 were reworked on 2026-11-02 against HVAC compressor and heat-pump data (see
        their notes and the AAF11 lead). Open: B27 values 0, 5 and 6; AAF_COOLANT_TEMP_2 (B23-40,
        r=0.976 vs VCU_COOLANT_TEMP) sensor location relative to MOTOR_COOLANT_TEMP (B22).
      what_to_test:
        - "AAF_2181_B27: what raw 0/2/5/6 correspond to"
        - "AAF_2181_B15: correlate against AAF_VEHICLE_SPEED_KMH and time parked"
        - "AAF_COOLANT_TEMP_2: sensor location relative to MOTOR_COOLANT_TEMP (B22)"
    - type: decode
      target: 2181 flap position/status (AAF11 lead)
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-21"
      updated: "2026-11-02"
      notes: >-
        AAF_2181_B15 is the flap-position candidate: it reads only 0, 52, 67 and 82 (inside 0-100),
        opens with the refrigerant compressor (nonzero in 344 of 477 compressor-on rows, 8 of 409
        compressor-off), and with the A/C on while driving steps 52 above about 50 km/h and 67 below
        about 40 km/h. AAF_2181_B27 is the mode candidate: 2 exactly while the heat pump runs, 7
        while charging. Open: watch the flaps (grille) at each B15 value; no 2-bit status or error
        word found yet.
      sources:
        - opendbc hyundai_2015_ccan.dbc (commaai, MIT), cross-checked against uhi22 Ioniq28Investigations P-CAN logs (scripts/fetch_can_corpus.py)
      what_to_test:
        - B15 stays within 0-100 in every capture
        - B15 rises when motor/coolant temps rise (flap opening for cooling) or changes with speed
        - A 2-bit flap status and an error word that stays 0 in normal operation
    - type: decode
      target: 2180/2181 per-byte support maps
      status: captured
      priority: P3
      vehicle_states: [IG3]
      created: "2026-11-01"
      updated: "2026-11-01"
      result: >-
        2026-11-01, over all stored captures (4742 2180 rows, 15 dates): both pages start with a
        constant 4-byte map at B04-B07, 2180 C3 66 C0 00 and 2181 FF FF C0 00. Read per byte, most
        significant bit first, map bit k marks ISO-TP data byte 7+k, which is WiCAN B10 onward with
        the PCI bytes B16 and B24 skipped; data byte 6 (B09) is covered by neither map. The 2180 map
        is a subset of the 2181 map, and their difference (3C 99 00) marks exactly the bytes that
        vary in 2181 but read 00 in every 2180 row: B12, B13 (vehicle speed), B14, B15, B19 (LDC
        temperature), B22 (motor coolant), B23 and B27. Every byte that varies in 2180 except B09
        lies inside its own map. So each map says which fields that page fills in, and an unmarked
        field reads 0.
      notes: >-
        Not declared with pids set-support-map: the declaration model has the covered data follow
        the map directly, and here a byte sits in between. investigate --support-map misses the pair
        for the same reason. With that one-byte gap, VCU 2101, OBC 2101 and ESC 22C101 still do not
        fit.
      sources:
        - canair captures uds --json and decode --dump-bytes over all stored AAF 2180/2181 captures, 2026-11-01
      what_to_test:
        - Confirm the one-byte gap against a 2180/2181 payload with bix --annotate before declaring it
        - Teach the support-map declaration (and investigate --support-map) an offset between map and covered data, then declare both pages
