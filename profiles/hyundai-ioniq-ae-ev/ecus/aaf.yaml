# yaml-language-server: $schema=https://philipkocanda.github.io/canair/schema/ecus.json
# ─── AAF (Active Air Flap controller) ────────────────────────────────
AAF:
  tx_id: 0x7E6
  can_bus: [P-CAN]
  identity:
    description: Active Air Flap controller
    part_number: M3062000307  # KWP2000 1A91
    sw_id: EAE16AAFB30001  # KWP2000 1A8D
    firmware: EAEAAFP201  # KWP2000 1A98
    id_protocol: KWP2000  # 1Axx
    notes: >-
      Active Air Flap controller ("AAF" module code in sw_id and firmware), in the front bumper
      behind the grille, at the radiator that cools the powertrain (inverter, motor, OBC, LDC).
  vehicle_states: [IG3]
  pids:
    2180:
      response_frames: 4
      status: active
      period: 60000
      vehicle_states: [IG3]
      unit: °C
      min: "-40"
      verified: false
      parameters:
        AMBIENT_TEMP:
          expression: "(B18-80)/2"
          max: "87"
          source: "Original WiCAN config"
          verified: true
          notes: >-
            Matches the ITStromer community sheet rows at known temperatures (10 °C read 9, 0 °C
            read 0.5, 14 °C read 14).

        AAF_REFRIGERANT_PRESSURE:
          expression: B17*0.1379
          max: "35"
          source: canair hunt vs HVAC:220102:HVAC_REFRIGERANT_PRESSURE 2026-11-07
          notes: >-
            Same quantity as HVAC:220102:HVAC_REFRIGERANT_PRESSURE in 2 psi (0.138 bar) counts: HVAC
            B19 = 1.42 x B17, r=1.000, n=2387. Raw 96-133 during heat-pump heating at 5 °C ambient
            (2026-11-07). The signed S17/2 reading of the community sheet ('heating element') jumps
            to about -63 °C whenever the byte passes 127. Disabled as a duplicate.
          unit: bar
          min: "0"
          verified: true
          ship: false

        HEATSINK_TEMP:
          expression: "B20-40"
          max: "150"
          source: "ITStromer community PID sheet (VMCU heat sink = o-40)"
          notes: >-
            Range -7 to 70 °C. Cold-soaked on 2026-11-26 it read -6 to -5 °C against -1.5 °C
            ambient, 0 °C on every BMS module and -3 to 0 °C on the coolant sensors (VCU_LDC_TEMP,
            MOTOR_COOLANT_TEMP, MCU_COOLANT_TEMP), like MCU:2102:MCU_HEATSINK_TEMP.

        AAF_MOTOR_TEMP:
          expression: "B21-40"
          max: "120"
          source: "canair hunt vs MCU:2102:MCU_MOTOR_TEMP 2026-11-26 (ITStromer: compressor)"
          notes: >-
            Drive-motor temperature: the same value as MCU:2102:MCU_MOTOR_TEMP, r=+0.999 over 5519
            rows joined within 5 s, B21 = motor °C + 39.6. Not a compressor temperature: 20-22 °C at
            7 °C ambient with the A/C off (2026-11-22), and -6 to -5 °C cold-soaked at -1.5 °C
            ambient (2026-11-26). Range -7 to 66 °C.

        AAF_COOLANT_TEMP_B25:
          expression: B25-100
          max: "150"
          source: canair correlate --find-mirrors --allow-offset 2026-10-21
          notes: >-
            Same raw byte as VCU:2102 B18, so it reads VCU_LDC_TEMP (equal in 4321 of 4469 aligned
            rows, r=+0.999). Not a 12 V voltage: r=-0.04 vs VCU_AUX_BATTERY_VOLTAGE_FINE.
        AAF_12V_SUPPLY_2180:
          expression: B28*0.093+0.655
          unit: V
          min: "0"
          max: "16"
          source: canair decode --corr vs VCU 12 V signals, 2026-11-27
          verified: false
          notes: >-
            Same field as 2181 AAF_12V_SUPPLY (B29 equals B28); r=0.997 vs
            VCU_AUX_BATTERY_VOLTAGE_FINE, n=7998. Off the device as a copy.
          ship: false
    2181:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [IG3]
      notes: >-
        25 bytes, same layout as 2180 with extra populated bytes (B19, B22, B23, B24); answers in
        ON.
      source: cross-ECU correlation vs ESC REAL_SPEED_KMH, 2026-07-22 drive
      verified: false
      parameters:

        AAF_VEHICLE_SPEED_KMH:
          expression: B13
          unit: km/h
          min: "0"
          max: "250"
          notes: r=0.997 vs ESC:22C101:REAL_SPEED_KMH (n=66, 2026-07-22). Range 0-121 km/h.
        AAF_VEHICLE_SPEED_MPH:
          expression: B12
          unit: mph
          min: "0"
          max: "160"
          notes: Slope 0.6244 vs ESC:22C101:REAL_SPEED_KMH (0.6214 expected for mph), r=0.997.
        AAF_COOLANT_TEMP_B25:
          expression: B25-100
          unit: °C
          min: "-40"
          max: "150"
          source: canair correlate --find-mirrors --allow-offset 2026-10-21
          notes: >-
            Same byte as AAF:2180:AAF_COOLANT_TEMP_B25 and VCU:2102 B18 (VCU_LDC_TEMP). Disabled as
            a duplicate.
        HEATSINK_TEMP:
          expression: B20-40
          unit: °C
          min: "-40"
          max: "150"
          source: canair correlate 2026-07-22 drive
          notes: Same byte and scale as AAF:2180:HEATSINK_TEMP.
        MOTOR_COOLANT_TEMP:
          expression: B22-40
          unit: °C
          min: "-40"
          max: "150"
          source: RE 2026-08-05 cross-ECU agreement with VCU:2102 VCU_LDC_TEMP
          notes: >-
            Equals VCU:2102:VCU_LDC_TEMP in 77 % of 1729 co-polled rows; read up to 11 °C above it
            on the 2026-08-08 DC charge day. Rose 29 to 44 °C over a 3 h AC charge; 34-37 °C while
            driving. The loop also serves the EPCU, OBC and LDC; which branch the sensor sits on is
            unknown.
        AAF_OBC_TEMP:
          expression: B19-100
          unit: °C
          min: "-40"
          max: "150"
          source: RE 2026-08-05 cross-ECU offset-mirror vs verified OBC_TEMP
          verified: true
          notes: >-
            Same raw value as OBC:2101:OBC_TEMP (equal in 94.9 % of 1729 co-polled rows, otherwise
            off by 1), the OBC temperature the OBC also sends on P-CAN 0x57F byte 2. Disabled as a
            duplicate.
        AMBIENT_TEMP:
          expression: (B18-80)/2
          unit: °C
          min: "-40"
          max: "60"
          source: RE 2026-08-05 cross-ECU offset-mirror vs verified AAF 2180 AMBIENT_TEMP
          verified: true
          notes: >-
            Equals AAF:2180 B18 in 98.1 % of 839 co-polled rows. Disabled as a duplicate of
            AAF:2180:AMBIENT_TEMP.
        AAF_2181_B27:
          expression: B27
          type: enum
          values:
            0: ac
            2: heat_pump
            5: ptc
            6: idle
            7: ignition_off
          source: 2026-08-08 DCFC byte-diff; HVAC heat-source cross-tab 2026-11-07
          notes: >-
            Thermal mode candidate (opendbc AAF11 CF_Aaf_ModeStatus). Time-joined with HVAC signals
            through 2026-11-07: 0 in 427 rows, 386 with compressor on and heat pump off; 2 in 281
            rows, all with heat pump on; 1 in 8 rows, all heat pump; 5 in 59 rows, 54 PTC-only; 6 in
            403 rows with neither running. 7 with IG3 on and the ignition off, whether charging or
            not: 3299 of 3405 rows in CHARGING+OFF sessions and 309 of 310 in OFF+IG3 sessions (IGPM
            BC44, 2026-11-22, 11-25, 11-26), never in a READY, ON or DRIVING session. Charging with
            the ignition on reads 6 (268 of 270). One 7 at 10:08:15 on 2026-11-22 came 2.1 s before
            IGPM IGN1 and IGN2 read on.
          verified: false
        AAF_2181_B15:
          expression: B15
          type: numeric
          source: 2026-08-08 DCFC byte-diff; compressor and speed analysis 2026-11-02
          notes: >-
            Reads 0, 52, 67 or 82. Nonzero in 344 of 477 rows with HVAC_COMPRESSOR_POWER above 0 and
            8 of 409 without. With the A/C on while driving it reads 52 above about 50 km/h and 67
            below about 40 km/h; 67 during heat-pump heating parked at 9 °C (2026-07-26,
            2026-11-02); 82 only parked at 30 °C ambient; 0 while charging and with the compressor
            off. Fits a front-flap opening (opendbc AAF11 CF_Aaf_PStatus, 0-100 %), not checked
            against the flaps.
          max: "100"
        AAF_COOLANT_TEMP_2:
          expression: B23-40
          unit: °C
          source: 2026-08-08 DCFC session byte-diff
          notes: >-
            r=+0.976 vs VCU:2102:VCU_LDC_TEMP; reads a few °C off MOTOR_COOLANT_TEMP. Rose 36 to 43
            °C during the 2026-08-08 DC charge.
        AAF_12V_SUPPLY:
          expression: B28*0.093+0.655
          unit: V
          min: "0"
          max: "16"
          source: canair decode --corr vs VCU, MCU and BCM 12 V signals, 2026-11-27
          verified: false
          notes: >-
            The AAF's 12 V supply. B29 equals B28. r=0.997 vs VCU:2102:VCU_AUX_BATTERY_VOLTAGE_FINE
            and MCU:2101:MCU_SUPPLY_VOLTAGE_1 (n=7565-7884); the scale and offset are the
            least-squares fit against the VCU (B28/10 reads 0.39 V high, median). Raw 108-155: about
            11-12 V with the LDC off, 14-15 V with it on. On 2026-11-27 (IG3 only, constant
            temperatures) it fell 117 to 114 as the 12 V sagged under the IG3 load, and read 108 at
            a wake, when the VCU supply dipped to 10.65 V. The earlier rise with coolant temperature
            came from READY, where the LDC runs and the coolant warms.

  research:
    - type: scan
      target: 21 00-FF
      status: done
      priority: P3
      vehicle_states: [READY]
      date: "2026-07-22"
      result: Only LIDs 80 and 81 answer (ignition on); all others NRC.
    - type: decode
      target: 2180 B28/B29 mirror
      status: done
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-11-27"
      result: >-
        B28 (= B29) is the AAF's 12 V supply, AAF_12V_SUPPLY_2180 / 2181 AAF_12V_SUPPLY: r=0.997 vs
        the VCU and MCU 12 V signals. The near-constant 141-152 was the LDC-held 14-15 V in READY;
        the 2026-11-27 IG3-only captures (LDC off) read 108-118 and tracked the 12 V sag at constant
        temperatures.
      notes: >-
        B28 and B29 are an exact mirror pair (raw 141-152, near-constant) that does not track
        ambient. Undecoded; needs a capture over a wide temperature range.
    - type: decode
      target: 2181 flap position/status (AAF11 lead)
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-21"
      updated: "2026-11-02"
      notes: >-
        AAF_2181_B15 is the flap-position candidate: it reads only 0, 52, 67 and 82 (inside 0-100),
        opens with the refrigerant compressor (nonzero in 344 of 477 compressor-on rows, 8 of 409
        compressor-off), and with the A/C on while driving steps 52 above about 50 km/h and 67 below
        about 40 km/h. AAF_2181_B27 is the mode candidate: 2 exactly while the heat pump runs, 7
        while charging. Open: watch the flaps (grille) at each B15 value; no 2-bit status or error
        word found yet.
      sources:
        - opendbc hyundai_2015_ccan.dbc (commaai, MIT), cross-checked against uhi22 Ioniq28Investigations P-CAN logs (scripts/fetch_can_corpus.py)
      what_to_test:
        - B15 stays within 0-100 in every capture
        - B15 rises when motor/coolant temps rise (flap opening for cooling) or changes with speed
        - A 2-bit flap status and an error word that stays 0 in normal operation
    - type: decode
      target: 2180/2181 per-byte support maps
      status: captured
      priority: P3
      vehicle_states: [IG3]
      created: "2026-11-01"
      updated: "2026-11-01"
      result: >-
        2026-11-01, over all stored captures (4742 2180 rows, 15 dates): both pages start with a
        constant 4-byte map at B04-B07, 2180 C3 66 C0 00 and 2181 FF FF C0 00. Read per byte, most
        significant bit first, map bit k marks ISO-TP data byte 7+k, which is WiCAN B10 onward with
        the PCI bytes B16 and B24 skipped; data byte 6 (B09) is covered by neither map. The 2180 map
        is a subset of the 2181 map, and their difference (3C 99 00) marks exactly the bytes that
        vary in 2181 but read 00 in every 2180 row: B12, B13 (vehicle speed), B14, B15, B19 (OBC
        temperature), B22 (motor coolant), B23 and B27. Every byte that varies in 2180 except B09
        lies inside its own map. So each map says which fields that page fills in, and an unmarked
        field reads 0.
      notes: >-
        Not declared with pids set-support-map: the declaration model has the covered data follow
        the map directly, and here a byte sits in between. investigate --support-map misses the pair
        for the same reason. With that one-byte gap, VCU 2101, OBC 2101 and ESC 22C101 still do not
        fit.
      sources:
        - canair captures uds --json and decode --dump-bytes over all stored AAF 2180/2181 captures, 2026-11-01
      what_to_test:
        - Confirm the one-byte gap against a 2180/2181 payload with bix --annotate before declaring it
        - Teach the support-map declaration (and investigate --support-map) an offset between map and covered data, then declare both pages
    - type: verify
      target: 2181 AAF_2181_B27/AAF_2181_B15/AAF_COOLANT_TEMP_2
      status: captured
      priority: P2
      vehicle_states: [CHARGING, DRIVING]
      created: "2026-08-08"
      updated: "2026-11-07"
      notes: >-
        AAF_2181_B27 values 0, 5 and 6 were matched to A/C, PTC-only and idle on 2026-11-07 (see its
        note); 1 appeared in 8 heat-pump rows that day and is unexplained. Open: AAF_2181_B15 (flap
        position candidate) and AAF_COOLANT_TEMP_2 (B23-40, r=0.976 vs VCU_LDC_TEMP) sensor location
        relative to MOTOR_COOLANT_TEMP (B22).
      what_to_test:
        - "AAF_2181_B27: what raw 1 means (seen only with the heat pump running)"
        - "AAF_2181_B15: correlate against AAF_VEHICLE_SPEED_KMH and time parked"
        - "AAF_COOLANT_TEMP_2: sensor location relative to MOTOR_COOLANT_TEMP (B22)"
    - type: scan
      target: 23 ReadMemoryByAddress
      status: nrc
      priority: P3
      vehicle_states: [IG3]
      created: "2026-11-12"
      updated: "2026-11-12"
      date: "2026-11-12"
      result: No 23 read answered; the AAF stays silent
      notes: >-
        Sent to 0x7E6 in READY, 2026-11-12. These were all silent: 23 alone, 23 with a KWP2000
        address and 1-byte size at 0x000000, 0x004000, 0x800000 and 0xFF0000, scan memory
        000000-0FFFFF in 64 KiB steps, and 2324 with a 4-byte address. The AAF answers 1A, 21 and 10
        (NRC 0x12 for 21FF, NRC 0x22 for 1003, positive for 1081) but is silent on 22, 3E and 23, so
        silence there does not show whether 23 exists. Not tried: any other address.
    - type: decode
      target: 2181 B27 thermal-mode label, B14/B26 constants, B28/B29 self-mirror
      status: captured
      priority: P3
      vehicle_states: [CHARGING, READY, "OFF"]
      created: "2026-11-20"
      updated: "2026-11-25"
      result: >-
        Value 7 means IG3 on with the ignition off, charging or not: 3299 of 3405 CHARGING+OFF rows
        and 309 of 310 OFF+IG3 rows (2026-11-22 to 11-26), never in a READY, ON or DRIVING session.
        The enum labels it ignition_off. B28 = B29 is the 12 V supply (AAF_12V_SUPPLY, 2026-11-27),
        not a temperature.
      notes: >-
        Per-state to 2026-11-20: CHARGING,OFF,PARKED 983 rows all 7; PLUGGED,PARKED,IG3 57 all 7;
        CHARGING,PARKED 2371 of 2480 were 7; CHARGING,ON,PARKED 268 of 270 were 6;
        PLUGGED,ON,PARKED,IG3 22 all 6. The 2026-11-15 AC-charging session reads 7 throughout, and
        the 2026-11-20 and 2026-11-25 unplugged IG3-only captures also read 7. On 2026-11-22 at
        10:08:15.808 the AAF reported 7; IGPM reported IGN1 and IGN2 on at 10:08:17.895, 2.1 s
        later. Poll skew and a possible transition prevent a definitive claim about ignition state.
        Value 1, seen with the heat pump, has no enum entry. B14 and B26 were constant in the
        earlier corpus (0 and 19); B28 equalled B29 (110-155). Its rise with coolant temperature
        was the LDC raising the 12 V in READY.
      sources:
        - canair decode/correlate over the 2026-11-15 and 2026-11-20 captures, 2026-11-20
      what_to_test:
        - "B27: does 7 ever appear with the ignition ON? (suspected no)"
        - "B27 raw 1: what the heat-pump-only case means"
    - type: decode
      target: 2181 B21 temperature mirror candidate
      status: done
      priority: P3
      vehicle_states: [IG3]
      created: "2026-11-21"
      updated: "2026-11-26"
      result: >-
        B21-40 is the same byte as AAF:2180:AAF_MOTOR_TEMP, the drive-motor temperature (r=+0.999 vs
        MCU:2102:MCU_MOTOR_TEMP over 5519 rows).
      notes: >-
        Across 5,150 pairs joined within 5 s, 4,739 agree exactly with 2180 B21 and the other 411
        differ by 1 °C. Some historical keep:changes rows are forward-filled, so the pairs are not
        independent. The 2181 byte spans -3 to 66 °C across 7,133 captures.
      sources:
        - canair align and decode over the capture corpus, 2026-11-21
        - canair hunt AAF 2180 vs MCU:2102:MCU_MOTOR_TEMP, 2026-11-26
