# ─── CLU (Cluster / Instrument Panel) ─────────────────────────────────
CLU:
  tx_id: 0x7C6
  can_bus: [C-CAN, MM-CAN]
  identity:
    description: Cluster (instrument panel)
    part_number: "94003G7300"
    mfg_date: "2017-06-01"
    hw_version: "100"
    sw_version: "201"
    boot_sw: "625"
    id_protocol: UDS  # F1xx
    notes: >
      Odometer is 22B002 [B12:B14]. The imperial odometer, range and cruise fields the e-Niro
      exposes are absent here (22B002 is a 15-byte response).
  vehicle_states: [ACC, "ON", READY]
  pids:
    22B002:
      response_frames: 3
      status: active
      period: 60000
      vehicle_states: [ACC, "ON", READY]
      parameters:
        ODOMETER:
          expression: "[B12:B14]"
          unit: km
          ha_class: distance
          min: "0"
          source: "Original WiCAN config"
          verified: true
          notes: 3-byte odometer in km.
        CLU_B11_TEMP:
          expression: B11/2-40
          unit: degC
          source: 2026-08-08 whole-day byte scan
          verified: false
          notes: >-
            31-47 °C; rose slowly across the 2026-08-08 whole-day scan and runs warmer than ambient.
            Which sensor is unknown.
          enabled: true
    22B001:
      response_frames: 2
      status: draft
      period: 10000
      vehicle_states: []
      notes: "8 bytes, all 0 in all 57 captures: 62B0010000000000."
    22B003:
      response_frames: 2
      status: draft
      period: 10000
      vehicle_states: []
      notes: "8 bytes: 62B0038800000001."
  research:
    - type: scan
      target: "22 B001-B010"
      status: done
      priority: P2
      vehicle_states: [ACC]
      notes: >-
        Only B001 (8 bytes, zeros), B002 (odometer) and B003 (8 bytes) respond; B004-B010 do not
        (2026-07-22, READY).
    - type: scan
      target: "0x7C0/0x7C1 probes"
      status: nrc
      priority: P2
      vehicle_states: [ACC]
      notes: >-
        Head unit: no data in deep sleep (2026-04-16); at READY 0x7C0 also returns NO DATA to 22
        B001-B005 and 0100-010F (see Unknown-7C0).
      sources:
        - "Hyundai/Kia convention: 0x7C0 = AVN"
    - type: iocontrol_scan
      target: 2F B001 cluster indicators
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-27"
      updated: "2026-07-27"
      notes: >-
        On the e-Niro cluster, 2F B0 01 03 in a 10 03 session lights every indicator lamp and 2F B0
        01 00 restores normal. This car's GDS Actuation Test for the cluster offers exactly
        Indicator ALL ON and Indicator ALL OFF, ignition on, until Stop (shop manual page 0462), so
        the same test exists here. Open: send returnControlToECU (2F B001 00, non-actuating) on CLU
        0x7C6 to see whether the DID exists.
      sources:
        - kia-e-niro-can-messages.xlsx (CM Commands sheet)
    - type: verify
      target: 22B002 CLU_B11_TEMP
      status: captured
      priority: P3
      vehicle_states: [ALL]
      created: "2026-08-08"
      updated: "2026-08-08"
      notes: >-
        B11 reads 31-47 °C on raw/2-40. Not yet correlated against ambient or cabin temperature.
      what_to_test:
        - >-
          Correlate against AAF:2181:AMBIENT_TEMP and HVAC_INTERIOR_TEMP; an internal temperature
          would match neither
    - type: decode
      target: 22B003 GDS Current Data names
      status: pending
      priority: P3
      vehicle_states: ["ON"]
      created: "2026-11-01"
      updated: "2026-11-01"
      notes: >-
        The GDS cluster list (shop manual page 0462) is FUEL INPUT, Battery Voltage on CLU, IGN1,
        Battery Charge Status, Washer Low. 22B003 (62B0038800000001) marks two bits, B10:0 and
        B10:4; B10:0 is 1 in every capture (the cluster only answers with the ignition on), which
        fits IGN1. Which of Battery Charge Status and Washer Low is B10:4 is open.
      what_to_test:
        - Read CLU:22B003 with the washer reservoir low, and with the 12 V charge warning lit
