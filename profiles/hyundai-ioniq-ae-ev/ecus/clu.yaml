# yaml-language-server: $schema=https://philipkocanda.github.io/canair/schema/ecus.json
# ─── CLU (Cluster / Instrument Panel) ─────────────────────────────────
CLU:
  tx_id: 0x7C6
  can_bus: [C-CAN, MM-CAN]
  identity:
    description: Cluster (instrument panel)
    part_number: "94003G7300"
    mfg_date: "2017-06-01"
    hw_version: "100"
    sw_version: "201"
    boot_sw: "625"
    id_protocol: UDS  # F1xx
    notes: >-
      Odometer is 22B002 [B12:B14]. The imperial odometer, range and cruise fields the e-Niro
      exposes are absent here (22B002 is a 15-byte response). Ignores the functional (0x7DF)
      TesterPresent but answers a physical 3E00 at once, so `discover --functional` lists it as
      silent (READY, 2026-11-03, three rounds, 1 s window). Never sends a negative response: a
      request it does not support gets silence, not NRC 0x11, 0x12 or 0x31 (22B004, 22F190, 22FFFF,
      1902FF, 1A87, A0 and every 23 read; READY, 2026-11-12). Silence therefore does not tell an
      unsupported service from a wrong address or format, which makes enumeration blind. Not an
      ISO-TP flow-control quirk like the EWP: the 15-byte 22B002 reply arrives with the default
      BlockSize 0, and 23 reads whose request fits one frame (formats 14 and 13, kwp) are silent
      too.
  vehicle_states: [ACC, "ON", READY]
  pids:
    22B002:
      response_frames: 3
      status: active
      period: 60000
      vehicle_states: [ACC, "ON", READY]
      parameters:
        ODOMETER:
          expression: "[B12:B14]"
          unit: km
          min: "0"
          source: "Original WiCAN config"
          verified: true
          notes: 3-byte odometer in km.
        CLU_SUPPLY_VOLTAGE:
          expression: B11*0.08
          unit: V
          source: canair hunt vs ESC, VCU and BMS 12 V signals, 2026-11-02
          verified: false
          notes: >-
            12 V supply as the cluster measures it: r=+0.994 vs ESC_SUPPLY_VOLTAGE (n=1069, all
            dates), +0.996 vs VCU_AUX_BATTERY_VOLTAGE_FINE and +0.997 vs BMS AUX_BATTERY_VOLTAGE on
            2026-11-02, where it tracked the 12 V sag from 14.6 to 10.7 V in ON. Raw 125-174. At
            0.08 V/count it reads 0.92 V below ESC_SUPPLY_VOLTAGE (sd 0.06 V); the least-squares fit
            is 0.081 V/count + 0.76 V. Scale unconfirmed. GDS lists Battery Voltage on CLU in the
            cluster's Current Data.
          min: "0"
          max: "20"
    22B001:
      response_frames: 2
      status: draft
      period: 10000
      vehicle_states: []
      notes: "8 bytes, all 0 in all 57 captures: 62B0010000000000."
    22B003:
      response_frames: 2
      status: draft
      period: 10000
      vehicle_states: []
      notes: "8 bytes: 62B0038800000001."
  research:
    - type: scan
      target: "22 B001-B010"
      status: done
      priority: P2
      vehicle_states: [ACC]
      notes: >-
        Only B001 (8 bytes, zeros), B002 (odometer) and B003 (8 bytes) respond; B004-B010 do not
        (2026-07-22, READY).
    - type: scan
      target: "0x7C0/0x7C1 probes"
      status: nrc
      priority: P2
      vehicle_states: [ACC]
      notes: >-
        Head unit: no data in deep sleep (2026-04-16); at READY 0x7C0 also returns NO DATA to 22
        B001-B005 and 0100-010F. 0x7C0 stays silent on every CAN id in READY (2026-11-12); the April
        sweep hit was a false positive. The head unit is AVN at 0x780.
      sources:
        - "Hyundai/Kia convention: 0x7C0 = AVN"
    - type: iocontrol_scan
      target: 2F B001 cluster indicators
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-27"
      updated: "2026-07-27"
      notes: >-
        On the e-Niro cluster, 2F B0 01 03 in a 10 03 session lights every indicator lamp and 2F B0
        01 00 restores normal. This car's GDS Actuation Test for the cluster offers exactly
        Indicator ALL ON and Indicator ALL OFF, ignition on, until Stop (shop manual page 0462), so
        the same test exists here. Open: send returnControlToECU (2F B001 00, non-actuating) on CLU
        0x7C6 to see whether the DID exists.
      sources:
        - kia-e-niro-can-messages.xlsx (CM Commands sheet)
    - type: verify
      target: 22B002 CLU_B11_TEMP
      status: done
      priority: P3
      vehicle_states: [ALL]
      created: "2026-08-08"
      updated: "2026-11-02"
      result: >-
        Not a temperature: B11 is the cluster's 12 V supply voltage, now CLU_SUPPLY_VOLTAGE
        (B11*0.08, scale unconfirmed). r=+0.994 vs ESC_SUPPLY_VOLTAGE over every co-polled date
        (n=1069); it tracked the 2026-11-02 sag from 14.6 to 10.7 V in ON and stayed at 46-47 on the
        old raw/2-40 reading while ambient was 9 °C and the cabin warmed 15 to 19 °C.
      notes: >-
        Superseded by CLU_SUPPLY_VOLTAGE. Open, as a new question if wanted: the scale (0.08 V/count
        reads 0.9 V below the other ECUs); compare with the GDS Battery Voltage on CLU reading.
      what_to_test:
        - >-
          Correlate against AAF:2181:AMBIENT_TEMP and HVAC_INTERIOR_TEMP; an internal temperature
          would match neither
    - type: decode
      target: 22B003 GDS Current Data names
      status: pending
      priority: P3
      vehicle_states: ["ON"]
      created: "2026-11-01"
      updated: "2026-11-02"
      notes: >-
        The GDS cluster list (shop manual page 0462) is FUEL INPUT, Battery Voltage on CLU, IGN1,
        Battery Charge Status, Washer Low. Battery Voltage on CLU is 22B002 B11
        (CLU_SUPPLY_VOLTAGE). 22B003 (62B0038800000001) marks two bits, B10:0 and B10:4; B10:0 is 1
        in every capture (the cluster only answers with the ignition on), which fits IGN1. Which of
        Battery Charge Status and Washer Low is B10:4 is open.
      what_to_test:
        - Read CLU:22B003 with the washer reservoir low, and with the 12 V charge warning lit
    - type: scan
      target: 23 ReadMemoryByAddress
      status: nrc
      priority: P3
      vehicle_states: [READY]
      created: "2026-11-12"
      updated: "2026-11-12"
      date: "2026-11-12"
      result: No 23 read answered; the CLU stays silent
      notes: >-
        Sent to 0x7C6 in READY, 2026-11-12, with and without 10 03. 2324 with no address, scan
        memory at 0x0 in formats 44, 24, 14, 13, 23, 22, 12 and kwp, and 1-byte reads in formats 24
        and 14 at 20 addresses (0x0 to 0xFFFF8000, including 0x40000000 and 0xFEDE0000) were all
        silent. The CLU answers no unsupported request with a negative response, so the silence does
        not show whether the service exists. Not tried: a security-access unlock (canair never
        unlocks) and any address not in the list.
      what_to_test:
        - Find the cluster microcontroller from part number 94003G7300 and read its memory map before sweeping more addresses
    - type: scan
      target: 22 B000, B011-B0FF
      status: done
      priority: P3
      vehicle_states: [READY]
      created: "2026-11-12"
      updated: "2026-11-12"
      date: "2026-11-12"
      result: No DID answers in B000 or B011-B0FF
      notes: >-
        240 DIDs, 0.4 s timeout, READY, 2026-11-12. All silent. With B001-B010 (B001-B003 answer),
        the B0xx family holds three readable DIDs. The CLU answered 22B002 straight after the sweep.
