# ─── MFC (Multi-Function Camera / ADAS) ───────────────────────────────
MFC:
  tx_id: 0x7C4
  can_bus: [C-CAN]
  identity:
    description: Multi-Function Camera (ADAS)
    part_number: "95740-G2200"
    boot_sw: "AEE MFC AT EUR LHD 1.00 1.00 95740-G2200 161014"
    id_protocol: UDS  # F1xx (only 1 DID: F100)
    notes: >
      Multi-Function Camera (ADAS / LKAS — lane detection, speed-sign
      recognition). Pure UDS ECU (no service 21); live data via 220100/0101/0102.
  vehicle_states: [ACC, "ON", READY]
  # UDS service-22 multi-DID batching: verified on-device 2026-07-29 (READY) —
  # MFC answers `22 0100 0101` with `620100 <data> 0101 <data>` and the response
  # splits cleanly. Batching cuts poll commands for its consecutive 22-DIDs.
  multi_did: true
  scan_log: # MFC (ADAS camera)
    - service: 0x22
      range: "0101-010F,0103-0120,B001-B010"
      date: 2026-07-22
      hits: "0101,0102"
      vehicle_states: [READY]
      notes: "Re-confirmed 0100/0101/0102 (already registered). Higher 01xx and B0xx all NRC."
  pids:
    220100:
      response_frames: 2
      status: draft
      period: 2500
      vehicle_states: [READY]
      notes: "13 bytes: 620100000102FB010008AAAAAA."
    220101:
      status: draft
      period: 2500
      vehicle_states: [READY]
      notes: "4 bytes: 620101FE."
    220102:
      status: draft
      period: 2500
      vehicle_states: [READY]
      notes: "7 bytes: 620102FB010008, the same as bytes 6-12 of 220100."
  research:
    - type: scan
      target: 21 00-20
      status: done
      priority: P3
      vehicle_states: [READY]
      date: "2026-07-22"
      result: "Service-21 (KWP-style) probe 00-20: all NRC. MFC is a pure UDS ECU and does not implement service 21. Any LKAS/camera data is via service 22 (0100/0101/0102 already registered; higher 01xx + B0xx already NRC per ecus.yaml scan_log)."
      notes: Hidden-page hunt 2026-07-22. Rules out a KWP live-data path on the ADAS camera.
      updated: "2026-07-23"
