# yaml-language-server: $schema=https://philipkocanda.github.io/canair/schema/ecus.json
# ─── MCU (Motor Control Unit) ─────────────────────────────────────────
#
# Power electronics and control for the traction motor: inverter switching (DC → 3-phase AC),
# torque/current control loops, rotor position, and motor/inverter thermal protection. Shares
# the EPCU (Electronic Powertrain Control Unit) housing with the VCU (Vehicle Control Unit).
#
# Only KWP2000 session 0x81 is accepted; the 21xx pages also read in the default session.
MCU:
  tx_id: 0x7E3
  can_bus: [P-CAN]
  identity:
    alias: VMCU # also known as HPCU (Hybrid Power Control Unit)
    description: Motor Control Unit (inverter)
    part_number: "36600-0E250"
    ecu_id: AEEMCU83  # KWP2000 1A8C
    sw_id: "EAEEHEL-MS2-D000"
    calibration: "00000001"
    id_protocol: KWP2000  # 1Axx
    notes: >
      Motor Control Unit — inverter / power electronics and control loops for
      the traction motor. Shares the EPCU (Electronic Powertrain Control Unit)
      physical housing with the VCU.
  vehicle_states: [IG3]
  pids:
    2101:
      status: active
      response_frames: 5
      period: 10000
      vehicle_states: [IG3]
      notes: >-
        30 bytes. Words are little-endian, unlike BMS 2101. B23 and B26 are constant 0x02 and 0x04.
        B9/B10/B11 read 8/56/1 in 5121 of 5776 CHARGING captures and in all 301 captures of the
        three recorded 12 V top-ups; in READY B11 is 0 in all 2369 captures and B9 is 140 or 12.
        Firmware (MCU_FIRMWARE_FINDINGS.md section 5): B09, B10 and B11 are also bytes 0, 1 and 7 of
        the 0x523 frame. B12:B13, B22:B23 and B25:B26 are 16-bit. The record is refreshed every 100
        ms.
      source: canair analysis 2026-08-08 long drive + DCFC
      verified: false
      parameters:
        MCU_2101_ADC_1_MV:
          expression: (B23<<8)|B22
          min: "0"
          max: "5000"
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          notes: >-
            16-bit little-endian millivolts: an ADC channel voltage (raw 0x40015318 x 0.001221 V,
            float x 1000 into a u16). B22 alone is its low byte. Observed 518-681 mV. Which sensor
            it is is not known. Earlier note: on 2026-08-08 the low byte fell 37 in 22 s and read
            22-31 during a DC charge.
          ship: false
          unit: mV
          verified: false
        MCU_HV_VOLTAGE:
          expression: B13*2.56
          unit: V
          min: "0"
          max: "500"
          source: canair investigate/hunt 2026-07-22 drive; VERIFIED vs BMS pack voltage over 3h charge 2026-08-05
          verified: true
          notes: >-
            Coarse HV DC-link voltage, about 2.56 V per LSB. Slope 0.991, r=0.981 vs BMS
            BATTERY_VOLTAGE over 2016 samples of a 3 h AC charge (360-399 V).
        MCU_2101_ADC_2_MV:
          expression: (B26<<8)|B25
          min: "0"
          max: "5000"
          notes: >-
            16-bit little-endian millivolts: an ADC channel voltage (raw 0x4001531C x 0.001221 V).
            B25 alone is its low byte. Observed 1062-1145 mV, slow, falling as the coolant warms
            (r=-0.72 on the low byte vs AAF MOTOR_COOLANT_TEMP and HEATSINK_TEMP): probably a
            temperature-sensor divider.
          ship: false
          unit: mV
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
        MCU_PHASE_CURRENT_1:
          expression: (S30 << 8) | B29
          notes: >-
            Signed 16-bit little-endian, low byte B29, high byte B30; raw counts, scale unknown. The
            three MCU_PHASE_CURRENT signals sum to within ±1 count in 8564 of 8629 captures, driving
            included, so one is computed from the other two. With the motor stopped the readings are
            multiples of about 24.4 counts (sd 58, 55 and 106 for _1, _2 and _3). Firmware: the
            converter stores float x 50 as a signed 16-bit value, so the scale is 1/50 per count
            (0.02 A if the source unit is amperes, probable; one ADC step of 24.4 counts is then
            0.488 A). MCU_FIRMWARE_FINDINGS.md section 5.2.
          verified: false
        MCU_PHASE_CURRENT_2:
          expression: (S33 << 8) | B31
          notes: >-
            Signed 16-bit little-endian, low byte B31, high byte B33 (B32 is a PCI byte). See
            MCU_PHASE_CURRENT_1. Firmware: the converter stores float x 50 as a signed 16-bit value,
            so the scale is 1/50 per count (0.02 A if the source unit is amperes, probable; one ADC
            step of 24.4 counts is then 0.488 A). MCU_FIRMWARE_FINDINGS.md section 5.2.
          verified: false
        MCU_PHASE_CURRENT_3:
          expression: (S35 << 8) | B34
          notes: >-
            Signed 16-bit little-endian, low byte B34, high byte B35. About twice the standstill
            spread of _1 and _2. See MCU_PHASE_CURRENT_1. Firmware: the converter stores float x 50
            as a signed 16-bit value, so the scale is 1/50 per count (0.02 A if the source unit is
            amperes, probable; one ADC step of 24.4 counts is then 0.488 A).
            MCU_FIRMWARE_FINDINGS.md section 5.2.
          verified: false
        MCU_SUPPLY_VOLTAGE_1:
          expression: ((B15<<8)|B14)/1000
          unit: V
          min: "0"
          max: "16"
          source: canair decode --corr / hunt 2026-10-21
          notes: >-
            12 V supply voltage at the MCU, 1 mV/bit, 16-bit little-endian. r=+0.998 vs
            VCU:2102:VCU_AUX_BATTERY_VOLTAGE_FINE (n=8469, slope 0.996). Reads 14.73-14.83 V while
            the VCU battery and LDC readings are 14.75 and 14.89 V.
        MCU_SUPPLY_VOLTAGE_2:
          expression: ((B28<<8)|B27)/1000
          unit: V
          min: "0"
          max: "16"
          source: canair decode --corr / hunt 2026-10-21
          notes: >-
            Second 12 V supply reading at the MCU, 1 mV/bit, 16-bit little-endian. r=+0.998 vs
            VCU:2102:VCU_LDC_OUTPUT_VOLTAGE (n=8469); tracks MCU_SUPPLY_VOLTAGE_1 within a few tens
            of mV.
        MCU_DC_LINK_VOLTAGE:
          expression: ((B13<<8)|B12)/100
          unit: V
          min: "0"
          max: "655.35"
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
          notes: >-
            DC-link voltage, 16-bit little-endian, 0.01 V/bit (the float in 0x40011D00 x 100). 65535
            = sensor flagged faulty. MCU_HV_VOLTAGE (B13*2.56) is its high byte. The integer-volt
            copy is 0x524 bytes 0-1. Replayed on 10811 captures: mean 359.4 V, max 399.80 V, within
            1.2 V of MCU_HV_VOLTAGE.
        MCU_2101_W20:
          expression: (B21<<8)|B20
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
          notes: >-
            Output of a nine-point curve (10 to 90) driven by an unnamed float (FUN_0012E26C, RAM
            0x400117E2). Probably a coolant-pump duty request in percent (inferred). Observed 10,
            45, 59, 75.
        MCU_POSITION_NOT_LEARNED:
          expression: B10:7
          type: enum
          values:
            0: learned
            1: not_learned
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
          notes: >-
            Bit 7 of status byte 0x400166B6 (also 0x523 byte 1). Set when the learned-data marker
            (2102 B29:B30) is not 0xABCD, together with DTC P0C17. Always 0 in the captures (B10 =
            56).
        MCU_2101_B09_BIT4:
          expression: B09:4
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
          notes: >-
            Bit 4 of status byte 0x400166B4 (also 0x523 byte 0): set when any of three sensor checks
            (0x40016260, 0x40016261, 0x40016263) is non-zero. B09 reads 8, 12 or 140, so it is
            always 0 here.
    2102:
      response_frames: 9
      status: active
      period: 10000
      vehicle_states: [CHARGING]
      notes: >-
        56 bytes, refreshed every 100 ms. B27-B49 are learned and calibration values held in standby
        RAM (the angle B27:B28, the markers 0xABCD B29:B30, 0xCDC2 B31:B33 and 0xCDC1 B47:B49, and
        six small values at B34-B46); all constant in the captures, and copied to 21F2. B50:B51 is a
        counter (9). B52:B53 is a 16-bit sensor voltage. B54-B65 are event counters and an unused
        slot, 0 in all 7757 captures. The four temperatures B18-B21 are signed. See
        MCU_FIRMWARE_FINDINGS.md section 5.3.
      source: canair align/hunt vs AAF 2181 and VCU 2102 temperatures 2026-10-22
      verified: false
      parameters:
        MCU_MOTOR_RPM:
          expression: (S10<<8)|B09
          unit: RPM
          min: "-10500"
          max: "10500"
          source: Kia Soul EV VMCU CSV (Motor Actual Speed RPM) + physical validation; low byte corrected 2026-10-21
          verified: true
          notes: >-
            Signed 16-bit little-endian, low byte B09 (0 at standstill). r=0.999 vs
            EPS_VEHICLE_SPEED. Median 62.8 RPM per km/h vs VCU speed, against 61.8 expected from the
            7.412 reduction and 205/55R16 tyres.

        MCU_MOTOR_TORQUE:
          expression: ((S12<<8)|B11)/10
          unit: Nm
          min: "-300"
          max: "300"
          source: energy balance vs BMS:2101 BATTERY_POWER and the cumulative energy counters, 2026-10-21
          notes: >-
            Signed 16-bit little-endian, 0.1 Nm/bit; negative in regen. Range -156 to +181 Nm while
            driving. Torque x MCU_MOTOR_RPM integrated over the sustained 2026-08-08 drives is 79-90
            % of the BMS pack energy (drivetrain efficiency plus 12 V and climate loads); low-speed
            segments fall to 21-63 % as those loads dominate.
        MCU_MOTOR_TORQUE_2:
          expression: ((S14<<8)|B13)/10
          unit: Nm
          min: "-300"
          max: "300"
          ship: false
          source: canair decode --find-mirrors 2026-10-21
          notes: B13:B14 equals B11:B12 (MCU_MOTOR_TORQUE) byte-for-byte in all 8231 captures.
        MCU_MOTOR_CURRENT:
          expression: ((B17<<8)|B15)/10
          unit: A
          min: "0"
          max: "600"
          source: canair align + within-PID fit 2026-10-21
          notes: >-
            Motor phase-current magnitude, 16-bit little-endian split across the PCI byte B16; never
            negative. Scale unproven. With the motor stopped it reads 2.7-6.0 (median 3.0) in
            CHARGING, READY and TOPUP alike, so about 3.0 is its zero; up to 214 while driving.
            Tracks |MCU_MOTOR_TORQUE| at about 1.2 counts per 0.1 Nm below 5000 RPM, rising to 1.6
            above 6500 RPM.
        MCU_COOLANT_TEMP:
          expression: S20*2
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Powertrain coolant temperature, 2 °C per count. Mirrors VCU:2102:VCU_LDC_TEMP: r=+0.991
            over 8332 rows, 1 °C below it (median). Slow: 36 to 42 °C over the 2026-08-08
            15:33-16:31 drive. Firmware: a signed 8-bit value (float x 0.5), so read it with S, not
            B; the unsigned read is wrong below 0 C.
          verified: false

        MCU_HEATSINK_TEMP:
          expression: S19*2
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Inverter heatsink temperature, 2 °C per count. Mirrors AAF:2181:HEATSINK_TEMP: r=+0.990
            over 1973 co-polled rows, reading 1 °C below it (median). Firmware: a signed 8-bit value
            (float x 0.5), so read it with S, not B; the unsigned read is wrong below 0 C.
          verified: false
        MCU_TEMP_B18:
          expression: S18*2
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            A fourth temperature, 2 °C per count; which component is unknown. Heats most under load:
            16 to 54 °C over the 2026-08-08 10:02-11:41 drive (cycle mean 43 °C, against 36 °C for
            MCU_HEATSINK_TEMP), and cools while parked or DC charging. Firmware: a signed 8-bit
            value (float x 0.5), so read it with S, not B; the unsigned read is wrong below 0 C.
          verified: false
        MCU_MOTOR_COOLANT_TEMP:
          expression: S21*2
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            2 °C per count. Mirrors AAF:2181:MOTOR_COOLANT_TEMP: r=+0.991 over 1973 rows, 1 °C below
            it (median). Rises faster under load than MCU_COOLANT_TEMP: 36 to 58 °C over the
            2026-08-08 15:33-16:31 drive. Firmware: a signed 8-bit value (float x 0.5), so read it
            with S, not B; the unsigned read is wrong below 0 C.
          verified: false
        MCU_MOTOR_POWER:
          expression: ((S12<<8)|B11)/10*((S10<<8)|B09)*0.00010472
          unit: kW
          min: "-100"
          max: "100"
          source: derived from MCU_MOTOR_TORQUE x MCU_MOTOR_RPM, 2026-10-21
          notes: >-
            Mechanical shaft power, torque x 2*pi*RPM/60/1000; negative in regen. Integrated, it is
            79-90 % of the BMS pack energy over sustained 2026-08-08 driving.
        MCU_CURRENT_SENSOR_OFFSET_1:
          expression: (S23<<8)|B22
          min: "-100"
          max: "100"
          source: canair 21F2 cross-check 2026-10-22
          notes: >-
            Small signed word, -11 to -7. Changes only with the motor stopped (73 of 76 changes at 0
            RPM). The Kia Soul VMCU sheet lists U and V phase current sensor offsets. Copied live
            into MCU:21F2.
        MCU_CURRENT_SENSOR_OFFSET_2:
          expression: (S26<<8)|B25
          min: "-100"
          max: "100"
          source: canair 21F2 cross-check 2026-10-22
          notes: >-
            Small signed word, -13 to -7; see MCU_CURRENT_SENSOR_OFFSET_1. Copied live into
            MCU:21F2.
        MCU_2102_SENSOR_V:
          expression: ((B53<<8)|B52)/10000
          unit: V
          min: "0"
          max: "6.5535"
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
          notes: >-
            An analog sensor voltage (float 0x40011C18 x 10000 as u16); B52 alone is its low byte.
            Observed 1.10-1.45 V (mean 1.28 V, 8871 captures); it rises after driving, so it is
            probably the motor temperature sensor (inferred). Also 0x540 bytes 0-1 and the source of
            the 21F2 max/min/average voltage.
        MCU_2102_LEARNED_ANGLE:
          expression: ((B28<<8)|B27)/10000
          unit: rad
          min: "0"
          max: "6.5535"
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
          notes: >-
            Constant 5.4909 in all 8871 captures (RAM 0x40001E14, standby RAM). Probably the learned
            position-sensor (resolver) offset angle: FUN_00132630 loads the default 5.49 and raises
            DTC P0C17 when the marker MCU_2102_LEARN_MARKER is not 0xABCD (probable).
        MCU_2102_LEARN_MARKER:
          expression: (B30<<8)|B29
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
          notes: >-
            0xABCD (43981) = learned data valid, in all 8871 captures. Any other value: DTC P0C17
            and bit 7 of 2101 B10.
        MCU_2102_OFFSET_CAL_MARKER:
          expression: (B49<<8)|B47
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
          notes: >-
            0xCDC1 (52673) = the current-sensor offset calibration has completed (FUN_001363CC
            writes it), in all 8871 captures.

    2103:
      response_frames: 4
      status: draft
      vehicle_states: [CHARGING]
      notes: 27 bytes, all zeros in all 697 captures across charging, READY, parked and driving.
      parameters: {}

    21F2:
      status: slow
      period: 300000
      response_frames: 10
      vehicle_states: [CHARGING]
      notes: >-
        67 data bytes. A summary of the previous drive or charge cycle, like BMS 21F2: average and
        peak of three temperatures (heatsink, MCU_TEMP_B18, coolant), the min, max and average 12 V
        supply, and two unexplained words (B27:B28, B31:B33). Also carries live copies of the two
        current-sensor offsets and of the latched MCU 2102 bytes B34-B42 (at B38-B46), and the ASCII
        tag 'EHEL-MS2' at B69-B77. The cycle values were checked against the five fully logged
        2026-08-08 cycles (preconditioning, three drives, a DC charge).
      source: canair 21F2 vs live MCU/VCU/AAF data over the five 2026-08-08 cycles, 2026-10-22
      verified: false
      parameters:
        MCU_21F2_TAG:
          expression: "[B69:B77]"
          type: ascii
          source: canair search 2026-10-21
          notes: >-
            Constant ASCII 'EHEL-MS2', the middle of the 1A8D software ID EAEEHEL-MS2-D000. The byte
            before it varies, so it is not part of the string.
          ship: false
        MCU_21F2_HEATSINK_TEMP_AVG:
          expression: (S49<<8)|B47
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Average inverter heatsink temperature over the previous cycle; within 1 °C of the
            time-weighted MCU_HEATSINK_TEMP mean on the five 2026-08-08 cycles. Firmware: signed
            16-bit, degrees C; the statistics are kept while the model state is 1.
          verified: false
        MCU_21F2_HEATSINK_TEMP_MAX:
          expression: (S51<<8)|B50
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Peak inverter heatsink temperature of the previous cycle; 21-67 °C on the five
            2026-08-08 cycles, never below the sampled peak of AAF:2181:HEATSINK_TEMP. Firmware:
            signed 16-bit, degrees C; the statistics are kept while the model state is 1.
          verified: false
        MCU_21F2_TEMP_B18_AVG:
          expression: (S58<<8)|B57
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Average over the previous cycle of the sensor behind MCU:2102 MCU_TEMP_B18; within 1 °C
            of its time-weighted mean on the five 2026-08-08 cycles. Firmware: signed 16-bit,
            degrees C; the statistics are kept while the model state is 1.
          verified: false
        MCU_21F2_TEMP_B18_MAX:
          expression: (S60<<8)|B59
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Peak over the previous cycle of the sensor behind MCU:2102 MCU_TEMP_B18; within 2 °C of
            its sampled peak on the five 2026-08-08 cycles. Firmware: signed 16-bit, degrees C; the
            statistics are kept while the model state is 1.
          verified: false
        MCU_21F2_COOLANT_TEMP_AVG:
          expression: S67
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Average coolant temperature over the previous cycle; within 1 °C of the time-weighted
            VCU:2102 VCU_LDC_TEMP mean on the five 2026-08-08 cycles. Firmware: signed 8-bit; the
            statistics are kept while the model state is 1.
          verified: false
        MCU_21F2_COOLANT_TEMP_MAX:
          expression: S68
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Peak coolant temperature of the previous cycle; within 1 °C of the sampled VCU_LDC_TEMP
            peak on the five 2026-08-08 cycles. Firmware: signed 8-bit; the statistics are kept
            while the model state is 1.
          verified: false
        MCU_21F2_SUPPLY_VOLTAGE_AVG:
          expression: B66/10
          unit: V
          min: "0"
          max: "16"
          notes: >-
            Average 12 V supply over the previous cycle, 0.1 V per count; within 0.1 V of the
            MCU_SUPPLY_VOLTAGE_1 mean on the five 2026-08-08 cycles.
        MCU_21F2_SUPPLY_VOLTAGE_MAX:
          expression: B63/10
          unit: V
          min: "0"
          max: "16"
          notes: >-
            Peak 12 V supply of the previous cycle, 0.1 V per count; 0.1 V below to 0.4 V above the
            sampled peak on the five 2026-08-08 cycles. Short cycles with every temperature pair
            equal read 12.1-12.3 V.
        MCU_21F2_SUPPLY_VOLTAGE_MIN:
          expression: B65/10
          unit: V
          min: "0"
          max: "16"
          notes: >-
            Lowest 12 V supply of the previous cycle, 0.1 V per count; 11.4-12.4 V. The DC-charge
            cycle reads 12.3 V, the sampled minimum before the LDC started. Drive cycles read
            11.4-11.9 V, below anything polled.
        MCU_21F2_SENSOR_V_MAX_MV:
          expression: (B28<<8)|B27
          min: "0"
          max: "65535"
          notes: >-
            Maximum over the last cycle of the sensor voltage in 2102 B52:B53, in mV (RAM
            0x40002472). 1275-1469 on 200 captures, higher after drives.
          unit: mV
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
        MCU_21F2_SENSOR_V_AVG_MV:
          expression: (B33<<8)|B31
          min: "0"
          max: "65535"
          notes: >-
            Average over the last cycle of the sensor voltage in 2102 B52:B53, in mV (RAM
            0x40002476). 1258-1297 on 200 captures.
          unit: mV
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
        MCU_21F2_CURRENT_SENSOR_OFFSET_1:
          expression: (S10<<8)|B9
          min: "-100"
          max: "100"
          notes: >-
            Live copy of MCU:2102 MCU_CURRENT_SENSOR_OFFSET_1: matched the latest MCU 2102 value at
            every change checked (30-32 changes).
          ship: false
        MCU_21F2_CURRENT_SENSOR_OFFSET_2:
          expression: (S12<<8)|B11
          min: "-100"
          max: "100"
          notes: >-
            Live copy of MCU:2102 MCU_CURRENT_SENSOR_OFFSET_2: matched the latest MCU 2102 value at
            every change checked (30-32 changes).
          ship: false
        MCU_21F2_SENSOR_V_MIN_MV:
          expression: (B30<<8)|B29
          unit: mV
          source: MCU firmware EAEEHEL-MS2-D000, static analysis 2026-11-12 (research/MCU_FIRMWARE_FINDINGS.md)
          verified: false
          notes: >-
            The firmware keeps a minimum that starts at 0 and is only lowered, so it reads 0 in all
            200 captures (RAM 0x40002474).
  # Meanings, causes, thresholds and fail-safes are from the Ioniq Electric 2017 service manual,
  # EV Motor Control System chapter. Unless an entry says "Enabled when", the manual checks the
  # code only with the ignition on and the auxiliary battery at 9-16 V. "Also needs" adds to that.
  # An entry with a bench source also appeared in a KWP2000 18 00 FF 00 read of an EPCU running
  # alone on a bench (uhi22 CAN/EPCU_torquePro_reading_error_memory_18DTCs_found.csv), status 0xE0
  # except P0CF1 (0x20). OBD-II service 0A also lists P0A8B, P0AEF, P0C17 and U019B as permanent.
  # The bench had no motor, resolver, HV supply or BMS connected.
  dtcs:
    source: Ioniq Electric 2017 service manual, EV Motor Control System diagnosis (EV)
    source_links:
      - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Hybrid%2FElectric%20Powertrain/Testing%20and%20Diagnosis/EV%20Motor%20Control%20System%20Diagnosis%20%28EV%29/
      - https://lemon-manuals.org.ua/Hyundai/2017/Ioniq%20Electric/Repair%20and%20Diagnosis/Quick%20Lookups/DTC%20Index/DTC%20Index%20%28EV%29/EV%20Motor%20Control%20System%20DTCS/
    verified: false
    P0A0D:
      description: High voltage system interlock circuit high
      causes: >-
        MCU high voltage input power cable connector poor connection, MCU high voltage input power
        cable open/poor connection, EPCU side cover disconnecting, faulty EPCU's internal high
        voltage input interlock circuit
      source: >-
        Ioniq Electric 2017 service manual, EV Motor Control System diagnosis (EV); uhi22 EPCU bench
        DTC read
      notes: >-
        Threshold: EPCU interlock output voltage is above 4.75 V; MCU high voltage input power cable
        interlock output voltage is above 4.75 V. Detection time: 100 ms. Service lamp on.
    P0A1B:
      description: Drive motor 'A' control module
      causes: faulty MCU (EPCU)
      notes: >-
        Threshold: communication failure between main-CPU and sub-CPU has been detected. Detection
        time: 15 times. Service lamp on.
    P0A2C:
      description: Drive motor 'A' temperature sensor circuit low
      causes: >-
        drive motor temperature sensor circuit short-to-ground, faulty MCU (EPCU) internal sensing
        circuit
      notes: >-
        Threshold: temperature sensor signal voltage is below 400 mV. Detection time: 10 sec. Also
        needs: no DTC P0A2D. Service lamp on.
    P0A2D:
      description: Drive motor 'A' temperature sensor circuit high
      causes: >-
        drive motor temperature sensor signal circuit open, drive motor temperature sensor signal
        circuit short-to-battery, faulty drive motor temperature sensor, faulty MCU (EPCU) internal
        sensing circuit
      source: >-
        Ioniq Electric 2017 service manual, EV Motor Control System diagnosis (EV); uhi22 EPCU bench
        DTC read
      notes: >-
        Threshold: drive motor temperature sensor signal voltage is above 4.93 V. Detection time: 10
        sec. Also needs: no DTC P0A2C; MCU temperature is below 0°C; average input torque is above
        90 Nm for 150 sec. Service lamp on.
    P0A2F:
      description: Drive motor 'A' over temperature
      causes: >-
        faulty cooling system, EWP cooling water leaked or lacked, faulty EWP, faulty drive motor
        temperature sensor
      notes: >-
        Threshold: drive motor temperature is above 180°C. Detection time: 10 sec. Also needs: no
        DTC P0A2D, P0A2C. Service lamp on.
    P0A3C:
      description: Drive motor 'A' inverter over temperature
      causes: faulty cooling system, EWP cooling water leaked or lacked, faulty EWP
      notes: >-
        Threshold: MCU temperature is above 125°C (module temperature); MCU temperature is above
        120°C (heat sink 25°C). Detection time: 1 sec. Also needs: no DTC P0A0F, P0AEF. Service lamp
        on.
    P0A3F:
      description: Drive motor 'A' position sensor circuit
      causes: >-
        "SNSR 3" circuit short-to-ground, "SNSR 4" circuit short-to-ground, "SNSR 3" circuit and
        "SNSR 4" circuit short-to-each other, drive motor position sensor
      notes: >-
        Threshold: drive motor position sensor signal voltage is above 1944 mV. Detection time: 400
        ms. Service lamp off.
    P0A41:
      description: Drive motor 'A' position sensor circuit low
      causes: >-
        drive motor position sensor circuit short-to-ground, drive motor position sensor circuit
        open, faulty drive motor position sensor
      source: >-
        Ioniq Electric 2017 service manual, EV Motor Control System diagnosis (EV); uhi22 EPCU bench
        DTC read (resolver not connected)
      notes: >-
        Threshold: drive motor position sensor signal voltage is below 100 mV. Detection time: 400
        ms. Service lamp on.
    P0A42:
      description: Drive motor 'A' position sensor circuit high
      causes: >-
        "SNSR 1"~"4" circuit and "(+)" circuit short-to-each other, "SNSR 1"~"4" circuit and "(-)"
        circuit short-to-each other, faulty drive motor position sensor
      notes: >-
        Threshold: drive motor position sensor signal voltage is above 650 mV. Detection time: 400
        ms. Also needs: no DTC P0A2C; MCU temperature is over 0°C. DTC set immediately. Service lamp
        on.
    P0A62:
      description: Drive motor 'A' phase V current high
      causes: >-
        drive motor 3 phase power cable short, drive motor poor insulation, faulty MCU (EPCU) power
        module (IGBT), faulty MCU (EPCU)
      notes: >-
        Threshold: drive motor V phase current is above 2000 A (25°C). Detection time: 11 times for
        10 sec. Also needs: no DTC P0C01. Service lamp on.
    P0A78:
      description: Drive motor 'A' inverter performance
      causes: >-
        drive motor 3 phase power cable open, drive motor 3 phase power cable poor connection, drive
        motor poor insulation, faulty MCU (EPCU) power module (IGBT), faulty MCU (EPCU)
      notes: >-
        Threshold: deviation between command current and measured current is above 80 A. Detection
        time: 1 sec. Also needs: no DTC P0BE6, P0BE7, P0BE8, P0BEA, P0BEB, P0BEC, P0C05; drive motor
