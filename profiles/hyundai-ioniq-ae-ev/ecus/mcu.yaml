# ─── MCU (Motor Control Unit) ─────────────────────────────────────────
#
# Power electronics and control for the traction motor: inverter switching (DC → 3-phase AC),
# torque/current control loops, rotor position, and motor/inverter thermal protection. Shares
# the EPCU (Electronic Powertrain Control Unit) housing with the VCU (Vehicle Control Unit).
#
# Only KWP2000 session 0x81 is accepted; the 21xx pages also read in the default session.
MCU:
  tx_id: 0x7E3
  can_bus: [P-CAN]
  identity:
    alias: VMCU # also known as HPCU (Hybrid Power Control Unit)
    description: Motor Control Unit (inverter)
    part_number: "36600-0E250"
    ecu_id: AEEMCU83  # KWP2000 1A8C
    sw_id: "EAEEHEL-MS2-D000"
    calibration: "00000001"
    id_protocol: KWP2000  # 1Axx
    notes: >
      Motor Control Unit — inverter / power electronics and control loops for
      the traction motor. Shares the EPCU (Electronic Powertrain Control Unit)
      physical housing with the VCU.
  vehicle_states: [IG3]
  pids:
    2101:
      status: active
      response_frames: 5
      period: 10000
      vehicle_states: [IG3]
      notes: >-
        30 bytes. Words are little-endian, unlike BMS 2101. B23 and B26 are constant 0x02 and 0x04.
        B9/B10/B11 read 8/56/1 in 5121 of 5776 CHARGING captures and in all 35 TOPUP captures; in
        READY B11 is 0 in all 2369 captures and B9 is 140 or 12.
      source: canair analysis 2026-08-08 long drive + DCFC
      verified: false
      parameters:
        MCU_2101_B22:
          expression: B22
          min: "0"
          max: "255"
          source: canair analysis 2026-08-08 (long drive + 50 kW DCFC), gap-verified against CLU ODOMETER
          notes: >-
            Range 6-136. Not a temperature: on 2026-08-08 it fell 37 in 22 s and rose 45 in 50 s,
            and read 22-31 during a DC charge with the coolant at 39-43 °C (r=+0.012 vs AAF coolant
            and heatsink temperatures). Steps down when propulsion stops and up when it resumes.
          enabled: false
        MCU_HV_VOLTAGE:
          expression: B13*2.56
          unit: V
          min: "0"
          max: "500"
          source: canair investigate/hunt 2026-07-22 drive; VERIFIED vs BMS pack voltage over 3h charge 2026-08-05
          verified: true
          notes: >-
            Coarse HV DC-link voltage, about 2.56 V per LSB. Slope 0.991, r=0.981 vs BMS
            BATTERY_VOLTAGE over 2016 samples of a 3 h AC charge (360-399 V).
        MCU_2101_B25:
          expression: B25
          min: "0"
          max: "255"
          notes: >-
            Range 38-105, slow-moving. r=-0.720 vs AAF:2181:MOTOR_COOLANT_TEMP and HEATSINK_TEMP
            (n=1488).
          enabled: false
        MCU_PHASE_CURRENT_1:
          expression: (S30 << 8) | B29
          notes: >-
            Signed 16-bit little-endian, low byte B29, high byte B30; raw counts, scale unknown. The
            three MCU_PHASE_CURRENT signals sum to within ±1 count in 8564 of 8629 captures, driving
            included, so one is computed from the other two. With the motor stopped the readings are
            multiples of about 24.4 counts (sd 58, 55 and 106 for _1, _2 and _3).
        MCU_PHASE_CURRENT_2:
          expression: (S33 << 8) | B31
          notes: >-
            Signed 16-bit little-endian, low byte B31, high byte B33 (B32 is a PCI byte). See
            MCU_PHASE_CURRENT_1.
        MCU_PHASE_CURRENT_3:
          expression: (S35 << 8) | B34
          notes: >-
            Signed 16-bit little-endian, low byte B34, high byte B35. About twice the standstill
            spread of _1 and _2. See MCU_PHASE_CURRENT_1.
        MCU_SUPPLY_VOLTAGE_1:
          expression: ((B15<<8)|B14)/1000
          unit: V
          min: "0"
          max: "16"
          source: canair decode --corr / hunt 2026-10-21
          notes: >-
            12 V supply voltage at the MCU, 1 mV/bit, 16-bit little-endian. r=+0.998 vs
            VCU:2102:VCU_AUX_BATTERY_VOLTAGE_FINE (n=8469, slope 0.996). Reads 14.73-14.83 V while
            the VCU battery and LDC readings are 14.75 and 14.89 V.
        MCU_SUPPLY_VOLTAGE_2:
          expression: ((B28<<8)|B27)/1000
          unit: V
          min: "0"
          max: "16"
          source: canair decode --corr / hunt 2026-10-21
          notes: >-
            Second 12 V supply reading at the MCU, 1 mV/bit, 16-bit little-endian. r=+0.998 vs
            VCU:2102:VCU_LDC_OUTPUT_VOLTAGE (n=8469); tracks MCU_SUPPLY_VOLTAGE_1 within a few tens
            of mV.
    2102:
      response_frames: 9
      status: active
      period: 10000
      vehicle_states: [CHARGING]
      notes: >-
        56 bytes. B27-B33 hold constant calibration bytes that also appear in 21F2. B52 varies over
        0-253 and correlates with no signal. The data bytes from B54 to the end (B65) read 0 in all
        7757 captures.
      source: canair align/hunt vs AAF 2181 and VCU 2102 temperatures 2026-10-22
      verified: false
      parameters:
        MCU_MOTOR_RPM:
          expression: (S10<<8)|B09
          unit: RPM
          min: "-10500"
          max: "10500"
          source: Kia Soul EV VMCU CSV (Motor Actual Speed RPM) + physical validation; low byte corrected 2026-10-21
          verified: true
          notes: >-
            Signed 16-bit little-endian, low byte B09 (0 at standstill). r=0.999 vs
            EPS_VEHICLE_SPEED. Median 62.8 RPM per km/h vs VCU speed, against 61.8 expected from the
            7.412 reduction and 205/55R16 tyres.

        MCU_MOTOR_TORQUE:
          expression: ((S12<<8)|B11)/10
          unit: Nm
          min: "-300"
          max: "300"
          source: energy balance vs BMS:2101 BATTERY_POWER and the cumulative energy counters, 2026-10-21
          notes: >-
            Signed 16-bit little-endian, 0.1 Nm/bit; negative in regen. Range -156 to +181 Nm while
            driving. Torque x MCU_MOTOR_RPM integrated over the sustained 2026-08-08 drives is 79-90
            % of the BMS pack energy (drivetrain efficiency plus 12 V and climate loads); low-speed
            segments fall to 21-63 % as those loads dominate.
        MCU_MOTOR_TORQUE_2:
          expression: ((S14<<8)|B13)/10
          unit: Nm
          min: "-300"
          max: "300"
          enabled: false
          source: canair decode --find-mirrors 2026-10-21
          notes: B13:B14 equals B11:B12 (MCU_MOTOR_TORQUE) byte-for-byte in all 8231 captures.
        MCU_MOTOR_CURRENT:
          expression: ((B17<<8)|B15)/10
          unit: A
          min: "0"
          max: "600"
          enabled: true
          source: canair align + within-PID fit 2026-10-21
          notes: >-
            Motor phase-current magnitude, 16-bit little-endian split across the PCI byte B16; never
            negative. Scale unproven. With the motor stopped it reads 2.7-6.0 (median 3.0) in
            CHARGING, READY and TOPUP alike, so about 3.0 is its zero; up to 214 while driving.
            Tracks |MCU_MOTOR_TORQUE| at about 1.2 counts per 0.1 Nm below 5000 RPM, rising to 1.6
            above 6500 RPM.
        MCU_COOLANT_TEMP:
          expression: B20*2
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Powertrain coolant temperature, 2 °C per count. Mirrors VCU:2102:VCU_COOLANT_TEMP:
            r=+0.991 over 8332 rows, 1 °C below it (median). Slow: 36 to 42 °C over the 2026-08-08
            15:33-16:31 drive.
          enabled: true

        MCU_HEATSINK_TEMP:
          expression: B19*2
          unit: °C
          min: "-40"
          max: "150"
          enabled: true
          notes: >-
            Inverter heatsink temperature, 2 °C per count. Mirrors AAF:2181:HEATSINK_TEMP: r=+0.990
            over 1973 co-polled rows, reading 1 °C below it (median).
        MCU_TEMP_B18:
          expression: B18*2
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            A fourth temperature, 2 °C per count; which component is unknown. Heats most under load:
            16 to 54 °C over the 2026-08-08 10:02-11:41 drive (cycle mean 43 °C, against 36 °C for
            MCU_HEATSINK_TEMP), and cools while parked or DC charging.
          enabled: true
        MCU_MOTOR_COOLANT_TEMP:
          expression: B21*2
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            2 °C per count. Mirrors AAF:2181:MOTOR_COOLANT_TEMP: r=+0.991 over 1973 rows, 1 °C below
            it (median). Rises faster under load than MCU_COOLANT_TEMP: 36 to 58 °C over the
            2026-08-08 15:33-16:31 drive.
          enabled: true
        MCU_MOTOR_POWER:
          expression: ((S12<<8)|B11)/10*((S10<<8)|B09)*0.00010472
          unit: kW
          min: "-100"
          max: "100"
          source: derived from MCU_MOTOR_TORQUE x MCU_MOTOR_RPM, 2026-10-21
          notes: >-
            Mechanical shaft power, torque x 2*pi*RPM/60/1000; negative in regen. Integrated, it is
            79-90 % of the BMS pack energy over sustained 2026-08-08 driving.
        MCU_CURRENT_SENSOR_OFFSET_1:
          expression: (S23<<8)|B22
          min: "-100"
          max: "100"
          source: canair 21F2 cross-check 2026-10-22
          notes: >-
            Small signed word, -11 to -7. Changes only with the motor stopped (73 of 76 changes at 0
            RPM). The Kia Soul VMCU sheet lists U and V phase current sensor offsets. Copied live
            into MCU:21F2.
        MCU_CURRENT_SENSOR_OFFSET_2:
          expression: (S26<<8)|B25
          min: "-100"
          max: "100"
          source: canair 21F2 cross-check 2026-10-22
          notes: >-
            Small signed word, -13 to -7; see MCU_CURRENT_SENSOR_OFFSET_1. Copied live into
            MCU:21F2.

    2103:
      response_frames: 4
      status: draft
      vehicle_states: [CHARGING]
      notes: 27 bytes, all zeros in all 697 captures across charging, READY, parked and driving.
      parameters: {}

    21F2:
      status: slow
      period: 300000
      response_frames: 10
      vehicle_states: [CHARGING]
      notes: >-
        67 data bytes. A summary of the previous drive or charge cycle, like BMS 21F2: average and
        peak of three temperatures (heatsink, MCU_TEMP_B18, coolant), the min, max and average 12 V
        supply, and two unexplained words (B27:B28, B31:B33). Also carries live copies of the two
        current-sensor offsets and of the latched MCU 2102 bytes B34-B42 (at B38-B46), and the ASCII
        tag 'EHEL-MS2' at B69-B77. The cycle values were checked against the five fully logged
        2026-08-08 cycles (preconditioning, three drives, a DC charge).
      source: canair 21F2 vs live MCU/VCU/AAF data over the five 2026-08-08 cycles, 2026-10-22
      verified: false
      parameters:
        MCU_21F2_TAG:
          expression: "[B69:B77]"
          type: ascii
          source: canair search 2026-10-21
          notes: >-
            Constant ASCII 'EHEL-MS2', the middle of the 1A8D software ID EAEEHEL-MS2-D000. The byte
            before it varies, so it is not part of the string.
          enabled: false
        MCU_21F2_HEATSINK_TEMP_AVG:
          expression: B47
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Average inverter heatsink temperature over the previous cycle; within 1 °C of the
            time-weighted MCU_HEATSINK_TEMP mean on the five 2026-08-08 cycles.
        MCU_21F2_HEATSINK_TEMP_MAX:
          expression: B50
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Peak inverter heatsink temperature of the previous cycle; 21-67 °C on the five
            2026-08-08 cycles, never below the sampled peak of AAF:2181:HEATSINK_TEMP.
        MCU_21F2_TEMP_B18_AVG:
          expression: B57
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Average over the previous cycle of the sensor behind MCU:2102 MCU_TEMP_B18; within 1 °C
            of its time-weighted mean on the five 2026-08-08 cycles.
        MCU_21F2_TEMP_B18_MAX:
          expression: B59
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Peak over the previous cycle of the sensor behind MCU:2102 MCU_TEMP_B18; within 2 °C of
            its sampled peak on the five 2026-08-08 cycles.
        MCU_21F2_COOLANT_TEMP_AVG:
          expression: B67
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Average coolant temperature over the previous cycle; within 1 °C of the time-weighted
            VCU:2102 VCU_COOLANT_TEMP mean on the five 2026-08-08 cycles.
        MCU_21F2_COOLANT_TEMP_MAX:
          expression: B68
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            Peak coolant temperature of the previous cycle; within 1 °C of the sampled
            VCU_COOLANT_TEMP peak on the five 2026-08-08 cycles.
        MCU_21F2_SUPPLY_VOLTAGE_AVG:
          expression: B66/10
          unit: V
          min: "0"
          max: "16"
          notes: >-
            Average 12 V supply over the previous cycle, 0.1 V per count; within 0.1 V of the
            MCU_SUPPLY_VOLTAGE_1 mean on the five 2026-08-08 cycles.
        MCU_21F2_SUPPLY_VOLTAGE_MAX:
          expression: B63/10
          unit: V
          min: "0"
          max: "16"
          notes: >-
            Peak 12 V supply of the previous cycle, 0.1 V per count; 0.1 V below to 0.4 V above the
            sampled peak on the five 2026-08-08 cycles. Short cycles with every temperature pair
            equal read 12.1-12.3 V.
        MCU_21F2_SUPPLY_VOLTAGE_MIN:
          expression: B65/10
          unit: V
          min: "0"
          max: "16"
          notes: >-
            Lowest 12 V supply of the previous cycle, 0.1 V per count; 11.4-12.4 V. The DC-charge
            cycle reads 12.3 V, the sampled minimum before the LDC started. Drive cycles read
            11.4-11.9 V, below anything polled.
        MCU_21F2_W27:
          expression: (B28<<8)|B27
          min: "0"
          max: "65535"
          notes: >-
            Unknown, 1275-1469: near 1275-1325 after non-driving cycles and 1449-1469 after drives.
            No live MCU, VCU or BMS signal matches it.
        MCU_21F2_W31:
          expression: (B33<<8)|B31
          min: "0"
          max: "65535"
          notes: >-
            Unknown, 1258-1297: 1273-1276 after non-driving cycles and 1281-1285 after drives.
        MCU_21F2_CURRENT_SENSOR_OFFSET_1:
          expression: (S10<<8)|B9
          min: "-100"
          max: "100"
          notes: >-
            Live copy of MCU:2102 MCU_CURRENT_SENSOR_OFFSET_1: matched the latest MCU 2102 value at
            every change checked (30-32 changes).
          enabled: false
        MCU_21F2_CURRENT_SENSOR_OFFSET_2:
          expression: (S12<<8)|B11
          min: "-100"
          max: "100"
          notes: >-
            Live copy of MCU:2102 MCU_CURRENT_SENSOR_OFFSET_2: matched the latest MCU 2102 value at
            every change checked (30-32 changes).
          enabled: false
  # From a KWP2000 18 00 FF 00 read of an EPCU running alone on a bench (uhi22
  # CAN/EPCU_torquePro_reading_error_memory_18DTCs_found.csv), status 0xE0 except P0CF1 (0x20).
  # OBD-II service 0A also lists P0A8B, P0AEF, P0C17 and U019B as permanent. Descriptions are the
  # SAE J2012 generic meanings; the bench had no motor, resolver, HV supply or BMS connected.
  dtcs:
    source: SAE J2012; uhi22 EPCU bench DTC read
    verified: false
    P0A0D:
      description: "High voltage system interlock circuit high"
    P0A2D:
      description: "Drive motor A temperature sensor circuit low"
    P0A41:
      description: "Drive motor A position sensor circuit low"
      source: "SAE J2012; uhi22 EPCU bench DTC read (resolver not connected)"
    P0A8B:
      description: "14 volt power module system voltage"
    P0AEF:
      description: "Drive motor inverter temperature sensor A circuit low"
    P0BE6:
      description: "Drive motor A phase U current sensor circuit range/performance"
    P0BE7:
      description: "Drive motor A phase U current sensor circuit low"
    P0BEA:
      description: "Drive motor A phase V current sensor circuit range/performance"
    P0BEB:
      description: "Drive motor A phase V current sensor circuit low"
    P0CF1:
      description: "Meaning unknown"
      source: "uhi22 EPCU bench DTC read (status 0x20)"
    P0C17:
      description: "Meaning unknown (reported as permanent by OBD-II service 0A)"
      source: "uhi22 EPCU bench OBD-II 0A read"
    U0111:
      description: "Lost communication with battery energy control module A (BMS)"
      source: "SAE J2012; uhi22 EPCU bench DTC read (no BMS connected)"
    U019B:
      description: "Network fault; meaning unknown"
      source: "uhi22 EPCU bench DTC read"
    U1116:
      description: "Manufacturer-specific network fault; meaning unknown"
      source: "uhi22 EPCU bench DTC read"
  research:
    - type: decode
      target: "2101"
      status: done
      priority: P1
      vehicle_states: [READY]
      notes: >-
        No 2101 byte tracks a powertrain temperature: against AAF:2181:MOTOR_COOLANT_TEMP over the
        2026-08-08 drive (n=1326) the best expressible hit is B22 at r=+0.335. A 16-bit read with
        B12 as the low byte of MCU_HV_VOLTAGE adds nothing: B12 spans only 30-52 and r is unchanged,
        so the 2.56 V resolution is real.
      sources:
        - "Kia Soul EV VMCU CSV — temps (w/x/y - 40)"
        - "Obsidian: MCU.md"
        - "OBDb Ioniq 5 MCU 22E001"
      updated: "2026-08-08"
    - type: scan
      target: 21 00-FF
      status: done
      priority: P2
      vehicle_states: [READY]
      date: "2026-07-22"
      result: Only 01, 02, 03 and F2 answer; the other 252 LIDs NRC.
    - type: verify
      target: 2101 phase-current absolute scale
      status: captured
      priority: P1
      vehicle_states: [DRIVING]
      created: "2026-08-08"
      updated: "2026-08-08"
      notes: >-
        MCU_PHASE_CURRENT_1/2/3 behave as currents (sum of squares 462x higher driving than at
        DC-charge standstill, r=-0.039 vs RPM); only their scale is unknown. Their RMS is 49.7x
        MCU_MOTOR_CURRENT (median, r=0.952, n=1553 DRIVING rows), so the two scales are tied: at 0.1
        A/bit for MCU_MOTOR_CURRENT the phase currents are about 0.020 A per count (peak 11516 raw,
        about 230 A). Neither scale is proven.
      what_to_test:
        - Compare the derived peak against a scan tool reporting motor phase current during a hard
          launch
        - Or clamp-meter one phase lead (workshop only) at a known steady torque
        - "Power balance cross-check: 1.5*Ipk^2*R vs BMS BATTERY_POWER minus mechanical output at
          steady cruise"
    - type: decode
      target: 2101 B22 / B25 identity
      status: captured
      priority: P2
      vehicle_states: [DRIVING]
      created: "2026-08-08"
      updated: "2026-08-08"
      notes: >-
        Neither is a temperature (see MCU_2101_B22, MCU_2101_B25). B22 is fast, 6-136, and steps
        with propulsion; B23 is constant 0x02, so it is a single byte. B25 is slow but r=-0.720 vs
        AAF coolant and heatsink; B26 is constant 0x04.
      what_to_test:
        - Identify B22 (fast, 6-136, steps with propulsion); try modulation index, current limit or
          derating factor
        - Identify B25 (slow, inversely related to coolant); try inverter efficiency or a cooling
          demand
    - type: decode
      target: 21F2 previous-cycle record and 2102 mirror
      status: captured
      priority: P3
      created: "2026-10-21"
      updated: "2026-10-21"
      notes: >-
        Open: MCU_21F2_W27/W31 (B27:B28, B31:B33), the latched MCU 2102 bytes B34-B42 copied to 21F2
        B38-B46, and what MCU_TEMP_B18 measures. Only cycles with nothing unlogged between the cycle
        and the next 21F2 read can be matched (2026-08-08 has five). The latched bytes (B34 67-146,
        signed (S37<<8)|B36 -4702 to 648, B38 36-51, (B42<<8)|B41 599-2779) change only at power-up
        and at the first motion of a drive.
      sources:
        - canair 21F2 cross-check vs live data 2026-10-21
      what_to_test:
        - Read MCU 21F2 straight after a drive co-polled with AAF 2181 at a fast rate, to pin
          B57/B59 (MCU_TEMP_B18) to a component
        - Identify the latched 2102 B34-B42 values, learned at power-up and first motion
    - type: scan
      target: 01 01, 01 21, 01 30, 01 31
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-27"
      updated: "2026-10-27"
      result: >-
        2026-11-01, AC charging: 01 00 -> 41 00 80 00 00 01 (PIDs 01 and 20) and 01 20 -> 41 20 80
        01 80 00 (PIDs 21, 30 and 31; no 40). 01 01 and 01 21 answer with a single data byte, 00,
        where SAE J1979 defines four and two: malformed. 01 30 and 01 31 stay silent when sent
        functionally; 01 40 returns NO DATA. Mode 09: 09 00 -> 14 40 00 00 (InfoTypes 04, 06 and
        0A); 09 04 and 09 0A report one item each but empty (01 00), 09 06 (CVN) is C2199D2C, 09 02
        (VIN) is not answered.
      notes: >-
        OBDb command_support for 2017 and 2018 lists these four Mode 01 PIDs answering from 0x7E3.
        The OBC answers the same four correctly while charging (OBC research entry).
      sources:
        - OBDb Hyundai-IONIQ-Electric signalset and its tests/test_cases (2017/2018 command_support), compared 2026-10-27
      capture_protocol: >-
        canair read MCU:01/01,01/21,01/30,01/31 --save --label 'MCU mode 01 READY' --state READY
    - type: decode
      target: broadcast 0x524 (inverter DC-link voltage)
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-29"
      updated: "2026-10-29"
      notes: >-
        0x524 EPCU_DC_VOLTAGE is defined in signals/powertrain.yaml from the uhi22 Ioniq P-CAN log
        (373 V against 373.5-373.9 V pack voltage on 0x595); the Kona bench reads the same bytes as
        inverter voltage. Still to do: compare it with VCU:2102:VCU_INVERTER_INPUT_VOLTAGE on this
        car.
      sources:
        - projectgus car_hacking, bench_kona/bench_kona.py (Kona OS EV)
      what_to_test:
        - Tapped P-CAN sniff in READY; correlate 0x524 EPCU_DC_VOLTAGE against
          VCU:2102:VCU_INVERTER_INPUT_VOLTAGE to confirm the scale on this car.

  sessions:
    "81":
      name: "standardDiagnosticSession"
      supported: true
    "82":
      name: "periodicDiagnosticSession"
      supported: false
      nrc: 0x12
      nrc_desc: "subFunctionNotSupported"
    "83":
      name: "extendedDiagnosticSession"
      supported: false
      nrc: 0x12
      nrc_desc: "subFunctionNotSupported"
