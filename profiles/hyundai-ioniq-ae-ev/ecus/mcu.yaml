  research:
    - type: decode
      target: "2101"
      status: done
      priority: P1
      vehicle_states: [READY]
      notes: >-
        No 2101 byte tracks a powertrain temperature: against AAF:2181:MOTOR_COOLANT_TEMP over the
        2026-08-08 drive (n=1326) the best expressible hit is B22 at r=+0.335. A 16-bit read with
        B12 as the low byte of MCU_HV_VOLTAGE adds nothing: B12 spans only 30-52 and r is unchanged,
        so the 2.56 V resolution is real.
      sources:
        - "Kia Soul EV VMCU CSV — temps (w/x/y - 40)"
        - "Obsidian: MCU.md"
        - "OBDb Ioniq 5 MCU 22E001"
      updated: "2026-08-08"
    - type: scan
      target: 21 00-FF
      status: done
      priority: P2
      vehicle_states: [READY]
      date: "2026-07-22"
      result: Only 01, 02, 03 and F2 answer; the other 252 LIDs NRC.
    - type: verify
      target: 2101 phase-current absolute scale
      status: captured
      priority: P1
      vehicle_states: [DRIVING]
      created: "2026-08-08"
      updated: "2026-08-08"
      result: >-
        Firmware (MCU_FIRMWARE_FINDINGS.md 5.2): the converter stores float x 50 as a signed 16-bit
        value, so 1/50 per count in the source's unit; amperes is probable, not proven (the
        24.4-count ADC step is 0.488 A).
      notes: >-
        MCU_PHASE_CURRENT_1/2/3 behave as currents (sum of squares 462x higher driving than at
        DC-charge standstill, r=-0.039 vs RPM); only their scale is unknown. Their RMS is 49.7x
        MCU_MOTOR_CURRENT (median, r=0.952, n=1553 DRIVING rows), so the two scales are tied: at 0.1
        A/bit for MCU_MOTOR_CURRENT the phase currents are about 0.020 A per count (peak 11516 raw,
        about 230 A). Neither scale is proven.
      what_to_test:
        - Compare the derived peak against a scan tool reporting motor phase current during a hard
          launch
        - Or clamp-meter one phase lead (workshop only) at a known steady torque
        - "Power balance cross-check: 1.5*Ipk^2*R vs BMS BATTERY_POWER minus mechanical output at
          steady cruise"
    - type: decode
      target: 2101 B22 / B25 identity
      status: captured
      priority: P2
      vehicle_states: [DRIVING]
      created: "2026-08-08"
      updated: "2026-11-03"
      result: >-
        Firmware: B22:B23 and B25:B26 are 16-bit ADC voltages in mV (B22 and B25 were their low
        bytes); signals renamed MCU_2101_ADC_1_MV and _2_MV. Which physical sensor each is stays
        open.
      notes: >-
        Neither is a temperature (see MCU_2101_B22, MCU_2101_B25). B22 is fast, 6-136, and steps
        with propulsion; B23 is constant 0x02, so it is a single byte. B25 is slow but r=-0.720 vs
        AAF coolant and heatsink; B26 is constant 0x04. Both also move with the motor stopped and
        the inverter off, and the same way every time: aligned on the end of the three parked 12 V
        top-ups (2026-10-21, 2026-10-30, 2026-11-03), their per-minute means agree within 1-2 counts
        over the last 13 min (B22 about 88 to 70, B25 about 104 to 92), although pack voltage
        (362-390 V) and starting coolant temperature differed. On 2026-11-03 B22 started at 116 and
        B25 at 117, 19 min before the end. So in a top-up both follow a fixed course in time (time
        since wake, or a temperature the LDC raises the same way each time).
      what_to_test:
        - Identify B22 (fast, 6-136, steps with propulsion); try modulation index, current limit or
          derating factor
        - Identify B25 (slow, inversely related to coolant); try inverter efficiency or a cooling
          demand
    - type: decode
      target: 21F2 previous-cycle record and 2102 mirror
      status: done
      priority: P3
      created: "2026-10-21"
      updated: "2026-11-12"
      result: >-
        Firmware maps every byte (MCU_FIRMWARE_FINDINGS.md 5.4): the statistics are kept while model
        state 1 holds; the three u16 at B27/B29/B31 are max/min/average of the 2102 B52:B53 sensor
        voltage (min stuck at 0); temperatures are 16-bit or signed.
      notes: >-
        Open: MCU_21F2_W27/W31 (B27:B28, B31:B33), the latched MCU 2102 bytes B34-B42 copied to 21F2
        B38-B46, and what MCU_TEMP_B18 measures. Only cycles with nothing unlogged between the cycle
        and the next 21F2 read can be matched (2026-08-08 has five). The latched bytes (B34 67-146,
        signed (S37<<8)|B36 -4702 to 648, B38 36-51, (B42<<8)|B41 599-2779) change only at power-up
        and at the first motion of a drive. The parked 12 V top-up is not recorded as a cycle: BMS
        OPERATING_TIME advanced only 118 s between the end of the 2026-10-21 top-up and the
        2026-10-22 09:25:50 read, so the top-up was the last completed cycle, yet that read (like
        the 25 reads during the top-up) shows a cycle with the 12 V at 11.6-12.2 V and coolant at
        8-9 °C, not 14.6 V. BMS 21F2 did not change across that top-up either, and VCU 21F2 only in
        B10 (0x5E to 0x3E by the next morning).
      sources:
        - canair 21F2 cross-check vs live data 2026-10-21
      what_to_test:
        - Read MCU 21F2 straight after a drive co-polled with AAF 2181 at a fast rate, to pin
          B57/B59 (MCU_TEMP_B18) to a component
        - Identify the latched 2102 B34-B42 values, learned at power-up and first motion
    - type: scan
      target: 01 01, 01 21, 01 30, 01 31
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-27"
      updated: "2026-10-27"
      result: >-
        2026-11-01, AC charging: 01 00 -> 41 00 80 00 00 01 (PIDs 01 and 20) and 01 20 -> 41 20 80
        01 80 00 (PIDs 21, 30 and 31; no 40). 01 01 and 01 21 answer with a single data byte, 00,
        where SAE J1979 defines four and two: malformed. 01 30 and 01 31 stay silent when sent
        functionally; 01 40 returns NO DATA. Mode 09: 09 00 -> 14 40 00 00 (InfoTypes 04, 06 and
        0A); 09 04 and 09 0A report one item each but empty (01 00), 09 06 (CVN) is C2199D2C, 09 02
        (VIN) is not answered.
      notes: >-
        OBDb command_support for 2017 and 2018 lists these four Mode 01 PIDs answering from 0x7E3.
        The OBC answers the same four correctly while charging (OBC research entry).
      sources:
        - OBDb Hyundai-IONIQ-Electric signalset and its tests/test_cases (2017/2018 command_support), compared 2026-10-27
      capture_protocol: >-
        canair read MCU:01/01,01/21,01/30,01/31 --save --label 'MCU mode 01 READY' --state READY
    - type: decode
      target: broadcast 0x524 (inverter DC-link voltage)
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-29"
      updated: "2026-11-12"
      result: >-
        Firmware: 0x524 bytes 0-1 are an unsigned 16-bit integer volt value of the variable 2101
        B12:B13 holds at 0.01 V (0x40011D00 via 0x400166F4); uhi22 trace 0x0175 = 373 V. Candidate;
        compare live (MCU_FIRMWARE_FINDINGS.md 7.3).
      notes: >-
        0x524 EPCU_DC_VOLTAGE is defined in signals/powertrain.yaml from the uhi22 Ioniq P-CAN log
        (373 V against 373.5-373.9 V pack voltage on 0x595); the Kona bench reads the same bytes as
        inverter voltage. Still to do: compare it with VCU:2102:VCU_INVERTER_INPUT_VOLTAGE on this
        car.
      sources:
        - projectgus car_hacking, bench_kona/bench_kona.py (Kona OS EV)
      what_to_test:
        - Tapped P-CAN sniff in READY; correlate 0x524 EPCU_DC_VOLTAGE against
          VCU:2102:VCU_INVERTER_INPUT_VOLTAGE to confirm the scale on this car.
    - type: verify
      target: ReadMemoryByAddress (0x23) survey stopped the AC charge
      status: captured
      priority: P1
      vehicle_states: [CHARGING]
      created: "2026-11-08"
      updated: "2026-11-08"
      date: "2026-11-08"
      result: >-
        A memory image survey (64-byte reads every 4 KiB) answered up to about 0x863000; the 61-byte
        read at 0x864000 drew no answer at 12:00:02 UTC, then the MCU, BMS and OBC went silent and
        the AC charge stopped (VCU_POWER_STATE 7 -> 6, VCU_IG3_ON 0). No charge schedule was set. No
        ECU stored a new code; the charge resumed when restarted at the car.
      notes: >-
        Treat the MCU as unsafe to memory-read above 0x3FFFFF. The 1-byte map probes answered across
        the whole 0x000000-0xFFFFFF space, so the MCU does not check the range of a memory read. The
        MCU is probably an MPC56xx part (00 5A boot header at 0x000000); on those, a read of an
        unimplemented address raises a machine check, which may reset the MCU and make the VCU end
        the charge. Not proven: the stop may have another cause. The samples up to 0x863000
        answered, so reads above 4 MiB do not always fail. Reads stay inside 0x000000-0x3FFFFF (the
        2026-11-12 entry and plans/2026-11-12-mcu-flash-image.md). Static read of the image
        (MCU_FIRMWARE_FINDINGS.md section 3): the handler builds a 24-bit address, its address check
        is a stub that always passes, and TLB entry 1 maps the 16 MiB 0x000000-0xFFFFFF, so no TLB
        miss can happen. The only machine-check handler records the fault and returns, MSR[ME] is
        never set, and every other exception resets the MCU. What the bus does above 0x3FFFFF is not
        in the image. The VCU masks the timeouts of the MCU's frames while plugged in, so an MCU
        reset alone does not explain why the MCU, BMS and OBC all went silent.
      sources:
        - canair logs (run ec52bbec), canair memory image MCU --plan-only, 2026-11-08
    - type: verify
      target: ReadMemoryByAddress (0x23) flash image 0x000000-0x3FFFFF
      status: done
      priority: P1
      vehicle_states: [READY]
      created: "2026-11-12"
      updated: "2026-11-12"
      date: "2026-11-12"
      result: >-
        Imaged on 2026-11-12 in READY over wican-ws: a sparse image (836.7 KiB) plus a full read of
        the erased areas below 0x168000 (826.2 KiB). 145 extents read twice were the same, the two
        dumps agree on their 67,508 overlapping bytes, and no new fault code appeared. The merged
        image passes the VCU's header checksum (392DADE6 at 0x10078), so it is byte-exact and the
        flash is 4 MiB. The sparse image alone missed 10,865 non-FF bytes (mostly 00), which is why
        its sum differed. The image holds the MCU's part number, sw_id, calibration and ecu_id
        AEEMCU83 at the VCU's header offsets. Over slcan-tcp, multi-frame replies from the MCU and
        the VCU were lost at the same rate, so the slcan-tcp path, not the MCU, caused the morning's
        losses.
      notes: >-
        Boot block: the first 4 KiB equal the VCU's except 3 bytes. The start-up code clears SRAM up
        to 0x4003FFFF (256 KiB, as on the VCU), and the reset code calls the application at 0x100000
        (the VCU: 0x180000). So the chip is probably the VCU's class (MPC5674F, 4 MiB flash;
        inferred). The survey found no aliasing and data in 0x000000-0x0062BF, 0x00FFC0-0x010CBF,
        0x011140-0x013F3F, 0x062100-0x0653FF, 0x080000-0x0A57BF, 0x100000-0x1637FF and
        0x164940-0x167CBF (632 KiB); the rest reads erased. The block search sent one 128-byte read,
        which drew no answer. The lost replies come from the slcan-tcp path, not the MCU (afternoon
        test, READY): every lost reply had started (a first frame came, then a consecutive-frame
        timeout or a wrong sequence number), single-frame reads lost none, and the VCU lost as many
        as the MCU on the same link. Over wican-ws the same 32 KiB took 1 min 40 s against 7 min,
        with one short burst of losses. Read the MCU over wican-ws.
      sources:
        - plans/2026-11-12-mcu-flash-image.md
        - canair logs, memory image MCU --plan-only, 2026-11-12
      what_to_test:
        - Loss rate by reply shape (1, 2 and 10 frames) in READY, against the VCU on the same link
        - The same 64-byte reads with flow control from the dongle (wican-ws or a LAN link)
      capture_protocol: Phase 2 of plans/2026-11-12-mcu-flash-image.md
