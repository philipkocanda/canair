    P0A8B:
      description: 14 volt power module system voltage
      causes: MCU (EPCU) supply power (12 V) low/instability, faulty MCU (EPCU) power module (IGBT)
      source: >-
        Ioniq Electric 2017 service manual, EV Motor Control System diagnosis (EV); uhi22 EPCU bench
