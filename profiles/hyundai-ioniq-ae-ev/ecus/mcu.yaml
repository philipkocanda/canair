# ─── MCU (Motor Control Unit) ─────────────────────────────────────────
#
# This is the power electronics + control for the traction motor.
#
# Responsibilities:
# - Inverter switching (DC → 3-phase AC)
# - Motor torque/current control loops
# - Rotor position handling
# - Thermal protection of motor/inverter
#
# The Vehicle Control Unit (VCU) and Motor Control Unit (MCU)
# are both part of the Electronic Powertrain Control Unit (EPCU) physical housing.
#
# Full service 21 scan (01-FF) during AC charging (2026-04-18):
#   0x01 (30 bytes), 0x02 (56 bytes), 0x03 (27 bytes, all zeros), 0xF2 (67 bytes).
#
# KWP2000 diagnostic sessions (service 0x10) — probed 2026-07-22, car in READY:
# see the structured `sessions:` field at the end of this ECU block.
# Only 0x81 is accepted; 21xx reads work in the default session too — no session
# unlocks extra data. Payload sizes are session-independent: 2101=30B, 2102=56B,
# 2103=27B; 2104/2105 → NRC 0x12 (do not exist).
MCU:
  tx_id: 0x7E3
  can_bus: [P-CAN]
  identity:
    alias: VMCU # aka HPCU (Hybrid Power Control Unit - legacy term but may help to know)
    description: Motor Control Unit (inverter)
    part_number: "36600-0E250"
    ecu_id: AEEMCU83  # KWP2000 1A8C
    sw_id: "EAEEHEL-MS2-D000"
    calibration: "00000001"
    id_protocol: KWP2000  # 1Axx
    notes: >
      Motor Control Unit — inverter / power electronics and control loops for
      the traction motor. Shares the EPCU (Electronic Powertrain Control Unit)
      physical housing with the VCU.
  vehicle_states: [IG3]
  pids:
    2101:
      status: active
      response_frames: 5
      period: 10000
      vehicle_states: [IG3]
      notes: >-
        30 bytes. Words are little-endian, unlike BMS 2101. B23 and B26 are constant 0x02 and 0x04.
        B9/B10/B11 read 8/56/1 in 5121 of 5776 CHARGING captures and in all 35 TOPUP captures; in
        READY B11 is 0 in all 2369 captures and B9 is 140 or 12.
      source: canair analysis 2026-08-08 long drive + DCFC
      verified: false
      parameters:
        MCU_2101_B22:
          expression: B22
          min: "0"
          max: "255"
          source: canair analysis 2026-08-08 (long drive + 50 kW DCFC), gap-verified against CLU ODOMETER
          notes: >-
            Range 6-136 across 8598 captures. Not a temperature: on 2026-08-08 it fell 37 in 22 s
            and rose 45 in 50 s, and read 22-31 during a DC charge with the coolant at 39-43 °C.
            r=+0.012 vs AAF coolant and heat-sink temperatures. Steps down when propulsion stops and
            up when it resumes.
          enabled: false
        MCU_HV_VOLTAGE:
          expression: B13*2.56
          unit: V
          min: "0"
          max: "500"
          source: canair investigate/hunt 2026-07-22 drive; VERIFIED vs BMS pack voltage over 3h charge 2026-08-05
          verified: true
          notes: >-
            Coarse HV DC-link voltage, about 2.56 V per LSB. Slope 0.991, r=0.981 vs BMS
            BATTERY_VOLTAGE over 2016 samples of a 3 h AC charge (360-399 V).
        MCU_2101_B25:
          expression: B25
          min: "0"
          max: "255"
          notes: >-
            Range 38-105 across 8633 captures, slow-moving. r=-0.720 vs AAF:2181:MOTOR_COOLANT_TEMP
            and HEATSINK_TEMP (n=1488). B26 is constant 0x04.
          enabled: false
        MCU_PHASE_CURRENT_1:
          expression: (S30 << 8) | B29
          notes: >-
            Signed 16-bit little-endian, low byte B29, high byte B30. Scale unknown, so raw counts.
            The three MCU_PHASE_CURRENT signals sum to within ±1 count in 8564 of 8629 aligned
            captures, driving included, so one is computed from the other two rather than measured.
            With the motor stopped the readings are multiples of about 24.4 counts, sd 58, 55 and
            106 for _1, _2 and _3, r=0.79 between _1 and _2 (CHARGING, n=5386); READY and TOPUP
            standstill readings match.
        MCU_PHASE_CURRENT_2:
          expression: (S33 << 8) | B31
          notes: >-
            Signed 16-bit little-endian, low byte B31, high byte B33 (B32 is a PCI byte). See
            MCU_PHASE_CURRENT_1.
        MCU_PHASE_CURRENT_3:
          expression: (S35 << 8) | B34
          notes: >-
            Signed 16-bit little-endian, low byte B34, high byte B35. About twice the standstill
            spread of _1 and _2. See MCU_PHASE_CURRENT_1.
        MCU_SUPPLY_VOLTAGE_1:
          expression: ((B15<<8)|B14)/1000
          unit: V
          ha_class: voltage
          min: "0"
          max: "16"
          source: canair decode --corr / hunt 2026-10-21
          notes: >-
            12 V supply voltage at the MCU, 1 mV/bit, 16-bit little-endian. r=+0.998 vs
            VCU:2102:VCU_AUX_BATTERY_VOLTAGE_FINE (n=8469, slope 0.996). Reads 14.73-14.83 V while
            the VCU battery and LDC readings are 14.75 and 14.89 V.
        MCU_SUPPLY_VOLTAGE_2:
          expression: ((B28<<8)|B27)/1000
          unit: V
          ha_class: voltage
          min: "0"
          max: "16"
          source: canair decode --corr / hunt 2026-10-21
          notes: >-
            Second 12 V supply reading at the MCU, 1 mV/bit, 16-bit little-endian. r=+0.998 vs
            VCU:2102:VCU_LDC_OUTPUT_VOLTAGE (n=8469); tracks MCU_SUPPLY_VOLTAGE_1 within a few tens
            of mV.
    2102:
      response_frames: 9
      status: active
      period: 10000
      vehicle_states: [CHARGING]
      notes: >-
        56 bytes. B27-B33 hold constant calibration bytes that also appear in 21F2. B52 is a counter
        or checksum that correlates with no signal. The data bytes from B54 to the end (B65) read 0
        in all 7757 captures.
      source: canair align/hunt vs AAF 2181 and VCU 2102 temperatures 2026-10-22
      verified: false
      parameters:
        MCU_MOTOR_RPM:
          expression: (S10<<8)|B09
          unit: RPM
          min: "-10500"
          max: "10500"
          source: Kia Soul EV VMCU CSV (Motor Actual Speed RPM) + physical validation; low byte corrected 2026-10-21
          verified: true
          notes: >-
            Signed 16-bit little-endian; B09 is the low byte. B11 cannot be: B11:B12 is the torque
            word, duplicated byte-for-byte at B13:B14 in all 8231 captures, and B09 is 0 at
            standstill but spread over 26-253 above 500 RPM. Against EPS_VEHICLE_SPEED the
            little-endian read fits better (r=0.999 vs 0.997 for [S10:S11]). Median 62.8 RPM per
            km/h vs VCU speed, against 61.8 expected from the 7.412 reduction and 205/55R16 tyres.

        MCU_MOTOR_TORQUE:
          expression: ((S12<<8)|B11)/10
          unit: Nm
          min: "-300"
          max: "300"
          source: energy balance vs BMS:2101 BATTERY_POWER and the cumulative energy counters, 2026-10-21
          notes: >-
            Signed 16-bit little-endian, 0.1 Nm/bit; negative in regen. Torque x MCU_MOTOR_RPM
            integrated over the 2026-08-08 drives gives 79-90 % of the BMS pack energy on the
            sustained segments (10:30-11:41, 16:48-17:52), which is drivetrain efficiency with the
            12 V and climate loads on top; low-speed segments fall to 21-63 % as those loads
            dominate. The integrated pack power agrees with the BMS energy counters. Range -156 to
            +181 Nm while driving. The old [S12:S13]/100 decoded the same value (B13 copies B11) at
            a tenth of this scale.
        MCU_MOTOR_TORQUE_2:
          expression: ((S14<<8)|B13)/10
          unit: Nm
          min: "-300"
          max: "300"
          enabled: false
          source: canair decode --find-mirrors 2026-10-21
          notes: >-
            B13:B14 equals B11:B12 (MCU_MOTOR_TORQUE) byte-for-byte in all 8231 captures. Disabled
            as a duplicate. The old [S14:S15] read straddled this word and the current word.
        MCU_MOTOR_CURRENT:
          expression: ((B17<<8)|B15)/10
          unit: A
          ha_class: current
          min: "0"
          max: "600"
          enabled: true
          source: canair align + within-PID fit 2026-10-21
          notes: >-
            Motor phase-current magnitude, 16-bit little-endian split across the PCI byte B16; never
            negative. With the motor stopped (RPM and torque 0) it reads 2.7-6.0, median 3.0, in
            CHARGING (n=5386), READY (n=636) and TOPUP (n=35) alike, so about 3.0 is its zero. Up to
            214 while driving (if 0.1 A/bit, which is not proven). Tracks |MCU_MOTOR_TORQUE| at
            about 1.2 counts per 0.1 Nm below 5000 RPM, rising to 1.6 above 6500 RPM, as field
            weakening would.
        MCU_COOLANT_TEMP:
          expression: B20*2
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "150"
          notes: >-
            Powertrain coolant temperature, 2 °C per count. Mirrors VCU:2102:VCU_COOLANT_TEMP:
            r=+0.991 over 8332 rows, 1 °C below it (median). Slow: 36 to 42 °C over the 2026-08-08
            15:33-16:31 drive.
          enabled: true

        MCU_HEATSINK_TEMP:
          expression: B19*2
          unit: °C
          min: "-40"
          max: "150"
          enabled: true
          notes: >-
            Inverter heatsink temperature, 2 °C per count. Mirrors AAF:2181:HEATSINK_TEMP: r=+0.990
            over 1973 co-polled rows, reading 1 °C below it (median; 10th-90th percentile 0 to 1
            °C). The earlier 1 °C/count reading is what made it look implausible.
          ha_class: temperature
        MCU_TEMP_B18:
          expression: B18*2
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            A fourth temperature, 2 °C per count; which component is unknown. Heats most under load:
            16 to 54 °C over the 2026-08-08 10:02-11:41 drive (cycle mean 43 °C, against 36 °C for
            MCU_HEATSINK_TEMP), and cools while parked or DC charging. Possibly the motor stator or
            the MCU board (the Kia Soul VMCU sheet lists motor, MCU and heatsink temperatures). The
            earlier 'below ambient' reading came from assuming 1 °C per count.
          enabled: true
          ha_class: temperature
        MCU_MOTOR_COOLANT_TEMP:
          expression: B21*2
          unit: °C
          min: "-40"
          max: "150"
          notes: >-
            2 °C per count. Mirrors AAF:2181:MOTOR_COOLANT_TEMP: r=+0.991 over 1973 rows, 1 °C below
            it (median; 10th-90th percentile 0 to 1 °C), and r=+0.960 vs MCU_COOLANT_TEMP. Rises
            faster under load than MCU_COOLANT_TEMP (36 to 58 °C over the 2026-08-08 15:33-16:31
            drive), which is what produced the earlier torque correlation.
          ha_class: temperature
          enabled: true
        MCU_MOTOR_POWER:
          expression: ((S12<<8)|B11)/10*((S10<<8)|B09)*0.00010472
          unit: kW
          ha_class: power
          min: "-100"
          max: "100"
          source: derived from MCU_MOTOR_TORQUE x MCU_MOTOR_RPM, 2026-10-21
          notes: >-
            Mechanical shaft power, torque x 2*pi*RPM/60/1000; negative in regen. Integrated, it is
            79-90 % of the BMS pack energy over sustained 2026-08-08 driving.
        MCU_CURRENT_SENSOR_OFFSET_1:
          expression: (S23<<8)|B22
          min: "-100"
          max: "100"
          source: canair 21F2 cross-check 2026-10-22
          notes: >-
            Small signed word, -11 to -7. Changes only with the motor stopped (73 of 76 changes at 0
            RPM), so probably a phase-current sensor zero offset, learned at standstill (the Kia
            Soul VMCU sheet lists U and V phase current sensor offsets). Copied live into MCU:21F2.
        MCU_CURRENT_SENSOR_OFFSET_2:
          expression: (S26<<8)|B25
          min: "-100"
          max: "100"
          source: canair 21F2 cross-check 2026-10-22
          notes: >-
            Small signed word, -13 to -7; see MCU_CURRENT_SENSOR_OFFSET_1. Copied live into
            MCU:21F2.

    2103:
      response_frames: 4
      status: draft
      vehicle_states: [CHARGING]
      notes: >-
        27 bytes, all zeros in every one of 697 captures across charging, READY, parked and driving
        (checked 2026-10-22). Nothing to decode.
      parameters: {}

    21F2:
      status: slow
      period: 300000
      response_frames: 10
      vehicle_states: [CHARGING]
      notes: >-
        67 data bytes. A summary of the previous drive or charge cycle, like BMS 21F2: average and
        peak of three temperatures (heatsink, MCU_TEMP_B18, coolant) and the min, max and average 12
        V supply, plus two unexplained words (B27:B28, B31:B33). Also carries live copies of the two
        current-sensor offsets and of the latched MCU 2102 bytes B34-B42 (at B38-B46), and the ASCII
        tag 'EHEL-MS2' (part of the 1A8D software ID) at B69-B77. A misfiled VCU 21F2 reply
        (2026-08-08 10:07:16) was deleted on 2026-10-21; see
        plans/2026-10-21-cross-ecu-reply-misfile.md.
      source: canair 21F2 vs live MCU/VCU/AAF data over the five 2026-08-08 cycles, 2026-10-22
      verified: false
      parameters:
        MCU_21F2_TAG:
          expression: "[B69:B77]"
          type: ascii
          source: canair search 2026-10-21
          notes: >-
            Constant ASCII 'EHEL-MS2', the middle of the 1A8D software ID EAEEHEL-MS2-D000. The byte
            before it varies, so it is not part of the string.
          enabled: false
        MCU_21F2_HEATSINK_TEMP_AVG:
          expression: B47
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "150"
          notes: >-
            Average inverter heatsink temperature over the previous cycle. Checked on the five fully
            logged 2026-08-08 cycles (preconditioning, three drives, a DC charge): 19, 36, 42, 38,
            38 against a time-weighted MCU_HEATSINK_TEMP mean of 18.4, 36.2, 41.4, 37.6, 37.4 °C.
        MCU_21F2_HEATSINK_TEMP_MAX:
          expression: B50
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "150"
          notes: >-
            Peak inverter heatsink temperature of the previous cycle. Checked on the five fully
            logged 2026-08-08 cycles (preconditioning, three drives, a DC charge): 21, 53, 61, 40,
            67, never below the sampled peak of AAF:2181:HEATSINK_TEMP (20, 48, 60, 40, 64), as a
            peak the MCU sees between polls should be.
        MCU_21F2_TEMP_B18_AVG:
          expression: B57
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "150"
          notes: >-
            Average over the previous cycle of the sensor behind MCU:2102 MCU_TEMP_B18. Checked on
            the five fully logged 2026-08-08 cycles (preconditioning, three drives, a DC charge):
            16, 44, 51, 45, 50 against a time-weighted mean of 16.5, 43.0, 50.2, 44.4, 49.5 °C.
        MCU_21F2_TEMP_B18_MAX:
          expression: B59
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "150"
          notes: >-
            Peak over the previous cycle of the sensor behind MCU:2102 MCU_TEMP_B18. Checked on the
            five fully logged 2026-08-08 cycles (preconditioning, three drives, a DC charge): 19,
            54, 56, 49, 53 against a sampled peak of 18, 54, 54, 48, 52 °C.
        MCU_21F2_COOLANT_TEMP_AVG:
          expression: B67
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "150"
          notes: >-
            Average coolant temperature over the previous cycle. Checked on the five fully logged
            2026-08-08 cycles (preconditioning, three drives, a DC charge): 22, 35, 40, 42, 37
            against a time-weighted VCU:2102 VCU_COOLANT_TEMP mean of 22.6, 35.8, 40.2, 42.5, 37.0
            °C.
        MCU_21F2_COOLANT_TEMP_MAX:
          expression: B68
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "150"
          notes: >-
            Peak coolant temperature of the previous cycle. Checked on the five fully logged
            2026-08-08 cycles (preconditioning, three drives, a DC charge): 25, 41, 43, 44, 43
            against a sampled VCU_COOLANT_TEMP peak of 25, 42, 44, 44, 44 °C.
        MCU_21F2_SUPPLY_VOLTAGE_AVG:
          expression: B66/10
          unit: V
          ha_class: voltage
          min: "0"
          max: "16"
          notes: >-
            Average 12 V supply over the previous cycle, 0.1 V per count. Checked on the five fully
            logged 2026-08-08 cycles (preconditioning, three drives, a DC charge): 14.2, 14.6, 13.7,
            14.5, 13.7 against a MCU_SUPPLY_VOLTAGE_1 mean of 14.1, 14.7, 13.8, 14.6, 13.8 V.
        MCU_21F2_SUPPLY_VOLTAGE_MAX:
          expression: B63/10
          unit: V
          ha_class: voltage
          min: "0"
          max: "16"
          notes: >-
            Peak 12 V supply of the previous cycle, 0.1 V per count. Checked on the five fully
            logged 2026-08-08 cycles (preconditioning, three drives, a DC charge): 14.9, 14.9, 14.2,
            15.0, 14.2 against a sampled peak of 15.0, 14.9, 13.9, 14.9, 13.8 V (the two 14.2 drives
            ran the LDC at 13.8 V; a short higher stretch between polls is assumed). Short cycles
            read 12.1-12.3 V with every temperature pair equal, which looks like a 12 V-only wake
            with the LDC off.
        MCU_21F2_SUPPLY_VOLTAGE_MIN:
          expression: B65/10
          unit: V
          ha_class: voltage
          min: "0"
          max: "16"
          notes: >-
            Lowest 12 V supply of the previous cycle, 0.1 V per count; 11.4-12.4 V. The DC-charge
            cycle reads 12.3 V, the sampled minimum before the LDC started. Drive cycles read
            11.4-11.9 V, below anything polled, so probably a dip at power-up.
        MCU_21F2_W27:
          expression: (B28<<8)|B27
          min: "0"
          max: "65535"
          notes: >-
            Unknown, 1275-1469. Near 1275-1325 after non-driving cycles and 1449-1469 after drives
            (1469 twice); with MCU_21F2_W31 it looks like the peak and average of one quantity that
            idles near 1275. No live MCU, VCU or BMS signal matches it.
        MCU_21F2_W31:
          expression: (B33<<8)|B31
          min: "0"
          max: "65535"
          notes: >-
            Unknown, 1258-1297: 1273-1276 after non-driving cycles and 1281-1285 after drives.
            Possibly the average of the quantity whose peak is MCU_21F2_W27.
        MCU_21F2_CURRENT_SENSOR_OFFSET_1:
          expression: (S10<<8)|B9
          min: "-100"
          max: "100"
          notes: >-
            Live copy of MCU:2102 MCU_CURRENT_SENSOR_OFFSET_1: matched the latest MCU 2102 value at
            every change checked (30-32 changes). Disabled as a duplicate.
          enabled: false
        MCU_21F2_CURRENT_SENSOR_OFFSET_2:
          expression: (S12<<8)|B11
          min: "-100"
          max: "100"
          notes: >-
            Live copy of MCU:2102 MCU_CURRENT_SENSOR_OFFSET_2: matched the latest MCU 2102 value at
            every change checked (30-32 changes). Disabled as a duplicate.
          enabled: false
  # From a KWP2000 18 00 FF 00 read of an EPCU running alone on a bench (uhi22
  # CAN/EPCU_torquePro_reading_error_memory_18DTCs_found.csv), status 0xE0 except P0CF1 (0x20).
  # OBD-II service 0A also lists P0A8B, P0AEF, P0C17 and U019B as permanent. Descriptions are the
  # SAE J2012 generic meanings; the bench had no motor, resolver, HV supply or BMS, which fits them.
  dtcs:
    P0A0D:
      description: "High voltage system interlock circuit high"
      source: "SAE J2012; uhi22 EPCU bench DTC read"
      verified: false
    P0A2D:
      description: "Drive motor A temperature sensor circuit low"
      source: "SAE J2012; uhi22 EPCU bench DTC read"
      verified: false
    P0A41:
      description: "Drive motor A position sensor circuit low"
      source: "SAE J2012; uhi22 EPCU bench DTC read (resolver not connected)"
      verified: false
    P0A8B:
      description: "14 volt power module system voltage"
      source: "SAE J2012; uhi22 EPCU bench DTC read"
      verified: false
    P0AEF:
      description: "Drive motor inverter temperature sensor A circuit low"
      source: "SAE J2012; uhi22 EPCU bench DTC read"
      verified: false
    P0BE6:
      description: "Drive motor A phase U current sensor circuit range/performance"
      source: "SAE J2012; uhi22 EPCU bench DTC read"
      verified: false
    P0BE7:
      description: "Drive motor A phase U current sensor circuit low"
      source: "SAE J2012; uhi22 EPCU bench DTC read"
      verified: false
    P0BEA:
      description: "Drive motor A phase V current sensor circuit range/performance"
      source: "SAE J2012; uhi22 EPCU bench DTC read"
      verified: false
    P0BEB:
      description: "Drive motor A phase V current sensor circuit low"
      source: "SAE J2012; uhi22 EPCU bench DTC read"
      verified: false
    P0CF1:
      description: "Meaning unknown"
      source: "uhi22 EPCU bench DTC read (status 0x20)"
      verified: false
    P0C17:
      description: "Meaning unknown (reported as permanent by OBD-II service 0A)"
      source: "uhi22 EPCU bench OBD-II 0A read"
      verified: false
    U0111:
      description: "Lost communication with battery energy control module A (BMS)"
      source: "SAE J2012; uhi22 EPCU bench DTC read (no BMS connected)"
      verified: false
    U019B:
      description: "Network fault; meaning unknown"
      source: "uhi22 EPCU bench DTC read"
      verified: false
    U1116:
      description: "Manufacturer-specific network fault; meaning unknown"
      source: "uhi22 EPCU bench DTC read"
      verified: false
  research:
    - type: decode
      target: "2102"
      status: captured
      priority: P1
      vehicle_states: [CHARGING]
      notes: >-
        56 bytes. 2026-07-20 (Phase 1): MOTOR_RPM verified at [S10:S11]. Added UNVERIFIED candidates
        from variance + park/drive + dRPM-correlation over 332 captures: MCU_MOTOR_TORQUE_2
        [S14:S15]/100 (second signed-16 torque, ≈0 at park), MCU_PHASE_CURRENT_RMS [B17:B18]/10
        (always ≥0, r=+0.44 vs dRPM). Temps B20/B21 still barely-warmed candidates. Calibration
        block B27–B33 documented as static (resolver + U/V phase offsets). STILL OPEN (Phase 2):
        confirm which torque is command vs estimated, phase-current scale, disambiguate the 3rd
        temperature (B22/B25 track RPM, 52..248 raw — offset/scale unclear), and identify the
        highly-dynamic B52 (card=180). Needs a warm, dense, synced VCU+MCU drive capture.
      what_to_test:
        - "Torque: MCU_MOTOR_TORQUE [S12:S13] vs MCU_MOTOR_TORQUE_2 [S14:S15] — which is command vs estimated? Both ≈0 at park; correlate against pedal + dRPM incl. regen/braking (signed must go negative)."
        - "Phase current: [B17:B18] scale — /10→A guess; confirm 0 at park, rises with |torque|, peak vs motor spec."
        - "Temps: B20/B21 raw °C vs value−40; warm the inverter to separate motor/inverter/heat-sink. Check B22/B25 as a 3rd temp or a different quantity."
        - "B52 (TAQ, card=180) — identify this fast-changing signal."
        - >
          CAPTURE METHOD: WebSocket polling is sequential over one connection and the stored
          timestamp is per-cycle (not per-PID acquisition), so VCU 2101 and MCU 2102 are skewed
          ~0.3-3s and cannot be tightly synced across ECUs. Mitigation: poll ONLY the two PIDs,
          dense + back-to-back:  canair query "query VCU:2101" "query MCU:2102" --monitor 1
          --keep-all --save --wican vpn  (drive with hard launches, lift-off/regen, and braking;
          run long enough to warm the inverter for the temp mapping). NOTE: torque RPM are BOTH in
          MCU 2102, so torque needs no cross-ECU sync - just finer dRPM (dense sampling) + regen data.
      sources:
        - "Kia Soul EV VMCU CSV — RPM/torque (signed 16-bit), phase current + resolver offsets (Int16)"
        - "Obsidian: MCU.md"
    - type: decode
