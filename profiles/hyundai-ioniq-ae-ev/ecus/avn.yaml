# ─── AVN (Audio/Video/Navigation) ─────────────────────────────────────
# No live-data DIDs found.
#
# From the "Version info" screen in settings:
# - Platform: Compact Gen5 navigation
# - Model: AEAE.S5ALN.EU
# - Updated: 27.09.2024
# - Software version: AE_EV.EUR.SOP.017.1.240306
# - Firmware version: AE_EV.EUR.0.5.434.220809.MICOM
# - Navigation version: COM5.EUR.HMC.240621.3f75729
# - Device ID: 3391961266
#
# Runs Android (see the XDA forum). The non-navigation unit runs Linux; it looks almost the same
# but is a different unit.
#
# This unit sets:
# - The two cabin preconditioning schedules
# - The two AC charging schedules
# - Station AC charging current (Maximum/Reduced/Minimum)
# - Portable ("granny charger") AC charging current (Maximum/Reduced/Minimum)
# - Default/Eco/Sport profiles (regen level and climate ECO setting)
#
# Connector pinouts: https://gitlab.com/g4933/wideopen/-/wikis/Unit/Pinouts
#
# can_bus: the EU head unit sits on MM-CAN only and reaches the powertrain through the gateway. The
# pinout wiki also lists B-CAN and P-CAN, which fits the US unit.
AVN:
  tx_id: 0x780
  can_bus: [MM-CAN]
  identity:
    alias: IVI # In-Vehicle Infotainment
    description: Audio/Video/Navigation head unit
    serial: "00000076FE0085-003240"
    app_sw: "AE_EV EURSOP 12 017.1"
    id_protocol: UDS  # F1xx (limited — 3 DIDs)
    notes: >-
      Firmware ID 'AE_EV EUR.SOP'. SoC is a Telechips TCC8930 (dual-core Cortex-A9 at 1 GHz plus
      Cortex-M3, Mali-400 MP, 1 GB DDR3, eMMC boot), per the firmware.

  vehicle_states: [PLUGGED, ACC, "ON", READY, CHARGING]
  scan_log: # AVN (head unit)
    - service: 0x22
      range: "0100-010F,B001-B010"
      date: 2026-07-22
      hits: 0
      vehicle_states: [READY]
      notes: All NRC, no timeouts.

  pids: {}

  research:
    - type: verify
      target: "IG3 relay #2 control output"
      status: pending
      priority: P3
      vehicle_states: [PLUGGED, CHARGING]
      created: "2026-10-23"
      updated: "2026-10-23"
      notes: >-
        In US-market wiring the AVN (or the audio unit on cars without navigation) has an 'IG3 relay
        control' pin wired to the IG3 #2 relay coil, the relay for AC-charging power. Related frames
        (research/IONIQ_AVN_FW_FINDINGS.md): the US telematics unit sends an IG3 relay request
        (CF_TMU_IG3RLY, 0x587) and the VCU reports an IG3 relay mode (CF_Vcu_IG3RlyMd, 0x57B). On
        the EU car, with the AVN's always-on MULTIMEDIA fuse (F18, 10 A) pulled and its ACC and IG3
        feeds in place, a stored pre-conditioning schedule still ran on a charger: the schedule
        lives in another module and a scheduled start does not need the head unit. Open: whether the
        head unit closes IG3 #2 in other cases.
      what_to_test:
        - Record IGPM 22BC07, OBC 2101 and BMS 2101 with --keep-all at 1 s across an AC plug-in and across a scheduled charge or pre-conditioning start, with the head unit awake and asleep, and see whether IG3_RELAY_OUTPUT or the OBC state moves with the head unit.
      capture_protocol: >-
        canair monitor IGPM:22BC07 OBC:2101 BMS:2101 --save --keep-all --interval 1 --label 'IG3 #2
        hand-over' --state PLUGGED; press s at plug-in and at any scheduled start.
    - type: decode
      target: head-unit broadcast commands and their P-CAN form
      status: captured
      priority: P2
      vehicle_states: ["ON", READY]
      created: "2026-10-29"
      updated: "2026-10-29"
      result: >-
        The EU head unit sends seven commands on MM-CAN (ioniq-avn-fw); the gateway re-encodes them
        onto P-CAN under other IDs, each sent 0.3-4 ms after CGW1 0x541 every cycle. P-CAN 0x57A and
        0x57B come from the VCU itself (an EPCU alone on a bench still sends them). Matched by
        content and timing: MM 0x54F HU_GW_P_05 clock -> P 0x567 (same layout, weekday bit
        included). MM 0x57B HU_EV_P_02 departure schedule -> P 0x55C, echoed byte for byte by the
        VCU on P 0x57A. MM 0x57A HU_EV_P_01 off-peak window and charge mode -> P 0x588, echoed by
        the VCU on P 0x579. The VCU's 0x57B is its status frame (US: VCU10, IG3 relay mode, aircon
        feedback), folded by the gateway into GW_EV_P_02 for the head unit. MM 0x1C0 HU_DATC_PE_00
        -> P 0x5D3 and TMU_GW_PE_01 (MM 0x1B0) -> P 0x5D4, both 1 s gateway frames (opendbc C-CAN
        IDs); only the activity bits survive, moved to byte 0 (0x5D3: voice-recognition, phone,
        blower-noise control; 0x5D4: IVR and phone). Both read 0F on uhi22's car; the EU car has no
        telematics unit, so its 0x5D4 0F is a gateway default. Unresolved: HU_EV_PE_00 (MM 0x1AA:
        drive-mode climate limits, regen levels, max speed, charge-current modes) -> P 0x5DF or
        0x5B3; HU_GW_P_03/04 (MM 0x54D/0x54E nav road type and distance) -> P 0x55F/0x561 (100 ms,
        all zero with no route).
      notes: >-
        The head unit sends no cabin setpoint or climate start of its own: HVAC only gets the 0x5D3
        activity hints, and departure preconditioning runs through the VCU, which holds the
        schedule. The immediate remote-climate command HU_GW_P_00 is dropped by the EU MICOM
        (ioniq-avn-fw §7B). Check the 0x5D3 layout: a phone call or voice command should change byte
        0 bits 0-3. General gateway conversion: see the IGPM research entry on gateway frame
        forwarding.
      sources:
        - "ioniq-avn-fw (EU LG firmware: com.lge.ivi compose/parse, MICOM CAN tables); uhi22 Ioniq28 P-CAN logs and EPCU bench log; projectgus Kona bench; Kona EV P-CAN sheet; 2026-10-29"
      what_to_test:
        - "With a P-CAN tap: change one setting at a time in the head unit (charge current station/portable, each drive mode's regen level and climate limit, the off-peak window, each departure slot, an active navigation route) and see which P-CAN frame changes; this settles 0x5DF vs 0x5B3, 0x55F/0x561 and 0x5D3."
