# ─── ADM (Assist Door Module) ─────────────────────────────────────────
# Assist (passenger) door module at 0x7A2. Part: 93575G2160
ADM:
  tx_id: 0x7A2
  can_bus: [B-CAN]
  identity:
    description: Assist Door Module
    part_number: "93575G2160"
    mfg_date: "2017-06-05"
    hw_version: "100"
    sw_version: "100"
    id_protocol: UDS  # F1xx (same pattern as DDM)
    notes: >-
      Assist (front passenger) door module. No readable live-data DIDs found. Answers F187, F18B,
      F100, F193 and F195. For any other F1xx DID it repeats its previous reply, so F101, F194 and
      F196 only look like answers (READY, 2026-11-03).
    boot_sw: "170"
  vehicle_states: [PLUGGED, ACC, "ON", READY, CHARGING]
  scan_log:
    - service: 0x22
      range: "0101-010F,B001-B010,C101-C10F"
      date: 2026-07-22
      hits: 0
      vehicle_states: [READY]
      notes: "No live-data DIDs found."
  pids: {}
