# Hyundai Ioniq Electric (AE) — capture/monitor selector groups
#
# A group is a named list of ECU / ECU:PID selectors, used with the `@` sigil and composable
# with ad-hoc selectors:
#
#   canair monitor @charging                 # BMS:2101 BMS:2105 OBC:2101 VCU:2101 …
#   canair monitor @driving HVAC:2201A0      # a group plus an extra selector
#   canair read @powertrain --save --label "…" --state "READY, DRIVING"
#
# Name PIDs explicitly: a bare ECU expands to every non-static, non-ignored PID, drafts
# included, which lengthens the poll cycle. monitor/read poll every member once per cycle, so a
# group's frame cost sets the cycle time (the AutoPID `period` in ecus/ is separate).
# Edit with `canair groups`.

groups:
  # BMS:2101 = charge power + SOC_BMS, BMS:2105 = SOC_DISP (dash SoC); OBC:2101 is the AC side
  # (idle on DC), AAF:2181 carries AAF_2181_B27 (7 while charging). CCM is not included: its
  # live charging values are broadcast frames (signals/powertrain.yaml), not DIDs.
  charging:
    description: SoC, charge power, OBC and charge-state flags while plugged in (AC or DC)
    members: [IGPM:22BC07, BMS:2101, BMS:2105, OBC:2101, VCU:2101, MCU:2101, AAF:2181]

  # IGPM is limited to the ignition/lights page (22BC03) and the brake/turn-signal page
  # (22BC06).
  driving:
    description: Powertrain + chassis while driving (odometer on CLU)
    members:
      [IGPM:22BC03, IGPM:22BC06, BMS:2101, BMS:2105, VCU:2101, VCU:2102, MCU:2101, MCU:2102,
       EPS:220101, ESC:22C101, CLU:22B002, AAF:2180, AAF:2181, HVAC:2201A1]

  powertrain:
    description: HV drive-core essentials (pack power, vehicle state, motor torque, cooling system)
    members: [BMS:2101, VCU:2101, VCU:2102, MCU:2101, MCU:2102, AAF:2180, AAF:2181]

  climate:
    description: Climate power / heat-pump / active air flap
    members: [HVAC:220100, HVAC:220102, HVAC:2201A0, HVAC:2201A1, HVAC:2201A2, VCU:2102, BMS:2101, AAF:2180, AAF:2181]

  body:
    description: Body / gateway / smart-key comfort modules
    members: [IGPM, BCM, SKM]

  # status: slow PIDs, so a bare-ECU sweep skips them and the device polls them every 5 min.
  # The heaviest reads in the profile (41 frames together); they change only when a cycle
  # ends. Use as a one-shot after parking or unplugging: `canair read @last --save …`.
  last:
    description: Previous drive/charge cycle records (21F2); changes only when a cycle ends
    members: [BMS:21F2, MCU:21F2, VCU:21F2]

  # 34 frames per cycle.
  battery:
    description: 'All BMS pages: cell voltages, temperatures, SoC'
    members: [BMS:2101, BMS:2102, BMS:2103, BMS:2104, BMS:2105]

  # --- More useful sets (uncomment to enable) --------------------------------
  # charging-dc:
  #   description: DC fast-charge picture incl. CCM live session status
  #   members: [IGPM:22BC07, BMS:2101, BMS:2105, VCU:2101, MCU:2101, AAF:2181, CCM:22CC01]
  # 12v:                        # LDC / 12V-rail / aux-battery-voltage cross-refs
  #   description: LDC / 12V rail / aux-battery-voltage cross-references
  #   members: [OBC:2101, VCU:2102, AAF:2180]
  # motion:                     # wheel speed / steering / vehicle speed / odometer
  #   description: Wheel speed / steering angle / vehicle speed / odometer
  #   members: [ESC, EPS, CLU, VCU:2101]
  # adas:                       # driver-assist cameras + radar
  #   description: Driver-assist cameras and radar
  #   members: [MFC, SCC, BSD-L, BSD-R, RCAM]
