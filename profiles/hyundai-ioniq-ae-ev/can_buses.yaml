# Hyundai Ioniq Electric (AE) — physical CAN bus segment vocabulary
#
# Codes accepted by each ECU's `can_bus:` field (set with `canair pids set-can-bus`). The
# gateway (IGPM) bridges the segments. `bitrate` is in bit/s: D-CAN (500 kbit/s) and MM-CAN
# (100 kbit/s) are confirmed; the rest are the standard Hyundai figures (500 kbit/s high-speed
# segments, 100 kbit/s B-CAN).

can_buses:
  ALL:
    name: All segments
    description: >-
      The gateway (IGPM) bridges every segment except the private ones (CLIMATE-CAN); the OBD-II
      port connects to it over D-CAN.
  B-CAN:
    name: Body CAN
    description: Comfort/body electronics (doors, seats, BCM, smart key).
    bitrate: 100000
  P-CAN:
    name: Powertrain CAN
    description: High-voltage/drivetrain control (BMS, VMCU/MCU, VESS).
    bitrate: 500000
  C-CAN:
    name: Chassis CAN
    description: Chassis/ADAS (cluster, cameras, cruise/braking assist).
    bitrate: 500000
  MM-CAN:
    name: Multimedia CAN
    description: Infotainment/audio (head unit, amplifier).
    # From the AVN head unit's MICOM firmware: its RS-CAN controller runs at 400 CAN-clock
    # periods per bit off a 40 MHz clock. The Kia Soul EV community matrix's `M_CAN` sheet is
    # also 100 kb/s and shares 18 arbitration IDs with this firmware's tables.
    bitrate: 100000
  D-CAN:
    name: Diagnostic CAN
    description: Diagnostic bus (D-CAN) exposed on the OBD-II port for UDS/KWP2000 requests.
    bitrate: 500000
  CLIMATE-CAN:
    name: Climate CAN
    private: true
    description: >-
      Private link between the A/C control module (DATC), the electric A/C compressor and the PTC
      heater, on separate DATC pins from its P-CAN connection. Neither the gateway (IGPM) nor the
      OBD-II port is on it, so the compressor and heater are not expected to answer on the OBD-II
      port. Bit rate unknown. From US-market wiring; unconfirmed on the EU car.
