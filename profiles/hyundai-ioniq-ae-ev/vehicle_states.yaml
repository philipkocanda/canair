# Hyundai Ioniq Electric (AE) — vehicle operating states
#
# The capture-session state vocabulary. Edit with `canair states`. A `when:` predicate
# auto-suggests the state from decoded ECU.PARAM values at save time (and with
# `canair captures uds --backfill-states`); every matching predicate contributes, so a
# session is composite (e.g. READY + PARKED).
#
# `implies:` names the broader states a state specializes: DRIVING implies READY,
# CHARGING implies PLUGGED, READY implies ON, ON implies ACC, TOPUP implies
# PARKED, and READY, CHARGING and TOPUP each imply IG3. Both readings stay true (a
# recorded session keeps every state it was in), but a view that must name one (the
# monitor status bar) names the most specific, so driving reads DRIVING rather than READY.
#
# Names versus the car: ACC and ON are the owner's manual names for the Start/Stop button
# positions (OFF → ACC → ON, then READY with the brake). ACC is the ACC relay alone; ON is ACC +
# IGN1 + IGN2 energised. ON is written quoted ("ON") because YAML 1.1 reads a bare ON as true.
# IG3 is a separate EV-only supply rail the HV side closes without the button (READY, charging,
# the 12 V top-up, a while after plug-in), so it is its own state rather than a rung of the
# ladder. The ignition-lines table in the ioniq-reverse-engineering skill has the relays, fuses
# and consumers.
#
# Power states and transitions. "press" is the Start/Stop button without the brake; "off" is
# SLEEP once the ECUs have timed out (canair has no separate OFF state).
#
#   Ignition ladder (the button):
#
#                 press            press            press
#      SLEEP -----------> ACC -----------> "ON" -----------> off
#        |                 |                 |
#        +- brake + press -+-----------------+-------> READY ---- press ----> off
#                                                      |   ^
#                                             moving   |   |   stopped
#                                                      v   |
#                                                     DRIVING
#
#   Charge cable (independent of the button; a parked car sleeps with the cable in, so
#   SLEEP + PLUGGED is a normal combination):
#
#               cable in            charge starts
#      (any) -----------> PLUGGED ---------------> CHARGING
#        ^                 |   ^                      |
#        +--- cable out ---+   +---- charge ends -----+
#
#   Parked 12 V top-up (what wakes the VCU is open; see the IGPM research entry):
#
#      SLEEP ---- VCU wakes ----> TOPUP ---- top-up done ----> SLEEP
#
#   The IG3 rail (battery-side ECUs awake) is on in READY, CHARGING and TOPUP. PARKED and
#   DRIVING describe motion and overlay the ladder.

states:
  # BMS 2101 B14 bit 7 (CHARGING) is set for energy flow of either kind (every AC-charging
  # capture, and the DC byte 0xC3); bit 6 (CHARGING_DC) backs it up on DC. One BMS read decides
  # the state. Battery current is not used: it is negative under regen too, while bit 7 reads 0
  # in every moving row.
  - name: CHARGING
    description: HV battery actively charging (AC or DC). Implies plugged.
    implies: [PLUGGED, IG3]
    excludes: [DRIVING]
    when: "BMS.CHARGING == 1 or BMS.CHARGING_DC == 1"

  # VCU 2101 B11:3, verified.
  - name: READY
    description: HV active, car in READY (driveable).
    implies: ["ON", IG3]
    when: "VCU.VEHICLE_STATE_EV_READY == 1"

  # SLEEP and ACC have no positive signal in a stored capture (SLEEP is an absence of
  # replies), so they have no predicate. SLEEP does not exclude PLUGGED: a car left plugged in
  # sleeps with the cable in, and the IGPM's charge-port lock (a PLUGGED input) answers while
  # asleep.
  - name: SLEEP
    description: Deep sleep / 12V standby (unplugged).
    excludes: [READY, ACC, "ON", DRIVING, CHARGING, TOPUP, IG3]
  - name: PLUGGED
    description: Charge cable connected (AC or DC), not necessarily charging.
    when: BMS.AC_CHARGER_CONNECTED == 1 or BMS.CHARGING_DC == 1 or IGPM.CHARGE_PORT_LOCK == 1
  - name: ACC
    description: 'Start/Stop button ACC position (amber LED, one press without the brake): the ACC relay only.'
  - name: "ON"
    description: "Start/Stop button ON position (blue LED, second press without the brake): ACC, IGN1 and IGN2 energised; HV may be off."
    implies: [ACC]
    when: IGPM.IGN1_SWITCH == 1
  - name: PARKED
    description: Stationary, gear in Park.
    when: VCU.GEAR_P == 1 or ESC.GEAR_SELECTOR == 1
  - name: DRIVING
    description: In motion.
    implies: [READY]
    excludes: [PARKED]
    when: ESC.REAL_SPEED_KMH > 0.5 or VCU.VCU_VEHICLE_SPEED > 0.5 or VCU.VCU_VEHICLE_SPEED < -0.5 or EPS.EPS_VEHICLE_SPEED > 0.5 or MCU.MCU_MOTOR_RPM > 100

  # Parked 12 V top-up: car off and locked, HV relay closed, LDC on (seen 2026-10-21 and
  # 2026-10-30). Only the VCU tells it apart: BMS 2101 B14 reads 0x03 as in READY, MCU 2101
  # matches charging, and VCU_POWER_STATE == 1 alone also matches ignition-on standby (LDC off
  # there). Not called "conditioning", which reads as HVAC preconditioning.
  - name: TOPUP
    description: Parked and off, HV relay closed so the LDC can top up the 12V battery.
    implies: [PARKED, IG3]
    excludes: [READY, CHARGING, DRIVING, "ON"]
    when: VCU.VCU_POWER_STATE == 1 and VCU.VEHICLE_STATE_LDC_ENABLED == 1 and VCU.VCU_IGN_ON == 0

  # The meta token for "every state" (the analogue of the ALL CAN-bus code); no predicate.
  - name: ALL
    description: Applicable/readable in every vehicle state.

  # The IG3 supply rail (VCU 2101 VCU_IG3_ON, B11:4, verified): BMS, OBC, MCU, AAF and HVAC
  # answer only while it reads 1. On in READY, charging, the top-up, ignition-on standby and
  # plugged-in idle. ON does not imply it: it is on in all but one transient of the stored
  # ignition-on VCU rows, but the wiring does not show IGN closing it.
  - name: IG3
    description: 'IG3 rail powered: the battery-side ECUs (BMS, OBC, MCU, AAF, HVAC) are awake.'
    when: VCU.VCU_IG3_ON == 1
