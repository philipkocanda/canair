  '0x450':
    name: EV_CP2
    tx_ecu: IGPM
    length: 3
    signals:
      Vanz:
        start_bit: 0
        length: 9
        byte_order: little
        scale: 0.5
        min: 0.0
        max: 255.5
        unit: km/h
        source: US AE EV message table (com.infobank Can2ACsmEV parser); observed on the uhi22 Ioniq28 P-CAN tap and 2022 trace; opendbc CLU11 CF_Clu_Vanz
        notes: "The cluster's displayed speed, CLU11 CF_Clu_Vanz (C-CAN 0x4F1, byte 1 bit 8) re-sent here one byte earlier: byte 0 plus byte 1 bit 0, 0.5 km/h per bit. Against the 0x524 speed over the 2022 trace (n=840 samples above 3 km/h) it reads a median 1.12 times higher (r=0.98, fit 1.2x - 0.9 km/h), as a displayed speed should. Unverified on the owner car."
      SPEED_UNIT:
        start_bit: 21
        length: 1
        byte_order: little
        source: US AE EV message table (com.infobank Can2ACsmEV parser); observed on the uhi22 Ioniq28 P-CAN tap and 2022 trace
        notes: 'Speed unit flag as the US parser places it (byte 2 bit 5). 0 throughout both logs; presumably km/h. The rest of the frame is not decoded: byte 1 reads 0x26 or 0x28 and byte 2 reads 0x04, constant.'
