messages:
  '0x567':
    name: CGW_CLOCK
    tx_ecu: IGPM
    signals:
      clock_hour:
        start_bit: 8
        length: 5
        byte_order: little
        min: 0.0
        max: 23.0
        unit: h
        source: AVN firmware HU_GW_P_05 (com.lge.ivi HuGwP05 compose/parse; ioniq-avn-fw docs/micom/micom-avn-can-signals.tsv); uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 Ioniq28 P-CAN tap
        notes: Hour, byte 1 bits 0-4 (AVN layout).
      clock_minute:
        start_bit: 16
        length: 8
        byte_order: little
        min: 0.0
        max: 59.0
        unit: min
        source: uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 P-CAN tap
      clock_second:
        start_bit: 24
        length: 8
        byte_order: little
        min: 0.0
        max: 59.0
        unit: s
        source: uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 P-CAN tap
        notes: Increments once per second.
      clock_valid:
        start_bit: 32
        length: 1
        byte_order: little
        min: 0.0
        max: 1.0
        source: uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 P-CAN tap
        notes: Clock ready flag (AVN CfTmuRdy, byte 4 bit 0). After ignition-on it reads 0 for ~13 s, while the gateway sends its stored, non-ticking time, then 1 once the head unit's time is in.
      clock_weekday:
        start_bit: 1
        length: 7
        byte_order: little
        min: 0.0
        max: 127.0
        source: AVN firmware HU_GW_P_05 (com.lge.ivi HuGwP05 compose/parse; ioniq-avn-fw docs/micom/micom-avn-can-signals.tsv); observed on the uhi22 Ioniq28 P-CAN tap
        notes: 'Day-of-week bitmask, one bit set (byte 0 bits 1-7): bit 0 of the field Monday ... bit 6 Sunday. Matches the recording dates of the uhi22 logs (0x40 Saturday, 0x20 Friday). After ignition-on the gateway sends the last time it received, not ticking, until the head unit''s time takes over (~10 s).'
  '0x5D0':
    name: EV_CP1
    tx_ecu: IGPM
    signals:
      ODOMETER:
        start_bit: 0
        length: 24
        byte_order: little
        scale: 0.1
        min: 0.0
        max: 800000.0
        unit: km
        source: uhi22 Ioniq28 DBC uwe5D0_ODO; US AE EV message table EV_CP1 (com.infobank Can2ACsmEV.parseEV_CP1); opendbc hyundai_2015_ccan.dbc CLU12; observed on the uhi22 P-CAN tap and 2022 trace
        notes: "The cluster's odometer (CLU12 CF_Clu_Odometer, C-CAN 0x5B0) re-sent by the gateway on P-CAN in the same layout: 24-bit LE x0.1 km. Reads 123,385.0 km in the 2025 logs, 80,125.5 km in the 2022 trace. Not the same frame as MM-CAN 0x5D0 (the cluster's CLU_HU_P_00)."
  '0x541':
    name: CGW1
    tx_ecu: IGPM
    signals:
      CF_Gway_IGNSw:
        start_bit: 0
        length: 3
        byte_order: little
        min: 0.0
        max: 7.0
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: Ignition switch, 3-bit. Reads 3 (ON) throughout the uhi22 drive and ready logs, as on the Kona bench.
      CF_Gway_DriveTypeOption:
        start_bit: 43
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: 'Meaning unknown; opendbc gives no value table and lists only CLU, IBOX and LDWS_LKAS as receivers. Reads 0 on the uhi22 Ioniq (left-hand drive) and 1 on the projectgus Kona bench (right-hand drive).'
      CF_Gway_HeadLampLow:
        start_bit: 31
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: Low beam on. Toggles in the uhi22 drive log.
      CF_Gway_LightSwState:
        start_bit: 38
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: Light-switch position (0-3). Reads 3 in the uhi22 drive log.
      CF_Gway_DrvDrSw:
        start_bit: 8
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: "Driver door switch (1 = open). Toggles as the driver gets out in the uhi22 'leave car while drive ready beep' log. DID twin: IGPM 22BC03 DOOR_DRV_OPEN."
      CF_Gway_Ign1:
        start_bit: 58
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: IGN1 rail. Reads 1 throughout both uhi22 logs (ignition on). With CF_Gway_Ign2 it is the byte-7 0x0C the Kona bench labels IGN1+IGN2.
      CF_Gway_Ign2:
        start_bit: 59
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: IGN2 rail. Reads 1 throughout both uhi22 logs (ignition on).
