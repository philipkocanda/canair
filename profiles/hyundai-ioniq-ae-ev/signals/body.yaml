  '0x5D3':
    name: HU_DATC_PE_00
    tx_ecu: IGPM
    length: 8
    signals:
      HU_VRActivity:
        start_bit: 0
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc HU_DATC_PE_00 (0x5D3); AVN firmware HuDatcPe00 (MM-CAN 0x1C0, byte 4 bits 1-0); observed on the uhi22 Ioniq28 P-CAN tap and 2022 trace
        notes: "Head-unit voice-recognition activity. P-CAN 0x5D3 is the gateway's cut-down copy of the head unit's MM-CAN 0x1C0: only the voice, phone and blower-noise fields, moved from byte 4 to byte 0. Reads 3, the head unit's default, in all three logs."
      HU_PhoneActivity:
        start_bit: 2
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc HU_DATC_PE_00 (0x5D3); AVN firmware HuDatcPe00 (byte 4 bits 3-2); observed on the uhi22 Ioniq28 P-CAN tap and 2022 trace
        notes: "Head-unit phone-call activity. Reads 3 throughout (the head unit's default)."
      BlowerNoiseControl:
        start_bit: 4
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc HU_DATC_PE_00 (0x5D3); AVN firmware HuDatcPe00 (byte 4 bits 5-4); observed on the uhi22 Ioniq28 P-CAN tap and 2022 trace
        notes: Blower-noise control request, raised while a call or voice command is active. Reads 0 throughout.
