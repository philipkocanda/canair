messages:
  '0x567':
    name: CGW_CLOCK
    tx_ecu: IGPM
    signals:
      clock_hour:
        start_bit: 8
        length: 5
        byte_order: little
        min: 0.0
        max: 23.0
        unit: h
        source: AVN firmware HU_GW_P_05 (com.lge.ivi HuGwP05 compose/parse; ioniq-avn-fw docs/micom/micom-avn-can-signals.tsv); uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 Ioniq28 P-CAN tap
        notes: Hour, 5 bits (byte 1 bits 0-4) per the AVN layout. Observed 16. The seconds byte ticks once per second, so the frame is a live clock.
      clock_minute:
        start_bit: 16
        length: 8
        byte_order: little
        min: 0.0
        max: 59.0
        unit: min
        source: uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 P-CAN tap
        notes: Observed 0x29=41 min.
      clock_second:
        start_bit: 24
        length: 8
        byte_order: little
        min: 0.0
        max: 59.0
        unit: s
        source: uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 P-CAN tap
        notes: Increments by 1 every ~1 s across the log — the direct proof this frame is the clock.
      clock_valid:
        start_bit: 32
        length: 1
        byte_order: little
        min: 0.0
        max: 1.0
        source: uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 P-CAN tap
        notes: Clock ready flag (AVN CfTmuRdy, byte 4 bit 0). 1 in the 2025 logs. In the 2022 trace from ignition-on it is 0 for the first 12.9 s, while the gateway sends its stored, non-ticking time, and 1 once the head unit's time is in.
      clock_weekday:
        start_bit: 1
        length: 7
        byte_order: little
        min: 0.0
        max: 127.0
        source: AVN firmware HU_GW_P_05 (com.lge.ivi HuGwP05 compose/parse; ioniq-avn-fw docs/micom/micom-avn-can-signals.tsv); observed on the uhi22 Ioniq28 P-CAN tap
        notes: 'Day-of-week bitmask, one bit set: bit 0 of this field Monday ... bit 6 Sunday (byte 0 bits 1-7). Confirmed twice against uhi22''s recording dates: 0x40 (Saturday) in both 2025-02-01 logs, 0x20 (Friday) in the trace started Friday 2022-07-22. In that trace the gateway first sends a stored time that does not tick (18:05:43 for the first 10.5 s, valid flag 0; the log''s own clock reads 18:08:25 at the first frame). The head unit''s time takes over at 10.5 s (seconds jump to 18:08:35, then ticking) and the valid flag is 1 from 12.9 s. So the gateway holds a time it last received; nothing here shows a running clock in the gateway while the car is off.'
  '0x5D0':
    name: EV_CP1
    tx_ecu: IGPM
    signals:
      ODOMETER:
        start_bit: 0
        length: 24
        byte_order: little
        scale: 0.1
        min: 0.0
        max: 800000.0
        unit: km
        source: uhi22 Ioniq28 DBC uwe5D0_ODO; US AE EV message table EV_CP1 (com.infobank Can2ACsmEV.parseEV_CP1); opendbc hyundai_2015_ccan.dbc CLU12; observed on the uhi22 P-CAN tap and 2022 trace
        notes: "The cluster's odometer, CLU12 CF_Clu_Odometer (C-CAN 0x5B0), re-sent by the gateway on P-CAN with the same layout: 24-bit LE x0.1 km. Observed BA D3 12 = 123,385.0 km in the 2025 logs; E7 39 0C = 80,125.5 km in the 2022 trace, which ticks to 80,125.6 km (E8) near the end. Not the same frame as MM-CAN 0x5D0 (the cluster's CLU_HU_P_00: speed, SOC, motor torque). Matches the Kona bench '0x5D0 = only the odometer'. verified:false pending owner-car confirmation."
  '0x541':
    name: CGW1
    tx_ecu: IGPM
    signals:
      CF_Gway_IGNSw:
        start_bit: 0
        length: 3
        byte_order: little
        min: 0.0
        max: 7.0
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: Ignition switch, 3-bit. Observed = 3 (ON) throughout the uhi22 drive and ready logs; confirms the Kona bench 0x541 byte0=0x03. verified:false pending owner-car confirmation.
      CF_Gway_DriveTypeOption:
        start_bit: 43
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: 'Meaning unknown: opendbc gives no value table. Leading guess: left- vs right-hand drive. Evidence: opendbc receivers are CLU, IBOX and LDWS_LKAS (no powertrain or brake modules, which argues against 2WD/4WD); the projectgus Kona bench (Australian, right-hand drive) sets it to 1, the uhi22 Ioniq (German, left-hand drive) reads 0 and never changes. Two cars only, so unproven. Test: a right-hand-drive Ioniq log should read 1.'
      CF_Gway_HeadLampLow:
        start_bit: 31
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: Low-beam on. Observed toggling 0<->1 during the uhi22 drive log — a live, exercised signal.
      CF_Gway_LightSwState:
        start_bit: 38
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: Light-switch position (0-3). Observed = 3 during the uhi22 drive log.
      CF_Gway_DrvDrSw:
        start_bit: 8
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: "Driver door switch (1 = open). Toggles 0-1-0-1-0 in the uhi22 'leave car while drive ready beep' log as the driver gets out. DID twin: IGPM 22BC03 DOOR_DRV_OPEN."
      CF_Gway_Ign1:
        start_bit: 58
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: IGN1 rail. Reads 1 throughout both uhi22 logs (ignition on). With CF_Gway_Ign2 this is the byte-7 0x0C the Kona bench labelled IGN1+IGN2.
      CF_Gway_Ign2:
        start_bit: 59
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: IGN2 rail. Reads 1 throughout both uhi22 logs (ignition on).
