  '0x5D3':
    name: HU_DATC_PE_00
    tx_ecu: IGPM
    length: 8
    signals:
      HU_VRActivity:
        start_bit: 0
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc HU_DATC_PE_00 (0x5D3); AVN firmware HuDatcPe00 (MM-CAN 0x1C0, byte 4 bits 1-0); observed on the uhi22 Ioniq28 P-CAN tap and 2022 trace
        notes: "Head-unit voice-recognition activity. P-CAN 0x5D3 is the gateway's cut-down copy of the head unit's MM-CAN 0x1C0: only voice, phone and blower-noise fields, moved from byte 4 to byte 0 (the air-quality and rear-seat-lock fields do not cross). Reads 3 in every frame of all three logs; 3 is the head unit's default for this field (HuDatcPe00 loadDefaults). Test: a voice command should change it."
      HU_PhoneActivity:
        start_bit: 2
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc HU_DATC_PE_00 (0x5D3); AVN firmware HuDatcPe00 (byte 4 bits 3-2); observed on the uhi22 Ioniq28 P-CAN tap and 2022 trace
        notes: "Head-unit phone-call activity. Reads 3 throughout (the head unit's default). Test: a phone call should change it."
      BlowerNoiseControl:
        start_bit: 4
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc HU_DATC_PE_00 (0x5D3); AVN firmware HuDatcPe00 (byte 4 bits 5-4); observed on the uhi22 Ioniq28 P-CAN tap and 2022 trace
        notes: Blower-noise control request, raised while a call or voice command is active. Reads 0 throughout. The whole byte reads 0F, which a byte-for-byte copy of the head unit's defaults (CF 03 03 00 3F) would not.
  '0x5D4':
    name: TMU_GW_PE_01
    tx_ecu: IGPM
    length: 8
    signals:
      TMU_IVRActivity:
        start_bit: 0
        length: 2
