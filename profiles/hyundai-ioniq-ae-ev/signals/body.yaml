  '0x450':
    name: EV_CP2
    tx_ecu: IGPM
    length: 3
    signals:
      Vanz:
        start_bit: 0
        length: 9
        byte_order: little
        scale: 0.5
        min: 0.0
        max: 255.5
        unit: km/h
        source: US AE EV message table (com.infobank Can2ACsmEV parser); observed on the uhi22 Ioniq28 P-CAN tap and 2022 trace; opendbc CLU11 CF_Clu_Vanz
        notes: "The cluster's displayed speed (CLU11 CF_Clu_Vanz, C-CAN 0x4F1) re-sent one byte earlier: byte 0 plus byte 1 bit 0, 0.5 km/h per bit. Reads a median 1.12x the 0x524 speed (r=0.98, n=840 above 3 km/h), as a displayed speed should."
      SPEED_UNIT:
        start_bit: 21
        length: 1
        byte_order: little
        source: US AE EV message table (com.infobank Can2ACsmEV parser); observed on the uhi22 Ioniq28 P-CAN tap and 2022 trace
        notes: 'Speed unit flag (byte 2 bit 5, per the US parser). 0 throughout both logs. The rest of the frame is not decoded: byte 1 reads 0x26 or 0x28, byte 2 reads 0x04.'
