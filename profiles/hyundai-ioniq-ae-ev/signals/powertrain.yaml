messages:
  '0x386':
    name: WHL_SPD11
    tx_ecu: ESC
    signals:
      WHL_SPD_FL:
        start_bit: 0
        length: 14
        byte_order: little
        scale: 0.03125
        offset: 0.0
        min: 0.0
        max: 511.969
        unit: km/h
        verified: false
        source: 'uhi22 Ioniq28Investigations: IONIQ_PCAN_drive_fwd_neutral_drive_reverse_neutral.csv (fetch: scripts/fetch_can_corpus.py)'
        notes: 'Front-left wheel speed. 0-9.3 km/h in the source log; the four wheel speeds (r0/r2/r4/r6) correlate >=0.985 (n=1678).'
      WHL_SPD_FR:
        start_bit: 16
        length: 14
        byte_order: little
        scale: 0.03125
        unit: km/h
  '0x354':
    name: GEAR_354
    signals:
      GEAR_LEVER:
        start_bit: 40
        length: 4
        byte_order: little
        min: 0.0
        max: 15.0
        verified: false
        source: 'uhi22 Ioniq28Investigations: IONIQ_PCAN_drive_fwd_neutral_drive_reverse_neutral.csv (fetch: scripts/fetch_can_corpus.py)'
        notes: "Gear lever, low nibble of byte 5. P=1, R=2, N=3, D=4: codes 1 and 3 occur only stationary, 2 in the log's reverse phase and 4 in its drive phase."
  '0x331':
    name: TCS_331
    tx_ecu: ESC
    signals:
      WHL_SPD_ESC:
        start_bit: 16
        length: 14
        byte_order: little
        scale: 0.03125
        offset: 0.0
        min: 0.0
        max: 511.969
        unit: km/h
        verified: false
        source: 'uhi22 Ioniq28Investigations: IONIQ_PCAN_drive_fwd_neutral_drive_reverse_neutral.csv (fetch: scripts/fetch_can_corpus.py)'
        notes: ESC/TCS wheel-speed echo (bytes 2-3, 14-bit LE). r=1.00 vs 0x386 WHL_SPD_FL (n=1678). Not in the upstream DBC.
  '0x524':
    name: EPCU_524
    tx_ecu: MCU
    signals:
      EPCU_DC_VOLTAGE:
        start_bit: 0
        length: 9
        byte_order: little
        min: 0.0
        max: 511.0
        unit: V
        source: uhi22 Ioniq28 DBC uwe524_EPCU_voltage; uhi22 EPCU readme (0x524 sent by the MCU's transceiver U9002); uhi22 P-CAN drive log
        notes: EPCU DC voltage, 1 V/bit. Reads 370-373 V in the drive log against 373.5-373.9 V pack voltage on 0x595. The Kona bench reads the same bytes as inverter voltage.
      VEHICLE_SPEED:
        start_bit: 23
        length: 16
        byte_order: big
        scale: 0.00390625
        min: 0.0
        max: 255.0
        unit: km/h
        source: uhi22 Ioniq28 P-CAN tap, drive log (scripts/fetch_can_corpus.py); uhi22 script_VESS_play.js
        notes: Vehicle speed, bytes 2-3 big-endian, 1/256 km/h, unsigned (positive in reverse too). r=0.997 against 0x386 WHL_SPD_FL (n=3327). The VESS takes its speed from this frame.
  '0x595':
    name: BMS_595
    tx_ecu: BMS
    signals:
      BMS_PACK_VOLTAGE:
        start_bit: 48
        length: 16
        byte_order: little
        scale: 0.1
        min: 0.0
        max: 500.0
        unit: V
        source: uhi22 DBC uwe595_UBatt; uhi22 BMS bench capture (BMS_BatteryManagementSystem/Ioniq28-cellvoltages-read-with-CarScanner.txt), BMS 2102-2104 replies in the same 0.8 s; uhi22 Ioniq28 P-CAN drive and leave-car logs
        notes: 'Bench: 332.7 V against 331.84 V summed from the 96 cells read at the same moment (20 mV cell resolution). Car logs: 372.5-373.9 V, 3.88-3.89 V per cell.'
      BMS_PACK_CURRENT:
        start_bit: 32
        length: 16
        byte_order: little
        signed: true
        scale: 0.1
        min: -1000.0
        max: 1000.0
        unit: A
        source: uhi22 DBC uwe595_IBatt; uhi22 Ioniq28 P-CAN drive and leave-car logs
        notes: 'Positive = discharge: 0.9 to 21.8 A, median 1.6 A while creeping at up to 9 km/h. Regen sign not observed.'
      BMS_MIN_CELL_VOLTAGE:
        start_bit: 16
        length: 8
        byte_order: little
        scale: 0.02
        min: 0.0
        max: 5.1
        unit: V
        source: uhi22 BMS bench capture (BMS_BatteryManagementSystem/Ioniq28-cellvoltages-read-with-CarScanner.txt), BMS 2102-2104 replies in the same 0.8 s; uhi22 Ioniq28 P-CAN drive and leave-car logs
        notes: 'Bench: 0xAA = 3.40 V, exactly the lowest of the 96 cells read at the same moment. Car logs: 3.86-3.88 V. Not in the uhi22 DBC.'
      BMS_MAX_CELL_VOLTAGE:
        start_bit: 24
        length: 8
        byte_order: little
        scale: 0.02
        min: 0.0
        max: 5.1
        unit: V
        source: uhi22 BMS bench capture (BMS_BatteryManagementSystem/Ioniq28-cellvoltages-read-with-CarScanner.txt), BMS 2102-2104 replies in the same 0.8 s; uhi22 Ioniq28 P-CAN drive and leave-car logs
        notes: 'Bench: 0xAD = 3.46 V, exactly the highest of the 96 cells read at the same moment. Car logs: 3.88-3.90 V. Not in the uhi22 DBC.'
  '0x596':
    name: BMS_596
    tx_ecu: BMS
    signals:
      BMS_AUX_BATTERY_VOLTAGE:
        start_bit: 8
        length: 8
        byte_order: little
        scale: 0.1
        min: 0.0
        max: 25.5
        unit: V
        source: uhi22 DBC uwe596_1_UKl30; uhi22 BMS bench capture (BMS_BatteryManagementSystem/Ioniq28-cellvoltages-read-with-CarScanner.txt), BMS 2102-2104 replies in the same 0.8 s; uhi22 Ioniq28 P-CAN drive and leave-car logs
        notes: 12 V supply as the BMS sees it. Bench 11.9 V; car logs 14.5-14.6 V in READY (LDC charging).
      BMS_MIN_MODULE_TEMP:
        start_bit: 48
        length: 8
        byte_order: little
        unit: degC
        source: uhi22 DBC uwe596_6_TAkkuL; uhi22 BMS bench capture (BMS_BatteryManagementSystem/Ioniq28-cellvoltages-read-with-CarScanner.txt), BMS 2102-2104 replies in the same 0.8 s; uhi22 Ioniq28 P-CAN drive and leave-car logs
        notes: Bench 22 degC, car logs 2 degC (winter). Unsigned per the uhi22 DBC; no reading below 0 degC observed.
      BMS_MAX_MODULE_TEMP:
        start_bit: 56
        length: 8
        byte_order: little
        unit: degC
        source: uhi22 DBC uwe596_7_TAkkuH; uhi22 BMS bench capture (BMS_BatteryManagementSystem/Ioniq28-cellvoltages-read-with-CarScanner.txt), BMS 2102-2104 replies in the same 0.8 s; uhi22 Ioniq28 P-CAN drive and leave-car logs
        notes: Bench 23 degC, car logs 3 degC.
  '0x5A3':
    name: BMS_5A3
    tx_ecu: BMS
    signals:
      BMS_MAIN_CONTACTOR_CLOSED:
        start_bit: 6
        length: 1
        byte_order: little
        source: projectgus Kona bench_kona.py; uhi22 BMS bench capture (BMS_BatteryManagementSystem/Ioniq28-cellvoltages-read-with-CarScanner.txt), BMS 2102-2104 replies in the same 0.8 s; uhi22 Ioniq28 P-CAN drive and leave-car logs
        notes: Byte 0 reads 0x4F (bit 6 set) in READY in both car logs and 0x0F (bit 6 clear) on the bench, where the BMS ran without closing its contactors. Matches the Kona bench reading of the same bit. The CCM waits for this bit to clear before ending a CCS session.
      CCS_EV_ENERGY_REQUEST:
        start_bit: 8
        length: 16
        byte_order: little
        unit: Wh
        source: uhi22 vehiclesim.py and DIN 70121 logs
        notes: "Energy to full: 28000 Wh x (100 - SOC) % in uhi22's charger logs (20160 Wh at 28 %). Reads 0 in READY. Without 0x5A3 the CCM stops after ContractAuthentication."
      CCS_ENERGY_TRANSFER_TYPE:
        start_bit: 0
        length: 4
        byte_order: little
        min: 0.0
        max: 15.0
        source: CCM firmware DIN 70121 message builders and session state machine (uhi22 code-flash dump, Ghidra); uhi22 vehiclesim.py
        notes: Sent as EVRequestedEnergyTransferType. The CCM waits for 3 (DC_extended, the CCS Combo 2 mode) before ChargeParameterDiscovery. Reads 3 in uhi22's car trace (byte 0 = 0x63) and 0xF on his bench BMS.
  '0x542':
    name: BMS_542
    tx_ecu: BMS
    signals:
      BMS_SOC_DISPLAY:
        start_bit: 0
        length: 8
        byte_order: little
        scale: 0.5
        min: 0.0
        max: 100.0
        unit: '%'
        source: uhi22 DBC uwe542_0_SocDisp; uhi22 BMS bench capture (BMS_BatteryManagementSystem/Ioniq28-cellvoltages-read-with-CarScanner.txt), BMS 2102-2104 replies in the same 0.8 s; uhi22 Ioniq28 P-CAN drive and leave-car logs
        notes: Car logs 83 %. Bench 9 %, with cells at 3.40-3.46 V.
  '0x5E9':
    name: CCM_5E9
    tx_ecu: CCM
    signals:
      CCM_ALIVE:
        start_bit: 0
        length: 1
        byte_order: little
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: Toggles every frame (00/01 in READY in the uhi22 drive log).
      CCM_CHARGE_PROGRESS:
        start_bit: 1
        length: 7
        byte_order: little
        min: 0.0
        max: 127.0
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: 'CCS session stage: 0 idle, 1 charge parameters known, 3 CableCheck, 7 PreCharge, 15 PowerDelivery, 31 CurrentDemand, 63 PowerDeliveryStop, 127 WeldingDetection. After an abort, bit 6 (raw 0x40 in the byte) is set on top of the last stage.'
  '0x5E5':
    name: CCM_5E5
    tx_ecu: CCM
    signals:
      EVSE_MAX_VOLTAGE:
        start_bit: 0
        length: 16
        byte_order: little
        scale: 0.1
        unit: V
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: Charger maximum voltage from ChargeParameterDiscovery.
      EVSE_MAX_CURRENT:
        start_bit: 16
        length: 16
        byte_order: little
        scale: 0.1
        unit: A
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: Charger maximum current.
      EVSE_PRESENT_VOLTAGE:
        start_bit: 32
        length: 16
        byte_order: little
        scale: 0.1
        unit: V
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: Charger output voltage as reported by the charger; the vehicle simulation waits for it to reach battery voltage before ending PreCharge.
      EVSE_PRESENT_CURRENT:
        start_bit: 48
        length: 16
        byte_order: little
        scale: 0.1
        unit: A
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: Charger output current as reported by the charger.
  '0x5E6':
    name: CCM_5E6
    tx_ecu: CCM
    signals:
      CCM_CABLE_CHECK_RUNNING:
        start_bit: 3
        length: 1
        byte_order: little
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: Byte 0 bit 3.
      CCM_CABLE_CHECK_DONE:
        start_bit: 10
        length: 1
        byte_order: little
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: Byte 1 bit 2. The vehicle then requests 1 A at battery voltage on 0x59C to start PreCharge.
      CCM_CURRENT_DEMAND_RUNNING:
        start_bit: 7
        length: 1
        byte_order: little
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: Byte 0 bit 7.
      EVSE_MAX_POWER:
        start_bit: 48
        length: 16
        byte_order: little
        scale: 0.01
        unit: kW
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: 10 W per bit. Two data points only (pyPLC 10 kW, a car trace 82.6 kW).
  '0x5E8':
    name: CCM_5E8
    tx_ecu: CCM
    signals:
      EVSE_STATUS_CODE:
        start_bit: 48
        length: 3
        byte_order: little
        max: 7.0
        source: uhi22 CCM readme; CCM firmware Com TX signal table (uhi22 code-flash dump, Ghidra)
        notes: 'Bits 0-2 of byte 6: the charger''s DIN 70121 EVSEStatusCode (0 NotReady, 1 Ready, 2 Shutdown, 4 IsolationMonitoringActive, 5 EmergencyShutdown, 6 Malfunction). The firmware stops the session on 5 or 6 (stop reason 12) and treats 2 as a charger-requested shutdown. The 0xD0/0xD1 uhi22 saw before an abort are this field (0 or 1) plus CCM_STOP_REASON 10 and CCM_SESSION_STOPPED.'
      EVSE_MIN_CURRENT:
        start_bit: 16
        length: 16
        byte_order: little
        scale: 0.1
        unit: A
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: Two data points only (pyPLC 1 A, a car trace 0).
      EVSE_MIN_VOLTAGE:
        start_bit: 32
        length: 16
        byte_order: little
        scale: 0.1
        unit: V
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; CCM transmits it
        notes: Two data points only (pyPLC 200 V, a car trace 150 V).
      CCM_STOP_REASON:
        start_bit: 51
        length: 4
        byte_order: little
        min: 0.0
        max: 15.0
        source: CCM firmware Com TX signal table (uhi22 code-flash dump, Ghidra); state machine decompiled in Ghidra
        notes: "The CCM's internal reason for ending a CCS session, recorded only when the vehicle did not ask for the stop (0x599 CCS_STOP_REQUEST and 0x57F byte 0 bit 3 both 0). From the firmware: 2 or 3 at the normal end of the session; 5-9 session timers (5 when no specific timer fired); 10 a CCM-side timeout, such as the CCS trigger (0x599 byte 7 bit 0) not set within 4 s; 11 the charger answered a request with a failure ResponseCode; 12 the charger reported EVSE_EmergencyShutdown or EVSE_Malfunction. Also in DID 22CC01 byte 5 and the 22C350 session logs."
      CCM_SESSION_STOPPED:
        start_bit: 55
        length: 1
        byte_order: little
        source: CCM firmware Com TX signal table (uhi22 code-flash dump, Ghidra)
        notes: Latched when the CCM handles a session stop; byte 7 bit 0 is a second latch set the same way.
  '0x599':
    name: BMS_599
    tx_ecu: BMS
    signals:
      CCS_SOC:
        start_bit: 16
        length: 8
        byte_order: little
        scale: 0.5
        min: 0.0
        max: 100.0
        unit: '%'
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; the BMS transmits it (uhi22 BMS readme)
        notes: The CCM sends it to the charger as EVRESSSOC (whole %). Reads 0 in READY in the uhi22 drive log, so it is only filled while a CCS session is wanted.
      CCS_TRIGGER:
        start_bit: 56
        length: 1
        byte_order: little
        source: uhi22 CCM readme and vehiclesim.py; CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 'Byte 7 bit 0: starts SLAC. In the firmware, once a session is armed the CCM waits up to 4 s for this bit and then aborts (internal stop reason 10). With 0x57F, 0x597, 0x5A3 and 0x59C it is all the CCM needs to run a full session.'
      CCS_EV_MAX_CURRENT:
        start_bit: 24
        length: 16
        byte_order: little
        scale: 0.1
        unit: A
        source: uhi22 vehiclesim.py (car trace values) and DIN 70121 logs
        notes: Read by the CCM as a 16-bit value (firmware Com table). The simulation sends 0x07D0 = 200.0 A here, and the CCM sent EVMaximumCurrentLimit 200 A in every session in uhi22's charger logs.
      CCS_EV_MAX_VOLTAGE:
        start_bit: 40
        length: 16
        byte_order: little
        scale: 0.1
        unit: V
        source: uhi22 vehiclesim.py (car trace values) and DIN 70121 logs
        notes: Read by the CCM as a 16-bit value (firmware Com table). The simulation sends 0x1020 = 412.8 V here, exactly the EVMaximumVoltageLimit in uhi22's charger logs.
      CCS_EV_READY:
        start_bit: 0
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra; uhi22 vehiclesim.py
        notes: Copied into DC_EVStatus.EVReady. The vehicle simulation sets it (byte 0 08 -> 09) once the charge parameters are known.
      CCS_EV_CABIN_CONDITIONING:
        start_bit: 1
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: Copied into DC_EVStatus.EVCabinConditioning.
      CCS_EV_RESS_CONDITIONING:
        start_bit: 2
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: Copied into DC_EVStatus.EVRESSConditioning.
      CCS_EV_NO_ERROR:
        start_bit: 3
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra; uhi22 vehiclesim.py
        notes: '1 = no EV fault: the CCM sends EVErrorCode NO_ERROR. At 0 the CCM takes the error code from the first set flag in bits 4-11 and stops the session. Set (byte 0 = 08) throughout the simulated session.'
      CCS_ERR_RESS_TEMP_INHIBIT:
        start_bit: 4
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 'EV fault flag: with CCS_EV_NO_ERROR = 0 and no lower flag set, the CCM sends EVErrorCode 1 (FAILED_RESSTemperatureInhibit). Checked in bit order 4-11, so the lowest set flag wins.'
      CCS_ERR_SHIFT_POSITION:
        start_bit: 5
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 'EV fault flag: with CCS_EV_NO_ERROR = 0 and no lower flag set, the CCM sends EVErrorCode 2 (FAILED_EVShiftPosition). Checked in bit order 4-11, so the lowest set flag wins.'
      CCS_ERR_CONNECTOR_LOCK_FAULT:
        start_bit: 6
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 'EV fault flag: with CCS_EV_NO_ERROR = 0 and no lower flag set, the CCM sends EVErrorCode 3 (FAILED_ChargerConnectorLockFault). Checked in bit order 4-11, so the lowest set flag wins.'
      CCS_ERR_RESS_MALFUNCTION:
        start_bit: 7
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 'EV fault flag: with CCS_EV_NO_ERROR = 0 and no lower flag set, the CCM sends EVErrorCode 4 (FAILED_EVRESSMalfunction). Checked in bit order 4-11, so the lowest set flag wins.'
      CCS_ERR_CURRENT_DIFFERENTIAL:
        start_bit: 8
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 'EV fault flag: with CCS_EV_NO_ERROR = 0 and no lower flag set, the CCM sends EVErrorCode 5 (FAILED_ChargingCurrentdifferential). Checked in bit order 4-11, so the lowest set flag wins.'
      CCS_ERR_VOLTAGE_OUT_OF_RANGE:
        start_bit: 9
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 'EV fault flag: with CCS_EV_NO_ERROR = 0 and no lower flag set, the CCM sends EVErrorCode 6 (FAILED_ChargingVoltageOutOfRange). Checked in bit order 4-11, so the lowest set flag wins.'
      CCS_ERR_SYSTEM_INCOMPATIBLE:
        start_bit: 10
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 'EV fault flag: with CCS_EV_NO_ERROR = 0 and no lower flag set, the CCM sends EVErrorCode 10 (FAILED_ChargingSystemIncompatibility). Checked in bit order 4-11, so the lowest set flag wins.'
      CCS_ERR_NO_DATA:
        start_bit: 11
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 'EV fault flag: with CCS_EV_NO_ERROR = 0 and no lower flag set, the CCM sends EVErrorCode 11 (NoData). Checked in bit order 4-11, so the lowest set flag wins.'
      CCS_BULK_CHARGING_COMPLETE:
        start_bit: 13
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: "Copied into the DIN 70121 message right after DC_EVStatus, with an isUsed flag: in DIN field order, BulkChargingComplete. uhi22's charger logs show BulkChargingComplete going 0 -> 1 in some sessions."
      CCS_CHARGING_COMPLETE:
        start_bit: 14
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 'The field after CCS_BULK_CHARGING_COMPLETE: in DIN field order, ChargingComplete.'
      CCS_STOP_REQUEST:
        start_bit: 15
        length: 1
        byte_order: little
        source: CCM application firmware (uhi22 code-flash dump), Com receive table and DIN 70121 message builder decompiled in Ghidra
        notes: 1 stops the CCS session (with 0x57F byte 0 bit 3, or CCS_EV_NO_ERROR = 0). A session only starts while it reads 0.
      CCS_READY_TO_CHARGE:
        start_bit: 12
        length: 1
        byte_order: little
        source: CCM firmware DIN 70121 message builders and session state machine (uhi22 code-flash dump, Ghidra)
        notes: Sent as ReadyToChargeState in PowerDeliveryReq (forced to 0 in the stop request).
      CCS_RELAYS_CLOSED:
        start_bit: 57
        length: 1
        byte_order: little
        source: CCM firmware DIN 70121 message builders and session state machine (uhi22 code-flash dump, Ghidra); uhi22 vehiclesim.py
        notes: The CCM waits for this bit before starting CurrentDemand. Set when the vehicle has closed its DC charging path (0x599 byte 7 goes 01 -> 03 at PowerDelivery in uhi22's simulation).
      CCS_WELDING_DETECTION_REQ:
        start_bit: 58
        length: 1
        byte_order: little
        source: CCM firmware DIN 70121 message builders and session state machine (uhi22 code-flash dump, Ghidra)
        notes: After the session stop, once CCS_EV_READY is 0, the CCM sends WeldingDetectionReq when this bit is 1; after 1 s without it, it skips to SessionStop.
  '0x59C':
    name: BMS_59C
    tx_ecu: BMS
    signals:
      CCS_TARGET_VOLTAGE:
        start_bit: 16
        length: 16
        byte_order: little
        scale: 0.1
        unit: V
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; the BMS transmits it (uhi22 BMS readme)
        notes: Forwarded 1:1 as EVTargetVoltage. Battery voltage during PreCharge, the maximum (412.8 V in the simulation) during CurrentDemand.
      CCS_TARGET_CURRENT:
        start_bit: 32
        length: 16
        byte_order: little
        scale: 0.1
        unit: A
        source: uhi22 CCM readme (bench session with vehiclesim.py and pyPLC as charger) and vehiclesim.py; the BMS transmits it (uhi22 BMS readme)
        notes: Forwarded 1:1 as EVTargetCurrent with no ramp or rate limit of its own, and no counter or checksum in the frame. The firmware sends 0 instead while any of its fault latches is set. During PreCharge the CCM waits until it reads 0.1-2.0 A. This is the field uhi22's ioniq-chargepower-reducer rewrites to limit DC charging current.
      CCS_FULL_SOC:
        start_bit: 0
        length: 8
        byte_order: little
        scale: 0.5
