# Kia Niro EV / e-Niro (DE) — capture/monitor selector groups
#
# A group is a named, reusable query: a list of ECU or ECU:PID selectors in the shared
# mini-language, recalled on the command line with the `@` sigil and combinable with ad-hoc
# selectors (`canair read` and `canair monitor`):
#
#   canair monitor @charging                 # expands to the group's members
#   canair monitor @driving CLU:22B002       # a group plus an extra selector
#   canair read @powertrain --save --label "…"
#
# Members are plain selectors, never other groups or full mini-language steps, and each
# member's ECU must exist in ecus/. Edit with `canair groups` (add, rm, rename,
# set-description, set-members), for example:
#
#   canair groups add charging BMS OBC --description "SoC / charge power while plugged in"
#   canair groups add driving BMS VMCU MCU --description "Powertrain while driving"
#
# See canlib/schema/groups_schema.yaml and `canair validate groups`.

groups: {}
