# The variants of this car (battery, facelift, market) and their metadata.
# List or edit with `canair variants`. See docs/concepts/variants.md.
variants:
  58kwh:
    name: Ioniq 5 58 kWh (Standard Range, pre-facelift)
    generation: NE
    production: ["2021", "2024"]
    markets: [EU, US]
    battery: {gross_kwh: 58.0, nominal_voltage: 522.7, series_cells: 144, parallel_cells: 2, chemistry: NMC, cell_format: pouch}
    status: seed
    sources:
    - >-
      EVDB, IONIQ 5 Standard Range 2WD/AWD (MY21): 58.0 kWh, 288 pouch cells, 144s2p, NMC, 523 V,
      built 2021-2024: https://ev-database.org/car/1476/Hyundai-IONIQ-5-Standard-Range-2WD
    - >-
      Hyundai Motor Company launch release, 2021-02-22 (58 and 72.6 kWh packs; 77.4 kWh for North
      America):
      https://www.hyundai.com/worldwide/en/newsroom/detail/hyundai-ioniq-5-redefines-electric-mobility-lifestyle-0000000551
    - >-
      Hyundai IONIQ 5 brochure, specifications table (58.0 kWh at 522.7 V, 72.6 kWh at 653.4 V):
      https://www.hyundai.com/content/dam/hyundai/africa/en/data/marketing/brochure/product/ioniq5/EN_Brochure_IONIQ_5.pdf
    - >-
      Hyundai Motor America 2024 IONIQ 5 specifications (58.0 kWh at 522.7 V; 77.4 kWh at 697 V,
      2P192S, SK Innovation):
      https://www.hyundainews.com/assets/documents/original/56233-2024IONIQ5Specs062623.pdf
    - >-
      InsideEVs on the BASTRO Power Station teardown of a 72.6 kWh pack: 30 modules of 12 pouch
      cells, two of 32 module slots empty:
      https://insideevs.com/news/539940/hyundai-ioniq5-battery-pack-opened/
    notes: >-
      Launch Standard Range pack, sold with RWD or AWD (EVDB lists the AWD 2021-2022). 288 cells as
      144 series groups of two (EVDB). The module count is not published; InsideEVs estimates 24
      modules of the 12-cell module seen in the 72.6 kWh teardown, the layout Hyundai states for the
      63 kWh successor. 522.7 V is Hyundai's figure, 144 x 3.63 V. EVDB estimates 54.0 kWh usable.
      Hyundai names the pack by its gross capacity, as this ID does. Cell supplier not stated for
      this pack in the sources checked. No capture from this car yet. A 144S pack spans about
      360-605 V (2.5-4.2 V per cell), mostly below the profile's 450-820 V hv_pack band.
