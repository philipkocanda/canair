      https://dmassets.hyundai.com/is/content/hyundaiautoever/IONIQ_5_Tech_and_Spec_Guidepdf
    notes: >-
      The facelift Standard Range pack (RWD), replacing the 58 kWh pack in the same 144S2P layout
      with higher-capacity cells: 288 cells in 24 modules (Hyundai), 144s2p (EVDB). 523 V is
      Hyundai's figure; EVDB lists 520 V and estimates 60.0 kWh usable. Still built at the time of
      writing (the UK model-year 27 guide), so the window ends at the last year the sources confirm.
      Hyundai's 2026 US guide lists SK Innovation (Hungary) in a row shared with the 84 kWh pack,
      and its Dec 2024 guide lists Hyundai Mobis (the pack maker), so cell_supplier is left unset.
      Like the 58 kWh pack, its 144S range (about 360-605 V) sits mostly below the profile's hv_pack
      band. No capture from this car yet.
