BMS:
  tx_id: 0x7E4
  identity:
    description: Battery Management System
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 220101-0105, 010A-010C, 0111, 0114 (SOC, SOH, cell
      voltages, charge counters). Also polled at 7E4/7EC by OVMS vehicle_hyundai_ioniq5 and the
      wican-fw Ioniq5/6 profile. Part numbers from Hyundai TSB 22-01-094H (2022MY BMS update, event
      892): 375A0-GI150, ROM IDs 4400/4500/4600/4700/4800/5000/5300 updated to 5400, and
      375A0-GI100, ROM IDs 4402/4502/4602/4702/4802 and later
      (https://static.nhtsa.gov/odi/tsbs/2022/MC-10228645-0001.pdf). Useful as identity fingerprints
      if the BMS layout ever differs between them.
  pids:
    220101:
      status: active
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (32 signals). Each expression was evaluated on OBDb's recorded responses
        (up to 591 per signal, model years 2022, 2023, 2024, 2025, 2026, 2027); 17 of 32 signals
        reproduce OBDb's expected value on every one.
      parameters:
        HVBAT_SOC:
          expression: B10/2
          unit: "%"
          ha_class: battery
          min: "0"
          max: "100"
          notes: >-
            OBDb IONIQ5_HVBAT_SOC: HV battery charge, dashboard. 1 of 591 recorded responses
            disagree with OBDb's expected value (e.g. MY2022: 81 where OBDb expects 81.5); OBDb
            clamps to its min/max, and a few recorded frames are corrupt.
        HV_CHARGING:
          expression: B15:7
          min: "0"
          max: "1"
          notes: "OBDb IONIQ5_HV_CHARGING: Charging?"
        RAPID_CHARGE_PORT:
          expression: B15:6
          min: "0"
          max: "1"
          notes: "OBDb IONIQ5_RAPID_CHARGE_PORT: Rapid charge port."
        NORMAL_CHARGE_PORT:
          expression: B15:5
          min: "0"
          max: "1"
          notes: "OBDb IONIQ5_NORMAL_CHARGE_PORT: Normal charge port."
        BMS_MAIN_RELAY:
          expression: B15:0
          min: "0"
          max: "1"
          notes: "OBDb IONIQ5_BMS_MAIN_RELAY: Battery management system main relay."
        BATTERY_CURRENT:
          expression: "[S17:S18]/10"
          unit: A
          ha_class: current
          min: "-3276.8"
          max: "3276.7"
          notes: "OBDb IONIQ5_BATTERY_CURRENT: Battery current."
        BATTERY_DC_VOLTAGE:
          expression: "[B19:B20]/10"
          unit: V
          ha_class: voltage
          min: "0"
          max: "1000"
          notes: "OBDb IONIQ5_BATTERY_DC_VOLTAGE: Battery DC voltage."
        BATTERY_MAX_T:
          expression: S21
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
          notes: "OBDb IONIQ5_BATTERY_MAX_T: Battery max temperature."
        BATTERY_MIN_T:
          expression: S22
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
          notes: "OBDb IONIQ5_BATTERY_MIN_T: Battery min temperature."
        BATTERY_PACK_B01:
          expression: S23
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
          notes: "OBDb IONIQ5_BATTERY_PACK_B01: Battery pack B01."
        BATTERY_PACK_B02:
          expression: S25
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
          notes: "OBDb IONIQ5_BATTERY_PACK_B02: Battery pack B02."
        BATTERY_PACK_B03:
          expression: S26
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
          notes: "OBDb IONIQ5_BATTERY_PACK_B03: Battery pack B03."
        BATTERY_PACK_B04:
          expression: S27
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
          notes: "OBDb IONIQ5_BATTERY_PACK_B04: Battery pack B04."
        BATTERY_PACK_B05:
          expression: S28
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
          notes: "OBDb IONIQ5_BATTERY_PACK_B05: Battery pack B05."
        BATTERY_INLET_T:
          expression: B30-40
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "215"
          notes: "OBDb IONIQ5_BATTERY_INLET_T: Battery inlet temperature."
        MAXIMUM_CELL_VOLTAGE:
          expression: B31/50
          unit: V
          ha_class: voltage
          min: "2.8"
          max: "4.2"
          notes: >-
            OBDb IONIQ5_MAXIMUM_CELL_VOLTAGE: Maximum cell voltage. 6 of 591 recorded responses
            disagree with OBDb's expected value (e.g. MY2023: 0 where OBDb expects 2.8); OBDb clamps
            to its min/max, and a few recorded frames are corrupt.
        MAXIMUM_CELL_VOLTAGE_NO:
          expression: B33
          min: "0"
          max: "255"
          notes: >-
            OBDb IONIQ5_MAXIMUM_CELL_VOLTAGE_NO: Maximum cell voltage no. 2 of 591 recorded
            responses disagree with OBDb's expected value (e.g. MY2025: 69 where OBDb expects 155);
            OBDb clamps to its min/max, and a few recorded frames are corrupt.
        MINIMUM_CELL_VOLTAGE:
          expression: B34/50
          unit: V
          ha_class: voltage
          min: "2.8"
          max: "4.2"
          notes: >-
            OBDb IONIQ5_MINIMUM_CELL_VOLTAGE: Minimum cell voltage. 7 of 591 recorded responses
            disagree with OBDb's expected value (e.g. MY2023: 0 where OBDb expects 2.8); OBDb clamps
            to its min/max, and a few recorded frames are corrupt.
        MINIMUM_CELL_VOLTAGE_NO:
          expression: B35
          min: "0"
          max: "255"
          notes: >-
            OBDb IONIQ5_MINIMUM_CELL_VOLTAGE_NO: Minimum cell voltage no. 1 of 591 recorded
            responses disagree with OBDb's expected value (e.g. MY2022: 175 where OBDb expects 164);
            OBDb clamps to its min/max, and a few recorded frames are corrupt.
        BATTERY_FAN_STATUS:
          expression: B36
          min: "0"
          max: "9"
          notes: "OBDb IONIQ5_BATTERY_FAN_STATUS: Battery fan status."
        BATTERY_FAN_FEEDBACK:
          expression: B37
          unit: Hz
          ha_class: frequency
          min: "0"
          max: "120"
          notes: "OBDb IONIQ5_BATTERY_FAN_FEEDBACK: Battery fan feedback."
        BMS_AUX_BATTERY_VOLTAGE:
          expression: B38/10
          unit: V
          ha_class: voltage
          min: "11"
          max: "14.6"
          notes: >-
            OBDb IONIQ5_AUXILLARY_BATTERY_VOLTAGE: Auxiliary battery voltage. 7 of 591 recorded
            responses disagree with OBDb's expected value (e.g. MY2023: 0 where OBDb expects 11);
            OBDb clamps to its min/max, and a few recorded frames are corrupt.
        CUMULATIVE_CHARGE_CURRENT:
          expression: ((B39 << 24) | (B41 << 16) | (B42 << 8) | B43)/10
          unit: Ah
          min: "0"
          max: "4.29497e+08"
          notes: >-
            OBDb IONIQ5_CUMULATIVE_CHARGE_CURRENT: Cumulative charge current. 1 of 591 recorded
            responses disagree with OBDb's expected value (e.g. MY2025: 408832 where OBDb expects
            8034.3); OBDb clamps to its min/max, and a few recorded frames are corrupt.
        CUMULATIVE_DISCHARGE_CURRENT:
          expression: "[B44:B47]/10"
          unit: Ah
          min: "0"
          max: "4.29497e+08"
          notes: >-
            OBDb IONIQ5_CUMULATIVE_DISCHARGE_CURRENT: Cumulative discharge current. 2 of 591
            recorded responses disagree with OBDb's expected value (e.g. MY2025: 3.25048e+06 where
            OBDb expects 7867.5); OBDb clamps to its min/max, and a few recorded frames are corrupt.
        CUMULATIVE_ENERGY_CHARGED:
          expression: "[B49:B52]/10"
          unit: kWh
          ha_class: energy
          min: "0"
          max: "4.29497e+08"
          notes: >-
            OBDb IONIQ5_CUMULATIVE_ENERGY_CHARGED: Cumulative energy charged. 2 of 591 recorded
            responses disagree with OBDb's expected value (e.g. MY2025: 4.02116e+08 where OBDb
            expects 6008.1); OBDb clamps to its min/max, and a few recorded frames are corrupt.
        CUMULATIVE_ENERGY_DISCHARGED:
          expression: ((B53 << 24) | (B54 << 16) | (B55 << 8) | B57)/10
          unit: kWh
          ha_class: energy
          min: "0"
          max: "4.29497e+08"
          notes: >-
            OBDb IONIQ5_CUMULATIVE_ENERGY_DISCHARGED: Cumulative energy discharged. 2 of 591
            recorded responses disagree with OBDb's expected value (e.g. MY2025: 0 where OBDb
            expects 5705.2); OBDb clamps to its min/max, and a few recorded frames are corrupt.
        BATTERY_WORK_TIME_TOTAL_SEC:
          expression: "[B58:B61]"
          unit: s
          ha_class: duration
          min: "0"
          max: "4.29497e+09"
          notes: >-
            OBDb IONIQ5_BATTERY_WORK_TIME_TOTAL_SEC: Battery work time total. 2 of 591 recorded
            responses disagree with OBDb's expected value (e.g. MY2025: 8.58921e+07 where OBDb
            expects 1.07323e+07); OBDb clamps to its min/max, and a few recorded frames are corrupt.
        BMS_IGNITION:
          expression: B62:2
          min: "0"
          max: "1"
          notes: "OBDb IONIQ5_BMS_IGNITION: Battery management system ignition."
        INVERTER_CAPACITOR_VOLTAGE:
          expression: ((B63 << 8) | B65)
          unit: V
          ha_class: voltage
          min: "0"
          max: "1000"
          notes: >-
            OBDb IONIQ5_INVERTER_CAPACITOR_VOLTAGE: Inverter capacitor voltage. OBDb reads 1000 as
            no data. 2 of 575 recorded responses disagree with OBDb's expected value (e.g. MY2025:
            4881 where OBDb expects 782); OBDb clamps to its min/max, and a few recorded frames are
            corrupt.
        DRIVE_MOTOR_SPEED_1:
          expression: "[S66:S67]"
          unit: rpm
          min: "-32768"
          max: "32767"
          notes: >-
            OBDb IONIQ5_DRIVE_MOTOR_SPEED_1: Drive motor speed 1. 2 of 591 recorded responses
            disagree with OBDb's expected value (e.g. MY2025: 4371 where OBDb expects 0); OBDb
            clamps to its min/max, and a few recorded frames are corrupt.
        DRIVE_MOTOR_SPEED_2:
          expression: "[S68:S69]"
          unit: rpm
          min: "-32768"
          max: "32767"
          notes: >-
            OBDb IONIQ5_DRIVE_MOTOR_SPEED_2: Drive motor speed 2. 2 of 591 recorded responses
            disagree with OBDb's expected value (e.g. MY2025: 4864 where OBDb expects 0); OBDb
            clamps to its min/max, and a few recorded frames are corrupt.
        ISOLATION_RESISTANCE:
          expression: "[B70:B71]"
          unit: kΩ
          min: "0"
          max: "3000"
          notes: >-
            OBDb IONIQ5_ISOLATION_RESISTANCE: Isolation resistance. 2 of 591 recorded responses
            disagree with OBDb's expected value (e.g. MY2025: 14796 where OBDb expects 3000); OBDb
            clamps to its min/max, and a few recorded frames are corrupt.
