BMS:
  tx_id: 0x7E4
  identity:
    description: Battery Management System
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 220101-0105, 010A-010C, 0111, 0114 (SOC, SOH, cell
      voltages, charge counters). Also polled at 7E4/7EC by OVMS vehicle_hyundai_ioniq5 and the
      wican-fw Ioniq5/6 profile. Signals seeded from OBDb keep OBDb's names without the IONIQ5_
      prefix, unless a PID's notes list a rename. Part numbers from Hyundai TSB 22-01-094H (2022MY
      BMS update, event 892): 375A0-GI150, ROM IDs 4400/4500/4600/4700/4800/5000/5300 updated to
      5400, and 375A0-GI100, ROM IDs 4402/4502/4602/4702/4802 and later
      (https://static.nhtsa.gov/odi/tsbs/2022/MC-10228645-0001.pdf).
  pids:
    220101:
      status: active
      min: "0"
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (32 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 591 per signal, model years 2022-2027). Recorded responses that disagree
        with OBDb's expected value, where OBDb clamps to its min/max or the recorded frame is
        corrupt: HVBAT_SOC 1/591, MAXIMUM_CELL_VOLTAGE 6/591, MAXIMUM_CELL_VOLTAGE_NO 2/591,
        MINIMUM_CELL_VOLTAGE 7/591, MINIMUM_CELL_VOLTAGE_NO 1/591, BMS_AUX_BATTERY_VOLTAGE 7/591,
        CUMULATIVE_CHARGE_CURRENT 1/591, CUMULATIVE_DISCHARGE_CURRENT 2/591,
        CUMULATIVE_ENERGY_CHARGED 2/591, CUMULATIVE_ENERGY_DISCHARGED 2/591,
        BATTERY_WORK_TIME_TOTAL_SEC 2/591, INVERTER_CAPACITOR_VOLTAGE 2/575, DRIVE_MOTOR_SPEED_1
        2/591, DRIVE_MOTOR_SPEED_2 2/591, ISOLATION_RESISTANCE 2/591. OBDb names, where canair's
        differ: BMS_AUX_BATTERY_VOLTAGE = IONIQ5_AUXILLARY_BATTERY_VOLTAGE.
      parameters:
        HVBAT_SOC:
          expression: B10/2
          unit: "%"
          category: state_of_charge
          max: "100"
          notes: HV battery charge, dashboard.
        HV_CHARGING:
          expression: B15:7
          max: "1"
        RAPID_CHARGE_PORT:
          expression: B15:6
          max: "1"
        NORMAL_CHARGE_PORT:
          expression: B15:5
          max: "1"
        BMS_MAIN_RELAY:
          expression: B15:0
          max: "1"
          notes: Battery management system main relay.
        BATTERY_CURRENT:
          expression: "[S17:S18]/10"
          unit: A
          min: "-3276.8"
          max: "3276.7"
        BATTERY_DC_VOLTAGE:
          expression: "[B19:B20]/10"
          unit: V
          max: "1000"
        BATTERY_MAX_T:
          expression: S21
          unit: °C
          min: "-40"
          max: "80"
        BATTERY_MIN_T:
          expression: S22
          unit: °C
          min: "-40"
          max: "80"
        BATTERY_PACK_B01:
          expression: S23
          unit: °C
          min: "-40"
          max: "80"
        BATTERY_PACK_B02:
          expression: S25
          unit: °C
          min: "-40"
          max: "80"
        BATTERY_PACK_B03:
          expression: S26
          unit: °C
          min: "-40"
          max: "80"
        BATTERY_PACK_B04:
          expression: S27
          unit: °C
          min: "-40"
          max: "80"
        BATTERY_PACK_B05:
          expression: S28
          unit: °C
          min: "-40"
          max: "80"
        BATTERY_INLET_T:
          expression: B30-40
          unit: °C
          min: "-40"
          max: "215"
        MAXIMUM_CELL_VOLTAGE:
          expression: B31/50
          unit: V
          min: "2.8"
          max: "4.2"
        MAXIMUM_CELL_VOLTAGE_NO:
          expression: B33
          max: "255"
        MINIMUM_CELL_VOLTAGE:
          expression: B34/50
          unit: V
          min: "2.8"
          max: "4.2"
        MINIMUM_CELL_VOLTAGE_NO:
          expression: B35
          max: "255"
        BATTERY_FAN_STATUS:
          expression: B36
          max: "9"
        BATTERY_FAN_FEEDBACK:
          expression: B37
          unit: Hz
          max: "120"
        BMS_AUX_BATTERY_VOLTAGE:
          expression: B38/10
          unit: V
          min: "11"
          max: "14.6"
        CUMULATIVE_CHARGE_CURRENT:
          expression: ((B39 << 24) | (B41 << 16) | (B42 << 8) | B43)/10
          unit: Ah
          max: "4.29497e+08"
        CUMULATIVE_DISCHARGE_CURRENT:
          expression: "[B44:B47]/10"
          unit: Ah
          max: "4.29497e+08"
        CUMULATIVE_ENERGY_CHARGED:
          expression: "[B49:B52]/10"
          unit: kWh
          max: "4.29497e+08"
        CUMULATIVE_ENERGY_DISCHARGED:
          expression: ((B53 << 24) | (B54 << 16) | (B55 << 8) | B57)/10
          unit: kWh
          max: "4.29497e+08"
        BATTERY_WORK_TIME_TOTAL_SEC:
          expression: "[B58:B61]"
          unit: s
          max: "4.29497e+09"
        BMS_IGNITION:
          expression: B62:2
          max: "1"
          notes: Battery management system ignition.
        INVERTER_CAPACITOR_VOLTAGE:
          expression: ((B63 << 8) | B65)
          unit: V
          max: "1000"
          notes: OBDb reads 1000 as no data.
        DRIVE_MOTOR_SPEED_1:
          expression: "[S66:S67]"
          unit: rpm
          min: "-32768"
          max: "32767"
        DRIVE_MOTOR_SPEED_2:
          expression: "[S68:S69]"
          unit: rpm
          min: "-32768"
          max: "32767"
        ISOLATION_RESISTANCE:
          expression: "[B70:B71]"
          unit: kΩ
          max: "3000"
        CHARGE_CURRENT_REQUEST:
          expression: "[B13:B14]/10"
          unit: A
          max: "6553.5"
          source: wican-fw ioniq5-6 (CHARGING_R_A) + OVMS
          source_links:
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/hyundai/ioniq5-6.json
            - https://github.com/openvehicles/Open-Vehicle-Monitoring-System-3/blob/master/vehicle/OVMS.V3/components/vehicle_hyundai_ioniq5/src/hif_can_poll.cpp
          notes: 0 in most recorded replies; up to 331.6 A.
        BATTERY_POWER:
          expression: "[B19:B20]/10*[S17:S18]/10/1000"
          unit: kW
          min: "-600"
          max: "600"
          source: wican-fw ioniq5-6 (HV_W)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/hyundai/ioniq5-6.json
          notes: BATTERY_DC_VOLTAGE x BATTERY_CURRENT; positive = discharging, as OVMS reads it.
