      source: OBDb Hyundai-Ioniq-5; wican-fw ioniq5-6 and OVMS for the signals OBDb lacks
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
        - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/hyundai/ioniq5-6.json
