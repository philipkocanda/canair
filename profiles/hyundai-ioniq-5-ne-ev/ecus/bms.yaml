      source_links:
        - https://github.com/OBDb/Kia-EV6
        - https://github.com/OBDb/Kia-EV9
      verified: false
      notes: >-
        Not in OBDb's Ioniq 5 set, but defined identically for the Kia EV6, Ioniq 6, Genesis GV60
        and Kia EV9. Each expression reproduces OBDb's expected value on its recorded EV6 (28) and
        EV9 (10) responses, a 38-byte reply. Draft until an Ioniq 5 answers it.
      parameters:
        BMS_STATE:
          expression: B5
          min: "0"
          max: "255"
          notes: >-
            OBDb EV6_BMS_STATE: battery management state (an enumeration; OBDb's EV6 set caps it at
            15, its EV9 set at 255).
        HVBAT_WCS_INLET_TEMP:
          expression: S10
          unit: °C
          ha_class: temperature
          min: "-128"
          max: "127"
          notes: >-
            OBDb EV6_HVBAT_WCS_INLET_T: battery temperature at the water cooling system inlet.
        HVBAT_FAN_DUTY:
          expression: B14
          unit: "%"
          min: "0"
          max: "100"
          notes: "OBDb EV6_HVBAT_FAN_DUTY: battery fan duty feedback."
        AC_COMPRESSOR_SPEED:
          expression: B19*20
          unit: rpm
          min: "0"
          max: "5100"
          notes: "OBDb EV6_AC_COMP_RPM: air conditioning compressor speed."
        HVBAT_PRA_TEMP:
          expression: S28*2
          unit: °C
          ha_class: temperature
          min: "-256"
          max: "254"
          notes: "OBDb EV6_HVBAT_PRA_T: battery temperature at the power relay assembly."

