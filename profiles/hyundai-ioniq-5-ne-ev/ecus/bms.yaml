      verified: false
      notes: >-
        HVBAT_SOH, HVBAT_WH and HVBAT_SOC_DISP are OBDb's, checked on its 339 recorded replies
        (model years 2022-2027). The rest are where wican-fw's Ioniq 5/6 profile and OVMS's Ioniq 5
        module read them (the Kona uses the same layout): available charge and discharge power
        (wican-fw REGEN_MAX/POWER_MAX; the recorded maxima of 432 and 535 kW are the Ioniq 5 N's
        rated charge and discharge power), module temperatures 6-16, which continue 220101's
        BATTERY_PACK_B01-B05, the cell-voltage deviation, the battery heater temperature and the
        deterioration cell numbers. Each is plausible on the recorded replies but none is checked
        against a known value. OVMS reads B37:B38 as the minimum cell deterioration (/10 %); the
        recorded values make that 2,000-4,000 %, so OBDb's remaining energy (HVBAT_WH) is kept.
      parameters:
        HVBAT_SOH:
          expression: "[B34:B35]/10"
          unit: "%"
          category: state_of_health
          min: "0"
          max: "100"
          notes: HV battery state of health. OBDb reads 0 as no data.
        HVBAT_WH:
          expression: "[B37:B38]*2/1000"
          unit: kWh
          min: "0"
          max: "131.07"
