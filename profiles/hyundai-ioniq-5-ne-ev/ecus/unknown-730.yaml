Unknown-730:
  tx_id: 0x730
  identity:
    description: Unidentified ECU at 0x730 (wheel speeds, steering angle, yaw, accelerations)
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 22F010 carries high-resolution wheel speeds,
      steering angle, yaw rate and lateral/longitudinal acceleration (OBDb types it
      driverAssistance). Which module answers here is not established; promote it with `canair ecu
      Unknown-730 rename` once an identity read names it. Signals seeded from OBDb keep OBDb's names
      without the IONIQ5_ prefix, unless a PID's notes list a rename.
  pids:
    22F010:
      status: active
      min: "0"
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (8 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 107 per signal, model years 2022-2027).
      parameters:
        WHEEL_FR_VSS_HD:
          expression: ((B11 << 8) | B10)/32
          unit: km/h
          ha_class: speed
          max: "2047"
          notes: Front right wheel speed, high resolution.
        WHEEL_FL_VSS_HD:
          expression: ((B13 << 8) | B12)/32
          unit: km/h
          ha_class: speed
          max: "2047"
          notes: Front left wheel speed, high resolution.
        WHEEL_RR_VSS_HD:
          expression: ((B15 << 8) | B14)/32
          unit: km/h
          ha_class: speed
          max: "2047"
          notes: Rear right wheel speed, high resolution.
        WHEEL_RL_VSS_HD:
          expression: ((B18 << 8) | B17)/32
          unit: km/h
          ha_class: speed
          max: "2047"
          notes: Rear left wheel speed, high resolution.
        STEERING_ANGLE:
          expression: ((S20 << 8) | B19)/10
          unit: °
          min: "-3276.8"
          max: "3276.7"
          notes: Steering wheel angle.
        LATERAL_ACCELERATION:
          expression: ((B22 << 8) | B21)*8.354/65535-4.177
          unit: m/s²
          min: "-4.177"
          max: "4.177"
        LONGITUDINAL_ACCELERATION:
          expression: ((B25 << 8) | B23)*8.354/65535-4.177
          unit: m/s²
          min: "-4.177"
          max: "4.177"
        YAW_RATE:
          expression: B26/200
          unit: °
          max: "1.275"
