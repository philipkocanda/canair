HVAC:
  tx_id: 0x7B3
  identity:
    description: Climate control (A/C control module)
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 220100-0102 (cabin, ambient, evaporator, coolant
      temperatures). Polled at 7B3/7BB by OVMS. Signals seeded from OBDb keep OBDb's names without
      the IONIQ5_ prefix, unless a PID's notes list a rename.
  pids:
    220100:
      status: active
      unit: °C
      ha_class: temperature
      min: "-40"
      max: "87.5"
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (7 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 249 per signal, model years 2022-2027). OBDb names, where canair's differ:
        HVAC_VEHICLE_SPEED = IONIQ5_VSS.
      parameters:
        HVAC_IAT:
          expression: B11/2-40
          notes: Interior temperature, front.
        HVAC_AAT:
          expression: B12/2-40
          notes: Outdoor temperature.
        HVAC_EVAPORATOR_T:
          expression: B13/2-40
        HVAC_HUMIDITY_SENSOR_FOR_AUTOMATIC_DEFOGGER:
          expression: B34
          unit: "%"
          ha_class: ""
          min: "0"
          max: "100"
        HVAC_IAT_DRIVER_VENT:
          expression: B36/2-40
          notes: Interior temperature, driver vent.
        HVAC_IAT_DRIVER_LEGS_VENT:
          expression: B37/2-40
          notes: Interior temperature, driver legs vent.
        HVAC_VEHICLE_SPEED:
          expression: B38
          unit: km/h
          ha_class: speed
          min: "0"
          max: "255"
    220101:
      status: active
      unit: °C
      ha_class: temperature
      min: "-40"
      max: "87.5"
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (2 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 53 per signal, model years 2022-2027).
      parameters:
        HVAC_IAT_PASSENGER_VENT:
          expression: B14/2-40
          notes: Interior temperature, passenger vent.
        HVAC_IAT_PASSENGER_LEGS_VENT:
          expression: B15/2-40
          notes: Interior temperature, passenger legs vent.
    220102:
      status: active
      unit: °C
      ha_class: temperature
      min: "-40"
      max: "87.5"
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (2 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 44 per signal, model years 2022-2027).
      parameters:
        HVAC_COOLANT_T:
          expression: B10/2-40
        HVAC_INVERTER_T:
          expression: B19/2-40
