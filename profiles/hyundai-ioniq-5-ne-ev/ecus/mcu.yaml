MCU:
  tx_id: 0x7E3
  identity:
    description: Motor Control Unit (traction inverter)
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 22E001 (motor rpm, torque, inverter and motor
      temperature; MY2021-2024 only), 22E009 (electric water and oil pumps). OVMS labels the 7EB
      reply MCU. Which inverter answers here on AWD cars (front or rear) is not established. Signals
      seeded from OBDb keep OBDb's names without the IONIQ5_ prefix, unless a PID's notes list a
      rename.
  pids:
    "22E001":
      status: active
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (8 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 237 per signal, model years 2022-2024). OBDb applies this layout to model
        years up to 2024 only.
      parameters:
        IGN_VOLTAGE:
          expression: ((B23 << 8) | B22)*10/10000
          unit: V
          min: "0"
          max: "65.535"
          notes: Ignition voltage.
        MOTOR_RPM:
          expression: ((S26 << 8) | B25)
          unit: rpm
          min: "-32768"
          max: "32767"
        NOMINAL_TORQUE_VALUE:
          expression: ((S28 << 8) | B27)/10
          unit: Nm
          min: "-3276.8"
          max: "3276.7"
        MOTOR_ACTUAL_TORQUE:
          expression: ((S30 << 8) | B29)/10
          unit: Nm
          min: "-3276.8"
          max: "3276.7"
        MOTOR_PHASE_CURRENT_RMS:
          expression: ((B33 << 8) | B31)/10
          unit: A
          min: "0"
          max: "6553.5"
        MOTOR_T:
          expression: ((S35 << 8) | B34)/100
          unit: °C
          min: "-327.68"
          max: "327.67"
        INVERTER_T:
          expression: ((S37 << 8) | B36)/100
          unit: °C
          min: "-327.68"
          max: "327.67"
        HEAT_SINK_T:
          expression: ((S70 << 8) | B69)/100
          unit: °C
          min: "-327.68"
          max: "327.67"
    "22E009":
      status: active
      min: "0"
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (8 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 145 per signal, model years 2022-2027).
      parameters:
        EWP_CURRENT_DC:
          expression: B13/10
          unit: A
          max: "25.5"
          notes: Electric water pump, current DC.
        EWP_VOLTAGE_DC:
          expression: B14/10
          unit: V
          max: "25.5"
          notes: Electric water pump, voltage DC.
        EWP_COMMANDED_ROTATION_SPEED:
          expression: B18*24
          unit: rpm
          max: "6120"
          notes: Electric water pump, commanded rotation speed.
        EWP_ACTUAL_ROTATION_SPEED:
          expression: B19*24
          unit: rpm
          max: "6120"
          notes: Electric water pump, actual rotation speed.
        EOP_ACTUAL_SPEED:
          expression: B21*20
          unit: rpm
          max: "5100"
          notes: Electric oil pump, actual speed.
        EOP_COMMANDED_SPEED:
          expression: B27*20
          unit: rpm
          max: "5100"
          notes: Electric oil pump, commanded speed.
        EOP_CURRENT_DC:
          expression: B30
          unit: A
          max: "255"
          notes: Electric oil pump, current DC.
        EOP_CURRENT_IQ:
          expression: B31
          unit: A
          max: "255"
          notes: Electric oil pump, current IQ.
