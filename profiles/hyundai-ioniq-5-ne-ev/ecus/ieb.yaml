IEB:
  tx_id: 0x7D1
  identity:
    description: Integrated Electronic Brake (brake booster with ABS/ESC)
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 220104 (four wheel speeds). 0x7D1 is the Hyundai
      ABS/ESC address; on the NE that function sits in the IEB unit (GDS lists it under ABS/ESC, TSB
      24-01-064H-1). That this unit is the 7D1 responder is inferred, not read from an identity DID.
      Signals seeded from OBDb keep OBDb's names without the IONIQ5_ prefix, unless a PID's notes
      list a rename.
  pids:
    220104:
      status: active
      unit: km/h
      min: "0"
      max: "255"
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (4 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 138 per signal, model years 2022-2026).
      parameters:
        WHEEL_FL_VSS:
          expression: B17
          notes: Front left wheel speed.
        WHEEL_FR_VSS:
          expression: B18
          notes: Front right wheel speed.
        WHEEL_RL_VSS:
          expression: B19
          notes: Rear left wheel speed.
        WHEEL_RR_VSS:
          expression: B20
          notes: Rear right wheel speed.
