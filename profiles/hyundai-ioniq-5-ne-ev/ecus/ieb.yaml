IEB:
  tx_id: 0x7D1
  identity:
    description: Integrated Electronic Brake (brake booster with ABS/ESC)
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 220104 (four wheel speeds). 0x7D1 is the Hyundai
      ABS/ESC address; on the NE that function sits in the IEB unit (GDS lists it under ABS/ESC, TSB
      24-01-064H-1). That this unit is the 7D1 responder is inferred, not read from an identity DID.
