VCMS:
  tx_id: 0x744
  identity:
    description: Vehicle Charging Management System
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 22E001-E004 (charge states, EVSE limits, control
      pilot and proximity, inlet temperatures, 400 V relay); OBDb names two of its signals *_VCMS.
      The NE has a VCMS module (TSB 23-EV-003H).
  pids:
    "22E001":
      status: active
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (10 signals). Each expression was evaluated on OBDb's recorded responses
        (up to 188 per signal, model years 2022, 2023, 2024, 2025, 2026); 10 of 10 signals reproduce
        OBDb's expected value on every one.
      parameters:
        VCMS_AUX_BATTERY_VOLTAGE:
          expression: "[B18:B19]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "655.35"
          notes: "OBDb IONIQ5_AUX_BATTERY_VOLTAGE: Auxiliary battery voltage."
        DC_CHRG_STATE:
          expression: B25:3
          min: "0"
          max: "1"
          notes: "OBDb IONIQ5_DC_CHRG_STATE: DC charging state."
        AC_CHRG_STATE:
          expression: B25:2
          min: "0"
          max: "1"
          notes: "OBDb IONIQ5_AC_CHRG_STATE: AC charging state."
        OBC_CHRG_DC_VOLTAGE:
          expression: "[B27:B28]/10"
          unit: V
          ha_class: voltage
          min: "0"
          max: "6553.5"
          notes: "OBDb IONIQ5_OBC_CHRG_DC_VOLTAGE: On-board charger, charging DC voltage."
        OBC_CHRG_DC_CURRENT:
          expression: "[B29:B30]/10"
          unit: A
          ha_class: current
          min: "0"
          max: "6553.5"
          notes: "OBDb IONIQ5_OBC_CHRG_DC_CURRENT: On-board charger, charging DC current."
        OBC_CHRG_AC_CURRENT:
          expression: ((B31 << 8) | B33)/10
          unit: A
          ha_class: current
          min: "0"
          max: "6553.5"
          notes: "OBDb IONIQ5_OBC_CHRG_AC_CURRENT: On-board charger, charging AC current."
        OBC_CHRG_AC_VOLTAGE:
          expression: B34
          unit: V
          ha_class: voltage
          min: "0"
          max: "255"
          notes: "OBDb IONIQ5_OBC_CHRG_AC_VOLTAGE: On-board charger, charging AC voltage."
        OBC_DCHRG_DC_CURRENT:
          expression: B35
          unit: A
          ha_class: current
          min: "0"
          max: "255"
          notes: "OBDb IONIQ5_OBC_DCHRG_DC_CURRENT: On-board charger, discharging DC current."
        OBC_DCHRG_AC_CURRENT:
          expression: B36
          unit: A
          ha_class: current
          min: "0"
          max: "255"
          notes: "OBDb IONIQ5_OBC_DCHRG_AC_CURRENT: On-board charger, discharging AC current."
        ESTIMATED_CHRG_POWER:
          expression: "[B37:B38]*10-50"
          unit: W
          ha_class: power
          min: "-50"
          max: "655300"
          notes: "OBDb IONIQ5_ESTIMATED_CHRG_POWER: Estimated charging power."
    "22E002":
      status: active
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (10 signals). Each expression was evaluated on OBDb's recorded responses
        (up to 44 per signal, model years 2022, 2023, 2024, 2025, 2026); 10 of 10 signals reproduce
        OBDb's expected value on every one.
      parameters:
        EVSE_MAXIMUM_VOLTAGE_VALUE:
          expression: ((B15 << 8) | B17)/10
          unit: V
          ha_class: voltage
          min: "0"
          max: "6553.5"
          notes: >-
            OBDb IONIQ5_EVSE_MAXIMUM_VOLTAGE_VALUE: Electric vehicle supply equipment, voltage, max.
        EVSE_MAXIMUM_CURRENT_VALUE:
          expression: "[B18:B19]/10"
          unit: A
          ha_class: current
          min: "0"
          max: "6553.5"
          notes: >-
            OBDb IONIQ5_EVSE_MAXIMUM_CURRENT_VALUE: Electric vehicle supply equipment, current, max.
        EVSE_MINIMUM_VOLTAGE_VALUE:
          expression: "[B20:B21]/10"
          unit: V
          ha_class: voltage
          min: "0"
          max: "6553.5"
          notes: >-
            OBDb IONIQ5_EVSE_MINIMUM_VOLTAGE_VALUE: Electric vehicle supply equipment, voltage, min.
        EVSE_MINIMUM_CURRENT_VALUE:
          expression: "[B22:B23]/10"
          unit: A
          ha_class: current
          min: "0"
          max: "6553.5"
          notes: >-
            OBDb IONIQ5_EVSE_MINIMUM_CURRENT_VALUE: Electric vehicle supply equipment, current, min.
        EVSE_V:
          expression: "[B25:B26]/10"
          unit: V
          ha_class: voltage
          min: "0"
          max: "6553.5"
          notes: "OBDb IONIQ5_EVSE_V: Electric vehicle supply equipment, voltage."
        EVSE_C:
          expression: "[B27:B28]/10"
          unit: A
          ha_class: current
          min: "0"
          max: "6553.5"
          notes: "OBDb IONIQ5_EVSE_C: Electric vehicle supply equipment, current."
        EVSE_CURRENT_REGULATION_TOLERANCE_VALUE:
          expression: B30-50
          unit: A
          ha_class: current
          min: "-50"
          max: "205"
          notes: >-
            OBDb IONIQ5_EVSE_CURRENT_REGULATION_TOLERANCE_VALUE: Electric vehicle supply equipment,
            regulation tolerance.
        EVSE_DELIVERED_POWER_VALUE:
          expression: ((B31 << 8) | B33)*10/1000
          unit: kWh
          ha_class: energy
          min: "0"
          max: "655.35"
          notes: >-
            OBDb IONIQ5_EVSE_DELIVERED_POWER_VALUE: Electric vehicle supply equipment, power,
            delivered.
        EVSE_MAXIMUM_POWER_VALUE:
          expression: "[B34:B35]*10"
          unit: W
          ha_class: power
          min: "0"
          max: "655350"
          notes: >-
            OBDb IONIQ5_EVSE_MAXIMUM_POWER_VALUE: Electric vehicle supply equipment, power, max.
        EVSE_MAIN_POWER:
          expression: B36
          unit: kW
          ha_class: power
          min: "0"
          max: "255"
          notes: "OBDb IONIQ5_EVSE_MAIN_POWER: Electric vehicle supply equipment, power, main."
