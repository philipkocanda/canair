MDPS:
  tx_id: 0x7D4
  identity:
    description: Motor Driven Power Steering
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 220101 (steering wheel angle, MDPS motor current).
      The NE uses rack-mounted R-MDPS. Signals seeded from OBDb keep OBDb's names without the
      IONIQ5_ prefix, unless a PID's notes list a rename.
  pids:
    220101:
      status: active
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (2 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 12 per signal, model years 2022-2027).
      parameters:
        WHEEL_ANGLE_ABS:
          expression: "[S13:S14]/10"
          unit: °
          min: "-3276.8"
          max: "3276.7"
          notes: Wheel turn angle, absolute.
        MDPS_MOTOR_CURRENT:
          expression: S18
          unit: A
          ha_class: current
          min: "-128"
          max: "127"
          notes: Motor-driven power steering current.
