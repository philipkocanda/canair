MDPS:
  tx_id: 0x7D4
  identity:
    description: Motor Driven Power Steering
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 220101 (steering wheel angle, MDPS motor current).
      The NE uses rack-mounted R-MDPS.
  pids:
    220101:
      status: active
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (2 signals). Each expression was evaluated on OBDb's recorded responses (up
        to 12 per signal, model years 2022, 2023, 2024, 2025, 2026, 2027); 2 of 2 signals reproduce
        OBDb's expected value on every one.
      parameters:
        WHEEL_ANGLE_ABS:
          expression: "[S13:S14]/10"
          unit: °
          min: "-3276.8"
          max: "3276.7"
          notes: "OBDb IONIQ5_WHEEL_ANGLE_ABS: Wheel turn angle, absolute."
        MDPS_MOTOR_CURRENT:
          expression: S18
          unit: A
          ha_class: current
          min: "-128"
          max: "127"
          notes: "OBDb IONIQ5_MDPS_MOTOR_CURRENT: Motor-driven power steering current."
