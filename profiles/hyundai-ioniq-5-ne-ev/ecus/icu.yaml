ICU:
  tx_id: 0x770
  can_bus: [ALL]
  identity:
    description: Integrated Central control Unit (junction block + central gateway)
    notes: >-
      Address confirmed by recorded responses in OBDb Hyundai-Ioniq-5 test cases (MY2022-2027,
      https://github.com/OBDb/Hyundai-Ioniq-5): 22BC03, BC06, BC10 (lights). OVMS reads BC03/BC04
      here for door state and IGN1/IGN2. The ICU replaces the IGPM on this car: smart junction block
      (IPS) plus the central/security gateway that bridges all eight ICU-H CAN segments. Body
      control proper is the IBU at 7A0. Signals seeded from OBDb keep OBDb's names without the
      IONIQ5_ prefix, unless a PID's notes list a rename.
  pids:
    22BC03:
      status: active
      min: "0"
      max: "1"
      source: OBDb Kia EV9 + OVMS Ioniq 5 + Ioniq Electric IGPM
      source_links:
        - https://github.com/OBDb/Kia-EV9
        - https://github.com/openvehicles/Open-Vehicle-Monitoring-System-3/blob/master/vehicle/OVMS.V3/components/vehicle_hyundai_ioniq5/src/hif_can_poll.cpp
      verified: false
      notes: >-
        LOW_BEAMS is from OBDb's Ioniq 5 set and checked on its recorded responses. The other bits
        are where OBDb's Kia EV9 set, OVMS's Ioniq 5 module and this repo's Ioniq Electric IGPM
        (profiles/hyundai-ioniq-ae-ev/ecus/igpm.yaml, verified there) put them, unless a signal's
        note says a source differs; none is checked on an Ioniq 5 capture. B10 bits 1 and 3 are the
        rear door locks on the Ioniq Electric (OVMS agrees, set = unlocked) but bit 3 is the
        handbrake on the EV9, so both are left undefined. Front doors and belts are named by side on
        a left-hand-drive car.
      parameters:
        LOW_BEAMS:
          expression: B12
          min: "0"
          max: "255"
          source: OBDb Hyundai-Ioniq-5
          source_links:
            - https://github.com/OBDb/Hyundai-Ioniq-5
        TRUNK_OPEN:
          expression: B10:7
        DOOR_DRV_OPEN:
          expression: B10:5
        DOOR_PAS_OPEN:
          expression: B10:4
        DOOR_RL_OPEN:
          expression: B10:0
          notes: OVMS reads bit 0 as the passenger-side rear door.
        DOOR_RR_OPEN:
          expression: B10:2
          notes: OVMS reads bit 2 as the driver-side rear door.
        HOOD_OPEN:
          expression: B11:0
        SEATBELT_FL:
          expression: B11:1
        SEATBELT_FR:
          expression: B11:2
        IGN1_SWITCH:
          expression: B11:5
          notes: OVMS treats bit 5 or 6 set as ignition on.
        IGN2_SWITCH:
          expression: B11:6
          notes: OVMS treats bit 5 or 6 set as ignition on.
    22BC06:
      status: active
      min: "0"
      max: "255"
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (1 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 14 per signal, model years 2022-2027).
      parameters:
        BRAKE_LIGHT:
          expression: B10
    22BC10:
      status: active
      min: "0"
      max: "15"
      source: OBDb Hyundai-Ioniq-5 (offsets checked against its recorded responses)
      source_links:
        - https://github.com/OBDb/Hyundai-Ioniq-5
        - https://github.com/OBDb/Hyundai-Ioniq-5/tree/main/tests/test_cases
      verified: false
      notes: >-
        Seeded from OBDb (1 signals), each checked with canair's evaluator on OBDb's recorded
        responses (up to 6 per signal, model years 2022-2027).
      parameters:
        LIGHTS_CODE:
          expression: ((B10 >> 4) & 15)
          notes: Exterior lights state code.
    22BC04:
      status: draft
      min: "0"
      max: "1"
      source: OBDb Kia EV9 + OVMS Ioniq 5 + Ioniq Electric IGPM
      source_links:
        - https://github.com/OBDb/Kia-EV9
        - https://github.com/openvehicles/Open-Vehicle-Monitoring-System-3/blob/master/vehicle/OVMS.V3/components/vehicle_hyundai_ioniq5/src/hif_can_poll.cpp
      verified: false
      notes: >-
        OVMS polls 22BC04 on the Ioniq 5 for the front locks and rear belts, so the ICU answers it;
        its reply is 11 bytes. The bits are where OBDb's EV9 set (checked on its 7 recorded EV9
        responses) and the Ioniq Electric IGPM put them. OVMS agrees on the locks, reading set =
        unlocked, but reads the rear belts one byte later (B13). OBDb's EV9 also reads B10:4 as
        reverse gear. Draft until an Ioniq 5 capture confirms the layout.
      parameters:
        DOOR_LOCK_FL:
          expression: B10:3
        DOOR_LOCK_FR:
          expression: B10:2
        SEATBELT_RM:
          expression: B12:3
        SEATBELT_RL:
          expression: B12:2
        SEATBELT_RR:
          expression: B12:1

  research:
    - type: decode
      target: 22BC07
      status: pending
      priority: P2
      created: "2026-10-31"
      updated: "2026-10-31"
      notes: >-
        Rear defogger and turn indicators. OVMS reads the defogger at B11:1 and the indicators from
        B13 bits 2-3 (0x08 left, 0x04 right, 0x0C hazard); OBDb's Ioniq 9 puts the defogger at
        B11:0. Needs a narrated capture (defogger, each indicator, hazards).
      sources:
        - https://github.com/openvehicles/Open-Vehicle-Monitoring-System-3/blob/master/vehicle/OVMS.V3/components/vehicle_hyundai_ioniq5/src/hif_can_poll.cpp
        - https://github.com/OBDb/Hyundai-Ioniq-9
    - type: decode
      target: 22BC09
      status: pending
      priority: P2
      created: "2026-10-31"
      updated: "2026-10-31"
      notes: >-
        Headlights. OVMS: low beam when B12 & 0xC0 == 0xC0, high beam B13 & 0x03, parking lights B13
        & 0x30; OBDb's Ioniq 9 reads high at B12:0 and low at B13:0. The two disagree; needs a
        capture through each light switch position.
      sources:
        - https://github.com/openvehicles/Open-Vehicle-Monitoring-System-3/blob/master/vehicle/OVMS.V3/components/vehicle_hyundai_ioniq5/src/hif_can_poll.cpp
        - https://github.com/OBDb/Hyundai-Ioniq-9
    - type: decode
      target: 22BC05
      status: pending
      priority: P3
      created: "2026-10-31"
      updated: "2026-10-31"
      notes: >-
        Hazard switch (whole byte B10) on the EV9 and Ioniq 9; not known to answer on the Ioniq 5.
      sources:
        - https://github.com/OBDb/Kia-EV9
    - type: decode
      target: 22BC08
      status: pending
      priority: P3
      created: "2026-10-31"
      updated: "2026-10-31"
      notes: >-
        Turn signals (B10:2 right, B10:1 left) on the EV9 and Ioniq 9; not known to answer on the
        Ioniq 5.
      sources:
        - https://github.com/OBDb/Kia-EV9
    - type: verify
      target: 22BC04
      status: pending
      priority: P2
      created: "2026-10-31"
      updated: "2026-10-31"
      notes: >-
        Confirm the draft front-lock and rear-belt bits on an Ioniq 5 (lock/unlock, buckle each rear
        belt), then make the PID active.
      sources:
        - https://github.com/openvehicles/Open-Vehicle-Monitoring-System-3/blob/master/vehicle/OVMS.V3/components/vehicle_hyundai_ioniq5/src/hif_can_poll.cpp
        - https://github.com/OBDb/Kia-EV9
