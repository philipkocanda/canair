messages:
  '0x567':
    name: CGW_CLOCK
    tx_ecu: IGPM
    signals:
      clock_hour:
        start_bit: 8
        length: 5
        byte_order: little
        min: 0.0
        max: 23.0
        unit: h
        source: AVN firmware HU_GW_P_05 (com.lge.ivi HuGwP05 compose/parse; ioniq-avn-fw docs/micom/micom-avn-can-signals.tsv); uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 Ioniq28 P-CAN tap
        notes: Hour, 5 bits (byte 1 bits 0-4) per the AVN layout. Observed 16. The seconds byte ticks once per second, so the frame is a live clock.
      clock_minute:
        start_bit: 16
        length: 8
        byte_order: little
        min: 0.0
        max: 59.0
        unit: min
        source: uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 P-CAN tap
        notes: Observed 0x29=41 min.
      clock_second:
        start_bit: 24
        length: 8
        byte_order: little
        min: 0.0
        max: 59.0
        unit: s
        source: uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 P-CAN tap
        notes: Increments by 1 every ~1 s across the log — the direct proof this frame is the clock.
      clock_valid:
        start_bit: 32
        length: 1
        byte_order: little
        min: 0.0
        max: 1.0
        source: uhi22 Ioniq28 DBC CLOCK; observed on the uhi22 P-CAN tap
        notes: Clock ready flag (AVN CfTmuRdy, byte 4 bit 0). Observed 1.
      clock_weekday:
        start_bit: 1
        length: 7
        byte_order: little
        min: 0.0
        max: 127.0
        source: AVN firmware HU_GW_P_05 (com.lge.ivi HuGwP05 compose/parse; ioniq-avn-fw docs/micom/micom-avn-can-signals.tsv); observed on the uhi22 Ioniq28 P-CAN tap
        notes: 'Day-of-week bitmask, one bit set: bit 0 of this field Monday ... bit 6 Sunday (byte 0 bits 1-7). Confirmed twice against uhi22''s recording dates: 0x40 (Saturday) in both 2025-02-01 logs, 0x20 (Friday) in the trace started Friday 2022-07-22. In that trace the gateway sends its own clock at ignition-on (valid flag 0) and the head unit''s time takes over about 10 s later (seconds jump, valid flag 1 at 13 s).'
  '0x5D0':
    name: CGW_ODO
    tx_ecu: IGPM
    signals:
      ODOMETER:
        start_bit: 0
        length: 24
        byte_order: little
        scale: 0.1
        min: 0.0
        max: 800000.0
        unit: km
        source: uhi22 Ioniq28 DBC uwe5D0_ODO; observed on the uhi22 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: 24-bit LE x0.1 km. Observed BA D3 12 = 123,385 km (stable over the short log). Matches the Kona bench '0x5D0 = only the odometer'. verified:false pending owner-car confirmation.
  '0x541':
    name: CGW1
    tx_ecu: IGPM
    signals:
      CF_Gway_IGNSw:
        start_bit: 0
        length: 3
        byte_order: little
        min: 0.0
        max: 7.0
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: Ignition switch, 3-bit. Observed = 3 (ON) throughout the uhi22 drive and ready logs; confirms the Kona bench 0x541 byte0=0x03. verified:false pending owner-car confirmation.
      CF_Gway_DriveTypeOption:
        start_bit: 43
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: 'Meaning unknown: opendbc gives no value table. Leading guess: left- vs right-hand drive. Evidence: opendbc receivers are CLU, IBOX and LDWS_LKAS (no powertrain or brake modules, which argues against 2WD/4WD); the projectgus Kona bench (Australian, right-hand drive) sets it to 1, the uhi22 Ioniq (German, left-hand drive) reads 0 and never changes. Two cars only, so unproven. Test: a right-hand-drive Ioniq log should read 1.'
      CF_Gway_HeadLampLow:
        start_bit: 31
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: Low-beam on. Observed toggling 0<->1 during the uhi22 drive log — a live, exercised signal.
      CF_Gway_LightSwState:
        start_bit: 38
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: Light-switch position (0-3). Observed = 3 during the uhi22 drive log.
      CF_Gway_DrvDrSw:
        start_bit: 8
        length: 2
        byte_order: little
        min: 0.0
        max: 3.0
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: "Driver door switch (1 = open). Toggles 0-1-0-1-0 in the uhi22 'leave car while drive ready beep' log as the driver gets out. DID twin: IGPM 22BC03 DOOR_DRV_OPEN."
      CF_Gway_Ign1:
        start_bit: 58
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: IGN1 rail. Reads 1 throughout both uhi22 logs (ignition on). With CF_Gway_Ign2 this is the byte-7 0x0C the Kona bench labelled IGN1+IGN2.
      CF_Gway_Ign2:
        start_bit: 59
        length: 1
        byte_order: little
        source: opendbc hyundai_2015_ccan.dbc CGW1 (commaai, MIT); observed on the uhi22 Ioniq28 P-CAN tap (scripts/fetch_can_corpus.py)
        notes: IGN2 rail. Reads 1 throughout both uhi22 logs (ignition on).
  '0x55C':
    name: GW_DEPART_SCHEDULE
    tx_ecu: IGPM
    signals:
      GW_DEPART_SET1_HOUR:
        start_bit: 0
        length: 5
        byte_order: little
        max: 23.0
        unit: h
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Departure 1 hour. Layout from the AVN firmware (HuEvP02 compose = GwEvP07 parse).
      GW_DEPART_SET1_MIN:
        start_bit: 5
        length: 3
        byte_order: little
        scale: 10.0
        max: 50.0
        unit: min
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Departure 1 minute, 10-minute steps.
      GW_DEPART_SET1_DAYS:
        start_bit: 8
        length: 7
        byte_order: little
        max: 127.0
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: 'Departure 1 weekday mask: bit 0 Monday ... bit 6 Sunday.'
      GW_DEPART_SET1_ENABLE:
        start_bit: 15
        length: 1
        byte_order: little
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Departure 1 enabled.
      GW_DEPART_SET2_HOUR:
        start_bit: 16
        length: 5
        byte_order: little
        max: 23.0
        unit: h
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Departure 2 hour.
      GW_DEPART_SET2_MIN:
        start_bit: 21
        length: 3
        byte_order: little
        scale: 10.0
        max: 50.0
        unit: min
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Departure 2 minute, 10-minute steps.
      GW_DEPART_SET2_DAYS:
        start_bit: 24
        length: 7
        byte_order: little
        max: 127.0
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: 'Departure 2 weekday mask: bit 0 Monday ... bit 6 Sunday.'
      GW_DEPART_SET2_ENABLE:
        start_bit: 31
        length: 1
        byte_order: little
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Departure 2 enabled.
      GW_DEPART_SET1_PRECOND:
        start_bit: 32
        length: 1
        byte_order: little
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: 'Departure 1: precondition the cabin.'
      GW_DEPART_SET1_TEMP:
        start_bit: 33
        length: 6
        byte_order: little
        max: 63.0
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Departure 1 cabin set temperature, raw. Encoding not known (the firmware only says 6 bits).
      GW_DEPART_SET1_TEMP_UNIT:
        start_bit: 39
        length: 1
        byte_order: little
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Departure 1 temperature unit flag.
      GW_DEPART_SET1_DEFROST:
        start_bit: 40
        length: 1
        byte_order: little
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: 'Departure 1: defrost.'
      GW_DEPART_SET2_PRECOND:
        start_bit: 41
        length: 1
        byte_order: little
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: 'Departure 2: precondition the cabin.'
      GW_DEPART_SET2_TEMP:
        start_bit: 42
        length: 6
        byte_order: little
        max: 63.0
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Departure 2 cabin set temperature, raw; encoding not known.
      GW_DEPART_SET2_TEMP_UNIT:
        start_bit: 48
        length: 1
        byte_order: little
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Departure 2 temperature unit flag.
      GW_DEPART_SET2_DEFROST:
        start_bit: 49
        length: 1
        byte_order: little
        source: AVN firmware HU_EV_P_02 (MM-CAN 0x57B); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: 'Departure 2: defrost.'
  '0x588':
    name: GW_ECON_WINDOW
    tx_ecu: IGPM
    signals:
      GW_ECON_WEEKDAY_START_HOUR:
        start_bit: 0
        length: 5
        byte_order: little
        max: 23.0
        unit: h
        source: AVN firmware HU_EV_P_01 (MM-CAN 0x57A); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Off-peak (ECON) charge window, weekday start hour. Layout from the AVN firmware (HuEvP01 compose, GwEvP06 parse).
      GW_ECON_WEEKDAY_START_MIN:
        start_bit: 5
        length: 3
        byte_order: little
        scale: 10.0
        max: 50.0
        unit: min
        source: AVN firmware HU_EV_P_01 (MM-CAN 0x57A); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Weekday start minute, 10-minute steps.
      GW_ECON_WEEKDAY_END_HOUR:
        start_bit: 8
        length: 5
        byte_order: little
        max: 23.0
        unit: h
        source: AVN firmware HU_EV_P_01 (MM-CAN 0x57A); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Weekday end hour.
      GW_ECON_WEEKDAY_END_MIN:
        start_bit: 13
        length: 3
        byte_order: little
        scale: 10.0
        max: 50.0
        unit: min
        source: AVN firmware HU_EV_P_01 (MM-CAN 0x57A); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Weekday end minute, 10-minute steps.
      GW_ECON_WEEKEND_START_HOUR:
        start_bit: 16
        length: 5
        byte_order: little
        max: 23.0
        unit: h
        source: AVN firmware HU_EV_P_01 (MM-CAN 0x57A); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Weekend start hour.
      GW_ECON_WEEKEND_START_MIN:
        start_bit: 21
        length: 3
        byte_order: little
        scale: 10.0
        max: 50.0
        unit: min
        source: AVN firmware HU_EV_P_01 (MM-CAN 0x57A); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Weekend start minute, 10-minute steps.
      GW_ECON_WEEKEND_END_HOUR:
        start_bit: 24
        length: 5
        byte_order: little
        max: 23.0
        unit: h
        source: AVN firmware HU_EV_P_01 (MM-CAN 0x57A); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Weekend end hour.
      GW_ECON_WEEKEND_END_MIN:
        start_bit: 29
        length: 3
        byte_order: little
        scale: 10.0
        max: 50.0
        unit: min
        source: AVN firmware HU_EV_P_01 (MM-CAN 0x57A); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: Weekend end minute, 10-minute steps.
      GW_ECON_CHG_CTRL_MODE:
        start_bit: 32
        length: 2
        byte_order: little
        max: 3.0
        source: AVN firmware HU_EV_P_01 (MM-CAN 0x57A); observed on the uhi22 Ioniq28 P-CAN tap, gateway-timed
        notes: 'Charge scheduling mode as set in the head unit, forwarded by the gateway: 0 = Charge Now (charge as soon as plugged in), 1 = Charge on Schedule with no off-peak window (the menu''s default and reset value), 2 = Charge on Schedule with off-peak time enabled, 3 = the same with ''Charge ONLY during the time shown below'' ticked. Mapping read from the head unit''s menu code (GreenCar DepartureClimateActivity radio buttons; EconomyReservationSettingActivity OK button sends 3 if that box is ticked, else 2). Not a charge-power setting. uhi22''s car: 3 in a July 2022 P-CAN trace (window unset), 0 in the Feb 2025 logs.'
