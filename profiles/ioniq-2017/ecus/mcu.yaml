# ─── MCU (Motor Control Unit) ─────────────────────────────────────────
#
# This is the power electronics + control for the traction motor.
#
# Responsibilities:
# - Inverter switching (DC → 3-phase AC)
# - Motor torque/current control loops
# - Rotor position handling
# - Thermal protection of motor/inverter
#
# The Vehicle Control Unit (VCU) and Motor Control Unit (MCU)
# are both part of the Electronic Powertrain Control Unit (EPCU) physical housing.
#
# Full service 21 scan (01-FF) during AC charging (2026-04-18):
#   0x01 (34 bytes), 0x02 (62 bytes), 0x03 (27 bytes, all zeros), 0xF2 (69 bytes).
#
# KWP2000 diagnostic sessions (service 0x10) — probed 2026-07-22, car in READY:
# see the structured `sessions:` field at the end of this ECU block.
# Only 0x81 is accepted; 21xx reads work in the default session too — no session
# unlocks extra data. Payload sizes are session-independent: 2101=30B, 2102=56B,
# 2103=27B; 2104/2105 → NRC 0x12 (do not exist).
MCU:
  tx_id: 0x7E3
  can_bus: [H-CAN, P-CAN]
  identity:
    alias: VMCU # aka HPCU (Hybrid Power Control Unit - legacy term but may help to know)
    description: Motor Control Unit (inverter)
    part_number: "36600-0E250"
    ecu_id: AEEMCU83  # KWP2000 1A8C
    sw_id: "EAEEHEL-MS2-D000"
    calibration: "00000001"
    id_protocol: KWP2000  # 1Axx
    notes: >
      Motor Control Unit — inverter / power electronics and control loops for
      the traction motor. Shares the EPCU (Electronic Powertrain Control Unit)
      physical housing with the VCU.
  vehicle_states: [READY, CHARGING]
  pids:
    2101:
      status: active
      response_frames: 5
      period: 5000
      vehicle_states: [READY, CHARGING]
      notes: >-
        30 bytes; a 34-byte variant adds four trailing 00 bytes. Words are little-endian, unlike BMS
        2101. B23 and B26 are constant 0x02 and 0x04.
      parameters:
        MCU_2101_B22:
          expression: B22
          unit: ""
          min: "0"
          max: "255"
          source: canair analysis 2026-08-08 (long drive + 50 kW DCFC), gap-verified against CLU ODOMETER
          verified: false
          notes: >-
            Range 6-136 across 8598 captures. Not a temperature: on 2026-08-08 it fell 37 in 22 s
            and rose 45 in 50 s, and read 22-31 during a DC charge with the coolant at 39-43 °C.
            r=+0.012 vs AAF coolant and heat-sink temperatures. Steps down when propulsion stops and
            up when it resumes.
          enabled: false
          ha_class: ""
        MCU_HV_VOLTAGE:
          expression: B13*2.56
          unit: V
          min: "0"
          max: "500"
          source: canair investigate/hunt 2026-07-22 drive; VERIFIED vs BMS pack voltage over 3h charge 2026-08-05
          verified: true
          notes: >-
            Coarse HV DC-link voltage, about 2.56 V per LSB. Slope 0.991, r=0.981 vs BMS
            BATTERY_VOLTAGE over 2016 samples of a 3 h AC charge (360-399 V).
        MCU_2101_B25:
          expression: B25
          unit: ""
          min: "0"
          max: "255"
          source: canair analysis 2026-08-08 long drive + DCFC
          verified: false
          notes: >-
            Range 38-99 across 8598 captures, slow-moving. r=-0.720 vs AAF:2181:MOTOR_COOLANT_TEMP
            and HEATSINK_TEMP (n=1488). B26 is constant 0x04.
          enabled: false
          ha_class: ""
        MCU_PHASE_CURRENT_1:
          expression: (S30 << 8) | B29
          source: canair analysis 2026-08-08 long drive + DCFC
          verified: false
          notes: >-
            Signed 16-bit little-endian, low byte B29, high byte B30. The three MCU_PHASE_CURRENT
            signals sum to zero (n=5181, stdev 21.5 against a full scale of 20678). Scale unknown,
            so raw counts.
        MCU_PHASE_CURRENT_2:
          expression: (S33 << 8) | B31
          source: canair analysis 2026-08-08 long drive + DCFC
          verified: false
          notes: >-
            Signed 16-bit little-endian, low byte B31, high byte B33 (B32 is a PCI byte). See
            MCU_PHASE_CURRENT_1.
        MCU_PHASE_CURRENT_3:
          expression: (S35 << 8) | B34
          source: canair analysis 2026-08-08 long drive + DCFC
          verified: false
          notes: Signed 16-bit little-endian, low byte B34, high byte B35. See MCU_PHASE_CURRENT_1.
        MCU_SUPPLY_VOLTAGE_1:
          expression: ((B15<<8)|B14)/1000
          unit: V
          ha_class: voltage
          min: "0"
          max: "16"
          source: canair decode --corr / hunt 2026-10-21
          verified: false
          notes: >-
            12 V supply voltage at the MCU, 1 mV/bit, 16-bit little-endian. r=+0.998 vs
            VCU:2102:VCU_AUX_BATTERY_VOLTAGE_FINE (n=8469, slope 0.996). Reads 14.73-14.83 V while
            the VCU battery and LDC readings are 14.75 and 14.89 V.
        MCU_SUPPLY_VOLTAGE_2:
          expression: ((B28<<8)|B27)/1000
          unit: V
          ha_class: voltage
          min: "0"
          max: "16"
          source: canair decode --corr / hunt 2026-10-21
          verified: false
          notes: >-
            Second 12 V supply reading at the MCU, 1 mV/bit, 16-bit little-endian. r=+0.998 vs
            VCU:2102:VCU_LDC_OUTPUT_VOLTAGE (n=8469); tracks MCU_SUPPLY_VOLTAGE_1 within a few tens
            of mV.
    2102:
      response_frames: 9
      status: active
      period: 5000
      vehicle_states: [CHARGING]
      notes: >-
        62 bytes. B27-B33 hold constant calibration bytes that also appear in 21F2. B52 is a counter
        or checksum that correlates with no signal. B54 onward is zero padding.
      parameters:
        MCU_MOTOR_RPM:
          expression: (S10<<8)|B09
          unit: RPM
          ha_class: ""
          min: "-10500"
          max: "10500"
          source: Kia Soul EV VMCU CSV (Motor Actual Speed RPM) + physical validation; low byte corrected 2026-10-21
          source_links: []
          verified: true
          notes: >-
            Signed 16-bit little-endian; B09 is the low byte. B11 cannot be: B11:B12 is the torque
            word, duplicated byte-for-byte at B13:B14 in all 8231 captures, and B09 is 0 at
            standstill but spread over 26-253 above 500 RPM. Against EPS_VEHICLE_SPEED the
            little-endian read fits better (r=0.999 vs 0.997 for [S10:S11]). Median 62.8 RPM per
            km/h vs VCU speed, against 61.8 expected from the 7.412 reduction and 205/55R16 tyres.

        MCU_MOTOR_TORQUE:
          expression: ((S12<<8)|B11)/10
          unit: Nm
          ha_class: ""
          min: "-300"
          max: "300"
          source: energy balance vs BMS:2101 BATTERY_POWER and the cumulative energy counters, 2026-10-21
          source_links: []
          verified: false
          notes: >-
            Signed 16-bit little-endian, 0.1 Nm/bit; negative in regen. Torque x MCU_MOTOR_RPM
            integrated over the 2026-08-08 drives gives 79-90 % of the BMS pack energy on the
            sustained segments (10:30-11:41, 16:48-17:52), which is drivetrain efficiency with the
            12 V and climate loads on top; low-speed segments fall to 21-63 % as those loads
            dominate. The integrated pack power agrees with the BMS energy counters. Range -156 to
            +181 Nm while driving. The old [S12:S13]/100 decoded the same value (B13 copies B11) at
            a tenth of this scale.
        MCU_MOTOR_TORQUE_2:
          expression: ((S14<<8)|B13)/10
          unit: Nm
          ha_class: ""
          min: "-300"
          max: "300"
          enabled: false
          source: canair decode --find-mirrors 2026-10-21
          source_links: []
          verified: false
          notes: >-
            B13:B14 equals B11:B12 (MCU_MOTOR_TORQUE) byte-for-byte in all 8231 captures. Disabled
            as a duplicate. The old [S14:S15] read straddled this word and the current word.
        MCU_MOTOR_CURRENT:
          expression: ((B17<<8)|B15)/10
          unit: A
          ha_class: current
          min: "0"
          max: "600"
          enabled: true
          source: canair align + within-PID fit 2026-10-21
          source_links: []
          verified: false
          notes: >-
            Motor phase-current magnitude, 16-bit little-endian split across the PCI byte B16; never
            negative. 2.7-5.4 at standstill, up to 214 while driving (if 0.1 A/bit, which is not
            proven). Tracks |MCU_MOTOR_TORQUE| at about 1.2 counts per 0.1 Nm below 5000 RPM, rising
            to 1.6 above 6500 RPM, as field weakening would.
        MCU_2102_B20:
          expression: B20
          unit: ""
          ha_class: ""
          min: "0"
          max: "255"
          source: RE 2026-07-23; DEMOTED 2026-08-05 (implausible vs 2101 B22 + all-state band)
          verified: false
          notes: >-
            Range 6-25 across 8231 captures, slow-moving and unrelated to torque. Reads 13-16 while
            driving, so it is not a motor or inverter temperature at 1 °C per LSB.
          enabled: false

        MCU_2102_B19:
          expression: B19
          unit: ""
          min: "0"
          max: "255"
          enabled: false
          source: RE 2026-07-22 MT->KW drive analysis; revised 2026-07-23 (full driving corpus)
          verified: false
          notes: >-
            Range 4-36 across 8231 captures. Moves with load: r=+0.456 vs |MCU_MOTOR_TORQUE|, and
            its changes r=+0.79 vs torque changes over 477 driving captures.
          ha_class: ""
        MCU_2102_B18:
          expression: B18
          unit: ""
          min: "0"
          max: "255"
          source: RE 2026-07-23; DEMOTED 2026-08-05 (sub-ambient, implausible vs 2101 B22)
          verified: false
          notes: >-
            Range 5-33 across 8231 captures, slow-moving and unrelated to torque. Often below
            ambient, so it is not a component temperature at 1 °C per LSB.
          enabled: false
          ha_class: ""
        MCU_CURRENT_RELATED:
          expression: B21
          unit: ""
          min: "0"
          max: "255"
          source: canair hunt vs MCU_PHASE_CURRENT_RMS, 2026-07-22 drive
          verified: false
          notes: >-
            Range 6-34 across 8231 captures. r=+0.875 vs |MCU_MOTOR_TORQUE| over 477 driving
            captures, changing within one 5 s sample.
        MCU_MOTOR_POWER:
          expression: ((S12<<8)|B11)/10*((S10<<8)|B09)*0.00010472
          unit: kW
          ha_class: power
          min: "-100"
          max: "100"
          source: derived from MCU_MOTOR_TORQUE x MCU_MOTOR_RPM, 2026-10-21
          verified: false
          notes: >-
            Mechanical shaft power, torque x 2*pi*RPM/60/1000; negative in regen. Integrated, it is
            79-90 % of the BMS pack energy over sustained 2026-08-08 driving.

    2103:
      response_frames: 4
      status: draft
      period: 0
      vehicle_states: [CHARGING]
      notes: 27 bytes, all zeros during AC charging (2026-04-18).
      parameters: {}

    21F2:
      response_frames: 10
      status: active
      period: 0
      vehicle_states: [CHARGING]
      notes: >-
        67 data bytes. The ASCII tag 'EHEL-MS2' (part of the 1A8D software ID) at B69-B77, after a
        record whose values change between drive and charge cycles rather than live, like BMS 21F2.
        Undecoded. A misfiled VCU 21F2 reply (2026-08-08 10:07:16) was deleted on 2026-10-21; see
        plans/2026-10-21-cross-ecu-reply-misfile.md.
      parameters:
        MCU_21F2_TAG:
          expression: "[B69:B77]"
          type: ascii
          source: canair search 2026-10-21
          verified: false
          notes: >-
            Constant ASCII 'EHEL-MS2', the middle of the 1A8D software ID EAEEHEL-MS2-D000. The byte
            before it varies, so it is not part of the string.
          enabled: false
  research:
    - type: decode
      target: "2102"
      status: captured
      priority: P1
      vehicle_states: [CHARGING]
      notes: >
        62 bytes. 2026-07-20 (Phase 1): MOTOR_RPM verified at [S10:S11]. Added UNVERIFIED candidates from
        variance + park/drive + dRPM-correlation over 332 captures: MCU_MOTOR_TORQUE_2 [S14:S15]/100 (second
        signed-16 torque, ≈0 at park), MCU_PHASE_CURRENT_RMS [B17:B18]/10 (always ≥0, r=+0.44 vs dRPM). Temps
        B20/B21 still barely-warmed candidates. Calibration block B27–B33 documented as static (resolver +
        U/V phase offsets). STILL OPEN (Phase 2): confirm which torque is command vs estimated, phase-current
        scale, disambiguate the 3rd temperature (B22/B25 track RPM, 52..248 raw — offset/scale unclear), and
        identify the highly-dynamic B52 (card=180). Needs a warm, dense, synced VCU+MCU drive capture.
      what_to_test:
        - "Torque: MCU_MOTOR_TORQUE [S12:S13] vs MCU_MOTOR_TORQUE_2 [S14:S15] — which is command vs estimated? Both ≈0 at park; correlate against pedal + dRPM incl. regen/braking (signed must go negative)."
        - "Phase current: [B17:B18] scale — /10→A guess; confirm 0 at park, rises with |torque|, peak vs motor spec."
        - "Temps: B20/B21 raw °C vs value−40; warm the inverter to separate motor/inverter/heat-sink. Check B22/B25 as a 3rd temp or a different quantity."
        - "B52 (TAQ, card=180) — identify this fast-changing signal."
        - >
          CAPTURE METHOD: WebSocket polling is sequential over one connection and the stored
          timestamp is per-cycle (not per-PID acquisition), so VCU 2101 and MCU 2102 are skewed
          ~0.3-3s and cannot be tightly synced across ECUs. Mitigation: poll ONLY the two PIDs,
          dense + back-to-back:  canair query "query VCU:2101" "query MCU:2102" --monitor 1
          --keep-all --save --wican vpn  (drive with hard launches, lift-off/regen, and braking;
          run long enough to warm the inverter for the temp mapping). NOTE: torque RPM are BOTH in
          MCU 2102, so torque needs no cross-ECU sync - just finer dRPM (dense sampling) + regen data.
      sources:
        - "Kia Soul EV VMCU CSV — RPM/torque (signed 16-bit), phase current + resolver offsets (Int16)"
        - "Obsidian: MCU.md"
    - type: decode
      target: "2101"
      status: done
      priority: P1
      vehicle_states: [READY]
      notes: >-
        RESOLVED 2026-08-08 (long drive + 50 kW DCFC, 1562 timed MCU 2101 captures). (1) HV DC-link
        voltage LOCATED & VERIFIED: MCU_HV_VOLTAGE=B13*2.56. A finer LE-16 read ((B13<<8)|B12)/100
        was tested and REJECTED - r identical to 3 decimals in every scope (DCFC ramp n=51 both
        +0.510; today CHARGING n=538 both +0.613; all-history CHARGING n=1236 both +0.693) and B12
        spans only 30-52 where a true low byte would sweep 0-255, so the 2.56 V resolution is real.
        (2) NEGATIVE RESULT - THERE IS NO POWERTRAIN TEMPERATURE ON THIS PID. hunt vs AAF:2181
        MOTOR_COOLANT_TEMP over today's drive (measured-only, --fill none, n=1326) gives a best
        expressible hit of B22 at r=+0.335 with 7.60 C residual; next is B13 at r=+0.261; nothing
        reaches r=0.4. The suspected B10/B13/B15 temps do not exist. Real motor/inverter thermals
        live on AAF 2181 (MOTOR_COOLANT_TEMP=B22-40, HEATSINK_TEMP=B20-40) - the AAF is the thermal
        ECU. Method note: hunt's top raw hits here were f16/f32 float reinterpretations with no
        WiCAN expression and correlate spuriously; always read the best EXPRESSIBLE hit. (3) The PID
        is far from exhausted, but the remaining questions are now tracked as their own leads:
        phase-current absolute scale, B22/B25 identity, B14:B15 + B27:B28 mirrored words.
      sources:
        - "Kia Soul EV VMCU CSV — temps (w/x/y - 40)"
        - "Obsidian: MCU.md"
        - "OBDb Ioniq 5 MCU 22E001"
      updated: "2026-08-08"
    - type: decode
      target: "2103"
      status: captured
      priority: P2
      vehicle_states: [CHARGING]
      date: "2026-04-18"
      notes: "27 bytes, all zeros during charging. May contain data while driving."
    - type: decode
      target: "21F2"
      status: captured
      priority: P2
      vehicle_states: [CHARGING]
      date: "2026-04-18"
      notes: "69 bytes. Discovered during charging scan. Undecoded."
    - type: scan
      target: "22 E001-E010"
      status: done
      priority: P1
      vehicle_states: [ACC]
      date: "2026-07-22"
      notes: "Ioniq 5 cross-ref: E001 ignition voltage/motor RPM/torque/phase current/temps, E009 electric water pump/oil pump."
      result: >
        Re-scanned E001-E010 with ignition ON (battery 14.4V) 2026-07-22: all 16 -> NRC 0x12
        (subFunctionNotSupported), 0 timeouts (ECU alive, rejecting). CONFIRMED DEAD END: this
        KWP2000 MCU does not implement service-22 read-did with E0xx DIDs (a UDS-era Ioniq-5
        construct). Hidden MCU pages, if any, live in the service-21 (21xx) range, not 22 E0xx.
        Pivot: sweep 21 00-FF for undocumented pages instead.
      sources:
        - "OBDb Ioniq 5"
      updated: "2026-07-23"
    - type: iocontrol_scan
      target: "2F E000-E0FF"
      status: pending
      priority: P2
      vehicle_states: [ACC]
      notes: "MCU IOControl E0xx range."
    - type: scan
      target: 21 00-FF
      status: done
      priority: P2
      vehicle_states: [READY]
      date: "2026-07-22"
      result: "Exhaustive service-21 LID sweep (ignition on): only 01/02/03/F2 respond (= known 2101/2102/2103/21F2), all 252 others NRC. No hidden pages. MCU service-21 space fully mapped."
      notes: Hidden-page hunt. Confirms the E0xx (service-22) dead end has no service-21 analogue beyond known pages.
    - type: decode
      target: "2102"
      status: captured
      priority: P2
      vehicle_states: [READY]
      notes: "MCU 2102 B9 (ISO-TP 0x06, immediately before MCU_MOTOR_RPM B10:B11) = candidate motor rotor/resolver electrical ANGLE or motor-speed sub-count/fraction. Signature from 2026-07-22 drive: B9==0 at ALL 18 standstill (RPM=0) samples, and spreads ~uniformly 26-253 (mean 127~=255/2) whenever |RPM|>500 — the classic aliased-angle pattern for a fast-rotating quantity sampled at asynchronous 2s intervals. Weak |RPM| corr (0.42) is just the shared zero-anchor. Cannot distinguish absolute rotor angle (0-255 = 0-360 elec deg) vs RPM fractional low byte without high-rate capture. TO TEST: log B9 with 1001-style fast polling or a SavvyCAN sniff at fixed low RPM to see if it ramps linearly (angle) or stays uniform (fraction)."
    - type: decode
      target: "2102"
      status: done
      priority: P3
      vehicle_states: [READY]
      notes: MCU 2102 B52/B53 tail bytes = message alive-counter / checksum, NOT a physical signal. B52 (ISO-TP 0x2E) is chaotic full-range 0-253 with ZERO correlation to RPM/torque/phase-current (r~0.01); B53 sits ~constant 0x31-0x33. Ruled out as a signal during 2026-07-22 drive analysis — do not chase. The remaining B27-B47 block is the known static calibration region (constant across the drive).
    - type: decode
      target: "2102"
      status: captured
      priority: P2
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-07-23"
      notes: "2026-07-23 (574 caps): B18-B21 cluster split. B20=MCU_TEMP_1, B18=MCU_TEMP_3 are slow temps (load-decoupled, autocorr>0.93); B20 hottest charging (inverter/power-stage), B18 warms with driving (motor/coolant). B21 (was MCU_TEMP_2) and B19 (was MCU_INVERTER_TEMP) are load-tracking (r(Δbyte,Δ|tq|)=0.90/0.79), not temps; both enabled:false. Open: (1) B19 junction-temp estimate vs current (needs scan-tool inverter/junction temp); (2) B21 scale + load quantity (2nd phase current / modulation depth / power); (3) verify B18/B20 vs scan-tool temps on a long warm drive; (4) B22:B23=0xF7FF/F8FF near-constant, likely status/cal. Method: sustained hard drive + hill climb to separate junction (fast) from heatsink (slow); cross-check scan tool."
    - type: verify
      target: "2102"
      status: pending
      priority: P2
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-07-23"
      notes: "Verify MCU_MOTOR_TORQUE [S12:S13]/100 and MCU_MOTOR_TORQUE_2 [S14:S15]/100 (command vs estimated) with a PEDAL-SYNCED drive co-polling VCU 2101 (ACCEL_PEDAL_DEPTH). 2026-07-23 cross-signal evidence: TORQUE r=+0.60 and TORQUE_2 r=+0.57 vs d(MCU_MOTOR_RPM)/dt; TORQUE<->TORQUE_2 r=+0.969 (coupled but distinct). Needed to confirm which field is command vs estimated, pin the /100 scale, and enable TORQUE_2. Hard accel + strong regen events required (this drive was gentle, only reached -10..+18 Nm)."
    - type: decode
      target: 21F2
      status: captured
      priority: P2
      vehicle_states: [CHARGING, ACC2]
      created: "2026-08-02"
      updated: "2026-08-02"
      notes: "69 bytes. Discovered during charging scan. 93 captures as of 2026-08-02 (READY/charge/ACC2). CAUTION: investigate/correlate on this scope is unreliable - keep:unique + the bimodal charge-vs-ACC2 regime makes many bytes hit r~0.999 vs unrelated HVAC signals (two-cluster artifact, see plans/2026-08-02-align-and-analysis-issues.md #3). Needs a keep-all drive with continuous variation to decode. Same shape as VCU 21F2 (140 caps)."
    - type: decode
      target: 21F2
      status: captured
      priority: P3
      vehicle_states: [ALL]
      created: "2026-08-02"
      updated: "2026-08-02"
      notes: "93 captures (62 driving 2026-07-22, +charge/ACC2/parked). ASSESSMENT 2026-08-02: 21F2 is a static-per-session identity+monitor page, NOT dynamic data. Structure (SID 61F2, 67B reassembled): constant framing/markers (FFFFFF3F, 7DD6, 09, CDABC2CD, C1CD) + ASCII software/part ID 'EHEL-MS2' at the tail (WiCAN B69-B77 but CROSSES the CF PCI byte at B72 -> not cleanly shippable as one contiguous expression; visible only in the reassembled payload). Varying bytes do NOT correlate with motor RPM (MCU 2102 [S10:S11]), vehicle speed (ESC 22C101) or the MCU slow temp - because they are ~constant WITHIN a session and only differ BETWEEN sessions. Candidate temp pair at reassembled idx 57-58 (two adjacent bytes, session-stable, tracking within 0-3, range 17-46 across sessions) = likely two related temperatures. TO DECODE: a keep-all thermal-sweep capture (long charge or warm-up) co-polling a known temp (AAF MOTOR_COOLANT_TEMP) so the temps actually vary within scope; motor/speed correlation is a dead end here."
    - type: decode
      target: "2101"
      status: done
      priority: P2
      vehicle_states: [CHARGING]
      created: "2026-08-05"
      updated: "2026-08-08"
      notes: >-
        2026-08-05 (3h AC charge, MCU+BMS+OBC+AAF co-polled, 2016 timed caps). (1) STANDS: HV
        DC-link voltage LOCATED & VERIFIED at B13, MCU_HV_VOLTAGE=B13*2.56, tracks the verified BMS
        BATTERY_VOLTAGE 1:1 over the SOC-driven 360-399 V sweep (slope 0.991, r=0.981, resid 2.30 V
        = 1 LSB). (2) WITHDRAWN 2026-08-08: B22 is NOT an inverter temp - renamed MCU_2101_B22,
        disabled. It has NO thermal inertia, on continuously-polled rows: 59 at 16:31:12 -> 22 at
        16:31:34 (-37 in 22.4 s, at DC charge start) -> 48 at 16:32:20 (+26 in 46 s); then 30 at
        16:43:42 -> 75 at 16:44:32 (+45 in 49.7 s, as driving resumes); plus +/-3-6 unit jitter on
        an 8-20 s cadence throughout. It reads 22-31 through the DCFC while AAF:2181
        MOTOR_COOLANT_TEMP is 39-43 C, and nothing sits 15 C below its own coolant. r=+0.012 vs AAF
        coolant and heatsink over the day. The original 'smooth exponential decay 80->21 C over 3h'
        came from a single unloaded AC charge where many unrelated quantities also decay
        monotonically - a decay curve alone does not identify a thermal mass. Timing is gap-verified
        against CLU ODOMETER: the day's only recording outage was 11:40-15:33 (42 km driven
        unrecorded, 73322->73364) and it contains none of these excursions. B22 steps DOWN when
        propulsion stops and UP when it resumes, so it tracks load/mode - candidates are a
        duty-cycle/modulation index, a current limit or a derating factor. (3) WITHDRAWN 2026-08-08:
