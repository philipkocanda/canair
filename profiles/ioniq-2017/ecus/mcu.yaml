        currents are about 0.020 A per count (peak 11516 raw = about 230 A). Both scales are still
        unproven.
      notes: MCU_PHASE_CURRENT_1/2/3 are located and proven to be currents (Kirchhoff sum-to-zero mean -0.13 stdev 21.51 over n=5181; sum-of-squares 462x higher driving than at DCFC standstill; SQ vs RPM r=-0.039 rules out phase voltages; SQ ~ 1.2*torque^2 with field-weakening at high RPM). Only the SCALE is unknown, so all three ship unverified with no unit. Observed peak |I| 11516 raw; apparent standstill quantum ~24.4 raw. A 2017 Ioniq 28 kWh draws ~400 A peak phase current at full torque, which would imply roughly 0.035 A/LSB, but that is arithmetic on an assumed peak, not a measurement.
