# ─── ESC (Electronic Stability Control) ──────────────────────────────
ESC:
  tx_id: 0x7D1
  identity:
    alias: ABS
    description: Electronic Stability Control
    serial: "GWLK7F01A986826"
    app_sw: "G7"
    id_protocol: UDS  # F1xx (limited — no part number DID)
    notes: >
      Electronic Stability Control (ABS). Exposes vehicle speed and the four
      individual wheel speeds via 22C101; candidate yaw-rate / accel dynamics
      still undecoded.
  vehicle_states: [ACC, ACC2, READY]
  # UDS service-22 multi-DID batching: verified on-device 2026-07-29 (READY) —
  # ESC answers `22 C101 C102` with `62C101 <data> C102 <data>` and the response
  # splits cleanly. Batching cuts poll commands for its consecutive 22-DIDs.
  multi_did: true
  pids:
    22C101:
      status: active
      period: 2500
      vehicle_states: []
      parameters:
        REAL_SPEED_KMH:
          expression: B12
          unit: km/h
          ha_class: speed
          min: "0"
          max: "250"
          source: Kia Niro EV WiCAN PR#660; verified RE 2026-07-22
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/660
          verified: true
          notes: >
            ESC vehicle-speed estimate, 1 km/h/bit at ISO-TP 0x09. Verified against 4 wheel speeds (B18-B21, r=+1.000) and driving profile 0-39 km/h. Reads 0 at standstill.
            UNSIGNED magnitude — reads POSITIVE when reversing (2026-07-26: gear=Reverse segments show +1..2 km/h). This is correct wheel-speed-sensor behaviour, NOT a decode bug: there is no sign and no high byte — the neighbours B10/B11/B13 are constant 0xFF padding (distinct=1). Direction of travel is carried separately by GEAR_SELECTOR (B14). A signed/directional speed must be derived downstream (magnitude x gear-direction); it can't be expressed as single-frame WiCAN arithmetic (no conditional, and the gear enum->sign isn't clean arithmetic).
        WHEEL_SPEED_FL:
          expression: B18
          unit: km/h
          min: "0"
          max: "250"
          source: RE 2026-07-22 driving capture; r=+1.000 vs REAL_SPEED_KMH
          verified: true
          notes: >
            Individual wheel speed, 1 km/h/bit. ISO-TP 0x0E. Left/right grouping confirmed (B18/B20 track together = left pair, diverge with B19/B21 in turns). Front/rear within side by Ioniq5/OBDb FL,FR,RL,RR convention — not independently verified.
        WHEEL_SPEED_FR:
          expression: B19
          unit: km/h
          min: "0"
          max: "250"
          source: RE 2026-07-22 driving capture; r=+1.000 vs REAL_SPEED_KMH
          verified: true
          notes: >
            Individual wheel speed, 1 km/h/bit. ISO-TP 0x0F. Right pair (B19/B21 track together). Front/rear by convention.
        WHEEL_SPEED_RL:
          expression: B20
          unit: km/h
          min: "0"
          max: "250"
          source: RE 2026-07-22 driving capture; r=+1.000 vs REAL_SPEED_KMH
          verified: true
          notes: >
            Individual wheel speed, 1 km/h/bit. ISO-TP 0x10. Left pair (B18/B20 track together). Front/rear by convention.
        WHEEL_SPEED_RR:
          expression: B21
          unit: km/h
          min: "0"
          max: "250"
          source: RE 2026-07-22 driving capture; r=+1.000 vs REAL_SPEED_KMH
          verified: true
          notes: >
            Individual wheel speed, 1 km/h/bit. ISO-TP 0x11. Right pair (B19/B21 track together). Front/rear by convention.
        GEAR_SELECTOR:
          expression: B14
          unit: ""
          min: "0"
          max: "8"
          source: canair investigate/hunt vs VCU:2101:DRIVE_MODE_P, 2026-07-22 drive; Reverse confirmed 2026-07-26
          verified: true
          notes: >
            Transmission range / shifter position echoed on the ESC/ABS module. B14 (ISO-TP data). Sequential PRND encoding 1=Park, 2=Reverse, 4=Drive (3=Neutral assumed, still unobserved). r=-1.000 vs VCU:2101:DRIVE_MODE_P over the 2026-07-22 drive (fit park->1, drive->4). VERIFIED 2026-07-26 driveway back-and-forth: value 2 tracked the reverse segments exactly (n=52 while backing up at 17:00:20-43 and 17:01:06-17:03:03), value 4 the forward pulls, 1 at rest — real-driving confirmation of R=2/D=4/P=1. NOTE: this is the direction source for vehicle speed (REAL_SPEED_KMH/wheel speeds are unsigned magnitudes). Neutral (expected 3) still needs a capture.
        LONG_ACCEL_RAW:
          expression: S23-128
          unit: ""
          min: "-128"
          max: "127"
          source: canair hunt/investigate 2026-07-22 drive
          verified: false
          notes: >
            Candidate longitudinal accelerometer / force sensor on the ESC/ABS module. B23 is centered at 127 (min 113, max 139, mean 127.29, median 127 over 381 driving pts) — the structural signature of a signed sensor with 0x7F/0x80 = zero. Moderately tracks acceleration (r=+0.49 vs delta(REAL_SPEED_KMH) at 2.5s join) and accel pedal (r=+0.70 vs VCU ACCEL_PEDAL_DEPTH) but the sign/scale are UNRESOLVED: correlation is unstable across join tolerances (+0.49 at 2.5s, -0.23 at 1.2s) because the sensor changes faster than the ~1s poll, and it also correlates with braking (r=-0.90 vs VCU NOT_BRAKING). Needs a high-rate synced capture with hard accel + hard braking to fix direction and g-scale.
        BRAKE_PRESSURE:
          expression: B44
          unit: ""
          min: "0"
          max: "255"
          source: canair correlate/decode 2026-07-22 drive
          verified: false
          notes: >
            Brake pressure (master-cylinder / wheel-circuit) on the ESC/ABS module. B44 continuous 0-53 (median 0 = off, distinct=32) — NOT a binary lamp. r=+0.973 vs VCU:2101 VEHICLE_STATE_BRAKE_LAMP and -0.973 vs NOT_BRAKING over 124 co-polled pts. At a stop (09:06:38-41) B44 ramps hard as speed hits 0 while the driver holds the pedal. B45 is a near-identical sibling (both 0-53, mean 11.4) — likely the second brake circuit. Raw units (bar/scale TBD); verify with a known brake-force capture.
        STEERING_ANGLE:
          expression: ([B35:B36]-32768)/10
          unit: deg
          min: "-600"
          max: "600"
          source: RE 2026-07-26 held-wheel + 2026-07-30 DRIVING steer-sweep; EPS 220101 cross-check
          verified: true
          notes: >-
            Absolute steering wheel angle sensor (SAS) echoed on ESC/ABS. Big-endian offset-binary
            16-bit at ISO-TP 0x1D:0x1E (WiCAN B35:B36, both in CAN frame 4 — no PCI between), zero
            at 0x8000, scale /10 deg. VERIFIED 2026-07-30: over the DRIVING steer-sweep it tracks
            EPS 220101 EPS_STEERING_ANGLE r=+1.000, both crossing ~0 at centre together (independent
            ECUs, same SAS) and matching magnitudes across +-90deg; scale and 0x8000 zero confirmed.
            Holds large non-zero values while stationary => angle, not yaw rate. The 2026-07-26
            '+24deg at rest' was the wheel parked slightly off-centre, not a zero offset. NOTE: rare
            ECU init/invalid frames read ~3276deg (raw ~0xFFFx) — filter as out-of-range. Distinct
            from EPS B12:B13 (fast rate/torque).
    22C102:
      status: draft
      period: 2500
      vehicle_states: []
      parameters:
        ESC_C102_UNKNOWN:
          expression: ""
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          source: "DID scan 2026-04-17"
          source_links: []
          verified: false
          notes: "26-27 bytes. 2026-04-17: 62C1023FE00000FFFFFFFFFFFF01010000A9AA000000C0C0D4D400. 2026-07-22 (READY, parked) re-scan: 62C1023FE00000FFFFFFFFFFFF010100009C9C000000C0C0D4D4 — the 16-bit word after '01010000' changed A9AA->9C9C between captures while the 0x3FE0 prefix and 0xC0C0D4D4 tail stayed constant. So that word (ISO-TP ~byte 0x0F-0x10) is a dynamic signal (candidate wheel/ABS sensor), the rest static. Needs a driving capture to decode."
  research:
    - type: decode
      target: "22C101"
      status: captured
      priority: P2
      vehicle_states: [ACC]
      notes: >
        REAL_SPEED_KMH (B12) and 4 wheel speeds (B18-B21, FL/FR/RL/RR interleaved,
        1 km/h/bit) decoded + verified from the 2026-07-22 drive (r=+1.000).
        B35:B36 RESOLVED + VERIFIED 2026-07-30 = STEERING_ANGLE (absolute SAS,
        big-endian offset-binary centred 0x8000, /10 deg): over the 2026-07-30
        DRIVING steer-sweep it tracks EPS 220101 EPS_STEERING_ANGLE r=+1.000, both
        crossing ~0 at centre together (independent ECUs) — scale, sign and 0x8000
        zero confirmed. The 2026-07-26 '+24 at rest' was the wheel parked off-centre.
        STILL UNDECODED: B37:B38 (~2048 = offset-binary accel?), and B39/B41 (~2048,
        spans PCI B40 so use (B39<<8)|B41 → 2nd accel axis?) — both sit near centre
        at standstill so neither the driveway nor the 2026-07-30 (also ~stationary)
        capture can resolve them; need a real moving drive. Also B18-B21 front/rear
        within a side is by convention only. B22/B27 = low-rate status/counter.
        SPEED SIGN (2026-07-26): REAL_SPEED_KMH (B12) and the wheel speeds are
        UNSIGNED magnitudes and read positive in reverse — confirmed correct (not a
        bug): neighbours B10/B11/B13 are constant 0xFF (no high/sign byte). Direction
        is GEAR_SELECTOR (B14, 2=Reverse now verified). A signed vehicle speed would
        have to be a derived signal (magnitude x gear-direction), not decodable as a
        single WiCAN arithmetic expression — deferred to a downstream/typed approach.
      what_to_test:
        - "B37:B38 and (B39<<8)|B41 centred ~2048 — lateral/longitudinal accel (needs a real moving drive; stayed at centre on both stationary steer captures)"
        - "Confirm wheel front/rear assignment (needs known-corner reference)"
        - "GEAR_SELECTOR Neutral value (expected 3) still unobserved — capture a shift through N"
      sources:
        - "captures/2026-07-22.yaml — driving capture, lots of steering"
        - "captures/2026-07-26.yaml — driveway steer-and-hold capture (resolved B35:B36 = steering angle; verified GEAR_SELECTOR Reverse=2; confirmed speed is unsigned magnitude)"
        - "OBDb Ioniq 5"
    - type: scan
      target: "22 C101-C10F"
      status: done
      priority: P2
      vehicle_states: [ACC]
      notes: "ESC C1xx range scan."
    - type: scan
      target: "22 0101-010F"
      status: nrc
      priority: P2
      vehicle_states: [ACC]
      notes: "ESC 01xx range. 0104 = individual wheel speeds FL/FR/RL/RR per Ioniq 5."
      sources:
        - "OBDb Ioniq 5"
    - type: scan
      target: "22 F010 (on 0x730)"
      status: nrc
      priority: P2
      vehicle_states: [READY]
      notes: "Ioniq 5 uses 0x730 for ESC with 22F010: 4 wheel speeds (16-bit/32), steering angle (/10), lateral/longitudinal accel, yaw rate. Try on both 0x7D1 and 0x730."
      sources:
        - "OBDb Ioniq 5"
