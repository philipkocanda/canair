    - type: verify
      target: "AC charge-current setting (station and portable): encoding and amps"
      status: pending
      priority: P2
      vehicle_states: [PLUGGED, CHARGING]
      created: "2026-10-30"
      updated: "2026-10-30"
      result: >-
        Encoding found in the head-unit firmware (not yet seen on a bus). The EV menu's 'Charge
        Current' has two pages, one for a charging station (internally lowChargeStand) and one for
        the portable cable (chargeConnectCable), each with three radio buttons: Maximum, Reduced,
        Minimum (NL: Maximum, Verlaagd, Minimum). The selected button's index is sent unchanged: 0
        Maximum, 1 Reduced, 2 Minimum. It goes out in the head unit's EV-settings frame HU_EV_PE_00
        (MM-CAN 0x1AA) byte 3: bits 3-2 station, bits 1-0 portable. 3 means 'keep': a charge-current
        change sends bytes 0-2 as 0xFF (drive-mode settings unchanged), and a drive-mode change
        sends byte 3 as 0x0F. The MICOM copies each field to the bus as is. The menu then shows the
        mode the OBC reports back (most likely GW_EV_P_02, MM-CAN 0x55C byte 5 bits 3-2 / 1-0, where
        3 = invalid), so the OBC stores the setting. P-CAN copy not identified: 0x5DF or 0x5B3 (see
        the AVN research entry); both read 0 (Maximum) in byte 3 on uhi22's car. Details:
        ioniq-avn-fw micom-can-findings.md §6.1.
      notes: "Owner car: every stored AC charge (12 days, 7.9-23.9 A pilot) drew 92-97 % of the pilot current, the same ratio at 8 A as at 16-20 A, so all were at Maximum and none shows how much Reduced or Minimum takes off. No OBC 2101 byte differs between the 8 A sessions and the others (OBC_MODE and OBC_SESSION_FLAGS read the same), so how the OBC tells the portable cable from a station is not visible there. Other Hyundai/Kia models are reported at 100/90/60 % or similar, but the Ioniq AE's steps are unmeasured."
      sources:
        - "ioniq-avn-fw EU firmware: GreenCar ChargeElectricSettingActivity and layouts, IviServer GreenCarMessageSetting, com.lge.ivi HuEvPe00/GwEvP02, MICOM 0x1AA setters 0x85E6C/0x85EC2; canair OBC 2101 captures; 2026-10-30"
      what_to_test:
        - "Plugged in at the home wallbox, ignition on (the page needs the OBC awake): set the station current to Reduced, wait 2 minutes, then Minimum, then back to Maximum, pressing 's' at each change. AC_INPUT_A / OBC_PILOT_AMPS gives the real steps, and any OBC 2101/2102 byte that changes in step is the OBC's stored copy."
        - "Repeat on the portable cable with the portable setting, and once more changing only the setting for the cable that is not plugged in: the current should not move."
      capture_protocol: >-
        canair monitor OBC:2101,2102 BMS:2101 --save --keep-all --interval 2 --label 'AC
        charge-current setting steps' --state CHARGING; press s at each menu change and name the
        setting.
    - type: iocontrol_scan
      target: 30 00-FF (LED LIDs 01-04 first)
      status: pending
      priority: P3
      vehicle_states: [PARKED, ACC]
      created: "2026-10-30"
      updated: "2026-10-30"
      notes: >-
        Hypothesis from OVMS (Open Vehicle Monitoring System) Kia Soul EV firmware: BlueChargeLed()
        (vehicle_kiasoulev.cpp:1101-1115) targets the on-board charger (OBC, 0x794 on the Soul) with
        10 81, then 10 90, then KWP2000 30 {led} {00 on | 11 off}, led 1 centre, 2 left, 3 right, 4
        all. If real, 30 {LID} 00 actuates there rather than releasing. The evidence is WEAK (OVMS
        master, read 2026-10-30): the function has no callers; the frame it builds is 08 03 30 {led}
        {00|11} 00 00 00, whose leading 08 is an invalid single-frame length, so it has probably
        never worked as written; nothing returns the session to 10 01. The Soul park-brake 30
        commands (30 02 01 / 30 02 03 / 30 01 01) go to ABS_EBP_UNIT = 0x7A5, the smart key address
        (comments say 7D5), and OVMS's own TODO says park brake service does not work. No captured
        30 traffic exists for any HKMC car. Supporting context from 2021 Kona Car Scanner logs
        (profiles/kona-electric-2019/captures/can/221210-*): the Kona OBC (7E5), VCU and MCU accept
        10 90 (50 90) and reject 10 03 (NRC 12), so 10 90 is the HKMC KWP2000 session. The Ioniq
        session scan (2026-07-22) only tried 81, 82 and 83, so 10 90 is untested here. Do not sweep
        30 on this OBC until the 30 00 semantics are known.
      sources:
        - "OVMS vehicle_kiasoulev: vehicle_kiasoulev.cpp BlueChargeLed(), ks_commands.cpp CommandParkBreakService, ks_can_send.cpp Send_EBP_Command (openvehicles/Open-Vehicle-Monitoring-System-3, read 2026-10-30)"
      what_to_test:
        - "Car parked, ACC, charge port unplugged: use canair raw to open 10 81 then 10 90 on OBC (0x7E5) and check 10 90 is accepted (the hk_90_session quirk permits it); the earlier probe only accepted 0x81. Do not define an iocontrol: entry yet: canair io refuses a 0x30 ON until its release is known."
        - "If 10 90 is accepted: send ONE 30 01 00 and watch the charge-port LED (second person), then 30 01 11. Stop on any unexpected NRC."
      capture_protocol: >-
        canair raw with --save --label 'OBC KWP 30 LED probe' --state ACC; record every request and
        reply. Only LIDs 01-04, never a blind sweep.

