# ─── OBC / LDC (On-Board Charger + Low-Voltage DC-DC Converter) ─────
#
# Combined power unit — self-identifies (KWP2000 1A8C) as "AEEOBC51" → EOBC.
# Part 36400-0E150. Houses BOTH functions and reports both:
# - OBC (On-Board Charger): manages AC charging of the traction battery. Charge-side
#   signals (OBC_CHARGE_V, OBC_OUTPUT_V, OBC_DC_A, pilot duty) are active ONLY while
#   AC charging; they idle to ~0 in READY/driving.
# - LDC (Low-voltage DC-DC Converter): converts HV pack DC → 12V system. The LDC 12V
#   output (LDC_OUTPUT_V ≈ 14.5V) is measured live even while DRIVING with the OBC idle
#   (OBC_DC_A = 0) — proving the LDC hardware lives in this same ECU.
#
# NOTE: this ECU's module code is OBC. The name "VLDC" belongs to the VCU at 0x7E2 —
# that ECU carries the LDC *control* bits (enable/inhibit) but not the LDC measurements.
# The LDC_* vs OBC_* parameter prefixes below tag which sub-function each signal belongs to.

# KWP2000 diagnostic sessions (service 0x10) — probed 2026-07-22, car in READY:
# see the structured `sessions:` field at the end of this ECU block.
# Only 0x81 is accepted; 21xx reads work in the default session too — no session
# unlocks extra data. Payload sizes are session-independent: 2101, 2102 present;
# 2103/2104/2105 → NRC 0x12 (do not exist).

OBC:
  tx_id: 0x7E5
  can_bus: [P-CAN]
  identity:
    alias: LDC  # Combined unit — also houses the LDC (DC-DC converter); reports its 12V output live while driving
    description: On-Board Charger (integrated LDC / DC-DC converter)
    part_number: "36400-0E150"
    ecu_id: AEEOBC51  # KWP2000 1A8C → EOBC
    sw_id: "EAEEH5L-OS3-D000"
    calibration: "00000001"
    id_protocol: KWP2000  # 1Axx
    notes: >
      Combined OBC + LDC power unit (part 36400-0E150). OBC signals (charge voltage/current,
      pilot duty) are active only while AC charging; the LDC (DC-DC) 12V output is measured
      live even while driving with the OBC idle (OBC_DC_A=0) — confirming both functions live
      in this one ECU. The LDC *control* bits (enable/inhibit) live on the VCU (0x7E2, whose
      module code is "VLDC"), not here.

      Specifications:
        - Max charging current: 29A (the 2019 facelift can do 32A, but this is from the 2017 model)
        - Max charging power: 6.6kW

  vehicle_states: [READY, CHARGING, ACC2]
  pids:
    2101:
      response_frames: 7
      status: active
      period: 5000
      vehicle_states: [READY, CHARGING, ACC2]
      parameters:
        LDC_HV_INPUT_V:
          expression: "[B45:B46]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "500"
          source: "Live READY vs charging + BMS cross-check (2026-07-20)"
          source_links: []
          verified: true
          notes: >-
            HV pack voltage at the LDC, present at READY and while charging. r=0.998 vs
            VCU:2102:VCU_INVERTER_INPUT_VOLTAGE (n=5689).

        LDC_OUTPUT_V:
          expression: "[B25:B26]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "20"
          source: "Decoded from live captures (2026-04-14)"
          source_links: []
          verified: true
          notes: >-
            12 V rail: 14.52 V charging, 14.31 V at READY. Sagged 14.5 to 13.6 V and recovered as a
            rear defroster load switched on and off (2026-07-22).

        LDC_TEMP:
          expression: "B19-100"
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "120"
          source: "Kia Soul EV LDC CSV (LDC Temp = i-100) + charging session trend (2026-07-19)"
          source_links: []
          verified: true
          notes: >-
            Rose smoothly 28 to 65 °C over a 3 h AC charge; 21 °C at READY with about 18 °C ambient.

        OBC_CHARGE_V:
          expression: "[B10:B11]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "500"
          source: "Decoded from live captures (2026-04-14)"
          source_links: []
          verified: true
          notes: About 370 V during AC charging, about 6 V when the OBC is idle.

        OBC_OUTPUT_V:
          expression: "[B12:B13]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "500"
          source: "Decoded from live captures (2026-04-14); reclassified 2026-07-20"
          source_links: []
          verified: true
          notes: 353-384 V during AC charging, about 3.8 V when the OBC is idle.



        OBC_DC_A:
          expression: "[B17:B18]/100"
          unit: A
          ha_class: current
          min: "0"
          max: "50"
          source: "Decoded from live captures (2026-04-14)"
          source_links: []
          verified: true
          notes: OBC DC output current while charging; 0 when idle.

        OBC_PILOT_DUTY:
          expression: "[B35:B36]/10"
          unit: "%"
          ha_class: ""
          min: "0"
          max: "100"
          source: Live EVSE current step 10/13/16A (2026-07-27)
          source_links:
            - https://docs.google.com/spreadsheets/d/1R2dW_4-ANg04TQdkHH52-8wdYItBkWDfppcsqOc-m1M
          verified: true
          notes: >-
            J1772 control-pilot duty. Read 16.5, 21.5 and 26.5 % at 10, 13 and 16 A pilot
            (2026-07-27). 100 % when plugged in with no current offered.
        OBC_PILOT_AMPS:
          expression: "[B35:B36]*0.06"
          unit: A
          ha_class: current
          min: "0"
          max: "80"
          source: Live EVSE current step 10/13/16A (2026-07-27); J1772 duty x 0.6
          source_links: []
          verified: true
          notes: >-
            Pilot duty x 0.6. Read 9.9, 12.9 and 15.9 A at 10, 13 and 16 A pilot (2026-07-27); reads
            60 at 100 % duty, when no current is offered.
        # OBC heatsink/inside/water temps (Soul OBC: Signed(S)/(T)/(U)) are NOT exposed on the Ioniq LDC 2101.
        # Previous S15/S16/S17 guesses were bogus: S15/S17 read current bytes (B15/B17), S16 reads the ISO-TP
        # PCI byte 0x22 (=34) — the "static 34°C" was the frame header, not a temperature.
        # 2026-07-20 full 44-byte charging capture (10A AC): the only clean temp is LDC_TEMP (B19-100).
        # Candidate OBC-temp bytes are dead constants during charging (B28=16, B29=32 across all 262 caps of a
        # 3h charge → fixed values/status, not sensors); B21-40 drifts 31→38°C charging but reads implausibly
        # (10°C READY, 14°C after a hot drive) → not a reliable sensor. OBC internal temps likely just aren't
        # broadcast on this ECU/firmware.
        OBC_DC_POWER:
          expression: "[B10:B11]*[B17:B18]/10000000"
          unit: kW
          ha_class: power
          min: "0"
          max: "10"
          source: Derived OBC_CHARGE_V*OBC_DC_A; validated vs wattmeter 2026-07-26
          verified: true
          notes: >-
            OBC_CHARGE_V x OBC_DC_A. Steady 3.30-3.36 kW over the 2026-07-26 16 A AC charge, 0 when
            idle; matched an external wattmeter.
        AC_INPUT_V:
          expression: "[B14:B15]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "300"
          source: Live 16A AC charge 2026-07-26; checked and confirmed accurate
          verified: true
          notes: 218-228 V while charging, about 8.5 V with no EVSE connected.
        AC_INPUT_A:
          expression: "[B33:B34]/100"
          unit: A
          ha_class: current
          min: "0"
          max: "40"
          source: Live EVSE current step 10/13/16A (2026-07-27) + AC power balance
          verified: true
          notes: >-
            Measured AC input current. Read 9.3, 12.4 and 15.4 A at 10, 13 and 16 A pilot
            (2026-07-27), about 0.6 A below OBC_PILOT_AMPS.
        OBC_CHARGE_STATE:
          expression: B20
          type: enum
          values:
            0: not connected / EVSE idle (no pilot PWM)
            2: active charge session (current flowing)
            3: connected/standby (pilot PWM present, not charging)
          source: RE 2026-08-02 AC charge transitions, live ACC2 confirmed; DCFC transitions confirmed 2026-08-08
          verified: true
          notes: >-
            Only 0, 2 and 3 across 11441 captures. 0 not connected (also while driving), 3 connected
            without charging (pilot 100 %), 2 charge session active. Goes 0, 3, 2 at the start of
            both AC and CCS DC charges, even though OBC_DC_A stays 0 during DC charging.
        OBC_EFFICIENCY:
          expression: 100*[B10:B11]*[B17:B18]/([B14:B15]*[B33:B34])
          unit: "%"
          min: "0"
          max: "105"
          source: "Derived: 100 * OBC_DC_POWER*1000 / (AC_INPUT_V*AC_INPUT_A), reduced to raw bytes (2026-08-06)"
          verified: false
          notes: >-
            OBC DC output power over AC apparent power (AC_INPUT_V x AC_INPUT_A). No value when
            AC_INPUT_A is 0. Mean 98.1 % at about 4.4 kW AC input (2026-08-05, n=1317), against 95 %
            from the wattmeter check at about 3.5 kW (2026-07-26).
        OBC_AC_NOT_CONNECTED:
          expression: B22:0
          min: "0"
          max: "1"
          source: canair cross-tab vs BMS 2101 B14 and VCU 2101, 2026-10-23; JejuSoul US Ioniq logs
          verified: false
          notes: >-
            0 while an AC charge cable is connected, 1 otherwise, including DC fast charging. The
            complement of BMS 2101 AC_CHARGER_CONNECTED in all 10304 aligned rows (3 s join),
            whether charging or not and with or without the ignition. In the US AC-charge logs it
            fell at plug-in before charging began and rose at the end of the log, with
            VCU_POWER_STATE 2; the test plan ends with removing the cable, and which of unplugging
            or power-off raised it is not recorded. The factory wiring has the OBC driving the IG3
            #1 relay coil, which is open during charging, so this may be that output; not shown.
        OBC_MODE:
          expression: B23
          type: enum
          values:
            115: dc_charging
            186: ac_charging
            187: ac_charging
            188: idle
            189: idle
          source: canair cross-tab vs BMS 2101 B14 and VCU 2101, 2026-10-23; JejuSoul US Ioniq logs
          verified: false
          notes: >-
            Values across 11474 captures: 0xBC/0xBD idle (READY, 12 V top-up, plugged but not
            charging), 0xBA/0xBB AC charging, 0x73 in every row of both recorded DC fast charges
            (2026-08-08, 5 and 49 rows, from before the BMS closed its contactors). Bit 0 alternates
            between reads in the idle and AC states. The US logs add 0xB8 at power-up and 0x70,
            0x74, 0x75 and 0x80 around AC plug-in and charge end.
        OBC_DC_CHARGE_MODE:
          expression: B23:6
          min: "0"
          max: "1"
          source: canair cross-tab vs BMS 2101 B14 and VCU 2101, 2026-10-23; JejuSoul US Ioniq logs
          verified: false
          notes: >-
            1 only during DC fast charging: all 54 OBC rows aligned with BMS 2101 B14 = 0x40/0xC3 on
            2026-08-08, and the CCS log in the US data; 0 in every other state.
        OBC_SESSION_FLAGS:
          expression: B37
          type: enum
          values:
            96: unplugged
            114: plugged_not_charging
            118: charging
            122: post_charge_122
            126: post_charge_126
          source: canair cross-tab vs BMS 2101 B14 and VCU 2101, 2026-10-23; JejuSoul US Ioniq logs
          verified: false
          notes: >-
            0x60 in all 2248 rows aligned with an unplugged BMS (B14 = 0x03); 0x72, 0x76, 0x7A or
            0x7E whenever a cable is connected, AC or DC. 0x76 in 7942 of 7971 rows with the BMS
            charging, 0x72 mostly connected without charging, 0x7A and 0x7E in a few rows after a
            charge ended. The US logs add 0x62 (just after an AC plug-in) and 0x68.
        OBC_CABLE_SESSION:
          expression: B37:4
          min: "0"
          max: "1"
          source: canair cross-tab vs BMS 2101 B14 and VCU 2101, 2026-10-23; JejuSoul US Ioniq logs
          verified: false
          notes: >-
            1 whenever a charge cable is connected, AC or DC, and 0 unplugged, in every row aligned
            with BMS 2101 (see OBC_SESSION_FLAGS). In the US logs it read 0 for one sample just
            after an AC plug-in (0x62).
    2102:
      status: static
      period: 5000
      vehicle_states: [CHARGING, ACC2]
      notes: >-
        34 bytes. Byte-identical across 2316 captures in every state: a calibration table (6-byte
        header and 7 groups of 4 bytes whose third byte is always 0x79). Answers while charging and
        in ACC2; NRC with the car fully off.
      parameters: {}

  research:
    - type: decode
      target: "2101"
      status: captured
      priority: P1
      vehicle_states: [READY, CHARGING]
      notes: >-
        2026-07-20 (Kia Soul LDC/OBC CSV + live READY vs 10A-AC charging + BMS cross-check):
        LDC_HV_INPUT_V = [B45:B46]/100 (385.7V READY / 386.9V charging = BMS pack 385.6V),
        LDC_TEMP=B19-100 (21→65°C over 3h, live 27°C), reclassified [B12:B13]→OBC_OUTPUT_V (≈pack
        when charging, idle in READY), OBC_CHARGE_V [B10:B11]=397V (charge > pack), OBC_DC_A=5.2A
        (≈BMS charge current), LDC_OUTPUT_V=14.15V (=BMS aux 14.2V), pilot 10% at 10A AC. Removed
        bogus OBC temps (S15/S17=current, S16=PCI 0x22) + OBC_AC_INPUT_V(=B15 current). CONCLUSION:
        OBC internal temps are NOT broadcast — the full 44-byte charging response has no heatsink/
        inside/water temp (candidate bytes B28=16/B29=32 are dead constants; B21 unreliable). Only
        LDC_TEMP exists.
      what_to_test:
        - "CONFIRMED 2026-07-30: LDC_HV_INPUT_V tracks BMS pack r=+1.000 (n=775) across SOC 71→95% (373→399V) in the long AC-charge session — wider-SOC cross-check done."
        - "Confirm OBC_OUTPUT_V ([B12:B13]) vs OBC_CHARGE_V ([B10:B11]) semantics against a DC meter"
        - "CORRECTED 2026-07-27: pilot duty/amps are [B35:B36]/10 and [B35:B36]*0.06 (clean; verified by a 10/13/16A EVSE step), NOT B47/3-B47/5. B47 was a noisy instantaneous pilot ADC sample that never tracked the real duty."
      sources:
        - "Kia Soul EV LDC CSV (0x7C5 2101) + OBC CSV (0x794 2102)"
        - "Kia Niro PR#660"
    - type: decode
      target: "2102"
      status: done
      priority: P3
      vehicle_states: [CHARGING]
      date: "2026-04-19"
      notes: >
        34 bytes captured during charging. Payload identical across Apr 14 and Apr 19 sessions —
        static factory calibration data, not live measurements. Structure after header (6102 FFFC 0000):
        7 pairs of uint16 big-endian values alternating (variable, 79xx reference).
        Variable values: 684F, 694A, 6E84, 650F, 7499, 7293, 7482 (range 25871-29849).
        Reference values: 792A, 7928, 7927, 791B, 791F, 792B, 7931 (range 30971-30993).
        Likely ADC calibration table. Low priority — no live data value.
    - type: scan
      target: "22 E001-E011"
      status: done
      priority: P2
      vehicle_states: [CHARGING]
      date: "2026-04-19"
      notes: "All 17 DIDs return NRC 0x12 (subFunctionNotSupported) — both default and extended session. LDC also rejects 10 03 with NRC 0x12. Service 22 not supported on Ioniq 2017 LDC. Ioniq 5 cross-ref does not apply."
      sources:
        - "OBDb Ioniq 5"
    - type: scan
      target: "21 01-20"
      status: done
      priority: P2
      vehicle_states: [CHARGING]
      date: "2026-07-20"
      notes: >
        Service 21 scan 0x01-0x20 while charging (10A AC): ONLY 2101 (44B; this 2026-07-20 wican-ws
        reading showed 48B = 44 B + 4 ELM327 padding bytes — real length 44 B, confirmed in the
        2026-07-30 CHARGING session) and 2102 (34B, static calib) respond;
        all others NRC. No hidden OBC/charging PIDs on 0x7E5.
    - type: decode
      target: "2101 AC-side"
      status: done
      priority: P3
      vehicle_states: [CHARGING]
      date: "2026-07-20"
      notes: >
        AC INPUT VOLTAGE FOUND 2026-07-26 = [B14:B15]/100 (see AC_INPUT_V param). This OVERTURNS the
        2026-07-20 "no ~230V AC voltage" negative: B14 is NOT a fixed status byte — it is the voltage
        integer byte (steps 85-88 = 218-228V), and B15 is the low byte (the ex-OBC_UNKNOWN_B15). Reads
        ~222V during charging (218-228V across all charging history), idles ~8.5V in READY (EVSE off).
        Mean 221.8V vs calibrated grid 225.5V = ~3V IR drop at ~15A — why the 2026-07-20 constant-voltage
        hunt missed it (wrong absolute level; the byte tracks the inlet, not the grid connection).
        2026-07-27 EVSE current step (10/13/16/20A) resolved the rest: PILOT DUTY = [B35:B36]/10
        (16.5/21.5/26.5% — clean; REPLACES the noisy B47/3), advertised setpoint = duty*0.6 = [B35:B36]*0.06
        (OBC_PILOT_AMPS), and MEASURED AC current = [B33:B34]/100 (AC_INPUT_A: 9.3/12.4/15.4A, ~0.6A below
        the pilot, matches the power balance). B34 is the low byte of that current word — it looked
        "constant 250" on the steady 16A charge only because the current never moved. B28 (was
        AC_CURRENT_SETPOINT) is BOGUS — fixed at 16 across 10/13/16A, so removed. B29=32/B31=200/B37=118
        meaning still unknown (B31=200 is NOT a 20A limit — OBC rated 29A/2017, 32A/2019 facelift).
      what_to_test:
        - "Identify meaning of charging-only constants B28=16, B29=32, B31=200, B37=118 (charge state/config?)"
      updated: "2026-07-27"
      result: >
        2026-07-26 steady 16A AC charge (OBC_DC_A ~8.7A, DC power ~3.33kW held for ~90min):
        B34 sat essentially CONSTANT at ~250 (0xFA) — distinct=7, median 250 across 1160 caps
        (the few non-250 values are the charge start/stop transitions). This does NOT continue
        the earlier 161@5A / 104@6A / 18@14A downward trend, confirming those earlier readings
        were unsettled post-step transients (as suspected). Under steady charge B34 pins high
        (~250); still unresolved (OBC control/duty/headroom candidate). Also validated the new
        OBC_DC_POWER = OBC_CHARGE_V*OBC_DC_A = 3.33kW against the external wattmeter (3.44-3.56kW
        AC => ~95% AC/DC efficiency; DC out = BMS pack intake 3.10kW + ~0.15kW LDC 12V load).
    - type: scan
      target: 21 00-FF
      status: done
      priority: P3
      vehicle_states: [READY]
      date: "2026-07-22"
      result: "Exhaustive service-21 LID sweep (ignition on, OBC idle): only 01/02 respond (= known 2101/2102), all 254 others NRC. No hidden pages; notably NO 21F2 (unlike BMS/MCU/VCU). OBC service-21 space fully mapped."
      notes: Hidden-page hunt 2026-07-22 (KWP2000 completion after BMS/MCU/VCU).
    - type: decode
      target: 2101 AC input current
      status: done
      priority: P3
      vehicle_states: [CHARGING]
      created: "2026-07-27"
      updated: "2026-07-27"
      notes: "RESOLVED 2026-07-27 via an EVSE current step (10/13/16/20A). MEASURED AC input current = [B33:B34]/100 (AC_INPUT_A): 9.3/12.4/15.4A at 10/13/16A pilot — the actual draw, ~0.6A under the advertised limit, matching the power balance V_dc*I_dc/eff/V_ac. Its low byte B34 was the ex-'constant 250' from the steady 16A charge (only varied once the current stepped). The EVSE-advertised setpoint/pilot = [B35:B36] (duty [B35:B36]/10, amps [B35:B36]*0.06 = OBC_PILOT_AMPS). B28 (old AC_CURRENT_SETPOINT) was BOGUS (fixed 16) and removed."
    - type: decode
      target: 2101 12V output current
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-28"
      updated: "2026-07-30"
      result: >
        DECISIVE EXPERIMENT SUBSTANTIALLY DONE 2026-07-30. The READY 12V-load-toggling sessions
        (10:16-10:28, defroster/HVAC-front/"changing DC loads") co-polled OBC:2101 + VCU:2102 +
        BMS:2101 with the OBC idle, giving the strongest 12V-load stimulus yet: VCU_AUX_POWER swung
        137->651W (stdev 202). Under that swing, the ONLY OBC 2101 byte that moved was the LDC_OUTPUT_V
        word [B25:B26] SAGGING (B26 r=-0.635 vs load, `hunt` fit slope -28/W) — textbook Ohm's-law droop
        (V=V0-I*R), NOT a current. Every other OBC byte stayed flat. So even under a ~4.5x load swing NO
        independent current byte exists — the hidden-byte hypothesis is now firmly closed. The 2026-07-30
        CHARGING session (12:20-15:03, steady) agreed: hunt vs VCU_AUX_POWER returned only already-mapped
        charge-side signals (B14=AC_INPUT_V, B33/B34=AC_INPUT_A) + state flags; charging LDC_OUTPUT_V
        near-constant 12.3-12.8V so no droop there.
        DERIVATION validated 3 ways (READY window): (1) LDC_output_A = VCU_AUX_POWER / LDC_OUTPUT_V =
        9.4A (137W/14.59V) .. 47.9A (651W/13.60V), mean ~26A; (2) Ohm droop cross-check: rail sags
        dV~0.99V over dI~38A => source R ~26 mohm, physically sound for a 12V bus (LDC out + cabling +
        aux-batt internal R); (3) BMS AUX_BATTERY_VOLTAGE (13.5-14.5V) tracks LDC_OUTPUT_V, and pack
        BATTERY_POWER/BATTERY_CURRENT rise with the load r=0.97 (pack feeds the LDC in READY) — but pack
        mean 0.92kW >> LDC-out mean 0.36kW, the ~0.5kW excess is the HV AC compressor co-toggled with the
        HVAC, so pack current is NOT a clean LDC-input proxy here (confounded). VCU_AUX_POWER also tracks
        HVAC_BLOWER_FAN_SPEED r=0.95 — reconfirms it is a real 12V accessory power. CAVEATS: keep:unique
        (rising-edge only); loads were HVAC (blower 12V + compressor HV) not a pure 12V-only step; the
        derived current is cross-ECU (VCU power / OBC voltage) so not a single WiCAN expression, and
        VCU_AUX_POWER is still unverified (climate/electronics/total unresolved) so the derived current
        inherits that uncertainty.
      notes: >-
        LDC 12V output CURRENT is NOT broadcast in OBC 2101. RE-CONFIRMED 2026-07-28 (three
        independent methods): (1) 2026-07-22 rear-defroster load step re-analysed via the exact byte
        matrix — an ~18A load (LDC_OUTPUT_V rail sagged 14.50->13.60V, B26 170->80) moved ONLY the
        voltage low byte; every other byte stayed within baseline jitter (B15 +2, B13 +3, all others
        flat). (2) decode --discriminate state --bytes: every current-like byte
        (B12/B17/B18/B28/B33/B34/B39/B51) reads exactly 0 in ready/driving = all CHARGE-side
        currents; an LDC output current must be non-zero whenever the car is awake, and no such byte
        exists. (3) investigate OBC 2101: every byte resolves to a charge/port-lock/EV-ready flag,
        temp, or checksum; every physical-band hit is a VOLTAGE, never a current. Soul standalone
        LDC 0x7C5 has DC_Current_Out (letter g) but its f/g/h/i block does NOT map contiguously onto
        the Ioniq OBC 2101 (only Temp survives at B19) — same redistribution that dropped the OBC
        internal temps. VCU 2101=drive-path only; VCU 2102=inverter/aux voltage, aux power and fast
        load-tracking bytes (no LDC current); VCU 21F2=mixed block of live bytes and
        session-constant bytes. Exhaustive 21 00-FF sweeps on OBC+VCU found no hidden page; 22xxxx
        all NRC. (4) 2ND PASS 2026-07-28 Ohm's-law droop test: `hunt OBC 2101 --against
        LDC_OUTPUT_V` finds NO independent byte anti-correlated with the 12V rail — only S26
        (r=-0.58), which is the voltage word's own low byte. A real output current would droop the
