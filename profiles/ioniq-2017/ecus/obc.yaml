# ─── OBC / LDC (On-Board Charger + Low-Voltage DC-DC Converter) ─────
#
# Combined power unit at 0x7E5 — self-identifies (KWP2000 1A8C) as "AEEOBC51" → EOBC.
# Part 36400-0E150. Houses BOTH functions and reports both:
# - OBC (On-Board Charger): manages AC charging of the traction battery. Charge-side
#   signals (OBC_CHARGE_V, OBC_OUTPUT_V, OBC_DC_A, pilot duty) are active ONLY while
#   AC charging; they idle to ~0 in READY/driving.
# - LDC (Low-voltage DC-DC Converter): converts HV pack DC → 12V system. The LDC 12V
#   output (LDC_OUTPUT_V ≈ 14.5V) is measured live even while DRIVING with the OBC idle
#   (OBC_DC_A = 0) — proving the LDC hardware lives in this same ECU.
#
# NOTE: this ECU's module code is OBC. The name "VLDC" belongs to the VCU at 0x7E2 —
# that ECU carries the LDC *control* bits (enable/inhibit) but not the LDC measurements.
# The LDC_* vs OBC_* parameter prefixes below tag which sub-function each signal belongs to.
#
# Response to PID 2101 is 48 ISO-TP bytes (56 WiCAN bytes).
# PID 2103 returns NRC 0x12 (subFunctionNotSupported) — does not exist on Ioniq 2017.
# Original Niro PR#716 formulas (B52-B55, B60-B61) are WRONG for Ioniq —
# they reference bytes beyond the Ioniq's shorter response (zero padding / OOB).
# Correct byte offsets decoded from live captures during AC charging (2026-04-14).
#
# KWP2000 diagnostic sessions (service 0x10) — probed 2026-07-22, car in READY:
# see the structured `sessions:` field at the end of this ECU block.
# Only 0x81 is accepted; 21xx reads work in the default session too — no session
# unlocks extra data. Payload sizes are session-independent: 2101, 2102 present;
# 2103/2104/2105 → NRC 0x12 (do not exist, consistent with the 2103 note above).
#
# OBC Specs:
# - Max charging current: 29A (the 2019 facelift can do 32A, but this is from the 2017 model)
# - Max charging power: 6.6kW
#
OBC:
  tx_id: 0x7E5
  identity:
    alias: LDC  # Combined unit — also houses the LDC (DC-DC converter); reports its 12V output live while driving
    description: On-Board Charger (integrated LDC / DC-DC converter)
    part_number: "36400-0E150"
    ecu_id: AEEOBC51  # KWP2000 1A8C → EOBC
    sw_id: "EAEEH5L-OS3-D000"
    calibration: "00000001"
    id_protocol: KWP2000  # 1Axx
    notes: >
      Combined OBC + LDC power unit (part 36400-0E150). OBC signals (charge voltage/current,
      pilot duty) are active only while AC charging; the LDC (DC-DC) 12V output is measured
      live even while driving with the OBC idle (OBC_DC_A=0) — confirming both functions live
      in this one ECU. The LDC *control* bits (enable/inhibit) live on the VCU (0x7E2, whose
      module code is "VLDC"), not here.
  vehicle_states:
    - ready
    - charging
    - acc2
  pids:
    2101:
      status: active
      period: 5000
      vehicle_states:
        - ready
        - charging
        - acc2
      parameters:
        LDC_HV_INPUT_V:
          expression: "[B45:B46]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "500"
          source: "Live READY vs charging + BMS cross-check (2026-07-20)"
          source_links: []
          verified: true
          notes: >
            HV battery (pack) voltage at the LDC — the always-present DC-link. 2026-07-20: reads 385.7V in
            READY and 386.9V charging, matching BMS BATTERY_VOLTAGE (385.6V) — present in BOTH states, unlike
            the OBC charge-side senses ([B10:B11], [B12:B13]) which idle to ~0-6V in READY. (Earlier guesses
            [B12:B13]/100 and B23*2 were wrong: [B12:B13] is OBC-only; B23*2≈372-378V doesn't track pack.)
            ISO-TP bytes 0x26-0x27 — only in the full 48-byte response. Cross-check at one SOC (~85%) only.

        LDC_OUTPUT_V:
          expression: "[B25:B26]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "20"
          source: "Decoded from live captures (2026-04-14)"
          source_links: []
          verified: true
          notes: "LDC 12V system output voltage. 14.52V charging / 14.31V READY — correct for 12V system. ISO-TP bytes 20-21. Load-test confirmed 2026-07-22: sagged 14.5→13.6→14.5V as a rear-defroster (~15-20A) load was switched ON→OFF, i.e. the real 12V rail."

        LDC_TEMP:
          expression: "B19-100"
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "120"
          source: "Kia Soul EV LDC CSV (LDC Temp = i-100) + charging session trend (2026-07-19)"
          source_links: []
          verified: true
          notes: >
            LDC/converter temperature. 2026-07-20: corrected from B21-40 (which varies too much → not a temp).
            B19-100 = 21°C at READY (≈18°C ambient) and rises smoothly 28→65°C over a 3h AC charge (10:45→13:50)
            — textbook thermal behaviour; live 10A-AC charge read 27°C. Matches Soul LDC "-100" offset. ISO-TP byte 0x0f.

        OBC_CHARGE_V:
          expression: "[B10:B11]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "500"
          source: "Decoded from live captures (2026-04-14)"
          source_links: []
          verified: true
          notes: "OBC charge voltage into battery. ~370V during AC charging, ~6V idle (READY). ISO-TP bytes 7-8."

        OBC_OUTPUT_V:
          expression: "[B12:B13]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "500"
          source: "Decoded from live captures (2026-04-14); reclassified 2026-07-20"
          source_links: []
          verified: true
          notes: >
            OBC DC output voltage (charge-side). ~353-384V during AC charging, but only ~3.8V in READY (OBC idle)
            — which is why it is NOT the LDC HV input (see LDC_HV_INPUT_V = B23*2). Was previously mislabelled
            LDC_HV_INPUT_V. ISO-TP bytes 9-10.



        OBC_DC_A:
          expression: "[B17:B18]/100"
          unit: A
          ha_class: current
          min: "0"
          max: "50"
          source: "Decoded from live captures (2026-04-14)"
          source_links: []
          verified: true
          notes: "OBC DC output current during charging. ~2.85A (close to BMS charging current ~2.6A), 0A idle. ISO-TP bytes 13-14."

        OBC_PILOT_DUTY:
          expression: "[B35:B36]/10"
          unit: "%"
          ha_class: ""
          min: "0"
          max: "100"
          source: Live EVSE current step 10/13/16A (2026-07-27)
          source_links:
            - https://docs.google.com/spreadsheets/d/1R2dW_4-ANg04TQdkHH52-8wdYItBkWDfppcsqOc-m1M
          verified: true
          notes: >
            J1772 control-pilot duty %. Verified 2026-07-27 EVSE step: 16.5/21.5/26.5% at 10/13/16A pilot (J1772 amps/0.6 = 16.7/21.7/26.7%). REPLACES the old B47/3, which was a noisy instantaneous pilot ADC sample (read ~28-40% regardless of the real duty). [B35:B36] is the clean filtered value; ISO-TP 0x1D-0x1E.
        OBC_PILOT_AMPS:
          expression: "[B35:B36]*0.06"
          unit: A
          ha_class: current
          min: "0"
          max: "80"
          source: Live EVSE current step 10/13/16A (2026-07-27); J1772 duty x 0.6
          source_links: []
          verified: true
          notes: >
            EVSE-advertised max AC current (the negotiated pilot setpoint) = pilot-duty x 0.6. Verified 2026-07-27 EVSE step: 9.9/12.9/15.9A at 10/13/16A pilot. The car's ACTUAL draw is AC_INPUT_A (~0.6A less). REPLACES the old B47/5 (noisy instantaneous). Same source bytes as OBC_PILOT_DUTY (ISO-TP 0x1D-0x1E).
        # OBC heatsink/inside/water temps (Soul OBC: Signed(S)/(T)/(U)) are NOT exposed on the Ioniq LDC 2101.
        # Previous S15/S16/S17 guesses were bogus: S15/S17 read current bytes (B15/B17), S16 reads the ISO-TP
        # PCI byte 0x22 (=34) — the "static 34°C" was the frame header, not a temperature.
        # 2026-07-20 full 48-byte charging capture (10A AC): the only clean temp is LDC_TEMP (B19-100).
        # Candidate OBC-temp bytes are dead constants during charging (B28=16, B29=32 across all 262 caps of a
        # 3h charge → fixed values/status, not sensors); B21-40 drifts 31→38°C charging but reads implausibly
        # (10°C READY, 14°C after a hot drive) → not a reliable sensor. OBC internal temps likely just aren't
        # broadcast on this ECU/firmware.
        OBC_DC_POWER:
          expression: "[B10:B11]*[B17:B18]/10000000"
          unit: kW
          ha_class: power
          min: "0"
          max: "10"
          source: Derived OBC_CHARGE_V*OBC_DC_A; validated vs wattmeter 2026-07-26
          verified: true
          notes: >
            OBC DC output power to the HV bus = OBC_CHARGE_V * OBC_DC_A ([B10:B11]/100 * [B17:B18]/100 / 1000). Steady 3.30-3.36 kW across the 2026-07-26 16A AC charge, 0 when idle. Energy balance: OBC DC out 3.33kW = BMS BATTERY_POWER 3.10kW (into pack) + ~0.15kW LDC 12V load (14.5V*~10A); AC input measured 3.44-3.56kW => ~95% AC/DC charger efficiency. Both input params verified, product matches the external wattmeter.
        AC_INPUT_V:
          expression: "[B14:B15]/100"
          unit: V
          ha_class: voltage
          min: "0"
          max: "300"
          source: Live 16A AC charge 2026-07-26 + calibrated grid voltage
          verified: true
          notes: >
            AC mains input (RMS) at the OBC inlet. ~222V during charging (218-228V across all charging history), idles ~8.5V in READY with EVSE disconnected (B14=3), like the other OBC senses.
            Confirmed against calibrated measurements from grid connection meter.
        AC_INPUT_A:
          expression: "[B33:B34]/100"
          unit: A
          ha_class: current
          min: "0"
          max: "40"
          source: Live EVSE current step 10/13/16A (2026-07-27) + AC power balance
          verified: true
          notes: >
            Measured AC input current (actual grid draw). Verified 2026-07-27 EVSE pilot step 10/13/16A -> 9.3/12.4/15.4A: tracks the pilot ~0.6A below the advertised limit and matches the power balance V_dc*I_dc/eff/V_ac. Low byte B34 is the ex-'constant 250 (0xFA)' from the steady 16A charge — it only varied once the current stepped. ISO-TP 0x1B-0x1C.


    2102:
      status: draft
      period: 5000
      vehicle_states:
        - charging
        - acc2
      notes: >
        34 bytes. Also responds in ACC2 (not just charging). Returns NRC when car is fully off.
        Discovered during charging PID scan (2026-04-18).
        Raw payload: 6102FFFC0000684F792A694A79286E847927650F791B7499791F7293792B...
        Undecoded — needs analysis.
      parameters: {}

  research:
    - type: decode
      target: "2101"
      status: captured
      priority: P1
      vehicle_states:
        - ready
        - charging
      notes: >
        2026-07-20 (Kia Soul LDC/OBC CSV + live READY vs 10A-AC charging + BMS cross-check): LDC_HV_INPUT_V
        = [B45:B46]/100 (385.7V READY / 386.9V charging = BMS pack 385.6V), LDC_TEMP=B19-100 (21→65°C over 3h,
        live 27°C), reclassified [B12:B13]→OBC_OUTPUT_V (≈pack when charging, idle in READY), OBC_CHARGE_V
        [B10:B11]=397V (charge > pack), OBC_DC_A=5.2A (≈BMS charge current), LDC_OUTPUT_V=14.15V (=BMS aux 14.2V),
        pilot 10% at 10A AC. Removed bogus OBC temps (S15/S17=current, S16=PCI 0x22) + OBC_AC_INPUT_V(=B15 current).
        CONCLUSION: OBC internal temps are NOT broadcast — the full 48-byte charging response has no heatsink/
        inside/water temp (candidate bytes B28=16/B29=32 are dead constants; B21 unreliable). Only LDC_TEMP exists.
      what_to_test:
        - "Confirm LDC_HV_INPUT_V [B45:B46] tracks pack across a wider SOC range (only cross-checked at ~85%)"
        - "Confirm OBC_OUTPUT_V ([B12:B13]) vs OBC_CHARGE_V ([B10:B11]) semantics against a DC meter"
        - "CORRECTED 2026-07-27: pilot duty/amps are [B35:B36]/10 and [B35:B36]*0.06 (clean; verified by a 10/13/16A EVSE step), NOT B47/3-B47/5. B47 was a noisy instantaneous pilot ADC sample that never tracked the real duty."
      sources:
        - "Kia Soul EV LDC CSV (0x7C5 2101) + OBC CSV (0x794 2102)"
        - "Kia Niro PR#660"
    - type: decode
      target: "2102"
      status: done
      priority: P3
      vehicle_states:
        - charging
      date: "2026-04-19"
      notes: >
        34 bytes captured during charging. Payload identical across Apr 14 and Apr 19 sessions —
        static factory calibration data, not live measurements. Structure after header (6102 FFFC 0000):
        7 pairs of uint16 big-endian values alternating (variable, 79xx reference).
        Variable values: 684F, 694A, 6E84, 650F, 7499, 7293, 7482 (range 25871-29849).
        Reference values: 792A, 7928, 7927, 791B, 791F, 792B, 7931 (range 30971-30993).
        Likely ADC calibration table. Low priority — no live data value.
    - type: scan
      target: "22 E001-E011"
      status: done
      priority: P2
      vehicle_states:
        - charging
      date: "2026-04-19"
      notes: "All 17 DIDs return NRC 0x12 (subFunctionNotSupported) — both default and extended session. LDC also rejects 10 03 with NRC 0x12. Service 22 not supported on Ioniq 2017 LDC. Ioniq 5 cross-ref does not apply."
      sources:
        - "OBDb Ioniq 5"
    - type: scan
      target: "21 01-20"
      status: done
      priority: P2
      vehicle_states:
        - charging
      date: "2026-07-20"
      notes: >
        Service 21 scan 0x01-0x20 while charging (10A AC): ONLY 2101 (48B) and 2102 (34B, static calib) respond;
        all others NRC. No hidden OBC/charging PIDs on 0x7E5.
    - type: decode
      target: "2101 AC-side"
      status: done
      priority: P3
      vehicle_states:
        - charging
      date: "2026-07-20"
      notes: >
        AC INPUT VOLTAGE FOUND 2026-07-26 = [B14:B15]/100 (see AC_INPUT_V param). This OVERTURNS the
        2026-07-20 "no ~230V AC voltage" negative: B14 is NOT a fixed status byte — it is the voltage
        integer byte (steps 85-88 = 218-228V), and B15 is the low byte (the ex-OBC_UNKNOWN_B15). Reads
        ~222V during charging (218-228V across all charging history), idles ~8.5V in READY (EVSE off).
        Mean 221.8V vs calibrated grid 225.5V = ~3V IR drop at ~15A — why the 2026-07-20 constant-voltage
        hunt missed it (wrong absolute level; the byte tracks the inlet, not the grid connection).
        2026-07-27 EVSE current step (10/13/16/20A) resolved the rest: PILOT DUTY = [B35:B36]/10
        (16.5/21.5/26.5% — clean; REPLACES the noisy B47/3), advertised setpoint = duty*0.6 = [B35:B36]*0.06
        (OBC_PILOT_AMPS), and MEASURED AC current = [B33:B34]/100 (AC_INPUT_A: 9.3/12.4/15.4A, ~0.6A below
        the pilot, matches the power balance). B34 is the low byte of that current word — it looked
        "constant 250" on the steady 16A charge only because the current never moved. B28 (was
        AC_CURRENT_SETPOINT) is BOGUS — fixed at 16 across 10/13/16A, so removed. B29=32/B31=200/B37=118
        meaning still unknown (B31=200 is NOT a 20A limit — OBC rated 29A/2017, 32A/2019 facelift).
      what_to_test:
        - "Identify meaning of charging-only constants B28=16, B29=32, B31=200, B37=118 (charge state/config?)"
      updated: "2026-07-27"
      result: >
        2026-07-26 steady 16A AC charge (OBC_DC_A ~8.7A, DC power ~3.33kW held for ~90min):
        B34 sat essentially CONSTANT at ~250 (0xFA) — distinct=7, median 250 across 1160 caps
        (the few non-250 values are the charge start/stop transitions). This does NOT continue
        the earlier 161@5A / 104@6A / 18@14A downward trend, confirming those earlier readings
        were unsettled post-step transients (as suspected). Under steady charge B34 pins high
        (~250); still unresolved (OBC control/duty/headroom candidate). Also validated the new
        OBC_DC_POWER = OBC_CHARGE_V*OBC_DC_A = 3.33kW against the external wattmeter (3.44-3.56kW
        AC => ~95% AC/DC efficiency; DC out = BMS pack intake 3.10kW + ~0.15kW LDC 12V load).
    - type: scan
      target: 21 00-FF
      status: done
      priority: P3
      vehicle_states:
        - ready
      date: "2026-07-22"
      result: "Exhaustive service-21 LID sweep (ignition on, OBC idle): only 01/02 respond (= known 2101/2102), all 254 others NRC. No hidden pages; notably NO 21F2 (unlike BMS/MCU/VCU). OBC service-21 space fully mapped."
      notes: Hidden-page hunt 2026-07-22 (KWP2000 completion after BMS/MCU/VCU).
    - type: decode
      target: 2101 AC input current
      status: done
      priority: P3
      vehicle_states: [charging]
      created: "2026-07-27"
      updated: "2026-07-27"
      notes: "RESOLVED 2026-07-27 via an EVSE current step (10/13/16/20A). MEASURED AC input current = [B33:B34]/100 (AC_INPUT_A): 9.3/12.4/15.4A at 10/13/16A pilot — the actual draw, ~0.6A under the advertised limit, matching the power balance V_dc*I_dc/eff/V_ac. Its low byte B34 was the ex-'constant 250' from the steady 16A charge (only varied once the current stepped). The EVSE-advertised setpoint/pilot = [B35:B36] (duty [B35:B36]/10, amps [B35:B36]*0.06 = OBC_PILOT_AMPS). B28 (old AC_CURRENT_SETPOINT) was BOGUS (fixed 16) and removed."
    - type: decode
      target: 2101 12V output current
      status: pending
      priority: P3
      vehicle_states: [ready]
      created: "2026-07-28"
      updated: "2026-07-28"
      notes: "LDC 12V output CURRENT is NOT broadcast in OBC 2101. RE-CONFIRMED 2026-07-28 (three independent methods): (1) 2026-07-22 rear-defroster load step re-analysed via the exact byte matrix — an ~18A load (LDC_OUTPUT_V rail sagged 14.50->13.60V, B26 170->80) moved ONLY the voltage low byte; every other byte stayed within baseline jitter (B15 +2, B13 +3, all others flat). (2) decode --discriminate state --bytes: every current-like byte (B12/B17/B18/B28/B33/B34/B39/B51) reads exactly 0 in ready/driving = all CHARGE-side currents; an LDC output current must be non-zero whenever the car is awake, and no such byte exists. (3) investigate OBC 2101: every byte resolves to a charge/port-lock/EV-ready flag, temp, or checksum; every physical-band hit is a VOLTAGE, never a current. Soul standalone LDC 0x7C5 has DC_Current_Out (letter g) but its f/g/h/i block does NOT map contiguously onto the Ioniq OBC 2101 (only Temp survives at B19) — same redistribution that dropped the OBC internal temps. VCU 2101=drive-path only; VCU 2102=inverter/aux voltage + charge-time + fast phase-current bytes (no LDC current); VCU 21F2=MIXED block, NOT static — many live analog bytes plus a charge-schedule config region (WiCAN B38/B39/B41/B42/B43 packed + B75 = weekend-end hour), confirmed by a 2026-07-28 before/after when the AVN/IVI charge timer was reprogrammed (see VCU 21F2 research entry). Exhaustive 21 00-FF sweeps on OBC+VCU found no hidden page; 22xxxx all NRC. (4) 2ND PASS 2026-07-28 Ohm's-law droop test: `hunt OBC 2101 --against LDC_OUTPUT_V` finds NO independent byte anti-correlated with the 12V rail — only S26 (r=-0.58), which is the voltage word's own low byte. A real output current would droop the rail (V=V0-I*R) and surface here; nothing does. (5) 2ND PASS 2026-07-28 examined VCU 21F2 live analog bytes (the newly-opened mixed block): B29-B34 are drive/charge HV-side data (=0 when idle-parked, so NOT the always-on LDC 12V output); B10/B14/B19/B20 are fast-aliased/counter bytes (B19~=B20 mirror); B11=103/104 slow counter. None fits an LDC output current (must be nonzero whenever awake + load-tracking). Only 4 unique 21F2 payloads currently (keep-unique; NO charging capture in the set), too sparse to fully rule in/out. MCU 2102 currents are motor phase-current; Unknown-746=4 static bytes; no broadcast-CAN (domain B) logs exist."
      what_to_test:
        - "DECISIVE UNTESTED EXPERIMENT: the 2026-07-22 defroster load step polled OBC ONLY. Co-poll OBC:2101 + VCU:2102 + VCU:21F2 + BMS:2101 with --monitor --keep-all while stepping a large 12V load (rear defroster + high beams + max blower on/off), then hunt every byte against the LDC_OUTPUT_V sag. VCU 2102 near-constant config bytes (B14~149, B20~58, B27~57) and the VCU 21F2 analog bytes (B12/B13/B15/B36/B37/B47) are the only OBC/VCU bytes not yet ruled out under a controlled 12V load."
        - "Re-capture VCU 21F2 with --keep-all during a CHARGING session (LDC ~10A steady, energy-balance known) — the current set has no charging 21F2, so its analog bytes can't be contrasted charging-vs-ready yet."
        - "If that also comes back flat: accept the LDC output current is genuinely not broadcast on this 2017 model and derive it as LDC_output_power/LDC_OUTPUT_V instead."

  sessions:
    "81":
      name: "standardDiagnosticSession"
      supported: true
    "82":
      name: "periodicDiagnosticSession"
      supported: false
      nrc: 0x12
      nrc_desc: "subFunctionNotSupported"
    "83":
      name: "extendedDiagnosticSession"
      supported: false
      nrc: 0x12
      nrc_desc: "subFunctionNotSupported"
