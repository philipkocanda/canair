# ─── AVN (Audio/Video/Navigation) ─────────────────────────────────────
# No live data DIDs discovered yet. Service 22 ranges untested.
#
# From the "Version info" screen in settings:
# - Platform: Compact Gen5 navigation
# - Model: AEAE.S5ALN.EU
# - Updated: 27.09.2024
# - Software version: AE_EV.EUR.SOP.017.1.240306
# - Firmware version: AE_EV.EUR.0.5.434.220809.MICOM
# - Navigation version: COM5.EUR.HMC.240621.3f75729
# - Device ID: 3391961266
#
# Runs Android, see XDA forum for hacking.
# The Linux version has no navigation and *looks* almost the same but isn't!
#
# This unit is what is used to set:
# - The two cabin preconditioning schedules
# - The two AC charging schedules
# - Station AC charging power (normal/reduced/minimum)
# - Portable ("granny charger") AC charging power (normal/reduced/minimum)
# - Default/Eco/Sport profiles (regen level and climate ECO setting)
#
# TODO:
# - Add details on how schedules are defined in the UI exactly!
# - Scan for PIDs with the screen in another state (engineering menu / "info" page) — some DIDs may only be exposed in those states.
#
# Links/sources:
# - Connector pinouts: https://gitlab.com/g4933/wideopen/-/wikis/Unit/Pinouts
#
# can_bus: the EU head unit sits on MM-CAN only (it reaches the powertrain through the gateway). The
# pinout wiki above also lists B-CAN and P-CAN, which fits the US unit.
AVN:
  tx_id: 0x780
  can_bus: [MM-CAN]
  identity:
    alias: IVI # In-Vehicle Infotainment
    description: Audio/Video/Navigation head unit
    serial: "00000076FE0085-003240"
    app_sw: "AE_EV EURSOP 12 017.1"
    id_protocol: UDS  # F1xx (limited — 3 DIDs)
    notes: >-
      Firmware ID 'AE_EV EUR.SOP'. SoC is a Telechips TCC8930 (dual-core Cortex-A9 at 1 GHz plus
      Cortex-M3, Mali-400 MP, 1 GB DDR3, eMMC boot), per the firmware.

  vehicle_states: [PLUGGED, ACC, ACC2, READY, CHARGING]
  scan_log: # AVN (head unit)
    - service: 0x22
      range: "0100-010F,B001-B010"
      date: 2026-07-22
      hits: 0
      vehicle_states: [READY, IGNITION ON]
      notes: >
        Head unit alive (all NRC, 0 timeouts) but exposes NO live-data DIDs — identity DIDs only. Hidden-page hunt.

  pids: {}

  research:
    - type: scan
      target: 21 00-FF
      status: pending
      priority: P2
      vehicle_states: [ACC]
      created: "2026-07-28"
      updated: "2026-07-28"
      notes: >-
        Never swept for service 21. The driver sets the charge timer and preconditioning schedules
        on this unit. Sweep 21 00-FF (especially 21F2); if a page answers, capture it, change one
        schedule field and diff.
    - type: verify
      target: "IG3 relay #2 control output"
      status: pending
      priority: P3
      vehicle_states: [PLUGGED, CHARGING]
      created: "2026-10-23"
      updated: "2026-10-23"
      notes: >-
        The AVN (and the audio unit on cars without navigation) has an 'IG3 relay control' pin wired
        to the IG3 #2 relay coil in US-market wiring. The relay's job is AC-charging power, yet its
        coil is sunk by the head unit. The firmware notes in IONIQ_AVN_FW_FINDINGS.md fit a
        head-unit role: the US telematics sends an IG3 relay request (CF_TMU_IG3RLY in frame 0x587)
        and the VCU reports an IG3 relay mode (CF_Vcu_IG3RlyMd in 0x57B). Against it: on the EU car,
        with the AVN's always-on MULTIMEDIA fuse (F18, 10 A) pulled, a pre-conditioning schedule set
        earlier still ran, and the car pre-conditioned while on a charger. So a scheduled
        pre-conditioning start does not need the head unit, and the schedule is stored in another
        module. The AVN's ACC and IG3 feeds were still in place. Whether the head unit closes IG3 #2
        in other cases is unknown.
      what_to_test:
        - Record IGPM 22BC07, OBC 2101 and BMS 2101 with --keep-all at 1 s across an AC plug-in and across a scheduled charge or pre-conditioning start, with the head unit awake and asleep, and see whether UNKNOWN_B12_3 or the OBC state moves with the head unit.
      capture_protocol: >-
        canair monitor IGPM:22BC07 OBC:2101 BMS:2101 --save --keep-all --interval 1 --label 'IG3 #2
        hand-over' --state PLUGGED; press s at plug-in and at any scheduled start.
