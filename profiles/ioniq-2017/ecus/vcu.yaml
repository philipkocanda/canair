      result: >-
        2026-10-21: VCU_21F2_EVENT_COUNT, read as (B76<<8)|B75 (784 to 847). July-August rises line
        up with ended AC charges and one plugged-in preconditioning run, DC charges did not move it,
        but the 08-15 to 10-19 rate (0.74/day) is far above the owner's 1-2 charges a week.
        Candidate events: AC charge sessions, 12V-battery top-ups (HV wake while parked), scheduled
        preconditioning, scheduled-charge starts.
      notes: >-
        Find what VCU_21F2_EVENT_COUNT counts. Note it, then let the car sit unplugged and unused
        for 2-3 cold days (12V top-ups only) and read it again; then do one AC charge (plug in,
        charge, unplug) and one DC fast charge, reading it after each. Check the climate and charge
        schedules in the head unit first: a preconditioning schedule set on 2026-07-30 (01:00
        Sun/Tue/Wed/Thu/Sat) fits the 08-01 and 08-06/08-08 rises but not the quiet 08-02 to 08-05
        and 08-10 to 08-15 stretches, so it may have been switched off. 2026-10-19 20:39 to 10-21
        21:03 (two days at about 8 °C, a 1.5 km drive, no charge) left it at 847, which argues
        against counting 12V top-ups unless none ran. The next VCU 21F2 read after the 10-21 21:00
        top-up session will show whether that session counted. A 12V top-up should also show in BMS
        21F2 as a short cycle with a small discharge. B76 as the high byte is unproven until B75
        passes 255. B73:B74 next to it is a constant 91.
