      notes: The Ioniq P-CAN carries the 12V battery sensor frame 0x549 (opendbc BAT11, sender EMS). On the uhi22 Ioniq 28 logs it decodes as BAT_SNSR_V 14.78-14.82 V, BAT_SOC 65-68 %, BAT_SOH 89 %, BAT_SNSR_Temp 2 C, BAT_SNSR_I 1-5 A. The profile has no 12V state-of-charge or state-of-health signal. The VCU is the most likely diagnostic owner because it takes the EMS role on this EV; unconfirmed. Broadcast scalings (SOC and SOH 1 %/bit, voltage 0.001 V/bit + 6 V, temp 0.5 C/bit - 40 C, current 0.01 A/bit - 327 A) may not carry over to a DID.
