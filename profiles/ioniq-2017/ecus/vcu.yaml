# ─── VCU (Vehicle Control Unit) ──────────────────────────────────────
#
# Sometimes referred to as VMCU, though the distinction is vague..
#
# The VCU is the logical brain of the EV powertrain:
# - Torque requests (accelerator input, cruise control)
# - Drive mode logic
# - Regen braking strength (0-1-2-3) and brake blending
# - Coordination between motor, inverter, battery, and safety systems
# - Suspected: preconditioning, charge timer, charge power limit settings (station/portable).
#
# The Vehicle Control Unit (VCU) and Motor Control Unit (MCU)
# are both part of the Electronic Powertrain Control Unit (EPCU) physical housing.
#
# KWP2000 diagnostic sessions (service 0x10) — probed 2026-07-22, car in READY:
# see the structured `sessions:` field at the end of this ECU block.
# Only 0x81 is accepted; 21xx reads work in the default session too — no session
# unlocks extra data. Payload sizes are session-independent: 2101=22B, 2102=23B;
# 2103/2104/2105 → NRC 0x12 (do not exist).
#
VCU:
  tx_id: 0x7E2
  can_bus: [H-CAN, P-CAN]
  identity:
    alias: VLDC  # KWP2000 ecu_id module code (VCU with integrated LDC)
    description: Vehicle Control Unit (integrated LDC)
    part_number: "36601-0E250"
    ecu_id: AEVLDC53  # KWP2000 1A8C — "VLDC": VCU with the LDC integrated (standalone at 0x7CD on Kia Soul)
    sw_id: "EAEEO5L-NS7-D060"
    calibration: "C5210617"
    vin: "KMHCXXXXXXXXXXXX"
    id_protocol: KWP2000  # 1Axx
    notes: >
      Vehicle Control Unit (aka VMCU) with integrated LDC — the logical brain
      of the EV powertrain: torque requests, drive-mode logic, regen strength
      and brake blending, and coordination between motor, inverter and battery.
      Shares the EPCU (Electronic Powertrain Control Unit) housing with the MCU.
  vehicle_states: [READY, CHARGING]
  pids:
    2101:
      status: active
      period: 2500
      vehicle_states: [READY, CHARGING]
      parameters:
        VCU_VEHICLE_SPEED:
          expression: ((S20*256)+B19)*1.609344/100
          unit: km/h
          ha_class: speed
          min: "0"
          max: "250"
          verified: true
          notes: >
            Speed. 16-bit MPH (low byte B19 unsigned, high byte S20), *1.609344/100
            → km/h. r=0.999 vs ESC 22C101 REAL_SPEED_KMH (124 joined points,
            2026-07-22 drive, 0-105.7 km/h). Finer than B20 alone (high byte,
            r=0.998). Do NOT use B21 as low byte (separate signal). Car reports MPH
            internally (cf. AAF 2181 B12).
          source: VCU 2101 speed lead (MPH formula) + cross-ECU verification vs ESC, 2026-07-23
          enabled: true
        ACCEL_PEDAL_DEPTH:
          expression: "B18/2"
          unit: "%"
          ha_class: ""
          min: "0"
          max: "100"
          source: "ITStromer community PID sheet (Accel Pedal Depth = m/2)"
          verified: false
          notes: >
            Accelerator pedal position. 2026-07-20: from the ITStromer community sheet, confirmed by its
            controlled test (0% pedal → B18=0; pedal to floor → B18=0xC8=200 → 100%). Our captures: 0% at
            rest, 0-56% while driving, up to 86% with pedal pressed in Park. ISO-TP byte 0x0e.

        ACCEL_PEDAL_RELATED:
          expression: "B17"
          unit: ""
          min: "0"
          max: "255"
          source: "ITStromer community PID sheet (Accel Pedal Related = l)"
          verified: false
          notes: "Raw accelerator-related sensor (APS). Tracks pedal (0-254). ISO-TP byte 0x0d."

        GEAR:
          expression: B10
          unit: ""
          verified: true
          notes: >-
            Transmission range (PRND) as one readable value. RENAMED from DEBUG_DRIVE_MODE_FLAGS
            2026-08-06: this profile uses 'drive mode' for Eco/Normal/Sport, so the old name
            misdescribed it — B10 is the gear/shifter position. Across 6365 captures B10 takes
            exactly 5 values: 0x21 park (n=5982), 0x28 drive (n=317), 0x22 reverse (n=54), 0x24
            neutral (n=3), 0x01 park with bit5 clear (n=9). Bits 0-3 are one-hot P/R/N/D (see
            GEAR_P/R/N/D); bit5 is GEAR_SIGNAL_VALID; bits 4,6,7 are constant 0 in all captured
            data. Value 0x01 is park while the gear signal reads invalid, seen only during VCU
            power-mode transitions.
          type: enum
          values:
            1: park_gear_signal_invalid
            33: park
            34: reverse
            36: neutral
            40: drive
          source: canair bitfield analysis 2026-08-06; same-payload enumeration n=6365
        GEAR_P:
          expression: B10:0
          unit: ""
          verified: true
          notes: >-
            Gear = Park. One-hot bit of the GEAR byte (B10). n=5991 across 6365 captures. RENAMED
            from DRIVE_MODE_P 2026-08-06 (this profile uses 'drive mode' for Eco/Normal/Sport; B10
            is the transmission range). Mirrored into B26:5 — see GEAR_P_MIRROR_B26_5.
        GEAR_R:
          expression: B10:1
          unit: ""
          verified: true
          notes: >-
            Gear = Reverse. One-hot bit of the GEAR byte (B10). n=54, all on 2026-07-19 and
            2026-07-26. RENAMED from DRIVE_MODE_R 2026-08-06. Cross-confirmed by ESC GEAR_SELECTOR=2
            over the 2026-07-26 driveway reversing segments.
        GEAR_N:
          expression: B10:2
          unit: ""
          verified: true
          notes: >-
            Gear = Neutral. One-hot bit of the GEAR byte (B10). Only n=3, all at 2026-07-19 17:42 —
            the sole Neutral observation in the corpus, and ESC 22C101 was not co-polled that day,
            so ESC GEAR_SELECTOR=3 is still unconfirmed. RENAMED from DRIVE_MODE_N 2026-08-06.
        GEAR_D:
          expression: B10:3
          unit: ""
          verified: true
          notes: >-
            Gear = Drive. One-hot bit of the GEAR byte (B10). n=317 across 6365 captures. RENAMED
            from DRIVE_MODE_D 2026-08-06. NOTE: B26:3 is NOT this signal — it is not-Park (set in R
            and N too); see GEAR_PARK_INV.
        DEBUG_VEHICLE_STATE_FLAGS:
          expression: "B11"
          unit: ""
          verified: false
          notes: "Raw byte — individual bits below"

        VEHICLE_STATE_BRAKE_LAMP:
          expression: "B11:0"
          unit: ""
          verified: true
          notes: ""

        VEHICLE_STATE_NOT_BRAKING:
          expression: B11:1
          unit: ""
          verified: true
          notes: >-
            Brake released (the complement switch of VEHICLE_STATE_BRAKE_LAMP, B11:0). 2026-08-06:
            B11 bits 0/1 are a REDUNDANT SWITCH PAIR, not complements — across 6365 captures both
            read 0 in 4178 rows (almost all VCU_POWER_STATE=7 charge standby) and both read 1 in 5.
            So 0 does NOT mean 'braking': it also means the brake signal is not available, which is
            the usual case whenever the drive path is down. Only trust this bit while drive-ready
            (VCU_POWER_STATE=4).
        UNKNOWN_B11_2:
          expression: B11:2
          unit: ""
          verified: false
          notes: >-
            Constant 0 in all 6365 captures — meaning unknown. RENAMED from VEHICLE_STATE_START_KEY
            2026-08-06: the start-key reading was never observed to be true, so the name asserted
            more than the data supports. Never exercised in scope rather than proven unused.
          source: canair bitfield analysis 2026-08-06; n=6365
          enabled: false
        VEHICLE_STATE_EV_READY:
          expression: "B11:3"
          unit: ""
          verified: true
          notes: ""

        VEHICLE_STATE_VCU_READY:
          expression: "B11:4"
          unit: ""
          verified: true
          notes: ""

        UNKNOWN_B11_5:
          expression: B11:5
          unit: ""
          verified: false
          notes: >-
            Constant 0 in all 6365 captures — meaning unknown. RENAMED from
            VEHICLE_STATE_MAIN_RELAY_ON 2026-08-06, and the expression corrected from 1-B11:5 to
            B11:5: the inversion made it decode a constant 1, i.e. it reported 'HV main relay
            closed' in SLEEP and while charging, and the 0 state its note described was never once
            observed. Use BMS_MAIN_RELAY (BMS 2101 B14:0) for the real HV relay state. Never
            exercised in scope rather than proven unused.
          source: canair bitfield analysis 2026-08-06; n=6365
          enabled: false
        VEHICLE_STATE_EV_READY_MIRROR_B11_6:
          expression: B11:6
          unit: ""
          verified: true
          notes: >-
            Exact mirror of VEHICLE_STATE_EV_READY (B11:3) — identical in 6365/6365 captures.
            RENAMED from VEHICLE_STATE_POWER_ENABLE 2026-08-06: the earlier note observed the two
            'toggling together' and inferred a separate HV power-enable flag, but they never
            diverge, so there is no evidence of a second signal. Disabled so it does not ship a
            duplicate; kept defined so bit6 is accounted for. If a state is ever found where the two
            differ, this becomes a real signal again.
          source: canair bitfield analysis 2026-08-06; decode --find-mirrors --bits, n=6365 unanimous
          enabled: false
        VEHICLE_STATE_LDC_ENABLED:
          expression: "1-B11:7"
          unit: ""
          verified: false
          notes: "Inverted from LDC_INHIBIT bit. 1=LDC active, 0=inhibited. 2026-07-30 power-cycle: LDC=1 in READY (B11=0x5A), 0 in accessory/off (B11=0x92/0x91/0x80) — DC-DC converter inhibited when not READY, toggles with EV_READY/POWER_ENABLE. Direction proven; ACC1/ACC2/OFF not individually resolved under keep-unique."

        VCU_STATE_FLAGS_RAW:
          expression: B12
          unit: ""
          verified: false
          notes: >-
            NOT a bitfield despite the name — 2026-08-06 triage: B12 takes 136 distinct values
            across 6365 captures with all 8 bits varying independently, which is the signature of a
            continuous analog value or a counter, not a flag set. Do not decode it bit-by-bit. Needs
            analog triage (autocorrelation / step distribution) and a correlation sweep against
            speed/pedal/power to identify it; rename once known.
          source: canair bitfield analysis 2026-08-06; byte-value enumeration n=6365
        DEBUG_GEAR_STATE_FLAGS:
          expression: B26
          unit: ""
          verified: true
          source: canair bitfield analysis 2026-08-06; same-payload cross-tab vs GEAR (B10) n=6365
          notes: >-
            Park / not-Park state, mirrored out of the gear byte. CORRECTED 2026-08-06: across 6365
            captures B26 takes only two values — 0x20 (Park) and 0x08 (Reverse, Neutral OR Drive).
            The earlier note read 0x08 as 'Drive' and cited r=+0.984 vs the drive bit over 773
            captures; with R and N now sampled (54 and 3) that is disproven — 0x08 is simply
            not-Park. Bit3 and bit5 are exact complements and both mirror GEAR (B10), so B26 carries
            no information B10 does not; its two bit params are disabled as mirrors. Bits
            0,1,2,4,6,7 are constant 0 in all captured data.
          type: enum
          values:
            8: not_park
            32: park
        GEAR_PARK_INV:
          expression: B26:3
          unit: ""
          source: canair bitfield analysis 2026-08-06; same-payload cross-tab vs GEAR (B10) n=6365
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: >-
            Gear is NOT Park. RENAMED from GEAR_DRIVE 2026-08-06 — it was NOT the drive gear: B26:3
            reads 1 in Reverse (n=54) and Neutral (n=3) as well as Drive (n=317), i.e. 57 false
            positives against the real gear with 0 false negatives (99.10% agreement, which is why
            an earlier r=+0.984 vs the drive bit looked convincing when R and N were still
            unsampled). B26 takes only 2 values across 6365 captures: 0x20 park, 0x08 not-park — so
            bit3 is the exact complement of bit5, and both are redundant with GEAR (B10). Disabled:
            it would ship a duplicate device signal. Kept defined so bit3 is accounted for.
          enabled: false
        GEAR_P_MIRROR_B26_5:
          expression: B26:5
          unit: ""
          source: canair bitfield analysis 2026-08-06; decode --find-mirrors --bits, n=6365 unanimous
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: >-
            Gear = Park, mirrored into B26. RENAMED from GEAR_PARK 2026-08-06: identical to GEAR_P
            (B10:0) in 6365/6365 captures, so it is the same fact from a second byte, not an
            independent signal. (Its own earlier rename from PARK_BRAKE stands — it is the park
            GEAR, not the electronic park brake, which merely co-occurs.) Disabled so it does not
            ship a duplicate of GEAR_P; kept defined so bit5 is accounted for.
          enabled: false
        VCU_UNKNOWN:
          expression: "B20/2"
          unit: "%"
          min: "0"
          max: "100"
          enabled: false
          source: "ImHex pattern (@ 0x0E) + JejuSoul Torque Pro CSV"
          source_links:
            - https://docs.google.com/spreadsheets/d/1R2dW_4-ANg04TQdkHH52-8wdYItBkWDfppcsqOc-m1M
          verified: false
          notes: >
            DISABLED 2026-07-20 (excluded from public profile): B20 is the HIGH byte of VEHICLE_SPEED
            ((S20*256)+B19) — so B20/2 is just half the speed high byte, not an independent signal, and it
            exceeds its 100% max (observed 127.5%). Ioniq5 OBDb suggested bix 96 = B18, but that never
            validated either ("fixed at 17% during charging", implausible). Kept for research only.
        VCU_INVERTER_ENABLED:
          expression: B23:2
          unit: ""
          source: canair historical analysis 2026-07-23
          verified: true
          notes: >
            Inverter/HV-power-active flag. B23 = 0x34 (52) when EV_READY/driving, 0x00 when charging/sleep (r=+0.997 vs VEHICLE_STATE_EV_READY across 776 captures). 0x34 = bit2|bit4|bit5 set; bit2 chosen as the boolean. Redundant with VEHICLE_STATE_EV_READY (B11:3) but sourced from a different byte — useful as a cross-check. Raw byte B23 itself only ever 0 or 52.
        VCU_POWER_STATE:
          expression: B25
          unit: ""
          min: "0"
          max: "7"
          source: canair historical analysis 2026-07-23; enum + value 6 confirmed 2026-07-27 charge-stop; value 1 added 2026-08-06
          verified: true
          notes: >-
            VCU/EPCU power-mode state machine (B25). 4=drive_ready (EV READY, inverter/drive path
            enabled), 7=charge_standby (drive path down — AC charging OR key-off standby),
            6=transition (caught at charge termination 2026-07-27, HV spinning down). r=-1.000 vs
            VEHICLE_STATE_EV_READY across the fleet of captures. Independent of the B11 state
            bitfield. 2026-08-06: value 1 (n=21) was undeclared by this enum — it occurs only in the
            2026-07-30 power-cycle window, bracketed by GEAR_SIGNAL_VALID (B10:5) dropping, with
            B23=0x34 (inverter still enabled) throughout. Labelled unknown_1 rather than guessed:
            the value is established, its meaning is not. A --keep-all power cycle should resolve
            it.
          type: enum
          values:
            1: unknown_1
            4: drive_ready
            6: transition
            7: charge_standby
        VCU_LOAD_INVERSE_B21:
          expression: B21
          min: "0"
          max: "255"
          source: canair hunt/correlate 2026-08-02 (per-session, driving scope)
          verified: false
          notes: >-
            Unmapped VCU 2101 WiCAN B21. Smooth continuous analog (lag1 autocorr 0.92, mean|step|
            ~5.5% of range) — not a counter/checksum. ~203 at standstill, ~111 at speed;
            anti-correlates r=-0.66 with speed(ESC)/motor-RPM/pack-current across a drive. Likely a
            pedal/brake/power/load signal (inverse of load). TEST LIVE: standstill accelerator press
            vs brake press to disambiguate; note sign/scale.
        VCU_INVERTER_ARMED:
          expression: B23:4
          source: canair bitfield analysis 2026-08-06; same-payload cross-tab n=6367
          verified: false
          notes: >-
            B23:4. Strict superset of VCU_INVERTER_ENABLED (B23:2): bit2 set implies bit4 set, 0
            violations in 6367 captures. Set in 100% of VCU_POWER_STATE=4 drive_ready rows
            (1620/1620); B23 reads 0 in every charge_standby row with bit4 clear. 13 captures show
            bit4=1 while B23:2=0 — the arming window before inverter enable. NOT the HV main relay:
            BMS_MAIN_RELAY reads 1 during charging while this bit reads 0, so it tracks the
            drive/inverter path, not the contactors. B23 takes only 3 values across 6367 captures:
            0, 48 (bits 4,5), 52 (bits 2,4,5).
        VCU_INVERTER_ARMED_MIRROR_B23_5:
          expression: B23:5
          source: canair bitfield analysis 2026-08-06
          verified: false
          notes: >-
            B23:5. Identical to VCU_INVERTER_ARMED (B23:4) in 6367/6367 captures — a mirrored pair,
            never observed diverging. Disabled so it does not ship a duplicate device signal;
            defined to record that bit 5 is accounted for.
          enabled: false
        GEAR_SIGNAL_VALID:
          expression: B10:5
          source: canair bitfield analysis 2026-08-06; n=6365, 4 transitions in the 2026-07-30 power-cycle session
          verified: false
          notes: >-
            Gear/shifter signal valid. Set in 6356 of 6365 captures; clear in exactly 9, all on
            2026-07-30 at four VCU power-mode transitions (09:52:00 and 09:53:56 falling, 09:52:28
            and 09:54:23 rising — bracketing the window where VCU_POWER_STATE reads its undeclared
            value 1). NOT a gear bit: it is set in every one of P/R/N/D, so it does not encode a
            position; it reads as a validity/plausibility flag for the PRND field, dropping while
            the VCU re-initialises. Unverified: 4 episodes from a single session, all with the car
            in Park, and that session was recorded --keep-unique so the transition timing is not
            recoverable. Verify with a --keep-all power cycle.
    2102:
      status: active
      period: 5000
      vehicle_states: [READY, CHARGING]
      parameters:
        VCU_INVERTER_INPUT_VOLTAGE:
          expression: "B17*2"
          unit: V
          ha_class: voltage
          min: "0"
          max: "450"
          source: "Kia Soul EV VMCU CSV (Inverter Input Voltage = f*2)"
          verified: true
          notes: >
            HV DC-link (= battery pack) voltage. 2026-07-20: identified via Kia Soul EV VMCU
            reference (0x7E2, "Inverter Input Voltage = f*2"). Old guess B10*2 gave ~2V (B10=0x01, wrong).
            B17*2 reads 364–382V in ready/driving across 1317 captures (range 28–412V over all states),
            matching BMS pack voltage (~369V) and LDC HV input (~353V) — the inverter DC-link is the pack.
            Cross-validated while charging (2026-07-20, SOC 94%): B17*2 = 396V vs BMS pack 396.4V — spot on.
            NOTE: Soul's letter positions do NOT transfer directly (its f = our B17, its e = our B18);
            the Ioniq VCU 2102 field order differs from the Soul VMCU.

        VCU_AUX_BATTERY_VOLTAGE:
          expression: B14*0.0974
          unit: V
          ha_class: voltage
          min: "0"
          max: "16"
          enabled: true
          source: RE 2026-08-02 absolute-value anchoring + live ACC2, vs OBC/BMS/BCM consensus
          verified: true
          notes: >-
            12V bus voltage at B14 (empirical scale 0.0974, ~=B14/10.27). Found by absolute-value
            anchoring: B14 hits ~14.5V charging and ~12.2V in ACC2 with one scale, where the old
            B18/10 could not (B18 tracked the bus inversely). Verified: B14*0.0974 matches the OBC
            LDC_OUTPUT_V / BMS AUX / BCM 12V consensus to mean|d|=0.032V across the full 12.4-15.0V
            range (n=696), incl. the live ACC2 point. Scale is empirical (+/-0.03V); reads at VCU's
            local node. Was mis-defined as B18/10.
        VCU_TORQUE_REQUEST:
          expression: "[S12:S13]"
          unit: ""
          min: "-32768"
          max: "32767"
          enabled: false
          source: "Phase 1 variance/correlation analysis (2026-07-20); Kia Soul EV VMCU torque fields"
          source_links: []
          verified: false
          notes: >
            DISPROVEN 2026-07-23 — this candidate was an ARTIFACT of mislabeled captures. In genuine 6102
            responses B12 and B13 are constant 0x00 (n=1652), including at speed during the 2026-07-19 drive,
            so [S12:S13] is always 0. The dramatic "0 at park, ±31000 while driving" signal came entirely from
            22 captures at 16:13–16:14 on 2026-07-19 that were actually VCU 2101 responses (they begin 61 01,
            not 61 02) misfiled under 2102; reading 2101's accelerator-echo/speed bytes as a signed 16-bit
            produced the ±30000 garbage (and simultaneously made INVERTER_INPUT_VOLTAGE read 0/252 and the
            structural bytes B4/B5/B9/B10/B11 flip to their 2101 values 0xFF/0xE0/09/28/5A in those rows).
            ACTION: purge/relabel those 22 frames from the 2102 dataset (canlib.captures.delete_capture) and
            re-capture a clean synced VCU 2101+2102 drive. VCU-level torque request, if exposed at all, is not
            at B12:B13. Actual motor torque lives in MCU 2102 (MCU_MOTOR_TORQUE). Do not publish.

        VCU_DCLINK_VOLTAGE_COARSE:
          expression: "B25*2.56"
          unit: V
          ha_class: voltage
          min: "0"
          max: "450"
          enabled: false
          source: "canair historical analysis 2026-07-23"
          verified: false
          notes: >
            Coarse (8-bit, ~2.56 V/LSB) copy of the HV DC-link voltage. B25 correlates r=+0.950 with the
            verified INVERTER_INPUT_VOLTAGE (B17*2) across 1672 captures; B25*2.56 tracks B17*2 with a median
            residual of ~1V (larger stdev only across the mislabeled 16:13 shutdown frames, see VCU_TORQUE_REQUEST).
            Redundant with the full-resolution B17*2 — kept disabled as a research note / integrity cross-check.
            The remaining dynamic 2102 bytes (B14~149, B27~57, B20~58 are near-constant config/status; B19/B21
            are max-entropy fast signals — motor phase currents / resolver angle per the Soul VMCU sheet —
            that alias at the 5s poll rate and need a synced high-rate VCU+MCU drive capture to resolve).
            B22/B23 = VCU_AUX_POWER (12V accessory power, W); B15 = its /100 coarse mirror; B26 = config/status.
        VCU_AUX_POWER:
          expression: "[B22:B23]/10"
          unit: W
          min: "0"
          max: "6553"
          source: "2026-07-30 dash anchor: climate/electronics power bar 130->650W == raw/10 137->651; rear+side defroster step ~28A@14.5V"
          verified: false
          notes: >-
            12V/accessory electrical power draw, watts. [B22:B23]/10 = W. CORRECTION 2026-07-30:
            previously mislabeled VCU_CHARGE_TIME_REMAINING (min) — that was WRONG. Proof it is
            power, not time: (1) READY DC-load session raw/10 137->651 matches the dash
            climate/electronics power bar 130->650W (owner-confirmed); (2) rose 195->601W when
            rear+side window defroster switched on = ~28A@14.5V step, matches a defroster load (cf
            OBC LDC_OUTPUT_V note: rear-defroster ~15-20A); (3) r=+0.97 vs BMS BATTERY_POWER/CURRENT
            across READY (load-tracking); (4) during 24min steady 10A AC charge it does NOT count
            down — wanders non-monotonically 52-108W (standby electronics), disproving time-to-full.
            Coarse mirror: B15 = [B22:B23]/100 (~0.1kW steps). RESOLVED 2026-07-30: this is the 12V
            AUX/ELECTRONICS term of the dash motor/climate/aux split (all LDC-fed 12V loads incl.
            blower + rear defroster) — NOT climate, NOT total. The 2026-07-30 defroster step that moved
            it was a 12V load; the HV compressor/PTC "climate" power is separate and independent (r=-0.09
            vs BATTERY_POWER in the 2026-07-22 heat-pump session, while pack HV power swung 1kW). The
            climate + motor sibling terms are NOT broadcast on VCU 2102/2101/21F2. ISO-TP 0x12-0x13.
        VCU_AUX_POWER_COARSE:
          expression: B15*10
          unit: W
          min: "0"
          max: "2550"
          source: "2026-07-30: B15*10 vs [B22:B23]/10 r2=0.994"
          verified: false
          notes: >-
            Coarse (10 W/LSB) mirror of VCU_AUX_POWER. B15*10 = W, r2=0.994 vs the fine [B22:B23]/10
            field. Cross-check candidate — should read the same watts as VCU_AUX_POWER at lower
            resolution.
        VCU_2102_B19:
          expression: B19
          source: 2026-07-30 adjacent-field candidate
          verified: false
          notes: >-
