        2026-10-21: two accelerator pedal sensor tracks, not two resolutions: (B13<<8)|B12 and
        (B15<<8)|B14 with a fixed ~1.97 ratio (VCU_APS1_VOLTAGE, VCU_APS2_VOLTAGE). Also B17 is the
        low byte of the pedal position (ACCEL_PEDAL_DEPTH_FINE) and B21 of the VCU supply voltage.
      notes: "B13 and B15 are both unmapped and hold one quantity at two resolutions: B15 == B13>>1 in 6351 of 6365 captures. B13 is mostly 0x06 (n=6204) and B15 mostly 0x03, so it is a small-range value, not a wide analog. Decoding either one decodes both; the 2x relationship is itself a strong hint (a half-step unit, or a raw-vs-rounded pair)."
      sources:
