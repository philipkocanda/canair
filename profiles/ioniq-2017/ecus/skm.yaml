  research:
    - type: decode
      target: "22B002"
      status: captured
      priority: P1
      vehicle_states: [SLEEP]
      date: "2026-07-29"
      notes: >
        178-byte block, stable/reproducible. CORRECTION (2026-07-29): the earlier
        claim that "bytes 7-13 track power state" was WRONG — it compared a CORRUPT
        2026-04-18 capture (139B, chunks reordered from dropped/misordered ISO-TP
        frames on the fast-sleeping SKM) against the good 178B read. With clean reads,
        B002 is byte-identical across READY+fob-present (2026-07-22) and SLEEP+fob-absent
        (2026-07-29): it does NOT encode power state or fob presence. Repeated 6-7B
        motifs point to a per-key record table / config. Still undecoded; needs
        controlled experiments (fob near/far, add/remove a registered key).
      what_to_test:
        - "Fob near vs removed/far — same session, diff B002 (the key-isolation test; still pending — prior captures did NOT vary)"
        - "Add/remove a registered key — does the record count / a motif block change? (tests the per-key-table hypothesis)"
        - "B006 B10/B21 (slow-drift analog pair, 0x9A-0xA2) — correlate with a controlled 12V or temperature reference to identify the unit"

    - type: verify
      target: "2FB109"
      status: pending
      priority: P2
      notes: "IGN1 relay ON — accepted but untested."
    - type: verify
      target: "2FB10A"
      status: pending
      priority: P2
      notes: "IGN2 relay ON — accepted but untested."
    - type: verify
      target: "2FB10B"
      status: pending
      priority: P3
      notes: "Start relay ON — CAUTION. Only test if safe."
      sources:
        - "Obsidian: SKM.md — KIA Soul commands"
    - type: verify
      target: 22B006 SKM_B006_VAL_A/B
      status: captured
      priority: P2
      vehicle_states: [SLEEP]
      created: "2026-07-30"
      updated: "2026-07-30"
      notes: B006 B10/B21 = redundant slow-drift analog pair (0x9A-0xA2, drifts ~1/reading, tracked within +-1). Registered as unverified candidates. Identify unit via a controlled reference (12V rail or temperature). B007 B11 = small enum (0x00/0x06) — correlate with a physical event.
    - type: decode
      target: 22B002/22B003/22B005/22B006/22B008/22B00A terminal-feedback bits
      status: pending
      priority: P2
      vehicle_states: [ACC, "ON"]
      created: "2026-10-23"
      updated: "2026-10-23"
      notes: >-
        No signal tells ACC apart from OFF yet. The SKM reads back three terminal lines after the
        relays: ON input (IGN2), ACC/ON input (ACC) and ON/START input (IGN1) (SKM connector C pins
        8, 18 and 9), and drives separate ACC and IGN LEDs on the start button. The ACC/ON input is
        the one that separates ACC from OFF. Whether any of these is exposed in a B0xx page is not
        known. Taken from US-market wiring; unconfirmed on the EU car.
      what_to_test:
        - "Press the start button without the brake: OFF to ACC to ON to OFF, holding each state about 10 s, recording the SKM B0xx pages with --keep-changes and pressing s at every press. Look for bits that change at each step."
      capture_protocol: >-
        canair monitor SKM --save --keep-changes --interval 1 --label 'SKM terminal steps
        OFF-ACC-ON-OFF' --state ACC; fob inside the car, brake not pressed, press s at every button
        press.
    - type: decode
      target: 22B006 byte map (B05-B07, B09)
      status: pending
      priority: P3
      vehicle_states: [SLEEP, READY]
      created: "2026-10-29"
      updated: "2026-10-29"
      result: "22B006's constant map AF E0 00 00 marks B10, B12, B14, B15 and B17-B21 as signals (one bit per data byte, MSB first). All 6 varying bytes are inside. Defined so far: SKM_B006_VAL_A (B10) and SKM_B006_VAL_B (B21). 22B005 does not follow the map (4 of 9 set bits outside)."
      notes: "B17, B18 and B19 read 183-187 when non-zero (2026-10-22 x8, 2026-10-25 x24) and 0 otherwise: the same range as VAL_A/VAL_B (~185), so probably the same quantity on three more channels. B12 reads 0-92, non-zero only on 2026-10-25 (19 captures). B14 (0, once 160), B15 and B20 (always 0) are marked but have not moved. All added as disabled candidates."
      sources:
        - byte sweep over all stored SKM captures, 2026-10-29
      what_to_test:
        - Record SKM 22B006 with --keep-all while moving the fob around the car (inside, each door, the trunk), noting each position, to see whether B10/B17/B18/B19/B21 are per-antenna readings.
