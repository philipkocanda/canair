# ─── SKM (Smart Key Module) ────────────────────────────────────────────
# Self-identifies as "SMK". Wakes from at least two or more CAN requests, slow to wake (>1s).
# Responsible for key fob detection, immobilizer, and keyfob functions.
# Falls asleep after ~60s of bus inactivity.
# Connected directly to the SSB (start/stop button) via dedicated CAN line.
SKM:
  tx_id: 0x7A5
  can_bus: [B-CAN, P-CAN] # + SSB CAN 
  identity:
    alias: SMK  # ECU self-identifies as "SMK"
    description: Smart Key Module
    mfg_date: "2017-06-02"
    diag_address: "190"
    hw_version: "10000"
    sw_version: "10200"
    id_protocol: UDS  # F1xx
    part_number: ""
    notes: >
      Smart Key Module (self-identifies as "SMK") — key-fob detection,
      immobiliser and remote functions. Slow to wake (>1s, needs two or more
      CAN requests) and sleeps after ~60s of bus inactivity. Also known as SMARTRA.
  vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
  wake:
    method: rapid_read
    prime_pid: 22B003
    attempts: 8
    interval_ms: 80
    sleep_timer_ms: 2000
    notes: >-
      SKM powers its CAN transceiver only briefly (~2s) and answers one request before sleeping
      again. Rapid-fire a cheap read (22B003) to hold it awake, then open a session and read the
      B0xx block. Verified 2026-07-29 on slcan-tcp: single 1001 wake races the sleep timer;
      back-to-back reads succeed.
  session: true
  scan_log: # SKM
    - service: 0x22
      range: "0101-010F,B001-B010"
      date: 2026-07-22
      hits: "B002,B003,B005,B006,B008,B00A"
      vehicle_states: [READY, FOB PRESENT]
      notes: >
        Re-confirmed the B0xx live-data block (already registered in this file's pids:).
        01xx all NRC. NOTE the Hyundai -1 echo: requesting B007/B009/B00B returns
        B006/B008/B00A's data. B002 (178 B) content DIFFERS between deep-sleep (2026-04-18)
        and READY — useful power-state contrast for decoding key/immobiliser bytes.
  pids:
    22B002:
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >
        Stable 178-byte block. Reproduces byte-identical across sessions/dates and
        across states (READY+fob-present 2026-07-22 == SLEEP+fob-absent 2026-07-29),
        so no observed byte encodes power state or fob presence. Repeated 6-7B motifs
        suggest a per-key record table / config, not live status. Decoding needs
        controlled experiments (fob near/far; add/remove a registered key).
      parameters:
        SKM_B002_UNKNOWN:
          expression: ""
          unit: ""
          source: "DID scan 2026-04-18; state-contrast 2026-07-29"
          source_links: []
          verified: false
          notes: >
            178 data bytes (stable). Example (2026-07-29, SLEEP, no fob):
            62 B0 02 00 00 00 00 3C 0A 46 2C 3F 75 FE FF 1E C8 96 64 FA 14 32 32 05 06
            14 03 07 32 46 14 1E 1E 1E 2C 3F 75 FE 00 00 00 00 FF FA C8 96 64 96 12 08
            0F 0A 14 10 0A C8 64 03 0F 3C C8 14 64 28 08 10 10 03 1E ... (repeats/zeros).
            CORRECTION: the older 2026-04-18 "136-byte" capture is a CORRUPT multi-frame
            reassembly (same chunks appear REORDERED — dropped/misordered ISO-TP
            consecutive frames from the fast-sleeping SKM over a ~26-frame read,
            predating the truncation guard), NOT valid state data.

    22B003:
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      parameters:
        SKM_B003_UNKNOWN:
          expression: ""
          unit: ""
          source: "DID scan 2026-04-18"
          source_links: []
          verified: false
          notes: "27 bytes. Raw: 62B003000000003412900300000000C6A21261000000000F00AAAA"
    22B005:
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      parameters:
        SKM_B005_UNKNOWN:
          expression: ""
          unit: ""
          source: "DID scan 2026-04-18"
          source_links: []
          verified: false
          notes: "13 bytes. Raw: 62B005FA60900000040000AAAA"
    22B006:
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      parameters:

        SKM_B006_VAL_A:
          expression: B10
          source: state-contrast analysis 2026-07-29
          verified: false
          notes: >-
            Live slow-drift byte at WiCAN B10 (reassembled idx 7). Observed 0x9A-0xA2 across
            sessions; drifts ~1/reading. Mirrored by SKM_B006_VAL_B (B21). Unknown unit — candidate
            SKM supply voltage or internal temp; needs a controlled voltage/temp reference to
            identify.
        SKM_B006_VAL_B:
          expression: B21
          source: state-contrast analysis 2026-07-29
          verified: false
          notes: >-
            Redundant mirror of SKM_B006_VAL_A (B10): tracks it within +-1 (B10/B21 = 9C/9B, 9B/9A,
            9A/9A, 9F/9F, A2/A1...). Same unknown analog quantity read twice.
    22B007:
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      parameters:

        SKM_B007_FLAG:
          expression: B11
          source: state-contrast analysis 2026-07-29
          verified: false
          notes: >-
            Only varying byte in B007 (WiCAN B11, reassembled idx 8). Observed 0x00 and 0x06 — small
            enum/flag. Meaning unknown; correlate with a physical event (button/fob/door) to
            identify.
