# ─── SKM (Smart Key Module) ────────────────────────────────────────────
# Self-identifies as "SMK". Wakes from at least two or more CAN requests, slow to wake (>1s).
# Responsible for key fob detection, immobilizer, and keyfob functions.
# Falls asleep after ~60s of bus inactivity.
# Connected directly to the SSB (start/stop button) via dedicated CAN line.
SKM:
  tx_id: 0x7A5
  can_bus: [B-CAN, P-CAN] # + SSB CAN 
  identity:
    alias: SMK  # ECU self-identifies as "SMK"
    description: Smart Key Module
    mfg_date: "2017-06-02"
    diag_address: "190"
    hw_version: "10000"
    sw_version: "10200"
    id_protocol: UDS  # F1xx
    part_number: ""
    notes: >
      Smart Key Module (self-identifies as "SMK") — key-fob detection,
      immobiliser and remote functions. Slow to wake (>1s, needs two or more
      CAN requests) and sleeps after ~60s of bus inactivity. Also known as SMARTRA.
  vehicle_states: [SLEEP, PLUGGED, ACC, "ON", READY, CHARGING]
  wake:
    method: rapid_read
    prime_pid: 22B003
    attempts: 8
    interval_ms: 80
    sleep_timer_ms: 2000
    notes: >-
      SKM powers its CAN transceiver only briefly (~2s) and answers one request before sleeping
      again. Rapid-fire a cheap read (22B003) to hold it awake, then open a session and read the
      B0xx block. Verified 2026-07-29 on slcan-tcp: single 1001 wake races the sleep timer;
      back-to-back reads succeed.
  session: true
  scan_log: # SKM
    - service: 0x22
      range: "0101-010F,B001-B010"
      date: 2026-07-22
      hits: "B002,B003,B005,B006,B008,B00A"
      vehicle_states: [READY]
      notes: >
        Fob present. Re-confirmed the B0xx live-data block (already registered in this file's
        pids:). 01xx all NRC. NOTE the Hyundai -1 echo: requesting B007/B009/B00B returns
        B006/B008/B00A's data. B002 (178 B) content DIFFERS between deep-sleep (2026-04-18)
        and READY — useful power-state contrast for decoding key/immobiliser bytes.
  pids:
    22B002:
      response_frames: 26
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: >-
        178 data bytes, byte-identical across sessions and states (READY with fob 2026-07-22, SLEEP
        without fob 2026-07-29), with repeating 6-7 byte groups. The 136-byte 2026-04-18 capture is
        a corrupt reassembly with reordered frames.

    22B003:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "25 bytes: 62B003000000003412900300000000C6A21261000000000F00."
    22B005:
      response_frames: 2
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "11 bytes: 62B005FA60900000040000."
    22B006:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      parameters:

        SKM_B006_VAL_A:
          expression: B10
          source: state-contrast analysis 2026-07-29
          verified: false
          notes: 0x9A-0xA2 across sessions, drifting about 1 per reading.
        SKM_B006_VAL_B:
          expression: B21
          source: state-contrast analysis 2026-07-29
          verified: false
          notes: Within 1 of SKM_B006_VAL_A in every capture.
        SKM_B006_B12:
          expression: B12
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B006 map. 0-92; non-zero only on 2026-10-25 (19 captures). Meaning
            unknown.
          enabled: false
        SKM_B006_B17:
          expression: B17
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B006 map. 183-187 when non-zero (2026-10-22 x8, 2026-10-25 x24), else 0.
            Same range as SKM_B006_VAL_A/B: probably the same quantity on another channel.
          enabled: false
        SKM_B006_B18:
          expression: B18
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B006 map. Non-zero in the same captures as SKM_B006_B17, 183-186. See
            SKM_B006_B17.
          enabled: false
        SKM_B006_B19:
          expression: B19
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B006 map. Non-zero in the same captures as SKM_B006_B17, 183-186. See
            SKM_B006_B17.
          enabled: false
    22B007:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      parameters:

        SKM_B007_FLAG:
          expression: B11
          source: state-contrast analysis 2026-07-29
          verified: false
          notes: Only 0x00 and 0x06 observed; the only byte in B007 that varies.
    22B008:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "17 bytes, mostly 0: 62B0080000000000000009000000000000."
    22B009:
      response_frames: 5
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: 33 bytes, all 0 in all 17 captures.
    22B00A:
      response_frames: 3
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: "19 bytes: 62B00A0100F038000501080600000040010000."
    22B00B:
      response_frames: 8
      status: draft
      period: 10000
      vehicle_states: [SLEEP]
      notes: 52 bytes, beginning 62B00B800000000200000000000000000000000400005319420000000002.
  iocontrol:
    B108:
      vehicle_states: []
      label: ACC relay
      verified: true
      true: "2FB108030A0A05"
      false: "2FB10800"
      hold: false
      notes: >-
        Requires fob proximity — UDS positive response without fob is misleading (relay doesn't
        physically close). Verify via IGPM BC03 ignition byte. ACC ON: dash lights, infotainment,
        doors unlock. NRC 0x22 if ACC already on. freezeCurrentState (02) returns status bytes 6255.
        Drives the Button Start #1 (ACC) relay E48 (SMK connector B pin 12). Its output is the 'hot
        in ACC or ON' group (IGPM MODULE2 fuse): audio, navigation, USB and wireless charger, BCM,
        SMK, SBW switch. Taken from US-market wiring; unconfirmed on the EU car.

    B109:
      vehicle_states: []
      label: IGN1 relay
      verified: false
      true: "2FB109030A0A05"
      false: "2FB10900"
      hold: false
      notes: >-
        Drives the Button Start #2 (IG1) relay E43 (SMK connector B pin 2). Its output is the 'hot
        in ON or START' group: cluster, SRS airbag module, MDPS, door modules, stop-lamp switch and
        the EPCU ON/START input (pin 46). It does not carry the start request to the EPCU (see
        B10B). Not tested on this car. Taken from US-market wiring; unconfirmed on the EU car.
    B10A:
      vehicle_states: []
      label: IGN2 relay
      verified: false
      true: "2FB10A030A0A05"
      false: "2FB10A00"
      hold: false
      notes: >-
        Drives the Button Start #3 (IG2) relay E46 (SMK connector B pin 1). Its output is the 'hot
        in ON' group: front wipers, washer, A/C control module, seat warmers and ventilation, heated
        steering, BCM and SMK MODULE6 supply. IGN2 drops out during the START phase. Not tested on
        this car. Taken from US-market wiring; unconfirmed on the EU car.

    B10B:
      vehicle_states: []
      label: Start output
      verified: false
      true: "2FB10B030A0A05"
      false: "2FB10B00"
      hold: false
      notes: >-
        SMK Start Relay Output (connector C pin 10). On this EV it does not switch a starter: the
        line feeds the IGPM START fuse ('hot in START'), which supplies the EPCU 'Start Switch'
        input (pin 42) and the front-wiper FRT2 fuse, and returns to the SMK as Start Relay Feedback
        (pin 16). Asserting it presents the EPCU's start request. Not tested on this car. Taken from
        US-market wiring; unconfirmed on the EU car.

    B101:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely B+ relay or ESCL"
      verified: false
      true: "2FB10103"
      false: "2FB10100"
      notes: >
        DANGER: Likely main power relay or ESCL (steering column lock). Activating
        ESCL via raw UDS can corrupt its internal state machine, causing it to refuse
        to unlock. Known to have bricked a Renault Zoe ESCL via DDT4All — required
        dealer replacement of ESCL+SKM+BCM (cryptographically paired). Do not test
        until positively identified through non-destructive means.
    B102:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely ESCL or immobilizer"
      verified: false
      true: "2FB10203"
      false: "2FB10200"
      notes: >
        DANGER: See B101 notes. Likely ESCL lock/unlock or immobilizer control.
        ESCL has wear counter and error state that is unrecoverable without dealer tools.
    B103:
      vehicle_states: []
      label: "⚠ DO NOT TEST — likely immobilizer lamp or ESCL"
      verified: false
      true: "2FB10303"
      false: "2FB10300"
      notes: >
        DANGER: See B101 notes. May be immobilizer indicator lamp (lower risk) or
        ESCL-related (high risk). Skip until B101/B102 are identified.
