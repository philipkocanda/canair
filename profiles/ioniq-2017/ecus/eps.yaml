# ─── EPS (Electric Power Steering) ───────────────────────────────────
EPS:
  tx_id: 0x7D4
  identity:
    alias: MDPS  # Motor-Driven Power Steering
    description: Electric Power Steering
    part_number: "56310G7300"
    mfg_date: "2017-06-01"
    firmware: "MDPS C 1.00/1.03"
    id_protocol: UDS  # F1xx
    notes: Steering column
  vehicle_states: [ACC, ACC2, READY]
  pids:
    220101:
      status: active
      period: 2500
      vehicle_states: [READY]
      parameters:
        EPS_0101_STEERING_UNMAPPED:
          expression: ""
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          source: "DID scan 2026-04-17; RE 2026-07-22 driving capture"
          source_links: []
          verified: false
          notes: >
            18-byte payload. Steering data lives in ISO-TP bytes 0x03-0x0A
            (WiCAN B05,B06,B07,B09,B10,B11,B12,B13). During the 2026-07-22 drive
            (lots of steering both directions) this region swings both signs and
            settles near constant at standstill, but exact pairing/endianness/scale
            is NOT yet resolved: B10 holds a stable ~0xA8 at rest and wraps while
            driving (candidate absolute-angle low byte); B12 is a signed byte ~0 at
            rest with +-127 swings while driving (candidate steering torque/rate).
            The +-256 flips seen when treating B10:B11 or B12:B13 as a single 16-bit
            LE value show they are NOT clean little-endian pairs. Needs a controlled
            capture (see research entry) to pin down angle vs torque vs MDPS current.
            B14 = vehicle speed (decoded). B18/B19 tail = 0x1010 constant.
        EPS_VEHICLE_SPEED:
          expression: B14
          unit: km/h
          min: "0"
          max: "250"
          source: RE 2026-07-22 driving capture
          verified: true
          notes: >
            EPS-side vehicle speed echo (speed-dependent steering assist). ISO-TP 0x0B. Tracks ESC REAL_SPEED_KMH within +-1 km/h across 0-39 km/h drive; 0 at standstill. UNSIGNED magnitude — reads positive when reversing (like ESC REAL_SPEED_KMH); single byte, no sign. EPS carries no gear/direction, so a directional speed can't be derived from this PID alone — use ESC GEAR_SELECTOR for direction.
        EPS_STEERING_FAST:
          expression: (B10+S11*256)/10
          unit: deg
          min: "-500"
          max: "500"
          source: RE 2026-07-22 MT->KW drive; Ioniq5 /10 deg convention
          verified: false
          notes: >
            DISPROVEN as absolute steering angle (was STEERING_ANGLE, renamed+disabled 2026-07-26). B10:B11 is a FAST steering signal (rate / MDPS motor position / torque; exact identity unresolved), NOT absolute wheel angle. Proof: 2026-07-26 driveway capture — while the wheel was held (ESC STEERING_ANGLE rock-steady at -461 deg 17:01:11-50, then +24 deg 17:03:31+), this value FLIP-FLOPPED 0/-25.6 deg every sample and never held. The +-25.6 flip is the +-256/10 artifact of a non-clean-LE byte pair (see prior note). The true absolute steering wheel angle is ESC 22C101 STEERING_ANGLE (B35:B36, offset-binary /10).
          enabled: false
        EPS_STEERING_TORQUE:
          expression: (B12+S13*256)
          unit: ""
          min: "-10000"
          max: "10000"
          source: RE 2026-07-23 analysis of 2026-07-22 MT->KW drive
          verified: false
          notes: >
            Candidate steering/MDPS torque. LE signed 16-bit at ISO-TP 0x09:0x0A
            (low B12, signed high S13; no PCI between). Range -9258..+9752,
            symmetric ~0, ~0 at standstill. r=-0.64 vs STEERING_ANGLE (opposite
            sign → self-centering torque), r=-0.43 vs d(angle)/dt. 2nd column-angle
            rep not ruled out. Scale raw. Verify: hold torque at fixed wheel
            positions.
          enabled: true
        EPS_MDPS_ASSIST:
          expression: B17
          unit: ""
          min: "0"
          max: "255"
          source: RE 2026-07-23 analysis
          verified: false
          notes: >
            Candidate MDPS motor assist. ISO-TP 0x0D. 0 at all 16 standstill
            samples; 0-253 while moving, r=+0.53 vs VEHICLE_SPEED (noisy).
            Speed-gated unsigned magnitude → likely motor current or PWM/assist
            duty. Not clean-linear; scale raw. Verify with controlled steer-effort
            capture.
          enabled: true
        EPS_STEERING_TORQUE_ALT:
          expression: S7
          unit: ""
          min: "-40"
          max: "40"
          source: RE 2026-07-23 analysis
          verified: false
          notes: >
            Small signed steering signal, ISO-TP 0x05. Raw -36..+37, ~0 at rest
            (-10..-1), r=+0.34 vs STEERING_ANGLE. Candidate driver torque or
            angular rate. Distinct from EPS_STEERING_TORQUE (B12:S13). Verify:
            disambiguate driver-torque vs rate vs MDPS with a controlled capture.
          enabled: true
        EPS_B9_FLAG:
          expression: B9
          min: "0"
          max: "255"
          source: RE 2026-07-23 analysis
          verified: false
          notes: >
            Bimodal 0x00/0xFF status/validity flag at ISO-TP 0x06, before the
            STEERING_ANGLE low byte B10. Likely angle sign/validity or MDPS status.
            Verify what toggles it. B05=0x8A B06=0x8E constant; B18/B19 tail=0x1010
            constant; B20/B21 = ISO-TP message counter (cycles 21→22).
          enabled: false
        EPS_SPEED_BAND:
          expression: B15
          unit: ""
          min: "0"
          max: "3"
          source: canair correlate/decode analysis of 2026-07-22 MT->KW drive
          verified: false
          notes: >
            Speed-sensitive MDPS assist band. ISO-TP 0x0C (WiCAN B15). Discrete step counter 0-3 that increases with vehicle speed (r=+0.953 vs EPS_VEHICLE_SPEED/B14 over 360 driving captures). Steps 0->1 at ~26-27 km/h with hysteresis (returns to 0 below ~25 km/h); bands 2 and 3 at higher speeds. Only ever 0/1/2/3 (219/85/23/33 samples) so NOT a speed high byte. Consistent with a speed-band selector that discretely reduces steering assist as speed rises. Verify: sustained-speed sweep to pin each band's threshold.
    220102:
      status: static
      period: 2500
      vehicle_states: [READY]
      parameters:
        EPS_0102_UNKNOWN:
          expression: ""
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          source: "DID scan 2026-04-17"
          source_links: []
          verified: false
          notes: "13 bytes. B6=0x03, rest zeros. Status/config register. Payload: 62010200000003000000000000"
  research:
    - type: scan
      target: "22 0101-0105"
      status: done
      priority: P2
      vehicle_states: [ACC]
      notes: "0101 = steering wheel angle absolute (/10 deg), MDPS motor current (signed A) per Ioniq 5."
      sources:
        - "OBDb Ioniq 5"
        - "OpenDBC fingerprints confirm EPS at 0x7D4"
    - type: decode
      target: "220101"
      status: captured
      priority: P1
      vehicle_states: [READY]
      notes: >
        2026-07-26: the B10:B11 "STEERING_ANGLE" candidate is DISPROVEN as the
        absolute wheel angle and was renamed EPS_STEERING_FAST + disabled. On the
        2026-07-26 driveway steer-and-hold capture it flip-flopped 0/-25.6 deg
        every sample while the wheel was held (the +-256/10 non-clean-LE artifact),
        never holding — whereas the true absolute steering wheel angle, found the
        same session on ESC 22C101 B35:B36 (offset-binary /10), held rock-steady at
        -461 then +24 deg. B10:B11 is a fast steering signal (rate / MDPS motor
        position / torque), exact identity unresolved. VEHICLE_SPEED (B14) decoded.
        2026-07-23 (376 captures) added three enabled-unverified candidates from
        B05-B17: EPS_STEERING_TORQUE = (B12+S13*256) LE signed-16 at ISO-TP
        0x09:0x0A, range ±9500, ~0 at rest, r=-0.64 vs the old angle candidate
        (torque or 2nd steering rep); EPS_MDPS_ASSIST = B17, 0 at standstill, 0-253
        moving, r=+0.53 vs speed (motor current/PWM); EPS_STEERING_TORQUE_ALT = S7
        (small signed ±36). B9 = bimodal 0/FF flag (EPS_B9_FLAG, disabled). Open:
        what EPS_STEERING_FAST (B10:B11) actually is; torque vs rate; assist units.
      what_to_test:
        - "EPS_STEERING_FAST (B10:B11) — rate vs MDPS motor position vs torque? correlate d(ESC STEERING_ANGLE)/dt vs this on a real drive"
        - "EPS_STEERING_TORQUE (B12:S13) — torque vs 2nd angle? hold wheel against resistance at fixed positions to separate torque from displacement; find units"
        - "EPS_MDPS_ASSIST (B17) — motor current/PWM? push wheel with engine on/off to vary assist effort at fixed speed"
        - "EPS_STEERING_TORQUE_ALT (S7) vs B12:S13 — which is driver torque, which is rate/MDPS?"
      sources:
        - "captures/2026-07-22.yaml — driving capture, lots of steering"
        - "captures/2026-07-26.yaml — driveway steer-and-hold (disproved B10:B11 as absolute angle; ESC 22C101 B35:B36 is the real one)"
        - "OBDb Ioniq 5"
      capture_protocol: >
        Car stationary in ACC/ready. Hold wheel steady ~5s at each of: centre,
        quarter-turn left, quarter-turn right, full-lock left, full-lock right;
        then a slow lock-to-lock sweep. Save each with --label/--state, then
        'canair decode ESC 22C101 --param STEERING_ANGLE --compact' to confirm the
        SAS zero/scale, and diff EPS_STEERING_FAST against d(angle)/dt.
    - type: decode
      target: "220101"
      status: pending
      priority: P2
      vehicle_states: [READY]
      notes: >
        LKAS / lane-keep signals. This car has active LKAS (lane-keep assist steering)
        which commands the MDPS to apply torque — so EPS 220101 (or a sibling
        22010x page / a separate LKAS-related DID) likely carries an LKAS active
        flag, a commanded-torque/overlay-torque value, and possibly a driver-override
        / hands-on-wheel torque. Capture during an LKAS-active highway drive (lane
        markings present, LKAS engaged, then let it nudge the wheel and also
        override it) and diff against a manual-steering drive to isolate the LKAS
        command bytes from the driver-angle/torque bytes (B7/B12 region).
      what_to_test:
        - "LKAS active/engaged flag"
        - "LKAS commanded/overlay steering torque"
        - "Driver override / hands-on-wheel torque"
        - "Whether LKAS data is on 220101 or a sibling 22010x page"
      sources:
        - "OpenDBC Hyundai LKAS message set (MDPS / LKAS11/LKAS12)"
        - "OBDb Ioniq 5"
    - type: scan
      target: 22 0100-0110
      status: done
      priority: P2
      vehicle_states: [READY]
      date: "2026-07-22"
      result: "22010x sibling sweep (ignition on): only 0101 (18B) and 0102 (8B) respond; 0100 and 0103-0110 all NRC. No hidden sibling pages -> any LKAS active/torque-command signal must live WITHIN 220101/220102 themselves (or is not OBD-exposed on EPS). Narrows the LKAS decode lead."
      notes: Hidden-page hunt 2026-07-22. Rules out sibling 22010x pages for the LKAS backlog.
      updated: "2026-07-23"
    - type: verify
      target: "220101"
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-07-23"
      notes: "Verify EPS_SPEED_BAND (B15). 2026-07-23: discrete 0-3 band, r=+0.953 vs speed, steps 0->1 at ~26-27 km/h with hysteresis. Confirm thresholds with a sustained-speed sweep (hold 15/25/35/50/70/90 km/h) and check whether steering assist/effort changes at each band edge."
