          verified: false
          notes: >-
            Set only when the tail and low-beam outputs are on AND ACC2_IGN_ON=1 (23 rows). 0 in the
            6 rows with the lamps still on after ignition off, and 0 with the lamps off. The OBDb
            Hyundai-IONIQ-Electric signalset reads this byte as HL_SW, 'Headlight switch' (0 or 4,
            equal to this bit in every capture). ScanDoc lists this bit as the low beam switch
