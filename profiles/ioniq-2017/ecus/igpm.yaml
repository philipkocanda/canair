      notes: >-
        opendbc CGW1 (0x541), CGW2 (0x553) and CGW4 (0x559) list the body signals the gateway
        publishes. CGW1 is on the uhi22 Ioniq 28 logs and its driver-door bit toggles when the
        driver leaves the car. Signals there that 22BC03-07 do not map yet: light switch position
        (2-bit), auto-light status, front and rear fog, hazard switch, turn-signal stalk, wiper
        stages (int/low/high/auto/mist) and intermittent time, rain sensor state, park brake switch,
        passive-access lock/unlock, RKE (key fob) command, window states and heated steering wheel
        (CGW4), rear seatbelt indicators, steering-lock warnings (CGW2). Use this as the actuation
        checklist for the existing 22BC03/BC04/BC06 bit-gap entries. The DBC bit positions do not
        carry over to the DIDs. projectgus bench_kona (Kona OS EV) decodes concrete 0x541 frame-byte
        offsets to cross-check the DIDs against: byte0 = ignition switch (0x03 on), byte2 bits =
        driver door closed + driver seatbelt (0x44), byte5 = drive-type option (0x08), byte7 =
        IGN1+IGN2 (0x0C) plus the park-brake switch. These are 0x541 frame offsets (not DID offsets)
        and from a Kona, so treat as hypotheses. Cross-checked 2026-10-29 against the real Ioniq
        0x541 on the uhi22 P-CAN tap, decoded with opendbc CGW1: IGNSw = 3 (byte0 = 0x03 confirmed),
        DriveTypeOption at byte5 bit3 confirmed, byte7 = 0x0C present but undocumented in opendbc.
        The Kona 'byte2 = door + seatbelt' is a mislabel: opendbc places driver door/seatbelt in
        byte1. The 0x541 IGNSw/DriveTypeOption/HeadLampLow/LightSwState fields are now defined in
        signals/body.yaml (CGW1).
