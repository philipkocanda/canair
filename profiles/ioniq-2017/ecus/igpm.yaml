    - type: verify
      target: "22BC07 B12:3 UNKNOWN_B12_3 vs IG3 #1 relay"
      status: pending
      priority: P2
      vehicle_states: [READY, CHARGING, PLUGGED]
      created: "2026-10-23"
      updated: "2026-10-23"
      notes: >-
        The EV-only IG3 supply is closed by the IG3 #1 relay while the HV controller operates,
        except during charging; the IG3 #2 relay is for AC charging and a third relay for DC. The
        IG3 #1 coil is driven by the OBC. The IG3 #2 coil line runs to the AVN and audio head unit's
        'IG3 relay control' pins (see the AVN research entry: the head unit is expected to request
        IG3 for scheduled or remote actions), so who closes #2 in practice is not known.
        IG3_RELAY_OUTPUT follows the #1 pattern in the stored captures (1 in READY and the parked 12
        V top-up, 0 while charging, 1 in a charging session with the ignition on). Unproven: the bit
        may instead be the IGPM's own request for the Main relay it controls, or another IG3 path.
        The wiring is from a US-market diagram; the stored captures are from the EU car.
      sources:
        - align over stored captures 2026-10-23
      what_to_test:
        - "Record IGPM 22BC07 and OBC/VCU 2101 with --keep-all at 1 s while plugging an AC cable into the parked car: B12:3 should fall as charging starts. Repeat at charge end and, if available, on a DC session."
        - Compare the fall time of B12:3 with VEHICLE_STATE_LDC_ENABLED and BMS CHARGING on the same recording to see which leads.
      capture_protocol: >-
        canair monitor IGPM:22BC07 VCU:2101 BMS:2101 OBC:2101 --save --keep-all --interval 1 --label
