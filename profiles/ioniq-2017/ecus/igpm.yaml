            it off). Cross-tab vs 22BC06 LEFT/RIGHT_TURN_SIGNAL over 380 aligned rows: set in 18 of
            23 left rows, 0 of 23 right rows, 0 of 334 with neither. Both sides set (B10=0xF0) only
            at the fob-unlock flash. B10:6 (TURN_LAMP_LR) never differs from it. Named
            TURN_LAMP_LEFT until 2026-10-30.
        TURN_LAMP_RF:
          expression: B10:5
          min: "0"
          max: "1"
