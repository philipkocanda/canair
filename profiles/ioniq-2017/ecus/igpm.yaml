      label: Front fog light
      verified: true
      true: "2FBC0303"
      false: "2FBC0300"
      notes: >
        No visible effect — Ioniq 2017 base trim has no fog light bulbs installed.

    BC04:
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      label: Tail / rear light
      verified: true
      true: "2FBC0403"
      false: "2FBC0400"
      status_param: TAIL_LIGHTS

    BC05:
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      label: Blue instrument LEDs
      verified: true
      true: "2FBC0503"
      false: "2FBC0500"
      notes: >
        Also turns on green indicator on dash.

    BC07:
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      label: Horn
      verified: true
      true: "2FBC0703"
      false: "2FBC0700"
      notes: >
        LOUD — be careful when testing! Not labeled in Soul/e-Niro tables but
        confirmed on Ioniq.

    BC08:
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      label: Rear fog light
      verified: true
      true: "2FBC0803"
      false: "2FBC0800"

    BC09:
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      label: Trunk unlock
      verified: true
      true: "2FBC0903"
      false: "2FBC0900"
      status_param: TRUNK_OPEN
      notes: >
        Triggers alarm if car is locked! Releases latch only (no lift motor).

    BC0A:
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      label: Welcome / approach light
      verified: false
      true: "2FBC0A03"
      false: "2FBC0A00"
      notes: >
        Likely puddle lights or DRL greeting on unlock.
        ACC: Tested, no visible result.

    BC0C:
