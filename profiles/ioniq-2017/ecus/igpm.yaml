  research:
    - type: decode
      target: 22BC04/BC06 body bits
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-07-23"
      notes: "Undecoded toggling bits in IGPM body DIDs (candidates registered, need physical correlation): BC04 B10:0 (distinct from door locks B10:2/3), BC04 B12:5, BC04 B13:6; BC06 brake composite B10=0x2D sets bits 2,3,5 (BRAKE_PEDAL_BITS=B10:2 candidate). Other BC03/BC04/BC06 unmapped bits constant-0. BC01/BC02/BC05 closed as static config. Verify: actuate each body function while capturing; press brake with turn signals off to isolate the brake bit."
    - type: decode
      target: 22BC07
      status: captured
      priority: P2
      vehicle_states: [ALL]
      created: "2026-08-05"
      updated: "2026-08-05"
      notes: "IGPM 22BC07 corpus event-timeline pass 2026-08-05 (investigate --events --bits over 285 captures). CONFIRMED on fresh data: CHARGE_PORT_LOCK (B11:7) and CHARGE_PORT_LOCK_INV (B12:0) move together and inversely at every plug-in/charge-end across five separate charge sessions, re-validating both. TWO UNMAPPED BITS SHOW STRUCTURE: (1) B12:2 = self-clearing wake/power-transition latch, ~2-3 min, 2 clean episodes (added as IGPM_WAKE_LATCH_B12_2, disabled). (2) B10:4 = 4 transitions only, and inconsistent dwell: once 0->1 on arrival from a 1h drive then 1->0 just 50 s later, but on another date it held 1 for ~3.5 h and cleared exactly when charging started and the port locked. Both a 50 s and a 3.5 h dwell rule out a simple door/flap state; not defined. METHOD NOTE: a parked AC charge does not exercise body signals at all, so IGPM cannot be decoded from charge sessions - it needs a dedicated event capture."
      sources:
        - canair investigate --events --bits + decode --compact corpus timeline 2026-08-05
      what_to_test:
        - "Dedicated IGPM event capture with --keep-changes: doors/trunk/hood/windows/lights/lock-unlock in a scripted order with capture notes per action, so investigate --events can attribute each bit to an action."
        - B10:4 — what is 1 for 50 s after arriving from a drive AND for 3.5 h before a charge starts? Log it across plug-in-without-charge vs charge-start, and across arrival/lock/sleep.
        - B12:2 — time the latch across SLEEP->ACC->READY transitions and a pure CAN-wake to confirm it is a self-expiring wake latch.
    - type: verify
      target: 22BC03 B13:1
      status: pending
      priority: P2
      vehicle_states: [READY]
      created: "2026-08-06"
      updated: "2026-08-06"
      notes: "B13:1 is the only unlabelled toggling bit on 22BC03: 2 episodes / 4 transitions, median-on 234s, all within the 2026-07-30 10:17-10:25 defroster + DC-load window. r=+0.604 (n=18) vs VCU:2102:VCU_AUX_POWER, so it is a 12V load or load-related flag, but the HVAC blower bits dominate that signal (r=0.883) and one edge contradicts the note (bit cleared at 10:20:41 while the note says the defroster was still on). Not nameable from this data."
      what_to_test:
        - Repeat the controlled A/B/A rear-defroster ON/OFF test used for OBC LDC_OUTPUT_V on 2026-07-22, but co-poll IGPM:22BC03 (that session polled OBC only, so B13:1 was unavailable). Also toggle heated mirrors and heated seats separately to separate the loads.
    - type: decode
      target: 22BC03 B11:3,B11:4,B11:7 B12:0,B12:1,B12:6,B12:7
      status: pending
      priority: P3
      vehicle_states: [RUN]
      created: "2026-08-06"
      updated: "2026-08-06"
      notes: Declared bitfield gaps that are CONSTANT across all 297 timed captures — never exercised, so unknowable from current data rather than unused. B11 has bits 0,1,2,5,6 decoded (hood, seatbelts, ACC2/ign); B12 has 2,3,4,5 decoded (DRL, tail, high beam, low beam).
      what_to_test:
        - "Narrated event capture exercising the untested body functions: fog lights, hazard/turn indicators, rear seatbelts, reverse lights, parking/position lamps, wiper and washer, horn. One actuation at a time with an 's' note per action, --keep-changes."
    - type: verify
      target: 22BC03 B10:2 DOOR_RR_OPEN — no transition in the corpus
      status: pending
      priority: P3
      vehicle_states: [ACC2]
      created: "2026-08-06"
      updated: "2026-08-06"
      notes: DOOR_RR_OPEN is verified:true from a 2026-04-15 live door test, but it reads constant 0 across all 315 retained captures while every sibling bit on B10 varies (DOOR_RL_OPEN, DOOR_LOCK_RL, DOOR_LOCK_RR, DOOR_PAS_OPEN, DOOR_DRV_OPEN, TRUNK_OPEN). The rear-right door was simply never opened in the retained data, so the verification is undocumented rather than wrong. Open that door once during the next narrated body capture to put the evidence back in the corpus. Same applies to SEATBELT_FR (B11:2, already unverified) — buckle the front passenger belt.
      sources:
        - canair bitfield analysis 2026-08-06
      capture_protocol: >-
        During any narrated IGPM body capture: open and close the rear-right door, and separately
        buckle/unbuckle the front passenger seatbelt, noting each with 's'.
    - type: decode
      target: 22BC03-07 body bits (CGW1/CGW2/CGW4 candidates)
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-21"
      updated: "2026-10-21"
      result: >-
        2026-10-21, from existing captures: 22BC05 B10:4/B10:5 = left/right turn-lamp outputs
        (B10:6/B10:7 duplicates), B11:7 = passenger seat occupied, B12:2 = set only with lamps on
        and ignition on (meaning open); 22BC07 B10:4 = TRUNK_OPEN duplicate; 22BC03 B13:1 = a ~150 W
        12 V load step, probably the rear-window heater. The rest of the checklist needs a narrated
        actuation capture.
      notes: "opendbc CGW1 (0x541), CGW2 (0x553) and CGW4 (0x559) list the body signals the gateway publishes. CGW1 is on the uhi22 Ioniq 28 logs and its driver-door bit toggles when the driver leaves the car. Signals there that 22BC03-07 do not map yet: light switch position (2-bit), auto-light status, front and rear fog, hazard switch, turn-signal stalk, wiper stages (int/low/high/auto/mist) and intermittent time, rain sensor state, park brake switch, passive-access lock/unlock, RKE (key fob) command, window states and heated steering wheel (CGW4), rear seatbelt indicators, steering-lock warnings (CGW2). Use this as the actuation checklist for the existing 22BC03/BC04/BC06 bit-gap entries. The DBC bit positions do not carry over to the DIDs."
      sources:
        - opendbc hyundai_2015_ccan.dbc (commaai, MIT), cross-checked against uhi22 Ioniq28Investigations P-CAN logs (scripts/fetch_can_corpus.py)
      what_to_test:
        - "Light switch: step OFF/AUTO/position/low beam and look for a 2-bit field"
        - "Wiper stalk: mist, intermittent (each delay step), low, high, auto"
        - Hazard switch, fog lights, park brake switch, heated steering wheel, each window down/up
        - Rear seatbelts buckled/unbuckled; key fob lock/unlock and passive (handle) lock/unlock
      capture_protocol: >-
        canair monitor @body --save --keep-changes --label 'IGPM body sweep' --state READY. One
        actuation at a time, pressing 's' to note each, holding each state ~3 s.

