        IG3_RELAY_OUTPUT is 1 in READY, the 12 V top-up and AC charging with the ignition on, 0 in
        AC and DC charging with it off. OBC_AC_NOT_CONNECTED (B22:0) is 0 whenever an AC cable is
        connected, ignition or not, and 1 during DC charging. The factory text has IG3 #1 open
