      sources:
        - OBDb Hyundai-IONIQ-Electric signalset and its tests/test_cases (2017/2018 command_support), compared 2026-10-27
      what_to_test:
        - Buckle each rear belt and watch BC04 B12:1-3
        - Press the hazard switch with the engine off and in READY, compare BC05 B10 against the fob-unlock flash
        - Rear defogger on and off against BC07 B11:0 and the BC03 B13:1 load step
        - Heated steering wheel on and off against BCM 22B00C B10:5
