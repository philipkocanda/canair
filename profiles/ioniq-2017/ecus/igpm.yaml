      label: Rear defogger relay
      verified: true
      true: "2FBC0C03"
      false: "2FBC0C00"
      notes: >
        Well-documented on e-Niro/Soul — defrosts rear window.
        ACC: Confirmed (loud click). Also lights button on HVAC controls.

    BC10:
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
