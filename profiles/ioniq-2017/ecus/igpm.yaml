# ─── IGPM (Integrated Gateway Power Module) ──────────────────────────
IGPM:
  tx_id: 0x770
  iocontrol_scan_ranges: [B000-BFFF, BD00-BDFF, C000-C0FF]
  can_bus: [ALL]
  identity:
    alias: "SJB" # Smart Junction Box (older HKMC naming)
    description: Integrated Gateway & Power Module
    part_number: "91950G7510"
    mfg_date: "2017-06-06"
    hw_version: "100"
    sw_version: "109"
    boot_sw: "20"
    app_sw: "160205"
    id_protocol: UDS  # F1xx
    notes: >-
      CAN gateway and power distribution module. The OBD port connects to it directly, so all
      diagnostic requests are routed through it.
  vehicle_states: [ALL]
  # WARM-UP: the first request to IGPM after it's been idle is slow and may
  # time out / return NO DATA on the first try; retry (or prime) and subsequent
  # reads are fast. This is the ECU waking, not a bad PID. See profile.yaml
  # (RECON GOTCHA). Observed here first during recon; likely affects most ECUs.
  #
  # UDS service-22 multi-DID batching: verified on-device 2026-07-21 — IGPM
  # answers `22 BC03 BC06` with `62BC03 <data> BC06 <data>` (BCM, by contrast,
  # rejects it with NRC 0x13). The monitor batches ≤3 known-length DIDs per
  # request and auto-falls back to single reads if a request is ever rejected.
  multi_did: true
  # NOTE: service-22 PID reads (22BC03/04/06 etc.) do NOT need an extended
  # diagnostic session. Verified 2026-07-21 on the live car (READY mode): a bare
  # ATSH770;ATFCSH770;22BC03 returned a valid 62BC03 payload with no 1003 sent,
  # reconfirmed after an 8s idle so the S3 timer had expired. The earlier
  # 2026-04-15 "1003 required for reads" note was wrong. IOControl (service 2F)
  # still requires 10 03 — that is handled per-command in the live query path,
  # not by this flag, so no session flag is set here.
  scan_log: # IGPM
    - service: 0x31
      range: "0000-FFFF"
      date: 2026-04-20
      hits: 0
      probes: 768  # cut off at 0x00FF — battery died
      vehicle_states: [SLEEP]
      notes: >
        All NRC 0x12 (subFunctionNotSupported) — IGPM does not support sub-function 03
        (requestRoutineResults). Sub-function 01 (startRoutine) untested (unsafe to scan blindly).
  pids:
    22BC07:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      period: 5000
      status: active
      response_frames: 2
      vehicle_states: [ALL]
      notes: >-
        8 data bytes. B12 values: 0x11 power off and not charging, 0x10 power off and charging, 0x18
        ACC2 with the charge port locked, 0x19 ACC2 with it unlocked (B12:0 is the unlock flag, the
        complement of B11:7). B05-B07 and B09 (08 41 FB CC) and B13 (0) are constant in all 411
        captures.
      parameters:
        # TODO: All the other bytes on here!
        # Maybe window states?
        CHARGE_PORT_LOCK:
          expression: "B11:7"
          ha_class: lock
          verified: true
          notes: 1 = locked. Verified 2026-07-18.

        CHARGE_PORT_LOCK_INV:
          expression: "B12:0"
          ha_class: lock
          verified: true
          notes: "Complement of CHARGE_PORT_LOCK: 1 = unlocked. Verified 2026-07-18."

        IG3_RELAY_OUTPUT:
          expression: "B12:3"
          verified: false
          notes: >-
            ScanDoc 'Ignition 3 Relay' (22BC07 byte 2 bit 3; actuator BC44): the IGPM's own IG3
            relay output. The OBC's relay supplies IG3 while charging with the ignition off, which
            is why it reads 0 then. Aligned with VCU 2101 (3 s join, no fill): 1 in 60 of 61 READY
            rows and in 19 of 19 rows of the parked 12 V top-up (2026-10-21, ACC2_IGN_ON 0). Aligned
            with BMS 2101: 0 in 239 of 242 charging rows; the 3 exceptions are 2026-08-02, a session
            with the ignition on. 0 in 13 of 14 other VCU rows (HV off or drive path down). In the
            top-up run it last read 1 at 21:16:47 and first read 0 at 21:17:21; the VCU's HV relay
            was open by 21:17:08. One READY row (2026-08-08) reads 0. On 2026-08-08 it read 0 from
            the first sample of both DC fast charges (11:41:23, 16:31:23) and returned with READY at
            16:44:22, while OBC_AC_NOT_CONNECTED read 1 throughout, so the two are different
            signals. Named UNKNOWN_B12_3 until 2026-10-30.
          source: align vs VCU 2101 and BMS 2101 over stored captures, 2026-10-23
        CHARGE_DOOR_LAMP_REAR:
          expression: B12:2
          source: RE 2026-08-05 event-timeline analysis; revisited 2026-08-08 session
          verified: false
          notes: >-
            ScanDoc 'Rear Charge Door Lamp - Output' (22BC07 byte 2 bit 2; actuator BC43). 1 in 15
            of 328 captures. Set at every recorded plug-in with the ignition off, just before the
            port locks (2026-08-02 09:52:59, 08-08 11:41:23, 16:31:23, 17:53:19), and in a
            minute-long episode with the port unlocked (2026-10-22 14:21:58-14:23:02); where sampled
            it clears within 1-3 min, like a lamp timing out after the charge door opens.
            Unexplained: pulses about every 6 min during the 2026-08-08 evening charge (18:09,
            18:16, 18:22, 18:28). Named IGPM_BC07_B12_2 until 2026-10-30.
          enabled: true
        TRUNK_OPEN_BC07:
          expression: B10:4
          min: "0"
          max: "1"
          source: canair correlate --find-mirrors --bits 2026-10-21
          verified: false
          notes: >-
            Equals 22BC03 TRUNK_OPEN (B10:7) in all 349 aligned rows, and 22BC05
            LUGGAGE_LAMP_OUTPUT. Disabled as a duplicate.
          enabled: false

    22BC03:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      status: active
      period: 2500
      vehicle_states: [ALL]
      notes: >-
        B09 reads 0x73 in all 384 captures. B05=0xFD, B06=0xEE, B07=0x3C and B13=0x00 are constant.
        B10 bit 6 has never been set.
      parameters:
        # B10 = Doors and locks
        # B11 = Seatbelts
        # B12 = Lights
        # B13 =
        DOOR_DRV_OPEN:
          expression: B10:5
          ha_class: door
          source: Kia Niro EV WiCAN PR#716; confirmed by timed event capture 2026-07-24
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: 1 = open.

        DOOR_PAS_OPEN:
          expression: "B10:4"
          ha_class: door
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: "Bit flag — 1=open. Verified 2026-04-15."

        DOOR_RL_OPEN:
          expression: "B10:0"
          ha_class: door
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: "Bit flag — 1=open. Verified 2026-04-15."

        DOOR_RR_OPEN:
          expression: B10:2
          ha_class: door
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: >-
            Bit flag — 1=open. Verified 2026-04-15 (live door test).

        TRUNK_OPEN:
          expression: "B10:7"
          ha_class: door
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: "Bit flag — 1=open. Verified 2026-04-15."

        TAIL_LAMP_INTERIOR:
          expression: "B12:2"
          ha_class: light
          source: Decoded from live captures (2026-04-15); GDS 'Tail Lamp Output (Interior)' name, align vs 22BC04 B12:5 2026-10-30
          source_links: []
          verified: true
          notes: >-
            1 = interior tail lamp output (GDS 'Tail Lamp Output (Interior)', ScanDoc 'AV tail'),
            the instrument illumination circuit; actuator twin BC05. Equals TAIL_LIGHTS (B12:3) in
            1798 of 1799 aligned rows (the 1 exception reads 1 with B12:3 = 0). Reads 0 in the 8
            rows where the dedicated DRL output (22BC04 DRL_DEDICATED_OUTPUT) is on, so it is not a
            DRL signal. On in every light mode (DRL, low and high beam). Named DRL until 2026-10-30.

        TAIL_LIGHTS:
          expression: "B12:3"
          ha_class: light
          source: "Decoded from live captures (2026-04-15)"
          source_links: []
          verified: true
          notes: >-
            1 = on, in every light mode (DRL, low and high beam). GDS 'Tail Lamp Output (Exterior)'
            (the tail lamp relay). Verified 2026-04-15.

        HIGH_BEAM:
          expression: "B12:4"
          ha_class: light
          source: "Decoded from live captures (2026-04-15)"
          source_links: []
          verified: true
          notes: 1 = on, only with high beams (B13:4 in the Niro EV source). Verified 2026-04-15.

        LOW_BEAM:
          expression: "B12:5"
          ha_class: light
          source: "Decoded from live captures (2026-04-15)"
          source_links: []
          verified: true
          notes: 1 = on, also while the high beams are on. Verified 2026-04-15.

        ACC2_IGN_ON:
          expression: "B11:5"
          ha_class: power
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: >-
            1 in ACC2 and READY (not told apart), 0 when off and in ACC1. Also 1 in ACC2 while AC
            charging. Fob unlock does not set it. It rises with the ACC to ON press, where IGN1 and
            IGN2 are energised together, so it cannot be attributed to one of them from the button
            sequence. GDS names B11:5 'IGN1 Switch' and B11:6 'IGN2 Switch' (IGN2_SWITCH); the AE
            manual's current-data list runs brake fluid, IGN1, IGN2 in bit order. The name stays
            because the ACC2 state predicate and other ECUs' notes use it. IGN2 should drop while
            START is held and IGN1 stay; not yet captured.

        SEATBELT_FL:
          expression: "B11:1"
          ha_class: ""
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: 1 = driver belt buckled. Verified 2026-04-15.

        SEATBELT_FR:
          expression: "B11:2"
          ha_class: ""
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: false
          notes: 1 in 22 of 384 captures. Not checked against a buckled passenger belt.

        DOOR_LOCK_RL:
          expression: "B10:1"
          ha_class: lock
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: >-
            1 = locked; no inversion needed (the Niro EV source inverts it). Verified 2026-04-15.

        DOOR_LOCK_RR:
          expression: "B10:3"
          ha_class: lock
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: >-
            1 = locked; no inversion needed (the Niro EV source inverts it). Verified 2026-04-15.
        IGN2_SWITCH:
          expression: B11:6
          min: "0"
          max: "1"
          source: RE 2026-07-23 bit analysis (40 captures)
          verified: false
          notes: >-
            GDS 'IGN2 Switch' (22BC03 byte 1 bit 6). Equals ACC2_IGN_ON (the IGN1 switch, B11:5) in
            every capture so far; the two should differ only while START is held (IGN2 drops, IGN1
            stays), which has not been recorded. Disabled so it does not ship a duplicate. Named
            IGN_STATUS_MIRROR until 2026-10-30.
          enabled: false
        HOOD_OPEN:
          expression: B11:0
          min: "0"
          max: "1"
          source: Timed event capture 2026-07-24
          verified: true
          notes: 1 = open. Found 2026-07-24.
        REAR_DEFOGGER_RELAY:
          expression: B13:1
          source: bitfield analysis 2026-08-06; align vs VCU_AUX_POWER 2026-10-21; DBC cross-check 2026-10-29
          verified: false
          notes: >-
            Candidate rear-window heater relay. Set only in the 2026-07-30 10:17-10:25 window
            (narrated 'defroster on', then the separate 'front' button): on 10:17:01, off 10:20:41,
            on 10:21:24, off by 10:25:30. Each edge moves VCU_AUX_POWER by a 127-172 W step with the
            blower unchanged. HVAC 2201A0 HVAC_DEFROST_FLAGS stays 0 throughout, and BC07 B11
            (OBDb's 'defog light') stays 0, so neither is the same signal. The gateway publishes a
            rear defogger relay state on broadcast 0x541 (opendbc CF_Gway_DefoggerRly), so the IGPM
            carries one. Unproven: the 10:20:41 off edge is not narrated. Test: toggle only the
            rear-window button in READY and watch this bit.


    22BC04:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      status: active
      period: 5000
      vehicle_states: [ALL]
      notes: >-
        8 data bytes. B10 holds the front door locks (B10:2/3) and the power window enable relay
        (B10:0), B13:6 INTERIOR_LAMP_AUTOCUT_RELAY. B05-B07 and B09 (B5 3F F4 EA), B11 (0) and B13:1
        (1) are constant in all 410 captures, across every power state. B12:5 (DRL_DEDICATED_OUTPUT)
        set only in 8 captures (2026-07-21, in D with the lamps off).
      parameters:
        # TODO: All the other bytes on here
        DOOR_LOCK_FL:
          expression: "B10:3"
          ha_class: lock
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: "1=locked, 0=unlocked. Verified 2026-04-15."

        DOOR_LOCK_FR:
          expression: "B10:2"
          ha_class: lock
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: "1=locked, 0=unlocked. Verified 2026-04-15."
        POWER_WINDOW_ENABLE_RELAY:
          expression: B10:0
          min: "0"
          max: "1"
          source: RE 2026-07-23 bit analysis; ignition cross-tab 2026-10-22
          verified: false
          notes: >-
            GDS 'Power Window Enable Relay' (first item of the 22BC04 current-data list). Follows
            the ignition on the way up: equals 22BC03 ACC2_IGN_ON in 431 of 432 aligned rows, with
            the same poll rising. The BCM keeps the power-window relay on for 30 s after the
            ignition goes off and cuts it at once when a door opens, which fits the fall: 2026-08-08
            17:52:39, ACC2_IGN_ON 0 with the doors shut and EV_READY falling by 17:52:49, this bit
            still 1 in the read 0.25 s later and 0 by the next stored row at 17:53:19; on 2026-07-30
            ACC2_IGN_ON went off 09:50:29 and this bit was first seen 0 at 09:51:14 (keep:unique).
            It fell in the same poll at the other 3 recorded power-offs; the aligned rows show the
            doors shut there too, so why is not established. Disabled as a near-duplicate of
            ACC2_IGN_ON. Named ACC2_IGN_ON_BC04 until 2026-10-30.
          enabled: false
        INTERIOR_LAMP_AUTOCUT_RELAY:
          expression: B13:6
          min: "0"
          max: "1"
          source: Same-payload cross-tab + event timeline 2026-10-22
          verified: false
          notes: >-
            GDS 'Interior Lamp Autocut Relay' (ScanDoc; actuator BC1B 'Auto Cut Relay'): the
            leak-current autocut (LCAD) relay that feeds the interior lamp, memory and multimedia
            fuses. Observed as 1 = doors unlocked or ignition on. Equals (NOT DOOR_LOCK_FL) OR B10:0
            in 406 of 410 captures. Rises with every unlock and ignition-on; fell in the same poll
            as the lock on 2026-07-30 12:20:48, 08-08 17:53:32 and 08-15 10:06:07. All 4 exceptions
            read 1 while locked with the ignition off. 3 are a lock that is the last 22BC04 row of
            its session: the session ended 0 s (04-18 22:15:25) and 8 s (08-08 11:42:35) later, and
            07-24 09:38:19 is keep:unique, which cannot record a return to an earlier payload, so
            whether it fell later is unrecorded. The 4th is an 18 s pulse at 08-15 10:11:03, 5 min
            after locking, with nothing else on 22BC03/04/07 changing. Mirrored by BCM 22B005 B10:3
            (35 of 35 rows) and VCU 2101 VCU_INVERTER_ARMED (kappa 0.98, n=358). Its timing is not
            reconciled with the manual's 20 min / 35-65 s power-down: here it fell in the same poll
            as the lock. Named UNLOCKED_OR_IGN_ON until 2026-10-30.
        DRL_DEDICATED_OUTPUT:
          expression: B12:5
          min: "0"
          max: "1"
          source: byte-value sweep + align 2026-10-29
          verified: false
          notes: >-
            GDS 'Dedicated DRL Output (Option)' (22BC04 byte 2 bit 5; actuator BC18). 1 only with
            the ignition on, low beam off and the car not in Park: set in all 8 captures with the
            lamps off in D (7 joined to VCU GEAR_D = 1, 2026-07-21 12:51-12:53), 0 in the 43 aligned
            rows in P with the ignition on and lamps off, and 0 in all 65 aligned rows with low beam
            on. So the DRLs go out in Park and while the low beams are on; whether the EU Ioniq does
            that by design is not confirmed (test: READY in P with lamps off, then D). 22BC03
            TAIL_LAMP_INTERIOR reads 0 in the rows where this is on, so it is not a DRL signal.
            Named VEHICLE_NOT_IN_P_WARNING until 2026-10-30; the earlier door/belt reading is
            withdrawn, because the D rows where it read 0 had the low beams on.
          enabled: true
        SEATBELT_RR:
          expression: B12:1
          min: "0"
          max: "1"
          source: OBDb Hyundai-IONIQ-Electric 22BC04 bix 54; IGPM support bitmap; opendbc CGW4 rear belt indicators (2026-10-29)
          verified: false
          notes: >-
            Candidate rear-right seatbelt latched. OBDb labels this bit (bix 54) as the rear-right
            belt, and the 22BC04 support bitmap (B07=0xF4) marks it as a real signal. opendbc's
            C-CAN DBC carries rear belt indicators in CGW4 (0x559, RL/RR/RC SeatBeltInd), but 0x559
            is absent from all three uhi22 Ioniq P-CAN logs, so the gateway does not send it on
            P-CAN; whether it does on C-CAN is unknown. 0 in all 1753 captures, so never exercised.
            Test: buckle each rear belt in ACC2.
          enabled: false
        SEATBELT_RL:
          expression: B12:2
          min: "0"
          max: "1"
          source: OBDb Hyundai-IONIQ-Electric 22BC04 bix 53; IGPM support bitmap; opendbc CGW4 rear belt indicators (2026-10-29)
          verified: false
          notes: >-
            Candidate rear-left seatbelt latched. OBDb labels this bit (bix 53) as the rear-left
            belt, and the 22BC04 support bitmap (B07=0xF4) marks it as a real signal. opendbc's
            C-CAN DBC carries rear belt indicators in CGW4 (0x559, RL/RR/RC SeatBeltInd), but 0x559
            is absent from all three uhi22 Ioniq P-CAN logs, so the gateway does not send it on
            P-CAN; whether it does on C-CAN is unknown. 0 in all 1753 captures, so never exercised.
            Test: buckle each rear belt in ACC2.
          enabled: false
        SEATBELT_RM:
          expression: B12:3
          min: "0"
          max: "1"
          source: OBDb Hyundai-IONIQ-Electric 22BC04 bix 52; IGPM support bitmap; opendbc CGW4 rear belt indicators (2026-10-29)
          verified: false
          notes: >-
            Candidate rear-middle seatbelt latched. OBDb labels this bit (bix 52) as the rear-middle
            belt, and the 22BC04 support bitmap (B07=0xF4) marks it as a real signal. opendbc's
            C-CAN DBC carries rear belt indicators in CGW4 (0x559, RL/RR/RC SeatBeltInd), but 0x559
            is absent from all three uhi22 Ioniq P-CAN logs, so the gateway does not send it on
            P-CAN; whether it does on C-CAN is unknown. 0 in all 1753 captures, so never exercised.
            Test: buckle each rear belt in ACC2.
          enabled: false

    22BC06:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      status: active
      period: 2500
      vehicle_states: [ALL]
      notes: >-
        8 data bytes. B10 the brake lamps, B11 the turn signals. B05=0xB4, B06=0x80, B07, B09 and
        B12 = 0 constant in all 587 captures.
      parameters:
        BRAKE_LIGHT:
          expression: B10
          ha_class: ""
          min: "0"
          max: "255"
          source: "Decoded from live captures (2026-04-15)"
          source_links: []
          verified: true
          notes: >-
            Not a boolean: B10 reads 0x00 released and 0x2D pressed (73 of 504 captures), plus 0x2C
            (3), 0x01 (1) and 0x02 (1). 0x2D sets bits 0, 2, 3 and 5 together. Byte position
            verified 2026-04-15. The 0x02 capture (2026-04-15) sets a bit outside the support map
            (B05 = 0xB4) and is probably corrupt.
        LEFT_TURN_SIGNAL:
          expression: B11:0
          ha_class: ""
          source: "Corrected 2026-08-09: moved from B10 to B11 (user-confirmed 1=left, 2=right); B10 bit0 was the brake pattern, not the turn signal"
          source_links: []
          verified: true
          notes: B11 reads 0 (no signal), 1 (left) or 2 (right), never 3, across a 500-sample check.
          enabled: true
        RIGHT_TURN_SIGNAL:
          expression: B11:1
          ha_class: ""
          source: "Corrected 2026-08-09: moved from B10 to B11 (user-confirmed 1=left, 2=right); B10 bit1 had only n=1 support and was unrelated noise"
          source_links: []
          verified: true
          notes: B11 reads 0 (no signal), 1 (left) or 2 (right), never 3, across a 500-sample check.
          enabled: true
        STOP_LAMP_LEFT:
          expression: B10:2
          min: "0"
          max: "1"
          source: RE 2026-07-23 bit analysis
          verified: false
          notes: >-
            GDS 'Stop Lamp Left' output (22BC06 byte 0 bit 2; the right lamp is bit 3 and the
            high-mounted lamp bit 5; actuators BC2B, BC2C, BC2D). Bits 3 and 5 never change without
            it. The pedal switch is bit 0 (BRAKE_PEDAL_SWITCH). Named BRAKE_PEDAL_BITS until
            2026-10-30.
          enabled: true
        BRAKE_PEDAL_SWITCH:
          expression: B10:0
          min: "0"
          max: "1"
          source: GDS 'Stop Switch' (ScanDoc 22BC06 byte 0 bit 0); canair align 2026-10-30
          verified: false
          notes: >-
            Brake pedal switch. B10 reads 0x01 once (switch closed, lamps not yet lit) and 0x2D when
            pressed. Three captures on 2026-08-09 14:04 read 0x2C (both stop lamps and the
            high-mounted lamp lit, switch bit clear) while driving at 43-77 km/h;
            regeneration-triggered stop lamps are a plausible cause, unverified.
          enabled: true

    22BC01:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        9 bytes: 40 00 00 00 00 02 in all 385 captures, across all power states (24 older ones carry
        0xAA frame padding).
    22BC02:
      status: draft
      vehicle_states: [ALL]
      notes: 4 data bytes, all 0 in every one of 297 captures.
    22BC05:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      status: draft
      vehicle_states: [ALL]
      notes: >-
        8 data bytes. B05=0x7F, B06=0x11 and B07=0x20 in all 421 captures. B10 holds the turn-lamp
        outputs (0x50 left, 0xA0 right, 0xF0 both at the fob-unlock flash), B11:3 the trunk
        indicator and B11:7 passenger seat occupancy.
      parameters:
        LUGGAGE_LAMP_OUTPUT:
          expression: B11:3
          min: "0"
          max: "1"
          source: canair correlate --find-mirrors + investigate --events 2026-07-24
          verified: false
          notes: >-
            GDS/ScanDoc 'Luggage Compartment Lamp' (22BC05 byte 1 bit 3; actuator BC1C). Set at
            trunk open (2026-07-24 09:37:08); 1 in 3 of 421 captures. Named TRUNK_INDICATOR until
            2026-10-30.
        TURN_LAMP_LF:
          expression: B10:4
