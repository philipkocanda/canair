    - type: decode
      target: broadcast 0x5EC (charge-port lock status)
      status: pending
      priority: P3
      vehicle_states: [PLUGGED, CHARGING]
      created: "2026-10-29"
      updated: "2026-10-29"
      notes: >-
        Kona bench CGW_5EC, sent by the IGPM/gateway: byte0 = charge-port locked (1/0). Complements
        the IGPM charge-cable-lock IOControl (BCxx). OBD-unobservable here (gateway-isolated);
        Kona-sourced hypothesis. DID TWIN CONFIRMED 2026-10-29: this is the same physical signal as
        the already-decoded IGPM 22BC07 B11:7 CHARGE_PORT_LOCK (and its inverse B12:0), which are
        100% anti-correlated over 1761 captures (lock=1/inv=0 x1475, lock=0/inv=1 x286). So 0x5EC is
        the broadcast counterpart of the DID bit — the gateway re-encodes the same lock state in
        both domains.
      sources:
        - projectgus car_hacking, bench_kona/igpm.py CGW_5EC (Kona OS EV)
      what_to_test:
        - Tapped P-CAN sniff while locking/unlocking the charge port; look for 0x5EC byte0 toggling.
    - type: decode
      target: broadcast 0x567 (gateway real-time clock)
      status: done
      priority: P3
      vehicle_states: [ALL]
      created: "2026-10-29"
      updated: "2026-10-29"
      result: >-
        Confirmed on the uhi22 Ioniq28 P-CAN tap (seconds byte ticks once per second) and promoted
        to signals/body.yaml CGW_CLOCK (hour/minute/second/valid).
      notes: >-
        Kona bench CGW_Clock, sent by the IGPM/gateway: byte0=0x02, byte1=hour, byte2=minute,
        byte3=second, byte4=valid flag. Identifies the time source, relevant to the charge-schedule
        research (which module holds and executes schedules). CONFIRMED 2026-10-29 on the uhi22
        Ioniq P-CAN tap: D2=hour (16), D3=minute (41), D4=seconds incrementing once per second,
        D5=valid (1) — now defined in signals/body.yaml CGW_CLOCK. NEGATIVE DID cross-check same
        date: swept every byte of IGPM 22BC01-07, BCM 22B00E/22C00B and CLU 22B002 against each
        capture's wall-clock (plain and BCD; hour/minute/second); no byte matched above 0.25. So the
        gateway broadcasts the time on 0x567 (a stored time that does not tick until the head unit's
        arrives; no running clock is shown) but does NOT expose it in any captured status DID.
      sources:
        - projectgus car_hacking, bench_kona/igpm.py CGW_Clock (Kona OS EV)
      what_to_test:
        - Tapped P-CAN sniff; confirm 0x567 bytes 1-3 track wall-clock time and that the IGPM is the sender.
    - type: decode
      target: 22BC03-07 support bitmap (B05-B07, B09)
      status: pending
      priority: P2
      vehicle_states: [ACC2, READY]
      created: "2026-10-29"
      updated: "2026-10-29"
      result: >-
        The four constant bytes before the data (B05, B06, B07, B09) are a per-DID bitmap of which
        data bits are real signals: B05 covers B10, B06 B11, B07 B12, B09 B13, MSB first (mask bit 7
        = data bit 0). Over ~1750 captures per DID, every bit ever set in 22BC03, BC04, BC05 and
        BC07 lies inside its mask. The plain (LSB-first) reading fails on every one. In 22BC06 the
        mask marks a field's start bit: B11 has only bit 0, so the turn signal is one 2-bit field (0
        off, 1 left, 2 right), which matches 'never 3'. 2026-10-30: the bits were then named from
        Hyundai's GDS lists and the Kona/i30 ScanDoc lists (IGPM_FINDINGS.md section 6.2); the 'real
        undecoded' bits in the notes are now mostly named but still never exercised.
      notes: >-
        Consequence: canair coverage's BITS 'missing' lists overstate the gaps. A bit outside the
        mask is not a signal. The real undecoded signals (in the mask, never set in any capture, so
        never exercised) are: 22BC03 B11:4, B13:2, B13:3, B13:6, B13:7; 22BC04 B10:5, B10:7,
        B11:2-B11:7 (all six), B12:0, B13:0, B13:2, B13:4, plus B13:1 which is always 1 (B12:1-3 now
        SEATBELT_RR/RL/RM candidates); 22BC05 B10:1-B10:3; 22BC07 B11:1, B12:1, B12:6, B12:7, B13:0,
        B13:1, B13:4, B13:5, plus B12:4 which is always 1. 22BC06 B10:0, B10:3 and B10:5 are
        separate signals that set together with STOP_LAMP_LEFT (0x2D). OBDb Hyundai-IONIQ-Electric
        labels that fall outside the mask do not apply to this IGPM: 22BC04 B10:4 'reverse gear'
        (read 0 with VCU GEAR_R=1) and 22BC07 B11:0 'defog light' (0 during the 2026-07-30 defogger
        window). OBDb also lists 22BC08/22BC09, which return NRC 0x31 here, so its IGPM is a
        different variant. Its labels that fall inside the mask (22BC04 locks, 22BC05 B12 headlight
        switch, the rear belts) are worth testing. Candidates for the open slots, from the signals
        the gateway broadcasts (opendbc CGW1/CGW2/CGW4) that no DID maps yet: park brake switch,
        hazard switch, front and rear fog, wiper switches (int/low/high/auto/mist), rain sensor,
        passive-access lock and unlock, RKE command, four window states, heated steering wheel,
        sunroof, brake-fluid switch, ESCL warnings, key-out lamp.
      sources:
        - byte sweep over all stored 22BC03-07 captures, 2026-10-29
      what_to_test:
        - "Narrated canair monitor IGPM --save --keep-changes in ACC2/READY: one actuation at a time from the candidate list (park brake, hazard, fog, each wiper stage, each window, heated wheel, rear belts, fob lock/unlock, handle lock/unlock), pressing 's' for each. Every bit that moves should be inside the mask; one outside it means the mask reading is wrong."
    - type: decode
      target: gateway frame forwarding between MM-CAN, P-CAN and C-CAN
      status: captured
      priority: P2
      vehicle_states: [READY, CHARGING]
      created: "2026-10-30"
      updated: "2026-10-30"
      result: >-
        The IGPM routes signals, not frames. It builds each frame as the destination bus's message
        table defines it and sends it on its own schedule, so source and destination IDs are
        unrelated and one ID can name different frames on different buses (0x55C, 0x57A, 0x57B,
        0x5D0, 0x5D7). MM-CAN carries multi-byte signals high byte first (Motorola) and P-CAN and
        C-CAN low byte first (Intel), so every multi-byte signal is byte-swapped when it crosses.
        Fields that fit inside one byte keep their bits, which is why the head unit's schedule and
        clock frames cross unchanged.
      notes: >-
        Byte order: opendbc's Hyundai M-CAN DBC has 1184 of 1184 signals big-endian and its C-CAN
        DBC 1154 of 1154 little-endian. The EU head unit's MM-CAN parsers read 83 of 83 multi-byte
        fields high byte first, and its MICOM reads 0x56A as B3<<8|B4. The US telematics P-CAN
        parsers read 22 of 22 low byte first. P-CAN to MM-CAN, joined by Hyundai signal name: pack
        voltage 0x5D8 d6-d7 -> 0x55D B0-B1, swapped; quick-charge time left 0x491 d0-d1 -> 0x56A
        B3-B4, swapped; range 0x200 (10 bits from bit 15) -> 0x56A (9 bits); A/C compressor power
        0x5F5 -> 0x56A B5-B6; SOC 0x5D8 d1 -> 0x55E B2; BMS fault and standard-charge flags 0x5D8 d0
        bits 1-3 -> 0x55E B1 bits 1-3; climate permission 0x57B d1.1 -> 0x55C B0.7. Copied
        unchanged: VCU 0x579 d0-d4 -> 0x56B, VCU 0x57A -> 0x56C, climate unit 0x5CC -> 0x132. 0x56A
        combines DC-DC converter, MCU, VCU, BMS and climate-unit signals. MM-CAN to P-CAN: 0x54F ->
        0x567, 0x57B -> 0x55C and 0x57A -> 0x588 byte for byte; HU_DATC_PE_00 0x1C0 -> 0x5D3 keeps
        only byte 4 bits 0-5, moved to byte 0 (see the AVN entry). C-CAN to P-CAN (names from the US
        AE EV message table; defined in signals/body.yaml as EV_CP1/2/5): EV_CP1 0x5D0 is the
        cluster's odometer frame (CLU12, same layout); EV_CP2 0x450 is the cluster's displayed speed
        (CLU11 Vanz, 0.5 km/h, moved one byte earlier; reads a median 1.12 times the 0x524 speed);
        EV_CP5 0x578 is a chassis warning summary (SCC12 ACC fault and mode at the same bits, LKAS11
        LDWS state in byte 0 bits 7-4, MDPS and TPMS lamps, low fuel, drive-mode switch; 0x10 on
        uhi22's car is LDWS state 1). Senders, by clock over the 19-minute 2022 trace: 19 IDs hold a
        fixed phase to CGW1 0x541 (0x414, 0x450, 0x462, 0x471, 0x4FE, 0x541, 0x553, 0x55C, 0x55F,
        0x561, 0x567, 0x578, 0x588, 0x5B3, 0x5D0, 0x5D3, 0x5D4, 0x5DF, 0x5EC); the other P-CAN IDs
        drift on their own ECUs' clocks. 0x2B0 (SAS11, steering angle) is not on the gateway's clock
        and has 4-5 times the period jitter of native frames: either the steering sensor is also on
        P-CAN or the gateway passes the frame through as it arrives. Diagnostic frames (0x7DF,
        0x7Ex) cross with ID and bytes kept. Of the body frames, CGW1 0x541 and CGW2 0x553 reach
        P-CAN; CGW4 0x559, GW_DDM_PE 0x521 and GW_IPM_PE_1 0x522 are absent from all three uhi22
        P-CAN logs. On MM-CAN, 0x5D0 is the cluster's CLU_HU_P_00 (speed, SOC, motor torque), not
        the odometer. Unproven on the car: no simultaneous MM-CAN and P-CAN capture exists. The
        P-CAN layouts from the US firmware match uhi22's EU P-CAN logs on every signal checked (pack
        voltage, SOC, charge times, range, DC-DC power). HU_DATC_PE_00 0x5D3 and TMU_GW_PE_01 0x5D4
        are defined in signals/body.yaml too.
      sources:
        - "ioniq-avn-fw EU head-unit firmware: com.lge.ivi GwEvP02-08, GwEvPe00 and HuDatcPe00 parse layouts; MICOM 7AEe EV getters 0x846DE-0x84790 (2026-10-30)"
        - "US telematics firmware AEEV.USA.SOP.V108: com.infobank Can2ACCANCsmEV P-CAN parsers and the Can2AAEEVMessage ID table (2026-10-30)"
        - opendbc hyundai_2015_ccan.dbc and hyundai_2015_mcan.dbc (commaai, MIT)
        - "uhi22 Ioniq28Investigations P-CAN logs (2025) and IoniqMotorCAN ioniq2018_motorCAN_500k_HPC.asc (2022): clock-phase sender attribution and value checks (2026-10-30)"
      what_to_test:
        - "Tap MM-CAN and P-CAN at the same time in READY, then while AC charging: 0x55D B0-B1 should equal 0x5D8 d6-d7 with the bytes swapped, and 0x56A B3-B4 should equal 0x491 d0-d1 swapped."
        - "On the same capture: MM-CAN 0x56B bytes 0-4 should equal P-CAN 0x579, 0x56C should equal 0x57A, and 0x132 should equal 0x5CC."
        - "Tap C-CAN as well: 0x2B0 on P-CAN should repeat the C-CAN copy a fixed short time later; look for the sources of the gateway-clocked 0x414, 0x462, 0x471 and 0x4FE."
      capture_protocol: >-
        Two adapters logging at the same time, one per tapped bus. Import each log with canair
        import can and line the frames up by timestamp.
    - type: verify
      target: who wakes the VCU for the parked 12 V top-up
      status: pending
      priority: P2
      vehicle_states: [SLEEP, TOPUP]
      created: "2026-10-30"
      updated: "2026-10-30"
      result: >-
        Not settled. The VCU cannot start itself: on uhi22's bench the EPCU's supply only came up
        from its wake-line pin (CN1000 3P), and IG3 is that rail (VCU_IG3_ON). So with the car
        unplugged and asleep something else must close IG3. Leading candidate is the IGPM's own IG3
        relay output (22BC07 B12:3): it reads 1 for the whole 2026-10-21 top-up, as in READY, and 0
        in every charge with the ignition off, where the OBC's relay supplies IG3. The VCU then
        decides and ends the top-up: the 12 V battery sensor reports through it (0x549), the HV
        relay was open by 21:17:08, IG3 fell by 21:17:11 and the IGPM bit by 21:17:21. Not excluded:
        the BCM, which measures the 12 V battery during deep sleep, asking the IGPM to close the
        relay.
      notes: >-
        Only one top-up is recorded, and it was joined mid-run: the first capture (21:00:58) already
        shows the BMS awake, so the start is missing (if it ran the manual's 20-minute maximum it
        began about 20:57). The other parked VCU wake-ups in the captures are charging sessions
        polled about once a minute, too coarse to order. Intervals: the 2017 owner's manual
        describes Aux. Battery Saver+ Cycle Mode as running when the car is off with doors, hood and
        tailgate closed, every 72 hours, at most 20 minutes each; uhi22 writes that the Ioniq wakes
        every 24 hours and charges about 20 minutes if the 12 V battery is low. The closed-doors
        condition is IGPM switch input (22BC03 door, hood, trunk bits). The VCU stayed alive for at
        least 3 minutes after IG3 fell (2101 kept changing until 21:20:12, 2102 froze at 21:17:11),
        so once started the EPCU holds itself on. The gateway clock on 0x567 is a stored time that
        does not tick until the head unit's arrives, so nothing shows the IGPM keeping calendar time
        while asleep; a countdown timer would be enough for a 72 h or 24 h cycle. See
        IGPM_FINDINGS.md sections 5, 6.2 and 8 for the IG3 relay wiring, the BC44 actuator and the
        Kona/Ioniq wake reports.
      sources:
        - uhi22 EPCU readme (CN1000 3P wake line, bench power-up)
        - Hyundai Ioniq Electric 2017 owner's manual, Aux. Battery Saver+ (Cycle Mode)
        - canair captures 2026-10-21 (parked 12 V top-up, three sessions)
      what_to_test:
        - "Can the IGPM close IG3 alone? Car asleep, unplugged, locked, parked and safe: open an IGPM session, switch BC44 on, read VCU:2101, BMS:2101 and IGPM:22BC07, switch it off. Expect VCU_IG3_ON = 1 and B12:3 = 1 while it is on. BC44 is the IG3 relay in ScanDoc's list (refused with NRC 0x22 in ACC, no effect in READY). Do not use BC12-BC14 for this: by the same list they are the driver-door unlock, deadlock and power-window relays, and BC13 deadlocks the doors."
        - Which module holds the setting? In READY switch User Settings > Other > Aux. Battery Saver+ off and on while recording IGPM, BCM, VCU 2101/2102/21F2 and CLU; whichever module's data changes stores it.
        - "Catch a real start: WiCAN kept awake, slow poll of IGPM:22BC07, BCM:22B003 and VCU:2101 across a night. A flip of the IGPM bit before the VCU first answers points to the IGPM. Polling keeps the gateway awake, so do this after the two tests above; a P-CAN tap showing whose frames appear first is cleaner."
      capture_protocol: >-
        canair read 'session IGPM --wake' 'iocontrol IGPM BC44' 'sleep 3' 'query VCU:2101' 'query
        BMS:2101' 'query IGPM:22BC07' 'iocontrol IGPM BC44 --off' --save --label 'IGPM BC44 IG3
        test' --state SLEEP. Only with the car parked and safe; the actuator releases when the
        session ends.
    - type: verify
      target: IOControl BC44 (IG3 relay) and BC1B (auto cut relay) against their loads
      status: pending
      priority: P2
      vehicle_states: [SLEEP, ACC]
      created: "2026-10-23"
      updated: "2026-10-30"
      notes: >-
        The IGPM's power-switch controller drives a Main relay in the engine-bay PCB block that
        feeds the IG3 rail (EPCU, OBC, BMS, A/C control module, PTC heater, blower relay), and an
        electronics-off 'leak current autocut' relay. In US-market wiring these are IPS outputs. Two
        stored IOControl results fit them: BC44 is the IGPM's IG3 relay by ScanDoc's numbering
        (22BC07 B12:3 is its output bit; ConditionsNotCorrect in ACC, no effect in READY where IG3
        is already on) and BC1B is the auto cut relay (single click, dome light goes off). Neither
        has been actuated with the car asleep or tied to a load. BC12, BC13 and BC14 are not
        candidates: by the same numbering they are the driver-door unlock, deadlock and power-window
        relays, and BC13 deadlocks the doors. The VCU-wake side of the BC44 test is in the entry
        'who wakes the VCU for the parked 12 V top-up'.
      what_to_test:
        - With the car asleep, unplugged and stationary, fob inside, open an IGPM session and switch BC44 on with a second person at the engine-bay PCB block listening for the click. While it is on, read BMS 2101, VCU 2101 and HVAC 220100 and note whether any starts to answer without ACC. Release BC44 before anything else.
        - In ACC, switch BC1B on and off and note which loads lose power (it turned the dome light off on 2026-04-15).
      capture_protocol: >-
        canair read 'session IGPM --wake' 'iocontrol IGPM BC44' 'sleep 3' 'query BMS:2101' 'query
        VCU:2101' 'query HVAC:220100' 'iocontrol IGPM BC44 --off' --save --label 'IGPM BC44 IG3
        test' --state SLEEP; only after confirming the car is parked and safe.

