        CUMULATIVE_ENERGY_CHARGED:
          expression: "((B47<<24)|(B49<<16)|(B50<<8)|B51)/10"
          unit: kWh
          ha_class: energy
          min: "0"
          max: ""
          verified: true
          notes: Lifetime total, 0.1 kWh per LSB.

        CUMULATIVE_ENERGY_DISCHARGED:
          expression: "((B52<<24)|(B53<<16)|(B54<<8)|B55)/10"
          unit: kWh
          ha_class: energy
          min: "0"
          max: ""
          verified: true
          notes: "Lifetime cumulative. ECU reports in 0.1 kWh units, /10 gives kWh."

        CUMULATIVE_CURRENT_CHARGED:
          expression: "((B38<<24)|(B39<<16)|(B41<<8)|B42)/10"
          unit: Ah
          ha_class: ""
          min: "0"
          max: ""
          source: "ImHex pattern (u32 @ ISO-TP 0x20) — PCI-corrected"
          source_links: []
          verified: true
          notes: 32-bit at WiCAN B38, B39, B41, B42 (B40 is a PCI byte).

        CUMULATIVE_CURRENT_DISCHARGED:
          expression: "((B43<<24)|(B44<<16)|(B45<<8)|B46)/10"
          unit: Ah
          ha_class: ""
          min: "0"
          max: ""
          source: "ImHex pattern (u32 @ ISO-TP 0x24) — PCI-corrected"
          source_links: []
          verified: true
          notes: 32-bit at WiCAN B43-B46.

        OPERATING_TIME:
          expression: "[B57:B60]/3600"
          unit: "h"
          ha_class: duration
          min: "0"
          max: "1000000"
          source: "CSS Electronics DBC (OperatingTime m257 : 399|32@0+, scale 1/3600) + live verification"
          source_links:
            - "CSS Electronics/ev-data-pack-v10/electric_cars/dbc_files/can1-hyundai-kia-uds-v2.4.dbc"
          verified: true
          notes: 32-bit unsigned seconds at WiCAN B57-B60.

        BMS_2101_B62:
          expression: B62
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          source: demoted 2026-07-23 historical audit
          source_links: []
          verified: false
          notes: Reads 1 in 10617 of 10708 captures and 0 in 91; BMS_MAIN_RELAY reads 0 in 96.
          enabled: false
        DRIVE_MOTOR_SPEED:
          expression: "[S65:S66]"
          unit: RPM
          ha_class: ""
          min: "-500"
          max: "8000"
          verified: true
          notes: >-
            Signed 16-bit big-endian, RPM directly. r=+0.997 vs MCU:2102:MCU_MOTOR_RPM (n=1149
            measured rows, slope 0.986). B67 repeats B65.
          source: canair analysis 2026-08-08 long drive + DCFC (cross-ECU vs MCU 2102)

        ISOLATION_RESISTANCE:
          expression: "B69*1000"
          unit: "kΩ"
          ha_class: ""
          min: "300"
          max: "1000"
          verified: true
          notes: ""

        DEBUG_BMS_STATE_FLAGS:
          expression: B14
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          source: AutoPID config (on device); bitfield decoded via ITStromer community sheet + ioniq-ev-bms xls; re-enumerated 2026-08-06; DC bits resolved 2026-08-08
          source_links: []
          verified: false
          notes: >-
            Whole B14 byte. Observed values: 0x03 READY, 0x20 AC plugged with contactors open, 0x23
            plugged and READY, 0xA3 AC charging, 0xC3 DC charging. Bits: b0 BMS_MAIN_RELAY, b1
            always equals b0, b5 AC_CHARGER_CONNECTED, b6 CHARGING_DC, b7 CHARGING. b2-b4 have never
            been set, including during a DC fast charge.

        BMS_2101_B10:
          expression: B10
          min: "0"
          max: "255"
          source: canair charging-capture analysis 2026-07-30
          verified: false
          notes: >-
            Range 22-38. r=+0.998 vs BMS:2105:AVAIL_CHARGE_POWER over the 2026-07-30 AC charge
            (y=0.40x-1.27), where both rise with SOC.
        BMS_2101_B63:
          expression: B63
          min: "0"
          max: "255"
          source: canair charging-capture analysis 2026-07-30
          verified: false
          notes: >-
            Range 0-244. r=+0.998 vs BMS:2102:CELL_02_VOLTAGE over the 2026-07-30 AC charge
            (y=93.4x-246), where both rise with SOC.
        BMS_MAIN_RELAY_MIRROR_B14_1:
          expression: B14:1
          source: canair analysis 2026-08-08 DCFC
          verified: true
          notes: >-
            Equals BMS_MAIN_RELAY (B14:0) in every capture, including a DC fast charge. Disabled so
            it does not ship a duplicate signal; defined so bit 1 is accounted for.
          enabled: false


