    - type: scan
      target: 01 01, 01 21, 01 30, 01 31, 01 5B
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: OBDb command_support for 2017 and 2018 lists standard Mode 01 PIDs answering from 0x7E4 (monitor status, MIL distance, warm-ups, distance since clear) and 2018 adds 01 5B, hybrid battery pack remaining life (BAT_SOC). We have no Mode 01 captures at all. 01 5B would be a third SOC source next to SOC_BMS and SOC_DISP.
      sources:
        - OBDb Hyundai-IONIQ-Electric signalset and its tests/test_cases (2017/2018 command_support), compared 2026-10-27
      capture_protocol: canair read BMS:015B BMS:0101 BMS:0121 BMS:0130 BMS:0131 --save in READY
    - type: verify
      target: 2101 B14 bits 1-4 — dealer-tool (GDS) names
      status: pending
      priority: P3
      vehicle_states: [READY, CHARGING]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: >-
        The Kia Soul EV GDS sheet (references/kia-soul-ev-can-messages.xlsx, 21 01 -> 21 6.x, the
        same byte as Ioniq B14) names b1 BMS Controllable State, b2 BMS Warning, b3 BMS Fault, b4
        BMS Weld Flag, marking b2-b4 as error flags that should always be 0. Across 12079 captures
        (READY, 12 V top-up, AC charging, two DC fast charges) b1 equals b0 (BMS_MAIN_RELAY) in
        every capture and b2-b4 are never set. B14 values seen: 0x00, 0x03, 0x20, 0x23, 0x40, 0xA3,
        0xC3. OBDb (github.com/OBDb, checked 2026-10-27): every Hyundai/Kia/Genesis signalset
        defines only b0, b5, b6 and b7 of this byte (data byte 9 of 2101/220101, bix 72-79); none
        defines b1-b4. OBDb test-case responses (2919 from 17 vehicle repos) never set b2-b4. b1 is
        set without b0 (value 0x02) in two hybrid responses (Hyundai Elantra 2023, Kia Niro 2020,
        pack ~240-255 V, current 0), so b1 is a separate flag, not a copy of b0. E-GMP models (IONIQ
        5/6/9, EV3/EV6/EV9, GV60) read 0x00 in all 1624 of their responses, so they carry no
        evidence for this byte.
      sources:
        - Kia Soul EV GDS sheet (kia-soul-ev-can-messages.xlsx, BMC rows 19-23)
        - ioniq-ev-bms-2101-2105.xls (same bit list, names marked '?')
        - canair B14 value enumeration 2026-10-27 (decode BMS 2101 --dump-bytes)
        - OBDb Hyundai/Kia/Genesis signalsets and tests/test_cases (data byte 9 of 2101/220101), checked 2026-10-27
      what_to_test:
        - "b1: does it lag or lead b0 during contactor close (switch-on, AC or DC charge start) or clear while b0 stays set (power derate, fault)?"
        - "b2/b3: do they set alongside a BMS DTC (canair dtc BMS) or a dashboard battery warning?"
        - "b4: only expected after a contactor-weld diagnosis; check whenever a BMS DTC is logged"
      capture_protocol: >-
        canair monitor 'BMS:2101 VCU:2101' --save --keep-all --label 'B14 b1 contactor transitions'
        across ignition off -> READY -> off, and across AC and CCS plug-in to charge start, so
        sub-second b0/b1 transitions are not run-length collapsed. For b2-b4, capture BMS:2101
        whenever canair dtc BMS reports a new code.
