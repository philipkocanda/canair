        MAX_CELL_VOLTAGE_NO:
          expression: "B31"
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          verified: true
          notes: "Cell number with max voltage"

        MIN_CELL_VOLTAGE_NO:
