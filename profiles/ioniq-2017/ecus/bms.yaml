      created: "2026-10-27"
      updated: "2026-10-27"
      notes: "B61 reads 0x0D (READY, or charging begun while READY), 0x09 (charging from off, 12 V top-up, plugged idle) and 0x01 (after a charge ends or at power-off) in 12079 captures. b3 is BMS_IG3_ON. b0 is 1 in every capture. b2 (BMS_2101_B61_2) follows READY rather than the ignition input: on 2026-08-02 it fell when the HV contactors opened at the end of a charge while IGPM ACC2_IGN_ON stayed 1. OBDb calls b2 BMS ignition; Kona Electric and Niro EV responses there use the same values (0x00, 0x01, 0x09, 0x0D)."
      sources:
        - canair B61 cross-tab 2026-10-27 (align BMS:2101:B61:2 vs VCU/IGPM)
        - OBDb Hyundai/Kia signalsets and test cases (data byte 50 of 2101/220101)
      what_to_test:
        - "b2 with ignition ON but not READY from cold (press the button twice, no brake): 1 = ignition input, 0 = drive/HV request"
        - b2 at ACC only, and its timing against VCU EV_READY at a READY -> OFF press
        - "b0: does it ever read 0 while the BMS answers (e.g. during the IG3 power-off tail)?"
      capture_protocol: >-
        canair monitor 'BMS:2101 VCU:2101 IGPM:22BC03' --save --keep-all --interval 1 --label 'B61
        ignition vs READY' --state ACC. From off press the button once (ACC), again (ON, no brake),
        wait 30 s, then brake + button to READY, wait, then button to OFF and keep recording 3 min.
        Press s at each press.

