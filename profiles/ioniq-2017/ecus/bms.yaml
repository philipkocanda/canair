  research:
    - type: iocontrol_scan
      target: "30 00-FF"
      status: done
      priority: P1
      vehicle_states: [ACC]
      notes: >
        Looking for the battery fan / EWP control local identifier. The BMS is a
        KWP2000 ECU, so IOControl is service 0x30 InputOutputControlByLocalIdentifier
        (8-bit LID) — NOT UDS 0x2F. Scan safely with `canair iocontrol-scan BMS`
        (auto-selects 0x30, sends only IOCP 0x00 returnControlToECU — never actuates).
        Kingbolen scanner can actuate the fan from the BMS; find the LID here, then
        actuate one LID at a time in a safe state.
      updated: "2026-07-23"
    - type: iocontrol_scan
      target: "2F BC00-BCFF"
      status: pending
      priority: P2
      vehicle_states: [ACC]
      notes: "BMS IOControl body/comfort-style DIDs (UDS 0x2F). Likely NRC 0x11 — BMS is KWP2000; kept as a cross-check."
    - type: scan
      target: 33 00-FF
      status: done
      priority: P2
      vehicle_states: [ACC]
      date: "2026-07-22"
      result: NRC 0x11 serviceNotSupported
      notes: "KWP2000 RequestRoutineResultsByLocalIdentifier (0x33) not implemented on BMS (every LID would NRC 0x11; scan aborts on first). Companion findings same session: 30 00 00 IOControl-by-LID -> NRC 0x11; and 10 03 (UDS extended session) -> NRC 0x12 subFunctionNotSupported (BMS does not accept the UDS extended-session mode byte). Conclusion: BMS exposes neither actuator service (0x2F/0x30) nor routine services (0x31/0x33) over OBD in the default session, and the UDS extended session is rejected. Next: (1) sniff a Kingbolen fan actuator test with SavvyCAN/candump to capture the exact ECU + diagnostic session + security(0x27) + service + LID; (2) do NOT blind-sweep 10 xx session modes (KWP programming/development modes are dangerous). Fan control likely requires a manufacturer KWP2000 diagnostic session + security access, or is not the BMS at all."
      sources:
        - on-car 2026-07-22 (raw 7E4:300000 --session; canair scan routines BMS)
      updated: "2026-07-23"
    - type: scan
      target: 10 81 session
      status: done
      priority: P1
      vehicle_states: [ACC]
      date: "2026-07-22"
      result: ACCEPTED (positive 50 81)
      notes: "The BMS accepts the KWP2000 standard diagnostic session 10 81 (unlike UDS 10 03, which returns NRC 0x12 subFunctionNotSupported). This is the session byte to use for BMS diagnostics. 27 01 (SecurityAccess) inside 10 81 returns NRC 0x11 (not exposed). NOTE: earlier 0x30/0x33/0x2F NRC 0x11 results were in the DEFAULT session, not 10 81 — re-probe those services inside a 10 81 session before concluding they are unsupported."
      sources:
        - on-car 2026-07-22 SLCAN
    - type: iocontrol_scan
      target: 30/33 in 1081
      status: done
      priority: P1
      vehicle_states: [ACC]
      notes: "Re-probe IOControl 0x30 and RoutineResults 0x33 on the BMS INSIDE the confirmed 10 81 session (earlier NRC 0x11 was in the default session). If they respond, the battery fan may be actuatable via 10 81 + IOControl/StartRoutine without security. Use: canair scan iocontrol BMS --session --mode 81 (and scan routines BMS --session --mode 81). Never send 0x31 StartRoutine as a blind probe."
      updated: "2026-07-23"
    - type: scan
      target: fan actuation (sniff needed)
      status: done
      priority: P2
      vehicle_states: [ACC]
      date: "2026-07-22"
      result: safe avenues exhausted
      notes: "Battery fan actuation not reachable via safe OBD probing: in the confirmed 10 81 session, 0x27/0x30/0x33 all return NRC 0x11. NOTE 0x33 (RoutineResults) NRC 0x11 does NOT rule out 0x31 StartRoutineByLocalIdentifier — HKMC actuator tests are often fire-and-forget StartRoutine with no results service, but 0x31 actuates so we will NOT blind-probe it. Remaining leads (all need external info): (1) sniff Kingbolen/GDS fan actuation to capture the exact session+service+LID+params; (2) a Hyundai-specific 10 8x session mode (blocked by safety guard). PAUSED pending scanner sniff access."
      sources:
        - on-car 2026-07-22
      updated: "2026-07-23"
    - type: decode
      target: 21F2
      status: captured
      priority: P2
      vehicle_states: [READY]
      date: "2026-07-22"
      result: "NEW PAGE found via 21 00-FF sweep 2026-07-22 (ignition on): BMS answers 21F2 with 121 data bytes, previously undocumented (BMS defined pages were 2101-2105 only). Payload starts 61F2 FFFFFFFF 34303634('4064') ... with embedded ASCII 'N7IZ' -> looks like a calibration/identity/version block (cf. MCU 21F2 = cal data with 'EHEL-MS2' cal ID), NOT live sensor data. Static content expected."
      notes: "Decode candidate: identify the ASCII part/cal IDs and any static config fields. Compare against MCU/VCU/OBC 21F2 layout."
      what_to_test:
        - Re-read 21F2 in different states (sleep/charging/driving) — if bytes never move, it is static cal/identity
        - Decode ASCII runs (4064 / N7IZ) as part-number or calibration ID fragments
    - type: scan
      target: 21 00-FF
      status: done
      priority: P2
      vehicle_states: [READY]
      date: "2026-07-22"
      result: "Exhaustive service-21 LID sweep (ignition on): 01/02/03/04/05 (known 2101-2105) PLUS F2 (NEW - see 21F2 decode entry). All 250 others NRC. One new page discovered."
      notes: Hidden-page hunt. Only genuine new page found in the whole session.
    - type: decode
      target: 2101 B10/B63 charge-tracking bytes
      status: done
      priority: P2
      vehicle_states: [CHARGING]
      created: "2026-08-01"
      updated: "2026-10-27"
      result: >-
        B10 = charge power word high byte (mirror of 2105); B62:B63 = inverter capacitor voltage
      notes: >-
        Resolved 2026-10-27 using the OBDb Hyundai-IONIQ-Electric signalset. B10 was the high byte
        of a 16-bit available-charge-power word: [B10:B11]/100 kW equals 2105 AVAIL_CHARGE_POWER
        (5448 of 5467 aligned rows, r=1.000), now the disabled AVAIL_CHARGE_POWER_MIRROR.
        [B12:B13]/100 is the matching discharge-power mirror (5467 of 5467 equal). B62:B63 is one
        16-bit inverter capacitor voltage in volts, r=0.986 vs VCU_DCLINK_VOLTAGE, now
        BMS_INVERTER_CAPACITOR_VOLTAGE. The earlier SOC-monotone correlations were these two words
        tracking SOC. Old BMS_2101_B62 removed.
    - type: verify
      target: 2101 B14 bits 1,2,3,4,6 — needs a DC fast charge
      status: done
      priority: P2
      vehicle_states: [CHARGING, PLUGGED]
      created: "2026-08-06"
      updated: "2026-08-08"
      result: >-
        bit 6 = CHARGING_DC, verified on the 2026-08-08 CCS session; bits 1-4 still unexercised
      notes: >-
        Partly resolved by the 2026-08-08 CCS session (n=54 DC rows): bit 6 is CHARGING_DC, set only
        during DC charging (0xC3), and bit 7 CHARGING is set in AC and DC alike. The OBDb signalsets
        agree on bits 7, 6, 5 and 0 (Hv_charging, rapid port, normal port, main relay). Still open:
        bit 1 is indistinguishable from bit 0 (BMS_MAIN_RELAY), and bits 2-4 have never been set,
        including during the DC charge. The earlier claim that the corpus holds no DC session and
        that CHARGING_DC is community lineage only is obsolete.
      sources:
        - canair bitfield analysis 2026-08-06 (plans/2026-08-06-bitfield-audit-and-gear-state.md)
      what_to_test:
        - Does bit6 set on a CCS plug? (confirms or kills CHARGING_DC)
        - Does bit1 diverge from bit0 during DC? (would make BMS_MAIN_RELAY_MIRROR_B14_1 a real second contactor)
        - Do bits 2/3/4 ever set? (bit2 was the withdrawn 0x45's rapid-charge candidate)
        - Does bit5 (CHARGER_CONNECTED) also set on CCS, or is it AC-plug-only?
      capture_protocol: >-
        At a CCS charger: canair monitor 'BMS:2101,2105 VCU:2101 OBC:2101' --save --keep-changes
        --label 'DC fast charge' --state 'CHARGING, PLUGGED'. Start recording BEFORE plugging in and
        keep it running through plug-in, handshake, ramp-up, and unplug, noting each phase with 's'.
    - type: decode
      target: 2101 B67:B68 drive-motor-speed mirror
      status: done
      priority: P3
      vehicle_states: [DRIVING]
      created: "2026-08-08"
      updated: "2026-10-27"
      notes: >-
        Resolved 2026-10-27: [S67:S68] is an exact copy of DRIVE_MOTOR_SPEED [S65:S66], 12069 of
        12069 rows equal (OBDb DRIVE_MOTOR_SPD_2). Recorded as the disabled
        DRIVE_MOTOR_SPEED_MIRROR.
      what_to_test:
        - Decode [S67:S68] and compare against [S65:S66] - identical, lagged/filtered, or a different shaft
    - type: verify
      target: 2105 BMS_DCFC_TICK_COUNTER/BMS_2105_B41
      status: captured
      priority: P2
      vehicle_states: [CHARGING]
      created: "2026-08-08"
      updated: "2026-08-08"
      notes: "2026-08-08 DCFC-2 session: renamed misnamed DEBUG_BMS_STATE_FLAGS_2105 (B42) to BMS_DCFC_TICK_COUNTER - proven to free-run as an 8-bit wrapping counter (~0.52/s) only while CHARGING_DC=1, confirmed flat across 2379 historical AC-charge captures. Sibling B41 steps 0->13->14->15 across the same DCFC session, also confirmed 0 during all historical AC charging. Both --unverified, single DCFC session tested."
      what_to_test:
        - "BMS_DCFC_TICK_COUNTER: confirm tick rate/meaning on a 2nd DCFC session; check if it's elapsed time (would give a clean rate) or a cycle counter"
        - "BMS_2105_B41: capture a full 0-100% DCFC to see if it's SOC-quantised (would give many more distinct values) or a coarse phase counter (would stay in a small band)"
    - type: decode
      target: 21F2 remaining last-cycle fields
      status: captured
      priority: P3
      created: "2026-10-21"
      updated: "2026-10-21"
      notes: "21F2 is a record of the previous drive or charge cycle: duration, minutes per 10 % SOC band, seconds per battery-temperature band, start/end SOC, discharged/charged Wh, peak powers and average temperature are decoded (LAST_CYCLE_*). Still unknown: B39 (0/1 flag), B42 (137 after the 2026-08-08 drive, 92 after 2026-08-02, 5 after an AC charge; not the sampled peak current), B53 (11-13), B108 (0/2), B117 (cycle type? 0x00 drives, 0x11 short or zero-length cycles, 0x40 charging cycles), B118:B119 (a count: 1-2 after drives, 3-22 after charges), B122 (4, 18, 46 after drives), B127/B129."
      sources:
