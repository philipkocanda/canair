# ─── BMS (Battery Management System) ─────────────────────────────────
#
# KWP2000 diagnostic sessions (service 0x10) — probed 2026-07-22, car in READY:
# see the structured `sessions:` field at the end of this ECU block.
# Only 0x81 (standardDiagnosticSession) is accepted; 21xx live-data reads work
# in the default session anyway — no session unlocks extra data. Payload sizes
# are identical across sessions: 2101=61B, 2102=38B, 2103=38B, 2104=38B, 2105=45B.
BMS:
  tx_id: 0x7E4
  can_bus: [P-CAN, H-CAN]
  identity:
    description: Battery Management System
    part_number: "37501-G7250" # Battery Assembly Part no.
    ecu_id: "AEEV__ BMS"  # KWP2000 1A90
    fw_version: "VER.2.3"  # KWP2000 1A91
    sw_id: CGBMSE305AE1000A  # KWP2000 1A8C
    calibration: "4604" # matches "BMS ROM ID" printed on the pack (KWP2000 1A8D)
    # BMS ROM IDs by production year:
    # 4604 = verified 2017-04 until 2017-11
    # 4804 = verified 2018-04 until 2018-07
    # 4824 = verified 2018-11 until 2019-06
    id_protocol: KWP2000  # 1Axx
    notes: >-
      1A80 firmware build date reads 2008-07-09. Air-cooled pack: a BMS-controlled fan in the trunk
      draws cabin air in under the middle rear seat and out through the right rear wheel well.
  vehicle_states: [READY, CHARGING]
  pids:
    2101:
      response_frames: 9
      status: active
      period: 1000
      vehicle_states: [READY, CHARGING]
      parameters:
        SOC_BMS:
          expression: "B09/2"
          unit: "%"
          ha_class: battery
          min: "0"
          max: "100"
          verified: true
          notes: Raw BMS state of charge (not display-adjusted; see SOC_DISP).

        BATTERY_POWER:
          expression: "(([B18:B19]/10) * (((S15 << 8) | B17)/10)) / 1000"
          unit: kW
          ha_class: power
          min: ""
          max: ""
          verified: true
          notes: "Computed from voltage * current. Negative = charging."
          send_to: wican/ioniq/stream/battery_power

        BATTERY_VOLTAGE:
          expression: "[B18:B19]/10"
          unit: V
          ha_class: voltage
          min: "200"
          max: "450"
          verified: true
          notes: ""

        BATTERY_CURRENT:
          expression: "((S15 << 8) | B17)/10"
          unit: A
          ha_class: current
          min: "-300"
          max: "300"
          verified: true
          notes: >-
            Signed 16-bit: high byte B15 signed, low byte B17 unsigned (B16 is a PCI byte). Negative
            = charging. Captures reach -174 A (DC charging) and +276.7 A (hard acceleration).

        MAX_CELL_VOLTAGE:
          expression: "B30*0.02"
          unit: V
          ha_class: voltage
          min: "0"
          max: "10"
          verified: true
          notes: ""

        MIN_CELL_VOLTAGE:
          expression: "B33*0.02"
          unit: V
          ha_class: voltage
          min: "0"
          max: "10"
          verified: true
          notes: ""

        AUX_BATTERY_VOLTAGE:
          expression: "B37*0.1"
          unit: V
          ha_class: voltage
          min: "0"
          max: "128"
          verified: true
          notes: "12V auxiliary battery"

        BMS_MAIN_RELAY:
          expression: "B14:0"
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          source: "ITStromer community sheet (j:0 = BMS Relay) + captures"
          source_links: []
          verified: true
          notes: >-
            HV main relay closed. 0 in 111 of 12079 captures, all with B14 = 0x20, 0x40 or 0x00.
            Also 1 during a parked 12 V top-up (TOPUP).

        AC_CHARGER_CONNECTED:
          expression: B14:5
          unit: ""
          ha_class: plug
          min: ""
          max: ""
          verified: true
          notes: >-
            Set while an AC cable is plugged in, whether or not the EVSE delivers energy
            (2026-08-08: 1 with CHARGING 0, contactors open and pilot duty 100 %). Clear throughout
            a CCS fast charge (2026-08-08, n=50). Backs the PLUGGED state predicate.
          source: canair analysis 2026-08-08 (CCS DCFC + scheduled home-EVSE wait)
        CHARGING_DC:
          expression: B14:6
          unit: ""
          ha_class: plug
          min: ""
          max: ""
          verified: true
          notes: >-
            Set during DC fast charging (2026-08-08 CCS session, n=54). Clear in all 1576
            AC-charging captures, where CHARGING (B14:7) is set. Layout matches the OBDb signalsets
            for the Ioniq Electric, Soul EV and Niro EV (RAPID_CHG_PORT, bix 73 = bit 6 of this
            byte, alongside HV_CHG bit 7, NORMAL_CHG_PORT bit 5 and BAT_MANAGEMENT_MAIN bit 0), and
            the Ioniq 5, Ioniq 6 and EV6 place their rapid-port flag at the same bit. Definitions
            only: OBDb has no frame with the bit set, and its label likely shares the community
            lineage we use.
          source: canair analysis 2026-08-08 50 kW DCFC session (first real rapid charge on this car); OBDb cross-reference 2026-10-27
        CHARGING:
          expression: "B14:7"
          unit: ""
          ha_class: battery_charging
          min: ""
          max: ""
          verified: true
          notes: ""

        BATTERY_FAN_STATUS:
          expression: "B35"
          unit: ""
          ha_class: ""
          min: "0"
          max: "9"
          verified: true
          notes: ""

        BATTERY_FAN_FEEDBACK:
          expression: "B36"
          unit: "Hz"
          ha_class: ""
          min: ""
          max: ""
          verified: true
          notes: ""

        BATTERY_INLET_TEMP:
          expression: "S29"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"
          verified: true
          notes: ""

        BATTERY_MAX_TEMP:
          expression: "S20"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"
          verified: true
          notes: ""

        BATTERY_MIN_TEMP:
          expression: "S21"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"
          verified: true
          notes: ""

        MODULE_1_TEMP:
          expression: "S22"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"
          verified: true
          notes: ""

        MODULE_2_TEMP:
          expression: "S23"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"
          verified: true
          notes: ""

        MODULE_3_TEMP:
          expression: "S25"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"
          verified: true
          notes: ""

        MODULE_4_TEMP:
          expression: "S26"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"
          verified: true
          notes: ""

        MODULE_5_TEMP:
          expression: "S27"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"
          verified: true
          notes: ""

        MAX_CELL_VOLTAGE_NO:
          expression: "B31"
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          verified: true
          notes: "Cell number with max voltage"

        MIN_CELL_VOLTAGE_NO:
          expression: "B34"
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          verified: true
          notes: "Cell number with min voltage"

        CUMULATIVE_ENERGY_CHARGED:
          expression: "((B47<<24)|(B49<<16)|(B50<<8)|B51)/10"
          unit: kWh
          ha_class: energy
          min: "0"
          max: ""
          verified: true
          notes: Lifetime total, 0.1 kWh per LSB.

        CUMULATIVE_ENERGY_DISCHARGED:
          expression: "((B52<<24)|(B53<<16)|(B54<<8)|B55)/10"
          unit: kWh
          ha_class: energy
          min: "0"
          max: ""
          verified: true
          notes: "Lifetime cumulative. ECU reports in 0.1 kWh units, /10 gives kWh."

        CUMULATIVE_CURRENT_CHARGED:
          expression: "((B38<<24)|(B39<<16)|(B41<<8)|B42)/10"
          unit: Ah
          ha_class: ""
          min: "0"
          max: ""
          source: "ImHex pattern (u32 @ ISO-TP 0x20) — PCI-corrected"
          source_links: []
          verified: true
          notes: 32-bit at WiCAN B38, B39, B41, B42 (B40 is a PCI byte).

        CUMULATIVE_CURRENT_DISCHARGED:
          expression: "((B43<<24)|(B44<<16)|(B45<<8)|B46)/10"
          unit: Ah
          ha_class: ""
          min: "0"
          max: ""
          source: "ImHex pattern (u32 @ ISO-TP 0x24) — PCI-corrected"
          source_links: []
          verified: true
          notes: 32-bit at WiCAN B43-B46.

        OPERATING_TIME:
          expression: "[B57:B60]/3600"
          unit: "h"
          ha_class: duration
          min: "0"
          max: "1000000"
          source: "CSS Electronics DBC (OperatingTime m257 : 399|32@0+, scale 1/3600) + live verification"
          source_links:
            - "CSS Electronics/ev-data-pack-v10/electric_cars/dbc_files/can1-hyundai-kia-uds-v2.4.dbc"
          verified: true
          notes: 32-bit unsigned seconds at WiCAN B57-B60.

        DRIVE_MOTOR_SPEED:
          expression: "[S65:S66]"
          unit: RPM
          ha_class: ""
          min: "-500"
          max: "8000"
          verified: true
          notes: >-
            Signed 16-bit big-endian, RPM directly. r=+0.997 vs MCU:2102:MCU_MOTOR_RPM (n=1149
            measured rows, slope 0.986). B67 repeats B65.
          source: canair analysis 2026-08-08 long drive + DCFC (cross-ECU vs MCU 2102)

        ISOLATION_RESISTANCE:
          expression: (B69<<8)|B70
          unit: "kΩ"
          ha_class: ""
          min: "300"
          max: "1000"
          verified: true
          notes: >-
            Big-endian 16-bit word B69:B70. 0x03E8 (1000 kΩ) in all 10764 captures, every state.
          source: byte word corrected from B69*1000, canair decode --dump-bytes 2026-10-22

        DEBUG_BMS_STATE_FLAGS:
          expression: B14
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          source: AutoPID config (on device); bitfield decoded via ITStromer community sheet + ioniq-ev-bms xls; re-enumerated 2026-08-06; DC bits resolved 2026-08-08
          source_links: []
          verified: false
          notes: >-
            Whole B14 byte. Observed values: 0x00 ignition off, unplugged (n=1); 0x03 READY or 12 V
            top-up; 0x20 AC plugged with contactors open; 0x23 AC plugged with contactors closed,
            not charging (VCU EV_READY 0); 0x40 CCS plugged before the contactors close (~30 s, both
            DC sessions); 0xA3 AC charging; 0xC3 DC charging. Bits: b0 BMS_MAIN_RELAY, b1 always
            equals b0, b5 AC_CHARGER_CONNECTED, b6 CHARGING_DC, b7 CHARGING. b2-b4 never set in
            12079 captures, including two DC fast charges. Kia Soul EV GDS sheet names the same byte
            b1 BMS Controllable State, b2 BMS Warning, b3 BMS Fault, b4 BMS Weld Flag.

        AVAIL_CHARGE_POWER_MIRROR:
          expression: "[B10:B11]/100"
          min: "0"
          max: "655"
          source: OBDb Hyundai-IONIQ-Electric (7E4 21 01 bix 40) + canair align 2026-10-27
          verified: false
          notes: >-
            Exact mirror of 2105 AVAIL_CHARGE_POWER: 5448 of 5467 aligned rows equal, r=1.000.
            Replaces the old single-byte B10 candidate, which was this word's high byte (22-38 =
            57-98 kW).
          unit: kW
          ha_class: power
          enabled: false
        BMS_INVERTER_CAPACITOR_VOLTAGE:
          expression: "[B62:B63]"
          min: "0"
          max: "450"
          source: OBDb Hyundai-IONIQ-Electric (7E4 21 01 bix 408) + canair align 2026-10-27
          verified: false
          notes: >-
            Unsigned 16-bit big-endian, volts. r=0.986 vs VCU:2102:VCU_DCLINK_VOLTAGE, slope 1.00.
            Reads 0 to a few volts with the main relay open, hence r=0.37 vs pack voltage over all
            rows. B62 is the old disabled BMS_2101_B62 (1 once the bus is above 256 V); the old
            BMS_2101_B63 candidate was the low byte.
          unit: V
          ha_class: voltage
          enabled: true
        BMS_MAIN_RELAY_MIRROR_B14_1:
          expression: B14:1
          source: canair analysis 2026-08-08 DCFC
          verified: true
          notes: >-
            Equals BMS_MAIN_RELAY (B14:0) in every capture, including a DC fast charge. Disabled so
            it does not ship a duplicate signal; defined so bit 1 is accounted for.
          enabled: false
        AVAIL_DISCHARGE_POWER_MIRROR:
          expression: "[B12:B13]/100"
          unit: kW
          ha_class: power
          min: "0"
          max: "655"
          source: OBDb Hyundai-IONIQ-Electric (7E4 21 01 bix 56) + canair align 2026-10-27
          verified: false
          notes: >-
            Exact mirror of 2105 AVAIL_DISCHARGE_POWER: 5467 of 5467 aligned rows equal. Pinned at
            98 kW most of the time (91.66-98 kW).
          enabled: false
        DRIVE_MOTOR_SPEED_MIRROR:
          expression: "[S67:S68]"
          unit: RPM
          min: "-500"
          max: "8000"
          source: OBDb Hyundai-IONIQ-Electric (7E4 21 01 bix 440, DRIVE_MOTOR_SPD_2) + canair align 2026-10-27
          verified: false
          notes: >-
            Signed 16-bit big-endian. Identical to DRIVE_MOTOR_SPEED [S65:S66] in 12069 of 12069
            rows.
          enabled: false
        BMS_2101_B61_2:
          expression: B61:2
          source: OBDb Hyundai-IONIQ-Electric (7E4 21 01 bix 405, BAT_MANAGEMENT_IGN); canair B61 cross-tab vs VCU/IGPM 2026-10-27
          verified: false
          notes: >-
            1 in all 2538 aligned READY rows (VCU EV_READY 1) and throughout the 2026-08-02 AC
            charge begun with the car READY (521 rows, EV_READY 0). 0 in every charge begun with the
            car off (AC and DC), in the 2026-10-21 12 V top-up, and on 2026-08-02 after that charge
            ended: it fell at 11:18:39 when the HV contactors opened, while IGPM ACC2_IGN_ON still
            read 1 (11:19:27) and the car was still in ACC2 at 12:49. OBDb names this bit BMS
            ignition; the 2026-08-02 window shows it is not the plain ignition input.
          enabled: true
          min: "0"
          max: "1"
        BMS_IG3_ON:
          expression: B61:3
          min: "0"
          max: "1"
          source: canair B61 cross-tab vs VCU 2101 VCU_IG3_ON 2026-10-27
          verified: true
          notes: >-
            Equals VCU_IG3_ON in 10845 of 10846 aligned rows; the exception is the last row of the
            2026-10-21 12 V top-up (BMS 1, VCU 0). 0 in 7 BMS captures (B61 = 0x01), each after a
            charge ended or the car was switched off. Disabled as a duplicate of VCU_IG3_ON.
          enabled: false


