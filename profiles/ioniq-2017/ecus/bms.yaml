# ─── BMS (Battery Management System) ─────────────────────────────────
#
# KWP2000 diagnostic sessions (service 0x10) — probed 2026-07-22, car in READY:
# see the structured `sessions:` field at the end of this ECU block.
# Only 0x81 (standardDiagnosticSession) is accepted; 21xx live-data reads work
# in the default session anyway — no session unlocks extra data. Payload sizes
# are identical across sessions: 2101=61B, 2102=38B, 2103=38B, 2104=38B, 2105=45B.
BMS:
  tx_id: 0x7E4
  can_bus: [P-CAN, H-CAN]
  identity:
    description: Battery Management System
    ecu_id: "AEEV__ BMS"  # KWP2000 1A90
    fw_version: "VER.2.3"  # KWP2000 1A91
    sw_id: CGBMSE305AE1000A  # KWP2000 1A8C
    calibration: "4604"  # KWP2000 1A8D
    id_protocol: KWP2000  # 1Axx
    notes: >-
      1A80 firmware build date reads 2008-07-09. Air-cooled pack: a BMS-controlled fan in the trunk
      draws cabin air in under the middle rear seat and out through the right rear wheel well.
  vehicle_states: [READY, CHARGING]
  pids:
    2101:
      response_frames: 9
      status: active
      period: 1000
      vehicle_states: [READY, CHARGING]
      parameters:
        SOC_BMS:
          expression: "B09/2"
          unit: "%"
          ha_class: battery
          min: "0"
          max: "100"
          verified: true
          notes: Raw BMS state of charge (not display-adjusted; see SOC_DISP).

        BATTERY_POWER:
          expression: "(([B18:B19]/10) * (((S15 << 8) | B17)/10)) / 1000"
          unit: kW
          ha_class: power
          min: ""
          max: ""
          verified: true
          notes: "Computed from voltage * current. Negative = charging."
          send_to: wican/ioniq/stream/battery_power

        BATTERY_VOLTAGE:
          expression: "[B18:B19]/10"
          unit: V
          ha_class: voltage
          min: "200"
          max: "450"
          verified: true
          notes: ""

        BATTERY_CURRENT:
          expression: "((S15 << 8) | B17)/10"
          unit: A
          ha_class: current
          min: "-300"
          max: "300"
          verified: true
          notes: >-
            Signed 16-bit: high byte B15 signed, low byte B17 unsigned (B16 is a PCI byte). Negative
            = charging. Captures reach -174 A (DC charging) and +276.7 A (hard acceleration).

        MAX_CELL_VOLTAGE:
          expression: "B30*0.02"
          unit: V
          ha_class: voltage
          min: "0"
          max: "10"
          verified: true
          notes: ""

        MIN_CELL_VOLTAGE:
          expression: "B33*0.02"
          unit: V
          ha_class: voltage
          min: "0"
          max: "10"
          verified: true
          notes: ""

        AUX_BATTERY_VOLTAGE:
          expression: "B37*0.1"
          unit: V
          ha_class: voltage
          min: "0"
          max: "128"
          verified: true
          notes: "12V auxiliary battery"

        BMS_MAIN_RELAY:
          expression: "B14:0"
          unit: ""
          ha_class: ""
          min: ""
          max: ""
          source: "ITStromer community sheet (j:0 = BMS Relay) + captures"
          source_links: []
          verified: true
          notes: HV main relay closed. 0 in 96 of 10708 captures, all with B14 = 0x20, 0x40 or 0x00.

        AC_CHARGER_CONNECTED:
          expression: B14:5
          unit: ""
          ha_class: plug
          min: ""
          max: ""
          verified: true
          notes: >-
            Set while an AC cable is plugged in, whether or not the EVSE delivers energy
            (2026-08-08: 1 with CHARGING 0, contactors open and pilot duty 100 %). Clear throughout
            a CCS fast charge (2026-08-08, n=50). Backs the PLUGGED state predicate.
          source: canair analysis 2026-08-08 (CCS DCFC + scheduled home-EVSE wait)
        CHARGING_DC:
          expression: B14:6
          unit: ""
          ha_class: plug
          min: ""
          max: ""
          verified: true
          notes: >-
            Set during DC fast charging (2026-08-08 CCS session, n=54). Clear in all 1576
            AC-charging captures, where CHARGING (B14:7) is set.
          source: canair analysis 2026-08-08 50 kW DCFC session (first real rapid charge on this car)
        CHARGING:
          expression: "B14:7"
          unit: ""
          ha_class: battery_charging
          min: ""
          max: ""
          verified: true
          notes: ""

        BATTERY_FAN_STATUS:
          expression: "B35"
          unit: ""
          ha_class: ""
          min: "0"
          max: "9"
          verified: true
          notes: ""

        BATTERY_FAN_FEEDBACK:
          expression: "B36"
          unit: "Hz"
          ha_class: ""
          min: ""
          max: ""
          verified: true
          notes: ""

        BATTERY_INLET_TEMP:
          expression: "S29"
          unit: "°C"
          ha_class: temperature
          min: "-128"
          max: "128"
          verified: true
          notes: ""

        BATTERY_MAX_TEMP:
