    22B001:
      response_frames: 3
      status: draft
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      notes: >-
        20 bytes, mostly 0. Gives NO DATA on the first read after wake, then answers. B20 read 0x02
