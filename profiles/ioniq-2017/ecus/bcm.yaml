  research:
    - type: decode
      target: "22B00C"
      status: captured
      priority: P2
      vehicle_states: [ACC]
      notes: "LIKELY INCORRECT. Reads B05=0x3F (=63), constant across all 23 captures; never observed to change. '6 days set' is an unverified pattern-match, likely a static config/format byte rather than the live schedule. Re-capture after toggling schedule days to find which bytes actually move."
      sources:
        - "Captured 2026-04-15"
    - type: decode
      target: "22B00D"
      status: captured
      priority: P2
      vehicle_states: [ACC]
      notes: "LIKELY NOT PREHEAT. B03-B05=0xFCFCE0 constant across all 23 captures; the only bytes that vary are B07 (0x00->0x03) and B08 (0x00->0x10). Preheat-timer interpretation is unverified and probably incorrect. Re-capture after changing preheat settings to see whether any byte tracks the change."
      sources:
        - "Captured 2026-04-15"
    - type: decode
      target: "22B007"
      status: captured
      priority: P2
      vehicle_states: [ACC]
      notes: "LIKELY INCORRECT. 0x01E0 (=480) is constant across all 25 captures and never changed; 480=08:00 is an unverified pattern-match. The bytes that vary between captures are elsewhere (payload B08/B09 area), not the 0x01E0 this reads. Probably a fixed config/format constant, not the departure time. Re-capture after changing the departure time to confirm."
      sources:
        - "Captured 2026-04-15"
    - type: decode
      target: "22B001-B00A, B00F"
      status: captured
      priority: P3
      vehicle_states: [ACC]
      notes: "BCM body data pages, all responding, mostly undecoded. B001 config flags (20B), B003 dense bitfields (27B), B004 voltage/current, B009 repeating FEEE."
      sources:
        - "Captured 2026-04-15"
    - type: iocontrol_scan
      target: "2F B073-B0FF"
      status: done
      priority: P2
      vehicle_states: [ACC]
      notes: "B000-B0FF complete (24 DIDs, all in B000-B072). B100-B1FF empty. C000-C0FF has 6 new (C001-C006, TPMS region). E000-E0FF empty. Scanned 2026-04-18."
      sources:
        - "IOControl scan 2026-04-15, 2026-04-18"
    - type: scan
      target: 27 SecurityAccess
      status: done
      priority: P2
      created: "2026-07-24"
      updated: "2026-07-23"
      date: "2026-07-22"
      result: present; SecurityAccess uses a non-trivial seed-key (no simple transform)
      notes: "BCM supports SecurityAccess (0x27) in the 10 03 extended session: 27 01 returns a fresh random 4-byte seed each request. The seed-key is a non-trivial HKMC scheme (likely SA2 bytecode/secret), not a simple transform, so opening security access requires dealer-level tooling — out of scope for canair (read/diagnostics only). Aggressive lockout (~2 attempts -> NRC 0x37 11s delay)."
      sources:
        - on-car 2026-07-22
    - type: decode
      target: 22B004 B10 (enum, not bitfield)
      status: pending
      priority: P3
      created: "2026-08-06"
      updated: "2026-08-06"
      notes: "coverage --bitfields reports 'BITS B11 have{6}' for this PID, but B10 is the byte carrying the live signal and it is an ENUM, not independent flags: across 893 captures it takes only 3 values — 0 (n=861), 14 = bits 1,2,3 (n=30), 192 = bits 6,7 (n=2). Bits 1/2/3 never move independently, nor do 6/7, so defining them as separate flags would misrepresent one state code as five flags. Value 14 coincides with READY / powered states, 0 with SLEEP; n=2 for 192 is too thin to name."
      what_to_test:
        - "Model B10 as a whole-byte enum (type: enum with values 0/14/192) once each value has a confirmed state. Capture more instances of value 192 to identify it."
    - type: verify
      target: 22C011
      status: captured
      priority: P2
      vehicle_states: [ACC, READY]
      created: "2026-08-07"
      updated: "2026-08-07"
      notes: "Identify BCM_EVENT_COUNTER_C011 (B13:B14, monotonic 9835->10092 over 112 days, ~2.3/day, 7.24 km per count lifetime). Controlled test: read 22C011, cycle the ignition ONCE without moving the car, re-read. +1 => ignition/power-cycle count; unchanged => distance-gated trip count. Repeat with a short drive to separate the two."
    - type: verify
      target: 22B005 B10:5-7 / 22B003 B12,B14 light stalk + auto-light
      status: captured
      priority: P2
      vehicle_states: [READY]
      created: "2026-10-22"
      updated: "2026-10-22"
      notes: >-
        Stalk OFF/lamps-on/AUTO decoded from 2026-04-17..2026-10-22 captures (BCM_LIGHT_SW_*,
        BCM_LIGHT_SW_ADC); BCM_AMBIENT_LIGHT is a candidate auto-headlight sensor. Parking-light
        position and the AUTO on/off threshold are uncaptured.
      what_to_test:
        - Stalk OFF, AUTO, parking, low beam (~3 s each); parking = B10:5 alone?
        - "AUTO, cover dash sensor: BCM_AMBIENT_LIGHT at LOW_BEAM on and off"
      capture_protocol: >-
        canair monitor BCM:22B003,22B004,22B005 IGPM:22BC03 --save --keep-changes --state READY
        --label 'light stalk + auto-light sweep'; press 's' to note each step.
