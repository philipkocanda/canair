      parameters: {}

    22B002:
      response_frames: 2
      status: draft
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      notes: "9 bytes. Sparse data. Purpose unknown. Sample: 62B002C00000000300."
      parameters: {}

    22B003:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      parameters:
        BCM_12V_BATTERY:
