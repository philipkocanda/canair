      notes: >-
        Stalk OFF/lamps-on/AUTO decoded from 2026-04-17..2026-10-22 captures (BCM_LIGHT_SW_*,
        BCM_LIGHT_SW_ADC, and the 22B00D enum BCM_LIGHT_SW_POSITION); BCM_AMBIENT_LIGHT is a
