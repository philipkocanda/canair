      target: 22C00B rear tyre order (RL/RR)
      status: pending
      priority: P2
      vehicle_states: [ALL]
      created: "2026-10-27"
      updated: "2026-10-27"
      notes: >-
        Our TYRE_PRESSURE_RL is B19 and TYRE_PRESSURE_RR is B23 (original WiCAN config, never
        checked against a single tyre). OBDb Hyundai-IONIQ-Electric and Kia-Niro (older layout) read
        the same bytes as rear right then rear left. OBDb Kona-Electric, Niro-EV and Soul-EV read
        them as rear left then rear right, so the community is split. Both rear pressures sit in the
        same 35-41 psi band, so no existing capture decides it.
      sources:
        - OBDb Hyundai-IONIQ-Electric signalset and its tests/test_cases (2017/2018 command_support), compared 2026-10-27
      what_to_test:
