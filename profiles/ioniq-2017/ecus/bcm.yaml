        BCM_AMBIENT_LIGHT:
          expression: B12
          unit: ""
          display: ""
          ha_class: ""
          min: "0"
          max: "255"
          source: "RE 2026-10-22: B12 by hour of day across 2026-04-15..2026-10-22"
          source_links: []
          verified: false
          notes: >-
            Raw count, higher = brighter. 9-55 in every session after 20:00 and at 08:28 on
            2026-08-05; 245-246 (ceiling) in daylight; 51-246 while parked charging 12:31-15:30 on
            2026-08-05. Ceiling in daylight fits an auto-headlight sensor. No HVAC byte tracks it
            (|r| <= 0.32). Auto-on threshold not captured (no AUTO-in-dark data).
    # ─── TPMS configuration DIDs (22C001-C014) ───────────────────────────
    # Static TPMS sensor registration, IDs, and configuration data.
    # C00B (above) has live tyre pressure/temp readings.
          enabled: false
        BCM_12V_SENSE2:
          expression: B28*0.08
          unit: V
          min: "0"
          max: "20"
          source: RE 2026-08-02 state discrimination
          verified: false
          notes: >-
            0 in more than half of 3620 captures; when non-zero it reads close to BCM_12V_BATTERY,
            and fell 14.5 to 12.4 V with it when the DC-DC converter stopped after a charge.
        BCM_LIGHT_SW_ADC:
          expression: B14
          min: "0"
          max: "255"
          source: "RE 2026-10-22: B14 levels vs 22B005 B10 bits 5-7 and IGPM 22BC03 lamp outputs"
          verified: false
          notes: >-
            Discrete levels with +-1 LSB flicker, read as a resistor-ladder light-stalk input: ~249
            OFF, ~211 lamps on, 101 AUTO (2026-10-22, stalk confirmed AUTO). Same partition as
            BCM_LIGHT_SW_* on 22B005 in every co-polled session. Parking-light level not captured.
        BCM_TEMP_RAW_B13:
          expression: B13
          min: "0"
          max: "255"
          source: "RE 2026-10-22: B13 vs HVAC_INTERIOR_TEMP, 2026-04-15..2026-10-22"
          verified: false
          notes: >-
            Raw count, falls as temperature rises (NTC-like). Against HVAC_INTERIOR_TEMP, excluding
            dropouts: B13 ~ 224.2 - 2.26 x cabin degC, r=-0.955, n=830, cabin 9-38.5 degC. 112-203
            overall; 201-203 at 9 degC on 2026-10-22, 169 -> 136 as the cabin went 26 -> 38.5 degC
            on 2026-08-02. Isolated single-sample drops to 62 (22 of 3676), read as an invalid-value
            marker. Sensor location unknown: lags cabin air, may be BCM board temperature.
    22C001:
      status: ignored
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      notes: >
        34 bytes. Contains 4× C0F8-prefixed TPMS receiver addresses — one per wheel.
        Static configuration. Sample: 62C001FFFF000001C0F80410C0F80BD2C0F81174C0F81188AAAA.
      parameters: {}

