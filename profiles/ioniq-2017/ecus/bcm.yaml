          enabled: false
        BCM_EVENT_COUNTER_C011:
          expression: "[B13:B14]"
          unit: ""
          min: "0"
          max: "65535"
          source: monotonic-counter sweep of all captures 2026-04-16..2026-08-05
          verified: false
          notes: >-
            16-bit big-endian. Only rises (9835 to 10113), flat within every recording session,
            about 2.3 steps a day. Not a timer. What it counts is unknown.

