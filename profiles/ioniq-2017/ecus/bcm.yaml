    - type: decode
      target: 22B004-22B00E support bitmap (B05-B07, B09); 22B003 byte map
      status: pending
      priority: P2
      vehicle_states: [READY, CHARGING]
      created: "2026-10-29"
      updated: "2026-10-29"
      result: "Same layout as IGPM 22BC03-07 (see that research entry), with exceptions. In 22B004-22B00E the four constant bytes B05, B06, B07, B09 map the data bits of B10, B11, B12, B13, MSB first: 34 of the 41 bits ever set lie inside the map, against 12-20 for a random pairing (99th percentile 20). 22B003 uses a per-byte version: map BF 8B 80 00 marks B10, B12-B15, B17-B19, B23 and B26-B28 as signals; 11 of its 12 varying bytes are inside (B20, an unconnected input, is not). B11, the constant ~4.9 V reading, is outside; B15, B17 and B19 are inside but undefined."
      notes: "EXCEPTION: in 22B005 (map 20 00 10 00) only B10:2 and B12:3 are marked, yet BCM_LIGHT_SW_AUTO (B10:6), BCM_LIGHT_SW_ON_B5/B7 (B10:5, B10:7) and BCM_UNLOCKED_OR_IGN_ON (B10:3) all move and are backed by the 2026-10-22 AUTO test, so the map is not authoritative on the BCM. Also outside a map: BCM_B004_B12_5 (22B004 map byte 0x99 marks B12:0, 3, 4, 7), possibly the second bit of a field that starts at bit 4. Marked bits with no definition, MOVING (now candidate signals): 22B004 B12:7 (0 in 7 of 2349: 2026-04-17 x2, 2026-10-25 x5), B13:4 (6: 2026-07-22, 2026-10-25); 22B00A B10:2 (250 of 1694, 238 of them in the 2026-07-27 AC charge), B11:5 (3), B11:6 (0 in 5, all 2026-10-25), B12:7 (82, spread over 8 dates); 22B00C B10:2 (2, 2026-10-25). 22B007 B12:7 and B13:0-2 are set in one row only (2026-10-25 12:23:32, a session with many transport errors), so probably a bad read. ALWAYS 1: 22B005 B12:3, 22B008 B11:3 and B11:7, 22B00A B12:0 and B12:2. NEVER SET: 22B004 B12:0, B12:4, B13:5; 22B008 B11:1, B12:5; 22B009 24 of its 26 marked bits; 22B00A B10:0, B10:1, B10:6, B10:7, B11:0-2, B11:4, B12:1; 22B00C B10:3-B10:7; 22B00D B11:0-2, B12:0-2; 22B00E B10:4."
      sources:
        - byte sweep over all stored BCM captures, 2026-10-29
      what_to_test:
        - "Same narrated body sweep as the IGPM entry, with BCM 22B004-22B00E co-polled: every new moving bit should be inside its map, and 22B005 shows whether the BCM uses multi-bit fields where the map marks only a start bit."
    - type: scan
      target: 31 03 0200-DFFF
      status: pending
      priority: P3
      vehicle_states: ["ON"]
      created: "2026-10-30"
      updated: "2026-10-30"
      notes: The 2026-04-20 0x31 sweep ran in SLEEP and was cut off at C8D2. ES95486 allows RoutineControl only with ignition on and the car not READY, so NRC 0x22 answers (12A1) may change in ON. Manufacturer routine ids are 0200-DFFF; F000-FEFF (the scan default F000-F0FF) is the supplier range.
      sources:
        - ES95486-00 sections 3.1 and 8.1
      what_to_test:
        - canair scan routines BCM --rid-range 0200-DFFF --session, in ON
