        NOT likely an ELM327 stale-read artifact: the response echoed 62B00F (the
        requested DID), not 62B00D — a stale-buffer/mislabel would have carried
        B00D's echo and been rejected by echo validation; and the whole 04-15
        B001-C00F sweep is well-formed with correct per-DID echoes (no framing
