  # BCM requires extended diagnostic session (10 03) AND SKM ACC+IGN1 power.
  # Scan status: B000-B0FF fully scanned (24 DIDs), C000-C0FF (6 DIDs), E000-E0FF (0). 2026-04-18.
  iocontrol:
    B003:
      vehicle_states: []
      label: Unknown
      verified: false
      true: "2FB00303"
      false: "2FB00300"
      notes: >
        Sleep (locked): NRC 0x22: conditionsNotCorrect

    B006:
      vehicle_states: [ACC, READY]
