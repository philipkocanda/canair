      parameters: {}

    22C00C:
      status: ignored
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      notes: >-
        37 bytes. Extended TPMS data — wheel 1 has live data with C0F8 address, other slots empty
