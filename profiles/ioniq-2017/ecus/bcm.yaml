    22C011:
      status: draft
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      notes: >-
        13 bytes. NOT static — bytes 8-9 (ELM index) change rapidly every 2s. PARTLY DECODED
        2026-08-05: the slowly-drifting "byte 8" (WiCAN B11, ~0xA2/0xA1) is NOT TPMS RSSI — it is
        the 12V BUS VOLTAGE (B11/12.8, verified against the verified 22B003 BCM_12V_BATTERY; see
        BCM_12V_BUS_C011). Its "slow drift" is just the bus moving between rest (~12.7 V) and
        DC-DC-active (~14.5 V). Byte 9 (WiCAN B12) still jumps 20-100 counts per read (ADC-like
        jitter) and remains unidentified — it is now the sole RSSI candidate here. Tail bytes 10-11
        are NOT static (corrected 2026-08-07): they are a 16-bit BE monotonic event counter, 9835 ->
        10092 over 112 days, 13 up-steps and 0 down — see BCM_EVENT_COUNTER_C011. They only looked
        static because the counter steps ~2.3x/day and never moves *within* a recording session;
        0x266E was simply an earlier, lower value. The single-read capture (0xA2D3266B) was
        misleading for the same reason, and separately made byte 9 look static when it was one
        snapshot. Test: compare B12 with C012-C014 and correlate with tyre proximity. Sample:
        62C011E000000000A25F266EAA (byte 9 varies). Payload length varies 12/13 bytes (trailing 0xAA
        is ISO-TP padding); byte offsets are unaffected.
      parameters:
        BCM_12V_BUS_C011:
          expression: B11/12.8
          unit: V
          min: "0"
          max: "20"
          source: RE 2026-08-05 cross-PID mirror vs the verified BCM 22B003 BCM_12V_BATTERY
          verified: true
          notes: >-
            12V bus voltage on the 22C011 page (B11, ISO-TP 0x08). VERIFIED 2026-08-05 against the
            VERIFIED BCM_12V_BATTERY (22B003 B10*0.08): the ratio B11/BCM_12V_BATTERY is exactly
            12.8 in 1781 of 1965 co-polled rows, i.e. B11 = 12.8 x the bus voltage, so B11/12.8
            recovers it (equivalently B11 ~= 1.024 x 22B003 B10 — the same quantity read at a
            slightly different node/scale, ~0.35 V apart at 14.5 V, which is why the finer 1/12.8
            scale is used here rather than 22B003's 0.08). Absolute check: at rest B11=162 -> 12.66
            V; during AC charge B11=186 -> 14.53 V. CORRECTS A STANDING HYPOTHESIS: this is the byte
            the 22C011 header note described as 'byte 8 drifts slowly (~0xA2, occasionally 0xA1)'
            and guessed to be TPMS RF signal strength (RSSI) — it is the 12V bus, and the 'slow
            drift' is simply the bus moving between rest (~12.7 V) and DC-DC-active (~14.5 V). The
            genuinely jumpy neighbour B12 (the note's 'byte 9', ADC-like 20-100 count jumps) is
            still unidentified and remains the RSSI candidate. Redundant with the shipped 22B003
            copy and 22C011 is a draft page, so enabled:false.
          enabled: false
        BCM_EVENT_COUNTER_C011:
          expression: "[B13:B14]"
          unit: ""
          min: "0"
          max: "65535"
          source: monotonic-counter sweep of all captures 2026-04-16..2026-08-05
          verified: false
          notes: >-
            16-bit BE at B13:B14 (ISO-TP i10-i11). Monotonic across the whole corpus: 9835 -> 10092
            over 112 days, 13 up-steps, 0 down (p = 2^-13). FLAT within all 20 recording sessions,
            stepping only between them, so it is event-driven, not a timer. Rate ~2.3/day; 73048 km
            / 10092 counts = 7.24 km per count over the vehicle's life, 11.7 km/count over the
            observed span. CORRECTS this PID's header claim that the tail bytes are static: 0x266E
            was simply an earlier, lower value of this counter. Most consistent with an
            ignition/power-cycle or trip count; NOT hours of operation (that would imply an 11.7
            km/h average). UNVERIFIED: to identify, read 22C011, cycle the ignition once without
            driving, re-read. +1 => power/ignition cycles; unchanged => a distance-gated trip count.

    22C012:
      status: ignored
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      notes: >
        13 bytes. ASCII 'DO01' at B07-B10 — references wheel 1 sensor ID.
        Sample: 62C01280000000444F3031AAAA.
      parameters: {}

    22C013:
      status: ignored
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      notes: >
        13 bytes. ASCII '0x0620' — possibly TPMS firmware version or config revision.
        Sample: 62C01380000000307830363230.
      parameters: {}

    22C014:
      status: ignored
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      notes: >
        13 bytes. B10=0x0C. Purpose unknown — last responding DID in C0xx range.
        Sample: 62C014F00000000CAAAAAAAAAA.
      parameters: {}

