# ─── BCM (Body Control Module) / TPMS ──────────────────────────────────
# BCM and TPMS share TX ID 0x7A0 (same physical ECU, part 95400G7470).
# TPMS data is accessed via DID 22C00B on the BCM.
BCM:
  tx_id: 0x7A0
  iocontrol_scan_ranges: [B000-B3FF, B400-B7FF, C000-C0FF, F000-F0FF]
  can_bus: [B-CAN, C-CAN]
  identity:
    description: Body Control Module
    part_number: "95400G7470"
    mfg_date: "2017-05-31"
    id_protocol: UDS  # F1xx
    notes: >
      Body Control Module. Shares TX ID 0x7A0 with TPMS (same physical ECU,
      part 95400G7470); TPMS data is read via DID 22C00B on the BCM.
  vehicle_states: [ALL]
  scan_log: # BCM
    - service: 0x31
      range: "0000-FFFF"
      date: 2026-04-20
      hits: "~71+ (screen only, not in log — connection dropped)"
      probes: 49813  # cut off at 0xC8D2 — WiCAN sleep/disconnect
      vehicle_states: [SLEEP]
      notes: >
        BCM supports service 31 (sub-fn 03 requestRoutineResults).
        Two clusters of positive responses seen on screen (not saved to log — connection dropped):
          Cluster A: 0x95CE–0x97C2 (~40 hits, stride 0x0D)
          Cluster B: 0xC726–0xC8B8 (~32 hits, stride 0x0D)
        All responses are 2 bytes (just positive ack, no result data — routine exists but no
        result available, likely needs startRoutine first or ignition on).
        Notable: RID 0x12A1 returned NRC 0x22 (conditionsNotCorrect).
        Remaining range 0xC8D3-0xFFFF not yet scanned.
        TODO: Resume scan from 0xC8D3. Also re-scan 0x95CE-0xC8D2 to capture hits to log.
  pids:
    22C00B:
      response_frames: 4
      status: active
      period: 60000
      vehicle_states: [ALL]
      parameters:
        TYRE_PRESSURE_FL:
          expression: "B10/72.52"
          unit: bar
          ha_class: pressure
          min: "0"
          max: "5"
          source: "Original WiCAN config + Ioniq forum"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: Raw byte / 72.52 = bar (B10 / 5 = psi).

        TYRE_PRESSURE_FR:
          expression: "B14/72.52"
          unit: bar
          ha_class: pressure
          min: "0"
          max: "5"
          source: "Original WiCAN config"
          source_links: []
          verified: true
          notes: ""

        TYRE_PRESSURE_RL:
          expression: "B19/72.52"
          unit: bar
          ha_class: pressure
          min: "0"
          max: "5"
          source: "Original WiCAN config"
          source_links: []
          verified: true
          notes: ""

        TYRE_PRESSURE_RR:
          expression: "B23/72.52"
          unit: bar
          ha_class: pressure
          min: "0"
          max: "5"
          source: "Original WiCAN config"
          source_links: []
          verified: true
          notes: ""

        TYRE_TEMP_FL:
          expression: "B11-50"
          unit: "°C"
          ha_class: temperature
          min: "-50"
          max: "100"
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: Kia Niro EV formula. Reads 10-38 °C on this car, with one -48 °C outlier.

        TYRE_TEMP_FR:
          expression: "B15-50"
          unit: "°C"
          ha_class: temperature
          min: "-50"
          max: "100"
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: ""

        TYRE_TEMP_RL:
          expression: "B20-50"
          unit: "°C"
          ha_class: temperature
          min: "-50"
          max: "100"
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: ""

        TYRE_TEMP_RR:
          expression: "B25-50"
          unit: "°C"
          ha_class: temperature
          min: "-50"
          max: "100"
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: ""
        TYRE_SENSOR_STATE_FL:
          expression: B12
          type: enum
          values:
            1: stale
            2: fresh
          min: "0"
          max: "2"
          source: TPMS timeline 2026-10-22
          verified: false
          notes: >-
            Reads 1 or 2. On 2026-08-02 (parked, ON) the four wheels flipped 1->2 one at a time
            between 10:12:35 and 10:18:49, each at the same capture as its own pressure and
            temperature stepped from the previous evening's warm values to cold ones, so 2 is read
            as a reading received this power cycle and 1 as a held one. 2 in READY on 07-28 and
            07-30 (all wheels) and 07-21 (all but FL); 1 on every wheel in READY on 10-22 (21
            captures, parked) and in most key-off captures.
        TYRE_SENSOR_STATE_FR:
          expression: B17
          type: enum
          values:
            1: stale
            2: fresh
          min: "0"
          max: "2"
          source: TPMS timeline 2026-10-22
          verified: false
          notes: >-
            Same behaviour as TYRE_SENSOR_STATE_FL, for the FR wheel; it flipped 1->2 with its own
            pressure/temperature step on 2026-08-02.
        TYRE_SENSOR_STATE_RL:
          expression: B21
          type: enum
          values:
            1: stale
            2: fresh
          min: "0"
          max: "2"
          source: TPMS timeline 2026-10-22
          verified: false
          notes: >-
            Same behaviour as TYRE_SENSOR_STATE_FL, for the RL wheel; it flipped 1->2 with its own
            pressure/temperature step on 2026-08-02.
        TYRE_SENSOR_STATE_RR:
          expression: B26
          type: enum
          values:
            1: stale
            2: fresh
          min: "0"
          max: "2"
          source: TPMS timeline 2026-10-22
          verified: false
          notes: >-
            Same behaviour as TYRE_SENSOR_STATE_FL, for the RR wheel; it flipped 1->2 with its own
            pressure/temperature step on 2026-08-02.
    22B00D:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B10 is the light-stalk position (BCM_LIGHT_SW_POSITION); B11 bit 4 the 22B003 B18
        input, bits 3 and 5 pulses while it is set. B05-B07 = FC FC E0 constant.
      parameters:
        BCM_LIGHT_SW_POSITION:
          expression: B10
          type: enum
          values:
            0: "off"
            1: auto
            3: "on"
          min: "0"
          max: "3"
          source: Cross-tab vs 22B005 B10 bits 5-7 and 22B003 B14, 2026-10-22
          verified: false
          notes: >-
            Light-stalk position as one code. Agrees with BCM_LIGHT_SW_ADC levels in all 375 aligned
            rows (0 at ~249, 1 at 101, 3 at ~211) and with BCM_LIGHT_SW_ON_B5/_AUTO in all 344.
            Cleared with the stalk at 10:25:29 on 2026-07-30 and 09:54:31 on 2026-08-02. Parking
            position not captured.
        BCM_B00D_B11_4:
          expression: B11:4
          min: "0"
          max: "1"
          source: Cross-tab vs 22B003 B18 2026-10-22
          verified: false
          notes: >-
            Equals BCM_B004_B12_5 (the 22B003 B18 input) in 350 of 351 aligned rows. Disabled as a
            duplicate.
          enabled: false
        BCM_B00D_B11_3:
          expression: B11:3
          min: "0"
          max: "1"
          source: Event timeline 2026-10-22
          verified: false
          notes: >-
            Set only while BCM_B00D_B11_4 is 1 (21 of 49 such captures, never otherwise), in runs of
            20 s to 82 min: 2026-08-02 09:54-11:21, 08-03 21:46, 08-05 12:54-14:05 (13 runs while
            charging), 08-08 09:44-09:45. No co-polled signal follows it. Meaning unknown.
        BCM_B00D_B11_5:
          expression: B11:5
          min: "0"
          max: "1"
          source: Same-payload cross-tab 2026-10-22
          verified: false
          notes: Equals BCM_B00D_B11_3 in 376 of 377 captures. Disabled as a duplicate.
          enabled: false

    22B00E:
      response_frames: 2
      status: active
      period: 5000
      vehicle_states: [ALL]
      parameters:
        CHARGE_PORT_OPEN:
          expression: "B10:5"
          unit: ""
          ha_class: opening
          min: ""
          max: ""
          source: "Kia Niro EV WiCAN PR#716"
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/716
          verified: true
          notes: >-
            1 = open. Bit 5 on this car (bit 4 in the Niro EV source). Works in the default session.

    22B00F:
      status: ignored
      vehicle_states: ["ON"]
      notes: >-
        13 bytes as stored, probably 11 plus 0xAAAA frame padding as on 22B00D (only old, padded
        reads exist). Identical payload to B00D (0xFCFC E0...) — possibly mirrored register
      parameters: {}

    22B004:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B10 ignition state (BCM_IGN_STATE_B004); B11:6 short pulses with the ignition off;
        B12:3 light stalk AUTO; B12:5 the digital reading of the 22B003 B18 input; B12:7 constant 1.
        B05=0x74, B06=0x02, B07=0x99 constant; B09=0x0C except 2 untimed captures.
      parameters:
        BCM_B004_B11_6:
          expression: "B11:6"
          unit: ""
          ha_class: ""
          mqtt_topic: ""
          min: "0"
          max: "1"
          source: Fob lock/unlock test 2026-04-18; ignition cross-tab 2026-10-22
          source_links: []
          verified: false
          notes: >-
            Changed on fob lock and unlock on 2026-04-18. Does not follow the IGPM door locks: reads
            0 in 254 of 292 aligned captures where IGPM DOOR_LOCK_FL and DOOR_LOCK_FR read 1, and
            changed 12 times between 21:03 and 21:27 on 2026-10-21 (runs of 21 s to 8 min) with all
            doors locked throughout. 344 short pulses (median 5 s), all with the ignition off: 0 in
            all 75 ignition-on captures. 1 in 367 of 994 captures.
        BCM_LIGHT_SW_AUTO_B004:
          expression: B12:3
          min: "0"
          max: "1"
          source: "RE 2026-10-22: 22B004/22B005 co-polled sessions 2026-04-17..2026-10-22"
          verified: false
          notes: >-
            Equal to 22B005 BCM_LIGHT_SW_AUTO in every co-polled capture: 1 only on 2026-10-22
            (stalk at AUTO). Disabled as a duplicate. B12:7 is constant 1; B12:5 varies
            independently of the stalk.
          enabled: false
        BCM_IGN_STATE_B004:
          expression: B10
          type: enum
          values:
            0: "off"
            14: ign_on
            192: unknown_192
          min: "0"
          max: "255"
          source: Cross-tab vs IGPM ACC2_IGN_ON and BCM_IGN_SUPPLY_V 2026-10-22
          verified: false
          notes: >-
            Bits 1-3 only ever set together (14). 14 in all 51 rows where BCM_IGN_SUPPLY_V is on, 0
            in all 908 where it is off; equals ACC2_IGN_ON in all 326 aligned rows, including
            CHARGING+ON with the drive path down. 192 (bits 6, 7) in 2 untimed SLEEP captures on
            2026-04-17, unexplained. Disabled as a duplicate of ACC2_IGN_ON.
          enabled: false
        BCM_B004_B12_5:
          expression: B12:5
          min: "0"
          max: "1"
          source: Cross-tab vs 22B003 B18 2026-10-22
          verified: false
          notes: >-
            1 exactly when BCM_B003_B18 is in its 109-136 band, 0 when it is 158-159 or open (959 of
            959 aligned rows), i.e. the digital reading of that input. Mirrored by 22B00A B11:3 and
            22B00D B11:4. Meaning unknown.
        BCM_B004_B12_7:
          expression: B12:7
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B004 map. 1 in 2342 of 2349 captures; 0 on 2026-04-17 (x2) and
            2026-10-25 (x5). Meaning unknown.
          enabled: false
        BCM_B004_B13_4:
          expression: B13:4
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B004 map. 1 in 6 of 2349 captures (2026-07-22 x1, 2026-10-25 x5).
            Meaning unknown.
          enabled: false

    22B005:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B10 bits 2,3 (0x0C) set on fob unlock, together with B004 and B006; bits 5-7 are
        the light-stalk position (BCM_LIGHT_SW_*). B05=0x20, B07=0x10, B12=0x08.
      parameters:
        BCM_B005_UNLOCK_BITS:
          expression: B10
          unit: ""
          ha_class: ""
          min: "0"
          max: "255"
          source: Fob lock/unlock test 2026-04-18; byte offset corrected 2026-07-24
          source_links: []
          verified: false
          notes: >-
            Whole byte. Bits 2 and 3 set (0x0C) on fob unlock (2026-07-24 09:36:51). Bits 5-7 are
            the light-stalk position (BCM_LIGHT_SW_*): the common 0xA0 is the stalk in a lamps-on
            position, 0x00/0x08/0x0C with it OFF, 0x48 at AUTO.
        BCM_LIGHT_SW_AUTO:
          expression: B10:6
          min: "0"
          max: "1"
          source: "RE 2026-10-22: all 22B003/22B005 co-polled sessions 2026-04-17..2026-10-22"
          verified: false
          notes: >-
            1 only on 2026-10-22 (21 captures), when the light stalk was confirmed set to AUTO; 0 in
            every other session. Bits 5 and 7 clear while set. Duplicated by 22B004 B12:3.
        BCM_LIGHT_SW_ON_B5:
          expression: B10:5
          min: "0"
          max: "1"
          source: "RE 2026-10-22: all 22B003/22B005 co-polled sessions 2026-04-17..2026-10-22"
          verified: false
          notes: >-
            Set together with B10:7 whenever 22B003 B14 reads ~211, including the 2026-07-30 and
            2026-08-02 READY captures with IGPM LOW_BEAM and TAIL_LIGHTS on; clear at ~249 (lamps
            never on at READY). Cleared with B10:7 between 10:20:52 and 10:25:27 on 2026-07-30 as
            LOW_BEAM went 1->0. Parking-light vs headlamp contact not separated: parking position
            never captured (prediction: B10:5 alone).
        BCM_LIGHT_SW_ON_B7:
          expression: B10:7
          min: "0"
          max: "1"
          source: "RE 2026-10-22: all 22B003/22B005 co-polled sessions 2026-04-17..2026-10-22"
          verified: false
          notes: >-
            Always equal to B10:5 so far (see BCM_LIGHT_SW_ON_B5). Set with the stalk in a lamps-on
            position, clear at OFF and AUTO.
        BCM_UNLOCKED_OR_IGN_ON:
          expression: B10:3
          min: "0"
          max: "1"
          source: Cross-tab vs IGPM 22BC04 B13:6 2026-10-22
          verified: false
          notes: >-
            Equals IGPM INTERIOR_LAMP_AUTOCUT_RELAY in all 323 aligned rows. Disabled as a
            duplicate.
          enabled: false
    22B006:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B10 reads 0x04 (bit 2) on fob unlock, together with B004 and B005. B05=0x20, the
        rest normally 0.
      parameters:
        BCM_B006_UNLOCK_BITS:
          expression: B10
          unit: ""
          ha_class: ""
          min: "0"
          max: "255"
          source: Fob lock/unlock test 2026-04-18; byte offset corrected 2026-07-24
          source_links: []
          verified: false
          notes: >-
            0x00, or 0x04 (bit 2) on fob unlock (2026-07-24 09:36:52). 0x04 in 6 of 301 captures.
    22B007:
      support_map: {at: 0, length: 4, unit: bit, order: msb}
      parameters:
        BCM_IGN_ON_B007:
          expression: B11:2
          min: "0"
          max: "1"
          source: Ignition cross-tab 2026-10-22
          verified: false
          notes: >-
            1 in 51 of 345 captures. Equals IGPM ACC2_IGN_ON and BCM_IGN_SUPPLY_V in every aligned
            row (kappa 1.00), including ignition-on rows with the drive path down, so it follows the
            ignition, not READY. Disabled as a duplicate.
          enabled: false
      response_frames: 2
      status: draft
      period: 60000
      vehicle_states: [ALL]
      notes: B07:B09 reads 0x01E0 (480) in all 284 captures, across sleep, ACC and charging.
    22B008:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B12:4 follows the brake (BCM_BRAKE_SWITCH), B13:2 the ignition (BCM_IGN_ON_B008).
        B13:1 set in 3 captures, 2 with the passenger door open. B05=0x00, B06=0x51, B07=0x0C,
        B09=0x20, B11=0x88 constant. Sample: 62B00800510C2000880000.
      parameters:
        BCM_IGN_ON_B008:
          expression: B13:2
          min: "0"
          max: "1"
          source: Ignition cross-tab 2026-10-22
          verified: false
          notes: >-
            1 in 50 of 348 captures. Equals IGPM ACC2_IGN_ON and BCM_IGN_SUPPLY_V in every aligned
            row (kappa 1.00), including ignition-on rows with the drive path down, so it follows the
            ignition, not READY. Disabled as a duplicate.
          enabled: false
        BCM_BRAKE_SWITCH:
          expression: B12:4
          min: "0"
          max: "1"
          source: Cross-tab vs IGPM 22BC06 BRAKE_LIGHT 2026-10-22
          verified: false
          notes: >-
            1 only while IGPM BRAKE_LIGHT reads 0x2D: all 19 captures 2026-07-21 12:41-12:53 READY
            (BC06 B10 = 0x2D throughout), and 2026-08-01 20:48:18-20:49:50, 1-2 s after BRAKE_LIGHT
            rose (20:48:17) and fell (20:49:48). 0 in all 315 aligned rows with the brake released.
            2 sessions, 1 with both edges.

    22B009:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. Repeating 0xFEEE pattern (B03-B06) — possibly sensor addresses or calibration
        references. Rest zeros, except B10 and B12, which read 0x08 in 30 of 82 captures. Sample:
        62B009FEEEFEEE00000000.
      parameters:
        BCM_IGN_ON_B009:
          expression: B10:3
          min: "0"
          max: "1"
          source: Ignition cross-tab 2026-10-22
          verified: false
          notes: >-
            1 in 50 of 344 captures. B12:3 is identical in every capture. Equals IGPM ACC2_IGN_ON
            and BCM_IGN_SUPPLY_V in every aligned row (kappa 1.00), including ignition-on rows with
            the drive path down, so it follows the ignition, not READY. Disabled as a duplicate.
          enabled: false
        BCM_IGN_ON_B009_B12:
          expression: B12:3
          min: "0"
          max: "1"
          source: Ignition cross-tab 2026-10-22
          verified: false
          notes: Equals BCM_IGN_ON_B009 (B10:3) in every capture. Disabled as a duplicate.
          enabled: false

    22B00A:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        11 bytes. B11:3 the 22B003 B18 input, B12 bits 6-7 the ignition (BCM_IGN_ON_B00A). B10:2 is
        1 in 240 of 344 captures, 238 of them in the 2026-07-27 charging session (also 1 capture
        each on 07-22 and 08-15), 0 in the other charging sessions; meaning unknown. B11:5 set in 1
        capture. B05=0xE3, B06=0xFE, B07=0xE3 constant.
      parameters:
        BCM_IGN_ON_B00A:
          expression: B12:6
          min: "0"
          max: "1"
          source: Ignition cross-tab 2026-10-22
          verified: false
          notes: >-
            B12 is 0x05 off, 0xC5 on (bit 7 moves with it). 1 in 50 of 344 captures. Equals IGPM
            ACC2_IGN_ON and BCM_IGN_SUPPLY_V in every aligned row (kappa 1.00), including
            ignition-on rows with the drive path down, so it follows the ignition, not READY.
            Disabled as a duplicate.
          enabled: false
        BCM_B00A_B11_3:
          expression: B11:3
          min: "0"
          max: "1"
          source: Cross-tab vs 22B003 B18 2026-10-22
          verified: false
          notes: >-
            Equals BCM_B004_B12_5 (the 22B003 B18 input) in all 342 aligned rows. Disabled as a
            duplicate.
          enabled: false
        BCM_B00A_B10_2:
          expression: B10:2
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B00A map. 1 in 250 of 1694 captures, 238 of them during the 2026-07-27
            AC charge (10-16 A EVSE pilot steps). Meaning unknown.
          enabled: false
        BCM_B00A_B11_5:
          expression: B11:5
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B00A map. 1 in 3 of 1694 captures (2026-08-15 x1, 2026-10-25 x2).
            Meaning unknown.
          enabled: false
        BCM_B00A_B11_6:
          expression: B11:6
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B00A map. 1 in 1689 of 1694 captures; 0 only in 5 rows on 2026-10-25.
            Meaning unknown.
          enabled: false
        BCM_B00A_B12_7:
          expression: B12:7
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B00A map. 1 in 82 of 1694 captures spread over 8 dates (2026-07-21 x19,
            2026-10-22 x21, 2026-10-25 x32). Meaning unknown.
          enabled: false

    22B00B:
      status: ignored
      vehicle_states: [ACC, "ON", READY, CHARGING]
      notes: >
        NRC 0x31 (requestOutOfRange) in deep sleep AND in READY (retested
        2026-07-29). Only 2-byte response (7E00) on some attempts — may be a
        status register that requires a state not yet tested. No valid capture
        (no 62B00B response) has ever been recorded in any state.
      parameters: {}

    22B00C:
      parameters:
        BCM_B00C_B10_2:
          expression: B10:2
          source: support-bitmap sweep 2026-10-29
          verified: false
          notes: >-
            Marked by the 22B00C map (only signal there besides never-set B10:3-7). 1 in 2 of 1693
            captures, both 2026-10-25. Meaning unknown.
          enabled: false
      response_frames: 2
      status: draft
      period: 60000
      vehicle_states: [ALL]
      notes: B05 reads 0x3F in all 282 captures, across every state.
    22B001:
      response_frames: 3
      status: draft
      vehicle_states: [ALL]
      notes: >-
        20 bytes, mostly 0. Gives NO DATA on the first read after wake, then answers. B20 read 0x02
        in ACC (2026-04-14) and 0x01 in ON while charging (2026-04-19).
      parameters: {}

    22B002:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: "9 bytes. Sparse data. Purpose unknown. Sample: 62B002C00000000300."
      parameters: {}

    22B003:
      response_frames: 4
      status: draft
      period: 10000
      vehicle_states: [ALL]
      notes: >-
        24 bytes. Analog inputs at about 0.08 V per count: B10 the 12 V battery, B23/B26/B27/B28
        ignition-switched supplies, B12/B13/B14/B18 sensor and switch inputs. B11 and B19 read 61-62
        in 3685 of 3688 captures (about 4.9 V at the same scale, probably a regulated sensor
        supply). B15, B17 and B20 sit at 246-249 in every capture, i.e. open inputs. B05-B07, B09,
        B21, B22 and B25 are constant.
      parameters:
        BCM_12V_BATTERY:
          expression: "B10*0.08"
          unit: "V"
          display: ""
          ha_class: voltage
          min: "0"
          max: "20"
          source: "Reverse engineered from monitor drift analysis"
          source_links: []
          verified: true
          notes: >-
            Scale estimated from one reading: raw 149 = 11.92 V against the WiCAN's own 12.1 V.
        BCM_AMBIENT_LIGHT:
          expression: B12
          unit: ""
          display: ""
          ha_class: ""
          min: "0"
          max: "255"
          source: "RE 2026-10-22: B12 by hour of day across 2026-04-15..2026-10-22"
          source_links: []
          verified: false
          notes: >-
            Raw count, higher = brighter. 9-55 in every session after 20:00 and at 08:28 on
            2026-08-05; 245-246 (ceiling) in daylight; 51-246 while parked charging 12:31-15:30 on
            2026-08-05. Ceiling in daylight fits an auto-headlight sensor. No HVAC byte tracks it
            (|r| <= 0.32). Auto-on threshold not captured (no AUTO-in-dark data).
          enabled: false
        BCM_IGN_SUPPLY_V:
          expression: B28*0.08
          unit: V
          min: "0"
          max: "20"
          source: RE 2026-08-02 state discrimination; ignition cross-tab 2026-10-22
          verified: false
          notes: >-
            Ignition-switched supply at the BCM. 0 in 2779 of 3688 captures; when on it reads 1-3
            counts above BCM_12V_BATTERY. Equals IGPM ACC2_IGN_ON (on/off) in all 356 aligned rows,
            and is on in all 612 CHARGING+ON rows with the drive path down, so it follows the
            ignition, not READY. B23, B26 and B27 read the same within 1-3 counts. Not seen in ACC,
            so none of the four is the ACC input. The BCM connector has IGN1 (pin D2), IGN2 (D23),
            ACC (D24) and two IG2 heated-steering supplies (D3, D4); which of B23/B26/B27/B28 is
            which is not known. Taken from US-market wiring; unconfirmed on the EU car.
        BCM_LIGHT_SW_ADC:
          expression: B14
          min: "0"
          max: "255"
          source: "RE 2026-10-22: B14 levels vs 22B005 B10 bits 5-7 and IGPM 22BC03 lamp outputs"
          verified: false
          notes: >-
            Discrete levels with +-1 LSB flicker, read as a resistor-ladder light-stalk input: ~249
            OFF, ~211 lamps on, 101 AUTO (2026-10-22, stalk confirmed AUTO). Same partition as
            BCM_LIGHT_SW_* on 22B005 in every co-polled session. Parking-light level not captured.
        BCM_TEMP_RAW_B13:
          expression: B13
          min: "0"
          max: "255"
          source: "RE 2026-10-22: B13 vs HVAC_INTERIOR_TEMP, 2026-04-15..2026-10-22"
          verified: false
          notes: >-
            Raw count, falls as temperature rises (NTC-like). Against HVAC_INTERIOR_TEMP, excluding
            dropouts: B13 ~ 224.2 - 2.26 x cabin degC, r=-0.955, n=830, cabin 9-38.5 degC. 112-203
            overall; 201-203 at 9 degC on 2026-10-22, 169 -> 136 as the cabin went 26 -> 38.5 degC
            on 2026-08-02. Isolated single-sample drops to 62 (22 of 3676), read as an invalid-value
            marker. Sensor location unknown: lags cabin air, may be BCM board temperature.
        BCM_IGN_SUPPLY_V_B23:
          expression: B23*0.08
          unit: V
          min: "0"
          max: "20"
          source: Same-payload cross-tab 2026-10-22
          verified: false
          notes: >-
            0 in exactly the same 2779 of 3688 captures as BCM_IGN_SUPPLY_V (B28), within 1-3 counts
            of it otherwise. A second ignition-switched input; disabled as a duplicate.
          enabled: false
        BCM_IGN_SUPPLY_V_B26:
          expression: B26*0.08
          unit: V
          min: "0"
          max: "20"
          source: Same-payload cross-tab 2026-10-22
          verified: false
          notes: >-
            0 in exactly the same 2779 of 3688 captures as BCM_IGN_SUPPLY_V (B28), within 1-3 counts
            of it otherwise. A second ignition-switched input; disabled as a duplicate.
          enabled: false
        BCM_IGN_SUPPLY_V_B27:
          expression: B27*0.08
          unit: V
          min: "0"
          max: "20"
          source: Same-payload cross-tab 2026-10-22
          verified: false
          notes: >-
            0 in exactly the same 2779 of 3688 captures as BCM_IGN_SUPPLY_V (B28), within 1-3 counts
            of it otherwise. A second ignition-switched input; disabled as a duplicate.
          enabled: false
        BCM_B003_B18:
          expression: B18
          min: "0"
          max: "255"
          source: "RE 2026-10-22: B18 by session, 2026-04-15..2026-10-22"
          verified: false
          notes: >-
            Analog input that holds one of three bands for days: 246-248 (open circuit, like
            B15/B17/B20) on 2026-04-15..04-20, 07-21, 07-24..07-30 and 10-21..10-22; 109-136 with
            +-10 count noise on 07-22 and 08-01..08-15 09:10; 158-159 from 08-15 10:03. Never
            changes band within a session. 22B004 BCM_B004_B12_5 is 1 exactly when B18 is in the
            109-136 band (959 of 959 aligned rows). No correlation with temperature, light or 12 V.
            Meaning unknown.
    # ─── TPMS configuration DIDs (22C001-C014) ───────────────────────────
    # Static TPMS sensor registration, IDs, and configuration data.
    # C00B (above) has live tyre pressure/temp readings.
    22C001:
      status: ignored
      vehicle_states: [ALL]
      notes: >
        34 bytes. Contains 4× C0F8-prefixed TPMS receiver addresses — one per wheel.
        Static configuration. Sample: 62C001FFFF000001C0F80410C0F80BD2C0F81174C0F81188AAAA.
      parameters: {}

    22C002:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        27 bytes as stored, probably 23 plus four 0xAA of frame padding (only old, padded reads
        exist). Same C0F8 addresses as C001 but in different order — wheel-to-receiver mapping
        table. Sample: 62C002FFFF0000C0F81174C0F80410C0F80BD2C0F81188AAAAAAAA.
      parameters: {}

    22C003:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        34 bytes as stored, probably 33 plus one 0xAA of frame padding (only old, padded reads
        exist). TPMS sensor registration for wheel 1. ASCII 'DO01' at offset 7. Contains pressure
        limits, sensor ID, calibration data. Sample:
        62C00300000000444F303101002E2E02500706B5B50A098C3C0000000001FF0100AA.
      parameters: {}

    22C004:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        34 bytes as stored, probably 33 plus one 0xAA of frame padding (only old, padded reads
        exist). TPMS sensor registration for wheel 2. ASCII 'NA01'. Sample:
        62C004000000004E41303101002E2E024B0005B5B508088C3C0100000001FF0100AA.
      parameters: {}

    22C005:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        34 bytes as stored, probably 33 plus one 0xAA of frame padding (only old, padded reads
        exist). Spare/reference TPMS sensor. ASCII 'NTPM'. Sample:
        62C005000000004E54504D0100302F02500000ABAB00008C3C0000030001FF0000AA.
      parameters: {}

    22C006:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        34 bytes as stored, probably 33 plus one 0xAA of frame padding (only old, padded reads
        exist). TPMS sensor registration for wheel 3. ASCII 'DO02'. Sample:
        62C00600000000444F303201002E2E02500706B5AB0A098C3C0000000001010100AA.
      parameters: {}

    22C007:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        34 bytes as stored, probably 33 plus one 0xAA of frame padding (only old, padded reads
        exist). TPMS sensor registration for wheel 4. ASCII 'NA02'. Sample:
        62C007000000004E41303201002E2E024B0005B5AB08088C3C0100000001010100AA.
      parameters: {}

    22C008:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        34 bytes as stored, probably 33 plus one 0xAA of frame padding (only old, padded reads
        exist). Empty TPMS slot (all FF after ASCII '0005'). Sample:
        62C00800000000303030350000FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFAA.
      parameters: {}

    22C009:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        34 bytes as stored, probably 33 plus one 0xAA of frame padding (only old, padded reads
        exist). Empty TPMS slot (ASCII '0006'). Sample:
        62C00900000000303030360000FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFAA.
      parameters: {}

    22C00A:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        34 bytes as stored, probably 33 plus one 0xAA of frame padding (only old, padded reads
        exist). Empty TPMS slot (ASCII '0007'). Sample:
        62C00A00000000303030370000FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFAA.
      parameters: {}

    22C00C:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        37 bytes. Extended TPMS data — wheel 1 has live data with C0F8 address, other slots empty
        (FFFF). May contain per-wheel signal quality or sensor history. Sample:
        62C00CFFFF030001C0F8117499434119180000000000FFFF000000000000...
      parameters: {}

    22C00D:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        37 bytes. Extended TPMS data — all slots empty (FFFF/zeros). Sample:
        62C00DFFFF03000000000000FFFF0000000000000000FFFF000000...
      parameters: {}

    22C00E:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        37 bytes. Extended TPMS data — all slots empty. Sample:
        62C00EFFFF03000000000000FFFF0000000000000000FFFF000000...
      parameters: {}

    22C00F:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        37 bytes. Extended TPMS data — one active entry with C0F8 address (C0F81188). Sample:
        62C00FFFFF030001C0F8118801203B1E560000000000FFFF000000...
      parameters: {}

    22C010:
      status: ignored
      vehicle_states: [ALL]
      notes: "8 bytes. Mostly zeros. B03=0xFC. Purpose unknown. Sample: 62C010FC00000000."
      parameters: {}

    22C011:
      response_frames: 2
      status: draft
      vehicle_states: [ALL]
      notes: >-
        12 bytes. B10:0 the ignition (BCM_IGN_ON_C011), B11 the 12 V bus (BCM_12V_BUS_C011), B13:B14
        BCM_EVENT_COUNTER_C011. B12 takes all 256 values, with no relation between reads 3 s apart:
        random, not a counter or a signal.
      parameters:
        BCM_12V_BUS_C011:
          expression: B11/12.8
          unit: V
          min: "0"
          max: "20"
          source: RE 2026-08-05 cross-PID mirror vs the verified BCM 22B003 BCM_12V_BATTERY
          verified: true
          notes: >-
            B11 is exactly 12.8 x BCM_12V_BATTERY in 1781 of 1965 co-polled rows. 12.66 V at rest,
            14.53 V during AC charging. Disabled as a duplicate of the 22B003 signal.
          enabled: false
        BCM_EVENT_COUNTER_C011:
          expression: "[B13:B14]"
          unit: ""
          min: "0"
          max: "65535"
          source: monotonic-counter sweep of all captures 2026-04-16..2026-08-05
          verified: false
          notes: >-
            16-bit big-endian. Only rises (9835 to 10113), flat within every recording session,
            about 2.3 steps a day. Not a timer. What it counts is unknown.
        BCM_IGN_ON_C011:
          expression: B10:0
          min: "0"
          max: "1"
          source: Ignition cross-tab 2026-10-22
          verified: false
          notes: >-
            1 in 703 of 3760 captures. Equals IGPM ACC2_IGN_ON and BCM_IGN_SUPPLY_V in every aligned
            row (kappa 1.00), including ignition-on rows with the drive path down, so it follows the
            ignition, not READY. Disabled as a duplicate.
          enabled: false

    22C012:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        11 bytes. ASCII 'DO01' at B07-B10 — references wheel 1 sensor ID. Sample:
        62C01280000000444F3031.
      parameters: {}

    22C013:
      status: ignored
      vehicle_states: [ALL]
      notes: >
        13 bytes. ASCII '0x0620' — possibly TPMS firmware version or config revision.
        Sample: 62C01380000000307830363230.
      parameters: {}

    22C014:
      status: ignored
      vehicle_states: [ALL]
      notes: >-
        8 bytes. B10=0x0C. Purpose unknown — last responding DID in C0xx range. Sample:
        62C014F00000000C.
      parameters: {}

