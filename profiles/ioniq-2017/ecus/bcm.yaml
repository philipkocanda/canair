      parameters: {}

    22B009:
      response_frames: 2
      status: draft
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      notes: >-
        11 bytes. Repeating 0xFEEE pattern (B03-B06) — possibly sensor addresses or calibration
