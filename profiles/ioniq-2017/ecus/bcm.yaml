      parameters: {}

    22C008:
      status: ignored
      vehicle_states: [SLEEP, PLUGGED, ACC, ACC2, READY, CHARGING]
      notes: >-
        34 bytes as stored, probably 33 plus one 0xAA of frame padding (only old, padded reads
