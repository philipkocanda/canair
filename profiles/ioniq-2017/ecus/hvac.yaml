  research:
    - type: iocontrol_scan
      target: "2F F000-F0FF"
      status: done
      date: "2026-04-19"
      priority: P1
      vehicle_states: [ACC, CHARGING]
      result: >
        13 DIDs respond to ReturnControlToECU (00): F011, F013-F018, F022-F027.
        F012 accepts ShortTermAdjustment (03) but rejects ReturnControlToECU (00).
        All return 6F{DID}0000 (5 bytes). Gaps at F012 (exists for 03 but not 00),
        F019-F021. ShortTermAdjustment (03) accepted but requires value bytes —
        NRC 0x13 without them. Ranges E0xx, B0xx, C0xx, 01xx, F1xx, 00xx all
        NRC 0x31 (empty).
      notes: >
        Two groups: F011-F018 (7 DIDs, gap at F012) and F022-F027 (6 DIDs).
        F028-F0FF not yet scanned. Value byte format unknown — need to test
        with TUI v-key (ShortTermAdjustment with user-provided values).
    - type: verify
      target: "220100"
      status: done
      priority: P1
      vehicle_states: [ACC]
      updated: "2026-08-01"
      notes: >-
        CLOSED 2026-08-01 — the Ioniq-5-ported hypotheses are disproven on the 2017 Ioniq
        220100: B15 is not an inverter temp ((B15/2)-40 gives no sensible temperature; B15 is
        a high-variance 16-239 byte, kept as HVAC_UNKNOWN_B15); no vehicle-speed byte at
        bix 232 / B29 (B28-B31 are FF-padding); B34 is HVAC_HEAT_DEMAND, not a temperature.
        Remaining 220100 unknowns (B14/B34/B35, B15/B17) are tracked in the P3 decode items.
      sources:
        - "OBDb Ioniq 5 — 220100 signals (did not port to the 2017)"
    - type: scan
      target: "22 0100-010B"
      status: done
      priority: P1
      vehicle_states: [ACC]
      notes: >
        Scanned 2026-04-19. Service 0x21 for 0101-010B: all NRC 0x11.
        Service 0x22 for 0101-010B: only 0102 responds (already known),
        0101 and 0103-010B all NRC 0x31. HVAC ECU only has 220100 and
        220102 in the 01xx range. ChatGPT suggestions for 0105-010B were
        incorrect for Ioniq 2017.
    - type: decode
      target: "climate power (console split)"
      status: captured
      priority: P2
      vehicle_states: [READY]
      result: >-
        2026-10-21, with the BMS pack current fixed: parked in READY, pack power minus
        VCU_AUX_POWER/0.9 leaves a 0.02-0.08 kW baseline with climate off, and during heating it
        equals HVAC_HEAT_POWER (median ratio 0.99, r=0.88, n=129 heating rows). So B42/10 is the
        whole HV climate draw at 0.1 kW/bit. Heat-pump sessions run the compressor and B42 together,
        and there is no cooling-only or PTC-only session with BMS and VCU co-polled, so the
        compressor and PTC shares cannot be separated yet.
      notes: >-
        Console Drive/Climate/Electronics power split. RESOLVED (heating): the HEATING climate
        power is broadcast on HVAC 2201A2 B42 (HVAC_HEAT_POWER, ~0.1 kW/LSB) — r=0.956 vs pack
        BATTERY_POWER over the 2026-07-26 heater-high session (n=152), fan-independent, 0 when
        climate off. (The earlier 2026-07-22 "no wattage byte" conclusion was wrong-scope: only
        220100/220102 were checked and the small n=35 PTC session buried B42 at r=0.60.) Dash
        split: motor = HV drive; climate = HV compressor+PTC (the B42 heating term); aux/electronics
        = VCU_AUX_POWER (12V, independent of the HV climate load, r=-0.09 vs BATTERY_POWER — NOT
        climate). COOLING term candidate (2026-08-01): 2201A2 B41 (HVAC_COOL_LOAD_B41) responds to AC
        cooling (rises to 50-60, baseline ~20; 2026-07-21) but is NOT a clean cooling-only term —
        a canair align time-series shows B41 sits at baseline ~20 at idle in BOTH modes and stays
        ~10-20 during heating (does not elevate), so the cooling term is still not cleanly pinned
