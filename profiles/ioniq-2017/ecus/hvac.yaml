# ─── HVAC (Heating, Ventilation, Air Conditioning) ────────────────────
HVAC:
  tx_id: 0x7B3
  can_bus: [P-CAN]
  iocontrol_scan_ranges: [F000-FFFF]
  identity:
    alias: DATC  # Dual Automatic Temperature Control
    description: Climate Control
    part_number: "97250-G7060"
    mfg_date: "2017-05-30"
    firmware: "AE_EV DATC(-)1.0"
    fw_version: "1.03"
    id_protocol: UDS  # F1xx
    serial: "1705304705"
    notes: >-
      Climate control unit (DATC — Dual Automatic Temperature Control). Live data is only on service
      22 DIDs 0100, 0102 and 01A0-01A6; service 21 is not supported (NRC 0x11). Supplied by battery,
      the ON line (IGN2) and IG3; there is no ACC feed. The electric compressor and PTC heater sit
      on a small separate CAN bus with the DATC, not on the P-CAN.
  vehicle_states: [ACC, ACC2, READY]
  scan_log: # HVAC
    - service: 0x31
      range: "E000-E0FF"
      date: 2026-04-20
      hits: 0
      probes: 256
      vehicle_states: [SLEEP]
      notes: "256 errors — no response without ignition"
    - service: 0x21
      range: "01-10"
      date: 2026-04-17
      hits: 0
      vehicle_states: [ACC]
    - service: 0x22
      range: "0100-01FF"
      date: 2026-04-17
      hits: 9
      vehicle_states: [ACC]
      notes: "0100, 0102 and 01A0-01A6 respond."
    - service: 0x22
      range: "E000-E020"
      date: 2026-04-17
      hits: 0
      vehicle_states: [ACC]
    - service: 0x21
      range: "01, F2"
      date: 2026-10-22
      hits: 0
      probes: 2
      vehicle_states: [READY]
      notes: "Both NRC 0x11 (serviceNotSupported), as 21F2 was on 2026-07-29."
    - service: 0x10
      range: "01, 03"
      date: 2026-10-22
      hits: 2
      probes: 2
      vehicle_states: [READY]
      notes: "Default (01) and extended (03) diagnostic sessions supported."
    - service: 0x22
      range: "0100-01FF"
      date: 2026-10-22
      hits: 9
      probes: 256
      vehicle_states: [READY]
      notes: >-
        In the extended session (10 03): the same nine DIDs as in the default session. 01A5 and
        01A6 returned only 2 bytes in this sweep.
    - service: 0x22
      range: "0000-00FF, 0200-02FF, 1000-10FF, B000-B1FF, C000-C1FF, D000-D0FF, E000-E1FF,
        F000-F0FF, F200-F2FF"
      date: 2026-10-22
      hits: 0
      probes: 3072
      vehicle_states: [READY]
      notes: "Default session; every DID returned an NRC."
  # ─── 2026-07-22 read-DID (service 22) sweep, car in READY (parked) ───
  # Goal: find live-data DIDs on ECUs previously only identity-scanned.
  # Ranges tried per ECU noted below. All responses were NRC (alive, no such DID)
  # unless a hit is listed. Powertrain 22-DID probes are logged in each ECU's research:.
  pids:
    220100:
      response_frames: 6
      status: active
      period: 30000
      vehicle_states: [ACC, ACC2, READY]
      notes: >-
        38-byte response (35 data bytes after the DID) of sensor and actuator status; set
        temperature, fan level, mode and recirculation do not appear here. Constant in all 1758
        captures: B5=0x7E, B6=0x50, B7=0x07, B9=0xC8, and 0xFF at B10, B18, B19, B21, B23, B25-B31,
        B33, B39, B41, B43 and B44. B20 is 16-240 (r=+0.49 vs blower). B38 is 0 in 1681 captures;
        B42 reads 0 or 1. 2201A3 B33-B36 and B41 carry copies of B15, B22, B17, B20 and B34.
      parameters:
        HVAC_INTERIOR_TEMP:
          expression: (B11/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Original WiCAN config"
          verified: true
          notes: >-
            Cabin air temperature. 9.5-38.5 °C across 1758 captures. 2201A0 B14 is a copy.
        HVAC_AAT:
          expression: (B12/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Original WiCAN config"
          verified: true
          notes: >-
            Ambient air temperature at the HVAC sensor. 8-31.5 °C across 1758 captures. 2201A0 B17
            is a copy.
        HVAC_HEAT_PUMP_TEMP:
          expression: (B13/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Original WiCAN config"
          verified: true
          notes: >-
            Refrigerant-circuit temperature, 2.5-32.5 °C across 1758 captures. Fell from 27.5 to
            6 °C within a minute of the A/C starting (2026-07-21); 6-21.5 °C during heat-pump
            heating. Which sensor is unknown.
        HVAC_UNKNOWN_B15:
          expression: B15
          unit: ""
          min: "0"
          max: "255"
          source: canair investigate/correlate 2026-08-02; HVAC audit 2026-10-22
          verified: false
          notes: >-
            16-239 across 1758 captures. 235-239 with the compressor off: fan only at 12 °C
            ambient (2026-04-19), resistive-heater preconditioning (2026-08-08), 2026-10-22. Fell
            from 113 to 44 in the first minute of A/C cooling (2026-07-21). r=+0.42 vs
            HVAC_HEAT_PUMP_ON, -0.74 vs HVAC_AAT (n=1420).
        HVAC_UNKNOWN_B17:
          expression: B17
          unit: ""
          min: "0"
          max: "255"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: 16-240 across 1758 captures, 21 distinct values. Not a mirror of B15.
        HVAC_UNKNOWN_B22:
          expression: "B22"
          unit: ""
          min: "0"
          max: "255"
          source: "Monitor session 2026-04-17; HVAC audit 2026-10-22"
          verified: false
          notes: >-
            13-240 across 1758 captures, mostly 16 (873) and 239 (492). Stayed at 16-17 through
            A/C on and off on 2026-07-21.

        HVAC_DUCT_TEMP_1:
          expression: (B36/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Name is unconfirmed. 7.5-66 °C across 1758 captures; 63.5-66 °C during heat-pump
            heating at a 30 °C set point (2026-07-22), 13-27.5 °C under A/C (2026-07-21).
        HVAC_DUCT_TEMP_2:
          expression: (B37/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Name is unconfirmed. 8-61 °C across 1758 captures; 55-57.5 °C during heat-pump heating
            at a 30 °C set point (2026-07-22), 15.5-26.5 °C under A/C (2026-07-21).
        HVAC_UNKNOWN_B34:
          expression: B34
          min: "0"
          max: "100"
          source: coverage analysis 2026-07-23; HVAC audit 2026-10-22
          verified: false
          notes: >-
            0-78 across 1758 captures. r=-0.17 vs HVAC_AAT, -0.40 vs HVAC_INTERIOR_TEMP, +0.19 vs
            blower (n=1420).
          enabled: true
        HVAC_UNKNOWN_B14:
          expression: B14
          min: "0"
          max: "59"
          source: coverage analysis 2026-07-23
          verified: false
          notes: 0-59 across 1758 captures. r=-0.70 vs 2201A0 B5 (n=1420).
          enabled: true
        HVAC_UNKNOWN_B35:
          expression: B35
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: 70-246 across 1758 captures. r=-0.54 vs blower fan feedback (n=1420).
          enabled: true
    220102:
      response_frames: 3
      status: active
      period: 10000
      vehicle_states: []
      notes: >-
        16-byte response (13 data bytes after the DID) of secondary temperatures and the heat-pump
        flag. Constant in all 950 captures: B5=0xFF, B6=0x80, and 0x00 at B7, B9, and B14.
      parameters:
        HVAC_HEAT_EXCHANGER_TEMP:
          expression: (B10/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Name is unconfirmed. 8.5-79 °C across 950 captures. Rose from 24 to 57 °C during A/C
            cooling (2026-07-21).
        HVAC_HEAT_EXCHANGER_TEMP_2:
          expression: (B11/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: Name is unconfirmed. 8-45.5 °C across 950 captures.
        HVAC_HEAT_PUMP_ON:
          expression: "B17"
          unit: ""
          min: "0"
          max: "1"
          source: >-
            Monitor session 2026-04-17; heat-pump vs PTC 2026-07-22; A/C cooling 2026-07-21
          verified: true
          notes: >-
            1 exactly when 2201A0 HVAC_HEAT_MODE is 2, heat pump (all 1420 time-joined rows); 1 in
            127 of 950 captures. 0 throughout A/C cooling with the compressor running
            (2026-07-21), so it does not indicate the compressor in cooling.

        HVAC_HEAT_PUMP_ON_MIRROR_B18:
          expression: "B18"
          unit: ""
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            0/1. Agrees with HVAC_HEAT_PUMP_ON in 915 of 950 captures; 1 in 152, against 127.

        HVAC_HOTSIDE_TEMP:
          expression: B19
          unit: "°C"
          ha_class: temperature
          min: "0"
          max: "127"
          source: "Monitor session 2026-04-17; reclassified 2026-07-20"
          verified: false
          notes: >-
            Raw byte in °C, 16-82 across 950 captures. r=+0.80 vs HVAC_HEAT_EXCHANGER_TEMP, -0.46
            vs HVAC_HEAT_PUMP_TEMP (n=1420). Which sensor is unknown.
        HVAC_HEAT_PUMP_ON_MIRROR_B12:
          expression: B12
          source: coverage analysis 2026-07-23
          verified: false
          notes: >-
            0/1, equal to B13 and B15 in every capture. Agrees with HVAC_HEAT_PUMP_ON in 945 of 950
            captures; 1 in 122, against 127.
          enabled: true
          min: "0"
          max: "1"
    2201A0:
      response_frames: 9
      status: active
      period: 10000
      vehicle_states: [ACC, ACC2, READY]
      notes: >-
        59-byte response (56 data bytes after the DID): set temperature, heating source, blower
        feedback, air-door positions and temperature copies. Copies of other bytes: B10 = B9, B20 =
        B19, B45 = B44, B51 = B6 and B52 = B7 in every capture; B14 = 220100 B11 and B17 = 220100
        B12 in over 98 % of time-joined rows. Constant in all 2256 captures: B28=0x28, B39=0x0A,
        B42-B43=0xFF, and 0x00 at B22, B54, B57, B58, B61-B63, and B65. B21 reads 0, 90 or 96, and
        B23 is 0 exactly when B21 is non-zero (one exception).
      parameters:
        HVAC_SET_TEMP_DRIVER:
          expression: "B44"
          unit: "°C"
          display: "f'{v} °C'"
          min: "15"
          max: "32"
          source: "Monitor session 2026-04-17"
          verified: true
          notes: "Set temperature in °C: 15, 20 and 30 matched the console exactly."

        HVAC_SET_TEMP_PASSENGER:
          expression: "B45"
          unit: "°C"
          display: "f'{v} °C'"
          min: "15"
          max: "32"
          source: "Monitor session 2026-04-17"
          verified: true
          notes: Equals HVAC_SET_TEMP_DRIVER in every capture (single-zone car).

        HVAC_A0_UNKNOWN_B23:
          expression: "B23"
          unit: ""
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17; HVAC audit 2026-10-22"
          verified: false
          notes: >-
            0/1. 0 exactly when B21 is non-zero (one exception in 2256 captures): throughout the
            2026-04-17 tests, including heat-pump heating at a 30 °C set point, and during the
            2026-08-08 preconditioning until 08:30:03. 1 in every other session.

        HVAC_A0_UNKNOWN_B25:
          expression: "B25"
          unit: ""
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17; HVAC audit 2026-10-22"
          verified: false
          notes: >-
            0/1. 1 in 372 of 375 resistive-heating rows and in every heat-pump row; with no heating
            it reads 0 in 1534 rows and 1 in 217 (time-joined against HVAC_HEAT_MODE).

        HVAC_HEAT_MODE:
          expression: B06
          unit: ""
          min: "0"
          max: "2"
          source: 2026-07-26 heater-high session (regime split vs HVAC_HEAT_PUMP_ON)
          verified: false
          notes: >-
            Heating source: 0 off, 1 resistive heater (PTC), 2 heat pump. 2 exactly when 220102
            HVAC_HEAT_PUMP_ON is 1. On 2026-07-26 it went 0, 1 (1.1-1.5 kW, compressor off), 2 (up
            to 4.5 kW) at 22 °C ambient. Reads 1 during preconditioning at 13.5 °C (2026-08-08)
            and at 8 °C ambient (2026-10-22). Copied at B51, 2201A1 B21 and 2201A2 B19.
          type: enum
          values:
            0: "off"
            1: ptc_resistive
            2: heat_pump

        HVAC_DEFROST_FLAGS:
          expression: (B58 << 8) | B59
          unit: ""
          display: "f'0x{v:04X}'"
          min: "0"
          max: "65535"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Reads 0x0000, or 0x00FF in 40 of 2256 captures (the 2026-04-17 defogger test and
            2026-07-21). B58 is 0 in every capture. Bits not decoded.
        HVAC_ACTUATOR_TARGET_1:
          expression: B5
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23; mode-cycle capture 2026-07-26
          verified: false
          notes: >-
            Air-door position, 2-209 across 2256 captures. Moves with B9 and B11 (r >= 0.995,
            n=1420) at an offset that differs between sessions. r=+0.51 vs B7.
          enabled: true
        HVAC_ACTUATOR_TARGET_2:
          expression: B7
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23; mode-cycle capture 2026-07-26
          verified: false
          notes: >-
            Mode door position, by direction at 21 °C (2026-07-26): face about 122, face and legs
            137-157, floor about 230, floor and windshield about 237; repeats vary by about 20.
            Copied at B52; 2201A1 B22 and 2201A2 B20 follow it (r=+0.998 and +0.999).
          enabled: true
        HVAC_ACTUATOR_TARGET_3:
          expression: B9
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: 1-218 across 2256 captures. B10 equals B9 in every capture.
          enabled: true
        HVAC_ACTUATOR_TARGET_4:
          expression: B11
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: 6-221 across 2256 captures.
          enabled: true
        HVAC_AAT_MIRROR_B17:
          expression: (B17/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: HVAC audit 2026-10-22 (time-joined against 220100)
          verified: false
          notes: Equals 220100 HVAC_AAT in 1418 of 1420 time-joined rows.
          enabled: true
        HVAC_INTERIOR_TEMP_B13:
          expression: (B13/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: HVAC audit 2026-10-22 (time-joined against 220100)
          verified: false
          notes: >-
            Within 1.5 °C of 220100 HVAC_INTERIOR_TEMP in 1329 of 1420 time-joined rows; r=+0.98.
            B14 equals HVAC_INTERIOR_TEMP in 1405.
          enabled: true
        HVAC_AAT_B15:
          expression: (B15/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: HVAC audit 2026-10-22 (time-joined against 220100)
          verified: false
          notes: >-
            0-4 °C above 220100 HVAC_AAT in 1190 of 1420 time-joined rows (range -0.5 to +9 °C);
            r=+0.89 vs HVAC_AAT.
          enabled: true
        HVAC_A0_UNKNOWN_B47:
          expression: B47
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23; HVAC audit 2026-10-22
          verified: false
          notes: >-
            227 distinct values (0-255) across 2256 captures; consecutive samples mostly differ by 0
            or a few counts. No correlation found.
          enabled: true
        HVAC_A0_UNKNOWN_B50:
          expression: B50
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23; HVAC audit 2026-10-22
          verified: false
          notes: >-
            250 distinct values (0-255) across 2256 captures; consecutive samples mostly differ by 0
            or a few counts. No correlation found.
          enabled: true
        HVAC_BLOWER_FAN_SPEED:
          expression: B18
          min: "0"
          max: "121"
          source: HVAC fan-only + fan 1->MAX->1 sweep captures 2026-07-26
          verified: true
          notes: >-
            Blower speed feedback. A fan 1-to-MAX sweep (2026-07-26) gave plateaus 40, 52, 65, 77,
            90, 102, 111 and 121 for levels 1-8. Values between plateaus appear when vent or
            recirculation changes alter the airflow load. Read 95-100 during the 2026-08-08
            preconditioning.
          type: enum
          values:
            40: Fan 1
            52: Fan 2
            65: Fan 3
            77: Fan 4
            90: Fan 5
            102: Fan 6
            111: Fan 7
            121: Fan 8 (MAX)
        HVAC_PRECONDITIONING_ACTIVE:
          expression: B41
          min: "0"
          max: "1"
          source: preconditioning session 2026-08-08 vs all other HVAC captures
          verified: false
          notes: >-
            1 in all 368 captures of the 2026-08-08 preconditioning session, including after B23
            went to 1 at 08:30; 0 in every other capture, including 2026-10-22 with the
            preconditioning timer armed but not running.
    2201A1:
      response_frames: 9
      status: draft
      vehicle_states: [ACC, ACC2, READY]
      notes: >-
        59-byte response (56 data bytes after the DID). B6, B9 and B11 change fast. B21 equals
        2201A0 B6 (heat mode) in 1419 of 1420 time-joined rows and B22 follows 2201A0 B7
        (r=+0.998). B12 and B13 read 1 except in 26 (all 2026-04-17) and 71 of 1657 captures.
        B14 is 0 in every capture; B15 reads 120 in 1500 of 1657. B68 reads 5 at fan 1-2 and
        mostly 10 at fan 3-8.
      parameters: {}

    2201A2:
      response_frames: 8
      status: draft
      notes: >-
        51-byte response (48 data bytes after the DID), mostly 16-bit words. B19 equals 2201A0 B6
        (heat mode) in 1419 of 1420 time-joined rows and B20 follows 2201A0 B7 (r=+0.999). Constant
        in all 1499 captures: B45=0xFF, B46=0xD8, and 0x00 at B10, B30, B35, B37, B39, B43, B55, B58
        and B59.
      vehicle_states: [ACC, ACC2, READY]
      parameters:
        HVAC_HEAT_POWER:
          expression: B42/10
          unit: kW
          min: "0"
          max: "12"
          source: >-
            2026-07-26 heater-high + 2026-07-22 heat-pump sessions vs BMS BATTERY_POWER; pack minus
            LDC residual 2026-10-21
          verified: true
          notes: >-
            High-voltage heating draw (resistive heater and heat pump), 0.1 kW per bit. Parked in
            READY it equals pack power minus the LDC input (median ratio 0.99, r=0.88, n=129
            heating rows, 2026-10-21); r=0.956 vs BMS BATTERY_POWER on 2026-07-26 (n=152,
            0.25-4.39 kW); read 13 at about 1.2 kW on the console. 0 with climate off and during
            A/C cooling (2026-07-21).
        HVAC_COOL_LOAD_B41:
          expression: B41
          min: "0"
          max: "255"
          source: 2026-07-21 AC-cooling + 2026-07-26 heating (align time-series)
          verified: false
          notes: >-
            10-60 across 1499 captures. About 20 at idle and in heat-pump heating, 10-15 in
            resistive heating. 50-60 during A/C cooling (2026-07-21), back to 20 within 5 s of the
            A/C switching off at 12:22:46.
        HVAC_HEAT_LOAD_B17:
          expression: B17
          unit: A
          min: "0"
          max: "255"
          source: 2026-07-26 heater-high vs 2026-07-21 cooling
          verified: false
          notes: >-
            0-11 across 1499 captures; r=+0.97 vs HVAC_HEAT_POWER (n=1420), reading 9-11 at
            4.0-4.5 kW. 0 during A/C cooling. The ampere unit is not confirmed.
        HVAC_A2_UNKNOWN_B44:
          expression: B44
          min: "0"
          max: "255"
          source: 2026-07-21 cooling + 2026-07-26 heating; HVAC audit 2026-10-22
          verified: false
          notes: >-
            8-49 across 1499 captures. r=+0.68 vs 220102 HVAC_HEAT_EXCHANGER_TEMP, -0.20 vs
            HVAC_HEAT_PUMP_TEMP (n=1420).
    2201A3:
      response_frames: 8
      status: draft
      vehicle_states: [ACC, ACC2, READY]
      notes: >-
        53-byte response (50 data bytes after the DID). B33, B34, B35, B36 and B41 carry 220100 B15,
        B22, B17, B20 and B34 (equal in 91-98 % of time-joined rows). B15 is non-zero (48-58) in
        heat-pump mode and 0 otherwise (two exceptions in 2011 time-joined rows). B50:B51 and
        B52:B53 are big-endian words 30 apart, constant within a session (700/730 in most, 640/670
        on 2026-10-22). Constant in all 2015 captures: 0xFF at B10-B13, 0x00 at B14, B26, B37, B38,
        B47, B54, B60 and B61.
      parameters: {}

    2201A4:
      status: ignored
      notes: >-
        Not a fixed page: polled after 2201A3 it returned 2201A3's bytes (2026-07-27); read on
        its own on 2026-10-22 it returned 220100's data bytes under its own DID.
      vehicle_states: [ACC, ACC2, READY]
      parameters: {}

    2201A5:
      status: ignored
      notes: >-
        Not a fixed page: polled after 2201A3 it returned 2201A3's bytes (2026-07-27); read on
        its own on 2026-10-22 it returned 220100's data bytes under its own DID.
      vehicle_states: [ACC, ACC2, READY]
      parameters: {}

    2201A6:
      status: ignored
      notes: >-
        Not a fixed page: polled after 2201A3 it returned 2201A3's bytes (2026-07-27); read on
        its own on 2026-10-22 it returned 220100's data bytes under its own DID.
      vehicle_states: [ACC, ACC2, READY]
      parameters: {}
    21F2:
      status: ignored
      vehicle_states: [READY, CHARGING]
      notes: >-
        Answers 7F 21 11 (service not supported) at READY (2026-07-29 and 2026-10-22), as does
        2101: HVAC does not support service 21.
  iocontrol:
    F011:
      label: "Unknown actuator 1"
      verified: false
      true: ""
      false: "2FF01100"
      hold: false
      notes: >
        updated via TUI test
