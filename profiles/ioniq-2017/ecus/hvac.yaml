# ─── HVAC (Heating, Ventilation, Air Conditioning) ────────────────────
HVAC:
  tx_id: 0x7B3
  can_bus: [P-CAN]
  iocontrol_scan_ranges: [F000-FFFF]
  identity:
    alias: DATC  # Digital Automatic Temperature Control
    description: Climate Control
    part_number: "97250-G7060"
    mfg_date: "2017-05-30"
    firmware: "AE_EV DATC(-)1.0"
    fw_version: "1.03"
    id_protocol: UDS  # F1xx
    serial: "1705304705"
    notes: >
      Climate control unit (DATC — Digital Automatic Temperature Control).
      Exposes climate/compressor live data via service 22 (e.g. 220102).
  vehicle_states: [ACC, ACC2, READY]
  scan_log: # HVAC
    - service: 0x31
      range: "E000-E0FF"
      date: 2026-04-20
      hits: 0
      probes: 256
      vehicle_states: [SLEEP]
      notes: "256 errors — likely no service 31 support without ignition"
  # ─── 2026-07-22 read-DID (service 22) sweep, car in READY (parked) ───
  # Goal: find live-data DIDs on ECUs previously only identity-scanned.
  # Ranges tried per ECU noted below. All responses were NRC (alive, no such DID)
  # unless a hit is listed. Powertrain 22-DID probes are logged in each ECU's research:.
  pids:
    220100:
      status: active
      period: 5000
      vehicle_states: [ACC, ACC2, READY]
      notes: >-
        39 data bytes of sensor and actuator status; set temperature, fan level, mode and
        recirculation do not appear here. Constants: B5=0x7E, B6=0x50, B7=0x07, B9=0xC8, 0xFF
        padding at B10, B18, B19, B21, B23 and B25-B31. B20 varies 16-255 but does not follow the
        blower (r=+0.09).
      parameters:
        HVAC_INTERIOR_TEMP:
          expression: (B11/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Original WiCAN config"
          verified: true
          notes: "Cabin air temperature: fell 27 to 18.5 °C under A/C cooling and recovered slowly."
        HVAC_AAT:
          expression: (B12/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Original WiCAN config"
          verified: true
          notes: >-
            Ambient air temperature at the HVAC sensor. Range 11.5-31.5 °C across 1766 captures.
        HVAC_HEAT_PUMP_TEMP:
          expression: (B13/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Original WiCAN config"
          verified: true
          notes: >-
            Refrigerant-circuit temperature: 21.5 °C at rest, about 5 °C with the compressor
            running, recovers when it stops. Which sensor (evaporator, heat-pump inlet or outlet) is
            unknown.
        HVAC_COMPRESSOR_DUTY:
          expression: B15
          unit: ""
          min: "0"
          max: "255"
          source: canair investigate/correlate 2026-08-02
          verified: false
          notes: >-
            Name is unconfirmed. Smooth (lag-1 autocorrelation 0.99), range 16-239 across 1766
            captures: about 67 with the compressor off, about 236 with it on. r=+0.71 vs
            HVAC_COMPRESSOR_ON.
        HVAC_UNKNOWN_B17:
          expression: B17
          unit: ""
          min: "0"
          max: "255"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: Range 16-255 across 1766 captures, 22 distinct values. Not a mirror of B15.
        HVAC_COMPRESSOR_TRANSITION:
          expression: "B22"
          unit: ""
          min: "0"
          max: "255"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Name is unconfirmed. Spikes (0x90, 0xB1, 0xD0) at A/C compressor on/off transitions and
            settles at 0x10 when steady.

        HVAC_DUCT_TEMP_1:
          expression: (B36/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Name is unconfirmed. Median about 25 °C, drifts slowly. Raw 0x00 and 0xFF (-40 and 87.5
            °C) appear as fault or absent readings.
        HVAC_DUCT_TEMP_2:
          expression: (B37/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Name is unconfirmed. Median about 24 °C, drops sharply with the compressor running. Raw
            0x00 (-40 °C) appears as a fault reading.
        HVAC_HEAT_DEMAND:
          expression: B34
          min: "0"
          max: "100"
          source: coverage analysis 2026-07-23
          verified: false
          notes: >-
            Name is unconfirmed. Range 0-69 across 1766 captures, higher when the cabin is cold:
            r=-0.74 vs HVAC_AAT, -0.60 vs HVAC_INTERIOR_TEMP, +0.49 vs blower. About 31-39 during
            A/C, 8-59 during PTC heating.
          enabled: true
        HVAC_ACTUATOR_B14:
          expression: B14
          min: "0"
          max: "59"
          source: coverage analysis 2026-07-23
          verified: false
          notes: Range 0-59 across 1766 captures; no strong correlation found.
          enabled: true
        HVAC_ACTUATOR_B35:
          expression: B35
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: Range 70-255 across 1766 captures, noisy. r=-0.80 vs blower fan feedback.
          enabled: true
    220102:
      status: active
      period: 5000
      vehicle_states: []
      notes: 17 data bytes of secondary temperatures and compressor status.
      parameters:
        HVAC_HEAT_EXCHANGER_TEMP:
          expression: (B10/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Name is unconfirmed. 20 °C at rest, rises with HVAC activity; range 17-79 °C across 950
            captures.
        HVAC_HEAT_EXCHANGER_TEMP_2:
          expression: (B11/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Name is unconfirmed. Follows HVAC_HEAT_EXCHANGER_TEMP with a lag; range 15.5-45.5 °C
            across 950 captures.
        HVAC_COMPRESSOR_ON:
          expression: "B17"
          unit: ""
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17; verified 2026-07-22 (heat-pump vs PTC)"
          verified: true
          notes: >-
            1 while the e-compressor runs (heat-pump heating at about 1.5 kW HV draw, 2026-07-22), 0
            during PTC-only heating and idle. Not yet checked during A/C cooling.

        HVAC_COMPRESSOR_ON_MIRROR_B18:
          expression: "B18"
          unit: ""
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            0/1. Agrees with HVAC_COMPRESSOR_ON in most captures but not all: 1 in 152 of 950,
            against 127.

        HVAC_HOTSIDE_TEMP:
          expression: B19
          unit: "°C"
          ha_class: temperature
          min: "0"
          max: "127"
          source: "Monitor session 2026-04-17; reclassified 2026-07-20"
          verified: false
          notes: >-
            Raw byte in °C. 20-37 with the compressor off; rose 31 to 69 °C with it running. r=0.96
            vs HVAC_HEAT_EXCHANGER_TEMP, r=-0.36 vs HVAC_HEAT_PUMP_TEMP. Which sensor is unknown.
        HVAC_COMPRESSOR_ON_MIRROR_B12:
          expression: B12
          source: coverage analysis 2026-07-23
          verified: false
          notes: >-
            0/1, equal to B13 and B15. 1 in 122 of 950 captures, against 127 for HVAC_COMPRESSOR_ON.
          enabled: true
          min: "0"
          max: "1"
    2201A0:
      status: active
      period: 5000
      vehicle_states: [ACC, ACC2, READY]
      notes: >-
        62 bytes: set temperature, on/off and heating-mode flags, fan speed, door targets and
        feedback. B9 equals B10 and B19 about equals B20. B47, B50, B52 and B66 change fast. B54,
        B55 and B69-B71 are always 0.
      parameters:
        HVAC_SET_TEMP_DRIVER:
          expression: "B44"
          unit: "°C"
          display: "f'{v} °C'"
          min: "15"
          max: "32"
          source: "Monitor session 2026-04-17"
          verified: true
          notes: "Set temperature in °C: 15, 20 and 30 matched the console exactly."

        HVAC_SET_TEMP_PASSENGER:
          expression: "B45"
          unit: "°C"
          display: "f'{v} °C'"
          min: "15"
          max: "32"
          source: "Monitor session 2026-04-17"
          verified: true
          notes: Equals HVAC_SET_TEMP_DRIVER in every capture (single-zone car).

        HVAC_ON_FLAG:
          expression: "B23"
          unit: ""
          display: "f'{'ON' if v else 'OFF'}'"
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17"
          verified: true
          notes: 1 when the climate system is on, 0 when off.

        HVAC_COOLING_MODE_B25:
          expression: "B25"
          unit: ""
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            1 during normal and cooling operation, 0 during PTC heating. 1 in 715 of 2254 captures.

        HVAC_HEAT_MODE:
          expression: B06
          unit: ""
          min: "0"
          max: "2"
          source: 2026-07-26 heater-high session (regime split vs HVAC_COMPRESSOR_ON)
          verified: false
          notes: >-
            Heating source: 0 off, 1 PTC, 2 heat pump. On 2026-07-26 it went 0, 1 (PTC at 1.1-1.5
            kW, compressor off), 2 (compressor on, up to 4.5 kW) at 22 °C ambient. Not seen in cold
            weather.
          type: enum
          values:
            0: "off"
            1: ptc_resistive
            2: heat_pump

        HVAC_DEFROST_FLAGS:
          expression: (B58 << 8) | B59
          unit: ""
          display: "f'0x{v:04X}'"
          min: "0"
          max: "65535"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: Reads 0x0000 or 0x00FF (40 of 2254 captures); B58 is always 0. Bits not decoded.
        HVAC_ACTUATOR_TARGET_1:
          expression: B5
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23; mode-cycle capture 2026-07-26
          verified: false
          notes: >-
            Airflow-direction door position. Moves with B9 and B11 (B9 = B5 + 5, B11 = B5 + 8),
            independently of B7. Drifted 102 to 93 over one session.
          enabled: true
        HVAC_ACTUATOR_TARGET_2:
          expression: B7
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23; mode-cycle capture 2026-07-26
          verified: false
          notes: >-
            Mode door position, by direction at 21 °C (2026-07-26): face about 122, face and legs
            137-157, floor about 230, floor and windshield about 237; repeats vary by about 20.
          enabled: true
        HVAC_ACTUATOR_TARGET_3:
          expression: B9
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: Range 1-218 across 2254 captures. B9 equals B10 in every capture.
          enabled: true
        HVAC_ACTUATOR_TARGET_4:
          expression: B11
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: Range 6-221 across 2254 captures.
          enabled: true
        HVAC_MODE_DOOR_FEEDBACK:
          expression: B17
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: Range 104-143 across 2254 captures. r=-0.63 vs HVAC_COOLING_MODE_B25.
          enabled: true
        HVAC_DOOR_FEEDBACK_B13:
          expression: B13
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: Range 114-158 across 2254 captures.
          enabled: true
        HVAC_DOOR_FEEDBACK_B15:
          expression: B15
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: Range 104-151 across 2254 captures.
          enabled: true
        HVAC_MOTOR_DRIVE_B47:
          expression: B47
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: "Fast-changing: 227 distinct values (0-255) across 2254 captures."
          enabled: true
        HVAC_MOTOR_DRIVE_B50:
          expression: B50
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: "Fast-changing: 250 distinct values (0-255) across 2254 captures."
          enabled: true
        HVAC_BLOWER_FAN_SPEED:
          expression: B18
          min: "0"
          max: "121"
          source: HVAC fan-only + fan 1->MAX->1 sweep captures 2026-07-26
          verified: true
          notes: >-
            Blower speed feedback. A fan 1-to-MAX sweep (2026-07-26) gave plateaus 40, 52, 65, 77,
            90, 102, 111 and 121 for levels 1-8. Values between plateaus appear when vent or
            recirculation changes alter the airflow load.
          type: enum
          values:
            40: Fan 1
            52: Fan 2
            65: Fan 3
            77: Fan 4
            90: Fan 5
            102: Fan 6
            111: Fan 7
            121: Fan 8 (MAX)
    2201A1:
      status: draft
      vehicle_states: [ACC, ACC2, READY]
      notes: >-
        62 bytes. The first 10 bytes change fast during HVAC operation. B9:B10 read 01 01 when on
        and 00 00 when off; B13:B14 read 00 78 at rest and 01 3C during PTC heating. B22 follows
        2201A0 B07 (r=0.972). B68 reads 0x05 at fan 1-2 and 0x0A at fan 4 and MAX.
      parameters: {}

    2201A2:
      status: draft
      notes: >-
        55 bytes of 16-bit big-endian words. B20 follows 2201A0 B07 (r=0.978). B18:B19 as a
        little-endian word moves with temperature (r about 0.97).
      vehicle_states: [ACC, ACC2, READY]
      parameters:
        HVAC_HEAT_POWER:
          expression: B42/10
          unit: kW
          min: "0"
          max: "12"
          source: 2026-07-26 heater-high + 2026-07-22 PTC sessions vs BMS BATTERY_POWER
          verified: false
          notes: >-
            Total climate heating power (PTC and heat pump), about 0.1 kW per LSB. r=0.956 vs BMS
            BATTERY_POWER (2026-07-26, n=152, 0.25-4.39 kW); read 13 at about 1.2 kW on the console.
            0 with climate off and during A/C cooling.
        HVAC_COOL_LOAD_B41:
          expression: B41
          min: "0"
          max: "255"
          source: 2026-07-21 AC-cooling + 2026-07-26 heating (align time-series)
          verified: false
          notes: >-
            About 20 at idle in heat and cool modes; 50-60 during A/C cooling (2026-07-21); dips to
            about 10 at the start of PTC heating, then returns to 20.
        HVAC_HEAT_LOAD_B17:
          expression: B17
          unit: A
          min: "0"
          max: "255"
          source: 2026-07-26 heater-high vs 2026-07-21 cooling
          verified: false
          notes: >-
            0-39 during heating, r=0.83 vs BMS BATTERY_CURRENT (y=1.02x-0.98, n=296). 0 during A/C
            cooling. The ampere unit is not confirmed.
        HVAC_TEMP_B44:
          expression: B44
          unit: °C
          min: "0"
          max: "255"
          source: 2026-07-21 cooling + 2026-07-26 heating
          verified: false
          notes: >-
            27-34 during A/C cooling, 0-47 during heating. r=-0.87 vs HVAC_HEAT_PUMP_TEMP. Which
            sensor, and the unit, are unconfirmed.
    2201A3:
      status: draft
      vehicle_states: [ACC, ACC2, READY]
      notes: >-
        55 bytes; changes during HVAC operation. B12 reads 0x39 or 0x3A during PTC heating. B29
        follows the heat-exchanger temperature (about 0.905x-23.5). 2201A4-A6 return identical
        bytes.
      parameters: {}

    2201A4:
      status: ignored
      notes: "55 bytes. Byte-identical alias of 2201A3 (confirmed 2026-07-27 across fan-only + PTC-heat load). Redundant — ignored; decode 2201A3 instead."
      vehicle_states: [ACC, ACC2, READY]
      parameters: {}

    2201A5:
      status: ignored
      notes: "55 bytes. Byte-identical alias of 2201A3 (confirmed 2026-07-27). Redundant — ignored; decode 2201A3 instead."
      vehicle_states: [ACC, ACC2, READY]
      parameters: {}

    2201A6:
      status: ignored
      notes: "55 bytes. Byte-identical alias of 2201A3 (confirmed 2026-07-27). Redundant — ignored; decode 2201A3 instead."
      vehicle_states: [ACC, ACC2, READY]
      parameters: {}
    21F2:
      status: ignored
      period: 0
      vehicle_states: [READY, CHARGING]
      notes: >-
        Answers 7F 21 11 (service not supported) at READY (2026-07-29): HVAC has no 21F2 page.
