# ─── HVAC (Heating, Ventilation, Air Conditioning) ────────────────────
HVAC:
  tx_id: 0x7B3
  iocontrol_scan_ranges: [F000-FFFF]
  identity:
    alias: DATC  # Digital Automatic Temperature Control
    description: Climate Control
    part_number: "97250-G7060"
    mfg_date: "2017-05-30"
    firmware: "AE_EV DATC(-)1.0"
    fw_version: "1.03"
    id_protocol: UDS  # F1xx
    software: "AE_EV DATC(-)1.0"
    serial: "1705304705"
    notes: >
      Climate control unit (DATC — Digital Automatic Temperature Control).
      Exposes climate/compressor live data via service 22 (e.g. 220102).
  vehicle_states: [ACC, ACC2, READY]
  scan_log: # HVAC
    - service: 0x31
      range: "E000-E0FF"
      date: 2026-04-20
      hits: 0
      probes: 256
      vehicle_states: [SLEEP]
      notes: "256 errors — likely no service 31 support without ignition"
  # ─── 2026-07-22 read-DID (service 22) sweep, car in READY (parked) ───
  # Goal: find live-data DIDs on ECUs previously only identity-scanned.
  # Ranges tried per ECU noted below. All responses were NRC (alive, no such DID)
  # unless a hit is listed. Powertrain 22-DID probes are logged in each ECU's research:.
  pids:
    220100:
      status: active
      period: 5000
      vehicle_states: [ACC, ACC2, READY]
      notes: >
        41-byte ELM response (39 data bytes). Live HVAC sensor/actuator data.
        Monitored 2026-04-17 with HVAC on/off, fan speed changes, temp changes,
        A/C toggle, recirculation, defrost, rear defogger. Set temp, fan speed,
        mode, and recirc did NOT appear — this DID is purely sensor/actuator
        status. Settings likely in a different DID (01Ax range or undiscovered).
        Static bytes: ELM[3]=0x7E, ELM[4]=0x50, ELM[5]=0x07, ELM[6]=0xC8
        (purpose unknown — possibly sensor IDs or config flags).
        2026-07-23 (230 captures): remaining unmapped bytes are mostly constants/padding —
        B5=0x7E, B6=0x50, B7=0x07, B9=0xC8, FF-padding tail B10/B18/B19/B21/B23/B25-B31,
        near-constant flags B39/B41/B43 (~0xFF), B42 (0/1), B45/B46/B47 (~0), B49 (single
        sample). Only 3 varying bytes: B14 (0-59, weak corr, likely valve/PWM position),
        B34 (HVAC_HEAT_DEMAND), B35 (86-255, noisy, r=-0.80 vs blower feedback; likely fast
        actuator current/position). B34/B35 kept as leads; rest are documented constants.
        2026-08-01: removed 4 dead params (findings retained here): B33/B44 = constant 0xFF
        (were HVAC_FAN_SPEED_LEVEL / HVAC_AC_COMPRESSOR_ON — not fan/compressor), B38 = -40/-32
        padding (HVAC_VENT_OUTLET_TEMP — bogus), B20 = live 16-255 but r=+0.09 vs the real blower
        fan so NOT fan duty (HVAC_BLOWER_FAN_DUTY_3). Use HVAC_COMPRESSOR_ON (220102 B17) for
        compressor state and HVAC_BLOWER_FAN_SPEED (2201A0 B18) for fan level.
      parameters:
        HVAC_INTERIOR_TEMP:
          expression: (B11/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Original WiCAN config"
          verified: true
          notes: >
            Interior Air Temperature (not "intake"!). Confirmed: drops from 27°C to 18.5°C
            when AC blows cold air, slowly recovers. Tracks cabin temp well.
        HVAC_AAT:
          expression: (B12/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Original WiCAN config"
          verified: true
          notes: "Ambient Air Temperature (HVAC sensor). Stable at ~18.5°C during session."
        HVAC_HEAT_PUMP_TEMP:
          expression: (B13/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Original WiCAN config"
          verified: true
          notes: >-
            Refrigerant-circuit temperature. Verified by behaviour: 21.5C at rest, drops to ~5C with
            the compressor running, recovers when it cycles off (clear thermal lag vs interior
            temp). Exact sensor unconfirmed (evaporator / heat-pump inlet-outlet / heat-exchanger) —
            the HEAT_PUMP name is a best guess.
        HVAC_UNKNOWN_B15:
          expression: "B15"
          unit: ""
          min: "0"
          max: "255"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >
            Unsure, unlikely to be blower fan duty though.

        HVAC_UNKNOWN_B17:
          expression: B17
          unit: ""
          min: "0"
          max: "255"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Unidentified. distinct=22, median 74, range 16-255. NOT an exact mirror of B15 (B15
            distinct=53, median 16) — the earlier 'mirrors B15 almost exactly' note was wrong
            (find-mirrors shows no match).
        HVAC_COMPRESSOR_TRANSITION:
          expression: "B22"
          unit: ""
          min: "0"
          max: "255"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >
            Spikes during AC compressor on/off transitions (0x90, 0xB1,
            0xD0), settles to 0x10 when steady. Possibly compressor
            request signal or clutch duty cycle.

        HVAC_DUCT_TEMP_1:
          expression: (B36/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Plausible duct/heater-core outlet temp: median ~24C, slow thermal drift. Reads -40/87.5
            at raw 0x00/0xFF (sensor-fault/absent sentinels). Identity and verification pending a
            heat-mode capture.
        HVAC_DUCT_TEMP_2:
          expression: (B37/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Plausible vent / near-evaporator temp: median ~23C, drops sharply with the compressor.
            Reads -40 at raw 0x00 (fault sentinel). Identity unconfirmed; unverified pending a
            targeted capture.
        HVAC_HEAT_DEMAND:
          expression: B34
          min: "0"
          max: "100"
          source: coverage analysis 2026-07-23
          verified: false
          notes: >
            Control value, raw 0-73. r=-0.74 vs HVAC_AAT, r=-0.60 vs interior temp,
            r=+0.49 vs blower duty: rises when cabin is cold. Likely heat-demand
            percent or blend-door heat target (not a raw temperature). By state:
            AC ~31-39, PTC-heating 8-59. Verify: vary heat setpoint.
          enabled: true
        HVAC_ACTUATOR_B14:
          expression: B14
          min: "0"
          max: "59"
          source: coverage analysis 2026-07-23
          verified: false
          notes: >
            Raw 0-59 (distinct=31), weak correlations. Likely valve/PWM/blend-door
            position. Verify: actuate mode/temp doors.
          enabled: true
        HVAC_ACTUATOR_B35:
          expression: B35
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: >-
            Raw actuator byte 0-255 (observed 70-255), noisy. r=-0.80 vs
            HVAC_BLOWER_FAN_SPEED-related feedback. Likely fast actuator current/position feedback,
            not a clean scalar. Verify live.
          enabled: true
    220102:
      status: active
      period: 5000
      vehicle_states: []
      notes: >
        20-byte ELM response (17 data bytes). Secondary HVAC temps.
        Monitored 2026-04-17. B10/B11 are temps that rise with heating.
      parameters:
        HVAC_HEAT_EXCHANGER_TEMP:
          expression: (B10/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >
            0x78=20°C at rest, rises to 0x97=35.5°C with HVAC activity.
            Likely heater coolant or heat exchanger temperature.
        HVAC_HEAT_EXCHANGER_TEMP_2:
          expression: (B11/2)-40
          unit: "°C"
          ha_class: temperature
          min: "-40"
          max: "87.5"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >
            Follows B10 with lag. 0x77=19.5°C at rest, rises to 0x80=24°C.
            Secondary heat exchanger or return line temperature.
        HVAC_COMPRESSOR_ON:
          expression: "B17"
          unit: ""
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17; verified 2026-07-22 (heat-pump vs PTC)"
          verified: true
          notes: >
            Binary compressor on/off STATUS flag (0/1) — a status byte, not a physical relay
            (renamed from HVAC_COMPRESSOR_RELAY 2026-07-22). distinct=2 across 196 captures (=1 ~21%).
            Verified live 2026-07-22: reads 1 while the e-compressor runs (heat-pump heating, ~1.5kW HV
            draw) and 0 during PTC-only heating and idle. Cleaner than the 220100 FF-junk
            HVAC_AC_COMPRESSOR_ON. (Nuance: should also read 1 during A/C cooling — untested today;
            if it's actually heat-pump-mode-only, cooling would show 0.)

        HVAC_COMPRESSOR_ON_MIRROR_B18:
          expression: "B18"
          unit: ""
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >
            Compressor-on mirror. B18 is a 0/1 toggle equal to B12==B13==B15 and matches
            HVAC_COMPRESSOR_ON (B17) r=0.92 across 197 captures (differs in 5). Renamed 2026-07-30 from
            HVAC_HEATER_MODE_FLAG — it is a compressor-state mirror, not a distinct heater/cooler mode.
            See HVAC_COMPRESSOR_ON_MIRROR (B12) for the same signal.

        HVAC_TEMP_B19:
          expression: B19
          unit: "°C"
          ha_class: temperature
          min: "0"
          max: "127"
          source: "Monitor session 2026-04-17; reclassified 2026-07-20"
          verified: false
          notes: >
            RENAMED from HVAC_COMPRESSOR_LOAD 2026-07-20 — it is a TEMPERATURE, not a load. Evidence across
            108 220102 captures: B19 reads 20-37 even with the compressor OFF (relay B17=0), so it cannot be
            a load; and it correlates r=0.96 with HEAT_EXCHANGER_TEMP (B10). Raw byte ≈ °C directly (no /2-40
            offset), reading a few degrees above the heat exchanger — consistent with the user's report of
            ~40°C after AC off for hours on a hot day. Exact sensor identity unconfirmed (heater-core / mix /
            in-cabin area), hence the neutral name. Was wrongly attributed to "compressor/PTC load".
        HVAC_COMPRESSOR_ON_MIRROR_B12:
          expression: B12
          source: coverage analysis 2026-07-23
          verified: false
          notes: >
            B12==B13==B15==B18 (HVAC_COMPRESSOR_ON_MIRROR_B18) exactly across 197 captures —
            redundant status mirror (r=0.924 vs HVAC_COMPRESSOR_ON B17, differ in 5
            samples). Documents B12/B13/B15. 220102 constants: B5=0xFF B6=0x80
            B7/B9/B14=0x00 B20-B23=0x00 padding.
          enabled: true
          min: "0"
          max: "1"
    2201A0:
      status: active
      period: 5000
      vehicle_states: [ACC, ACC2, READY]
      notes: >
        62 bytes. Primary HVAC control/status DID. Contains set temperature,
        HVAC on/off flags, heating mode, and defrost flags. Also contains
        actuator target values (ELM[3-9]) that track requested heat output,
        and mirrored values at ELM[43-45]. ELM[24]=0x28 is a constant (not
        set temp). Fan speed byte and HVAC mode selector not yet identified.
        2026-07-23 (277 captures, full-length 62B): most unmapped bytes are actuator data
        (door target/feedback/motor drive) needing physical actuation to label. Confirmed:
        B9==B10 exactly (paired driver/pax target), B19≈B20 (paired). Target cluster
        B5/B7/B9(=B10)/B11 (36-221). Feedback cluster B13/B14/B15/B17 (~104-143); B17
        mode-dependent (r=-0.63 vs HVAC_COOLING_MODE_B25, likely mode/recirc door). High-churn
        B47/B50/B52/B66 (distinct 58-88) = fast motor-drive/RPM-like (cf. 01A1). Constants:
        B54=B55=0x00, tail B69/B70/B71=0x00; low-activity flags B26/B29/B37/B38/B46/B53/B61-B63.
      parameters:
        HVAC_SET_TEMP_DRIVER:
          expression: "B44"
          unit: "°C"
          display: "f'{v} °C'"
          min: "15"
          max: "32"
          source: "Monitor session 2026-04-17"
          verified: true
          notes: >
            Set temperature (driver side). Direct °C value: 0x14=20°C,
            0x1E=30°C, 0x0F=15°C — all match user input exactly.

        HVAC_SET_TEMP_PASSENGER:
          expression: "B45"
          unit: "°C"
          display: "f'{v} °C'"
          min: "15"
          max: "32"
          source: "Monitor session 2026-04-17"
          verified: true
          notes: >
            Set temperature (passenger side or redundancy). Always matches
            B44 in single-zone Ioniq. Dual-zone mirror.

        HVAC_ON_FLAG:
          expression: "B23"
          unit: ""
          display: "f'{'ON' if v else 'OFF'}'"
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17"
          verified: true
          notes: >
            HVAC system running flag. 1 when HVAC is on, 0 when off.

        HVAC_STARTUP_FLAG:
          expression: B22
          unit: ""
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Constant 0 across all 1139 captures (2026-08-01, after purging truncated reads). Was
            hypothesized as a transient turn-on flag; if real, the brief 1 is missed by keep-unique
            polling. Kept enabled to catch it live; unverified.
        HVAC_COOLING_MODE_B25:
          expression: "B25"
          unit: ""
          min: "0"
          max: "1"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >
            Mode flag: 1 during normal/cooling operation, 0 during PTC
            heater mode. May indicate A/C compressor vs resistive heating.

        HVAC_HEAT_MODE:
          expression: B06
          unit: ""
          min: "0"
          max: "2"
          source: 2026-07-26 heater-high session (regime split vs HVAC_COMPRESSOR_ON)
          verified: false
          notes: >-
            Heating-source MODE (WiCAN B06), 3-state: 0=off, 1=PTC resistive, 2=heat-pump
            (compressor). Distinguishes PTC vs compressor heating. Evidence 2026-07-26 17:20: as
            heating started B06 went 0->1 (COMPRESSOR_ON=0, B42=1.1-1.5kW PTC) ->2 (COMPRESSOR_ON=1,
            B42 up to 4.5kW heat-pump). value 1 seen only n=4 (brief PTC warmup before the heat pump
            engaged) — mild ambient (22C). UNTESTED: whether cold weather (PTC + heat-pump BOTH
            running) shows a 4th combined code or holds at 2. Was mislabelled '0x00 normal / 0x02
            PTC'. Tracks HVAC_COMPRESSOR_ON (B17).
          type: enum
          values:
            0: "off"
            1: ptc_resistive
            2: heat_pump

        HVAC_DEFROST_FLAGS:
          expression: (B58 << 8) | B59
          unit: ""
          display: "f'0x{v:04X}'"
          min: "0"
          max: "65535"
          source: "Monitor session 2026-04-17"
          verified: false
          notes: >-
            Reads 0x0000 (n=1099) or 0x00FF (n=40) across 1139 captures (2026-08-01, after purging
            truncated reads); B58 is always 0, so this is effectively B59 as a 0/255 flag. The
            earlier 0xFFEF-during-defrost claim does not appear in captured data. Needs targeted
            defrost/defog toggling to decode the individual bits.
        HVAC_ACTUATOR_TARGET_1:
          expression: B5
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23; mode-cycle capture 2026-07-26
          verified: false
          notes: >-
            Airflow-direction door actuator position. Locked trio B5/B9/B11 (B9=B5+5, B11=B5+8) move
            together per direction; independent of the B7 mode door. Slow drift 102->93 over a
            session (hysteresis, not setpoint). Discrete direction->value map needs a dwell-per-mode
            capture.
          enabled: true
        HVAC_ACTUATOR_TARGET_2:
          expression: B7
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23; mode-cycle capture 2026-07-26
          verified: false
          notes: >-
            Airflow-direction (mode) door actuator position, independent of the B5/B9/B11 trio.
            Monotonic sweep by direction (2026-07-26, temp fixed 21C): face~122 < face+legs~137-157
            < floor~230 < floor+windshield~237. Analog/hysteretic (~+/-20 on repeat visits).
            Discrete map + verification needs a dwell-per-mode capture.
          enabled: true
        HVAC_ACTUATOR_TARGET_3:
          expression: B9
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: "Actuator target, raw 36-218 (distinct=57). B9==B10 exactly (paired driver/pax). ELM[3-9] target cluster."
          enabled: true
        HVAC_ACTUATOR_TARGET_4:
          expression: B11
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: "Actuator target, raw 39-221 (distinct=56). ELM[3-9] target cluster."
          enabled: true
        HVAC_MODE_DOOR_FEEDBACK:
          expression: B17
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: >
            Position feedback, steady ~104-125. Mode-dependent: r=-0.63 vs
            HVAC_COOLING_MODE_B25. Likely mode/recirc door feedback. Verify: cycle
            face/feet/defrost and recirc.
          enabled: true
        HVAC_DOOR_FEEDBACK_B13:
          expression: B13
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: >
            Position feedback cluster, steady ~114-143. Verify: actuate doors.
          enabled: true
        HVAC_DOOR_FEEDBACK_B15:
          expression: B15
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: "Position feedback cluster, steady ~104-134."
          enabled: true
        HVAC_MOTOR_DRIVE_B47:
          expression: B47
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: "High-churn (distinct=70, 0-253) — fast motor-drive/RPM-like (cf. 01A1)."
          enabled: true
        HVAC_MOTOR_DRIVE_B50:
          expression: B50
          min: "0"
          max: "255"
          source: coverage analysis 2026-07-23
          verified: false
          notes: "High-churn (distinct=88, 0-242) — fast motor-drive/RPM-like."
          enabled: true
        HVAC_BLOWER_FAN_SPEED:
          expression: B18
          min: "0"
          max: "121"
          source: HVAC fan-only + fan 1->MAX->1 sweep captures 2026-07-26
          verified: true
          notes: >
            Actual blower fan speed indicator.
            Verified by a deliberate fan 1->MAX->1 sweep (2026-07-26 heater-high session):
            8 clean symmetric monotonic plateaus L1=40 L2=52 L3=65 L4=77 L5=90 L6=102 L7=111 L8/MAX=121 (~+12/level, compresses at top).
            Fan-only session steps matched (52/65/90 on the 3->5 change).
            Reads actual (not rigid setpoint): small off-plateau values (85-93) appear as a transient when vents/recirc change airflow load; steady when load fixed.
    2201A1:
      status: draft
      vehicle_states: [ACC, ACC2, READY]
      notes: >
        62 bytes. Actuator control data. First 10 bytes very active during
        HVAC operation (RPM-like 16-bit values). ELM[9-10] = 01 01 when on,
        00 00 when off. ELM[13-14]: 00 78 at rest, 01 3C during PTC heater.
        B22 mirrors 2201A0 B07 exactly (target value, drifts over time).
        B68: coarse fan step — 0x05 at fan 1-2, 0x0A at fan 4/MAX.
        2026-07-27: B22↔A0 B07 mode-door mirror re-confirmed (r=0.972, ≈raw). Fan
        LEVEL (2201A0 B18) is NOT present on this page (r≈-0.5). Temps present
        (B65/B20 track heat-exchanger temp) but co-move under heating — unresolved.
      parameters: {}

    2201A2:
      status: draft
      notes: >
        55 bytes. Actuator-detail page (16-bit BE words), similar structure to 01A1.
        2026-07-27 (mode-cycle capture 2026-07-26): B20 mirrors 2201A0 B07 mode-door
        position (r=0.978, fit y=0.978x+1.93 ≈ raw). Fan speed (2201A0 B18) is NOT
        present here (r≈-0.5). B18|B19 (u16 LE) tracks temp/blend (r~0.97) but temps
        co-move under heating so the specific sensor is unresolved — needs a
        single-variable capture (one temp/actuator at a time).
      vehicle_states: [ACC, ACC2, READY]
      parameters:
        HVAC_HEAT_POWER:
          expression: B42/10
          unit: kW
          min: "0"
          max: "12"
          source: 2026-07-26 heater-high + 2026-07-22 PTC sessions vs BMS BATTERY_POWER
          verified: false
          notes: >-
            Climate HEATING power (PTC + heat-pump), WiCAN B42 (~0.1 kW/LSB; ISO-TP data byte after
            CF PCI B40). r=0.956 vs pack BATTERY_POWER over the 2026-07-26 heater-high session
            (n=152, 0.25-4.39kW, compressor cycling), fan-independent (r=0.942 controlling
            HVAC_BLOWER_FAN_SPEED); B42=13 at the console's ~1.2kW (2026-07-22 PTC) => /10 kW
            (approximate, pending an exact dash read). Reads 0 when climate off and during AC
            cooling (2026-07-21) => heating-specific; the cooling term is a separate unfound byte
            (B41/B44 nonzero in cooling, no BMS-referenced cooling capture yet). B42 is the TOTAL
            heat power, not one source — attribute with HVAC_HEAT_MODE (B06) / HVAC_COMPRESSOR_ON
            (B17). No separate compressor-power byte (2201A2 B26, 2201A3 B15/B43 are on/off status,
            not analog). Whether PTC+heat-pump ever sum is untested (needs a cold-weather capture).
        HVAC_COOL_LOAD_B41:
          expression: B41
          min: "0"
          max: "255"
          source: 2026-07-21 AC-cooling + 2026-07-26 heating (align time-series)
          verified: false
          notes: >-
            Cooling-responsive candidate (WiCAN B41), identity UNCONFIRMED. Per-mode time-series
            (canair align): baseline ~20 at idle in BOTH heat and cool modes; rises to 50-60 under
            AC cooling (2026-07-21); during PTC heating it dips to ~10 at onset then settles back to
            ~20 (does NOT elevate). So it responds to COOLING only, but is NOT zero in heating — the
            earlier 'active exactly when B42/B17=0' claim was wrong (stats min=0 was pre-session,
            settled value ~20). Likely an AC-compressor/cooling load or target with a ~20 idle
            offset; scale unknown, raw byte. NEXT: hot-cabin AC low->high sweep co-polling BMS:2101,
            hunt vs BATTERY_POWER to confirm it's the cooling wattage vs a compressor-speed/target.
        HVAC_HEAT_LOAD_B17:
          expression: B17
          unit: A
          min: "0"
          max: "255"
          source: 2026-07-26 heater-high vs 2026-07-21 cooling
          verified: false
          notes: >-
            Heating-load candidate (WiCAN B17). 0-39 during heating tracking pack current near 1:1
            (r=0.83 vs BMS BATTERY_CURRENT, fit y=1.02x-0.98, n=296); constant 0 during AC cooling
            (2026-07-21) => heating-specific, NOT the AC compressor (220102 B17 is that). Likely HV
            climate/PTC current in A; unit tentative, confounded (climate is the dominant HV load in
            this heating session). Verify against an isolated PTC-only step.
        HVAC_TEMP_B44:
          expression: B44
          unit: degC
          min: "0"
          max: "255"
          source: 2026-07-21 cooling + 2026-07-26 heating
          verified: false
          notes: >-
