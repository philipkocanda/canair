  research:
    - type: iocontrol_scan
      target: "2F F000-F0FF"
      status: done
      date: "2026-04-19"
      priority: P1
      vehicle_states: [ACC, CHARGING]
      result: >
        13 DIDs respond to ReturnControlToECU (00): F011, F013-F018, F022-F027.
        F012 accepts ShortTermAdjustment (03) but rejects ReturnControlToECU (00).
        All return 6F{DID}0000 (5 bytes). Gaps at F012 (exists for 03 but not 00),
        F019-F021. ShortTermAdjustment (03) accepted but requires value bytes —
        NRC 0x13 without them. Ranges E0xx, B0xx, C0xx, 01xx, F1xx, 00xx all
        NRC 0x31 (empty).
      notes: >
        Two groups: F011-F018 (7 DIDs, gap at F012) and F022-F027 (6 DIDs).
        F028-F0FF not yet scanned. Value byte format unknown — need to test
        with TUI v-key (ShortTermAdjustment with user-provided values).
    - type: verify
      target: "220100"
      status: done
      priority: P1
      vehicle_states: [ACC]
      updated: "2026-08-01"
      notes: >-
        CLOSED 2026-08-01 — the Ioniq-5-ported hypotheses are disproven on the 2017 Ioniq
        220100: B15 is not an inverter temp ((B15/2)-40 gives no sensible temperature; B15 is
        a high-variance 16-239 byte, kept as HVAC_UNKNOWN_B15); no vehicle-speed byte at
        bix 232 / B29 (B28-B31 are FF-padding); B34 is HVAC_HEAT_DEMAND, not a temperature.
        Remaining 220100 unknowns (B14/B34/B35, B15/B17) are tracked in the P3 decode items.
      sources:
        - "OBDb Ioniq 5 — 220100 signals (did not port to the 2017)"
    - type: scan
      target: "22 0100-010B"
      status: done
      priority: P1
      vehicle_states: [ACC]
      notes: >
        Scanned 2026-04-19. Service 0x21 for 0101-010B: all NRC 0x11.
        Service 0x22 for 0101-010B: only 0102 responds (already known),
        0101 and 0103-010B all NRC 0x31. HVAC ECU only has 220100 and
        220102 in the 01xx range. ChatGPT suggestions for 0105-010B were
        incorrect for Ioniq 2017.
    - type: decode
      target: "climate power (console split)"
      status: captured
      priority: P2
      vehicle_states: [READY]
      notes: >-
        Console Drive/Climate/Electronics power split. RESOLVED (heating): the HEATING climate
        power is broadcast on HVAC 2201A2 B42 (HVAC_HEAT_POWER, ~0.1 kW/LSB) — r=0.956 vs pack
        BATTERY_POWER over the 2026-07-26 heater-high session (n=152), fan-independent, 0 when
        climate off. (The earlier 2026-07-22 "no wattage byte" conclusion was wrong-scope: only
        220100/220102 were checked and the small n=35 PTC session buried B42 at r=0.60.) Dash
        split: motor = HV drive; climate = HV compressor+PTC (the B42 heating term); aux/electronics
        = VCU_AUX_POWER (12V, independent of the HV climate load, r=-0.09 vs BATTERY_POWER — NOT
        climate). COOLING term candidate (2026-08-01): 2201A2 B41 (HVAC_COOL_LOAD_B41) responds to AC
        cooling (rises to 50-60, baseline ~20; 2026-07-21) but is NOT a clean cooling-only term —
        a canair align time-series shows B41 sits at baseline ~20 at idle in BOTH modes and stays
        ~10-20 during heating (does not elevate), so the cooling term is still not cleanly pinned
        (identity/scale unknown). Also registered on 2201A2: HVAC_HEAT_LOAD_B17 (B17, 0-39 tracking
        pack current ~1:1 in heating r=0.83, ramps/decays in lockstep with B42; constant 0 in
        cooling => heating-specific, NOT the 220102 compressor flag) and temp candidate
        HVAC_TEMP_B44 (r=-0.87 vs HVAC_HEAT_PUMP_TEMP, thermal lag confirmed on align; identity
        held). STILL OPEN:
        (1) pin the B41 cooling scale via a hot-cabin AC low->high sweep co-polling HVAC:2201A2 +
        BMS:2101, hunt B41 vs BATTERY_POWER; (2) confirm the B42 heating scale against an exact
        dash read; (3) single-variable dwell to resolve B44 and the other co-moving temps.
      updated: "2026-08-01"
    - type: decode
      target: 2201A0 actuator doors
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-07-27"
      notes: "PROGRESS 2026-07-27 (mode-cycle capture 2026-07-26): FAN resolved = B18 (HVAC_BLOWER_FAN_SPEED, verified). Airflow-DIRECTION door = the B5/B7/B9/B11 actuator cluster: they reposition on every direction change (temp fixed 21C, so mode-driven). B7 sweeps monotonically face~122 < face+legs~137-157 < legs(floor)~230 < legs+windshield~237; B5/B9/B11 a locked trio (+5/+8). Analog/hysteretic (~+/-20 on repeat visits) so discrete direction->value map still needs a DWELL-per-mode capture (hold each direction ~30s, note each). STILL OPEN: recirc + driver-only produce NO clean flag/enum on 2201A0 or 220100 in this capture (small B18 fan dips at 17:13 are consistent with recirc/driver-only altering airflow load, reinforcing B18=actual feedback). motor-drive B47/B50 = 0-255 sawtooth (position/commutation counter), not load. Cross-ref 2201A1-A6."
    - type: decode
      target: 220100 B14/B35 signals
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-07-23"
      notes: "220100 has 3 non-constant unmapped bytes, all registered as enabled-unverified candidates: HVAC_ACTUATOR_B14 (0-59, weak corr, likely valve/PWM), HVAC_HEAT_DEMAND (B34, r=-0.74 vs ambient), HVAC_ACTUATOR_B35 (86-255, noisy, r=-0.80 vs blower feedback). Other unmapped bytes are constants/FF-padding (B5=0x7E B6=0x50 B7=0x07 B9=0xC8; B10/B18-B31 tail=0xFF). Verify: actuate heat/fan and observe which moves."
    - type: decode
      target: 220100 B34 (heat demand, NOT fan)
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-24"
      updated: "2026-07-27"
      notes: "RESOLVED-fan-question 2026-07-27: B34 is NOT the fan. Against the now-confirmed actual fan (2201A0 B18) over the 2026-07-26 fan-only+heater session, B34 r=-0.07 (no relation); the 2026-04-19 'fan1->MAX' co-movement was coincidental (fan-up accompanies demand). Old B33 HVAC_FAN_SPEED_LEVEL dead 0xFF; B20 HVAC_BLOWER_FAN_DUTY_3 also r=+0.09 vs real fan (not fan, stays disabled). REMAINING: B34 vs ambient r=-0.74 historically + weak vs PTC (r=-0.21) => heat/climate-demand candidate; confirm with a heat sweep at constant fan."
    - type: verify
      target: 2201A0 B18 blower fan speed
      status: done
      priority: P2
      vehicle_states: [READY]
      created: "2026-07-27"
      updated: "2026-07-27"
      notes: "HVAC_BLOWER_FAN_SPEED (2201A0 B18) registered enabled-unverified from the 2026-07-26 fan-only capture: stepped 52/65/90 for fan 3/4/5, load-sensitive analog wobble = likely ACTUAL blower feedback not setpoint. TO VERIFY: clean fan-level sweep 1..MAX at constant temp/airflow to build the level<->value map and confirm scale/units (RPM? voltage x10? %). Also settle setpoint-vs-feedback: hold fan fixed and change only airflow/recirc — if B18 moves it's actual feedback. Check B18 at MAX fan (max~121 seen as outlier)."
    - type: decode
      target: 2201A1/A2/A3 sensor pages
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-27"
      updated: "2026-07-27"
      notes: "01Ax higher pages surveyed 2026-07-27 (2026-07-26 HVAC capture). STRUCTURE: A0=actuators/fan(decoded); A1(62B)/A2(55B)/A3(55B)=distinct 16-bit sensor/actuator detail pages; A4/A5/A6=byte-identical aliases of A3 (now ignored). CONFIRMED: mode-door position mirrored on A1 B22 & A2 B20 (r~0.97 vs A0 B07, ~raw). Fan level (A0 B18) NOT on any sibling page. OPEN: multiple temperatures on A1(B65,B20)/A2(B18|B19)/A3(B29~heat-exch, 0.905x-23.5) all co-move under heating so specific sensors unresolved. TO DECODE: single-variable capture — vary ONE temp/actuator at a time (e.g. evap vs heat-exch vs duct), hold, note; then hunt each A-page word against the isolated reference."
    - type: scan
      target: 21 00-FF
      status: pending
      priority: P2
      vehicle_states: [READY]
      created: "2026-07-28"
      updated: "2026-07-29"
      notes: "HVAC (0x7B3, UDS) has NEVER been probed for service-21 pages — only service-22 DIDs (2201xx) and one service-31 sweep are logged. Preconditioning is a CLIMATE function, so an HVAC service-21 config page (esp. 21F2, mirroring the VCU/MCU/BMS/OBC 21F2 convention) is a strong candidate to hold the 2 preconditioning schedules (currently 15 C Thu 15:30 + 15 C Thu 16:00) — possibly the PRIMARY store, with VCU 21F2 only carrying the charge windows. Sweep 21 00-FF in READY; if 21F2 (or any page) responds, capture it, then reprogram ONE precondition field and re-read to diff. Cross-ref: VCU 21F2 charge-schedule research entry (charge timer is bit-packed in VCU 21F2 B38-B43+B75). 2026-07-29 PARTIAL: the top candidate LID 21F2 was probed directly (READY, parked) and returned NRC 0x11 serviceNotSupported — HVAC does NOT answer service 0x21 at F2, so the 21F2-convention theory is DISPROVEN for HVAC and the HVAC 21F2 draft PID was set to ignored. The full 00-FF sweep is still outstanding; if it also comes back all-NRC (like the OBC/VCU/Unknown-746 sweeps), close this and focus preconditioning search on AVN 21F2."
      what_to_test:
        - Sweep service-21 00-FF on HVAC 0x7B3 in READY; note which LIDs respond (expect 21F2 per the 21F2 convention on other ECUs).
        - If a page responds, capture it in a known precondition state, then change one precondition schedule field and re-read to locate the schedule bytes.
