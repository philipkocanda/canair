      notes: >
        IGNORED — probed and REJECTED. 2026-07-29 (READY, parked) HVAC 0x7B3 answered 21F2 with negative response 7F 21 11 (serviceNotSupported), so this LID does NOT exist. Set to ignored per the original draft rationale ("if a device read returns NRC/NO DATA, set status: ignored"). HISTORY: added 2026-07-28 as a discovery placeholder on the theory that, since preconditioning is a CLIMATE function and every other major ECU (VCU/MCU/BMS/OBC/Unknown-746) exposes a 21F2 service-21 config/identity page, HVAC likely had one too holding the 2 preconditioning schedules — but HVAC (UDS) does not answer service 0x21 at F2. Preconditioning schedules are NOT in HVAC 21F2; look elsewhere (AVN 21F2, VCU 21F2). See HVAC research 'scan 21 00-FF' and the VCU 21F2 charge-schedule entry.
