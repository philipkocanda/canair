  research:
    - type: iocontrol_scan
      target: "2F F000-F0FF"
      status: done
      date: "2026-04-19"
      priority: P1
      vehicle_states: [ACC, CHARGING]
      result: >
        13 DIDs respond to ReturnControlToECU (00): F011, F013-F018, F022-F027.
        F012 accepts ShortTermAdjustment (03) but rejects ReturnControlToECU (00).
        All return 6F{DID}0000 (5 bytes). Gaps at F012 (exists for 03 but not 00),
        F019-F021. ShortTermAdjustment (03) accepted but requires value bytes —
        NRC 0x13 without them. Ranges E0xx, B0xx, C0xx, 01xx, F1xx, 00xx all
        NRC 0x31 (empty).
      notes: >
        Two groups: F011-F018 (7 DIDs, gap at F012) and F022-F027 (6 DIDs).
        F028-F0FF not yet scanned. Value byte format unknown — need to test
        with TUI v-key (ShortTermAdjustment with user-provided values).
    - type: verify
      target: "220100"
      status: done
      priority: P1
      vehicle_states: [ACC]
      updated: "2026-10-22"
      notes: >-
        The Ioniq 5 220100 signals do not port to the 2017 Ioniq: (B15/2)-40 gives no sensible
        temperature (B15 is HVAC_UNKNOWN_B15, 16-239); there is no vehicle-speed byte at bix 232 /
        B29 (B25-B31 are 0xFF in every capture); B34 (HVAC_UNKNOWN_B34) is not a temperature.
      sources:
        - "OBDb Ioniq 5 — 220100 signals (did not port to the 2017)"
    - type: scan
      target: "22 0100-010B"
      status: done
      priority: P1
      vehicle_states: [ACC]
      notes: >-
        Scanned 2026-04-19. Service 0x21 for 0101-010B: all NRC 0x11. Service 0x22 for 0101-010B:
        only 0102 responds; 0101 and 0103-010B return NRC 0x31. The wider 0100-01FF sweep finds
        0100, 0102 and 01A0-01A6 (see scan_log).
    - type: decode
      target: "climate power (console split)"
      status: captured
      priority: P2
      vehicle_states: [READY]
      result: >-
        2026-10-21, with the BMS pack current fixed: parked in READY, pack power minus
        VCU_AUX_POWER/0.9 leaves a 0.02-0.08 kW baseline with climate off, and during heating it
        equals HVAC_HEAT_POWER (median ratio 0.99, r=0.88, n=129 heating rows). So B42/10 is the
        whole HV heating draw at 0.1 kW/bit. It reads 0 under A/C cooling, so the cooling draw is
        not on B42.
      notes: >-
        Console Drive/Climate/Electronics power split. Heating: 2201A2 B42 (HVAC_HEAT_POWER).
        Electronics: VCU_AUX_POWER (12 V, r=-0.09 vs BATTERY_POWER, independent of the HV climate
        load). Cooling: no power byte known; 2201A2 B41 (HVAC_COOL_LOAD_B41) reads 50-60 under A/C
        against about 20 otherwise, scale unknown. Open: a hot-cabin A/C low-to-high sweep
        co-polling HVAC:2201A2 and BMS:2101 to hunt B41 (and 220100 B15) against BATTERY_POWER.
      updated: "2026-10-22"
    - type: decode
      target: 2201A0 actuator doors
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-10-22"
      notes: >-
        Mode-cycle capture 2026-07-26: B7 (mode door) runs face about 122 < face and legs 137-157 <
        floor about 230 < floor and windshield about 237, with about ±20 on repeat visits. B5, B9
        and B11 move together (r >= 0.995) at offsets that differ between sessions. Recirculation
        and driver-only produced no flag on 2201A0 or 220100. Open: a dwell capture holding each
        direction about 30 s, noting each, to map B7 and B5.
    - type: decode
      target: 220100 B14/B34/B35 signals
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-23"
      updated: "2026-10-22"
      notes: >-
        Three non-constant unmapped 220100 bytes, registered as unverified unknowns:
        HVAC_UNKNOWN_B14 (0-59, r=-0.70 vs 2201A0 B5), HVAC_UNKNOWN_B34 (0-78, r=-0.40 vs interior
        temperature; r=-0.07 vs the blower on 2026-07-26, so not the fan) and HVAC_UNKNOWN_B35
        (70-246, r=-0.54 vs blower). Open: change heat and fan one at a time and see which moves.
    - type: verify
      target: 2201A0 B18 blower fan speed
      status: done
      priority: P2
      vehicle_states: [READY]
      created: "2026-07-27"
      updated: "2026-07-27"
      result: >-
        Fan 1-to-MAX sweep (2026-07-26): plateaus 40, 52, 65, 77, 90, 102, 111 and 121 for levels
        1-8, with intermediate values when vents or recirculation change the airflow load, so B18
        is blower feedback. HVAC_BLOWER_FAN_SPEED is verified.
    - type: decode
      target: 2201A1/A2/A3 sensor pages
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-07-27"
      updated: "2026-10-22"
      notes: >-
        A1, A2 and A3 carry copies of known bytes (heat mode at A1 B21 and A2 B19, mode door at A1
        B22 and A2 B20, 220100 bytes at A3 B33-B41) plus several 16-bit words that co-move with
        temperatures under heating. A1 B68 steps with the fan (5 at fan 1-2, 10 at fan 3-8). Open:
        vary one temperature or actuator at a time, hold, note, then hunt each word against the
        isolated reference.
    - type: scan
      target: 21 00-FF
      status: nrc
      priority: P2
      vehicle_states: [READY]
      created: "2026-07-28"
      updated: "2026-10-22"
      result: >-
        Not needed: 2101 and 21F2 return NRC 0x11 serviceNotSupported (2026-07-29, 2026-10-22), as
        did 2101-210B on 2026-04-19. HVAC does not support service 21.
    - type: decode
      target: compressor vs PTC power split
      status: pending
      priority: P2
      vehicle_states: [READY]
      created: "2026-10-21"
      updated: "2026-10-22"
      notes: >-
        HVAC_HEAT_POWER (2201A2 B42/10) is the whole HV heating draw and reads 0 under A/C.
        Splitting heating between heat pump and PTC, and finding the cooling draw, needs sessions
        where only one HV consumer runs. 220102 HVAC_HEAT_PUMP_ON is 0 under A/C, so no
        compressor-on flag is known. Candidates: 220100 HVAC_UNKNOWN_B15 (fell 113 to 44 when the
        A/C started on 2026-07-21, but reads 235-239 in heating and fan-only sessions with the
        compressor off), 2201A2 HVAC_COOL_LOAD_B41 (50-60 under A/C), 2201A1 B34 (= B60, 0-37),
        2201A3 B42/B43.
      sources:
        - BMS:2101 BATTERY_POWER - VCU:2102 VCU_AUX_POWER residual, 2026-10-21
      what_to_test:
        - >-
          A/C cooling only (no PTC): the pack residual should track one compressor candidate while
          2201A2 B42 stays 0
        - >-
          Heater with A/C and heat pump off (PTC only): compressor candidates stay at idle while B42
          rises
      capture_protocol: >-
        canair monitor 'BMS:2101 VCU:2102 HVAC:220100,220102,2201A0,2201A1,2201A2,2201A3' --save
        --keep-all --label 'HVAC power split' --state READY. Parked, 3 min per mode: climate off,
        A/C cooling at fan 3, A/C off with heat at max, noting each change with 's'.
    - type: decode
      target: "220100 HVAC_HEAT_PUMP_TEMP and duct temperatures: which sensors"
      status: pending
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-23"
      updated: "2026-10-23"
      notes: The DATC reads an in-car sensor, an ambient sensor, an evaporator sensor, two duct sensors (vent and floor), and, with the heat pump fitted, two refrigerant temperature sensors. HVAC_HEAT_PUMP_TEMP (B13) fell to 6 degC on A/C start and may be the evaporator sensor; HVAC_DUCT_TEMP_1/2 (B36/B37) may be the two duct sensors. None is confirmed.
      what_to_test:
        - "A/C on at a fixed blower speed for 10 minutes: check whether B13 cycles with the compressor. Then switch between face and floor modes and see which of B36/B37 follows the mode door."
      capture_protocol: >-
        canair monitor HVAC:220100 --save --keep-changes --interval 2 --label 'A/C cycling and mode
        change' --state READY; press s at A/C on and at each mode change.
