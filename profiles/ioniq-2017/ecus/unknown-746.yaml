# ─── Unknown-746 ─────────────────────────────────────────────────────
# Service discovery (2026-04-19):
#   Supported: 1A (identity), 20 (stopDiagSession), 21 (live data — only F2),
#              27 (security — conditionsNotCorrect), 28 (commControl — conditionsNotCorrect),
#              31 (routineControl — conditionsNotCorrect), 3E (testerPresent — conditionsNotCorrect)
#   Not supported: 10 (session — NRC 0x12), 22 (NRC 0x11)
#
# KWP2000 identity (1A 80-9F, 10/32 responding):
#   1A80: FFFFFFFF    1A8A: FFFFFFFF    1A8B: FFFFFFFF
#   1A8C: "1.10"      1A8D: "Z311"      1A8E: "Z311"
#   1A91: FFFFFFFF    1A92: "3.5"       1A98: FFFFFFFF    1A99: FFFFFFFF
Unknown-746:
  tx_id: 0x746
  identity:
    description: Unknown ECU at 0x746 (KWP2000)
    ecu_id: "1.10"  # KWP2000 1A8C
    sw_id: "Z311"  # KWP2000 1A8D/1A8E
    calibration: "Z311"
    hw_sw: "3.5"  # KWP2000 1A92
    id_protocol: KWP2000  # 1Axx (10/32 responding)
    notes: >-
      Service 10 returns NRC 0x12; service 22 returns NRC 0x11. 10 of 32 KWP2000 1A identity IDs
      respond, most with FFFFFFFF. Only data PID is 21F2.
  vehicle_states: [READY, CHARGING]
  pids:
    21F2:
      status: active
      period: 10000
      vehicle_states: [CHARGING]
      notes: >-
        6-byte response 61F200000007 during AC charging (2026-04-18); the capture notes the same
        response with the car off. NO DATA at READY (2026-07-22). The only service-21 PID that
        responds (sweeps 2026-04-18 and 2026-07-22).
      parameters: {}
  research:
    - type: scan
      target: 21F2
      status: pending
      priority: P3
      vehicle_states: [SLEEP]
      created: "2026-10-20"
      updated: "2026-10-20"
      notes: "Pin down when 21F2 answers: it did during AC charging but not at READY. Re-read with the car fully off."
