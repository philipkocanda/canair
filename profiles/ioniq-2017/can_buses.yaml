# Hyundai Ioniq 2017 — physical CAN bus segment vocabulary
#
# Codes accepted by each ECU's `can_bus:` field (in ecus/). Hyundai/Kia split
# the vehicle bus into functional segments bridged by the gateway (the IGPM
# here). See canlib/schema/can_buses_schema.yaml and `canair validate can-buses`.
# Edit an ECU's segment(s) with `canair pids set-can-bus ECU CODE [CODE ...]`.
#
# `bitrate` is the segment's bus speed in bit/s (optional). Hyundai runs the
# high-speed segments (P-CAN/C-CAN/H-CAN/D-CAN) at 500 kbit/s and the low-speed
# Body CAN (B-CAN) at 100 kbit/s. MM-CAN is the exception: it is a low-speed
# 100 kbit/s segment. D-CAN (500 kbit/s) and MM-CAN (100 kbit/s) are confirmed;
# the rest are the standard Hyundai/Ioniq figures.

can_buses:
  ALL:
    name: All segments
    description: The gateway (IGPM) bridges every segment; the OBD-II port connects here.
  B-CAN:
    name: Body CAN
    description: Comfort/body electronics (doors, seats, BCM, smart key, HVAC).
    bitrate: 100000
  P-CAN:
    name: Powertrain CAN
    description: High-voltage/drivetrain control (BMS, VMCU/MCU, VESS).
    bitrate: 500000
  C-CAN:
    name: Chassis CAN
    description: Chassis/ADAS (cluster, cameras, cruise/braking assist).
    bitrate: 500000
  MM-CAN:
    name: Multimedia CAN
    description: Infotainment/audio (head unit, amplifier).
    # 100 kbit/s, not 500. Recovered from the AVN head unit's MICOM firmware:
    # its Renesas RS-CAN controller is configured with prescaler 25 and 16 tq per
    # bit (400 CAN-clock periods per bit) off a 40 MHz CAN clock. Independently
    # corroborated by the Kia Soul EV community matrix, whose `M_CAN` sheet is
    # also 100 kb/s and shares 18 arbitration IDs with this firmware's tables.
    bitrate: 100000
  H-CAN:
    name: Hybrid CAN
    description: Hybrid/EV powertrain segment (motor/inverter, VMCU).
    bitrate: 500000
  D-CAN:
    name: Diagnostic CAN
    description: Diagnostic bus (D-CAN) exposed on the OBD-II port for UDS/KWP2000 requests.
    bitrate: 500000
