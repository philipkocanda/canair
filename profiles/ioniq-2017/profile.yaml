# Ioniq 2017 EV — vehicle profile settings
# Profile-wide settings for the Ioniq 2017. Per-ECU definitions live in ecus/.
# Run `canair wican autopid write` to produce the AutoPID JSON from the ecus/ definitions.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ RECON GOTCHA — ECU WARM-UP (first request after idle is slow)             │
# ├──────────────────────────────────────────────────────────────────────────┤
# │ Ioniq ECUs drop to a low-power state when idle. The FIRST diagnostic       │
# │ request to an ECU that hasn't been queried "in a while" is noticeably      │
# │ slow (the ECU/gateway has to wake) and can even TIME OUT / return NO DATA  │
# │ on that first try — subsequent requests are fast. This is normal, not a    │
# │ dead ECU or a wrong PID. Confirmed on IGPM (0x770); very likely applies to │
# │ most ECUs.                                                                 │
# │                                                                            │
# │ During recon: if a first read fails/looks unresponsive, RETRY once (or     │
# │ send a throwaway "prime" read first) before concluding the PID/ECU is bad. │
# │ The live monitor's raw backend (--raw-can) primes each ECU on start for    │
# │ exactly this reason; the high response_timeout_ms below also helps the ELM │
# │ path ride out the slow first response.                                     │
# │                                                                            │
# │ Separately, the OBD-II port is GATEWAY-ISOLATED: ECUs answer diagnostic    │
# │ request/response, but there is ~no unsolicited broadcast traffic to sniff  │
# │ passively (see `canair sniff`). Reads are request/response only.           │
# └──────────────────────────────────────────────────────────────────────────┘
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ DATA-PROVENANCE CAVEAT — historical payload LENGTHS are not fully trusted  │
# ├──────────────────────────────────────────────────────────────────────────┤
# │ A capture-transport bug truncated some multi-frame ISO-TP reads (the       │
# │ ELM327 / wican-ws path occasionally dropped a consecutive frame), so a     │
# │ payload recorded BEFORE 2026-07-28 can be short of the real response and   │
# │ misaligned after the gap. Fixed 2026-07-28: parse_uds_response now rejects │
# │ a short multi-frame read (ISO-TP declared-length check), and captures over │
# │ slcan-tcp cannot truncate at all (client-side ISO-TP guarantees a complete │
# │ reassembly or nothing).                                                    │
# │                                                                            │
# │ Consequence: do NOT infer a PID's variable-length behaviour or byte layout │
# │ from pre-fix length VARIATION alone — a "short" historical payload may be  │
# │ a dropped frame, not a real shorter response. Confirm with a post-fix      │
# │ re-capture (ideally slcan-tcp). Known-truncated captures have been purged; │
# │ genuinely variable-length PIDs are marked `variable_length: true` in their │
# │ ecus/ definition.                                                          │
# └──────────────────────────────────────────────────────────────────────────┘

car_model: "Hyundai Ioniq 2017"
init: "ATSP6;ATS0;ATAL;ATST96;"

# Make-specific quirks this profile opts into (make-neutral profiles omit this).
# hk_f1xx_minus_one: Hyundai/Kia identity DIDs answer one less than requested
#   (request 22F188 -> response 62F187); echo validation tolerates it for F1xx.
# skm_wakeup: enable the Ioniq SKM relay-wake command (`skm-wake`) — rouse the
#   Smart Key Module then close a power relay (ACC/IGN) via IOControl. The relay
#   DIDs/magic/addresses are Ioniq-specific, so it's gated behind this capability.
quirks:
  - hk_f1xx_minus_one
  - skm_wakeup

# ELM327 response timeout in ms (applied as ATSTxx after init; --elm-timeout
# overrides). The Ioniq 2017 responds slowly, so keep this high. ~614ms == ATST96.
response_timeout_ms: 614

# Enable UDS service-22 multi-DID batching per ECU (see each ECU file's
# `multi_did:` flag). Batching is only attempted for ECUs opted in; any ECU that
# rejects it (NRC 0x13) auto-falls back to single-DID reads for the session.
#
# multi_did_max: max DIDs combined into one multi-DID request (default 3). Raised
# to 6 here after on-car verification 2026-07-29: IGPM (0x770) answered all 7 of
# its BC01-BC07 DIDs in one request (62-byte multi-frame reassembly, request
# itself multi-frame) with no truncation, repeatably. 6 stays under that proven
# ceiling. A per-ECU `multi_did_max:` overrides this.
multi_did_max: 6

# Vehicle-axis physical bands for the reference-free plausibility scan
# (`canair hunt --physical` / `canair investigate`). Only hv_pack is overridden;
# rail_12v (11-15 V) and the grid bands (mains/line-freq, from `grid_region`)
# keep their defaults. The 28 kWh pack is 96S Li-polymer: 96 x 2.5 V (empty) to
# 96 x 4.2 V (full) ~= 240-403 V. Band widened slightly to bracket the range.
physical_bands:
  hv_pack: [240, 410]   # HV traction pack V (96S, ~360 V nominal)

failure_types:
  "0x00": "no sub-type information"          # standard (also known by the tool)
  "0x77": "Hyundai-specific — meaning not yet determined"
