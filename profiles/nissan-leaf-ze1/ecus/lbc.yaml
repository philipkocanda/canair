          min: "-40"
          max: "90"
        HV_T_3:
          expression: S17
          unit: °C
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: true
          notes: >-
            Battery temperature sensor 3 (pack 4; pack 3 is unused on the ZE1), signed byte at WiCAN
            S17. Matched LeafSpy Pro within 1 °C (around 10-11 °C); signed byte (OBDb's layout is
            signed 8-bit), so sub-zero readings decode negative. The PR suggests a -10..40 °C filter
            for startup spikes; not applied, since a pack can exceed 40 °C when rapid charging.
          min: "-40"
          max: "90"
        HV_T_4:
          expression: S18
          unit: °C
          min: "-40"
          max: "90"
          source: OBDb, OVMS
          source_links:
            - https://github.com/OBDb/Nissan-Leaf
            - https://github.com/openvehicles/Open-Vehicle-Monitoring-System-3/blob/master/vehicle/OVMS.V3/components/vehicle_nissanleaf/src/vehicle_nissanleaf.cpp
          verified: false
          notes: >-
            Pack 5 temperature sensor, signed byte at data byte 12 (after 61 04). Pack 3 is unused
            (FF) on the ZE1, so HV_T_3 is pack 4. Not in the original LeafSpy comparison.
      status: active
      period: 10000
      vehicle_states: [READY, CHARGING]
      notes: >-
        LBC data group 04 (service 0x21, ~5 frames): battery temperature sensors. Upstream request
        key 21045 (trailing frame-count digit dropped). OBDb's 2018 and 2024 test cars list 2104 as
        unsupported, but the PR read it on a 2018 ZE1 and matched LeafSpy.
