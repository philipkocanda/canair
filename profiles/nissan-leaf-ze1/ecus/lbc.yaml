            vectors (2018 and 2024 cars); observed 3.42-4.21 V. On this car within 1 mV of the 2102
            cell maximum (4.045 vs 4.046 V, 4.068 vs 4.069 V, 2026-10-21). The word straddles a
            consecutive-frame PCI byte, hence the (Bx*256)+By form.
