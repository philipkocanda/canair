LBC:
  tx_id: 0x79B
  can_bus: [EV-CAN]
  identity:
    description: Li-ion Battery Controller (HV battery management), request 0x79B
    notes: >-
      Seeded device-free from the WiCAN community profile in meatpiHQ/wican-fw#750 (closed
      unmerged), which fixes and extends the upstream vehicle_profiles/nissan/leaf-ze1.json. Request
      0x79B / response 0x7BB (rx = tx + 0x20, set profile-wide via addressing.rx_offset). The PR
      author verified the 2101 signals against LeafSpy Pro on a 2018 40 kWh ZE1. Upstream later
      shipped those fixes as vehicle_profiles/nissan/leaf-ze1-2018-.json, whose LBC signals all
      match this file (its LV_V is LBC_12V here). Speaks KWP2000: ZE1 cars answer its service 0x21
      reads with positive 0x61 replies (2101/2161 in OBDb's 2018-2024 test cases;
      2101/2102/2104/2106/2161/2184 in dalathegreat's ZE1 poll list).


      Sources: https://github.com/meatpiHQ/wican-fw/pull/750,
      https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/nissan/leaf-ze1-2018-.json
    id_protocol: KWP2000
  pids:
    2101:
      parameters:
        SOC:
          expression: ((B39*65536)+[B41:B42])/10000
          unit: "%"
          min: "0"
          max: "100"
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: true
          notes: >-
            Raw (true) LBC state of charge including Nissan's top/bottom buffers; 24-bit across
            WiCAN B39 and [B41:B42] (B40 is a consecutive-frame PCI byte), /10000. Matched LeafSpy
            Pro (86.9 %).
        SOC_D:
          expression: ((((B39*65536)+[B41:B42])/10000)-12)/0.85
          unit: "%"
          min: "0"
          max: "100"
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: true
          notes: >-
            Dashboard SOC, a linear approximation (SOC - 12) / 0.85 of the cluster reading; Nissan
            uses a non-linear table internally. Read 88.0 % vs LeafSpy 89 % in the PR, and 84.84 vs
            87 % and 84.57 vs 86 % against METER:220E2D SOC_DASH on this car (2026-10-21). Near
            empty and full the estimate leaves 0-100 % and is dropped by the min/max filter, not
            clamped. OBDb fits the same raw value as raw/0.819 - 17 (24-bit /8190 - 17), which reads
            85.7 and 85.4 % on those captures; the exact reading is METER:220E2D SOC_DASH.
        SOH_40KWH:
          expression: ((B44*65536)+[B45:B46])/11544
          unit: "%"
          min: "1"
          max: "100"
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: true
          notes: >-
            State of health from the 24-bit AHr capacity at WiCAN B44:B46 against the 115.44 Ah
            reference of a new 40 kWh pack. Matched LeafSpy Pro on a 2018 40 kWh car (85.2 vs 85.23
            %). Wrong on a 62 kWh e+ (new pack about 176 Ah, so a healthy e+ reads about 140 % and
            is dropped, while one below about 65 % passes with a wrong value); use LBC:2161 SOH,
            which the LBC reports for either pack. Min 1 drops a 0 % startup glitch.
        HV_CAPACITY:
          expression: ((B44*65536)+[B45:B46])/10000
          unit: Ah
          min: "0"
          max: "200"
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: true
          notes: >-
            Battery capacity (AHr), 24-bit at WiCAN B44:B46, /10000. Matched LeafSpy Pro (98.39 Ah)
            on a 40 kWh car. OBDb vectors read 92-108 Ah on 40 kWh cars and 161-169 Ah on e+ cars.
        HV_CAPACITY_KWH:
          expression: ((B44*65536)+[B45:B46])/29600
          unit: kWh
          min: "0"
          max: "70"
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: false
          notes: >-
            Usable capacity derived from AHr: /29600 is AHr x 337.8 V, a nominal voltage that fits
            the 96-series pack of both the 40 kWh and the e+. OBDb vectors give 31-36 kWh (40 kWh
            cars) and 54-57 kWh (e+). Not in the PR's LeafSpy comparison.
        HV_CAPACITY_R:
          expression: ((B39*65536)+[B41:B42])/10000*((B44*65536)+[B45:B46])/29600/100
          unit: kWh
          min: "0"
          max: "70"
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: false
          notes: >-
            Energy currently stored: SOC x HV_CAPACITY_KWH. Not in the PR's LeafSpy comparison.
        HX:
          expression: "[B36:B37]/102.4"
          unit: "%"
          min: "0"
          max: "120"
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: false
          notes: >-
            Hx, the LBC's internal-resistance health index (16-bit at WiCAN [B36:B37], /102.4). It
            can exceed 100 on a healthy pack: OBDb e+ vectors read up to 107 %. The original
            upstream leaf-ze1.json still ships this expression as SOH, which the PR shows is wrong
            (65.3 % Hx on an 85 % SOH car); the newer leaf-ze1-2018-.json drops it and takes SOH
            from LBC:2161.
        HV_PACK_V:
          expression: "[B25:B26]/100"
          unit: V
          min: "0"
          max: "450"
          source: OBDb, dalathegreat, py-nissan-leaf-obd-ble
          source_links:
            - https://github.com/OBDb/Nissan-Leaf
            - https://github.com/dalathegreat/leaf_can_bus_messages
            - https://github.com/pbutterworth/nissan-leaf-obd-ble
          verified: true
          notes: >-
            Pack voltage, 16-bit /100 at data bytes 18-19 (after 61 01). Reproduces the pack voltage
            of 130 of 131 OBDb ZE1 2101 vectors (2018-2024, 40 kWh and e+); the odd one out is a
            test case holding two concatenated replies. Observed 317-403 V. On this car within 0.1 V
            of the LBC:2102 cell sum (387.68 vs 387.59 V, 389.73 vs 389.75 V, 2026-10-21).
        HV_CURRENT_1:
          expression: "[S4:S7]/1024"
          unit: A
          min: "-600"
          max: "600"
          source: dalathegreat, py-nissan-leaf-obd-ble
          source_links:
            - https://github.com/dalathegreat/leaf_can_bus_messages
            - https://github.com/pbutterworth/nissan-leaf-obd-ble
          verified: false
          notes: >-
            Signed 32-bit /1024 A at data bytes 0-3. Positive = into the pack: -1.95 A in READY and
            +12.70 A while AC charging (2026-10-21); dalathegreat states the opposite sign. While
            charging it exceeds the charger output (4100 W / 389.7 V = 10.5 A), where HV_CURRENT_2
            reads 10.13 A, and the ratio between the two differs between captures (1.15, 1.25), so
            they are distinct quantities. OBDb vectors span -348..+99 A; limits leave room for e+
            peak current.
        HV_CURRENT_2:
          expression: "[S11:S14]/1024"
          unit: A
          min: "-600"
          max: "600"
          source: dalathegreat, py-nissan-leaf-obd-ble
          source_links:
            - https://github.com/dalathegreat/leaf_can_bus_messages
            - https://github.com/pbutterworth/nissan-leaf-obd-ble
          verified: false
          notes: >-
            Signed 32-bit /1024 A at data bytes 6-9, a second battery current beside HV_CURRENT_1
            with the same sign: -1.70 A in READY and +10.13 A while AC charging (2026-10-21), the
            latter within 4 % of the charger output current (OBC_OUT_PWR / HV_PACK_V). OBDb vectors
            span -296..+82 A.
        INSULATION_RAW:
          expression: "[B29:B30]"
          min: "0"
          max: "65535"
          source: dalathegreat
          source_links:
            - https://github.com/dalathegreat/leaf_can_bus_messages
          verified: false
          notes: >-
            Unscaled 16-bit at data bytes 22-23. dalathegreat lists it as 'Insulation' with unknown
            meaning. OBDb ZE1 vectors span 157-1023 (1023 = a 10-bit ceiling), so likely an
            isolation-monitor reading.
        GIDS:
          expression: ((B39*65536)+[B41:B42])/10000/100*((B44*65536)+[B45:B46])/10000*4.425
          unit: gid
          min: "0"
          max: "800"
          source: dalathegreat
          source_links:
            - https://github.com/dalathegreat/leaf_can_bus_messages
          verified: false
          notes: >-
            Derived: SOC/100 x AHr x 4.425 (dalathegreat). One 'gid' is about 80 Wh by Nissan's
            convention; temperature dependent, overstates charge when cold. OBDb vectors give 41-456
            on 40 kWh cars and 485-592 on e+ cars; a full new e+ pack reaches about 760.
        LBC_12V:
          expression: "[B27:B28]/1000"
          unit: V
          min: "0"
          max: "20"
          source: meatpiHQ/wican-fw leaf-ze1-2018-.json, OBDb
          source_links:
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/nissan/leaf-ze1-2018-.json
            - https://github.com/OBDb/Nissan-Leaf
          verified: false
          notes: >-
            12 V auxiliary battery voltage as seen by the LBC, 16-bit /1000 V at data bytes 20-21
            (after 61 01); upstream WiCAN calls it LV_V. Not an OBDb signal, but its 131 ZE1 2101
            vectors (2018-2024, 40 kWh and e+) all read 11.8-14.7 V: median 12.8 V in the 21 with
            zero pack current and never below 12.95 V in the 110 with current flowing, i.e. resting
            battery vs DC/DC converter charging. Same quantity as VCM:221103 VPWR_12V at 1 mV
            instead of 80 mV resolution.
      status: active
      period: 10000
      vehicle_states: [READY, CHARGING]
      notes: >-
        LBC data group 01 (service 0x21 read-by-local-identifier, 53-byte payload, 8 frames): pack
        current, pack voltage, 12 V, insulation, Hx, SOC and capacity (AHr). The upstream request
        key 21018 is 2101 plus a trailing ELM327 expected-response-frame-count digit, dropped here:
        canair learns response_frames itself.
    2104:
      parameters:
        HV_T_1:
          expression: S6
          unit: °C
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: true
          notes: >-
            Battery temperature sensor 1 (pack 1), signed byte at WiCAN S6. Matched LeafSpy Pro
            within 1 °C (around 10-11 °C); signed byte (OBDb's layout is signed 8-bit), so sub-zero
            readings decode negative. The PR suggests a -10..40 °C filter for startup spikes; not
            applied, since a pack can exceed 40 °C when rapid charging.
          min: "-40"
          max: "90"
        HV_T_2:
          expression: S10
          unit: °C
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: true
          notes: >-
