      status: active
      period: 600000
      vehicle_states: [READY, CHARGING]
      notes: >-
        LBC data group 0C (service 0x21, single frame): a 32-bit counter OBDb calls the battery
        controller distance counter.
    2161:
      parameters:
        SOH:
          expression: "[B6:B7]/100"
          unit: "%"
          min: "0"
          max: "100"
          source: OBDb, dalathegreat, OVMS
          source_links:
            - https://github.com/OBDb/Nissan-Leaf
            - https://github.com/dalathegreat/leaf_can_bus_messages
            - https://github.com/openvehicles/Open-Vehicle-Monitoring-System-3/blob/master/vehicle/OVMS.V3/components/vehicle_nissanleaf/src/vehicle_nissanleaf.cpp
          verified: true
          notes: >-
            State of health reported by the LBC itself, 16-bit /100 % at data bytes 2-3 of the
            331-byte group 61 reply; valid for both the 40 kWh and the 62 kWh e+ pack. Reproduces
            all 81 OBDb ZE1 2161 vectors (80-96 %, 40 kWh and e+ cars). AHr divided by this SOH
            gives a new-pack capacity of about 115.4 Ah (40 kWh) and 176.4 Ah (e+). On this car
            83.08 % in READY and while charging (2026-10-21), equal to the LeafSpy-verified
            SOH_40KWH (95.91 Ah / 115.44 Ah).
      status: active
      period: 300000
      vehicle_states: [READY, CHARGING]
      notes: >-
        LBC data group 61 (service 0x21, 331-byte payload, about 48 frames): SOH at data bytes 2-3.
        The rest looks like a second per-cell voltage table and is undecoded.
    2106:
      status: draft
      vehicle_states: [READY, CHARGING]
      notes: >-
        LBC data group 06 (service 0x21, 26-byte payload): per-cell balancing (shunt) flags. In both
        2026-10-21 captures (READY, AC charging) data bytes 12-23 read FF and both nibbles of bytes
        0-11 change between captures. That fits dalathegreat's layout (96 flags, 4 per nibble in
        '8421' order, in the first 12 bytes), not OVMS's (one nibble per byte over 24 bytes, bits
        inverted). Flag polarity unconfirmed, so not mapped.
    2184:
      status: static
      parameters:
        BATTERY_SERIAL:
          expression: "[B4:B26]"
          type: ascii
          source: dalathegreat
          source_links:
            - https://github.com/dalathegreat/leaf_can_bus_messages
          verified: false
          notes: >-
            HV battery serial number, 20 bytes of space-padded ASCII at data bytes 0-19
            (dalathegreat). Read 230UK118A9001507 in READY and while charging (2026-10-21); not yet
            checked against LeafSpy or the pack label.
      vehicle_states: [READY, CHARGING]
      notes: >-
        LBC data group 84 (service 0x21, 22-byte payload): HV battery serial number
        (BATTERY_SERIAL). Static, so a bare-ECU sweep skips it and it is never shipped to the
        device; query it with LBC:2184 or --include-static.

