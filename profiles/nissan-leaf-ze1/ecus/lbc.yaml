        96 cell words sum exactly to HV_PACK_V_2102 (387595 mV = 387.59 V; 389750 mV = 389.75 V),
        within 0.1 V of 2101 HV_PACK_V, and their max/min match 2103 within 1 mV. OBDb's 2018 and
