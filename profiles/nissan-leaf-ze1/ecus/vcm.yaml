            - https://github.com/pbutterworth/nissan-leaf-obd-ble
          verified: false
          notes: >-
            Traction motor power, 16-bit x40 W. OBDb and dalathegreat read it unsigned;
            py-nissan-leaf-obd-ble reads it signed. No OBDb vector exceeds 0x8000, so regen sign
            handling is unconfirmed.
      status: active
      period: 2000
      vehicle_states: [READY]
      notes: Traction motor power.
