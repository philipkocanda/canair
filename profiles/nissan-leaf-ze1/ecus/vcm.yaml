      status: active
      period: 2000
      vehicle_states: [READY]
      notes: Gear position.
    22115D:
      parameters:
        AMBIENT_T:
          expression: B4/2-40.5
          unit: °C
          min: "-40"
          max: "80"
          source: dalathegreat, OBDb, py-nissan-leaf-obd-ble
          source_links:
            - https://github.com/dalathegreat/leaf_can_bus_messages
            - https://github.com/OBDb/Nissan-Leaf
            - https://github.com/pbutterworth/nissan-leaf-obd-ble
          verified: false
          notes: >-
            Ambient temperature, x/2 - 40.5 °C. dalathegreat and OBDb use 0.9*x - 40.9 degF, which
            is exactly this; py-nissan-leaf-obd-ble uses x/2 - 40 (0.5 °C higher). dalathegreat's
            example 0x81 = 24 °C fits -40.5. Max 80 drops raw 0xFF (87 °C), which OBDb vectors show
            as an invalid reading.
      status: active
      period: 30000
      vehicle_states: [READY]
      notes: Ambient temperature.
