      status: active
      period: 2000
      vehicle_states: [READY]
      notes: Nominal motor torque.
    221146:
      parameters:
        MOTOR_PWR:
          expression: "[B4:B5]*40"
          unit: W
          min: "0"
          max: "2621400"
          source: OBDb, dalathegreat, py-nissan-leaf-obd-ble
          source_links:
