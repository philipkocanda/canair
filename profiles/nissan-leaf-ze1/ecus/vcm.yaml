VCM:
  tx_id: 0x797
  can_bus: [EV-CAN, CAR-CAN]
  rx_id: 0x79A
  identity:
    description: Vehicle Control Module, request 0x797
    notes: >-
      Seeded device-free from the charge-counter PIDs listed (but not shipped) in
      meatpiHQ/wican-fw#750: request 0x797 / response 0x79A (rx = tx + 3, an explicit rx_id override
      of the profile's +0x20). VCM is the name dalathegreat and OBDb use for this address; OVMS
      calls it CHARGER_TXID. Source: https://github.com/meatpiHQ/wican-fw/pull/750
    identity_confidence: tentative
  pids:
    221203:
      status: active
      parameters:
        QC_COUNT:
          expression: "[B4:B5]"
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: false
          notes: Quick (DC) charge count, 16-bit at WiCAN [B4:B5].
      vehicle_states: [READY]
      notes: >-
        Quick-charge counter DID. Listed in the PR body (upstream key 2212031) and decoded
        identically by OBDb, dalathegreat and OVMS; default 5 s period is far faster than needed,
        the count only changes on a quick charge.
    221205:
      status: active
      parameters:
        L2_COUNT:
          expression: "[B4:B5]"
          source: meatpiHQ/wican-fw#750 (TyzzyT)
          source_links:
            - https://github.com/meatpiHQ/wican-fw/pull/750
          verified: false
          notes: L1/L2 (AC) charge count, 16-bit at WiCAN [B4:B5].
      vehicle_states: [READY]
      notes: >-
        L1/L2 charge counter DID. Listed in the PR body (upstream key 2212051) and decoded
        identically by OBDb, dalathegreat and OVMS; the count only changes when an AC charge starts.
    221102:
      parameters:
        VCM_SPEED:
          expression: B4
          unit: km/h
          min: "0"
          max: "255"
          source: OBDb
          source_links:
            - https://github.com/OBDb/Nissan-Leaf
          verified: false
          notes: Vehicle speed seen by the VCM, one byte, 1 km/h per bit.
      status: active
      period: 2000
      vehicle_states: [READY]
      notes: Vehicle speed (VCM).
    221103:
      parameters:
        VPWR_12V:
          expression: B4*0.08
          unit: V
          min: "0"
          max: "20"
          source: OBDb, dalathegreat, py-nissan-leaf-obd-ble
          source_links:
            - https://github.com/OBDb/Nissan-Leaf
            - https://github.com/dalathegreat/leaf_can_bus_messages
            - https://github.com/pbutterworth/nissan-leaf-obd-ble
          verified: false
          notes: 12 V battery voltage as read by the VCM, 0.08 V per bit (OBDb divides by 12.5).
      status: active
      period: 10000
      vehicle_states: [READY]
      notes: 12 V battery voltage.
    221106:
      parameters:
        AC_ON:
          expression: B4
          type: enum
          values:
            0: "OFF"
            1: "ON"
          source: OBDb, dalathegreat, py-nissan-leaf-obd-ble
          source_links:
            - https://github.com/OBDb/Nissan-Leaf
            - https://github.com/dalathegreat/leaf_can_bus_messages
            - https://github.com/pbutterworth/nissan-leaf-obd-ble
          verified: false
          notes: >-
            A/C compressor request, 0/1. Reproduces 30 OBDb ZE1 vectors (37 across all model years).
      status: active
      period: 5000
      vehicle_states: [READY]
      notes: A/C state.
    22110F:
      parameters:
        REAR_HEATER:
          expression: B4
          type: enum
          values:
            162: "ON"
          source: OBDb, dalathegreat, py-nissan-leaf-obd-ble
