BMS:
  tx_id: 0x7E4
  identity:
    description: Battery Management System (64 kWh LG, 98S)
    notes: Seeded device-free from OBDb + wican-fw Niro/Soul/Kona; unverified on a real car.
  pids:
    220101:
      status: active
      parameters:
        SOC_BMS:
          expression: B10/2
          unit: "%"
          ha_class: battery
          min: "0"
          max: "100"
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
          notes: Raw BMS state of charge (not display-adjusted; see SOC_DISPLAY on 220105).
        BATTERY_CURRENT:
          expression: "[S17:B18]/10"
          unit: A
          ha_class: current
          min: "-400"
          max: "400"
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
          notes: Signed 16-bit BE. Negative = charging.
        BATTERY_VOLTAGE:
          expression: "[B19:B20]/10"
          unit: V
          ha_class: voltage
          min: "240"
          max: "450"
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
          notes: HV pack DC voltage.
        BATTERY_POWER:
          expression: (([B19:B20]/10)*([S17:B18]/10))/1000
          unit: kW
          ha_class: power
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
          notes: Computed voltage x current. Negative = charging.
        AVAILABLE_CHARGE_POWER:
          expression: "[B11:B12]/100"
          unit: kW
          ha_class: power
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
          notes: BMS-permitted charge power limit.
        AVAILABLE_DISCHARGE_POWER:
          expression: "[B13:B14]/100"
          unit: kW
          ha_class: power
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
          notes: BMS-permitted discharge power limit.
        CHARGING:
          expression: B15:0
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
          notes: Energy flowing into the pack (AC or DC).
        RAPID_CHARGE_PORT:
          expression: B15:1
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
          notes: DC rapid-charge port active.
        NORMAL_CHARGE_PORT:
          expression: B15:2
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
          notes: AC normal-charge port active.
        BMS_MAIN_RELAY:
          expression: B15:7
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
