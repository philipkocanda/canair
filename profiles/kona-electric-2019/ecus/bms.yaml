          verified: false
          notes: >-
            Cells 1-32: one byte per cell, raw/50 V, from B10 after the four FF bytes of the
            cell-present header (B5-B7, B9). 98-cell pack: the mean of all 98 cells sums to 358.7 V
            (2022-12-07) and 353.9 V (2023-01-12) against a BMS pack voltage of 359.8 V and 354.7 V.
