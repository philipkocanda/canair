    220106:
      status: active
      parameters:
        BATTERY_WCS_INLET_TEMP:
          expression: S10
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "100"
          source: OBDb Hyundai-Kona-Electric (KONAEV_HVBAT_WCS_INLET_T; offset via canair bix)
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
          verified: false
          notes: >-
            Signed byte, 27-30 C. Tracks 220101 BATTERY_INLET_TEMP (r 0.999, slope 0.995, n 159), so
            the same sensor read twice.
        BATTERY_FAN_DUTY:
          expression: B14
          unit: "%"
          min: "0"
          max: "100"
          source: OBDb Hyundai-Kona-Electric (KONAEV_HVBAT_FAN_DUTY; offset via canair bix)
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
          verified: false
          notes: >-
            Reads 10, 36, 48 and 61 in the 2023-01-12 log; fan feedback in 220101 stays 0 Hz
            throughout.
        AC_COMPRESSOR_RPM:
          expression: B19*20
          unit: rpm
          min: "0"
          max: "5100"
          source: OBDb Hyundai-Kona-Electric (KONAEV_AC_COMP_RPM; offset via canair bix)
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
          verified: false
          notes: >-
            0 to 1700 rpm in 21 steps of 20 rpm, so the compressor runs and stops in the 2023-01-12
            log. Raw x20.
        BATTERY_PRA_TEMP:
          expression: S28*2
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "150"
          source: OBDb Hyundai-Kona-Electric (KONAEV_HVBAT_PRA_T; offset via canair bix)
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
          verified: false
          notes: >-
            Power relay assembly temperature, signed byte x2. Constant 30 C in both logs (raw 15).

