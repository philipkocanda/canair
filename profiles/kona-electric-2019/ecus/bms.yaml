            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
          notes: HV main relay closed.
        BATTERY_MAX_TEMP:
          expression: S21
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          verified: false
        BATTERY_MIN_TEMP:
