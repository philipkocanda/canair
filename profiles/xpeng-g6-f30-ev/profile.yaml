# Xpeng G6 (87.5 kWh) — vehicle profile settings (created by `canair profile create`)
# Per-ECU definitions live in ecus/. Populate with `canair discover --register`
# (add --identify to read identity DIDs), then `canair pids ...`. Validate with
# `canair validate`.
#
car_model: "XPeng G6 (F30)"  # built on an 87.5 kWh car
# Former names that still resolve to this profile.
aliases:
  xpeng-g6: {variant: 87kwh}  # the old profile named this one car
# The upstream ELM327 init is
# ATH1;ATSP6;ATS0;ATM0;ATAT1;ATSH704;ATCRA784;ATFCSH704;ATFCSM1 — the header,
# receive filter and flow control are set per ECU by canair itself (from
# addressing.rx_offset below), so only the neutral protocol/format bits are kept
# here (wican-ws transport only; the slcan-tcp raw path ignores init).
#
# Long multi-frame mitigation (see KNOWN-ISSUES.md): the BMS cell-voltage DID
# 221122 is a ~33-frame ISO-TP response the WiCAN AutoPID firmware truncates
# around ~130 cells. ATSTFF widens the per-frame timeout to the ~1044 ms max
# (0xFF x 4.096 ms; from ~614 ms). The other half, explicit flow control with
# BS=0 / STmin=0 (ATFCSD300000), comes with the response offset: canair's ELM327
# path and the generated AutoPID init enable it for every non-+0x08 ECU.
# UNVERIFIED (device-free profile). Firmware still filters ATH0/ATS0/ATE1, so the
# ASCII footprint can't be reduced from here; the 1000 ms cap needs a reflash.
init: "ATSP6;ATS0;ATAL;ATSTFF;"

# XPeng is ISO 15765-4 11-bit / 500 kbit (ATSP6).
can_bitrate: 500000

# Vehicle-axis physical bands for the reference-free plausibility scan
# (`canair hunt --physical` / `canair investigate`). The default hv_pack band
# (300-450 V) is for a ~400 V car and would MISS this 800 V architecture. The
# 87.5 kWh pack is ~200S (~700 V nominal): 200 x 2.5 V (empty) to 200 x 4.2 V
# (full) ~= 500-840 V. rail_12v + grid bands keep their defaults.
physical_bands:
  hv_pack: [450, 850]   # HV traction pack V (800 V architecture, ~700 V nominal)

# CAN diagnostic addressing. XPeng answers at tx_id + 0x80 (request 0x704 ->
# response 0x784, from the upstream ATSH704/ATCRA784), NOT the +0x08 default.
addressing:
  rx_offset: 0x80

# ELM327 response timeout in ms, applied as ATSTxx (--elm-timeout overrides).
# Raise it for slow-responding ECUs; lower it to speed up cycles / NO-DATA
# detection. Left unset, the ELM327 default applies.
# response_timeout_ms: 500

# Client-side ISO-TP tuning for the slcan-tcp transport. Defaults suit most
# 11-bit/classic-CAN vehicles; override per this car's needs. See
# canlib/transport/isotp_params.py for every field + default.
# isotp:
#   tx_padding: 0xAA   # fill byte canair pads its requests with (0x00/0xCC on some makes)
#   rx_padding: 0xAA   # fill byte the ECUs pad replies with (default: tx_padding)
#   can_fd: false      # true for CAN-FD ECUs
