VMCU:
  tx_id: 0x7E2
  identity:
    description: Vehicle Control Unit (EPCU; VCU + LDC integrated)
    id_protocol: KWP2000
    notes: >-
      KWP2000 by behaviour in the 2021 Kona Car Scanner logs (captures/can/221210-1, 221210-2): 10
      03 -> NRC 12, 10 90 -> 50 90, 20 -> 60, 18 {00|20|60} {FF00|8000|4000} -> 58 (status 02 -> NRC
      12), 19 -> NRC 11/12. Identity service (1A) not yet seen.
  pids:
    2101:
      status: active
      source_links:
        - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
      verified: false
      parameters:
        VEHICLE_SPEED:
          expression: ((S20 << 8) | B19)*1.609344/100
          unit: km/h
          min: "-20"
          max: "220"
          source: OBDb Hyundai-Kona-Electric (KONAEV_VSS; offsets via canair bix)
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
          notes: >-
            Signed 16-bit little-endian, native mph x 1.609344. The verified Ioniq uses the
            identical byte order.
        EV_READY:
          expression: B26:3
          source: wican-fw Niro/Soul/Kona (Car_Ready)
          notes: HV system ready / driveable.
        PARK_BRAKE:
          expression: B26:5
          source: wican-fw Niro/Soul/Kona (Car_ParkBreak)
          notes: Electronic park brake engaged.
        GEAR_SELECTOR_RAW:
          expression: B10
          source: wican-fw Niro/Soul/Kona (GearSelector_Raw)
          notes: Raw gear selector code (P/R/N/D mapping TBD).
    2102:
      status: active
      source_links:
        - https://github.com/OBDb/Hyundai-Kona-Electric
      parameters:
        LDC_OUTPUT_CURRENT:
          expression: "[B22:B23]/100"
          unit: A
          min: "0"
          max: "655"
          source: OBDb Hyundai-Kona-Electric (KONAEV_AUX_AMPS_LDC; offset via canair bix)
          verified: false
          notes: >-
            Unsigned 16-bit big-endian. 31.2-34.0 A with the car READY and stationary; rises with
            220101 BATTERY_POWER (r 0.46, n 38). At 13.2 V that is about 420 W, a plausible idle
            load.
        AUX_BATTERY_VOLTAGE_VMCU:
          expression: ((S27 << 8) | B26)/1000
          unit: V
          min: "0"
          max: "20"
          source: OBDb Hyundai-Kona-Electric (KONAEV_AUX_V_7E2; offset via canair bix)
          verified: false
          notes: >-
            Signed 16-bit little-endian (OBDb flags the pair byte-swapped), mV. 13.23-13.29 V; BMS
            220101 AUX_BATTERY_VOLTAGE reads 13.1-13.2 V over the same minutes, 0.08 V lower. Read
            as big-endian it would be -20 to -5 V.

  research:
    - type: decode
      target: "2102"
      status: captured
      priority: P3
      vehicle_states: [READY]
      created: "2026-10-29"
      updated: "2026-10-30"
      notes: >-
        Defined: LDC_OUTPUT_CURRENT (B22:B23) and AUX_BATTERY_VOLTAGE (little-endian B26:B27, within
        0.1 V of BMS aux voltage). OBDb's aux battery current (B28:B29) reads a constant high byte
        0x81 with a varying low byte; as signed LE that is about -32 A beside +32 A LDC output,
        which does not add up, so it is left undefined. Aux SOC (B30) is a constant 0xFF.
      sources:
        - OBDb Hyundai-Kona-Electric
