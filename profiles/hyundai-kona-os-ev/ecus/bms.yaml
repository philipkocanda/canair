BMS:
  tx_id: 0x7E4
  identity:
    description: Battery Management System (64 kWh LG, 98S)
    notes: >-
      Seeded device-free from OBDb + wican-fw Niro/Soul/Kona; unverified on a real car. UDS by
      behaviour in the 2021 Kona Car Scanner logs (captures/can/221210-1, 221210-2): 10 03 -> 50 03
      (P2 50 ms, P2* 5000 ms), 19 02 -> 59 02 FF, 18 -> NRC 11, no reply to 10 90. Relay IOControl
      is UDS 2F F0xx (captures/can/bms-*.asc).
    id_protocol: UDS
  pids:
    220101:
      status: active
      source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
      source_links:
        - https://github.com/OBDb/Hyundai-Kona-Electric
        - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
      verified: false
      parameters:
        SOC_BMS:
          expression: B10/2
          unit: "%"
          ha_class: battery
          min: "0"
          max: "100"
          notes: Raw BMS state of charge (not display-adjusted; see SOC_DISPLAY on 220105).
        BATTERY_CURRENT:
          expression: "[S17:S18]/10"
          unit: A
          ha_class: current
          min: "-400"
          max: "400"
          notes: >-
            Signed 16-bit BE; negative = charging. Seeded as [S17:B18], which does not parse. Reads
            +0.5 to +10.1 A across the stationary 2019 dongle logs (positive = discharge); the
            charging sign is not exercised there.
        BATTERY_VOLTAGE:
          expression: "[B19:B20]/10"
          unit: V
          ha_class: voltage
          min: "240"
          max: "450"
          notes: HV pack DC voltage.
        BATTERY_POWER:
          expression: (([B19:B20]/10)*([S17:S18]/10))/1000
          unit: kW
          ha_class: power
          notes: >-
            Computed voltage x current; negative = charging. Seeded with the unparseable [S17:B18].
        AVAILABLE_CHARGE_POWER:
          expression: "[B11:B12]/100"
          unit: kW
          ha_class: power
          notes: BMS-permitted charge power limit.
        AVAILABLE_DISCHARGE_POWER:
          expression: "[B13:B14]/100"
          unit: kW
          ha_class: power
          notes: BMS-permitted discharge power limit.
        BMS_B15_7_UNKN:
          expression: B15:7
          notes: >-
            B15 bit 7 (OBDb bix 72, labelled HV battery charging). 1 in all 166 captures of
            2021-05-21 (ignition off: 12V top-up, sleep entry, AC charge and after unplug, relay
            open and 0 A included); 0 in all 1489 captures with ignition on (B62:2 = 1).
        RAPID_CHARGE_PORT:
          expression: B15:6
          notes: >-
            DC rapid-charge port active. Bit 6 of B15 (OBDb bix 73, MSB-first). Clear throughout the
            2019 dongle logs (including a READY car); never seen set.
        BMS_B15_5_UNKN:
          expression: B15:5
          notes: >-
            B15 bit 5 (OBDb bix 74, labelled normal charge port). 0 in every capture, including a
            7.4 kW AC charge on 2021-05-21.
        BMS_MAIN_RELAY:
          expression: B15:0
          notes: >-
            HV main relay closed. Bit 0 of B15 (OBDb bix 79, MSB-first). Set throughout the 2019
            logs, where upstream says the car was READY (221207-1); a READY Ioniq reads the same
            0x03. On 2021-05-21 set during a 12V top-up and an AC charge, clear from 1 s after the
            charge stopped. Bit 1 equals bit 0 in every capture and is unmapped.
        BATTERY_MAX_TEMP:
          expression: S21
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
        BATTERY_MIN_TEMP:
          expression: S22
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
        BATTERY_MODULE_TEMP_1:
          expression: S23
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
        BATTERY_MODULE_TEMP_2:
          expression: S25
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
        BATTERY_MODULE_TEMP_3:
          expression: S26
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
        BATTERY_MODULE_TEMP_4:
          expression: S27
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
        BATTERY_INLET_TEMP:
          expression: S30
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "80"
          notes: Battery inlet air temperature.
        MAX_CELL_VOLTAGE:
          expression: B31/50
          unit: V
          ha_class: voltage
          min: "0"
          max: "5"
        MAX_CELL_VOLTAGE_NO:
          expression: B33
          notes: Index of the highest-voltage cell.
        MIN_CELL_VOLTAGE:
          expression: B34/50
          unit: V
          ha_class: voltage
          min: "0"
          max: "5"
        MIN_CELL_VOLTAGE_NO:
          expression: B35
          notes: Index of the lowest-voltage cell.
        FAN_STATUS:
          expression: B36
          notes: HV battery cooling fan step.
        FAN_FEEDBACK:
          expression: B37
          unit: Hz
          notes: HV battery fan speed feedback.
        AUX_BATTERY_VOLTAGE:
          expression: B38/10
          unit: V
          ha_class: voltage
          min: "0"
          max: "16"
          notes: 12V auxiliary battery.
        INVERTER_CAPACITOR_VOLTAGE:
          expression: (B63 << 8) | B65
          unit: V
          ha_class: voltage
          min: "0"
          max: "450"
          source: OBDb Hyundai-Kona-Electric (bix 408)
          notes: >-
            Tracks BATTERY_VOLTAGE (352-354 V) with the main relay closed; decays 354 to 210 V over
            15 s after the relay opens (2021-05-21 AC charge end); 0 asleep.
        IGNITION:
          expression: B62:2
          source: OBDb Hyundai-Kona-Electric (bix 405)
          notes: >-
            1 in all 1489 captures of the 2019/2021 dongle logs (READY or parked with ignition on);
            0 in all 166 ignition-off captures of 2021-05-21.
    220105:
      status: active
      source: OBDb Hyundai-Kona-Electric (offsets via canair bix)
      source_links:
        - https://github.com/OBDb/Hyundai-Kona-Electric
      verified: false
      parameters:
        SOH:
          expression: "[B34:B35]/10"
          unit: "%"
          ha_class: battery
          min: "0"
          max: "100"
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          notes: Battery state of health.
        SOC_DISPLAY:
          expression: B41/2
          unit: "%"
          ha_class: battery
          min: "0"
          max: "100"
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          notes: Dashboard (display) SOC; differs from raw SOC_BMS.
        MIN_DETERIORATION:
          expression: "[B37:B38]/10"
          unit: "%"
          source: OBDb Hyundai-Kona-Electric (offsets via canair bix) + wican-fw Niro/Soul/Kona
          source_links:
            - https://github.com/OBDb/Hyundai-Kona-Electric
            - https://github.com/meatpiHQ/wican-fw/blob/main/vehicle_profiles/kia/nirosoulkona-ev.json
          notes: Minimum cell deterioration.
        CELL_VOLTAGE_DEVIATION:
          expression: B28/50
          unit: V
          ha_class: voltage
          min: "0"
          max: "5"
          notes: Max-min cell voltage spread.
        HEATER_TEMP:
          expression: S31
          unit: °C
          ha_class: temperature
          min: "-40"
          max: "120"
          notes: Battery heater 1 temperature.
        MAX_DETERIORATION_CELL_NO:
          expression: B36
          notes: Index of the most-deteriorated cell.
        MIN_DETERIORATION_CELL_NO:
          expression: B39
          notes: Index of the least-deteriorated cell.
        CELL_97_VOLTAGE:
          expression: B44/50
          unit: V
          ha_class: voltage
          min: "0"
          max: "5"
          source: OBDb Hyundai-Kona-Electric (KONAEV_HVBAT_CMUnnn_VOLT; offset via canair bix)
          notes: >-
            Cell 97, at the end of 220105 (OBDb bix 272). Reads 3.60-3.66 V like cells 1-96; with
            CELL_98 it completes the 98-cell sum used in the 220102 note.
        CELL_98_VOLTAGE:
          expression: B45/50
          unit: V
          ha_class: voltage
          min: "0"
          max: "5"
          source: OBDb Hyundai-Kona-Electric (KONAEV_HVBAT_CMUnnn_VOLT; offset via canair bix)
    220102:
      status: active
