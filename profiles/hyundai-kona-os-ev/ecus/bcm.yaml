          unit: bar
          ha_class: pressure
          min: "0"
          max: "5"
          source: OBDb Hyundai-Kona-Electric (KONAEV_TP_FL, raw/5 psi; offset via canair bix); same byte as the Ioniq BCM
          notes: >-
            The front left tyre. Raw byte / 5 = psi. Reads 0 in all 60 captures: the sensor was not
            reporting, so the scaling is untested here.
