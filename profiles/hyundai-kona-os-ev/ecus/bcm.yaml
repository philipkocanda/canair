BCM:
  tx_id: 0x7A0
  identity:
    description: Body Control Module (TPMS, body state)
    id_protocol: UDS

  research:
    - type: decode
      target: 22C00B
      status: captured
      priority: P2
      vehicle_states: [ALL]
      created: "2026-10-29"
      updated: "2026-10-30"
      notes: >-
        Eight signals defined at the Ioniq's offsets (OBDb agrees). All 60 captures read 0 psi and
        -50 C: the 2019 car's tyre sensors were not reporting, so the scaling is untested. The
        constant 2 at B13/B18/B22/B27 is not the Ioniq's sensor-state byte (B12/B17/B21/B26).
      sources:
        - OBDb Hyundai-Kona-Electric
    - type: decode
      target: 22B00C
      status: pending
      priority: P3
      vehicle_states: [ACC]
      created: "2026-10-29"
      updated: "2026-10-29"
      notes: Heated steering wheel (OBDb KONAEV_HEATED_WHEEL).
      sources:
        - OBDb Hyundai-Kona-Electric
