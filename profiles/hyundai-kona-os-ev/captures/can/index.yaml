- file: bms-idle-no-function.asc
  format: asc
  source: https://github.com/projectgus/hyundai-kona-ev-can-logs (CC0), bms_diagnostics/Idle log (no diagnostic function selected).asc
  label: 'BMS diagnostic tool: idle, no function selected'
  notes: Kona 2021 64 kWh battery pack on the bench, powered and on P-CAN only, no other components; logged from a community diagnostic tool talking to the BMU (tester 7E4, reply 7EC). UDS 2F F0xx 03 closes a contactor and 2F F0xx 00 releases it (F030 main relay -, F031 precharge, F036 quick-charger relays, F038 main relay +), with 3E 00 keepalives. Contributed by a user of Dala's EV Discord per the upstream README; unclear what safeguards the tool applies. Log date from the .asc header. Imported 2026-10-30 as a reference for UDS IOControl framing on an HKMC ECU.
