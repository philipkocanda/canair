# yaml-language-server: $schema=http://json-schema.org/draft-07/schema#
# ECU files: the profile's ecus/<name>.yaml, one file per ECU
#
# Each file is the SINGLE source of truth for one ECU: its address, identity, probe history, DTC
# meanings, and all readable and actuatable data. The ECU's short name is the one top-level key:
#
#   BCM:
#     tx_id: 0x7A0
#     identity: {description: Body Control Module, id_protocol: UDS}
#     pids:
#       22B001:
#         status: active
#         parameters:
#           DOOR_FL: {expression: "B4:0", type: enum, values: {0: closed, 1: open}}
#
# `canair validate pids` (alias `validate ecus`) and every ECU editor check a file against this
# schema (src/canair/validation/ecu_file.py), then check what a schema cannot:
#
#   - the tx_id/rx_id width, which depends on the addressing mode (0x7FF for the 11-bit modes);
#   - the vocabularies of other files: vehicle_states (vehicle_states.yaml), can_bus
#     (can_buses.yaml), variants (variants.yaml), and the ECU's own revisions;
#   - parsing: WiCAN expressions, support maps, iocontrol requests and their release, the
#     iocontrol_scan_ranges, memory reads, and signal categories against their unit;
#   - the session_mode of an actuator against the session blocklist;
#   - a PID key that YAML read as an octal integer (write "0105":, not 0105:), and keys repeated
#     in one mapping;
#   - legacy fields, with the migration to run (they are listed below with a deprecationMessage);
#   - across files: ECU names, shipped signal names and send_to topics must be unique.
#
# An unknown field is a warning (`x-warn: [additionalProperties]`), except in identity:, wake:,
# addressing: and isotp:, where it is an error.
#
# Python vocabularies pinned to this file by tests (tests/validation/test_ecus_schema.py):
# PID_STATUSES (canair.ecus.pid_status), VALID_TYPES (canair.expression.decode_value),
# KNOWN_METHODS (canair.ecus.wake), ECU_ISOTP_FIELDS (canair.transport.isotp_params),
# IDENTITY_FIELDS (canair.ecus.registry), ID_PROTOCOL_VALUES (canair.uds.protocol),
# SECTION_FIELDS (canair.ecus.dtc_definitions), MEMORY_FIELDS (canair.ecus.memory),
# DECL_FIELDS (canair.uds.support_map), SCAN_LOG_FIELDS (canair.yaml_edit.ecu), and the
# research choices of `canair pids add-research`.
#
# Profile-wide settings live one level up, in profile.yaml (profile_schema.json).

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://philipkocanda.github.io/canair/schema/ecus.json"
title: canair ecus/<name>.yaml
description: >-
  One ECU of a canair vehicle profile: its address, identity, PIDs and signals, actuators, DTC
  meanings and research backlog. The ECU's short name is the top-level key.
type: object
additionalProperties:
  $ref: "#/definitions/ecu"

definitions:
  text:
    type: string
  texts:
    type: array
    items:
      type: string
  notes:
    type: string
    description: Free text. Keep it technical.
  can_id:
    type: integer
    minimum: 0
    maximum: 0x1FFFFFFF
  hex_byte:
    type: string
    pattern: "^[0-9A-Fa-f]{2}$"
    errorMessage: >-
      must be one quoted hex byte (e.g. "03" or "C0"); quote it, or YAML reads it as a number
  vehicle_states:
    type: array
    uniqueItems: true
    items:
      type: string
    description: >-
      Power states, from the profile's vehicle_states.yaml (SLEEP, PLUGGED, ACC, "ON", READY,
      CHARGING, IG3 on the bundled Ioniq). Quote "ON": YAML reads a bare ON as true. The tokens are
      independent properties: [SLEEP, PLUGGED] means both. [] means untested.

  # Fields a PID can state once for all its signals, and a signal for itself; a dtcs: section and
  # its entries use the same ones. A signal's own value, including an explicit "" / [] / false,
  # wins over its PID's.
  unit:
    type: string
    description: Display unit.
  bound:
    type: [number, string]
    description: A number, or a numeric string.
  verified:
    type: boolean
    description: Checked on a real car.
  source:
    type: string
    description: Where the decoding came from.
  source_links:
    type: array
    items:
      type: string
    description: References for source.

  ecu:
    type: object
    x-warn: [additionalProperties]
    required: [tx_id]
    additionalProperties: false
    properties:
      tx_id:
        $ref: "#/definitions/can_id"
        description: >-
          Request arbitration ID, in hex. 11-bit (0x000-0x7FF) for normal addressing; a full 29-bit
          ID (e.g. 0x18DA10F1) in a 29-bit addressing mode.
      rx_id:
        $ref: "#/definitions/can_id"
        description: >-
          Response arbitration ID, for an ECU that does not follow the profile's rule (tx_id + the
          addressing.rx_offset, default 0x08, in the 11-bit modes; the byte-swapped ID in
          normal_fixed_29bit).
      identity:
        $ref: "#/definitions/identity"
      addressing:
        $ref: "#/definitions/addressing"
      isotp:
        $ref: "#/definitions/isotp"
      can_bus:
        type: array
        uniqueItems: true
        items:
          type: string
        description: >-
          The CAN bus segments the ECU sits on, as codes from the profile's can_buses.yaml (bus
          names are vendor-specific: B-CAN/P-CAN on Hyundai, HS/MS on Ford). A gateway spans them
          all ([ALL]).
      vehicle_states:
        $ref: "#/definitions/vehicle_states"
        description: The power states in which the ECU answers session control (10 01).
      wake:
        $ref: "#/definitions/wake"
      session:
        type: boolean
        description: The ECU needs the extended diagnostic session (10 03).
      sessions:
        $ref: "#/definitions/sessions"
      multi_did:
        type: boolean
        description: Try UDS service-22 multi-DID batching on this ECU.
      multi_did_max:
        $ref: "profile.json#/properties/multi_did_max"
        description: Most DIDs per multi-DID request (overrides profile.yaml; default 3).
      response_timeout_ms:
        $ref: "profile.json#/properties/response_timeout_ms"
        description: >-
          This ECU's response budget in ms, for a slow ECU (the global --timeout overrides it).
      scan_log:
        type: array
        description: Which services and ranges were probed on this ECU, and what they found.
        items:
          $ref: "#/definitions/scan_log_entry"
      dtcs:
        $ref: "#/definitions/dtcs"
      pids:
        type: object
        description: >-
          Readable PIDs, keyed by request (22C00B, 2101). Quote a key with a leading zero ("0105"):
          YAML reads 0105 as an octal number. An identity-only module omits this.
        additionalProperties:
          $ref: "#/definitions/pid"
      iocontrol:
        type: object
        description: >-
          Curated actuators: UDS InputOutputControlByIdentifier (0x2F), or KWP2000
          InputOutputControlByLocalIdentifier (0x30). Keyed by DID (BC01), or by a free label on
          KWP2000. Run one with `canair io <ECU> --did <DID>`.
        additionalProperties:
          $ref: "#/definitions/iocontrol_entry"
      iocontrol_discoveries:
        type: object
        description: >-
          What `canair scan iocontrol` found (UDS 0x2F SF 00, or KWP2000 0x30 IOCP 00), keyed by
          DID. Kept apart from iocontrol: so a rescan never overwrites a curated entry. A discovery
          becomes an iocontrol: entry by hand, once its requests are verified on the car.
        additionalProperties:
          $ref: "#/definitions/hit"
      iocontrol_scan_ranges:
        type: array
        items:
          type: string
        description: >-
          "START-END" hex DID ranges `canair scan iocontrol` sweeps on this ECU (["B000-BFFF"]).
          Without it, the ranges come from the ECU's PIDs, else the whole DID space.
      research:
        type: array
        description: >-
          Open work: untested PIDs, undecoded captures, pending scans. An entry graduates to pids:
          or iocontrol: once decoded and verified, and is then marked done.
        items:
          $ref: "#/definitions/research_entry"
      routines:
        type: object
        description: >-
          What `canair scan routines` found: UDS 0x31 SF 03 (requestRoutineResults) with 4-digit
          RID keys, or KWP2000 0x33 with 2-digit LID keys. Leads only: starting a routine is a
          manual step that needs explicit consent.
        additionalProperties:
          $ref: "#/definitions/hit"
      revisions:
        description: >-
          The versions of this ECU that differ in protocol or decoding, keyed by a local ID naming
          what differs (KWP, UDS, 150s); the first is the reference. Each may override identity
          (only id_protocol), sessions, wake, multi_did, multi_did_max, response_timeout_ms,
          addressing and rx_id, and lists the fingerprints that recognise it ({identity: {...}},
          {responds: "1A90"}, {software: "F195:1.04*"}). Edit with `canair ecu revisions`; checked
          by src/canair/variants/revisions.py.
      variants:
        description: >-
          The variants (IDs from variants.yaml) this ECU is fitted to; absent means all. Edit with
          `canair ecu set-variants`.
      memory:
        description: >-
          ReadMemoryByAddress (service 0x23): how a memory read is formed, and what `canair scan
          memory` found. Edit with `canair memory set` and `canair scan memory`; checked by
          src/canair/ecus/memory.py.
        properties:
          format:
            description: The UDS addressAndLengthFormatIdentifier ("24"), or kwp.
          max_block:
            description: The largest read that worked, in bytes.
          session:
            description: The session the reads need, when not the default ("03").
          regions:
            description: "The scan map: [{start, end, result, nrc, software, scanned}]."
      availability:
        deprecationMessage: renamed to vehicle_states (run scripts/migrate_states_status.py)

  # Who the module is. The version-ish fields are near-synonyms by necessity (each marque names
  # its identity DIDs differently), so `validate pids` warns when two synonyms hold the same
  # value: keep the field that names what the ECU reported.
  identity:
    type: object
    description: Who this module is. Every field is optional.
    additionalProperties: false
    properties:
      alias:
        description: A second name the ECU calls itself (SMK for SKM).
      description:
        description: Human-readable module name.
      part_number:
        description: From F187 (UDS), or 1A 87 (KWP2000; 1A 91 on Hyundai/Kia).
      mfg_date:
        description: Manufacturing or calibration date.
      hw_version:
        description: Hardware version.
      sw_version:
        description: Software version.
      hw_sw:
        description: A combined hardware/software ID (some ECUs).
      boot_sw:
        description: Boot software identification (F180; F100 is not it on Hyundai/Kia).
      app_sw:
        description: Application software version.
      fw_version:
        description: Firmware version.
      firmware:
        description: Firmware identification.
      serial:
        description: From F18C (UDS), or 1A 8C (KWP2000) except on Hyundai/Kia.
      ecu_id:
        description: Module code (KWP2000 1A 8C on Hyundai/Kia).
      sw_id:
        description: Software identification.
      calibration:
        description: Calibration identification.
      supplier:
        description: Who makes the module.
      diag_address:
        description: Legacy name for F1A0, which Hyundai/Kia use for their software version.
      vin:
        description: From F190.
      id_protocol:
        enum: [UDS, KWP2000, none, unknown]
        description: >-
          How the identity is read: UDS (ISO 14229, 22 F1xx), KWP2000 (ISO 14230, 1A 8x/9x), none
          (answers session control, exposes no identity), or unknown (not yet determined).
      identity_confidence:
        enum: [confirmed, probable, tentative, speculative]
        description: >-
          How well the identity is established; omit it to let canair derive it. confirmed: read
          from the ECU (part number) or verified on this car. probable: self-reported fields, or
          several pieces of circumstantial evidence. tentative: one weak basis (an address match on
          another car, a behavioural guess). speculative: little or no support.
      notes:
        $ref: "#/definitions/notes"

  addressing:
    type: object
    description: >-
      This ECU's addressing, over the profile's addressing: block. No rx_offset here: a per-ECU
      rx_id is the per-ECU response override.
    additionalProperties: false
    properties:
      mode:
        $ref: "profile.json#/properties/addressing/properties/mode"
      target_address:
        $ref: "profile.json#/properties/addressing/properties/target_address"
        description: ISO-TP target address byte (extended 11-bit schemes such as BMW and PSA).
      source_address:
        $ref: "profile.json#/properties/addressing/properties/source_address"
        description: Tester address byte (default 0xF1).
      fc_id:
        type: integer
        exclusiveMinimum: 0
        description: >-
          Flow-control arbitration ID, for an ECU that takes a functional request and answers
          physically (Renault, Mitsubishi).

  isotp:
    type: object
    description: >-
      This ECU's own ISO-TP flow control on slcan-tcp, over the profile's isotp: block. For an ECU
      that sends no consecutive frame after a FlowControl with BlockSize 0.
    minProperties: 1
    propertyNames:
      enum: [blocksize, rx_flowcontrol_timeout, rx_consecutive_frame_timeout]
      errorMessage: >-
        cannot be set per ECU (allowed: blocksize, rx_flowcontrol_timeout,
        rx_consecutive_frame_timeout; set the rest in profile.yaml)
    properties:
      blocksize:
        type: integer
        minimum: 0
        maximum: 255
        description: Flow-control BlockSize (one byte; 0 = send every consecutive frame).
      rx_flowcontrol_timeout:
        type: integer
        minimum: 0
        description: ms to wait for a flow-control frame.
      rx_consecutive_frame_timeout:
        type: integer
        minimum: 0
        description: ms to wait for the next consecutive frame.

  # Some modules (a Smart Key Module, say) power their CAN transceiver only briefly: they answer
  # one request and sleep again within a second or two, so a single 10 01 races the sleep timer.
  # This block declares the ritual that wakes the ECU, honoured by `session <ECU> --wake` and by
  # any read that opts in, on every transport. Absent: the default single 10 01.
  wake:
    type: object
    description: How to wake an ECU that falls asleep quickly, before reads.
    required: [method]
    additionalProperties: false
    properties:
      method:
        enum: [rapid_read, session, relay]
        description: >-
          rapid_read: send prime_pid back to back to hold the transceiver awake, then open a
          session. session: one 10 01 and a session (the default; documentary). relay: rapid_read,
          then close a power relay through the ECU's iocontrol: block (the Ioniq SKM ACC/IGN
          procedure); needs the skm_wakeup quirk.
      prime_pid:
        type: string
        description: >-
          A cheap, complete request, service byte first (22B003, 1001, 3E00; default 1001).
      attempts:
        type: integer
        minimum: 1
        description: How many prime requests to send (default 6).
      interval_ms:
        type: integer
        minimum: 0
        description: Gap between prime requests in ms, shorter than the sleep timer (default 60).
      sleep_timer_ms:
        type: integer
        minimum: 0
        description: How long the ECU stays awake after a frame, in ms (informational).
      session_mode:
        type: string
        description: The 0x10 sub-function to enter after waking (default "03", UDS extended).
      notes:
        $ref: "#/definitions/notes"

  # Keys are the 0x10 sub-function in hex without the 0x10, quoted so an all-digit key keeps its
  # hex meaning: UDS 01 (default), 02 (programming, never probed), 03 (extended); KWP2000 81
  # (standard), 83 (extended), 85 (programming, never probed). Only the read-only sessions are
  # probed.
  sessions:
    type: object
    description: >-
      The diagnostic sessions (service 0x10) this ECU supports, as `canair scan sessions` found
      them, keyed by sub-function ("03", "81").
    propertyNames:
      pattern: "^[0-9A-Fa-f]{1,2}$"
      patternErrorMessage: >-
        a session key is the 0x10 sub-function as 1-2 hex digits (e.g. '03' or '81')
    additionalProperties:
      $ref: "#/definitions/session_entry"

  session_entry:
    type: object
    x-warn: [additionalProperties]
    additionalProperties: false
    properties:
      name:
        type: string
        description: The session's name (standardDiagnosticSession).
      supported:
        type: boolean
        description: The ECU answered 50 xx.
      nrc:
        type: integer
        description: The negative response code of an unsupported session.
      nrc_desc:
        type: string
        description: The NRC's name (subFunctionNotSupported).
      response:
        type: string
        description: The positive response, in hex.
      vehicle_states:
        $ref: "#/definitions/vehicle_states"
      date:
        type: string
        description: When it was probed (YYYY-MM-DD).
      verified:
        $ref: "#/definitions/verified"
      notes:
        $ref: "#/definitions/notes"
    if:
      required: [supported]
      properties:
        supported:
          const: true
    then:
      properties:
        nrc:
          type: "null"
          errorMessage: a supported session must not also carry an nrc

  scan_log_entry:
    type: object
    x-warn: [additionalProperties]
    additionalProperties: false
    properties:
      service:
        type: integer
        description: The service probed (0x22).
      range:
        type: string
        description: The identifiers probed ("0101-010F").
      date:
        type: string
        description: When (YYYY-MM-DD).
      hits:
        type: [integer, string]
        description: How many identifiers answered.
      probes:
        type: integer
        description: How many requests were sent.
      vehicle_states:
        $ref: "#/definitions/vehicle_states"
      notes:
        $ref: "#/definitions/notes"

  # Keys are the SAE code without the -FTB suffix (B2915, not B2915-00); `validate pids` warns
  # about a key that is neither a code nor a shared field. canair works out the structure of a
  # code itself (category, generic or manufacturer, the failure-type byte); this section supplies
  # the meanings it cannot. profile.yaml may hold a dtcs: of the same shape for codes that mean
  # the same on every ECU (checked against this definition too); an ECU's own entry wins.
  dtcs:
    type: object
    description: >-
      Manufacturer DTC meanings, keyed by code (B2915). source, source_links and verified may also
      sit here, next to the codes, stated once for every entry.
    properties:
      source:
        $ref: "#/definitions/source"
      source_links:
        $ref: "#/definitions/source_links"
      verified:
        $ref: "#/definitions/verified"
    additionalProperties:
      $ref: "#/definitions/dtc_entry"

  dtc_entry:
    type: object
    x-warn: [additionalProperties]
    additionalProperties: false
    properties:
      description:
        type: string
        description: What the code means on this ECU.
      causes:
        type: string
        description: What sets it.
      source:
        $ref: "#/definitions/source"
      source_links:
        $ref: "#/definitions/source_links"
      verified:
        $ref: "#/definitions/verified"
      notes:
        $ref: "#/definitions/notes"

  pid:
    type: object
    x-warn: [additionalProperties]
    required: [status]
    additionalProperties: false
    properties:
      status:
        enum: [active, draft, static, slow, ignored]
        description: >-
          The PID's lifecycle, explicit on every PID. active: real and live; read, swept and
          shipped to the device. draft: a placeholder or speculative work; read and swept, not
          shipped. static: an unchanging identity or calibration block; read, skipped in a bare-ECU
          sweep (--include-static), not shipped. slow: live but changes too rarely to poll every
          cycle; shipped at its own long period (required), skipped in a bare-ECU sweep. ignored: a
          dead DID (an NRC, no decodable data), kept as a record and excluded from all tooling.
          Confidence is a separate, per-signal field (verified).
      period:
        type: integer
        minimum: 0
        description: >-
          Polling interval in ms (default 5000). Not 0: the firmware reads 0 as unset and
          substitutes a default.
      variable_length:
        type: boolean
        description: >-
          The PID legitimately answers with a varying length (the ECU fills a different number of
          records), so a short reply is not a truncated read. canair then never asks an ELM327 for
          a frame count for it.
      response_frames:
        type: integer
        minimum: 1
        description: >-
          How many CAN frames the positive response takes, measured live (never inferred from
          stored payloads), so an ELM327 can be told how many to wait for. Kept up to date by the
          live commands; edit with `canair pids set-response-frames`.
      support_map:
        description: >-
          The PID's data starts with a constant support map marking which of the data that follows
          are real signals. Only the layout is stored; the map bytes are read from each payload.
          Found by `canair investigate ECU --support-map`, written by `canair pids
          set-support-map`, read by `canair coverage`; checked by src/canair/uds/support_map.py.
        properties:
          at:
            description: Data offset of the map, counted after the SID and the DID echo.
          length:
            description: Bytes in the map.
          unit:
            description: >-
              bit: one map bit per data bit. byte: one per data byte. field: one per signal of the
              record, whatever its width (the service-21 pages).
          order:
            description: msb (map bit 7 first), or lsb (field only).
          also_at:
            description: >-
              Field only: data offsets of the further maps a record of more than 8 * length
              signals carries.
      snapshot_only:
        type: boolean
        description: >-
          The ECU serves this DID only inside a DTC snapshot (a live 22 read draws an NRC). Defined
          so `canair dtc` can decode the snapshot; never polled in a bare-ECU sweep and never
          shipped. Only on a service-22 PID. Edit with `canair pids set-snapshot-only`.
      snapshot_length:
        type: integer
        minimum: 1
        description: >-
          The DID's data length in a snapshot record, needed to split a record of several DIDs
          (`canair pids set-snapshot-only --length N`).
      sensitive:
        type: boolean
        description: >-
          The reply identifies the car or its owner, like a VIN. Masked on screen (`read --reveal`
          shows it), never saved to captures/, and left out of contribute, the blind strip, the
          docs explorer and the AutoPID export. Set with `canair pids set-sensitive`.
      vehicle_states:
        $ref: "#/definitions/vehicle_states"
        description: The power states in which this PID answers.
      notes:
        $ref: "#/definitions/notes"
        description: About the page. Not inherited by its signals.
      unit:
        $ref: "#/definitions/unit"
      min:
        $ref: "#/definitions/bound"
      max:
        $ref: "#/definitions/bound"
      verified:
        $ref: "#/definitions/verified"
      source:
        $ref: "#/definitions/source"
      source_links:
        $ref: "#/definitions/source_links"
      revisions:
        description: >-
          The ECU revisions this PID applies to (absent: all). A signal's own revisions must be
          among its PID's.
      per_revision:
        description: >-
          {revision: {field: value}}: what differs on that revision (period, response_frames,
          verified, notes, source, source_links). The PID's own fields speak for its reference
          revision, the first it applies to.
      parameters:
        type: object
        description: The PID's signals, keyed by name.
        additionalProperties:
          $ref: "#/definitions/signal"
      enabled:
        deprecationMessage: >-
          use status: draft (a signal states ship: false instead); run
          scripts/migrate_states_status.py
      ignored:
        deprecationMessage: "use status: ignored (run scripts/migrate_states_status.py)"
      static:
        deprecationMessage: "use status: static (run scripts/migrate_states_status.py)"
      availability:
        deprecationMessage: renamed to vehicle_states (run scripts/migrate_states_status.py)
      ha_class:
        deprecationMessage: retired in favour of category (run canair pids migrate-categories)
    allOf:
      - if:
          required: [status]
          properties:
            status:
              const: slow
        then:
          required: [period]
          errorMessage: >-
            status 'slow' needs an explicit period: without one the device polls it every 5 s,
            which is what 'slow' exists to avoid (canair pids set-pid-period)
      - if:
          required: [variable_length]
          properties:
            variable_length:
              const: true
        then:
          properties:
            response_frames:
              not: {}
              errorMessage: >-
                cannot be set with variable_length: true (a variable-length response has no fixed
                frame count)

  # A signal is a numeric scalar by default. `type:` (with its companion map) adds a typed reading
  # alongside: the expression still yields the raw value the device ships and analysis uses, and
  # the typed layer (src/canair/expression/decode_value.py) interprets it for display.
  signal:
    type: object
    x-warn: [additionalProperties]
    required: [expression]
    additionalProperties: false
    properties:
      expression:
        type: string
        description: >-
          The WiCAN formula. Bnn counts the ISO-TP PCI bytes: confirm an offset with `canair bix`.
      unit:
        $ref: "#/definitions/unit"
      min:
        $ref: "#/definitions/bound"
      max:
        $ref: "#/definitions/bound"
      verified:
        $ref: "#/definitions/verified"
      source:
        $ref: "#/definitions/source"
      source_links:
        $ref: "#/definitions/source_links"
      notes:
        $ref: "#/definitions/notes"
        description: About this signal. A PID's notes are not inherited.
      category:
        description: >-
          What the signal measures, stated only where its unit does not say it (a % that is a
          state of charge, a bit that is a door). A binary category (door, lock, lamp) names the
          thing, and a two-state type: enum says which value is which. Never inherited. The
          vocabulary is src/canair/ecus/signal_category.py.
      mqtt_topic:
        type: string
        description: Legacy bare name that no code reads; see send_to.
      send_to:
        type: string
        description: >-
          The full MQTT topic the WiCAN publishes this signal to on every poll, apart from the
          AutoPID batch. Unique across shipped signals; no wildcards, no leading or trailing '/'.
      ship:
        type: boolean
        description: >-
          false keeps the signal out of the device profile; it is still polled, decoded and
          captured. A signal ships only when its PID is active or slow (and not snapshot_only),
          it is not ship: false, not sensitive, and verified (unless `wican autopid write
          --include-unverified`). Edit with `canair pids upsert-param --no-ship`.
      display:
        type: string
        description: How to show the value.
      sensitive:
        type: boolean
        description: >-
          The value is masked, never saved or shared (a PID's sensitive covers all its signals).
      type:
        enum: [numeric, enum, bitmask, ascii, date, bcd, struct]
        description: >-
          numeric (default): the expression's value. enum: a mode, named by values:. bitmask:
          flags, named by bits:. ascii: the bytes as text. date: a date (BCD or binary). bcd: a
          binary-coded decimal. struct: typed sub-fields:.
      values:
        type: object
        description: "type: enum: {raw value: label}."
        propertyNames:
          pattern: "^-?[0-9]+$"
          patternErrorMessage: an enum value must be an integer
      bits:
        type: object
        description: "type: bitmask: {bit index: label}, 0 = LSB."
        propertyNames:
          pattern: "^([0-9]|[1-5][0-9]|6[0-3])$"
          patternErrorMessage: a bit index must be an integer 0-63
      fields:
        type: array
        description: "type: struct: [{name, type, expression, values/bits}, ...]."
        items:
          type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
      revisions:
        description: >-
          The ECU revisions this signal applies to (absent: its PID's). Two PIDs may ship one
          signal name only when their revisions do not overlap.
      per_revision:
        description: >-
          {revision: {field: value}}: what differs on that revision (expression, unit, min, max,
          type, values, bits, fields, verified, notes, source, source_links). Another revision
          than the reference is unverified unless it says otherwise.
      enabled:
        deprecationMessage: "renamed to ship (enabled: false is now ship: false)"
      ha_class:
        deprecationMessage: retired in favour of category (run canair pids migrate-categories)
    allOf:
      - if:
          required: [type]
          properties:
            type:
              const: enum
        then:
          required: [values]
          errorMessage: "type: enum needs a values: map of raw value -> label"
        else:
          properties:
            values:
              not: {}
              errorMessage: "is only valid with type: enum"
      - if:
          required: [type]
          properties:
            type:
              const: bitmask
        then:
          required: [bits]
          errorMessage: "type: bitmask needs a bits: map of bit index -> label"
        else:
          properties:
            bits:
              not: {}
              errorMessage: "is only valid with type: bitmask"
      - if:
          required: [type]
          properties:
            type:
              const: struct
        then:
          required: [fields]
          errorMessage: "type: struct needs a fields: list"
        else:
          properties:
            fields:
              not: {}
              errorMessage: "is only valid with type: struct"

  # UDS control types appended to 2F<DID>: 03 shortTermAdjustment (on), 00 returnControlToECU
  # (off, release). KWP2000 0x30 is 30 <LID> <option> [state...]; ISO 14230-3 leaves the option
  # byte to the maker, and 00 is not a release everywhere, so a KWP2000 entry declares its release
  # (`canair io` refuses its on without one).
  iocontrol_entry:
    type: object
    x-warn: [additionalProperties]
    additionalProperties: false
    properties:
      label:
        type: string
        description: Human-readable name.
      verified:
        $ref: "#/definitions/verified"
      "on":
        type: string
        description: >-
          The full request that turns it on ("2FBC0103"). Quote the key: YAML 1.1 reads a bare on
          as true.
      "off":
        type: string
        description: The full request that turns it off ("2FBC0100"). Quote the key.
      "true":
        deprecationMessage: >-
          an on request under a key canair reads as true (a bare on, or true): write the key as "on"
      "false":
        deprecationMessage: >-
          an off request under a key canair reads as false (a bare off, or false): write the key
          as "off"
      release:
        type: string
        errorMessage: must be a quoted hex request
        description: >-
          The request that hands the output back to the ECU, sent on exit, on Ctrl+C and by
          --poll. UDS implies 2F<DID>00; KWP2000 0x30 has no standard one.
      enable_mask:
        type: string
        errorMessage: must be quoted hex
        description: >-
          UDS only: the controlEnableMaskRecord a packeted DID's requests end with, when its maker
          uses the mask (ISO 14229-1 12.2.2). The implied release then ends with FF per mask byte.
      notes:
        $ref: "#/definitions/notes"
      session:
        type: boolean
        description: Open a diagnostic session first (default true).
      session_mode:
        $ref: "#/definitions/hex_byte"
        description: >-
          The session's sub-function, quoted hex (default "03"; Nissan "C0" needs the
          nissan_c0_session quirk).
      hold:
        type: boolean
        description: Needs --hold to stay active (default true).
      vehicle_states:
        $ref: "#/definitions/vehicle_states"
      status_param:
        type: string
        description: "A signal of this ECU's pids: to read as the actuator's status."
      availability:
        deprecationMessage: renamed to vehicle_states (run scripts/migrate_states_status.py)

  # A scanner hit (routines:, iocontrol_discoveries:): exactly one of response and nrc is set.
  hit:
    type: object
    x-warn: [additionalProperties]
    additionalProperties: false
    properties:
      session:
        enum: [default, extended]
        description: The session the probe ran in.
      response:
        type: string
        description: The positive response, in hex.
      nrc:
        type: integer
        description: The negative response code, for a hit the NRC reveals.
      nrc_desc:
        type: string
        description: The NRC's name.
      label:
        type: string
        description: A name, added as research proceeds.
      verified:
        $ref: "#/definitions/verified"
      notes:
        $ref: "#/definitions/notes"

  research_entry:
    type: object
    x-warn: [additionalProperties]
    required: [type, target, status]
    additionalProperties: false
    properties:
      type:
        enum: [scan, decode, verify, iocontrol_scan]
        description: >-
          scan: a range not yet scanned. decode: a captured payload not yet decoded. verify: a
          signal not yet checked on the car. iocontrol_scan: an IOControl (2F) discovery scan.
      target:
        type: string
        description: The PID, DID range or scan the task concerns ("22 E001-E010").
      status:
        enum: [pending, captured, nrc, done]
      priority:
        enum: [P1, P2, P3]
        description: P1 = high value, P2 = medium, P3 = speculative.
      vehicle_states:
        $ref: "#/definitions/vehicle_states"
        description: The power states the task needs.
      revisions:
        description: >-
          The ECU revisions it concerns (absent: all); a car on another revision does not list it.
      created:
        type: string
        description: Set to today when the entry is added (YYYY-MM-DD).
      updated:
        type: string
        description: Set to today when the entry is added and when its status changes.
      date:
        type: string
        description: When it was last tested.
      result:
        type: string
        description: A short summary of the outcome.
      notes:
        $ref: "#/definitions/notes"
        description: Details, and what to look for.
      sources:
        type: array
        description: Cross-references (URLs, files).
      what_to_test:
        type: array
        description: Specific things to check.
      capture_protocol:
        type: string
        description: How to capture the data needed to decode it.
      prerequisite:
        deprecationMessage: renamed to vehicle_states (run scripts/migrate_states_status.py)
