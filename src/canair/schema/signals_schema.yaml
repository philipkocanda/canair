# yaml-language-server: $schema=http://json-schema.org/draft-07/schema#
# Broadcast signal maps: profiles/<name>/signals/<bus>.yaml
#
# The domain-B analogue of a PID's `parameters:`, for periodic broadcast CAN frames. Where a
# diagnostic PID uses a freeform WiCAN `expression` over Bnn byte indices, a broadcast signal
# uses a DBC-compatible linear model (physical = raw * scale + offset) over a contiguous bit
# range, so it round-trips to and from DBC (`canair import dbc` / `canair export dbc`). One file
# per CAN bus (e.g. signals/powertrain.yaml), keyed by arbitration ID, not by ECU: a broadcast ID
# is not a diagnostic request/response pair. Edit with `canair signals`, never by hand.
#
# `canair validate signals` checks every file against this schema
# (src/canair/core/json_schema.py). The frame-layout rules a schema cannot state are in
# src/canair/validation/signals.py: an 11-bit frame id above 0x7FF, a classic frame over 8 bytes,
# and a declared length shorter than its signals need. One file keys messages by number alone,
# so a standard and an extended frame with the same number cannot share a bus file (`import dbc`
# refuses such a DBC). The field order of SIGNAL_FIELDS and MESSAGE_FIELDS in that module is the
# order the editor writes; tests/validation/test_signals_schema.py pins this file to them.

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://philipkocanda.github.io/canair/schema/signals.json"
title: canair signals/<bus>.yaml
description: Broadcast signal map of one CAN bus, keyed by arbitration ID.
type: object
additionalProperties: false
properties:
  bus:
    type: string
    description: Logical bus name (powertrain, body, chassis).
  bitrate:
    type: integer
    exclusiveMinimum: 0
    description: Bus bitrate in bit/s (e.g. 500000).
  messages:
    type: [object, "null"]
    description: Messages keyed by arbitration ID, a hex string such as "0x220".
    propertyNames:
      pattern: "^0x0*(1[0-9A-Fa-f]{7}|[0-9A-Fa-f]{1,7})$"
      patternErrorMessage: >-
        must be a hex arbitration ID of at most 29 bits (0x0-0x1FFFFFFF), e.g. 0x220
    additionalProperties:
      $ref: "#/definitions/message"

definitions:
  message:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        description: Message name (DBC BO_ name).
      tx_ecu:
        type: string
        description: Transmitting ECU, as an annotation (not a request TX).
      length:
        enum: [0, 1, 2, 3, 4, 5, 6, 7, 8, 12, 16, 20, 24, 32, 48, 64]
        errorMessage: must be 0-8 bytes, or a CAN FD size (12, 16, 20, 24, 32, 48 or 64)
        description: >-
          Data length in bytes (DBC BO_ DLC); it must hold every signal. `export dbc` falls back
          to the smallest one that does.
      extended:
        type: boolean
        description: >-
          29-bit frame. Default: true above 0x7FF. Stored only when it differs (an extended frame
          numbered 0x7FF or below).
      fd:
        type: boolean
        description: >-
          CAN FD frame. Default: true above 8 bytes. Stored only when it differs (an FD frame of 8
          bytes or fewer).
      signals:
        type: [object, "null"]
        description: Signals keyed by name.
        additionalProperties:
          $ref: "#/definitions/signal"

  signal:
    type: object
    required: [start_bit, length]
    additionalProperties: false
    properties:
      start_bit:
        type: integer
        minimum: 0
        description: >-
          Bit offset, in DBC numbering: the LSB for little-endian, the MSB for big-endian (bit 7
          of byte 0 is 7, so a 16-bit field in bytes 0-1 is 7|16@0).
      length:
        type: integer
        minimum: 1
        description: Bit length.
      byte_order:
        enum: [little, big]
        description: little or big (DBC @1 / @0); default little.
      signed:
        type: boolean
        description: Two's-complement raw value (DBC @0- / @1-); default false.
      float:
        type: boolean
        description: IEEE 754 raw value (DBC SIG_VALTYPE_); the length must be 32 or 64.
      scale:
        type: number
        allOf:
          - not: {const: 0}
            errorMessage: must not be 0 (every raw value would read the same)
        description: physical = raw * scale + offset; default 1.
      offset:
        type: number
        description: Default 0.
      min:
        type: number
      max:
        type: number
      unit:
        type: string
      type:
        enum: [numeric, enum, bitmask, ascii, date, bcd]
        description: >-
          Typed decoding, as for a diagnostic PID signal (src/canair/expression/decode_value.py).
          The linear scale/offset still gives the raw value the typed layer interprets.
      values:
        type: object
        description: "enum only: {raw_int: label}. Quote on/off/yes/no labels."
        propertyNames:
          pattern: "^-?[0-9]+$"
          patternErrorMessage: must be an integer
        additionalProperties:
          type: string
      bits:
        type: object
        description: "bitmask only: {bit_index: label}, 0 = LSB, 0-63. Quote on/off/yes/no labels."
        propertyNames:
          pattern: "^0*([0-9]|[1-5][0-9]|6[0-3])$"
          patternErrorMessage: must be a bit index from 0 to 63
        additionalProperties:
          type: string
      verified:
        type: boolean
        description: Confirmed on this car (default false).
      source:
        type: string
        description: Provenance (DBC, log file, reverse-engineering evidence).
      notes:
        type: string
    allOf:
      - if: {required: [float], properties: {float: {const: true}}}
        then:
          properties:
            length:
              enum: [32, 64]
              errorMessage: a float signal must be 32 or 64 bits long
      - if: {required: [type], properties: {type: {const: enum}}}
        then:
          required: [values]
          errorMessage: "type 'enum' requires a 'values:' map"
      - if: {required: [type], properties: {type: {const: bitmask}}}
        then:
          required: [bits]
          errorMessage: "type 'bitmask' requires a 'bits:' map"
      - if: {required: [values]}
        then:
          required: [type]
          properties:
            type: {const: enum, errorMessage: "'values' is only valid with type 'enum'"}
          errorMessage: "'values' is only valid with type 'enum'"
      - if: {required: [bits]}
        then:
          required: [type]
          properties:
            type: {const: bitmask, errorMessage: "'bits' is only valid with type 'bitmask'"}
          errorMessage: "'bits' is only valid with type 'bitmask'"
