# yaml-language-server: $schema=http://json-schema.org/draft-07/schema#
# Vehicle states: the optional profiles/<name>/vehicle_states.yaml
#
# `canair validate states` checks the file against this schema
# (src/canair/core/json_schema.py), then checks what a schema cannot: duplicate names, predicate
# syntax, the `implies:`/`excludes:` rules below and the ECU.PARAM references
# (src/canair/validation/other.py::check_states).
#
# vehicle_states.yaml declares a profile's canonical, ordered vehicle operating states.
# The `vehicle_states` field on a capture session should draw from these names
# (soft — free text is still accepted, but `canair validate captures` warns on
# values outside this vocabulary). Each state may carry a `when:` predicate used
# to auto-suggest the state from decoded PID values (see src/canair/states/__init__.py).
#
# Top-level structure:
#   states:                 # ordered list; order is display order, not priority —
#                           # specificity comes from `implies:` below, and file
#                           # order only tie-breaks states unrelated in it
#     - name: str           # required — the state name (e.g. "READY", "CHARGING")
#       description: str    # optional — human-readable explanation
#       implies: [str]      # optional — broader states this one specializes
#       excludes: [str]     # optional — states that cannot hold at the same instant
#       when: str           # optional — boolean predicate over ECU.PARAM values
#                           # (every matching predicate contributes: a session is
#                           # naturally composite, e.g. "READY, PARKED")
#
# Specificity hierarchy (`implies:`) — several predicates are true at once BY
# DESIGN: driving a running EV is genuinely both READY and DRIVING. `implies:`
# names the broader states a state specializes (`DRIVING implies [READY]`), so a
# view that must name ONE state names the specific one (src/canair/states/__init__.py
# ::most_specific_states, used by `suggest_state` and the monitor status bar). It
# is NOT a priority number: it encodes entailment, so it needs no renumbering when
# a state is added and it is machine-checkable. Rules, all enforced by
# `canair validate states` and by the `canair states` editor's post-write check:
#   * every target must be a DECLARED state (a typo is an error, not a no-op)
#   * a state may not imply itself, and the graph must be ACYCLIC
#   * the ALL meta-token may neither imply nor be implied — it means "readable in
#     every state", not a state to specialize
# The hierarchy narrows only the SINGLE-state answer. A recorded capture keeps
# every state it was in (`suggest_states`), because a session that was READY and
# DRIVING really was both and a `--state READY` query must still find it.
#
# Exclusivity (`excludes:`) — the complement of `implies:`. Where `implies:`
# explains why an overlap is legitimate, `excludes:` names the overlaps that
# cannot be real at one instant: a car is not DRIVING and PARKED together, nor
# CHARGING and DRIVING. The relation is SYMMETRIC — declare it on either side.
# It buys two checks that are otherwise impossible:
#   * a *recording* tagged with an exclusive pair spans time, so its captures
#     need a `state_spans` timeline before a `--state` filter or a state-axis
#     bucket means anything — `canair validate captures` warns when one lacks it
#   * a *live* suggestion of an exclusive pair means a `when:` predicate matches
#     when it should not — a definition bug, surfaced instead of averaged away
# Declaring the pair is what separates those from an honestly simultaneous
# `READY, PARKED`, so the warning stays specific rather than firing on every
# multi-state session. Rules, enforced by `canair validate states`, the `canair
# states` editor's post-write check, and `load_states` itself:
#   * every target must be a DECLARED state; no self-exclusion; not ALL
#   * a pair may not be both excluded and implied (`A implies B` says B always
#     holds when A does; `A excludes B` says it never can — one is wrong)
#
# State names are an UPPERCASE controlled vocabulary (like the CAN-bus segment
# codes in can_buses.yaml). Input is normalized to uppercase, so any casing
# works on the CLI. Inspect/edit with `canair states`.
#
# Predicate grammar (whitelisted AST; no function calls / attribute access beyond
# dotted ECU.PARAM names). Evaluated with three-valued (Kleene) logic — a
# predicate depending on a not-polled parameter abstains (UNKNOWN) rather than
# reading false, so a partial read still resolves the states it can determine:
#   ECU.PARAM               decoded parameter value (e.g. BMS.BATTERY_CURRENT)
#   and / or / not          boolean composition
#   == != < <= > >=         comparisons
#   numbers / 'strings'     literals
#   __no_response__         true when no ECU responded (deep sleep / off);
#                           UNKNOWN offline (a stored capture is itself a response)
#   __responded__           true when at least one ECU responded (UNKNOWN offline)
#
# ECU.PARAM references are RESOLVED against the profile's ecus/ registry by
# `canair validate states` (src/canair/states/refs.py) — a predicate naming a signal
# that doesn't exist can never match, and Kleene logic makes that silent (a
# missing signal is UNKNOWN exactly like a not-polled one). A reference must
# match how the decoded value map is keyed: UPPERCASE canonical ECU short name
# (not an alias), the `parameters:` key verbatim (case-sensitive), on a PID that
# isn't `status: ignored`, and decoding to a NUMBER (ascii/date/struct render as
# text and never reach a predicate).
#
# Base vocabulary (the make-neutral ignition ladder baked into the tool;
# profiles add EV/vendor/composite states in vehicle_states.yaml):
#   SLEEP, ACC, RUN, CRANK   (POWER_STATES in src/canair/states/__init__.py)
# Plus the meta-token ALL — "applicable/readable in every state" (documentary,
# the state analogue of the ALL CAN-bus code). The bundled Ioniq profile, for
# example, adds PLUGGED/ON/READY/CHARGING/IG3/TOPUP/PARKED/DRIVING.

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://philipkocanda.github.io/canair/schema/vehicle_states.json"
title: canair vehicle_states.yaml
description: The profile's vehicle-state vocabulary, in display order.
type: object
required: [states]
additionalProperties: false
properties:
  states:
    type: array
    description: Ordered list of states; order is display order, not priority.
    items:
      $ref: "#/definitions/state"

definitions:
  state_names:
    type: [string, array]
    description: State names, as a list or one comma-separated string.
    items:
      type: string

  state:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: "\\S"
        patternErrorMessage: must not be blank
        description: The state name, UPPERCASE (e.g. READY, CHARGING).
      description:
        type: string
        description: Human-readable explanation.
      implies:
        $ref: "#/definitions/state_names"
        description: Broader states this one specializes.
      excludes:
        $ref: "#/definitions/state_names"
        description: States that cannot hold at the same instant.
      when:
        type: string
        description: Boolean predicate over ECU.PARAM values that auto-suggests the state.
